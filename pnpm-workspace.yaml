packages:
  - "packages/*"
  - "apps/*"
# pnpm 11 reads settings here (no longer from .npmrc or the package.json "pnpm" field).
# Build-script approval: pnpm 11 uses the allowBuilds map below (package -> true/false).
# The older onlyBuiltDependencies list is parsed but NO LONGER authorizes builds on its own —
# without allowBuilds, a fresh install exits 1 with ERR_PNPM_IGNORED_BUILDS.
verifyDepsBeforeRun: false
autoInstallPeers: true
strictPeerDependencies: false
allowBuilds:
  better-sqlite3: true
  # DENIED, and the failure it silences is a real one that never mattered.
  # Every install printed:
  #
  #   .../cpu-features install: Error: Unable to detect compiler type
  #   .../cpu-features install: Failed
  #
  # `cpu-features` is an OPTIONAL dependency of ssh2 (<- docker-modem <-
  # dockerode <- testcontainers, a dev dependency). It is a native CPU-feature
  # detector ssh2 uses to pick a crypto implementation; without it ssh2 falls
  # back to pure JS, and nothing here talks SSH anyway — testcontainers reaches
  # dockerode over the docker socket. So the build was attempted, failed on
  # images with no C compiler, and cost nothing but a red "Failed" in every
  # green log. That is the expensive part: a failure people learn to scroll
  # past is how a real one gets missed.
  #
  # `false` rather than deletion, because pnpm 11 treats an absent entry as
  # "not yet decided" and an explicit false as decided — and a decision with
  # its reason attached is the thing a list like this is for.
  cpu-features: false
  esbuild: true
  libxmljs2: true
  protobufjs: true
  ssh2: true
catalog:
  drizzle-orm: ^0.45.2
  pg: ^8.23.0
  "@types/pg": ^8.23.1
overrides:
  semver: ^7.5.2
  ws: ">=8.21.0"
  socket.io-client: ^4.8.0
  engine.io-client: ^6.6.0
  "@opentelemetry/core": ">=2.8.0"
  cookie: ">=0.7.0"
  # Security overrides (transitive CVEs surfaced by Trivy → code-scanning + pnpm audit):
  #   engine.io  GHSA-r635-g3xr-vw7x (HIGH, prod via @trigger.dev → socket.io)
  #   brace-expansion GHSA-3jxr-9vmj-r5cp (HIGH, dev/CI: testcontainers, cyclonedx, eslint) — scoped per major
  #   body-parser GHSA-v422-hmwv-36x6 (LOW, prod via express)
  # esbuild GHSA-67mh-4wv8-2f99 IS pinned, below, with the 2026-09-09 entries. It was left unpinned
  # for a while on the reasoning that it was dev-only and the bump looked risky; that reasoning was
  # retired on 2026-09-09 — see the note down there for what was actually measured.
  body-parser@<1.20.6: ^1.20.6
  brace-expansion@<1.1.16: ^1.1.16
  brace-expansion@>=2.0.0 <2.1.4: ^2.1.4
  brace-expansion@>=4.0.0 <5.0.9: ^5.0.9
  engine.io@>=4.1.0 <6.6.7: ^6.6.7
  # 2026-08-04 sweep. Scoped per major, like the entries above, so a package
  # that legitimately wants a different line is not forced off it.
  #
  # socket.io-parser is PRODUCTION, and the only one here that is: it arrives
  # through @trigger.dev/sdk -> @trigger.dev/core, runtime dependencies of the
  # managed worker. Same path as the engine.io entry above.
  #
  # This comment also named "@openmig/worker's own socket.io" until 2026-08-13.
  # It had one: `socket.io` and `engine.io` were declared in apps/worker's
  # dependencies and imported by NOTHING — `git grep` found zero references
  # outside the manifest. Both are removed; the overrides stay, because the
  # @trigger.dev path is real and is the one that made these PRODUCTION CVEs.
  #   socket.io-parser CVE-2026-69185 (HIGH) zero-attachment memory exhaustion
  #
  # The rest are transitive under DEV tooling (testcontainers, cyclonedx-npm,
  # eslint) and reach no shipped runtime code. Pinned anyway: they are real
  # advisories, they surface in code scanning, and an audit whose noise is
  # tolerated is an audit nobody reads.
  #   fast-uri   host confusion via backslash authority
  #   ip-address leading-zero octets decoded as decimal
  #   tar        uncontrolled recursion in mapHas/filesFilter
  #   undici     five advisories, one fix (>=8.9.0)
  fast-uri@<3.1.6: ^3.1.6
  ip-address@<10.3.1: ^10.3.1
  socket.io-parser@>=4.0.0 <4.2.7: ^4.2.7
  tar@<7.5.21: ^7.5.21
  undici@>=8.0.0 <8.9.0: ^8.9.0
  # 2026-08-08. nanoid, two advisories with two different fix floors on the 3.x
  # line — 3.3.16 for one and 3.3.17 for the other, so ONE bound is not enough
  # unless it is the higher one. Both tree copies were below it:
  #   3.3.8  PRODUCTION, via @trigger.dev/core (worker + scheduler runtime)
  #   3.3.16 dev-only, via postcss -> vite/autoprefixer — already past the first
  #          floor, still short of the second, which is exactly the case a
  #          single "fixed in 3.3.16" reading would have missed.
  #   CVE-2026-67214 (HIGH) infinite loop  — fixed 3.3.16 / 5.1.16
  #   CVE-2026-67213 (HIGH)                — fixed 3.3.17 / 5.1.6
  # <3.3.17 therefore satisfies both. No 5.x is in the tree; nothing to scope.
  nanoid@<3.3.17: ^3.3.17
  # 2026-09-03. qs, two MEDIUM advisories with one fix floor, surfaced by Trivy
  # as code-scanning alerts #20 and #21 on main.
  #   CVE-2026-82417  qs.stringify throws a TypeError while serializing
  #   CVE-2026-82562  denial of service via array limit bypass when parsing
  # Both fixed in 6.16.0; the tree carried 6.15.3 in three places.
  #
  # PRODUCTION, and by the shortest possible path: `express` and `body-parser`
  # both depend on it, and the API parses every inbound query string through
  # them — which is precisely what the second advisory is about. (`superagent`
  # is the third holder and is dev-only.) That makes this the same class as the
  # engine.io and socket.io-parser entries above, not the dev-tooling ones.
  #
  # Scoped per major like every entry here: express 5 asks for ^6.14.0, so
  # ^6.16.0 sits inside the range it already accepts and no consumer is forced
  # off its own line.
  qs@<6.16.0: ^6.16.0
  # 2026-09-09. Six HIGH advisories, all DEV-ONLY and all arriving through one
  # package: @cyclonedx/cyclonedx-npm, the SBOM generator this repository runs
  # in security-scan.yml. 6.0.1 is the latest release, so there is no bump to
  # take — a pin is the only route.
  #
  # fast-uri's floor RAISED from 3.1.5 (set 2026-08-04, above) to 3.1.6. Four
  # new advisories landed past the old floor, so the pin that was correct five
  # weeks ago now lets all four through. Reached via ajv <- cyclonedx-library.
  #   host confusion via skipped IDN canonicalization on scheme-relative refs
  #   host confusion via percent-encoded scheme normalization
  #   SSRF via malformed IPv6 normalization
  #   SSRF via repeated hostname percent-decoding
  #
  # js-yaml is NEW here. Reached via xmlbuilder2 <- cyclonedx-library. Two
  # advisories, two floors, and the higher one covers both — the same shape as
  # the nanoid entry above, and the same trap: reading only the first would
  # have stopped at 4.3.1 and left the second one live.
  #   CVE-2026-59870  quadratic CPU in !!omap resolution   fixed 4.3.1
  #   maxTotalMergeKeys does not bound empty merge sources fixed 4.3.2
  #
  # One version of each is in the tree (fast-uri 3.1.5, js-yaml 4.3.0), so
  # neither needs the per-major scoping the entries above use.
  js-yaml@<4.3.2: ^4.3.2
  #
  # esbuild GHSA-67mh-4wv8-2f99, and the reasoning that used to keep it out of this file.
  #
  # It was previously left unpinned as "MODERATE, and dev-only anyway". Two things retired that.
  # The owner's rule is that a vulnerability is not more acceptable for living in dev tooling —
  # this repository is public, so the dev tree is as readable as the shipped one. And the risk the
  # old note asserted was never measured, only assumed.
  #
  # Measured on 2026-09-09. Only one of the three esbuild copies in the tree was affected: 0.18.20,
  # held by `~0.18.20` inside drizzle-kit's deprecated @esbuild-kit/core-utils loader, with
  # drizzle-kit 0.31.10 itself the latest, so no upstream fix existed to take. `pnpm audit` names
  # the fix ">=0.24.3" and NO SUCH RELEASE EXISTS — esbuild goes 0.24.2 -> 0.25.0 — so the floor is
  # 0.25.0 and the bump is a minor, not a patch.
  #
  # So the loader was forced six minors forward and then EXERCISED, rather than reasoned about:
  # `drizzle-kit check` and `drizzle-kit generate` both read drizzle.config.ts and the whole schema
  # through that loader, and both still pass on 0.25.12 (which the tree already carried for
  # drizzle-kit's own use, so this dedupes rather than adding a version).
  #
  # If a future drizzle-kit does break on it, the failure is loud and immediate — `npx drizzle-kit
  # generate` stops reading the schema at all — which is a far better failure than a known advisory
  # nobody is allowed to fix. Note it is `npx` and not `pnpm db:generate`: that script now refuses
  # (scripts/how-migrations-are-authored.mjs), because generating into the real migration chain is
  # what it used to do.
  esbuild@<0.25.0: ^0.25.0
# A COOLDOWN ON BRAND-NEW RELEASES. Owner's decision, 2026-09-09: three days.
#
# THE UNIT IS MINUTES, NOT DAYS. 4320 = 3 days. Writing `3` here means three MINUTES and
# silently disables the gate — measured from pnpm's own resolver, which computes the cutoff
# as `Date.now() - minimumReleaseAge * 60 * 1000`.
#
# WHY IT EXISTS. A package published in the last few days is the shape a compromised publish
# takes: uploaded, installed by whoever updates that day, yanked within hours once it is
# noticed. Three days puts this repository behind that window without slowing anything else
# down — measured on 2026-09-09 against the whole lockfile, a 3-day floor flags NOTHING that
# is already installed (7 days would have flagged ten packages, 14 days forty-nine).
#
# IT IS NOT ONLY ABOUT NEW VERSIONS. pnpm 11 verifies the WHOLE LOCKFILE against this policy
# on every install, `--frozen-lockfile` included, and exits 1 on a violation
# (ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION). That reaches every CI job and all three
# Dockerfiles. Raising this number is therefore not a quiet tightening: it can turn every
# build red at once. Measure first, the way this value was.
#
# WHAT TO DO WHEN A PULL REQUEST GOES RED ON IT. The error names the package and its publish
# date. Two answers, and the first is usually right:
#
#   1. WAIT. The check only ever gets easier with time — a red pull request goes green on its
#      own within three days, with no code change. Re-run the job. A weekly Dependabot bump
#      almost never needs to land the day it is published.
#   2. TAKE IT ANYWAY, deliberately: add `name@version` to the list below IN THE SAME PULL
#      REQUEST, with a one-line reason. That is what this list is for, and the case it exists
#      for is a security fix — the advisory gate blocks a merge at high and critical
#      (scripts/audit-advisories.mjs), so a fix version has to be installable the day it ships.
#
# HOW ENTRIES ARE WRITTEN, and why the guard is strict about it. Always `name@version`.
# A BARE PACKAGE NAME EXCLUDES THAT PACKAGE FOR EVER, every version, in perpetuity — pnpm
# returns `true` for it and stops checking. A versioned entry expires by itself the moment the
# version is superseded, which is what keeps this list from becoming a set of holes nobody
# remembers opening.
#
# Seven of the fourteen entries here were exactly that kind of fossil on 2026-09-09 — they
# named versions the tree had long since moved past (fast-uri@3.1.6 against an installed
# 3.1.7, body-parser@1.20.6 against 2.3.0, recharts@3.10.0 against 3.10.1, engine.io@6.6.7
# against nothing at all) — and were removed with the gate being switched on.
# `scripts/a-gate-that-was-never-switched-on.unit.test.ts` now holds all of this: that the
# setting exists whenever this list does, that the value is in minutes, that every entry names
# a version the lockfile actually has, and that no entry is a bare name.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - brace-expansion@2.1.4
  - brace-expansion@5.0.9
  - socket.io-parser@4.2.7
  - undici@8.9.0
  - qs@6.16.0
  - js-yaml@4.3.2
  - esbuild@0.25.12
