# Dependency lifecycle management. Detection already runs (security-scan.yml: Trivy + pnpm audit,
# weekly); this opens the weekly version-update PRs, grouped to keep the noise low.
#
# SECURITY UPDATES ARE NOT CONFIGURED HERE. They come from the repository's own setting
# (Settings, Advanced Security: Dependabot alerts and Dependabot security updates), and only
# while it is on. Even then they do not cover a transitive pnpm dependency the lockfile alone
# cannot lift (those take an override in pnpm-workspace.yaml, by hand), nor a name ignored
# below: an ignore applies to security updates too.
#
# WHAT THIS FILE DOES NOT SEE is scripts/idp-pin-watch.mjs's (workplan 0146 T8): every image
# line of deploy/compose's managed.yml, dev.yml and www.yml, the busybox and GoAccess copies in
# its scripts, Trigger.dev, the tasks' Node, `packageManager`, the Trivy the scan runs, the
# cosign images.yml and release.yml name, and the TypeScript split. It runs on Mondays after
# this, and keeps an issue open while one is behind. This file moves cosign-installer, and the
# cosign it installs only while no step names one.
version: 2
updates:
  # npm/pnpm workspace (root manifest + all packages/* and apps/* via the workspace).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    ignore:
      # TypeScript 7 is unusable here, and not as a matter of taste: typescript-eslint
      # hard-throws "does not support TS 7.0" at module load, and its tracking issue
      # (#10940) targets TS >= 7.1 — so no 7.0.x release can ever be taken, and every
      # one Dependabot offers costs a triage it cannot pass. `tsc` itself is fine; the
      # linter is the blocker, and it is waiting on ESLint gaining async parser support.
      # See workplan 0026 row 22 for the evidence and the revisit trigger.
      # INERT TODAY: every `typescript` in the manifests is an `npm:` alias (the two-TypeScript
      # split in AGENTS.md), and Dependabot skips aliased entries, so it offers no TypeScript
      # at all. The pin watch opens "The TypeScript split can go" when typescript-eslint
      # admits a stable 7.1; delete this with the split.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # The Trigger.dev SDK moves with the Trigger.dev image or not at all: the two
      # compose defaults, managed.env.example and every @trigger.dev/* manifest
      # must agree, the bring-up and bootstrap-managed.unit.test.ts refuse when they
      # do not, and an upgrade is a one-way schema migration on the persistent
      # stack. Dependabot moved the SDK alone on 2026-08-24 and every managed run
      # died at the bring-up.
      # deploy/compose/trigger-version.sh moves every one of them. Workplan 0119 T1.
      - dependency-name: "@trigger.dev/*"
    groups:
      # One PR/week for routine minor+patch bumps across dev + prod deps.
      minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)

  # GitHub Actions used across .github/workflows (several are pinned by SHA / tagged).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci(actions)

  # Container images in the Dockerfiles (workplan 0119 T1). Every FROM carries
  # `image:tag@sha256:…`: Dependabot compares tags and moves the digest with the
  # tag, and a bare digest has no version to compare. Minor+patch grouped; a
  # major (a new Node line) is its own PR, because `engines` and CI must follow.
  - package-ecosystem: docker
    directories:
      - "/apps/api"
      - "/apps/web"
      - "/apps/selfhost"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    ignore:
      # The runtime's major moves by hand, with `engines` in package.json and the
      # Node line CI installs, when the next LTS line is current (workplan 0119
      # §2.4). Dependabot's first run offered 26-slim, the Current line, three
      # times in one morning; that is not a decision a green tick may take.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    groups:
      images:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore(images)

  # The visit count's GoAccess (deploy/compose/goaccess/Dockerfile), built on
  # Alpine because upstream's image is on one past its end of life (#1675). An
  # entry of its own, so its pull request carries nothing else: the block
  # above groups minor and patch across its directories, and its pull
  # request's checks build the apps' images, never this one. This pull
  # request's checks build it (.github/workflows/script-images.yml), on arm64
  # as live's daily duty `visits` does from the tag that carries it. A new
  # Alpine line (3.24 to 3.25) is a minor and comes here too: read Alpine's
  # release notes for it before merging.
  - package-ecosystem: docker
    directory: "/deploy/compose/goaccess"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore(goaccess)

  # The self-host stack's images (workplan 0119 T1). Dependabot's compose fetcher
  # reads only the files directly in a directory whose names match
  # `(docker-)?compose(-\w+)?(\.[\w-]+)?\.ya?ml`, so `deploy/compose` is not
  # here: managed.yml, www.yml and dev.yml all miss, the entry covered nothing
  # from 2026-09-06, and it errored every Monday. scripts/idp-pin-watch.mjs
  # compares those images instead, and
  # scripts/a-dependabot-directory-with-nothing-to-read.unit.test.ts holds
  # that every directory listed here has a file Dependabot reads, and that
  # every ignore names an image one of those files runs.
  - package-ecosystem: docker-compose
    directories:
      - "/deploy/selfhost"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    ignore:
      # A major is pg_upgrade, and the owner's decision (0119 §2.1).
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    groups:
      images:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore(images)
