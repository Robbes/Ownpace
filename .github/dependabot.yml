# Dependency lifecycle management. Detection already runs (security-scan.yml: Trivy + pnpm audit,
# weekly); this closes the loop by opening the actual update PRs so transitive CVEs don't accumulate.
# Grouped weekly to keep PR noise low; security updates are ungrouped so they land fast.
version: 2
updates:
  # npm/pnpm workspace (root manifest + all packages/* and apps/* via the workspace).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    ignore:
      # TypeScript 7 is unusable here, and not as a matter of taste: typescript-eslint
      # hard-throws "does not support TS 7.0" at module load, and its tracking issue
      # (#10940) targets TS >= 7.1 — so no 7.0.x release can ever be taken, and every
      # one Dependabot offers costs a triage it cannot pass. `tsc` itself is fine; the
      # linter is the blocker, and it is waiting on ESLint gaining async parser support.
      # See workplan 0026 row 22 for the evidence and the revisit trigger.
      # REMOVE THIS when TypeScript 7.1 ships and typescript-eslint#10940 closes.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      # One PR/week for routine minor+patch bumps across dev + prod deps.
      minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)

  # GitHub Actions used across .github/workflows (several are pinned by SHA / tagged).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci(actions)
