# Dependency lifecycle management. Detection already runs (security-scan.yml: Trivy + pnpm audit,
# weekly); this opens the weekly version-update PRs, grouped to keep the noise low.
#
# SECURITY UPDATES ARE NOT CONFIGURED HERE. They come from the repository's own setting
# (Settings, Advanced Security: Dependabot alerts and Dependabot security updates), and only
# while it is on. Even then they do not cover a transitive pnpm dependency the lockfile alone
# cannot lift (those take an override in pnpm-workspace.yaml, by hand), nor a name ignored
# below: an ignore applies to security updates too.
#
# WHAT THIS FILE DOES NOT SEE is scripts/idp-pin-watch.mjs's (workplan 0146 T8): every image
# line of deploy/compose's managed.yml, dev.yml and www.yml, the busybox and GoAccess copies in
# its scripts, Trigger.dev, the tasks' Node, `packageManager`, the Trivy the scan runs, and the
# TypeScript split. It runs on Mondays after this, and keeps an issue open while one is behind.
# The one of those this file sees too is the databases' build, whose pin is the FROM of
# deploy/compose/postgres/Dockerfile (its entry below). The appliance's PostgreSQL is a build
# too since 0146 T15b, and its pin, the FROM of deploy/selfhost/postgres/Dockerfile, is this
# file's alone (its entry below): the pin watch reads neither deploy/selfhost/compose.yml nor
# that Dockerfile (in deploy/selfhost it reads only setup-stalwart.sh's Stalwart pin).
version: 2
updates:
  # npm/pnpm workspace (root manifest + all packages/* and apps/* via the workspace).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    ignore:
      # TypeScript 7 is unusable here, and not as a matter of taste: typescript-eslint
      # hard-throws "does not support TS 7.0" at module load, and its tracking issue
      # (#10940) targets TS >= 7.1 — so no 7.0.x release can ever be taken, and every
      # one Dependabot offers costs a triage it cannot pass. `tsc` itself is fine; the
      # linter is the blocker, and it is waiting on ESLint gaining async parser support.
      # See workplan 0026 row 22 for the evidence and the revisit trigger.
      # INERT TODAY: every `typescript` in the manifests is an `npm:` alias (the two-TypeScript
      # split in AGENTS.md), and Dependabot skips aliased entries, so it offers no TypeScript
      # at all. The pin watch opens "The TypeScript split can go" when typescript-eslint
      # admits a stable 7.1; delete this with the split.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # The Trigger.dev SDK moves with the Trigger.dev image or not at all: the two
      # compose defaults, managed.env.example and every @trigger.dev/* manifest
      # must agree, the bring-up and bootstrap-managed.unit.test.ts refuse when they
      # do not, and an upgrade is a one-way schema migration on the persistent
      # stack. Dependabot moved the SDK alone on 2026-08-24 and every managed run
      # died at the bring-up.
      # deploy/compose/trigger-version.sh moves every one of them. Workplan 0119 T1.
      - dependency-name: "@trigger.dev/*"
    groups:
      # One PR/week for routine minor+patch bumps across dev + prod deps.
      minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)

  # GitHub Actions used across .github/workflows (several are pinned by SHA / tagged).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci(actions)

  # Container images in the Dockerfiles (workplan 0119 T1). Every FROM carries
  # `image:tag@sha256:…`: Dependabot compares tags and moves the digest with the
  # tag, and a bare digest has no version to compare. Minor+patch grouped; a
  # major (a new Node line) is its own PR, because `engines` and CI must follow.
  - package-ecosystem: docker
    directories:
      - "/apps/api"
      - "/apps/web"
      - "/apps/selfhost"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    ignore:
      # The runtime's major moves by hand, with `engines` in package.json and the
      # Node line CI installs, when the next LTS line is current (workplan 0119
      # §2.4). Dependabot's first run offered 26-slim, the Current line, three
      # times in one morning; that is not a decision a green tick may take.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    groups:
      images:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore(images)

  # The managed stacks' PostgreSQL (deploy/compose/postgres/Dockerfile, workplan
  # 0146 T15): the official image without gosu, which managed.yml and dev.yml
  # build as `localhost/postgres:<tag>-<12 hex>`, the hex being the hash of the
  # Dockerfile's instructions. So this pull request, a new digest or 18.x in the
  # FROM, fails scripts/a-database-started-as-root.unit.test.ts until those
  # three image lines move too; the failure prints the `sed` that moves them.
  # Push that to the pull request's branch. An entry of its own, so that pull
  # request holds no other image back. Its E2E (managed) is dispatched as for
  # any pin of managed.yml. A major is pg_upgrade, and the owner's (0119 §2.1).
  - package-ecosystem: docker
    directory: "/deploy/compose/postgres"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore(postgres)

  # The appliance's PostgreSQL (deploy/selfhost/postgres/Dockerfile, workplan
  # 0146 T15b): the official image without gosu, on the appliance's own base,
  # which deploy/selfhost/compose.yml builds as `localhost/postgres:<tag>-<12
  # hex>` like the managed stacks' above. Until 2026-10-26 compose.yml named
  # the official image itself and the docker-compose entry below moved it; that
  # entry cannot move a build's base, so the pin moved here, and with it the
  # ignore of a major. This pull request, a new digest or 18.x in the FROM,
  # fails scripts/a-database-started-as-root.unit.test.ts until compose.yml's
  # image line moves too; the failure prints the `sed` that moves it. Push that
  # to the pull request's branch, and dispatch E2E (self-hosted) on it. An
  # entry of its own, so that pull request holds no other image back. A major
  # is pg_upgrade on somebody's machine, and the owner's (0119 §2.1).
  - package-ecosystem: docker
    directory: "/deploy/selfhost/postgres"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore(postgres)

  # The self-host stack's images (workplan 0119 T1). Dependabot's compose fetcher
  # reads only the files directly in a directory whose names match
  # `(docker-)?compose(-\w+)?(\.[\w-]+)?\.ya?ml`, so `deploy/compose` is not
  # here: managed.yml, www.yml and dev.yml all miss, the entry covered nothing
  # from 2026-09-06, and it errored every Monday. scripts/idp-pin-watch.mjs
  # compares those images instead, and
  # scripts/a-dependabot-directory-with-nothing-to-read.unit.test.ts holds
  # that every directory listed here has a file Dependabot reads, and that
  # every ignore names an image one of those files runs. Since 0146 T15b the
  # appliance's database is a build (ignored below), so what is left for this
  # entry is the app's line, Ownpace's own `edge`; it stays, so that an image
  # the appliance pulls is read the Monday it is added.
  - package-ecosystem: docker-compose
    directories:
      - "/deploy/selfhost"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    ignore:
      # The appliance's database, built here since 0146 T15b: its pin is the
      # FROM of deploy/selfhost/postgres/Dockerfile (the `docker` entry above,
      # with the major ignore this entry had), and its image line is a name no
      # registry serves. Dependabot reads `localhost/postgres` as a Docker Hub
      # repository (a registry needs a dot in its host to be one), so it would
      # ask Docker Hub for its tags every Monday and fail, or worse, find some.
      # An ignore with no versions is a dependency the updater never checks.
      - dependency-name: localhost/postgres
    groups:
      images:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore(images)
