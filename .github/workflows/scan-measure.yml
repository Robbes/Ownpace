# MEASUREMENT ONLY, ON A BRANCH THAT IS NEVER MERGED AND HAS NO PULL REQUEST.
# Its earlier proofs (gitleaks, Semgrep, the GoAccess rename, zizmor's secrets-outside-env, and
# what the listed front ports and the dashboard's front present over TLS) are in this branch's
# history and their runs; this file now holds only the next one.
#
# The outside probe's second tripwire (workplan 0132 T3 (c), 2026-11-21), on the probe branch:
# its whole probe, run as exposure-probe.yml runs it, against today's front with today's
# variables and without the machine's own address; then its TLS hello and issuer check against
# the dashboard's TLS front as main builds and configures it, on loopback. The probe's log never
# names an address; the front on loopback has a documentation address or a made-up name.
name: Scan measure (report only)

on:
  push:
    branches: [claude/ownpace-public-readiness-y7orc6-ci-scan-measure]

permissions:
  contents: read

jobs:
  probe-branch:
    name: The probe branch's probe against today's front, and its hello against the dashboard's front
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: claude/ownpace-public-readiness-y7orc6-probe-dashboard-tls
          path: pr-tree
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: main-tree
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          check-latest: true
          package-manager-cache: false
      - name: The probe branch's probe, as exposure-probe.yml runs it, without the machine's own address
        working-directory: pr-tree
        env:
          EXPOSURE_PROBE_LIVE_PORTS: ${{ vars.EXPOSURE_PROBE_LIVE_PORTS }}
          EXPOSURE_PROBE_FRONT_PORTS: ${{ vars.EXPOSURE_PROBE_FRONT_PORTS }}
          EXPOSURE_PROBE_OTA_NAMES: report
          EXPOSURE_PROBE_SITE_NAME: report
        run: node scripts/exposure-probe.mjs
      - name: The probe branch's hello against main's dashboard front, for an address and for a name
        run: |
          set -euo pipefail
          docker build --quiet -t measure-caddy main-tree/deploy/compose/caddy
          for host in 192.0.2.1 dashboard.mesh.test; do
            echo "TRIGGER_TLS_HOST=${host}"
            docker run -d --name front \
              -e TRIGGER_TLS_HOST="${host}" \
              -p 127.0.0.1:3443:3443 \
              --tmpfs /data:rw,uid=65532,gid=65532,mode=0700 \
              --tmpfs /config:rw,uid=65532,gid=65532,mode=0700 \
              -v "${GITHUB_WORKSPACE}/main-tree/deploy/compose/trigger-tls.Caddyfile:/etc/caddy/Caddyfile:ro" \
              measure-caddy > /dev/null
            status=0
            node measure/probe-hello.mjs pr-tree 3443 || status=$?
            if [ "$status" -ne 0 ]; then docker logs front; exit "$status"; fi
            docker rm -f front > /dev/null
          done
