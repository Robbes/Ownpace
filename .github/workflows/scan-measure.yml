# MEASUREMENT ONLY, ON A BRANCH THAT IS NEVER MERGED AND HAS NO PULL REQUEST.
# Its earlier proofs (gitleaks, Semgrep, the GoAccess rename, zizmor's secrets-outside-env) are in
# this branch's history and their runs; this file now holds only the next one.
#
# The outside probe's ports the front holds by itself (workplan 0132 T3 (c), 2026-11-21): before
# the probe learns the Trigger.dev dashboard's certificate, what does each listed port on the
# front present over TLS today, and what does the dashboard's own front present? The front is
# NetBird's shared proxy, so its answers on the listed ports are printed as booleans only: never
# an address, a name, or a certificate's contents. measure/front-tls.mjs says what it prints.
name: Scan measure (report only)

on:
  push:
    branches: [claude/ownpace-public-readiness-y7orc6-ci-scan-measure]

permissions:
  contents: read

jobs:
  front-tls:
    name: The listed front ports over TLS, and the dashboard's front as this repository runs it
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: main-tree
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          check-latest: true
          package-manager-cache: false
      - name: Each listed port on the front, over TLS with no server name (booleans only)
        env:
          PORTS: ${{ vars.EXPOSURE_PROBE_FRONT_PORTS }}
        run: node measure/front-tls.mjs front
      - name: The dashboard's front as main builds and configures it, for an address and for a name
        run: |
          set -euo pipefail
          docker build --quiet -t measure-caddy main-tree/deploy/compose/caddy
          for host in 100.64.0.1 dashboard.mesh.test; do
            echo "TRIGGER_TLS_HOST=${host}"
            docker run -d --name front \
              -e TRIGGER_TLS_HOST="${host}" \
              -p 127.0.0.1:3443:3443 \
              --tmpfs /data:rw,uid=65532,gid=65532,mode=0700 \
              --tmpfs /config:rw,uid=65532,gid=65532,mode=0700 \
              -v "${GITHUB_WORKSPACE}/main-tree/deploy/compose/trigger-tls.Caddyfile:/etc/caddy/Caddyfile:ro" \
              measure-caddy > /dev/null
            status=0
            node measure/front-tls.mjs local 3443 || status=$?
            if [ "$status" -ne 0 ]; then docker logs front; exit "$status"; fi
            docker rm -f front > /dev/null
          done
