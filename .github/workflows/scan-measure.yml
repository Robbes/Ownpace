# MEASUREMENT ONLY, ON A BRANCH THAT IS NEVER MERGED AND HAS NO PULL REQUEST.
# Four proofs, each with the real tool: gitleaks (0163 T6), Semgrep's rules that block (0163 T5),
# gitleaks on the GoAccess build argument's rename (0163 D8), and zizmor's secrets-outside-env on
# the secrets moved into environments (0163 T1).
# Proves the pull request job of workplan 0163 T6 with the real gitleaks and the
# real config: the gitleaks branch's .gitleaks.toml and scripts/gitleaks-report.mjs,
# run against made-up commits in throwaway repositories on the runner. A value
# shaped like a token is made for each run and never committed to this
# repository. The job fails unless every case ends as it must.
name: Scan measure (report only)

on:
  push:
    branches: [claude/ownpace-public-readiness-y7orc6-ci-scan-measure]

permissions:
  contents: read

jobs:
  gitleaks-proof:
    name: gitleaks proof (the pull request job's config and report, against made-up commits)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: claude/ownpace-public-readiness-y7orc6-gitleaks
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          check-latest: true
          package-manager-cache: false
      - name: Install gitleaks from its GitHub release, checked by its sha256
        env:
          GITLEAKS_VERSION: v8.30.1
          GITLEAKS_SHA256_X64: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GITLEAKS_SHA256_ARM64: e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080
        run: |
          set -euo pipefail
          platform="$(uname -m)"
          case "$platform" in
            x86_64) wanted=x64 ;;
            aarch64) wanted=arm64 ;;
            *) echo "::error::No gitleaks is pinned for $platform: only x64 and arm64."; exit 1 ;;
          esac
          bad=0
          for arch in x64 arm64; do
            if [ "$arch" = x64 ]; then pin="$GITLEAKS_SHA256_X64"; else pin="$GITLEAKS_SHA256_ARM64"; fi
            archive="$RUNNER_TEMP/gitleaks-$GITLEAKS_VERSION-linux-$arch.tar.gz"
            rm -f "$archive"
            curl --proto '=https' --tlsv1.2 -sSfL --retry 4 -o "$archive" \
              "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_${arch}.tar.gz"
            got="$(sha256sum "$archive")"
            got="${got%% *}"
            if [ "$got" = "$pin" ]; then
              echo "gitleaks $GITLEAKS_VERSION linux/$arch: sha256 $got, as pinned."
            else
              echo "::error::gitleaks $GITLEAKS_VERSION linux/$arch is not the build this workflow pins: its sha256 is $got, and the pin is $pin. Nothing was run."
              bad=1
            fi
          done
          [ "$bad" = 0 ] || exit 1
          rm -rf "$RUNNER_TEMP/gitleaks-bin"
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks-$GITLEAKS_VERSION-linux-$wanted.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" --no-same-owner gitleaks
          answer="$("$RUNNER_TEMP/gitleaks-bin/gitleaks" version)"
          echo "gitleaks version: $answer"
          if [ "$answer" != "${GITLEAKS_VERSION#v}" ]; then
            echo "::error::The gitleaks this step installed calls itself $answer, not ${GITLEAKS_VERSION#v}."
            exit 1
          fi
      - name: Made-up commits, each read with the job's config and report
        run: |
          #!/bin/bash
          # The PR job's config and report, against made-up commits in throwaway repositories (workplan 0163 T6).
          # Each case: a repository whose first commit holds the gitleaks branch's .gitleaks.toml and
          # scripts/gitleaks-report.mjs, then the case's commits, then the report run over first..last as the
          # job runs it. A value shaped like a GitHub token is made here for each run and never committed
          # anywhere but these repositories, which the runner throws away. The job fails unless every case
          # ends as it must.
          # Actions runs this under bash -e; each case's exit is judged here, not by the shell.
          set +e
          set -uo pipefail
          here="$GITHUB_WORKSPACE"
          export GITLEAKS="$RUNNER_TEMP/gitleaks-bin/gitleaks"
          token="ghp_$(node -e "process.stdout.write(require('node:crypto').randomBytes(27).toString('base64').replace(/[^A-Za-z0-9]/g, 'x').slice(0, 36))")"
          wrong=0
          n=0
          # next: a new repository, $r, with the report and the config in its first commit, $b.
          next() {
            n=$((n + 1))
            r="$RUNNER_TEMP/proof-$n"
            local repo="$r"
            mkdir -p "$repo/scripts"
            cp "$here/.gitleaks.toml" "$repo/.gitleaks.toml"
            cp "$here/scripts/gitleaks-report.mjs" "$repo/scripts/gitleaks-report.mjs"
            git -C "$repo" init -q -b main
            git -C "$repo" -c user.name=proof -c user.email=proof@example.invalid add -A
            git -C "$repo" -c user.name=proof -c user.email=proof@example.invalid commit -q -m base > /dev/null
            b="$(git -C "$repo" rev-parse HEAD)"
          }
          commit() {
            git -C "$1" -c user.name=proof -c user.email=proof@example.invalid add -A
            git -C "$1" -c user.name=proof -c user.email=proof@example.invalid commit -q -m "$2" > /dev/null
          }
          # The merge cases: a branch named side stands for main, its last commit, $t, for the pull
          # request's base, and main for the pull request's branch, which merges side in.
          # resolve <repo> <file> <line>: merges side in, which must conflict, and <line> resolves it.
          resolve() {
            git -C "$1" -c user.name=proof -c user.email=proof@example.invalid merge -q side > /dev/null 2>&1
            if [ -z "$(git -C "$1" ls-files -u)" ]; then echo "::error::the merge in $1 did not conflict"; wrong=1; fi
            printf '%s\n' "$3" > "$1/$2"
            commit "$1" "merge side, resolved"
          }
          # conflict <repo> <file> <base> <side> <pr>: the three versions of <file> a conflict needs.
          conflict() {
            mkdir -p "$(dirname "$1/$2")"
            printf '%s\n' "$3" > "$1/$2"; commit "$1" start
            git -C "$1" checkout -q -b side
            printf '%s\n' "$4" > "$1/$2"; commit "$1" side
            t="$(git -C "$1" rev-parse HEAD)"
            git -C "$1" checkout -q main
            printf '%s\n' "$5" > "$1/$2"; commit "$1" pr
          }
          # judge <case> <expected exit> <repo> <base>: runs the report over base..HEAD and compares.
          judge() {
            local name="$1" want="$2" repo="$3" base="$4" head got
            head="$(git -C "$repo" rev-parse HEAD)"
            (cd "$repo" && RUNNER_TEMP="$repo.out" node scripts/gitleaks-report.mjs "$base" "$head") > "$repo.log" 2>&1
            got=$?
            if [ "$got" = "$want" ]; then
              echo "as it must: $name: exit $got; $(grep -E '^(Nothing found|[0-9]+ findings?|The scan did not finish)' "$repo.log") $(grep -o -E 'file=[^,]+' "$repo.log" | sort -u | tr '\n' ' ')"
            else
              echo "::error::NOT as it must: $name: exit $got, not $want"
              grep -v -F "$token" "$repo.log"
              wrong=1
            fi
            if grep -q -F "$token" "$repo.log"; then
              echo "::error::the report printed the value itself in: $name"
              wrong=1
            fi
          }

          next
          mkdir -p "$r/apps/api/src"; printf 'export const answer = 42;\n' > "$r/apps/api/src/plain.ts"; commit "$r" clean
          judge "a change with no secret passes" 0 "$r" "$b"

          next
          mkdir -p "$r/apps/api/src"; printf 'export const token = "%s";\n' "$token" > "$r/apps/api/src/config.ts"; commit "$r" secret
          judge "a token in a source file fails" 1 "$r" "$b"

          next
          mkdir -p "$r/apps/api/src"; printf 'export const token = "%s";\n' "$token" > "$r/apps/api/src/config.unit.test.ts"; commit "$r" unit
          judge "the same token in a unit test file passes (the allowlist)" 0 "$r" "$b"

          next
          mkdir -p "$r/apps/api/src"; printf 'export const token = "%s";\n' "$token" > "$r/apps/api/src/config.integration.test.ts"; commit "$r" integration
          judge "the same token in an integration test file passes (the allowlist)" 0 "$r" "$b"

          next
          mkdir -p "$r/docs"; printf 'O365_CLIENT_SECRET=%s\n' "$token" > "$r/docs/o365-setup.md"; commit "$r" doc
          judge "the same token in docs/o365-setup.md passes (the allowlist)" 0 "$r" "$b"

          next
          mkdir -p "$r/docs"; printf 'O365_CLIENT_SECRET=%s\n' "$token" > "$r/docs/other-setup.md"; commit "$r" otherdoc
          judge "the same token in another document fails" 1 "$r" "$b"

          next
          mkdir -p "$r/apps/api/src"; printf 'export const token = "%s"; // gitleaks:allow\n' "$token" > "$r/apps/api/src/config.ts"; commit "$r" allowed
          judge "a gitleaks:allow comment excuses nothing" 1 "$r" "$b"

          next
          mkdir -p "$r/apps/api/src"; printf 'export const token = "%s";\n' "$token" > "$r/apps/api/src/config.ts"; commit "$r" added
          printf 'export const token = process.env.TOKEN;\n' > "$r/apps/api/src/config.ts"; commit "$r" removed
          judge "a token a later commit removes still fails (the history keeps it)" 1 "$r" "$b"

          next
          mkdir -p "$r/apps/api/src"; printf 'export const token = "%s";\n' "$token" > "$r/apps/api/src/config.ts"; commit "$r" secret
          printf '%s:apps/api/src/config.ts:github-pat:1\n' "$(git -C "$r" rev-parse HEAD)" > "$r/.gitleaksignore"
          judge "a .gitleaksignore that lists the finding is refused" 1 "$r" "$b"

          next
          conflict "$r" apps/api/src/mode.ts 'export const mode = "base";' 'export const mode = "side";' 'export const mode = "pr";'
          resolve "$r" apps/api/src/mode.ts "export const token = \"$token\";"
          judge "a token written while resolving a conflict fails (the merge's remerge diff)" 1 "$r" "$t"

          next
          conflict "$r" apps/api/src/mode.unit.test.ts 'export const mode = "base";' 'export const mode = "side";' 'export const mode = "pr";'
          resolve "$r" apps/api/src/mode.unit.test.ts "export const token = \"$token\";"
          judge "the same resolution in a unit test file passes (the allowlist)" 0 "$r" "$t"

          next
          conflict "$r" docs/o365-setup.md 'O365_TENANT=base' 'O365_TENANT=side' 'O365_TENANT=pr'
          resolve "$r" docs/o365-setup.md "O365_CLIENT_SECRET=$token"
          judge "the same resolution in docs/o365-setup.md fails (a conflict's file is named b/..., not the anchored path)" 1 "$r" "$t"

          next
          git -C "$r" checkout -q -b side
          mkdir -p "$r/apps/api/src"; printf 'export const token = "%s";\n' "$token" > "$r/apps/api/src/side.ts"; commit "$r" side
          t="$(git -C "$r" rev-parse HEAD)"; git -C "$r" checkout -q main
          mkdir -p "$r/apps/api/src"; printf 'export const answer = 42;\n' > "$r/apps/api/src/plain.ts"; commit "$r" pr
          git -C "$r" -c user.name=proof -c user.email=proof@example.invalid merge -q --no-edit side > /dev/null 2>&1
          judge "a clean merge that brings main's own lines is not judged for them" 0 "$r" "$t"

          next
          git -C "$r" checkout -q -b side
          mkdir -p "$r/apps/api/src"; printf 'export const a = 1;\n' > "$r/apps/api/src/a.ts"; commit "$r" side
          t="$(git -C "$r" rev-parse HEAD)"; git -C "$r" checkout -q main
          mkdir -p "$r/apps/api/src"; printf 'export const b = 2;\n' > "$r/apps/api/src/b.ts"; commit "$r" pr
          git -C "$r" -c user.name=proof -c user.email=proof@example.invalid merge -q --no-commit --no-ff side > /dev/null 2>&1
          printf 'export const token = "%s";\n' "$token" > "$r/apps/api/src/beside.ts"; commit "$r" "merge side, and a file"
          judge "a token a merge adds beside what it merges fails" 1 "$r" "$t"

          [ "$wrong" = 0 ] && echo "Every case ended as it must." || exit 1

  semgrep-proof:
    name: Semgrep proof (the job's report with the real Semgrep, the tree as it is and with two old spots back)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: claude/ownpace-public-readiness-y7orc6-semgrep-blocking
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          check-latest: true
          package-manager-cache: false
      - name: The report as the job runs it, on the tree, on two old spots, and on an image it cannot pull
        env:
          SEMGREP_IMAGE: semgrep/semgrep:1.186.0@sha256:6e1b04340e60e910fbb4ddbf3c857ab0918f064417ad5ac530014ccb3cf8c8f1
        run: |
          # Workplan 0163 T5: the step 5 branch's scripts/semgrep-report.mjs with the real Semgrep, read
          # as a pull request reads it, then as a push. The two old spots are the two files as they were
          # when each rule that now blocks last reported a spot on main: ProviderConsent.tsx before #1990
          # (react-href-var) and no-committed-artifacts.yml before #1977 (run-shell-injection). Each
          # case's exit is judged here; the job fails unless every case is as it must be.
          set +e
          set -uo pipefail
          wrong=0
          # judge <case> <expected exit> <log> <exit>: the exit, the tally and the lines marked as errors.
          judge() {
            local name="$1" want="$2" log="$3" got="$4"
            if [ "$got" = "$want" ]; then
              echo "as it must: $name: exit $got"
            else
              echo "::error::NOT as it must: $name: exit $got, not $want"
              wrong=1
            fi
            grep -E 'spots? from [0-9]+ rules' "$log"
            grep -o -E '^::error file=[^,]+,line=[0-9]+,title=Semgrep [a-z-]+ \(blocks\)' "$log" | sed 's/^::error /  marked as an error: /'
            grep -E '^not finished:' "$log"
          }
          GITHUB_EVENT_NAME=pull_request node scripts/semgrep-report.mjs > "$RUNNER_TEMP/tree.log" 2>&1
          judge "the tree as it is passes a pull request: no rule that blocks finds a spot" 0 "$RUNNER_TEMP/tree.log" $?

          git show 75d7949d:apps/web/src/components/ProviderConsent.tsx > apps/web/src/components/ProviderConsent.tsx
          git show 5cac662b^:.github/workflows/no-committed-artifacts.yml > .github/workflows/no-committed-artifacts.yml
          GITHUB_EVENT_NAME=pull_request node scripts/semgrep-report.mjs > "$RUNNER_TEMP/spots.log" 2>&1
          judge "the two old spots back fail a pull request, each marked on its line" 1 "$RUNNER_TEMP/spots.log" $?
          for spot in 'apps/web/src/components/ProviderConsent.tsx,line=[0-9]+,title=Semgrep react-href-var' '.github/workflows/no-committed-artifacts.yml,line=[0-9]+,title=Semgrep run-shell-injection'; do
            if ! grep -q -E "^::error file=${spot} \(blocks\)" "$RUNNER_TEMP/spots.log"; then
              echo "::error::NOT as it must: no error marked for ${spot}"
              wrong=1
            fi
          done
          GITHUB_EVENT_NAME=push node scripts/semgrep-report.mjs > "$RUNNER_TEMP/spots-push.log" 2>&1
          judge "the same spots fail a push to main" 1 "$RUNNER_TEMP/spots-push.log" $?
          git show HEAD:apps/web/src/components/ProviderConsent.tsx > apps/web/src/components/ProviderConsent.tsx
          git show HEAD:.github/workflows/no-committed-artifacts.yml > .github/workflows/no-committed-artifacts.yml

          SEMGREP_IMAGE="semgrep/semgrep:1.186.0@sha256:$(printf '0%.0s' $(seq 64))" GITHUB_EVENT_NAME=pull_request node scripts/semgrep-report.mjs > "$RUNNER_TEMP/unpulled.log" 2>&1
          judge "an image it cannot pull fails a pull request: a scan that did not finish" 1 "$RUNNER_TEMP/unpulled.log" $?

          [ "$wrong" = 0 ] && echo "Every case ended as it must." || exit 1

  goaccess-arg-proof:
    name: gitleaks on the GoAccess rename (the pull request job's config and report, on the real history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: claude/ownpace-public-readiness-y7orc6-goaccess-arg
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: claude/ownpace-public-readiness-y7orc6-gitleaks
          path: gitleaks-branch
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          check-latest: true
          package-manager-cache: false
      - name: Install gitleaks from its GitHub release, checked by its sha256
        env:
          GITLEAKS_VERSION: v8.30.1
          GITLEAKS_SHA256_X64: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GITLEAKS_SHA256_ARM64: e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080
        run: |
          set -euo pipefail
          platform="$(uname -m)"
          case "$platform" in
            x86_64) wanted=x64 ;;
            aarch64) wanted=arm64 ;;
            *) echo "::error::No gitleaks is pinned for $platform: only x64 and arm64."; exit 1 ;;
          esac
          bad=0
          for arch in x64 arm64; do
            if [ "$arch" = x64 ]; then pin="$GITLEAKS_SHA256_X64"; else pin="$GITLEAKS_SHA256_ARM64"; fi
            archive="$RUNNER_TEMP/gitleaks-$GITLEAKS_VERSION-linux-$arch.tar.gz"
            rm -f "$archive"
            curl --proto '=https' --tlsv1.2 -sSfL --retry 4 -o "$archive" \
              "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_${arch}.tar.gz"
            got="$(sha256sum "$archive")"
            got="${got%% *}"
            if [ "$got" = "$pin" ]; then
              echo "gitleaks $GITLEAKS_VERSION linux/$arch: sha256 $got, as pinned."
            else
              echo "::error::gitleaks $GITLEAKS_VERSION linux/$arch is not the build this workflow pins: its sha256 is $got, and the pin is $pin. Nothing was run."
              bad=1
            fi
          done
          [ "$bad" = 0 ] || exit 1
          rm -rf "$RUNNER_TEMP/gitleaks-bin"
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks-$GITLEAKS_VERSION-linux-$wanted.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" --no-same-owner gitleaks
          answer="$("$RUNNER_TEMP/gitleaks-bin/gitleaks" version)"
          echo "gitleaks version: $answer"
          if [ "$answer" != "${GITLEAKS_VERSION#v}" ]; then
            echo "::error::The gitleaks this step installed calls itself $answer, not ${GITLEAKS_VERSION#v}."
            exit 1
          fi
      - name: The rename's own commit, then a bump of the pin under each name, each read as the job reads it
        run: |
          # Workplan 0163 D8: #1992's .gitleaks.toml and report, over this repository's own history. The
          # rename's commit must pass; a made-up bump of the pin under the old name must fail on
          # generic-api-key in the Dockerfile, and the same bump under the new name must pass. The bumps
          # are throwaway commits on the runner, never pushed.
          set +e
          set -uo pipefail
          export GITLEAKS="$RUNNER_TEMP/gitleaks-bin/gitleaks"
          # Both files sit in the checkout untracked, where the report looks for them (its root is the
          # directory above its own), and no commit below takes them in.
          cp gitleaks-branch/.gitleaks.toml .gitleaks.toml
          cp gitleaks-branch/scripts/gitleaks-report.mjs scripts/gitleaks-report.mjs
          rm -rf gitleaks-branch
          wrong=0
          # judge <case> <expected exit> <base> <head>
          judge() {
            local name="$1" want="$2" base="$3" head="$4" log got
            log="$RUNNER_TEMP/judge-$RANDOM.log"
            RUNNER_TEMP="$RUNNER_TEMP/out-$RANDOM" node scripts/gitleaks-report.mjs "$base" "$head" > "$log" 2>&1
            got=$?
            if [ "$got" = "$want" ]; then
              echo "as it must: $name: exit $got"
            else
              echo "::error::NOT as it must: $name: exit $got, not $want"
              wrong=1
            fi
            grep -E '^(Nothing found|[0-9]+ findings?|The scan did not finish)' "$log"
            grep -o -E '^::error file=[^,]+,line=[0-9]+,title=gitleaks [a-z-]+' "$log" | sed 's/^::error /  marked as an error: /'
          }
          main="$(git rev-parse origin/main)"
          renamed="$(git rev-parse HEAD)"
          judge "the rename's own commit passes" 0 "$main" "$renamed"

          dockerfile=deploy/compose/goaccess/Dockerfile
          bumped="$(git rev-parse HEAD~1)"
          sed -i -E "s/^ARG UPSTREAM_COMMIT=[0-9a-f]{40}$/ARG GOACCESS_COMMIT=${bumped}/" "$dockerfile"
          git -c user.name=proof -c user.email=proof@example.invalid commit -q -am "a bump under the old name" > /dev/null
          judge "a bump of the pin under the old name, GOACCESS_COMMIT, fails" 1 "$renamed" "$(git rev-parse HEAD)"

          git switch -q --detach "$renamed"
          sed -i -E "s/^ARG UPSTREAM_COMMIT=[0-9a-f]{40}$/ARG UPSTREAM_COMMIT=${bumped}/" "$dockerfile"
          git -c user.name=proof -c user.email=proof@example.invalid commit -q -am "a bump under the new name" > /dev/null
          judge "the same bump under the new name, UPSTREAM_COMMIT, passes" 0 "$renamed" "$(git rev-parse HEAD)"

          [ "$wrong" = 0 ] && echo "Every case ended as it must." || exit 1

  zizmor-secrets-proof:
    name: zizmor's secrets-outside-env, auditor persona, on main and on the T1 branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: on-main
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: claude/ownpace-public-readiness-y7orc6-secrets-environments
          path: on-t1
          persist-credentials: false
      - name: Run zizmor as zizmor.yml pins it, with the auditor persona, over each checkout
        env:
          ZIZMOR_IMAGE: ghcr.io/zizmorcore/zizmor:1.32.0@sha256:3014cc8f68f663935f69b3c3e0e41f5ce102b268d97db13db0f62208747f860d
        run: |
          # Workplan 0163 T1: zizmor's secrets-outside-env (shown only under the auditor persona since
          # 1.24.0) over main, where the two secrets are repository secrets read by jobs with no
          # environment, and over the T1 branch, where each job names one. Only that audit is counted;
          # the persona's other findings are not read here. main must show at least one, all in the two
          # workflows; the T1 branch must show none.
          set +e
          set -uo pipefail
          docker pull --quiet "$ZIZMOR_IMAGE" > /dev/null
          wrong=0
          for tree in on-main on-t1; do
            docker run --rm --pull never \
              --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
              --user "$(id -u):$(id -g)" \
              --volume "$GITHUB_WORKSPACE/$tree:/repo:ro" --workdir /repo \
              "$ZIZMOR_IMAGE" \
              --offline --no-config --no-ignores --no-progress --color never --persona auditor \
              . > "$RUNNER_TEMP/$tree.txt" 2>&1
            echo "zizmor exited $? on $tree"
            grep -A4 -F '[secrets-outside-env]' "$RUNNER_TEMP/$tree.txt" | grep -o -E '\.github/workflows/[A-Za-z0-9._-]+\.ya?ml:[0-9]+' | sort > "$RUNNER_TEMP/$tree.places"
            count="$(grep -c -F '[secrets-outside-env]' "$RUNNER_TEMP/$tree.txt")"
            echo "$tree: $count secrets-outside-env findings"
            sed 's/^/  at /' "$RUNNER_TEMP/$tree.places"
            echo "$count" > "$RUNNER_TEMP/$tree.count"
          done
          main_count="$(cat "$RUNNER_TEMP/on-main.count")"
          t1_count="$(cat "$RUNNER_TEMP/on-t1.count")"
          if [ "$main_count" -ge 1 ] && [ -z "$(grep -v -E '^\.github/workflows/(e2e-managed|exposure-probe)\.yml:' "$RUNNER_TEMP/on-main.places")" ]; then
            echo "as it must: main shows $main_count, all in e2e-managed.yml and exposure-probe.yml"
          else
            echo "::error::NOT as it must: main shows $main_count, or one outside the two workflows"
            wrong=1
          fi
          if [ "$t1_count" = 0 ]; then
            echo "as it must: the T1 branch shows none"
          else
            echo "::error::NOT as it must: the T1 branch shows $t1_count"
            wrong=1
          fi
          [ "$wrong" = 0 ] && echo "Every case ended as it must." || exit 1
