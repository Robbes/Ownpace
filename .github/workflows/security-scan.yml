# Security scanning — Node/TS equivalent of OWASP Dependency-Check + CycloneDX.
# Trivy (dependency/filesystem) -> SARIF, plus a CycloneDX SBOM; SBOM attached to release tags.
# Weekly and on dispatch, also every container image the stacks run, report
# only (the jobs after security-scan, workplan 0146 T8). A dispatch can turn
# that off with `image_scans: false`, which the Release workflow
# (release.yml) does for both of its dispatches of this file.
#
# The SBOM half runs on TAGS as well as main. It did not until 2026-08-04, and
# the attach step was gated on a tag ref the workflow never saw — so the step
# read as deliberate and did nothing, which is the worst shape a guard can
# have. See the trigger block.
#
# A PUSH TO MAIN RUNS ON GITHUB'S HOSTED ARM64 RUNNER DURING THE ALPHA (the
# owner's answer of 2026-11-08, workplan 0132 open question 1), as ci.yml's push
# jobs do, and for the same reason: from the first invitation the machine holds
# live beside the self-hosted runner's Docker socket. The repository scan needs
# nothing of the machine. ONE SWITCH TURNS IT BACK, the one ci.yml's header
# describes: the repository variable `CI_PUSH_ON_SELF_HOSTED`, which set to
# `true` sends a push to main to the self-hosted runner again, as before
# 2026-11-08. Everything else runs where it ran: a pull request, the weekly
# schedule, a tag and a dispatch on `ubuntu-24.04`, the image jobs on GitHub's
# runners. Only a dispatch with `push_runner` takes the runner a push to main
# takes while the switch is on, so a branch can prove that path before it
# merges; no dispatch takes the self-hosted runner.
# `scripts/a-merge-that-ran-beside-the-socket.unit.test.ts` holds it.
name: Security Scan

on:
  push:
    branches: [main]
    # Tags too, and that is not cosmetic: the SBOM-attach step below is gated
    # on `refs/tags/`, a condition this workflow could never reach while it
    # only ran on branches. The step has been present and unreachable since it
    # was written, so "a CycloneDX SBOM is attached to the release" was a claim
    # with nothing behind it — found reviewing the tag path before the first
    # tag was pushed (0025 T2/T3, 2026-08-04).
    tags: ['v*']
  # No `branches:` filter — see ci.yml's trigger block for why. A base other
  # than `main` used to mean this check was never reported at all, which
  # wedges a required context rather than failing it.
  pull_request:
  schedule:
    - cron: '0 6 * * 1'   # weekly, Monday 06:00 UTC, to catch newly disclosed CVEs
  # THE RELEASE WORKFLOW DISPATCHES THIS FILE TWICE PER RELEASE (workplan
  # 0146, Status of 2026-10-23; docs/release.md §2): on `release-gate/<tag>`,
  # a branch at exactly the commit to tag, minutes before the tag, and then
  # on the tag itself, where it makes the release with its body and
  # `bom.json` before the images and the zip are published. Both pass
  # `image_scans: false`, so they are the repository scan alone: the image
  # legs add twenty minutes and a report job that can fail on a report that
  # is missing, which has nothing to do with the tag. A hand dispatch keeps
  # the default and scans the images, as it did before.
  workflow_dispatch:
    inputs:
      image_scans:
        description: 'Also scan every image the stacks run (report only). Release passes false.'
        type: boolean
        default: true
      # 2026-11-08: the repository scan on the runner a push to main takes
      # while ci.yml's switch keeps it on GitHub's runners (the header), so a
      # branch proves the push path before it merges. Release passes nothing,
      # and its two dispatches keep `ubuntu-24.04`.
      push_runner:
        description: 'Run the repository scan on the runner a push to main takes (GitHub arm64), not ubuntu-24.04. Release passes nothing.'
        type: boolean
        default: false

# CANCEL A SUPERSEDED PULL REQUEST SCAN. NOTHING ELSE.
#
# `group` keys on `github.ref`, and for THREE of this workflow's five triggers
# that ref is the same string: a push to `main`, the Monday `schedule`, and a
# `workflow_dispatch` on main all sit in `security-scan-refs/heads/main`. With
# `cancel-in-progress: true` they cancel each other.
#
# THE WEEKLY SWEEP IS THE ONE THAT LOSES. It exists to scan code that has NOT
# changed, against a CVE list that has — so the run is worth exactly as much as
# its being the only one that happens that week. Merge anything on a Monday
# morning while it is running and it is killed where it stands, and the next
# one is seven days away. Nothing reports this: a cancelled run is not a failed
# run, and `security-scan` is a required check whose absence on an already
# merged commit blocks nothing.
#
# A push to `main` loses less than ci.yml's equivalent did, and it is worth
# being exact about why rather than borrowing that PR's alarm: this workflow
# has no `detect-changes`, so it scans the whole tree at HEAD and a later run
# covers everything a cancelled one would have. What is lost is the RECORD —
# that commit uploads no SARIF, so code scanning has a hole where a merged
# commit should be, which is the question an audit asks.
#
# Tags are already safe by accident (`refs/tags/v1.2.3` is its own group) and
# are now safe on purpose, which matters because the tag path is the one that
# attaches the release SBOM.
#
# THE WEEKLY RUN NOW HOLDS THE GROUP LONGER. Since 2026-10-22 the schedule and
# a dispatch (unless it passes `image_scans: false`, as Release's do) also
# scan every image the stacks run (the jobs after
# security-scan): one leg per image, about 26, in two waves where a Free
# public repository runs 20 jobs at once. A push to main in that time waits,
# and a second push replaces the first one waiting, which then uploads no
# SARIF: the hole in the record described above, more likely on a Monday
# morning. Accepted, as one sweep a week; the way out, if it ever costs a
# record that matters, is the image jobs in a workflow of their own with a
# group of their own.
#
# `images.yml` has been written this way since it was created; ci.yml joined it
# in #1056. This was the last workflow cancelling a build nothing would re-run.
# Held for EVERY workflow, not just this one, by
# `scripts/a-run-that-was-cancelled-and-called-green.unit.test.ts`.
concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    name: security-scan
    # The self-hosted runner for a push to main only when the switch in the
    # header sends it there (`CI_PUSH_ON_SELF_HOSTED` is `true`); GitHub's
    # arm64 runner for such a push while it does not, and for a dispatch that
    # asks for the push's runner; `ubuntu-24.04` for everything else.
    runs-on: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CI_PUSH_ON_SELF_HOSTED == 'true' && 'self-hosted' || (github.event_name == 'push' && github.ref == 'refs/heads/main' || inputs.push_runner) && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    env:
      # THE SAME CONDITION `runs-on` USES FOR THE SELF-HOSTED RUNNER, a few
      # lines above, written out again because `runs-on` is evaluated before
      # `env` exists and cannot read it. The two must agree, so
      # `a-scan-that-skipped-itself.unit.test.ts` reads both out of this file
      # and fails if they ever drift apart.
      #
      # Which runner a run lands on decides how its Trivy database survives:
      # the self-hosted runner keeps a directory between runs for free, a
      # GitHub-hosted runner is destroyed and leans on trivy-action's own
      # cache. It is read again further down, to switch that cache off where
      # it is waste.
      ON_SELF_HOSTED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CI_PUSH_ON_SELF_HOSTED == 'true' }}
    permissions:
      # `contents: write` for the SBOM attach on a tag: creating or updating a
      # release is a write, and the read-only token this job used would have
      # failed the step with a 403 even once it became reachable. Scoped to
      # this job rather than the workflow — the top-level block stays read.
      contents: write
      security-events: write
      actions: read
    steps:
      # Node first: the release check straight after the checkout runs it, and
      # it ran the hosted image's default until 2026-11-01, a version nobody
      # chose (a-gate-on-a-version-nothing-ships). Before the checkout, because
      # the check comes straight after it (a-release-that-names-itself).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          check-latest: true # the newest 26.x, not the first one in the runner's tool cache
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # THE TAG, THE VERSION AND THE CHANGELOG NAME ONE RELEASE (workplan 0146
      # T2), checked before anything below installs or publishes. Without it, a
      # tag pushed before the version bump and the changelog rename would create
      # a release whose body links a section that is not there. On a tag only,
      # the condition the two release steps below use: main, the weekly sweep
      # and pull requests run exactly as before. The fetch lets the check see
      # the releases already tagged, since this checkout is shallow and holds
      # only the tag being cut. See scripts/release-names-agree.mjs.
      - name: The tag, package.json and the changelog name one release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags --depth=1 origin '+refs/tags/v*:refs/tags/v*'
          node scripts/release-names-agree.mjs

      # PNPM AND NODE AS EVERY OTHER JOB SETS THEM UP: the pnpm `packageManager`
      # names and the Node major the images run, the newest release of it.
      # Until 2026-10-21 this job had neither step. It ran the machine's apt Node
      # on main and the hosted image's default elsewhere, which no guard saw,
      # and it installed pnpm by piping get.pnpm.io's script into `sh` with no
      # version, into the runner user's own pnpm home, so every merge replaced
      # the pnpm that user's shell runs with whatever `latest` was that day.
      # action-setup installs into a directory of its own. The Node step, at the
      # top of the job, is held by a-gate-on-a-version-nothing-ships.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Verify versions
        run: echo "node $(node --version), pnpm $(pnpm --version)"
      - run: pnpm install --frozen-lockfile

      # ---------- WHAT IS IN THE TREE, NAMED ONE BY ONE ----------
      #
      # `--audit-level=moderate`, so moderates are FETCHED. The line this
      # replaces asked for `high`, which meant a moderate was never mentioned by
      # any run — indistinguishable from there being none.
      #
      # `|| true` because pnpm exits non-zero whenever it finds anything at the
      # level asked for, and the exit code that matters here is the reporter's,
      # not pnpm's.
      #
      # JSON rather than the printed table, because only the JSON carries
      # `findings[].dev`, and the report says where each advisory reaches.
      # That is CONTEXT FOR FIXING IT, NOT A DISCOUNT: this repository is
      # public, so an advisory in the dev tree is as readable — and as real — as
      # one in the shipped tree. `--fail-at` never consults that flag; it gates
      # on severity alone, and a dev-only high blocks exactly like any other.
      #
      # --fail-at=high: HIGH and CRITICAL block the merge, MODERATE and LOW are
      # reported and do not. That split is the owner's rule, and it is a
      # severity line, not a prod/dev one. Every advisory is listed either way —
      # what changes at the line is only whether the job exits non-zero.
      - name: pnpm audit (advisory gate)
        run: |
          pnpm audit --audit-level=moderate --json > pnpm-audit.json || true
          node scripts/audit-advisories.mjs --fail-at=high pnpm-audit.json

      # ---------- THE DATABASE THIS SCAN NEEDS, KEPT BETWEEN RUNS ----------
      #
      # trivy-action ALREADY CARRIES A CACHE OF ITS OWN, and it is a good one:
      # `actions/cache` over whatever `cache-dir` points at, keyed by the day,
      # with a `cache-trivy-` prefix to fall back on when the day rolls over.
      # Do not add a second `actions/cache` beside it. An earlier draft of this
      # file did exactly that, and run 34333627931 saved two ~83 MB copies of
      # one database under two keys — `cache-trivy-2026-09-09` from the action
      # and `trivy-db-Linux-X64-2026-09-09` from the duplicate — spending twice
      # the repository's cache quota to store the same bytes twice.
      #
      # What the built-in cache cannot know is WHICH MACHINE it is on, and this
      # job runs on two of them (see ON_SELF_HOSTED above):
      #
      #   a GitHub-hosted runner — destroyed after the run, so trivy-action's
      #     own daily cache is exactly the right mechanism and stays ON.
      #
      #   the machine — $HOME survives between runs, so the database is already
      #     on disk when the job starts. Uploading and downloading 83 MB to
      #     re-supply a file that never left the box is pure waste, so the
      #     built-in cache is turned OFF there.
      #
      # Both want the database out of `$GITHUB_WORKSPACE`, which is where
      # trivy-action would otherwise put it. On a self-hosted runner the
      # workspace is REUSED between runs and `actions/checkout` cleans it at
      # the top of each one, so a database kept there is the one thing that
      # cannot survive on the very machine that could otherwise keep it.
      #
      # `$HOME` is resolved HERE, in a run step, rather than in the job's
      # `env:` — GitHub's expression syntax cannot read the shell environment,
      # so `${{ env.HOME }}` is empty. Doing it at runtime also keeps the
      # runner's username out of this file.
      - name: Decide where the Trivy database lives
        run: echo "TRIVY_CACHE_DIR=$HOME/.cache/trivy" >> "$GITHUB_ENV"

      # TRIVY, FROM ITS GITHUB RELEASE, CHECKED BY ITS SHA256 (2026-11-04,
      # workplan 0146). trivy-action's own install (setup-trivy, run unless
      # `skip-setup-trivy`) runs Trivy's `contrib/install.sh`, which takes the
      # archive from `get.trivy.dev`, Aqua's download host, and only the
      # checksum file from GitHub. On 2026-11-04 that name stopped resolving
      # (NXDOMAIN at a public resolver, 01:3x UTC), and every scan that
      # installed afresh failed before it read a file: main's push scan on the
      # machine from 00:00 UTC, which keeps no binary cache, on the alpha.4
      # candidate twice. GitHub-hosted runs went on from setup-trivy's binary
      # cache. This step takes the release's own archive from GitHub instead,
      # names the release, pins a SHA-256 for each architecture a runner here
      # has, reads and compares BOTH before anything is unpacked (so a wrong
      # arm64 pin fails a pull request's x86-64 run too), installs the native
      # one, and checks that it calls itself that release. The job's Trivy
      # steps then skip setup-trivy and run this binary from the PATH. The
      # repository scan and every image leg carry this step's `env:` and
      # `run:` word for word (not its name: a-scan-that-skipped-itself finds
      # steps by their names, so each is said once in the file);
      # `a-pin-that-knows-it-is-behind` holds the two together, holds each
      # trivy-action step to `skip-setup-trivy: true` and to the same
      # `version:`, and RUNS this `run:` under bash with `curl`, `uname` and
      # `sleep` stubbed. Not `TRIVY_*` names: Trivy reads its own options from
      # those.
      #
      # WHICH FILE: `trivy_<version>_Linux-64bit.tar.gz` and
      # `trivy_<version>_Linux-ARM64.tar.gz`, the names the install script
      # picks for x86_64 and aarch64. Each SHA-256 is the one the release's
      # `trivy_0.76.2_checksums.txt` gives and the one read from the
      # downloaded archive itself (2026-11-07), whose `trivy` is a static
      # x86-64 or aarch64 ELF whose Go build information names the module at
      # v0.76.2, built clean from the release's tag commit `3f6334d2`. That
      # it reports `Version: 0.76.2` is this step's own last check.
      #
      # Retried as the stalwart-cli step in ci.yml is: FIVE ATTEMPTS, 5, 15, 45
      # AND 135 SECONDS APART, THEN FAIL LOUD, and a wrong sum is never retried.
      # It made three, 5 and 15 seconds apart, until 2026-11-09, when GitHub's
      # release download answered 504 to all three in both attempts of a pull
      # request's scan (run 42580533989, 07:40 and 07:42 UTC). The waits add up
      # to 200 seconds, so an outage about that long is ridden out. That one,
      # 504s on and off from 07:37 to 07:50, was longer, and the stalwart-cli
      # step's five attempts gave up in it too: one that long still fails here,
      # and says so. A GitHub-hosted runner, where this step runs unless the
      # switch in the header sends a push to main to the self-hosted one, starts
      # with nothing kept from an earlier run, so it has no copy to fall back on.
      #
      # TO MOVE IT: the release the pin watch's Trivy row names, three days
      # old; INSTALL_TRIVY_VERSION and both sums from that release's
      # `checksums.txt` (or let this step fail once: it prints the sum it saw
      # for each architecture), in both copies, and `version:` on every
      # trivy-action step, in one pull request.
      - name: Install Trivy from its GitHub release, checked by its sha256
        env:
          INSTALL_TRIVY_VERSION: v0.76.2
          INSTALL_TRIVY_SHA256_AMD64: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
          INSTALL_TRIVY_SHA256_ARM64: ab9d51f86e6a5fb936f605faff6b593ac51bc378fff4d3e8b9d58358b9c367c3
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) native=64bit ;;
            aarch64) native=ARM64 ;;
            *) echo "::error::No Trivy is pinned for $(uname -m): only x86_64 and aarch64."; exit 1 ;;
          esac
          refused=0
          for arch in 64bit ARM64; do
            if [ "$arch" = 64bit ]; then pinned="$INSTALL_TRIVY_SHA256_AMD64"; else pinned="$INSTALL_TRIVY_SHA256_ARM64"; fi
            download="$RUNNER_TEMP/trivy_${INSTALL_TRIVY_VERSION#v}_Linux-$arch.tar.gz"
            rm -f "$download"
            for attempt in 1 2 3 4 5; do
              if curl --proto '=https' --tlsv1.2 -sSfL -o "$download" \
                  "https://github.com/aquasecurity/trivy/releases/download/${INSTALL_TRIVY_VERSION}/trivy_${INSTALL_TRIVY_VERSION#v}_Linux-${arch}.tar.gz"; then
                break
              fi
              echo "::warning::Trivy $INSTALL_TRIVY_VERSION Linux-$arch: download attempt $attempt failed"
              if [ "$attempt" = 5 ]; then
                echo "::error::Trivy $INSTALL_TRIVY_VERSION could not be downloaded from its GitHub release after 5 attempts. Nothing was scanned. Either GitHub's release download is unavailable or the release no longer serves this file."
                exit 1
              fi
              # 5s, 15s, 45s, then 135s, as the stalwart-cli step waits.
              sleep $((5 * 3 ** (attempt - 1)))
            done
            seen="$(sha256sum "$download")"
            seen="${seen%% *}"
            if [ "$seen" = "$pinned" ]; then
              echo "Trivy $INSTALL_TRIVY_VERSION Linux-$arch: sha256 $seen, as pinned."
            else
              echo "::error::Trivy $INSTALL_TRIVY_VERSION Linux-$arch is not the build this workflow pins: its sha256 is $seen, and the pin is $pinned. Nothing was run."
              refused=1
            fi
          done
          [ "$refused" = 0 ] || exit 1
          unpacked="$RUNNER_TEMP/trivy-unpacked"
          rm -rf "$unpacked"
          mkdir -p "$unpacked" "$RUNNER_TEMP/trivy-bin"
          tar -xzf "$RUNNER_TEMP/trivy_${INSTALL_TRIVY_VERSION#v}_Linux-$native.tar.gz" -C "$unpacked" --no-same-owner trivy
          install -m 0755 "$unpacked/trivy" "$RUNNER_TEMP/trivy-bin/trivy"
          echo "$RUNNER_TEMP/trivy-bin" >> "$GITHUB_PATH"
          said="$("$RUNNER_TEMP/trivy-bin/trivy" --version)"
          echo "$said"
          if [ "${said%%$'\n'*}" != "Version: ${INSTALL_TRIVY_VERSION#v}" ]; then
            echo "::error::The Trivy this step installed does not call itself ${INSTALL_TRIVY_VERSION#v}."
            exit 1
          fi

      - name: Trivy filesystem/dependency scan (SARIF)
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # THE TRIVY THAT RUNS, NAMED. Since 2026-11-04 the step above installs
          # it and this input installs nothing (`skip-setup-trivy` below); it
          # is kept, equal to that step's INSTALL_TRIVY_VERSION, because the
          # pin watch and two guards read it. Without a name the action would
          # install its own default, v0.70.0 (2026-04-17) at this SHA, and
          # Dependabot moves the action, not that default: v0.36.0 is still its
          # newest release. The
          # vulnerability database updates daily either way; this is the engine
          # (parsers, detection). v0.76.2 is from 2026-11-05 (its assets
          # uploaded 12:50 UTC): v0.76.1 with four dependency moves backported
          # (golang.org/x/net 0.62.0, go-jose v4 4.1.6, a common group of
          # fourteen, and alpine 3.24.3 in Trivy's own images, which nothing
          # here pulls), and Trivy's own code unchanged: between the two tags
          # only go.mod, go.sum, its Dockerfiles and its release files move.
          # It is three days old, the age CONTRIBUTING.md asks of a
          # dependency, on 2026-11-08. scripts/idp-pin-watch.mjs reads every
          # Trivy step's version: and keeps an issue open while a newer Trivy
          # exists.
          # Raise when Dependabot takes trivy-action > v0.36.0. Every Trivy step
          # must name one: held by a-gate-on-a-version-nothing-ships.
          version: v0.76.2
          # The binary the step above installed and checked, on the PATH: never
          # setup-trivy's own install, which fetches from get.trivy.dev.
          skip-setup-trivy: true
          scan-type: fs
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          # Out of the workspace, so the machine can keep it — see "THE DATABASE
          # THIS SCAN NEEDS" above.
          cache-dir: ${{ env.TRIVY_CACHE_DIR }}
          # The action's own daily cache, on everywhere it is needed and off on
          # the one machine that does not need it.
          cache: ${{ env.ON_SELF_HOSTED != 'true' }}
        # Kept, and now it costs nothing: the step below reads
        # `steps.trivy.outcome`, and "the scan reported something" is asserted
        # at the end of the job. Without that pair this flag alone turned every
        # Trivy failure into a green step.
        continue-on-error: true

      - name: Upload SARIF to code scanning
        id: upload_sarif
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy.sarif

      - name: Generate CycloneDX SBOM
        # On a release tag a missing bom.json would make the release-create
        # step below silently not fire — the workflow would go green having
        # published nothing (the 0025 T3 soft-fail shape). Fatal on tags,
        # warning elsewhere.
        #
        # The lockfile's cyclonedx-npm (a root devDependency, installed
        # above), never npm's newest: `--yes=false` makes npx fail instead of
        # installing when it is missing, where `-y` (this step until
        # 2026-11-01) and a bare npx on CI install whatever npm names newest
        # (workplan 0119 §2.5). Not `pnpm exec`: it sets `npm_execpath` to
        # pnpm, and cyclonedx-npm, which runs `npm ls` through that variable,
        # then stops with `Unexpected npmJsPath`.
        env:
          IS_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          if ! npx --yes=false @cyclonedx/cyclonedx-npm --output-format JSON --output-file bom.json --ignore-npm-errors; then
            if [ "$IS_RELEASE_TAG" = "true" ]; then
              echo "::error::SBOM generation failed on a release tag — without bom.json the release would silently not be created"
              exit 1
            fi
            echo "::warning::CycloneDX SBOM generation failed"
          fi

      - name: Upload SBOM artifact
        if: always() && hashFiles('bom.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.sha }}
          path: bom.json
          retention-days: 90

      - name: Compose release body
        if: startsWith(github.ref, 'refs/tags/')
        # Evergreen pointers only — the pull lines, the signature check, and
        # where the real prose lives. NOT commit-derived notes: on a tag push
        # `github.event.head_commit.message` is the pointed-at commit (a merge
        # line), and generated notes would be a list of commit subjects. The
        # human cutting the release edits prose in afterwards per
        # docs/release.md; before this block the release page was an
        # unlabelled SBOM with no body at all.
        run: |
          VER="${GITHUB_REF_NAME#v}"
          cat > release-body.md <<EOF
          Ownpace ${GITHUB_REF_NAME}. What changed: [CHANGELOG.md](https://github.com/Robbes/Ownpace/blob/${GITHUB_REF_NAME}/CHANGELOG.md).

          **Container images** (multi-arch, cosign-signed):

          \`\`\`
          docker pull ghcr.io/robbes/ownpace-selfhost:${VER}
          docker pull ghcr.io/robbes/ownpace-api:${VER}
          docker pull ghcr.io/robbes/ownpace-web:${VER}
          \`\`\`

          **Verify a signature** (keyless, against the public Sigstore log):

          \`\`\`
          cosign verify ghcr.io/robbes/ownpace-selfhost:${VER} \
            --certificate-identity-regexp '^https://github\.com/Robbes/(open-migrate|ownpace|Ownpace)/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`

          Install: see [docs/selfhost-quickstart.md](https://github.com/Robbes/Ownpace/blob/${GITHUB_REF_NAME}/docs/selfhost-quickstart.md); Windows without Docker: [docs/windows-appliance-runbook.md](https://github.com/Robbes/Ownpace/blob/${GITHUB_REF_NAME}/docs/windows-appliance-runbook.md).

          The attached \`bom.json\` is this build's CycloneDX SBOM.
          EOF

      - name: Attach SBOM to GitHub release
        if: startsWith(github.ref, 'refs/tags/') && hashFiles('bom.json') != ''
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: bom.json
          # A hyphen in the version is what SemVer calls a pre-release, and it
          # is what keeps `0.1.0-rc.1` from being presented as this project's
          # current release. The same rule governs the image tags: metadata-
          # action's `latest=auto` withholds `latest` from a pre-release, which
          # is why nothing here has to ask for that behaviour.
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release-body.md
          # append_body keeps hand-written prose if the release already exists
          # (the human may create it with notes before the workflow finishes).
          append_body: true

      # ---------- A SCAN THAT SKIPPED ITSELF IS NOT A SCAN ----------
      #
      # Last, and `always()`, so that everything above still runs: the SBOM and
      # the release attach have nothing to do with Trivy and must not be lost
      # to a Trivy outage. This step only decides what the JOB is allowed to
      # claim.
      #
      # THE SHAPE THIS CLOSES is the one this file's own header condemns twenty
      # lines up, about the SBOM attach: "the step read as deliberate and did
      # nothing, which is the worst shape a guard can have." The Trivy half had
      # it too and never got the fix. Two lines conspired:
      #
      #   `continue-on-error: true` on the scan  — a Trivy failure reports GREEN.
      #   `if: … hashFiles('trivy.sarif') != ''` — no file means the upload is
      #                                            SKIPPED, not failed.
      #
      # So a Trivy that could not pull its vulnerability database (its ordinary
      # failure: a rate-limited ghcr.io) produced a green Security Scan that had
      # scanned nothing, uploaded nothing, and said nothing. Code scanning would
      # simply show no new analysis, which looks exactly like a week with no
      # findings.
      #
      # `-s` rather than `hashFiles`: hashFiles returns a hash for an existing
      # EMPTY file, so a zero-byte trivy.sarif passes that gate and uploads a
      # report with nothing in it. Non-empty is the property that matters.
      #
      # FATAL WHERE THE SCAN IS THE RECORD, warning where it is not — the same
      # rule the SBOM step above already states in its own words ("Fatal on
      # tags, warning elsewhere"). On main, on the weekly schedule and on a tag,
      # this run IS the security record and a missing one must be visible. On a
      # pull request it is not, and an upstream outage should not stand between
      # a contributor and their merge.
      - name: The scan produced a report, and it was uploaded
        if: always()
        env:
          SCAN_IS_THE_RECORD: ${{ github.event_name != 'pull_request' }}
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload_sarif.outcome }}
        run: |
          set -uo pipefail
          problems=""
          [ "$TRIVY_OUTCOME" = "success" ] || problems="the Trivy step ended '$TRIVY_OUTCOME'"
          if [ ! -s trivy.sarif ]; then
            problems="${problems:+$problems; }no trivy.sarif was written (or it is empty)"
          fi
          if [ "$UPLOAD_OUTCOME" != "success" ]; then
            problems="${problems:+$problems; }the SARIF upload ended '$UPLOAD_OUTCOME'"
          fi

          if [ -z "$problems" ]; then
            echo "Trivy wrote $(wc -c < trivy.sarif) bytes of SARIF and code scanning accepted it."
            exit 0
          fi

          if [ "$SCAN_IS_THE_RECORD" = "true" ]; then
            echo "::error::This Security Scan uploaded no findings, and on ${GITHUB_REF_NAME} it IS the security record: ${problems}. A green run here would mean 'no new analysis', which reads exactly like a period with no vulnerabilities."
            exit 1
          fi
          echo "::warning::This Security Scan uploaded no findings: ${problems}. Not fatal on a pull request — the scan on main is the record — but this branch has not been scanned."

  # ---------- EVERY IMAGE THE STACKS RUN, SCANNED (workplan 0146 T8, the scan half) ----------
  #
  # The job above scans the repository's FILES (`scan-type: fs`). Until
  # 2026-10-22 nothing looked inside a container image, so an operating system
  # past its end of life, or a CVE in an image whose tag never moved, was
  # reported by nothing: Trigger.dev's `redis:7-alpine` runs on Alpine 3.21,
  # which leaves support on 2026-11-01, and somebody reading release pages
  # found it. The pin watch (idp-pin-watch.yml) says when a newer tag exists;
  # these three jobs say what is inside the one that runs.
  #
  # ONLY ON THE WEEKLY SCHEDULE AND ON A DISPATCH THAT LEAVES `image_scans`
  # ON (Release's two dispatches turn it off), so a pull request, a push to
  # main and a tag run exactly as before, and the required `security-scan`
  # check is still the job above alone. ON GITHUB-HOSTED RUNNERS ONLY, never
  # the machine: a scan downloads every image's layers, and that box's disk and
  # network belong to the stacks it runs.
  #
  # REPORT ONLY. Findings go to code scanning, one SARIF category per image
  # (`trivy-image-<name>`), every image's but a test-only one's (below), and
  # fail nothing: a CVE published upstream on a Sunday cannot turn main red.
  # What fails the run is a report that is missing, the shape
  # `a-scan-that-skipped-itself` was written for: each scan asserts its own,
  # and the report job checks that every listed image has one.
  #
  # EVERY IMAGE HAS A TIER, AND A TEST-ONLY ONE STAYS OUT OF CODE SCANNING (the
  # owner, 2026-11-03, workplan 0119). The list gives each leg a `tier`
  # (image-scan.mjs, IMAGE_TIERS): production-public, production-internal,
  # shipped or test-only. A test-only image (Nextcloud, Stalwart and Mailpit:
  # development, the demo and CI, never live) is scanned, its JSON kept and
  # read by the report job like any other, end of life included; its leg skips
  # the SARIF and the upload, and its last step checks that it did. The report
  # leads with the totals of each tier, production first and test-only last.
  # Their categories stop being uploaded, so the alerts already open under
  # them stay open (below) until the owner dismisses them as used in tests.
  #
  # THE END OF LIFE IS ONLY IN THE JSON. Trivy's SARIF carries findings and the
  # image's name, never `.Metadata.OS.EOSL`. So each scan writes JSON, keeps
  # it for the report job, and unless its image is test-only converts it with
  # `trivy convert` (the binary trivy-action put on the PATH) and uploads the
  # SARIF. The report job warns,
  # writes a summary line, and keeps one issue open per image past its end of
  # life, closed when that ends: from a run on main only (the schedule, or a
  # dispatch on main). A dispatch on a pull request's branch scans the images
  # that branch brings, and would close an issue for a fix main does not have
  # yet (#1675, 2026-10-25), so its report says so and touches no issue.
  #
  # ONE CATEGORY PER IMAGE, AND WHAT THAT LEAVES BEHIND. Each upload is a
  # Trivy configuration of its own, `trivy-image-<name>`, which no pull request
  # uploads. So once main has them, a pull request's required `Trivy` check
  # (code scanning's own, which compares the pull request with its base) can
  # note configurations it did not find. That note is expected and is not a
  # finding of the pull request; what it does to the check's conclusion is
  # read after the first run on main (workplan 0146, Status). A name changes
  # when its image leaves the stacks, or when its short name starts or stops
  # occurring in both stacks (image-scan.mjs says how names are made), or
  # when its image becomes test-only; the old configuration then stays with
  # its alerts open, and is deleted by hand on the code scanning tool status
  # page (the Security tab, Code scanning, Tool status).
  #
  # THE TASKS' IMAGE IS THE PREBUILT BASE, PULLED (workplan 0119 §3 item 13,
  # 2026-11-06). apps/worker/trigger.config.ts names it by tag and index
  # digest (`TASK_BASE_IMAGE`): ghcr.io/robbes/ownpace-task-base, which
  # images.yml builds from apps/worker/task-image/Dockerfile and publishes from
  # main, and to which a task deploy adds the task code and nothing else. So
  # its leg reads it from GHCR like any other image, under the name, and so
  # the category, it always had, `trigger-task-base`. From workplan 0146 T10
  # (2026-10-25) until then the leg built the `base` stage a deploy built,
  # from the config's own layers on the API's Node image (`image-scan.mjs
  # containerfile`, gone with it), under that image's repository, which is
  # where Trivy's SARIF put each Debian finding (`library/node`); the first scan
  # of the prebuilt base puts them under `robbes/ownpace-task-base`, so the old
  # ones close once.
  #
  # AN IMAGE NO REGISTRY SERVES IS BUILT, NOT PULLED (#1675, 2026-10-25). A
  # script's `localhost/<name>` image is built by that script from
  # `<name>/Dockerfile` beside it (GoAccess: deploy/compose/site-visits.sh,
  # because upstream's image is on an Alpine past its end of life), so the
  # list gives its leg a `context`. That leg checks out this commit, builds the
  # directory natively on GitHub's arm64 runner (free on a public repository;
  # ci.yml's integration tests use it) under the reference the script runs,
  # and Trivy reads it from that runner's Docker only. The name, and so the
  # category and the issue, stays the image's short name (`goaccess`).
  #
  # AN IMAGE NO REGISTRY SERVES IS BUILT, NOT PULLED (workplan 0146 T15,
  # 2026-10-26). A compose file's `localhost/<name>` image is built by compose
  # from `<name>/Dockerfile` beside the file (Postgres without gosu:
  # deploy/compose/postgres, which managed.yml's postgres and trigger-db and
  # dev.yml's postgres run, and deploy/selfhost/postgres, the appliance's
  # since T15b), so the list gives its leg a `context`. That leg
  # checks out this commit under `src/`, builds the directory natively on
  # GitHub's arm64 runner (free on a public repository; ci.yml's integration
  # tests use it) under the reference the compose file runs, and Trivy reads
  # it from that runner's Docker only. The name, and so the category and the
  # issue, stays the one the pulled image had (`postgres-managed`,
  # `postgres-selfhost`). Since 0146 T16 managed.yml's trigger-api and
  # trigger-supervisor are such builds too (deploy/compose/trigger.dev and
  # deploy/compose/supervisor), scanned as built under the names the pulled
  # images had (`trigger.dev`, `supervisor`); their removals and read_at fail
  # the leg's build by name when a pin moves a path or the release, and the
  # webapp's build has to fit in the leg's 30 minutes with its scan. The
  # checkout is never the working directory, which the Trivy step and `trivy
  # convert` share with every other leg: Trivy reads a `.trivyignore` or a
  # `trivy.yaml` there on its own, and one at the repository's root would drop
  # findings from this leg's SARIF alone.
  #
  # Step names differ from the job above on purpose: its guard finds them by
  # `indexOf`, and reads the first `runs-on:` expression in this file as the
  # runner condition, so these jobs come after it and name GitHub-hosted
  # runners only. Held by scripts/an-image-nobody-scanned.unit.test.ts.
  image-list:
    name: Images the stacks run
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.image_scans)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          check-latest: true # the newest 26.x, not the first one in the runner's tool cache
      # The compose files' image lines, read with the pin watch's reader (a
      # `${VAR:-default}` as its default, a digest kept), the images the
      # scripts name, the tasks' image (the prebuilt base trigger.config.ts
      # pins, by its digest; on the pinned Trigger.dev CLI's base when the
      # config names none), and Ownpace's three at `:edge` and
      # at the newest release tag, which is what live runs: it builds the tag
      # it deploys; an image a script or a compose file builds here carries
      # its `context`. Each carries its `tier`, and a name without one fails
      # the list. See image-scan.mjs.
      - name: List every image the stacks run
        id: list
        run: node scripts/image-scan.mjs list >> "$GITHUB_OUTPUT"

  image-scan:
    name: Image scan (${{ matrix.name }})
    needs: image-list
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.image_scans)
    # A leg that builds its image (the `context` of an image a script or a
    # compose file builds) builds it for the platform scanned, on GitHub's
    # arm64 runner (free on a public repository, as ci.yml's integration tests
    # use it): no emulation, no setup actions. Every other leg reads its image
    # from the registry, from amd64.
    runs-on: ${{ matrix.context && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      # One image that cannot be pulled says nothing about the others.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.image-list.outputs.images) }}
    env:
      # The platform the stacks run on: the machine is arm64, and the tasks' image
      # is built for its host (deploy-tasks.sh) on the base's image for that
      # platform. Read from the registry itself,
      # never from a local daemon, unless the leg built the image itself, and
      # then from this runner's Docker only, so a build that left nothing can
      # never be read from a registry instead. Ownpace's images are public, so
      # no login.
      TRIVY_PLATFORM: linux/arm64
      TRIVY_IMAGE_SRC: ${{ matrix.context && 'docker' || 'remote' }}
    steps:
      # AN IMAGE BUILT HERE (the comments above image-list). The checkout and
      # the build run on a `context` leg only: a script's or a compose file's
      # build pulls its Dockerfile's bases by their digests and reaches the
      # package mirrors and the source it names, as the script's or compose's
      # own build does on the machine; it pushes nothing. The tasks' leg reads
      # the prebuilt base from GHCR like every other image, since 2026-11-06.
      #
      # The checkout goes to `src/`, never to the working directory, which the
      # Trivy step and `trivy convert` share with every other leg: there Trivy
      # reads a `.trivyignore` and a `trivy.yaml` on its own (trivy-action sets
      # neither file unless asked), so one at the repository's root would drop
      # findings from this leg's SARIF alone, and code scanning would call them
      # fixed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.context
        with:
          persist-credentials: false
          path: src
      - name: Build the image a script or a compose file builds, from its Dockerfile here
        id: build_context
        if: matrix.context
        env:
          CONTEXT: ${{ matrix.context }}
          REF: ${{ matrix.ref }}
        run: |
          set -euo pipefail
          docker build --pull --platform "$TRIVY_PLATFORM" --tag "$REF" "src/$CONTEXT"
          docker image inspect --format '{{.Os}}/{{.Architecture}} {{.Id}} {{.Config.User}}' "$REF"

      # TRIVY, FROM ITS GITHUB RELEASE, CHECKED BY ITS SHA256 (2026-11-04,
      # workplan 0146). trivy-action's own install (setup-trivy, run unless
      # `skip-setup-trivy`) runs Trivy's `contrib/install.sh`, which takes the
      # archive from `get.trivy.dev`, Aqua's download host, and only the
      # checksum file from GitHub. On 2026-11-04 that name stopped resolving
      # (NXDOMAIN at a public resolver, 01:3x UTC), and every scan that
      # installed afresh failed before it read a file: main's push scan on the
      # machine from 00:00 UTC, which keeps no binary cache, on the alpha.4
      # candidate twice. GitHub-hosted runs went on from setup-trivy's binary
      # cache. This step takes the release's own archive from GitHub instead,
      # names the release, pins a SHA-256 for each architecture a runner here
      # has, reads and compares BOTH before anything is unpacked (so a wrong
      # arm64 pin fails a pull request's x86-64 run too), installs the native
      # one, and checks that it calls itself that release. The job's Trivy
      # steps then skip setup-trivy and run this binary from the PATH. The
      # repository scan and every image leg carry this step's `env:` and
      # `run:` word for word (not its name: a-scan-that-skipped-itself finds
      # steps by their names, so each is said once in the file);
      # `a-pin-that-knows-it-is-behind` holds the two together, holds each
      # trivy-action step to `skip-setup-trivy: true` and to the same
      # `version:`, and RUNS this `run:` under bash with `curl`, `uname` and
      # `sleep` stubbed. Not `TRIVY_*` names: Trivy reads its own options from
      # those.
      #
      # WHICH FILE: `trivy_<version>_Linux-64bit.tar.gz` and
      # `trivy_<version>_Linux-ARM64.tar.gz`, the names the install script
      # picks for x86_64 and aarch64. Each SHA-256 is the one the release's
      # `trivy_0.76.2_checksums.txt` gives and the one read from the
      # downloaded archive itself (2026-11-07), whose `trivy` is a static
      # x86-64 or aarch64 ELF whose Go build information names the module at
      # v0.76.2, built clean from the release's tag commit `3f6334d2`. That
      # it reports `Version: 0.76.2` is this step's own last check.
      #
      # Retried as the stalwart-cli step in ci.yml is: FIVE ATTEMPTS, 5, 15, 45
      # AND 135 SECONDS APART, THEN FAIL LOUD, and a wrong sum is never retried.
      # It made three, 5 and 15 seconds apart, until 2026-11-09, when GitHub's
      # release download answered 504 to all three in both attempts of a pull
      # request's scan (run 42580533989, 07:40 and 07:42 UTC). The waits add up
      # to 200 seconds, so an outage about that long is ridden out. That one,
      # 504s on and off from 07:37 to 07:50, was longer, and the stalwart-cli
      # step's five attempts gave up in it too: one that long still fails here,
      # and says so. A GitHub-hosted runner, where this step runs unless the
      # switch in the header sends a push to main to the self-hosted one, starts
      # with nothing kept from an earlier run, so it has no copy to fall back on.
      #
      # TO MOVE IT: the release the pin watch's Trivy row names, three days
      # old; INSTALL_TRIVY_VERSION and both sums from that release's
      # `checksums.txt` (or let this step fail once: it prints the sum it saw
      # for each architecture), in both copies, and `version:` on every
      # trivy-action step, in one pull request.
      - name: Install the image scan's Trivy from its GitHub release, checked by its sha256
        env:
          INSTALL_TRIVY_VERSION: v0.76.2
          INSTALL_TRIVY_SHA256_AMD64: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
          INSTALL_TRIVY_SHA256_ARM64: ab9d51f86e6a5fb936f605faff6b593ac51bc378fff4d3e8b9d58358b9c367c3
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) native=64bit ;;
            aarch64) native=ARM64 ;;
            *) echo "::error::No Trivy is pinned for $(uname -m): only x86_64 and aarch64."; exit 1 ;;
          esac
          refused=0
          for arch in 64bit ARM64; do
            if [ "$arch" = 64bit ]; then pinned="$INSTALL_TRIVY_SHA256_AMD64"; else pinned="$INSTALL_TRIVY_SHA256_ARM64"; fi
            download="$RUNNER_TEMP/trivy_${INSTALL_TRIVY_VERSION#v}_Linux-$arch.tar.gz"
            rm -f "$download"
            for attempt in 1 2 3 4 5; do
              if curl --proto '=https' --tlsv1.2 -sSfL -o "$download" \
                  "https://github.com/aquasecurity/trivy/releases/download/${INSTALL_TRIVY_VERSION}/trivy_${INSTALL_TRIVY_VERSION#v}_Linux-${arch}.tar.gz"; then
                break
              fi
              echo "::warning::Trivy $INSTALL_TRIVY_VERSION Linux-$arch: download attempt $attempt failed"
              if [ "$attempt" = 5 ]; then
                echo "::error::Trivy $INSTALL_TRIVY_VERSION could not be downloaded from its GitHub release after 5 attempts. Nothing was scanned. Either GitHub's release download is unavailable or the release no longer serves this file."
                exit 1
              fi
              # 5s, 15s, 45s, then 135s, as the stalwart-cli step waits.
              sleep $((5 * 3 ** (attempt - 1)))
            done
            seen="$(sha256sum "$download")"
            seen="${seen%% *}"
            if [ "$seen" = "$pinned" ]; then
              echo "Trivy $INSTALL_TRIVY_VERSION Linux-$arch: sha256 $seen, as pinned."
            else
              echo "::error::Trivy $INSTALL_TRIVY_VERSION Linux-$arch is not the build this workflow pins: its sha256 is $seen, and the pin is $pinned. Nothing was run."
              refused=1
            fi
          done
          [ "$refused" = 0 ] || exit 1
          unpacked="$RUNNER_TEMP/trivy-unpacked"
          rm -rf "$unpacked"
          mkdir -p "$unpacked" "$RUNNER_TEMP/trivy-bin"
          tar -xzf "$RUNNER_TEMP/trivy_${INSTALL_TRIVY_VERSION#v}_Linux-$native.tar.gz" -C "$unpacked" --no-same-owner trivy
          install -m 0755 "$unpacked/trivy" "$RUNNER_TEMP/trivy-bin/trivy"
          echo "$RUNNER_TEMP/trivy-bin" >> "$GITHUB_PATH"
          said="$("$RUNNER_TEMP/trivy-bin/trivy" --version)"
          echo "$said"
          if [ "${said%%$'\n'*}" != "Version: ${INSTALL_TRIVY_VERSION#v}" ]; then
            echo "::error::The Trivy this step installed does not call itself ${INSTALL_TRIVY_VERSION#v}."
            exit 1
          fi

      - name: Scan the image with Trivy (JSON)
        id: image_trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # The Trivy the job above names: raise them together.
          # a-gate-on-a-version-nothing-ships holds each Trivy step to an
          # exact release; an-image-nobody-scanned holds this one to the job
          # above's.
          version: v0.76.2
          # The binary the step above installed and checked, on the PATH: never
          # setup-trivy's own install, which fetches from get.trivy.dev.
          skip-setup-trivy: true
          scan-type: image
          # The reference: what a `context` leg built under it, from this
          # runner's Docker; the registry's otherwise.
          image-ref: ${{ matrix.ref }}
          format: json
          output: trivy-image-${{ matrix.name }}.json
          severity: HIGH,CRITICAL
          # Vulnerabilities only. Trivy's default adds its secret scanner,
          # which costs time on the big images and finds test keys inside
          # node_modules; its hits would go to code scanning while the
          # report job counts none of them.
          scanners: vuln
          # Report only: findings exit 0. A pull or a database download that
          # fails still fails this step, and the last step says which image.
          exit-code: '0'
          # trivy-action's own daily cache, off here and only here. The legs
          # start together, so none would find the day's copy, each would try
          # to save one, and every one but the first would end in a warning
          # that buries the report's own. The database comes from
          # mirror.gcr.io, Trivy's first source, in seconds, and nothing is
          # cached a second time beside the scan above's.
          cache: 'false'

      # Before the SARIF, so an upload code scanning refuses still leaves the
      # report job what it needs to say whether the image is past its end of
      # life. On every leg, a test-only image's included: the report covers it.
      - name: Keep the image's report for the report job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-image-${{ matrix.name }}
          path: trivy-image-${{ matrix.name }}.json
          retention-days: 14
          if-no-files-found: error

      # Not for a test-only image (the owner, 2026-11-03; the comments above
      # image-list): its findings are in the report alone.
      - name: Turn the image report into SARIF
        if: matrix.tier != 'test-only'
        env:
          NAME: ${{ matrix.name }}
        run: trivy convert --format sarif --output "trivy-image-${NAME}.sarif" "trivy-image-${NAME}.json"

      - name: Upload the image's SARIF to code scanning
        id: image_upload
        if: matrix.tier != 'test-only'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-image-${{ matrix.name }}.sarif
          # One category per image: without it every leg's upload would be one
          # analysis, and each would replace the last.
          category: trivy-image-${{ matrix.name }}

      # This scan's own "a scan that skipped itself": the outcome, a non-empty
      # JSON and SARIF, and the upload. Always fatal, because these jobs only
      # run where the scan is the record. On a leg that builds its image, a
      # failed build is named first, since it skips every step after it; on
      # the others it reads 'skipped', which is no problem. On a
      # test-only leg the JSON is the report, and the upload must read
      # 'skipped': code scanning takes nothing of an image live never runs.
      - name: The image scan wrote its report, and code scanning took it unless test-only
        if: always()
        env:
          NAME: ${{ matrix.name }}
          REF: ${{ matrix.ref }}
          TIER: ${{ matrix.tier }}
          JSON: trivy-image-${{ matrix.name }}.json
          SARIF: trivy-image-${{ matrix.name }}.sarif
          CONTEXT_BUILD_OUTCOME: ${{ steps.build_context.outcome }}
          TRIVY_OUTCOME: ${{ steps.image_trivy.outcome }}
          UPLOAD_OUTCOME: ${{ steps.image_upload.outcome }}
        run: |
          set -uo pipefail
          problems=""
          # On a leg that builds its image from a Dockerfile here, a failed
          # build is named first: it skips every step after it. Elsewhere the
          # build reads 'skipped'.
          case "$CONTEXT_BUILD_OUTCOME" in
            success | skipped) ;;
            *) problems="${problems:+$problems; }the build of ${REF} ended '${CONTEXT_BUILD_OUTCOME}', so there was nothing to scan" ;;
          esac
          [ "$TRIVY_OUTCOME" = "success" ] || problems="${problems:+$problems; }the Trivy step ended '$TRIVY_OUTCOME'"
          if [ ! -s "$JSON" ]; then
            problems="${problems:+$problems; }no $JSON was written (or it is empty)"
          fi
          if [ "$TIER" = "test-only" ]; then
            if [ "$UPLOAD_OUTCOME" != "skipped" ]; then
              problems="${problems:+$problems; }the SARIF upload ended '$UPLOAD_OUTCOME' for a test-only image, whose findings go to the report alone"
            fi
          else
            if [ ! -s "$SARIF" ]; then
              problems="${problems:+$problems; }no $SARIF was written (or it is empty)"
            fi
            if [ "$UPLOAD_OUTCOME" != "success" ]; then
              problems="${problems:+$problems; }the SARIF upload ended '$UPLOAD_OUTCOME'"
            fi
          fi
          if [ -z "$problems" ] && [ "$TIER" = "test-only" ]; then
            echo "${NAME}: Trivy wrote $(wc -c < "$JSON") bytes of JSON for the report. Test-only, so nothing went to code scanning."
            exit 0
          fi
          if [ -z "$problems" ]; then
            echo "${NAME}: Trivy wrote $(wc -c < "$JSON") bytes of JSON, and code scanning took the SARIF."
            exit 0
          fi
          echo "::error::The image scan of ${NAME} (${REF}) left no report: ${problems}. A scan that did not happen is not a week without findings."
          exit 1

  image-scan-report:
    name: Image scan report
    needs: [image-list, image-scan]
    # Also when some scans failed: it says which images have no report, and
    # still keeps the issues of those that have one.
    if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.image_scans)) && needs.image-list.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          check-latest: true # the newest 26.x, not the first one in the runner's tool cache
      - name: Gather every image's report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: trivy-image-*
          path: image-reports
          merge-multiple: true
      # Every listed image against its report: a missing one is an ::error::
      # and fails the run; one past its end of life is a ::warning::, a line
      # in the summary and an issue, whatever its tier; findings are counted
      # and fail nothing. The summary leads with each tier's totals,
      # production first and test-only last, and lists the images by tier.
      # `--issue` keeps the issues on main only: the script reads GITHUB_REF
      # (image-scan.mjs, ISSUES_REF), and on any other ref says it kept none.
      - name: Every image has a report, and one issue per image past its end of life
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IMAGES: ${{ needs.image-list.outputs.images }}
        run: node scripts/image-scan.mjs report image-reports --issue
