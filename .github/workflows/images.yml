name: Images

# ==============================================================================
# Builds and publishes the three application images (0025 T1) — the workflow
# that makes `ghcr.io/robbes/ownpace-selfhost:edge` (the compose default)
# an image something actually produces, instead of a name that resolves to
# nothing. (From main only, until alpha.18 removed Trigger.dev, workplan 0167
# T9, the tasks' prebuilt base too, `ghcr.io/robbes/ownpace-task-base`.)
#
#   - Pull requests touching the Dockerfiles, deploy/, or this workflow BUILD
#     ONLY (no push, no registry login) on linux/amd64 — the rule-8 self-proof
#     kept fast. Multi-arch under QEMU costs tens of minutes per image and
#     belongs on the publish path, not on every PR.
#   - Pushes to main build linux/amd64 + linux/arm64 (SAD §22) and publish the
#     `edge` channel + a `sha-<commit>` tag.
#   - Tags `v*` publish the semver tags. **A PRE-RELEASE DOES NOT TAKE
#     `latest`** — metadata-action's default `latest=auto` withholds it from
#     any semver tag carrying a pre-release suffix, so `v0.1.0-rc.1` publishes
#     `0.1.0-rc.1` and nothing else. That is the behaviour the CHANGELOG tells
#     people to rely on when it says to pin the explicit tag or a digest; this
#     comment claimed the opposite until 2026-08-04, which is the direction
#     that would have hurt — a reader would expect a release candidate to
#     become the default anyone pulling `latest` gets.
#     This path has never run until the first release is cut (0025 T2, an
#     owner decision).
#
# Credentials: GITHUB_TOKEN only (packages: write) — no stored secrets
# (hard rule 3). The first main-branch run is the multi-arch shakedown.
# Registry cache keeps the QEMU cost bounded after that first run.
# ==============================================================================

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'apps/api/Dockerfile'
      - 'apps/web/Dockerfile'
      - 'apps/selfhost/Dockerfile'
      # The job worker (workplan 0167 T7): its Dockerfile, and the source its
      # step below loads in the image.
      - 'apps/worker/Dockerfile'
      - 'apps/worker/src/**'
      - 'deploy/**'
      - '.github/workflows/images.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read at the top, and each job asks for what it uses (workplan 0119,
# 2026-11-19): the two writes sit on `build`, the job that pushes and signs.
# Until then they were granted here, to every job without a block of its own.
# Seven of the eight have one, so `build` was the one that held them, and a
# job added later would have held them too. Held by
# scripts/a-token-the-job-never-asked-for.unit.test.ts.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # The ghcr.io login below pushes with this token: the images, their
      # registry cache and cosign's signatures.
      packages: write
      # Cosign keyless signing (0025 T3): the OIDC token IS the identity — no
      # stored key material anywhere (rule 3), the signature binds this repo's
      # workflow identity to the image digest via the public Sigstore log.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # `worker` is the managed edition's job worker (ADR-0054, workplan 0167
        # T7), built on apps/api/Dockerfile's two images: published, signed,
        # scanned and verified at the tag as the api is, so that the release
        # that turns the job runner's switch on has an image to start.
        image: [api, web, selfhost, worker]
    steps:
      # The Node the check below runs on, the major the images run. On a tag
      # only, the one run that calls Node here; first, because the check comes
      # straight after the checkout (a-release-that-names-itself). Without it
      # the check ran the hosted image's default, a version nobody chose
      # (a-gate-on-a-version-nothing-ships, 2026-11-01).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: startsWith(github.ref, 'refs/tags/')
        with:
          node-version: '26'
          check-latest: true # the newest 26.x, not the first one in the runner's tool cache
          package-manager-cache: false # a tag runs this workflow: no cache restored (zizmor cache-poisoning)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No token left in .git/config for the steps after this one (workplan
          # 0119): the tags' fetch below needs none, this repository being public.
          persist-credentials: false

      # THE TAG, THE VERSION AND THE CHANGELOG NAME ONE RELEASE (workplan 0146
      # T2), checked before anything below builds or pushes. Without it, a tag
      # pushed before the version bump would publish images tagged with the new
      # version whose `/version` answers the previous one. On a tag only: a
      # branch or a pull request runs exactly as before. The fetch lets the
      # check see the releases already tagged, since this checkout is shallow
      # and holds only the tag being cut. See scripts/release-names-agree.mjs.
      - name: The tag, package.json and the changelog name one release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags --depth=1 origin '+refs/tags/v*:refs/tags/v*'
          node scripts/release-names-agree.mjs

      # THE TWO IMAGES THESE ACTIONS RUN, BY TAG AND DIGEST (workplan 0119,
      # 2026-11-01). Left to their defaults, setup-qemu-action ran
      # `docker.io/tonistiigi/binfmt:latest` with `--privileged`, and
      # setup-buildx-action's `docker-container` driver started BuildKit from
      # `moby/buildkit:buildx-stable-1`, buildx's own default: two channels, in
      # the job that holds `packages: write` and `id-token: write` and pushes
      # and signs the published images. Each is now the build its channel
      # named when it was read: binfmt's `latest` is `qemu-v10.2.3` (pushed
      # 2026-06-08, read 2026-11-01), past the three-day floor
      # (CONTRIBUTING.md); BuildKit's `buildx-stable-1` is `v0.35.1` (pushed
      # 2026-11-19, the channel's since 2026-11-20, read 2026-11-22; `v0.34.2`
      # from 2026-11-07 and `v0.33.1` from 2026-11-01 until then), taken
      # inside that floor on the owner's waiver of 2026-11-22.
      # Dependabot moves these actions and never an image in their inputs; the
      # pin watch (`scripts/idp-pin-watch.mjs`, a row each) says when the
      # channel names another build, and `a-pin-that-knows-it-is-behind`
      # refuses an image input here without a digest, or on a channel tag.
      #
      # QEMU on a pull request too (since 2026-11-01). A pull request builds
      # linux/amd64 only and needs no emulator, but without this step the
      # first run of a moved binfmt pin would be the merge push, which
      # publishes. Registering the emulators takes seconds and changes nothing
      # a pull request builds.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.35.1@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # metadata-action lowercases the name, which ghcr requires.
          images: ghcr.io/${{ github.repository_owner }}/ownpace-${{ matrix.image }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=ownpace-${{ matrix.image }}
            org.opencontainers.image.licenses=Apache-2.0

      # ---------------------------------------------------------------------
      # Build, and retry ONCE if ghcr refuses the push.
      #
      # Observed on main at 85eb64f (2026-08-18): every layer built and pushed,
      # and the manifest push came back
      #
      #   403 permission_denied … "You have exceeded a secondary rate limit."
      #
      # That is not a permission problem despite the word, and not a problem
      # with the image. Three pull requests merged inside forty minutes, each
      # firing this workflow's three-image matrix at multi-arch, is nine
      # manifest pushes to ghcr in a short window — and GitHub's secondary
      # limits are per-window, so the ninth is the one that loses.
      #
      # The retry is cheap: the first attempt exported and cached every layer,
      # so the second is a manifest push, not a rebuild. The wait is long
      # because a secondary limit is a window and hammering it immediately
      # extends the window rather than clearing it.
      #
      # DUPLICATED ON PURPOSE, and it is the weak point of this: GitHub Actions
      # has no YAML anchors and `uses:` cannot be wrapped in a shell retry, so
      # the two blocks must be kept identical BY HAND. Change one, change the
      # other. (Same shape as the cosign retry below, for the same reason: an
      # external service that is fine ten seconds later.)
      # ---------------------------------------------------------------------
      - name: Build${{ github.event_name != 'pull_request' && ' + push' || '' }}
        id: build_attempt
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # The tasks' base builds from its own directory, which holds its
          # Dockerfile and the certificates it copies; the others from the root.
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          # The /version endpoints report this commit (build-identity.ts).
          build-args: |
            GIT_SHA=${{ github.sha }}
          # PRs prove the Dockerfile builds; the publish path proves multi-arch.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          # The tasks' base and the worker on a pull request, into this
          # runner's Docker, for the steps that run them below.
          load: ${{ github.event_name == 'pull_request' && matrix.image == 'worker' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry-backed layer cache: the second multi-arch build reuses the
          # first's layers instead of re-paying the QEMU cost every merge.
          # Lowercase literal (ghcr requires it): metadata-action lowercases
          # the image name above, but these raw refs would keep "Robbes" —
          # the same reason compose.yml hardcodes ghcr.io/robbes/….
          cache-from: type=registry,ref=ghcr.io/robbes/ownpace-${{ matrix.image }}:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref=ghcr.io/robbes/ownpace-{0}:buildcache,mode=max', matrix.image) || '' }}

      # Only on the publish path. A pull request builds without pushing, so it
      # cannot hit a registry rate limit — retrying a genuinely broken
      # Dockerfile there would just cost every PR author two minutes before
      # telling them the same thing.
      - name: Wait out the rate-limit window
        if: steps.build_attempt.outcome == 'failure' && github.event_name != 'pull_request'
        run: |
          echo "::warning::First push attempt failed. If this was a ghcr secondary rate limit,"
          echo "::warning::the retry after this wait normally succeeds. Full reason is in the step above."
          sleep 120

      - name: Retry the build + push
        id: build_retry
        if: steps.build_attempt.outcome == 'failure' && github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # The tasks' base builds from its own directory, which holds its
          # Dockerfile and the certificates it copies; the others from the root.
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          # The /version endpoints report this commit (build-identity.ts).
          build-args: |
            GIT_SHA=${{ github.sha }}
          # PRs prove the Dockerfile builds; the publish path proves multi-arch.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          # The tasks' base and the worker on a pull request, into this
          # runner's Docker, for the steps that run them below.
          load: ${{ github.event_name == 'pull_request' && matrix.image == 'worker' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry-backed layer cache: the second multi-arch build reuses the
          # first's layers instead of re-paying the QEMU cost every merge.
          # Lowercase literal (ghcr requires it): metadata-action lowercases
          # the image name above, but these raw refs would keep "Robbes" —
          # the same reason compose.yml hardcodes ghcr.io/robbes/….
          cache-from: type=registry,ref=ghcr.io/robbes/ownpace-${{ matrix.image }}:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref=ghcr.io/robbes/ownpace-{0}:buildcache,mode=max', matrix.image) || '' }}

      # Neither attempt is allowed to fail silently. `continue-on-error` above
      # makes the FIRST step green whatever happens, so without this the job
      # would pass on a failed push — the exact "skipped is not passed" trap
      # AGENTS.md hard rule 9 exists for.
      # On a pull request the retry is skipped, so `outcome` is 'skipped' rather
      # than 'success' and this still fires — a broken Dockerfile fails the PR
      # immediately, which is the point of building it there.
      - name: Fail if the build did not succeed
        if: steps.build_attempt.outcome == 'failure' && steps.build_retry.outcome != 'success'
        run: |
          echo "::error::ownpace-${{ matrix.image }} did not build/publish."
          echo "If the reason was a ghcr secondary rate limit, re-run this job in a few minutes."
          echo "If it was anything else, the reason is in the build step's log above."
          exit 1

      # THE JOB WORKER, RUN AS ITS SERVICE RUNS IT (workplan 0167 T7). On a
      # pull request, linux/amd64: the image's own entrypoint and user, Node
      # at apps/api/Dockerfile's FROM node line, uid and gid 65532, started as
      # the service starts it (a read-only root, /tmp in memory, no
      # capability, no new privileges), and
      # every workspace module it ships loading: each job under
      # apps/worker/src/jobs and the runner's `@openmig/scheduler/pg-boss`, so
      # an install that leaves out a package a job loads fails here rather
      # than at the worker's first start. The jobs refuse to load without the
      # role URLs the service gives them, so the probe gives them URLs to a
      # host that does not exist; nothing connects. Then each shell name as the
      # entrypoint, which must not start: the image has none. Not its CMD,
      # apps/worker/src/runner/main.ts, until that file is in the tree; the
      # managed smoke asks the running worker's /health once the service runs.
      - name: The worker runs Node as 65532 on a read-only root, loads every job, and has no shell
        if: matrix.image == 'worker' && github.event_name == 'pull_request'
        env:
          IMAGE: ${{ steps.build_attempt.outputs.imageid }}
        run: |
          set -euo pipefail
          if [ -z "$IMAGE" ]; then
            echo "::error::the build loaded no image to run"
            exit 1
          fi
          want="v$(sed -n 's/^FROM node:\([0-9]*\.[0-9]*\.[0-9]*\)-.*/\1/p' apps/api/Dockerfile)"
          probe="$(cat <<'JS'
          const fs = require('node:fs');
          const dir = '/app/apps/worker/src/jobs';
          const jobs = fs.readdirSync(dir).filter((f) => f.endsWith('.ts') && !/\.test\.ts$/.test(f));
          (async () => {
            const wrong = [];
            if (process.version !== process.env.WANT_NODE) wrong.push(`Node is ${process.version}, and apps/api/Dockerfile names ${process.env.WANT_NODE}`);
            const user = `${process.getuid()}:${process.getgid()}`;
            if (user !== '65532:65532') wrong.push(`it runs as ${user}, not 65532:65532`);
            if (process.env.NODE_ENV !== 'production') wrong.push(`NODE_ENV is ${process.env.NODE_ENV}, not production`);
            let loaded = 0;
            for (const job of jobs) {
              try { await import(`${dir}/${job}`); loaded += 1; } catch (e) { wrong.push(`${job}: ${String(e && e.message).split('\n')[0]}`); }
            }
            try { await import('@openmig/scheduler/pg-boss'); } catch (e) { wrong.push(`@openmig/scheduler/pg-boss: ${String(e && e.message).split('\n')[0]}`); }
            if (jobs.length === 0) wrong.push(`no job found under ${dir}`);
            console.log(JSON.stringify({ node: process.version, user, jobs: jobs.length, loaded }));
            for (const line of wrong) console.error(line);
            process.exit(wrong.length === 0 ? 0 : 1);
          })();
          JS
          )"
          nowhere='postgresql://nobody:nothing@nowhere.invalid:6432/none'
          docker run --rm --read-only=true --tmpfs=/tmp --cap-drop=ALL --security-opt=no-new-privileges:true \
            -w /app/apps/worker -e "WANT_NODE=${want}" \
            -e "APP_DATABASE_URL=${nowhere}" -e "SYSTEM_DATABASE_URL=${nowhere}" -e "JOBS_DATABASE_URL=${nowhere}" \
            -e "SECRET_ENCRYPTION_KEY=$(printf '0%.0s' $(seq 64))" \
            "$IMAGE" -e "$probe"
          absent='(executable file not found|no such file or directory)'
          for shell in sh /bin/sh bash /bin/bash /busybox/sh; do
            if said="$(docker run --rm --entrypoint "$shell" "$IMAGE" -c true 2>&1)"; then
              echo "::error::${shell} started in the worker image, which must have no shell"
              exit 1
            fi
            if [[ ! "$said" =~ $absent ]]; then
              echo "::error::${shell} did not start, for another reason than its absence: ${said}"
              exit 1
            fi
            echo "no ${shell}: ${BASH_REMATCH[1]}"
          done

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          # Named, not left to the installer's default: Dependabot moves the
          # installer and nothing moves this, so the pin watch compares it
          # with cosign's newest (idp-pin-watch.mjs). The same release as
          # release.yml's verify job, which checks what this signs; the two
          # move together.
          cosign-release: 'v3.1.4'

      - name: Sign the published image (keyless, by digest)
        if: github.event_name != 'pull_request'
        # The DIGEST, not a tag: one signature covers every tag pointing at
        # this manifest, and a later retag cannot claim the signature. `--yes`
        # accepts the transparency-log upload — publishing to the public
        # Sigstore log is the point, not a side effect. Failing loud is the
        # contract (rule 9): a publish whose signing step soft-failed would be
        # the pipeline lying about what it shipped.
        #
        # Retried because the dependency is somebody else's public good.
        # Run 206 (2026-08-18) went red here on `POST
        # https://rekor.sigstore.dev/api/v1/log/entries: giving up after 2
        # attempt(s)` — for the `web` image only, while `api` and `selfhost`
        # signed the same commit seconds apart. Same code, same step, one of
        # three: a Rekor blip, not a defect. cosign's own retry is those two
        # attempts within a few seconds, which a short outage outlasts.
        #
        # It still exits non-zero after the third try, and that matters more
        # than the retry does: **push happens in the step above**, so a red run
        # here does NOT unpublish anything. `:edge` is live and unsigned, and
        # `cosign verify` — which deploy/selfhost/README.md tells operators to
        # run — fails against it until this step succeeds. Red means "re-run
        # this job", not "nothing shipped".
        # The digest reaches the shell through `env:`, never pasted into the
        # script (zizmor's template-injection, 2026-11-20).
        env:
          BUILT_DIGEST: ${{ steps.build_retry.outputs.digest || steps.build_attempt.outputs.digest }}
        run: |
          # Whichever attempt actually published — the retry step's output is
          # empty when it was skipped, and `||` takes the first non-empty. An
          # empty digest would make `ref` end in a bare `@` and cosign would
          # fail on a malformed reference, so refuse here with the reason
          # rather than there with a parse error.
          digest="$BUILT_DIGEST"
          if [ -z "$digest" ]; then
            echo "::error::No image digest from either build attempt — nothing was published, so there is nothing to sign."
            exit 1
          fi
          ref="ghcr.io/robbes/ownpace-${{ matrix.image }}@${digest}"
          for attempt in 1 2 3; do
            if cosign sign --yes "$ref"; then
              echo "signed on attempt ${attempt}"
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              delay=$(( attempt * 30 ))
              echo "::warning::cosign sign failed (attempt ${attempt}/3), retrying in ${delay}s"
              sleep "${delay}"
            fi
          done
          echo "::error::cosign sign failed three times — ${ref} is PUBLISHED AND UNSIGNED. Re-run this job once Sigstore is healthy (https://status.sigstore.dev); the digest is stable, so a later run signs the same image."
          exit 1

  # THE DATABASES' IMAGES, BUILT AND STARTED ON A PULL REQUEST (workplan 0146
  # T15; the review of #1717, 2026-10-26; the appliance's since T15b, the same
  # day). managed.yml's postgres (and its trigger-db, until alpha.18), and dev.yml's postgres, run
  # `localhost/postgres:<tag>`, which compose builds on the machine from
  # deploy/compose/postgres/Dockerfile; the appliance's postgres
  # (deploy/selfhost/compose.yml) runs its own, from
  # deploy/selfhost/postgres/Dockerfile. Nothing publishes either, so the
  # matrix above never builds them. Before this job the first build of a pull
  # request that moved a FROM was the branch's E2E: a digest that does not
  # resolve, or a base that no longer ships gosu (the plain `rm` fails the
  # build on purpose), was found there.
  #
  # It brings up dev.yml's postgres, then the appliance's, each as compose does
  # on a machine without the image (`pull_policy: never`, so compose builds it
  # rather than asking a registry), and checks that `exec`, the server and the
  # data are uid 70 and that gosu is gone. dev.yml's starts on a new volume,
  # which initialises as uid 70. The appliance's starts on the volume every
  # existing appliance has (the review of T15b, 2026-10-26): one the official
  # image initialised as root, the Dockerfile's own FROM with gosu, which left
  # PGDATA uid 70's and /var/lib/postgresql/18 above it root's; the build must
  # start on it and read back the row written there. E2E (self-hosted) and its
  # backup and restore drill start the appliance on new volumes. On a pull
  # request only: on main and on a tag this workflow publishes, and this job has
  # nothing to publish. The arm64 builds are the weekly image scan's
  # (security-scan.yml), which counts the findings. Held by
  # scripts/a-database-started-as-root.unit.test.ts.
  database:
    name: build (postgres)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      COMPOSE_FILE_PATH: deploy/compose/dev.yml
      # dev.yml's published port, moved off anything the runner has on 5433.
      DEV_POSTGRES_PORT: '55433'
      # The appliance's, which publishes no database port.
      SELFHOST_COMPOSE_FILE: deploy/selfhost/compose.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The appliance's file refuses an unset POSTGRES_PASSWORD, and its app
      # names deploy/selfhost/.env as an env_file, without which compose will
      # not load the file at all, even for postgres alone (`env file … not
      # found`, compose v5.6.1, 2026-10-26). A throwaway for this runner gives
      # both, as scripts/upgrade-drill.sh does for its run. The password is this
      # run's own, made at random and masked (workplan 0163, Status of
      # 2026-11-23: an outside, read-only check found the one this file spelled
      # out), and handed through $GITHUB_ENV to the .env and to the volume the
      # next step initialises as root, whose role must take the same one. Two
      # steps: one that writes a .env writes no $GITHUB_ENV
      # (a-credential-the-next-step-printed).
      - name: This run's own Postgres password
        run: |
          set -euo pipefail
          password="$(od -An -N24 -tx1 /dev/urandom | tr -d ' \n')"
          if [ "${#password}" != 48 ]; then
            echo "::error::Could not make this run's Postgres password: ${#password} hex digits, not 48."
            exit 1
          fi
          echo "::add-mask::${password}"
          echo "BUILD_CHECK_POSTGRES_PASSWORD=${password}" >> "$GITHUB_ENV"
      - name: A throwaway .env for the appliance's compose file
        run: echo "POSTGRES_PASSWORD=${BUILD_CHECK_POSTGRES_PASSWORD}" > deploy/selfhost/.env

      - name: Compose builds each database's image where it is missing, and Postgres starts as uid 70
        run: |
          set -euo pipefail
          # One compose file's postgres, asked as its own role and database.
          prove() {
            local file="$1" role="$2" db="$3"
            docker compose -f "$file" up -d --wait postgres
            cid="$(docker compose -f "$file" ps -q postgres)"
            image="$(docker inspect --format '{{.Config.Image}}' "$cid")"
            user="$(docker image inspect --format '{{.Config.User}}' "$image")"
            echo "${file}: built and started ${image}, whose user is '${user}'"
            if [ "$user" != "70:70" ]; then
              echo "::error::${image} (${file}) runs as '${user}', not 70:70"
              exit 1
            fi
            # The healthcheck asks the socket, which the entrypoint's first,
            # temporary server answers too while it initialises the new volume.
            # TCP is the server that stays.
            for attempt in $(seq 1 60); do
              if docker compose -f "$file" exec -T postgres pg_isready -q -h localhost -U "$role" -d "$db"; then
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                echo "::error::${file}'s Postgres did not listen on TCP within a minute of being healthy"
                exit 1
              fi
              sleep 1
            done
            docker compose -f "$file" exec -T postgres sh -euc '
              server="$(awk "/^Uid:/ { print \$2 }" /proc/1/status)"
              data="$(stat -c %u "$PGDATA")"
              echo "exec: uid $(id -u); server: uid ${server}; ${PGDATA}: uid ${data}"
              if [ "$(id -u)" != 70 ]; then echo "exec runs as uid $(id -u), not 70" >&2; exit 1; fi
              if [ "$server" != 70 ]; then echo "the server runs as uid ${server}, not 70" >&2; exit 1; fi
              if [ "$data" != 70 ]; then echo "${PGDATA} belongs to uid ${data}, not 70" >&2; exit 1; fi
              if [ -e /usr/local/bin/gosu ]; then echo "/usr/local/bin/gosu is still in the image" >&2; exit 1; fi
            '
            docker compose -f "$file" exec -T postgres psql -U "$role" -d "$db" -Atc 'select current_user, version()'
          }
          # The volume an appliance that ran the official image has: the
          # Dockerfile's own FROM, gosu and all, started as root on the volume
          # the compose file mounts, initialises it as every appliance's was,
          # and leaves a row in it. The labels are the ones compose gives its
          # own volumes, so `up` takes it as the appliance's and `down -v`
          # removes it.
          root_initialised() {
            local file="$1" role="$2" db="$3"
            base="$(awk '/^FROM / { print $2 }' "$(dirname "$file")/postgres/Dockerfile")"
            project="$(docker compose -f "$file" config --format json | jq -r '.name')"
            volume="$(docker compose -f "$file" config --format json | jq -r '.volumes.pgdata.name')"
            docker volume create --label "com.docker.compose.project=${project}" --label com.docker.compose.volume=pgdata "$volume"
            docker run -d --name root-initialised -e POSTGRES_USER="$role" -e POSTGRES_PASSWORD="$BUILD_CHECK_POSTGRES_PASSWORD" -e POSTGRES_DB="$db" -v "${volume}:/var/lib/postgresql" "$base"
            # TCP: the entrypoint's temporary server, while it initialises, listens on the socket only.
            for attempt in $(seq 1 60); do
              if docker exec root-initialised pg_isready -q -h localhost -U "$role" -d "$db"; then
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                echo "::error::${base} did not initialise ${volume} as root within a minute"
                exit 1
              fi
              sleep 1
            done
            docker exec root-initialised sh -euc 'echo "as root: ${PGDATA} uid $(stat -c %u "$PGDATA"), $(dirname "$PGDATA") uid $(stat -c %u "$(dirname "$PGDATA")")"'
            docker exec root-initialised psql -v ON_ERROR_STOP=1 -U "$role" -d "$db" -c 'create table before_the_build (note text)' -c "insert into before_the_build values ('written as root')"
            docker stop root-initialised
            docker rm root-initialised
          }
          # What root_initialised wrote, read by the build that started on its volume.
          read_back() {
            local file="$1" role="$2" db="$3"
            note="$(docker compose -f "$file" exec -T postgres psql -U "$role" -d "$db" -Atc 'select note from before_the_build')"
            if [ "$note" != "written as root" ]; then
              echo "::error::${file}'s postgres, started as uid 70 on a volume initialised as root, read '${note}', not the row written there"
              exit 1
            fi
            echo "${file}: the row written as root reads back as uid 70"
          }
          prove "$COMPOSE_FILE_PATH" ownpace ownpace
          root_initialised "$SELFHOST_COMPOSE_FILE" openmigrate openmigrate
          prove "$SELFHOST_COMPOSE_FILE" openmigrate openmigrate
          read_back "$SELFHOST_COMPOSE_FILE" openmigrate openmigrate

      - name: The databases' logs, when one did not come up
        if: failure()
        run: |
          docker logs root-initialised || true
          docker compose -f "$COMPOSE_FILE_PATH" logs --no-color postgres || true
          docker compose -f "$SELFHOST_COMPOSE_FILE" logs --no-color postgres || true

      - name: Remove the containers and their volumes
        if: always()
        run: |
          docker rm -f root-initialised || true
          docker compose -f "$COMPOSE_FILE_PATH" down -v --remove-orphans
          docker compose -f "$SELFHOST_COMPOSE_FILE" down -v --remove-orphans

  # THE POOLER BUILT HERE, ON BOTH PLATFORMS, ON A PULL REQUEST (workplan 0119,
  # 2026-11-13, for alpha.8). managed.yml's pgbouncer runs
  # `localhost/pgbouncer:<tag>-<hash>`, which compose builds on the machine
  # from deploy/compose/pgbouncer: edoburu's image at its pinned digest, with
  # five Alpine packages at the versions that carry their fixes. Nothing
  # publishes it, so the matrix above never builds it, and without this job
  # the first build of a pull request that moved it would be the branch's E2E
  # (managed). The packages are Alpine's builds for each platform, so both
  # build, natively: the box is arm64, GitHub's runners amd64. This job is
  # also where it shows that Alpine's mirror serves the versions the
  # Dockerfile names, to both.
  #
  # It builds the directory under the name managed.yml gives it, whose own
  # RUNs take the five at their exact versions, refuse a base that carries one
  # already and anything else that moved, and start pgbouncer and psql as
  # upstream's user. It checks the image's user, entrypoint, command, working
  # directory, ports and environment are upstream's. Then it starts the image
  # as managed.yml runs pgbouncer: read-only, /tmp in memory, every capability
  # dropped, no-new-privileges, managed.yml's pgbouncer.ini mounted where the
  # pooler reads it, and a userlist with a password made here. No database is
  # behind it, and none is needed: it asks the pooler's own admin console,
  # with the command managed.yml's healthcheck runs, word for word. Then it
  # reads the five from the running image's package database, at the versions
  # the Dockerfile names; process 1 must be pgbouncer, as uid 70; and SHOW
  # POOLS must list the console's own pool. The job exits with the verdict of
  # every check, and the guard runs this step against a stub docker that
  # answers each check wrongly in turn. On a pull request only, publishing
  # nothing. Held by scripts/a-rebuild-upstream-has-not-made.unit.test.ts.
  pgbouncer:
    name: build (pgbouncer, ${{ matrix.arch }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the pooler as managed.yml names it, and ask it as its healthcheck does
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          # The reference compose builds, read from managed.yml's one image line for it, the base its Dockerfile names, and the packages its RUN names.
          ref="$(sed -n 's/^[[:space:]]*image:[[:space:]]*\(localhost\/pgbouncer:[^[:space:]]*\)[[:space:]]*$/\1/p' deploy/compose/managed.yml)"
          if [ -z "$ref" ] || [ "$(wc -l <<<"$ref")" != 1 ]; then
            echo "::error::managed.yml names no single localhost/pgbouncer image: '${ref}'"
            exit 1
          fi
          base="$(sed -n 's/^FROM[[:space:]]\{1,\}\(edoburu\/pgbouncer:[^[:space:]]*\)[[:space:]]*$/\1/p' deploy/compose/pgbouncer/Dockerfile)"
          if [ -z "$base" ] || [ "$(wc -l <<<"$base")" != 1 ]; then
            echo "::error::deploy/compose/pgbouncer/Dockerfile names no single edoburu/pgbouncer FROM: '${base}'"
            exit 1
          fi
          pins="$(sed -n 's/^[[:space:]]*for pin in \(.*\); do \\$/\1/p' deploy/compose/pgbouncer/Dockerfile)"
          if [ -z "$pins" ] || [ "$(wc -l <<<"$pins")" != 1 ]; then
            echo "::error::deploy/compose/pgbouncer/Dockerfile names no single list of packages: '${pins}'"
            exit 1
          fi
          echo "::group::${ref}: deploy/compose/pgbouncer on ${base}"
          docker pull --quiet "$base"
          docker build --pull --progress=plain --tag "$ref" deploy/compose/pgbouncer
          echo "::endgroup::"
          # The image's configuration is upstream's: its user above all, and what it starts.
          for field in User Entrypoint Cmd WorkingDir ExposedPorts Env; do
            built="$(docker image inspect --format "{{json .Config.${field}}}" "$ref")"
            upstream="$(docker image inspect --format "{{json .Config.${field}}}" "$base")"
            if [ "$built" != "$upstream" ]; then
              echo "::error::${ref}'s ${field} is ${built}, and upstream's is ${upstream}: the build must keep the image's configuration"
              exit 1
            fi
          done
          platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$ref")"
          if [ "$platform" != "linux/${ARCH}" ]; then
            echo "::error::${ref} is ${platform}, not linux/${ARCH}: this leg did not take its own platform's packages"
            exit 1
          fi
          # A userlist as ensure-env-secrets.sh writes it, with a password made here.
          password="$(openssl rand -hex 16)"
          printf '"pgbouncer_auth" "%s"\n' "$password" > "$RUNNER_TEMP/userlist.txt"
          chmod 644 "$RUNNER_TEMP/userlist.txt"
          # As managed.yml runs pgbouncer: read-only, /tmp in memory, no capability, no new privileges.
          docker run -d --name pooler-built \
            --read-only --tmpfs /tmp \
            --security-opt no-new-privileges:true --cap-drop ALL \
            -e PGBOUNCER_AUTH_PASSWORD="$password" \
            -v "$PWD/deploy/compose/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro" \
            -v "$RUNNER_TEMP/userlist.txt:/etc/pgbouncer/userlist.txt:ro" \
            "$ref" >/dev/null
          # managed.yml's healthcheck, word for word, until it passes or 30 seconds are gone.
          healthcheck="PGPASSWORD=\${PGBOUNCER_AUTH_PASSWORD} psql -h 127.0.0.1 -p 6432 -U pgbouncer_auth -d pgbouncer -c 'SHOW POOLS' >/dev/null 2>&1 || exit 1"
          healthy=no
          for attempt in $(seq 1 30); do
            if docker exec pooler-built sh -c "$healthcheck"; then
              healthy=yes
              break
            fi
            sleep 1
          done
          if [ "$healthy" != yes ]; then
            echo "::error::the pooler did not pass managed.yml's healthcheck within 30 seconds"
            exit 1
          fi
          # The five packages, as the running image's package database has them.
          have="$(docker exec pooler-built awk '/^P:/ { name = substr($0, 3) } /^V:/ { print name "=" substr($0, 3) }' /lib/apk/db/installed || true)"
          for pin in $pins; do
            if ! grep -qxF "$pin" <<<"$have"; then
              echo "::error::${ref} does not carry ${pin}, which its Dockerfile names"
              exit 1
            fi
          done
          # Process 1 is the pooler, as upstream's user: the entrypoint handed over to its command.
          uid="$(docker exec pooler-built awk '/^Uid:/ { print $2 }' /proc/1/status || true)"
          comm="$(docker exec pooler-built cat /proc/1/comm || true)"
          if [ "$uid" != 70 ] || [ "$comm" != pgbouncer ]; then
            echo "::error::process 1 is '${comm}' as uid '${uid}', not pgbouncer as uid 70, upstream's postgres"
            exit 1
          fi
          # SHOW POOLS' rows, as E2E (managed) reads them: the admin console's own pool is always one.
          pools="$(docker exec pooler-built sh -c 'PGPASSWORD="$PGBOUNCER_AUTH_PASSWORD" psql -X -h 127.0.0.1 -p 6432 -U pgbouncer_auth -d pgbouncer -tAc "SHOW POOLS"' || true)"
          if ! grep -q '^pgbouncer|' <<<"$pools"; then
            echo "::error::SHOW POOLS did not list the admin console's own pool: '${pools}'"
            exit 1
          fi
          client="$(docker exec pooler-built psql --version || true)"
          echo "${ref}: ${platform}, $(docker image inspect --format '{{.Id}}, user {{.Config.User}}' "$ref"); ${pins}; process 1 is ${comm} as uid ${uid}, and ${client} asked it"

      - name: The pooler's log, when it did not come up as it should
        if: failure()
        run: docker logs pooler-built || true

      - name: Remove the pooler
        if: always()
        run: docker rm -f pooler-built || true
