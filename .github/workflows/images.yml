name: Images

# ==============================================================================
# Builds and publishes the three application images (0025 T1) — the workflow
# that makes `ghcr.io/robbes/ownpace-selfhost:edge` (the compose default)
# an image something actually produces, instead of a name that resolves to
# nothing.
#
#   - Pull requests touching the Dockerfiles, deploy/, or this workflow BUILD
#     ONLY (no push, no registry login) on linux/amd64 — the rule-8 self-proof
#     kept fast. Multi-arch under QEMU costs tens of minutes per image and
#     belongs on the publish path, not on every PR.
#   - Pushes to main build linux/amd64 + linux/arm64 (SAD §22) and publish the
#     `edge` channel + a `sha-<commit>` tag.
#   - Tags `v*` publish the semver tags. **A PRE-RELEASE DOES NOT TAKE
#     `latest`** — metadata-action's default `latest=auto` withholds it from
#     any semver tag carrying a pre-release suffix, so `v0.1.0-rc.1` publishes
#     `0.1.0-rc.1` and nothing else. That is the behaviour the CHANGELOG tells
#     people to rely on when it says to pin the explicit tag or a digest; this
#     comment claimed the opposite until 2026-08-04, which is the direction
#     that would have hurt — a reader would expect a release candidate to
#     become the default anyone pulling `latest` gets.
#     This path has never run until the first release is cut (0025 T2, an
#     owner decision).
#
# Credentials: GITHUB_TOKEN only (packages: write) — no stored secrets
# (hard rule 3). The first main-branch run is the multi-arch shakedown.
# Registry cache keeps the QEMU cost bounded after that first run.
# ==============================================================================

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'apps/api/Dockerfile'
      - 'apps/web/Dockerfile'
      - 'apps/selfhost/Dockerfile'
      - 'deploy/**'
      - '.github/workflows/images.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write
  # Cosign keyless signing (0025 T3): the OIDC token IS the identity — no
  # stored key material anywhere (rule 3), the signature binds this repo's
  # workflow identity to the image digest via the public Sigstore log.
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [api, web, selfhost]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # THE TAG, THE VERSION AND THE CHANGELOG NAME ONE RELEASE (workplan 0146
      # T2), checked before anything below builds or pushes. Without it, a tag
      # pushed before the version bump would publish images tagged with the new
      # version whose `/version` answers the previous one. On a tag only: a
      # branch or a pull request runs exactly as before. The fetch lets the
      # check see the releases already tagged, since this checkout is shallow
      # and holds only the tag being cut. See scripts/release-names-agree.mjs.
      - name: The tag, package.json and the changelog name one release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags --depth=1 origin '+refs/tags/v*:refs/tags/v*'
          node scripts/release-names-agree.mjs

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: github.event_name != 'pull_request'

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # metadata-action lowercases the name, which ghcr requires.
          images: ghcr.io/${{ github.repository_owner }}/ownpace-${{ matrix.image }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=ownpace-${{ matrix.image }}
            org.opencontainers.image.licenses=Apache-2.0

      # ---------------------------------------------------------------------
      # Build, and retry ONCE if ghcr refuses the push.
      #
      # Observed on main at 85eb64f (2026-08-18): every layer built and pushed,
      # and the manifest push came back
      #
      #   403 permission_denied … "You have exceeded a secondary rate limit."
      #
      # That is not a permission problem despite the word, and not a problem
      # with the image. Three pull requests merged inside forty minutes, each
      # firing this workflow's three-image matrix at multi-arch, is nine
      # manifest pushes to ghcr in a short window — and GitHub's secondary
      # limits are per-window, so the ninth is the one that loses.
      #
      # The retry is cheap: the first attempt exported and cached every layer,
      # so the second is a manifest push, not a rebuild. The wait is long
      # because a secondary limit is a window and hammering it immediately
      # extends the window rather than clearing it.
      #
      # DUPLICATED ON PURPOSE, and it is the weak point of this: GitHub Actions
      # has no YAML anchors and `uses:` cannot be wrapped in a shell retry, so
      # the two blocks must be kept identical BY HAND. Change one, change the
      # other. (Same shape as the cosign retry below, for the same reason: an
      # external service that is fine ten seconds later.)
      # ---------------------------------------------------------------------
      - name: Build${{ github.event_name != 'pull_request' && ' + push' || '' }}
        id: build_attempt
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          # The /version endpoints report this commit (build-identity.ts).
          build-args: |
            GIT_SHA=${{ github.sha }}
          # PRs prove the Dockerfile builds; the publish path proves multi-arch.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry-backed layer cache: the second multi-arch build reuses the
          # first's layers instead of re-paying the QEMU cost every merge.
          # Lowercase literal (ghcr requires it): metadata-action lowercases
          # the image name above, but these raw refs would keep "Robbes" —
          # the same reason compose.yml hardcodes ghcr.io/robbes/….
          cache-from: type=registry,ref=ghcr.io/robbes/ownpace-${{ matrix.image }}:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref=ghcr.io/robbes/ownpace-{0}:buildcache,mode=max', matrix.image) || '' }}

      # Only on the publish path. A pull request builds without pushing, so it
      # cannot hit a registry rate limit — retrying a genuinely broken
      # Dockerfile there would just cost every PR author two minutes before
      # telling them the same thing.
      - name: Wait out the rate-limit window
        if: steps.build_attempt.outcome == 'failure' && github.event_name != 'pull_request'
        run: |
          echo "::warning::First push attempt failed. If this was a ghcr secondary rate limit,"
          echo "::warning::the retry after this wait normally succeeds. Full reason is in the step above."
          sleep 120

      - name: Retry the build + push
        id: build_retry
        if: steps.build_attempt.outcome == 'failure' && github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          # The /version endpoints report this commit (build-identity.ts).
          build-args: |
            GIT_SHA=${{ github.sha }}
          # PRs prove the Dockerfile builds; the publish path proves multi-arch.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry-backed layer cache: the second multi-arch build reuses the
          # first's layers instead of re-paying the QEMU cost every merge.
          # Lowercase literal (ghcr requires it): metadata-action lowercases
          # the image name above, but these raw refs would keep "Robbes" —
          # the same reason compose.yml hardcodes ghcr.io/robbes/….
          cache-from: type=registry,ref=ghcr.io/robbes/ownpace-${{ matrix.image }}:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref=ghcr.io/robbes/ownpace-{0}:buildcache,mode=max', matrix.image) || '' }}

      # Neither attempt is allowed to fail silently. `continue-on-error` above
      # makes the FIRST step green whatever happens, so without this the job
      # would pass on a failed push — the exact "skipped is not passed" trap
      # AGENTS.md hard rule 9 exists for.
      # On a pull request the retry is skipped, so `outcome` is 'skipped' rather
      # than 'success' and this still fires — a broken Dockerfile fails the PR
      # immediately, which is the point of building it there.
      - name: Fail if the build did not succeed
        if: steps.build_attempt.outcome == 'failure' && steps.build_retry.outcome != 'success'
        run: |
          echo "::error::ownpace-${{ matrix.image }} did not build/publish."
          echo "If the reason was a ghcr secondary rate limit, re-run this job in a few minutes."
          echo "If it was anything else, the reason is in the build step's log above."
          exit 1

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Named, not left to the installer's default: Dependabot moves the
          # installer and nothing moves this, so the pin watch compares it
          # with cosign's newest (idp-pin-watch.mjs). The same release as
          # release.yml's verify job, which checks what this signs; the two
          # move together.
          cosign-release: 'v3.1.4'

      - name: Sign the published image (keyless, by digest)
        if: github.event_name != 'pull_request'
        # The DIGEST, not a tag: one signature covers every tag pointing at
        # this manifest, and a later retag cannot claim the signature. `--yes`
        # accepts the transparency-log upload — publishing to the public
        # Sigstore log is the point, not a side effect. Failing loud is the
        # contract (rule 9): a publish whose signing step soft-failed would be
        # the pipeline lying about what it shipped.
        #
        # Retried because the dependency is somebody else's public good.
        # Run 206 (2026-08-18) went red here on `POST
        # https://rekor.sigstore.dev/api/v1/log/entries: giving up after 2
        # attempt(s)` — for the `web` image only, while `api` and `selfhost`
        # signed the same commit seconds apart. Same code, same step, one of
        # three: a Rekor blip, not a defect. cosign's own retry is those two
        # attempts within a few seconds, which a short outage outlasts.
        #
        # It still exits non-zero after the third try, and that matters more
        # than the retry does: **push happens in the step above**, so a red run
        # here does NOT unpublish anything. `:edge` is live and unsigned, and
        # `cosign verify` — which deploy/selfhost/README.md tells operators to
        # run — fails against it until this step succeeds. Red means "re-run
        # this job", not "nothing shipped".
        run: |
          # Whichever attempt actually published — the retry step's output is
          # empty when it was skipped, and `||` takes the first non-empty. An
          # empty digest would make `ref` end in a bare `@` and cosign would
          # fail on a malformed reference, so refuse here with the reason
          # rather than there with a parse error.
          digest="${{ steps.build_retry.outputs.digest || steps.build_attempt.outputs.digest }}"
          if [ -z "$digest" ]; then
            echo "::error::No image digest from either build attempt — nothing was published, so there is nothing to sign."
            exit 1
          fi
          ref="ghcr.io/robbes/ownpace-${{ matrix.image }}@${digest}"
          for attempt in 1 2 3; do
            if cosign sign --yes "$ref"; then
              echo "signed on attempt ${attempt}"
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              delay=$(( attempt * 30 ))
              echo "::warning::cosign sign failed (attempt ${attempt}/3), retrying in ${delay}s"
              sleep "${delay}"
            fi
          done
          echo "::error::cosign sign failed three times — ${ref} is PUBLISHED AND UNSIGNED. Re-run this job once Sigstore is healthy (https://status.sigstore.dev); the digest is stable, so a later run signs the same image."
          exit 1

  # THE DATABASES' IMAGES, BUILT AND STARTED ON A PULL REQUEST (workplan 0146
  # T15; the review of #1717, 2026-10-26; the appliance's since T15b, the same
  # day). managed.yml's postgres and trigger-db, and dev.yml's postgres, run
  # `localhost/postgres:<tag>`, which compose builds on the machine from
  # deploy/compose/postgres/Dockerfile; the appliance's postgres
  # (deploy/selfhost/compose.yml) runs its own, from
  # deploy/selfhost/postgres/Dockerfile. Nothing publishes either, so the
  # matrix above never builds them. Before this job the first build of a pull
  # request that moved a FROM was the branch's E2E: a digest that does not
  # resolve, or a base that no longer ships gosu (the plain `rm` fails the
  # build on purpose), was found there.
  #
  # It brings up dev.yml's postgres, then the appliance's, each as compose does
  # on a machine without the image (`pull_policy: never`, so compose builds it
  # rather than asking a registry), and checks that `exec`, the server and the
  # data are uid 70 and that gosu is gone. dev.yml's starts on a new volume,
  # which initialises as uid 70. The appliance's starts on the volume every
  # existing appliance has (the review of T15b, 2026-10-26): one the official
  # image initialised as root, the Dockerfile's own FROM with gosu, which left
  # PGDATA uid 70's and /var/lib/postgresql/18 above it root's; the build must
  # start on it and read back the row written there. E2E (self-hosted) and its
  # backup and restore drill start the appliance on new volumes. On a pull
  # request only: on main and on a tag this workflow publishes, and this job has
  # nothing to publish. The arm64 builds are the weekly image scan's
  # (security-scan.yml), which counts the findings. Held by
  # scripts/a-database-started-as-root.unit.test.ts.
  database:
    name: build (postgres)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      COMPOSE_FILE_PATH: deploy/compose/dev.yml
      # dev.yml's published port, moved off anything the runner has on 5433.
      DEV_POSTGRES_PORT: '55433'
      # The appliance's, which publishes no database port.
      SELFHOST_COMPOSE_FILE: deploy/selfhost/compose.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The appliance's file refuses an unset POSTGRES_PASSWORD, and its app
      # names deploy/selfhost/.env as an env_file, without which compose will
      # not load the file at all, even for postgres alone (`env file … not
      # found`, compose v5.6.1, 2026-10-26). A throwaway for this runner gives
      # both, as scripts/upgrade-drill.sh does for its run.
      - name: A throwaway .env for the appliance's compose file
        run: printf 'POSTGRES_PASSWORD=build-check-only\n' > deploy/selfhost/.env

      - name: Compose builds each database's image where it is missing, and Postgres starts as uid 70
        run: |
          set -euo pipefail
          # One compose file's postgres, asked as its own role and database.
          prove() {
            local file="$1" role="$2" db="$3"
            docker compose -f "$file" up -d --wait postgres
            cid="$(docker compose -f "$file" ps -q postgres)"
            image="$(docker inspect --format '{{.Config.Image}}' "$cid")"
            user="$(docker image inspect --format '{{.Config.User}}' "$image")"
            echo "${file}: built and started ${image}, whose user is '${user}'"
            if [ "$user" != "70:70" ]; then
              echo "::error::${image} (${file}) runs as '${user}', not 70:70"
              exit 1
            fi
            # The healthcheck asks the socket, which the entrypoint's first,
            # temporary server answers too while it initialises the new volume.
            # TCP is the server that stays.
            for attempt in $(seq 1 60); do
              if docker compose -f "$file" exec -T postgres pg_isready -q -h localhost -U "$role" -d "$db"; then
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                echo "::error::${file}'s Postgres did not listen on TCP within a minute of being healthy"
                exit 1
              fi
              sleep 1
            done
            docker compose -f "$file" exec -T postgres sh -euc '
              server="$(awk "/^Uid:/ { print \$2 }" /proc/1/status)"
              data="$(stat -c %u "$PGDATA")"
              echo "exec: uid $(id -u); server: uid ${server}; ${PGDATA}: uid ${data}"
              if [ "$(id -u)" != 70 ]; then echo "exec runs as uid $(id -u), not 70" >&2; exit 1; fi
              if [ "$server" != 70 ]; then echo "the server runs as uid ${server}, not 70" >&2; exit 1; fi
              if [ "$data" != 70 ]; then echo "${PGDATA} belongs to uid ${data}, not 70" >&2; exit 1; fi
              if [ -e /usr/local/bin/gosu ]; then echo "/usr/local/bin/gosu is still in the image" >&2; exit 1; fi
            '
            docker compose -f "$file" exec -T postgres psql -U "$role" -d "$db" -Atc 'select current_user, version()'
          }
          # The volume an appliance that ran the official image has: the
          # Dockerfile's own FROM, gosu and all, started as root on the volume
          # the compose file mounts, initialises it as every appliance's was,
          # and leaves a row in it. The labels are the ones compose gives its
          # own volumes, so `up` takes it as the appliance's and `down -v`
          # removes it.
          root_initialised() {
            local file="$1" role="$2" db="$3"
            base="$(awk '/^FROM / { print $2 }' "$(dirname "$file")/postgres/Dockerfile")"
            project="$(docker compose -f "$file" config --format json | jq -r '.name')"
            volume="$(docker compose -f "$file" config --format json | jq -r '.volumes.pgdata.name')"
            docker volume create --label "com.docker.compose.project=${project}" --label com.docker.compose.volume=pgdata "$volume"
            docker run -d --name root-initialised -e POSTGRES_USER="$role" -e POSTGRES_PASSWORD=build-check-only -e POSTGRES_DB="$db" -v "${volume}:/var/lib/postgresql" "$base"
            # TCP: the entrypoint's temporary server, while it initialises, listens on the socket only.
            for attempt in $(seq 1 60); do
              if docker exec root-initialised pg_isready -q -h localhost -U "$role" -d "$db"; then
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                echo "::error::${base} did not initialise ${volume} as root within a minute"
                exit 1
              fi
              sleep 1
            done
            docker exec root-initialised sh -euc 'echo "as root: ${PGDATA} uid $(stat -c %u "$PGDATA"), $(dirname "$PGDATA") uid $(stat -c %u "$(dirname "$PGDATA")")"'
            docker exec root-initialised psql -v ON_ERROR_STOP=1 -U "$role" -d "$db" -c 'create table before_the_build (note text)' -c "insert into before_the_build values ('written as root')"
            docker stop root-initialised
            docker rm root-initialised
          }
          # What root_initialised wrote, read by the build that started on its volume.
          read_back() {
            local file="$1" role="$2" db="$3"
            note="$(docker compose -f "$file" exec -T postgres psql -U "$role" -d "$db" -Atc 'select note from before_the_build')"
            if [ "$note" != "written as root" ]; then
              echo "::error::${file}'s postgres, started as uid 70 on a volume initialised as root, read '${note}', not the row written there"
              exit 1
            fi
            echo "${file}: the row written as root reads back as uid 70"
          }
          prove "$COMPOSE_FILE_PATH" ownpace ownpace
          root_initialised "$SELFHOST_COMPOSE_FILE" openmigrate openmigrate
          prove "$SELFHOST_COMPOSE_FILE" openmigrate openmigrate
          read_back "$SELFHOST_COMPOSE_FILE" openmigrate openmigrate

      - name: The databases' logs, when one did not come up
        if: failure()
        run: |
          docker logs root-initialised || true
          docker compose -f "$COMPOSE_FILE_PATH" logs --no-color postgres || true
          docker compose -f "$SELFHOST_COMPOSE_FILE" logs --no-color postgres || true

      - name: Remove the containers and their volumes
        if: always()
        run: |
          docker rm -f root-initialised || true
          docker compose -f "$COMPOSE_FILE_PATH" down -v --remove-orphans
          docker compose -f "$SELFHOST_COMPOSE_FILE" down -v --remove-orphans

  # THE TRIGGER.DEV IMAGES BUILT HERE, ON BOTH PLATFORMS, ON A PULL REQUEST
  # (workplan 0146 T16). managed.yml's trigger-api and trigger-supervisor run
  # `localhost/trigger.dev:…` and `localhost/supervisor:…`, which compose
  # builds on the machine from deploy/compose/trigger.dev and
  # deploy/compose/supervisor: upstream's image by tag and digest, with files
  # deleted that never run here. Each removal names a version-locked path and
  # fails the build by name when the path is not there, and each Dockerfile
  # refuses another release than its read_at, so a Trigger.dev move
  # (`trigger-version.sh pin`) is red here until the Dockerfiles are read
  # again. The paths differ by platform (@depot/cli-linux-x64 or -arm64), so
  # both build, natively: the box is arm64, GitHub's runners amd64, and this
  # is the one place the amd64 paths are proven.
  #
  # WHO RUNS PNPM IS UPSTREAM'S TOO. Which copy of pnpm each Dockerfile may
  # delete follows the user that runs it: managed.yml's `user:`, and the
  # base's user, command and entrypoint. The Dockerfiles pin the entrypoint
  # scripts by hash; this checks the base's configuration is the one their
  # headers read (and managed.yml's trigger-api command repeats the
  # webapp's), before the build, so a release that runs the supervisor as
  # root, or starts the webapp another way, fails here by name.
  #
  # Built with `docker build`, not compose: managed.yml refuses to load
  # without the stack's secrets (its `:?` variables). The reference, the
  # directory and the base are read with the pin watch's own reader, and the
  # version argument is managed.yml's default, so the build's version check
  # runs. No Trivy here: Trivy does not see a hard-linked second name (the
  # Dockerfile's header), so the build's own check that no depot or esbuild
  # binary is left is the stronger proof; the weekly and dispatched image
  # scan counts what is left, on arm64. On a pull request only, publishing
  # nothing. Held by scripts/a-binary-the-stack-never-runs.unit.test.ts.
  trigger:
    name: build (trigger, ${{ matrix.arch }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          check-latest: true # the newest 26.x, not the first one in the runner's tool cache

      - name: Build both Trigger.dev images as managed.yml names them, and keep upstream's configuration
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          # The pin, read as trigger-version.sh's repo_tag reads it.
          all="$(grep -oE '\$\{TRIGGER_IMAGE_TAG:-v[^}]+\}' deploy/compose/managed.yml)"
          pin="$(sed 's/.*:-//;s/}//' <<<"$(head -1 <<<"$all")")"
          # Each build's reference, directory and FROM, by the pin watch's reader.
          builds="$(node -e '
            import("./scripts/idp-pin-watch.mjs").then(({ COMPOSE, TRIGGER_BUILDS, builtImage, readImages, repoReader }) => {
              const repo = repoReader(".");
              for (const line of readImages(repo.read(COMPOSE))) {
                if (!(line.repo in TRIGGER_BUILDS)) continue;
                const built = builtImage(repo, COMPOSE, line);
                console.log([line.ref, built.context, built.base.ref].join(" "));
              }
            });
          ')"
          count="$(grep -c . <<<"$builds" || true)"
          if [ "$count" != 2 ]; then
            echo "::error::managed.yml names ${count} Trigger.dev builds, not the two this job builds: ${builds}"
            exit 1
          fi
          while read -r ref context base; do
            echo "::group::${ref}: ${context} on ${base}, TRIGGER_IMAGE_TAG=${pin}"
            docker pull --quiet "$base"
            # User, Cmd and Entrypoint as each Dockerfile's header read them.
            case "$ref" in
              localhost/trigger.dev:*) want='"node" ["./scripts/entrypoint.sh"] ["docker-entrypoint.sh"]' ;;
              localhost/supervisor:*) want='"node" ["pnpm","run","--filter","supervisor","start"] ["/app/entrypoint.sh"]' ;;
              *) echo "::error::${ref} is no build this job knows the configuration of"; exit 1 ;;
            esac
            have="$(docker image inspect --format '{{json .Config.User}} {{json .Config.Cmd}} {{json .Config.Entrypoint}}' "$base")"
            if [ "$have" != "$want" ]; then
              echo "::error::${base} runs ${have} (user, command, entrypoint), and ${context}/Dockerfile was read for ${want}: which copy of pnpm it may delete follows who runs pnpm. Read its header's user coupling again"
              exit 1
            fi
            docker build --pull --build-arg "TRIGGER_IMAGE_TAG=${pin}" --tag "$ref" "$context"
            echo "::endgroup::"
            for field in User Cmd Entrypoint WorkingDir; do
              built="$(docker image inspect --format "{{json .Config.${field}}}" "$ref")"
              upstream="$(docker image inspect --format "{{json .Config.${field}}}" "$base")"
              if [ "$built" != "$upstream" ]; then
                echo "::error::${ref}'s ${field} is ${built}, and upstream's is ${upstream}: the build must keep the image's configuration"
                exit 1
              fi
            done
            platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$ref")"
            if [ "$platform" != "linux/${ARCH}" ]; then
              echo "::error::${ref} is ${platform}, not linux/${ARCH}: this leg did not build its own platform's paths"
              exit 1
            fi
            echo "${ref}: ${platform}, $(docker image inspect --format '{{.Id}}, user {{.Config.User}}' "$ref")"
          done <<<"$builds"

  # THE DOCKER SOCKET PROXY BUILT HERE, ON A PULL REQUEST (workplan 0119,
  # 2026-10-30). managed.yml's trigger-docker-proxy runs
  # `localhost/docker-socket-proxy:<tag>-<hash>`, which compose builds on the
  # machine from deploy/compose/docker-socket-proxy: Tecnativa's
  # docker-socket-proxy v0.5.0, its files byte for byte, on the newest HAProxy
  # of the line that release chose. Nothing publishes it, so the matrix above
  # never builds it, and without this job the first build of a pull request
  # that moved its FROM would be the branch's E2E (managed).
  #
  # It builds the directory under the name managed.yml gives it, checks the
  # image's user, entrypoint and command are upstream's, and starts it on this
  # runner's Docker socket, read-only, with the environment managed.yml sets.
  # Then it asks it, as the supervisor would over DOCKER_HOST, for what the
  # supervisor uses (containers, images, networks, volumes, a POST to a
  # container that does not exist): Docker must answer each, whatever it
  # answers, and the answer must carry the Api-Version header Docker sets on
  # every response, so that HAProxy's own 403, or its 503 when the socket stops
  # answering, never counts as Docker's. And for every endpoint switch
  # upstream's v0.5.0 leaves off and managed.yml does not turn on (auth, build,
  # commit, configs, distribution, exec, grpc, info, nodes, plugins, secrets,
  # services, session, swarm, the system, tasks): the proxy must answer 403
  # itself, without that header. The job exits with the verdict of every
  # probe, and the guard runs this script against a stub that answers each
  # probe wrongly in turn. A FROM that does not resolve, a file whose SHA-256
  # is not the one the Dockerfile names, an entrypoint without its executable
  # bit, or a HAProxy that reads the configuration another way fails here by
  # name. The address is the runner's own loopback, and the probes create,
  # start and remove nothing. On a pull request only, publishing nothing. Held
  # by scripts/a-tag-upstream-never-rebuilds.unit.test.ts.
  socket-proxy:
    name: build (docker-socket-proxy)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the Docker socket proxy as managed.yml names it, and ask it what it allows and refuses
        run: |
          set -euo pipefail
          # The reference compose builds, read from managed.yml's one image line for it.
          ref="$(sed -n 's/^[[:space:]]*image:[[:space:]]*\(localhost\/docker-socket-proxy:[^[:space:]]*\)[[:space:]]*$/\1/p' deploy/compose/managed.yml)"
          if [ -z "$ref" ] || [ "$(wc -l <<<"$ref")" != 1 ]; then
            echo "::error::managed.yml names no single localhost/docker-socket-proxy image: '${ref}'"
            exit 1
          fi
          docker build --pull --progress=plain --tag "$ref" deploy/compose/docker-socket-proxy
          have="$(docker image inspect --format '{{json .Config.User}} {{json .Config.Entrypoint}} {{json .Config.Cmd}}' "$ref")"
          want='"root" ["docker-entrypoint.sh"] ["haproxy","-f","/tmp/haproxy.cfg"]'
          if [ "$have" != "$want" ]; then
            echo "::error::${ref} runs ${have} (user, entrypoint, command), and upstream's v0.5.0 runs ${want}"
            exit 1
          fi
          # managed.yml's environment and socket for trigger-docker-proxy, as they are there.
          docker run -d --name socket-proxy \
            -e CONTAINERS=1 -e IMAGES=1 -e NETWORKS=1 -e VOLUMES=1 -e POST=1 \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -p 127.0.0.1:2375:2375 "$ref"
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null --max-time 2 http://127.0.0.1:2375/_ping; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::${ref} did not answer /_ping within 30 seconds"
              exit 1
            fi
            sleep 1
          done
          # Who answered a request, and how: its HTTP status, then the Api-Version
          # header, which Docker sets on every response it writes, its errors
          # among them. HAProxy's own answers carry none: its 403, and the 400,
          # 408, 500, 502, 503 and 504 its errorfiles write when a request is
          # malformed or the socket does not answer. curl writes 000 when
          # nothing answered, and nothing for a header that is not there.
          answer() {
            curl -sS -o /dev/null -w '%{http_code} %header{api-version}' --max-time 10 -X "$1" "http://127.0.0.1:2375$2" || true
          }
          failed=0
          # What the supervisor uses under managed.yml's environment: Docker's answer, whatever it is.
          for probe in \
            "GET /_ping" "GET /version" "GET /containers/json" "GET /v1.43/containers/json" \
            "GET /images/json" "GET /networks" "GET /volumes" \
            "POST /containers/socket-proxy-probe-none/stop" "POST /networks/socket-proxy-probe-none/connect"; do
            read -r method path <<<"$probe"
            read -r code version <<<"$(answer "$method" "$path")"
            if [ -z "$version" ]; then
              echo "::error::${probe}: ${code} without Api-Version, the proxy's own answer, and the supervisor needs Docker's here"
              failed=1
            else
              echo "allowed: ${probe} -> ${code} (Docker's answer, API ${version})"
            fi
          done
          # One request for each endpoint switch upstream's v0.5.0 leaves off and managed.yml does not turn on: the proxy's own 403.
          for probe in \
            "POST /auth" "POST /build" "POST /commit" "GET /configs" \
            "GET /distribution/socket-proxy-probe-none/json" \
            "GET /exec/socket-proxy-probe-none/json" "POST /exec/socket-proxy-probe-none/start" \
            "GET /grpc" "GET /info" "GET /nodes" "GET /plugins" "GET /secrets" "GET /services" \
            "GET /session" "GET /swarm" "GET /system/df" "GET /tasks"; do
            read -r method path <<<"$probe"
            read -r code version <<<"$(answer "$method" "$path")"
            if [ "$code" != 403 ] || [ -n "$version" ]; then
              echo "::error::${probe}: ${code}${version:+ from Docker (Api-Version ${version})}, and upstream's v0.5.0 refuses it with the proxy's own 403 under managed.yml's environment"
              failed=1
            else
              echo "refused: ${probe} -> 403 (the proxy's own)"
            fi
          done
          echo "${ref}: $(docker image inspect --format '{{.Os}}/{{.Architecture}} {{.Id}}' "$ref")"
          exit "$failed"

      - name: The proxy's log, when it did not answer as it should
        if: failure()
        run: docker logs socket-proxy || true

      - name: Remove the proxy
        if: always()
        run: docker rm -f socket-proxy || true

  # THE DASHBOARD'S TLS FRONT BUILT HERE, ON A PULL REQUEST (workplan 0119,
  # 2026-10-31). managed.yml's trigger-tls runs `localhost/caddy:<tag>-<hash>`,
  # which compose builds on the machine from deploy/compose/caddy: Caddy's
  # official image at its pinned digest, with curl removed and the libraries
  # only curl pulled in. Nothing publishes it, so the matrix above never builds
  # it, and without this job the first build of a pull request that moved its
  # FROM would be the branch's E2E (managed).
  #
  # It builds the directory under the name managed.yml gives it. The build's
  # own RUN checks the packages it removes at the versions its header read,
  # proves they are gone, and asks `caddy version` for the FROM's release, so a
  # base that moved fails here, by name. Then it starts the image as
  # managed.yml runs trigger-tls: trigger-tls.Caddyfile mounted read-only
  # where Caddy reads it, TRIGGER_TLS_HOST at compose's default, the
  # container's port 3443 on the runner's loopback. And it asks it as the
  # smoke does, by IP, so with no SNI, which is what the Caddyfile's
  # default_sni is for, and with -k for the certificate `tls internal` mints:
  # TLS must terminate and Caddy must answer, with its own Server header.
  # Asked by IP, the request's Host is 127.0.0.1:3443, which matches no site
  # address (the Caddyfile's one site is TRIGGER_TLS_HOST's, localhost here),
  # so no route takes it and reverse_proxy is never reached: Caddy answers it
  # itself, an empty 200 with its Server header, as the first run got
  # (2026-10-31, "by Caddy (HTTP 200)"). Any status passes, since TLS has
  # terminated by then; curl writes 000 when nothing answered. The job exits
  # with the probe's verdict, and the guard runs this step against a stub that
  # answers as Caddy did and then wrongly. On a pull request only, publishing
  # nothing. Held by scripts/a-package-the-front-never-runs.unit.test.ts.
  caddy:
    name: build (caddy)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the TLS front as managed.yml names it, start it with its Caddyfile, and ask it for TLS on 3443
        run: |
          set -euo pipefail
          # The reference compose builds, read from managed.yml's one image line for it.
          ref="$(sed -n 's/^[[:space:]]*image:[[:space:]]*\(localhost\/caddy:[^[:space:]]*\)[[:space:]]*$/\1/p' deploy/compose/managed.yml)"
          if [ -z "$ref" ] || [ "$(wc -l <<<"$ref")" != 1 ]; then
            echo "::error::managed.yml names no single localhost/caddy image: '${ref}'"
            exit 1
          fi
          docker build --pull --progress=plain --tag "$ref" deploy/compose/caddy
          echo "${ref}: $(docker image inspect --format '{{.Os}}/{{.Architecture}} {{.Id}}' "$ref")"
          # managed.yml's Caddyfile, mount and port for trigger-tls, TRIGGER_TLS_HOST at compose's default.
          docker run -d --name tls-front-probe \
            -e TRIGGER_TLS_HOST=localhost \
            -v "$PWD/deploy/compose/trigger-tls.Caddyfile:/etc/caddy/Caddyfile:ro" \
            -p 127.0.0.1:3443:3443 "$ref"
          # Its status, then its Server header: nothing for a header that is not there, 000 for no answer.
          answer=''
          for attempt in $(seq 1 30); do
            answer="$(curl -sk -o /dev/null -w '%{http_code} %header{server}' --max-time 5 https://127.0.0.1:3443/ || true)"
            if [ "${answer%% *}" != 000 ]; then
              break
            fi
            sleep 1
          done
          read -r code server <<<"$answer"
          if [ "${code:-000}" = 000 ] || [ "${server:-}" != Caddy ]; then
            echo "::error::https://127.0.0.1:3443/ by IP answered '${answer}' within 30 seconds, and trigger-tls must terminate TLS there and answer as Caddy"
            exit 1
          fi
          echo "trigger-tls: TLS terminated on 127.0.0.1:3443 by ${server} (HTTP ${code})"

      - name: The front's log, when it did not answer as it should
        if: failure()
        run: docker logs tls-front-probe || true

      - name: Remove the front
        if: always()
        run: docker rm -f tls-front-probe || true
