name: E2E (managed)

# ==============================================================================
# The gate for the edition nobody tested (workplan 0084).
#
# 0083 found that the managed edition had NO end-to-end gate at all: `e2e.yml`
# stands up `deploy/selfhost/compose.yml` and never references
# `deploy/compose/managed.yml`. So PgBouncer (0082 T4) and the shared rate
# budget (0082 T5) could not be verified by CI, and the honest answer to "is
# the pooler tested?" was "no, and it cannot be". This is that gate.
#
# ------------------------------------------------------------------------------
# THE CHECKOUT ITSELF CANNOT HOLD THE ONE-TIME SETUP
# ------------------------------------------------------------------------------
# `actions/checkout` defaults to `clean: true`, which runs `git clean -ffdx`
# before every checkout — the `-x` includes IGNORED files. `deploy/compose/.env`
# and `pgbouncer/userlist.txt` are both gitignored, so whatever the one-time
# setup wrote into the checkout is destroyed at the START of the very next run,
# by design, regardless of what a human did by hand in between. Found live,
# 2026-08-18: two hand-triggered runs, hours apart and on different commits,
# both failed the SAME "one-time setup was never done" refusal, because
# nothing had ever been placed in a location that survives a checkout.
#
# So the one-time setup lives OUTSIDE the checkout, at a fixed path on the
# runner, and the "Restore" step below copies it in fresh every run — a
# deliberate step, not a workaround for `clean`, because `clean` is doing
# exactly what a persistent self-hosted runner needs it to do for everything
# else (stale build output, leftover node_modules) and disabling it would
# trade one class of staleness for another.
# ------------------------------------------------------------------------------
# WHY THIS RUNS AGAINST A LONG-LIVED STACK, AND DOES NOT `down -v`
# ------------------------------------------------------------------------------
# The managed stack's Trigger.dev instance cannot be bootstrapped unattended.
# `deploy-tasks.sh` documents the one-time steps and they need a human: create
# an account and project through the dashboard's magic-link login (the link is
# printed into `docker logs trigger-api` because no mail server is configured),
# copy TRIGGER_PROJECT_REF and a `tr_prod_` secret key into `.env`, run a CLI
# login once per machine, and set the task runtime environment variables in the
# dashboard — the deployed tasks run in their OWN containers and inherit
# nothing.
#
# So a nightly that tore the stack down would destroy that setup and need a
# person to rebuild it before the next run. **The naive `down -v` this workflow
# does not do would break the gate permanently, and the failure would look like
# a broken test rather than a missing account.** Instead the Trigger.dev half
# persists between runs, and the run recreates the halves it owns: the API, the
# web app, the worker image and the seed.
#
# What that costs, stated rather than discovered later: **this gate does not
# prove bring-up from scratch.** It proves the application works against a
# configured stack. Somebody changing `managed.yml`'s Trigger.dev services
# still has to verify those by hand.
#
# ------------------------------------------------------------------------------
# WHAT GREEN IS ALLOWED TO MEAN (0084 T7)
# ------------------------------------------------------------------------------
#   1. Every service the run touches is HEALTHY, not merely started.
#   2. A task deployed and RAN — an enqueue became a runner container on this
#      machine. 0018 T5's lesson: a green CI says nothing about that.
#   3. Verify reached a terminal state, and apply reached `applied` or
#      `refused`. A refusal is a legitimate pass — the gates said no, and said
#      why.
#   4. The app talked through PgBouncer, and migrations did NOT.
#   5. The stack is left in a state the next run can use.
#
# A skipped step, a timed-out poll, or a service left `unhealthy` is NOT green.
# ==============================================================================

on:
  schedule:
    # 05:30 UTC — after e2e.yml's 01:30 (postgres) and 03:30 (pglite) firings.
    # The Spark is one shared box: three stacks at once would fight over Docker
    # and the loser would be blamed on whatever it happened to be testing.
    - cron: '30 5 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  # Queue, never cancel. A cancelled run leaves a half-built stack behind, and
  # the next run inherits it as a mystery.
  cancel-in-progress: false

env:
  MANAGED_COMPOSE: -f deploy/compose/managed.yml
  # Read by the smoke; defaults match the demo seed.
  SMOKE_API: http://localhost:3001
  # Where the one-time setup lives, OUTSIDE any checkout so `actions/checkout`'s
  # `git clean -ffdx` can never reach it. Override with a repository variable
  # (Settings -> Secrets and variables -> Actions -> Variables) named
  # MANAGED_ENV_PERSIST_DIR if this default does not suit the runner.
  MANAGED_ENV_PERSIST_DIR: ${{ vars.MANAGED_ENV_PERSIST_DIR }}

jobs:
  e2e-managed:
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.5.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Restore the one-time setup (checkout's own clean would destroy it)
        run: |
          set -euo pipefail
          PERSIST_DIR="${MANAGED_ENV_PERSIST_DIR:-$HOME/.persistent/open-migrate-managed}"
          if [ -f "${PERSIST_DIR}/.env" ]; then
            mkdir -p deploy/compose/pgbouncer
            cp "${PERSIST_DIR}/.env" deploy/compose/.env
            if [ -f "${PERSIST_DIR}/userlist.txt" ]; then
              cp "${PERSIST_DIR}/userlist.txt" deploy/compose/pgbouncer/userlist.txt
            fi
            echo "restored the one-time setup from ${PERSIST_DIR}"
          else
            echo "nothing persisted yet at ${PERSIST_DIR} — the next step explains what to do"
          fi

      - name: Refuse early if the one-time setup was never done
        # Loud and specific, because the alternative is a failure fifteen
        # minutes later inside the smoke, pointing at a task that never
        # deployed. Rule 9: name the fix.
        run: |
          ENV_FILE=deploy/compose/.env
          missing=()
          [ -f "$ENV_FILE" ] || missing+=("$ENV_FILE itself")
          # PGBOUNCER_AUTH_PASSWORD is here for a reason that is not obvious:
          # compose interpolates the WHOLE file before running anything, so
          # without it EVERY compose command against managed.yml fails — with a
          # message about pgbouncer, on a runner whose actual problem is an
          # .env that predates the pooler. `ensure-env-secrets.sh` generates it.
          for key in TRIGGER_PROJECT_REF TRIGGER_SECRET_KEY JWT_SECRET SECRET_ENCRYPTION_KEY PGBOUNCER_AUTH_PASSWORD; do
            grep -qE "^${key}=." "$ENV_FILE" 2>/dev/null || missing+=("$key")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            PERSIST_DIR="${MANAGED_ENV_PERSIST_DIR:-$HOME/.persistent/open-migrate-managed}"
            echo "::error::This runner has never had the managed stack set up: missing ${missing[*]}."
            echo "The Trigger.dev half cannot be bootstrapped unattended — see the ONE-TIME"
            echo "prerequisites in deploy/compose/deploy-tasks.sh: create the account and project"
            echo "through the dashboard, put TRIGGER_PROJECT_REF and the tr_prod_ key in"
            echo "deploy/compose/.env, run the CLI login once, and set the task environment"
            echo "variables in the dashboard. Then re-run this workflow."
            echo "For PGBOUNCER_AUTH_PASSWORD specifically, it is generated rather than chosen:"
            echo "  ./deploy/compose/ensure-env-secrets.sh && ./deploy/compose/bootstrap-managed.sh --only data"
            echo ""
            echo "IMPORTANT — this checkout's own copy will not survive the next run:"
            echo "actions/checkout cleans ignored files (.env among them) before every checkout."
            echo "Once the file above is correct, persist it OUTSIDE the checkout so the"
            echo "'Restore' step earlier in this job can find it next time:"
            echo "  mkdir -p ${PERSIST_DIR}"
            echo "  cp deploy/compose/.env ${PERSIST_DIR}/.env"
            echo "  cp deploy/compose/pgbouncer/userlist.txt ${PERSIST_DIR}/userlist.txt"
            exit 1
          fi
          echo "one-time setup present"

      - name: Bring the stack up
        # Through bootstrap-managed.sh rather than an inline copy of the run
        # order, for two reasons.
        #
        # It is the only place the bootstrap script is ever exercised. A
        # bring-up script that nothing runs is a document with a shebang: it
        # goes stale exactly as fast as the notes it replaced, and nobody finds
        # out until the next machine.
        #
        # And the inline version had a bug this inherits the fix for: `pnpm
        # --filter @openmig/api seed:managed` runs on the HOST, and the seed
        # reads DATABASE_URL / JWT_SECRET / SECRET_ENCRYPTION_KEY from its own
        # environment. Nothing here exported them, and nothing in apps/api
        # loads a dotenv file — so the step depended on the runner happening to
        # have them set. The script exports them from deploy/compose/.env,
        # pointed at Postgres's PUBLISHED port (the pooler is internal-only,
        # and migrations must not go through it in any case).
        #
        # --with-demo: this gate drives the two demo tenants the seed creates.
        # --no-smoke: the smoke runs as its own step below, so its output can
        # be captured and redacted before it is uploaded.
        # The account/login phases are no-ops on a runner that has been set up —
        # which the step above has just refused to continue without.
        run: |
          set -euo pipefail
          ./deploy/compose/bootstrap-managed.sh --from data --with-demo --no-smoke

      - name: The app talks through PgBouncer, and migrations do not (0082 T4)
        # The reason this workflow exists. Asserted against the pooler's own
        # admin console rather than inferred from a working app: an app that
        # silently fell back to a direct connection would pass every other step
        # in this gate.
        run: |
          set -euo pipefail
          source deploy/compose/.env
          pools=$(docker compose $MANAGED_COMPOSE exec -T pgbouncer \
            psql "postgresql://pgbouncer_auth:${PGBOUNCER_AUTH_PASSWORD}@127.0.0.1:6432/pgbouncer" \
            -tAc "SHOW POOLS" || true)
          echo "$pools"
          if [ -z "$pools" ]; then
            echo "::error::PgBouncer's admin console answered nothing — the pooler is not serving."
            exit 1
          fi
          # Transaction mode, and at least one client actually connected through it.
          echo "$pools" | grep -q "transaction" || {
            echo "::error::PgBouncer is not in transaction mode. managed.yml sets pool_mode=transaction."
            exit 1
          }
          # And the migration path is direct: DIRECT_DATABASE_URL must not point at the pooler.
          direct=$(docker compose $MANAGED_COMPOSE exec -T api printenv DIRECT_DATABASE_URL)
          case "$direct" in
            *pgbouncer*|*:6432*)
              echo "::error::DIRECT_DATABASE_URL points at the pooler. Migrations hold a SESSION advisory lock; through a transaction pooler two replicas stop excluding each other, silently."
              exit 1 ;;
          esac
          echo "pooler in front, migrations direct"

      - name: The acceptance smoke (verify + apply, through real runners)
        # 0020 T5's script, unchanged. It mints a seeded-member token, drives
        # verify and apply to terminal states, captures runner logs before
        # AutoRemove destroys them, and lands stuck rows by hand rather than
        # leaving them pointing at nothing.
        run: ./deploy/compose/smoke-managed.sh

      - name: Redact the evidence before it becomes an artifact
        if: always()
        # A script, not a shell block, because this is the one step whose bug is
        # a credential disclosure — and a `run:` block cannot be tested.
        # scripts/redact-evidence.unit.test.ts feeds it a log full of
        # real-shaped secrets and asserts none survive.
        run: |
          set -euo pipefail
          mkdir -p managed-evidence
          shopt -s nullglob
          for f in smoke-managed-*.log deploy/compose/smoke-*.out test-logs/*; do
            [ -f "$f" ] && cp "$f" managed-evidence/
          done
          # Even with nothing collected: an empty directory must still be the
          # thing that gets uploaded, never the repo.
          ./deploy/compose/redact-evidence.sh managed-evidence

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0
        with:
          name: managed-e2e-evidence-${{ github.run_id }}
          path: managed-evidence/
          retention-days: 7
          if-no-files-found: warn

      - name: What state did we leave it in?
        if: always()
        # Not a teardown — see the header. This says what is still standing, so
        # a run that failed halfway does not leave the next one guessing.
        run: |
          docker compose $MANAGED_COMPOSE ps || true
          echo '--- unhealthy services, if any ---'
          docker compose $MANAGED_COMPOSE ps --format '{{.Name}} {{.Health}}' 2>/dev/null \
            | grep -v ' healthy$' || echo 'all healthy'
