name: E2E (self-hosted)

# ==============================================================================
# Intentionally SEPARATE from CI (ci.yml). Manual-trigger only: needs the
# self-hosted Spark runner + Docker. Drives the workplan 0010 T5 acceptance gate
# — the self-host appliance's restart-resume idempotency property — end to end,
# for all FOUR domains (issue #114 follow-up extended this from mail-only to also
# cover calendar/contacts; a 2026-07-27 follow-up added WebDAV files, closing the
# last deferred gap):
#
#   1. Bring up Stalwart via deploy/selfhost/setup-stalwart.sh — the ONE canonical
#      two-phase (recovery-mode provisioning, then normal-mode serving) bring-up
#      for this repo (see docs/stalwart-integration-fix.md; plain `docker compose
#      up` cannot express Stalwart's two-phase requirement for one service, which
#      is why this is a script, not a dev.yml service). Publishes JMAP + IMAPS on
#      the host so the appliance can reach them via host.docker.internal, and also
#      joins openmig_dev-network under the alias "stalwart" — so a sandboxed agent
#      that joins that same network (see the doc's DooD section) can reach it by
#      name instead, with no published ports involved at all.
#   1b. Bring up Nextcloud (deploy/compose/dev.yml's `nextcloud` service) on the
#      same openmig_dev-network, then provision TWO accounts on it — e2e-source and
#      e2e-target (deploy/selfhost/setup-nextcloud-users.sh) — so calendar/contacts/
#      files sync is proven ACROSS accounts, the real-world shape, not within one
#      shared admin account like the source-only DAV integration tests use.
#   2. SEED the source mailbox over IMAPS (the gate is only meaningful against a
#      non-zero source; v0.16.10 doesn't bind plaintext IMAP in normal mode, so
#      this — like the rest of the repo — uses TLS, not port 143) AND seed calendar
#      events + contacts + files into the e2e-source Nextcloud account
#      (test/e2e/seed-dav-source.mjs).
#   3. Build + start the self-host appliance (deploy/selfhost/compose.yml) with
#      a mapping generated from the fixture and the source/target passwords —
#      mail, calendar, contacts, and files domains all enabled.
#   3b. PLANT one item that cannot migrate — a file on the source at a path where
#      the target already holds a directory. Per-item failure isolation means the
#      rest of the domain must migrate anyway; the gate then reads the failure
#      queue, checks the reason is verbatim, and ACCEPTS the item so the §20
#      verification gate that follows comes back clean.
#   4. Run the Restart-Resume Idempotency Gate e2e for each domain: first pass
#      syncs N → `docker compose restart app` → second pass must NOT grow itemsSynced.
#   5. Run the Apply-Deletion Gate (ADR-0024): delete one already-migrated item per
#      domain on the SOURCE, `apply` the removal through the real appliance, and
#      verify directly against the real target server (never just the appliance's
#      own response) that it is actually gone or actually binned — including that a
#      second `apply` is refused and that the tombstone survives a further pass.
#

# Ports: this runner is shared with other work (other manual dispatches, agent
# sessions, etc. on the same box), so every host port this workflow needs is
# picked fresh at runtime (see "Pick free host ports" below) instead of assuming
# fixed numbers are free — see docs/stalwart-integration-fix.md "Running from
# inside a sandboxed agent container" for the failure mode this avoids. Stalwart's
# own container/volume/network names stay fixed (it's meant to be a shared,
# reusable dev resource, same as deploy/compose/dev.yml's postgres/nextcloud) —
# only the ports are dynamic.
#
# ⚠️ This workflow orchestrates Docker + a live mail seed and CANNOT be validated
# off the runner. Treat the first dispatch as a shakedown run.
# HARD RULE 5: no managed-only services here (no Trigger.dev / billing).
# ==============================================================================
on:
  workflow_dispatch:
    inputs:
      seed_count:
        description: 'Number of messages to seed into the source mailbox'
        required: false
        type: number
        default: 5
      persistence:
        description: >-
          Which appliance backend to run the gate against. `pglite` layers
          deploy/selfhost/compose.pglite.yml on top, which drops the Postgres
          service entirely — the shape a native installer ships (workplan 0016 P7).
        required: false
        type: choice
        default: postgres
        options: [postgres, pglite]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

env:
  # Layered on top when the dispatch asks for PGlite. Exported (rather than
  # spliced only into the `docker compose` calls below) because the gate itself
  # reads it: `selfhost-restart-resume.e2e.test.ts` restarts the appliance and
  # therefore has to address the same stack this workflow brought up.
  SELFHOST_COMPOSE_OVERRIDE: ${{ inputs.persistence == 'pglite' && 'deploy/selfhost/compose.pglite.yml' || '' }}
  # Every `docker compose` call below uses THIS, unquoted, so the flags split.
  # One list in one place: before this, `up` passed compose.dev.yml while `ps`
  # and `logs` in the very same step did not, which is how a diagnostic dump can
  # end up describing a different stack from the one that failed.
  SELFHOST_COMPOSE_FILES: >-
    -f deploy/selfhost/compose.yml
    -f deploy/selfhost/compose.dev.yml
    ${{ inputs.persistence == 'pglite' && '-f deploy/selfhost/compose.pglite.yml' || '' }}
  # SELFHOST_PORT is NOT fixed here — it's computed in "Pick free host ports"
  # below and exported to $GITHUB_ENV so it's free regardless of what else is
  # running on this box.
  SELFHOST_BIND: '127.0.0.1'
  # Dev-stack credentials (match deploy/selfhost/setup-stalwart.sh's provisioning plan).
  SOURCE_IMAP_PASSWORD: source_password
  TARGET_JMAP_PASSWORD: target_password
  POSTGRES_PASSWORD: selfhost_e2e_pw
  # Nextcloud (calendar + contacts DAV target — deploy/compose/dev.yml's `nextcloud`
  # service) — admin creds match that file's defaults; the two e2e accounts are
  # provisioned fresh each run by deploy/selfhost/setup-nextcloud-users.sh.
  NEXTCLOUD_ADMIN_USER: admin
  NEXTCLOUD_ADMIN_PASSWORD: admin_dev_pw
  NEXTCLOUD_SOURCE_USER: e2e-source
  SOURCE_DAV_PASSWORD: e2e_source_pw
  NEXTCLOUD_TARGET_USER: e2e-target
  TARGET_DAV_PASSWORD: e2e_target_pw
  # The restart-resume test uses the selfhost stack, not Testcontainers — skip the
  # heavy DAV/mail containers the root e2e global-setup would otherwise boot.
  SKIP_STALWART: 'true'
  SKIP_NEXTCLOUD: 'true'

jobs:
  e2e-selfhost:
    runs-on: [self-hosted, linux, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.5.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install stalwart-cli
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/stalwartlabs/cli/releases/latest/download/stalwart-cli-installer.sh | sh
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          which stalwart-cli
          stalwart-cli --version

      - name: Clean up any previous stacks (fresh volumes)
        run: |
          docker compose $SELFHOST_COMPOSE_FILES down -v --remove-orphans 2>/dev/null || true
          docker rm -f openmig-dev-stalwart 2>/dev/null || true
          docker volume rm openmig-dev-stalwart-data 2>/dev/null || true
          docker rm -f openmig-dev-nextcloud 2>/dev/null || true

      # Pick genuinely free host ports for everything this workflow publishes
      # (Stalwart JMAP/IMAPS, the selfhost appliance), instead of assuming
      # fixed numbers are available. Each freePort() call binds to port 0 (the
      # OS hands back an unused ephemeral port), reads it back, then closes —
      # the same trick Testcontainers uses, which is why the Testcontainers-driven
      # integration-tests job never hits this class of collision.
      - name: Pick free host ports
        run: |
          node -e '
            const net = require("node:net");
            const fs = require("node:fs");
            function freePort() {
              return new Promise((resolve, reject) => {
                const srv = net.createServer();
                srv.on("error", reject);
                srv.listen(0, "127.0.0.1", () => {
                  const { port } = srv.address();
                  srv.close(() => resolve(port));
                });
              });
            }
            (async () => {
              const [jmap, imaps, selfhost, nextcloud] = await Promise.all([freePort(), freePort(), freePort(), freePort()]);
              const lines = [
                `STALWART_JMAP_PORT=${jmap}`,
                `STALWART_IMAPS_PORT=${imaps}`,
                `SELFHOST_PORT=${selfhost}`,
                `DEV_NEXTCLOUD_PORT=${nextcloud}`,
              ];
              fs.appendFileSync(process.env.GITHUB_ENV, lines.join("\n") + "\n");
              console.log("Picked free ports:\n" + lines.join("\n"));
            })().catch((err) => { console.error(err); process.exit(1); });
          '

      - name: Start Stalwart (source + target)
        run: ./deploy/selfhost/setup-stalwart.sh

      - name: Start Nextcloud (calendar + contacts DAV target)
        # dev.ci.yml: setup-stalwart.sh already created openmig_dev-network via a raw
        # `docker network create` (no compose label) — dev.yml alone refuses to attach
        # to it without this override marking it external. See dev.ci.yml's header.
        run: docker compose -f deploy/compose/dev.yml -f deploy/compose/dev.ci.yml up -d nextcloud

      - name: Provision Nextcloud DAV users (e2e-source, e2e-target)
        env:
          NEXTCLOUD_HOST_PORT: ${{ env.DEV_NEXTCLOUD_PORT }}
          NEXTCLOUD_SOURCE_PASSWORD: ${{ env.SOURCE_DAV_PASSWORD }}
          NEXTCLOUD_TARGET_PASSWORD: ${{ env.TARGET_DAV_PASSWORD }}
        run: ./deploy/selfhost/setup-nextcloud-users.sh

      - name: Seed the source mailbox (N>0 messages, over IMAPS)
        env:
          SEED_IMAP_HOST: 127.0.0.1
          SEED_IMAP_PORT: ${{ env.STALWART_IMAPS_PORT }}
          SEED_IMAP_TLS: 'true'
          SEED_IMAP_USER: source@dev.local
          SEED_IMAP_PASSWORD: ${{ env.SOURCE_IMAP_PASSWORD }}
          SEED_COUNT: ${{ github.event.inputs.seed_count || '5' }}
        run: node test/e2e/seed-imap-source.mjs

      - name: Seed calendar events + contacts + files (N>0, over DAV)
        env:
          SEED_DAV_URL: http://127.0.0.1:${{ env.DEV_NEXTCLOUD_PORT }}
          SEED_DAV_SOURCE_USER: ${{ env.NEXTCLOUD_SOURCE_USER }}
          SEED_DAV_SOURCE_PASSWORD: ${{ env.SOURCE_DAV_PASSWORD }}
          SEED_COUNT: ${{ github.event.inputs.seed_count || '5' }}
        run: node test/e2e/seed-dav-source.mjs

      # A fixture that CANNOT migrate, to prove one bad item does not stop its
      # domain — and that the operator can then resolve it.
      #
      # The trick is a name collision the servers enforce for us: a FILE on the
      # source at a path where the target already holds a DIRECTORY. The WebDAV
      # writer's snapshot skips collections, so it does not adopt the directory;
      # it attempts the PUT, and Nextcloud refuses to replace a collection with
      # a body (405, which is not a transient status, so it fails immediately
      # rather than burning retries).
      #
      # Chosen over the alternatives on purpose: a per-user quota would fail
      # EVERY item and trip the systemic-failure guard, and a malformed fixture
      # would just be rejected at seed time by the same server that has to store
      # it. This one fails exactly one item, deterministically, on the write
      # path, and is a genuinely realistic conflict.
      - name: Seed an item that cannot migrate (per-item failure isolation)
        run: |
          set -euo pipefail
          NC="http://127.0.0.1:${DEV_NEXTCLOUD_PORT}/remote.php/dav/files"
          POISON="openmig-e2e-poison.txt"

          # 1. A perfectly ordinary file on the SOURCE.
          src_code="$(curl -s -o /dev/null -w '%{http_code}' -u "${NEXTCLOUD_SOURCE_USER}:${SOURCE_DAV_PASSWORD}" \
            -X PUT --data-binary 'This file cannot be written to the target.' \
            "${NC}/${NEXTCLOUD_SOURCE_USER}/${POISON}")"
          echo "PUT source/${POISON} -> ${src_code}"
          case "$src_code" in 201|204) ;; *) echo "could not seed the poison file"; exit 1;; esac

          # 2. A DIRECTORY of the same name on the TARGET.
          dst_code="$(curl -s -o /dev/null -w '%{http_code}' -u "${NEXTCLOUD_TARGET_USER}:${TARGET_DAV_PASSWORD}" \
            -X MKCOL "${NC}/${NEXTCLOUD_TARGET_USER}/${POISON}")"
          echo "MKCOL target/${POISON} -> ${dst_code}"
          # 201 only. 405 was accepted here before and is exactly how this can
          # silently no-op: it means nothing was created, the run then migrates
          # the file cleanly, and the gate fails much later with "the planted
          # item is missing from the failure queue".
          case "$dst_code" in 201) ;; *) echo "could not create the blocking directory"; exit 1;; esac

          # 3. VERIFY the fixture is what we think it is. A test fixture that
          #    can quietly not exist is worse than no fixture: the run burns
          #    twenty minutes and then fails for a reason that looks like a
          #    product bug.
          rt="$(curl -s -u "${NEXTCLOUD_TARGET_USER}:${TARGET_DAV_PASSWORD}" \
            -X PROPFIND -H 'Depth: 0' "${NC}/${NEXTCLOUD_TARGET_USER}/${POISON}")"
          echo "$rt" | grep -qi '<[a-z]*:collection' \
            || { echo "target/${POISON} is not a collection — fixture is not in place"; exit 1; }
          echo "verified: target/${POISON} is a collection, source/${POISON} is a file"

      - name: Prepare appliance config + secrets
        run: |
          # Fixture mapping is git-ignored under the config dir on purpose; the
          # Dockerfile bakes deploy/selfhost/config into the image. The appliance
          # reaches Stalwart/Nextcloud over openmig_dev-network by container name
          # (see deploy/selfhost/compose.dev.yml, applied below) — container-to-
          # container traffic uses each service's fixed internal port (Stalwart
          # 8080/993, Nextcloud 80), not whatever dynamic host port it's published
          # under, so no port substitution needed for either.
          node -e '
            const fs = require("node:fs");
            const cfg = JSON.parse(fs.readFileSync("test/e2e/fixtures/selfhost-restart-resume.mapping.json", "utf8"));
            cfg.source.host = "stalwart";
            cfg.source.port = 993;
            // baseUrl is the JMAP ORIGIN only — the connector appends /.well-known/jmap
            // (session) and /jmap (API) itself. Including the well-known path here would
            // double it and the session never loads ("Not connected to JMAP server").
            cfg.target.baseUrl = "http://stalwart:8080";
            cfg.domains.mail.source.host = "stalwart";
            cfg.domains.mail.source.port = 993;
            cfg.domains.mail.target.baseUrl = "http://stalwart:8080";
            const nextcloudDav = "http://nextcloud/remote.php/dav";
            cfg.domains.calendar.source.url = nextcloudDav;
            cfg.domains.calendar.target.url = nextcloudDav;
            cfg.domains.contacts.source.url = nextcloudDav;
            cfg.domains.contacts.target.url = nextcloudDav;
            // Unlike CalDAV/CardDAV, plain WebDAV has no discovery of its own -- the files
            // domain needs the literal per-account files/{username}/ path, not the bare DAV
            // root (see apps/worker/src/build-deps.ts, function davEndpoint, which uses
            // config.url as-is with zero resolution for the self-host file-config path).
            cfg.domains.files.source.url = nextcloudDav + "/files/" + process.env.NEXTCLOUD_SOURCE_USER + "/";
            cfg.domains.files.target.url = nextcloudDav + "/files/" + process.env.NEXTCLOUD_TARGET_USER + "/";
            // Off by default (a destructive capability must be opted into, never
            // opted out of — see ADR-0024). This is the one fixture that turns it
            // on, so the Apply-Deletion Gate below can prove `apply` end to end
            // against real servers; every other e2e run leaves it unset.
            cfg.allowApplyDeletions = true;
            fs.writeFileSync("deploy/selfhost/config/mapping.json", JSON.stringify(cfg, null, 2));
          '
          cat > deploy/selfhost/.env <<ENV
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          SOURCE_IMAP_PASSWORD=${SOURCE_IMAP_PASSWORD}
          TARGET_JMAP_PASSWORD=${TARGET_JMAP_PASSWORD}
          SOURCE_DAV_PASSWORD=${SOURCE_DAV_PASSWORD}
          TARGET_DAV_PASSWORD=${TARGET_DAV_PASSWORD}
          # debug turns on the per-phase [timing] breakdown per domain, which
          # the restart-resume gate asserts on (see "every domain actually runs
          # items concurrently"). On here because this is the only place a real
          # multi-domain pass runs against real servers, and the run logs alone
          # carry just a total — which is how two confident wrong diagnoses of
          # the file domain's time got as far as being measured before dying.
          LOG_LEVEL=debug
          ENV

      - name: Build + start the self-host appliance
        run: |
          # --force-recreate: the app image ships TS source (runs under tsx), so a rebuilt
          # image must actually replace the running container — belt-and-suspenders against
          # a stale container surviving the rebuild. pgdata/appdata are named volumes and
          # persist across the recreate, so this doesn't reset any state the T5 gate needs.
          docker compose $SELFHOST_COMPOSE_FILES up -d --build --force-recreate --wait || \
            { docker compose $SELFHOST_COMPOSE_FILES logs app; exit 1; }
          docker compose $SELFHOST_COMPOSE_FILES ps

      - name: Green-light the mapping (0013 T7 — mappings load paused until confirmed)
        run: |
          # Since workplan 0013 T7 the appliance loads every mapping PAUSED and only schedules
          # it after an explicit POST /mappings/:id/start (the "Start migration" green light).
          # The restart-resume gate expects the mapping to actually run, so activate it here —
          # this also exercises the real activation endpoint. The id is the config mappingId.
          MAPPING_ID="$(node -e 'console.log(JSON.parse(require("node:fs").readFileSync("deploy/selfhost/config/mapping.json","utf8")).mappingId)')"
          echo "Activating mapping ${MAPPING_ID} on http://127.0.0.1:${SELFHOST_PORT}"
          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://127.0.0.1:${SELFHOST_PORT}/mappings/${MAPPING_ID}/start")"
          echo "POST /start -> ${code}"
          # 303 = activated (redirect to /), 409 = already active/cutover — both fine; anything else fails.
          case "$code" in 200|303|409) ;; *) echo "unexpected activation status"; docker compose $SELFHOST_COMPOSE_FILES logs app; exit 1;; esac

      # No `--`, and a FILE PATH rather than a test-name pattern. Both halves of
      # that mattered, and together they made every e2e filter here a no-op:
      #
      #   1. `pnpm <script> -- <args>` forwards a LITERAL `--` to the script, so
      #      the run line was `vitest run --project e2e -- --grep Restart-Resume`.
      #      Vitest's CLI parser discards everything after `--`, so the filter
      #      never reached vitest and no file filter was applied at all.
      #   2. `--grep` is not a vitest option anyway (vitest's is
      #      `-t/--testNamePattern`); passed properly it is a hard CLI error.
      #
      # So this step ran EVERY e2e file — including the verification gate below,
      # in the same process and in parallel with this one. That called
      # `GET /verify` ~0.4s into the run, before a single item had been synced
      # and while runAllDomains was still mid-flight against the same targets;
      # the 500 it produced failed this step (run #29). Each step now runs
      # exactly one suite, in order.
      - name: Run Restart-Resume Idempotency Gate (0010 T5)
        # SEED_COUNT reaches the test so its wait budget scales with the corpus.
        # A fixed 120s window silently expired on the file domain at
        # SEED_COUNT=110 — ~394 items and tens of megabytes — and the gate then
        # compared two mid-flight counts as if they were finished passes.
        #
        # The SEED_* credentials are here because the gate now DRIPS new fixtures
        # into both sources mid-run (the shadow-sync test) by shelling out to the
        # same two seed scripts the steps above ran. It reuses SEED_COUNT as the
        # offset to number them past the existing corpus, so they carry natural
        # keys the ledger has never seen.
        env:
          SEED_COUNT: ${{ github.event.inputs.seed_count || '5' }}
          SEED_IMAP_HOST: 127.0.0.1
          SEED_IMAP_PORT: ${{ env.STALWART_IMAPS_PORT }}
          SEED_IMAP_TLS: 'true'
          SEED_IMAP_USER: source@dev.local
          SEED_IMAP_PASSWORD: ${{ env.SOURCE_IMAP_PASSWORD }}
          SEED_DAV_URL: http://127.0.0.1:${{ env.DEV_NEXTCLOUD_PORT }}
          SEED_DAV_SOURCE_USER: ${{ env.NEXTCLOUD_SOURCE_USER }}
          SEED_DAV_SOURCE_PASSWORD: ${{ env.SOURCE_DAV_PASSWORD }}
        run: pnpm test:e2e test/e2e/selfhost-restart-resume.e2e.test.ts

      # The §20 gate against real Stalwart + Nextcloud. The restart-resume gate
      # above exercises the target WRITERS; it never calls listEntries and never
      # calls runVerification, so until this step a green e2e said nothing about
      # the DAV reindexers, checksum sampling, or measured target bytes.
      # Must run AFTER the gate above: it verifies the data that pass wrote.
      - name: Run Verification Gate against the real targets (§20)
        env:
          SEED_COUNT: ${{ github.event.inputs.seed_count || '5' }}
        run: pnpm test:e2e test/e2e/selfhost-verification.e2e.test.ts

      # `apply` (ADR-0024) — the one destructive operation in the product — against
      # REAL Nextcloud + Stalwart for the first time. Everything proving it before
      # this ran against MemoryLedger and fake target writers; this deletes one
      # already-migrated item per domain (file, mail, calendar) on the SOURCE,
      # applies the removal through the real appliance, and verifies directly
      # against the real target server — not just the appliance's own response —
      # that the copy is actually gone or actually binned. Must run AFTER the two
      # gates above: it needs already-synced items to delete, and deletes items the
      # verification gate above already counted (which is why this runs last).
      #
      # THREE FILES, one command. Each domain waits through a real cron-driven
      # sync pass (up to E2E_WAIT_MS, default 200s) more than once; run as three
      # `describe` blocks in one file that cost ~400s end to end (the sum of all
      # three). They are independent — different natural keys, different
      # protocols, different appliance sync lanes — so there is no reason for
      # one to wait on another. Naming all three files in one `pnpm test:e2e`
      # invocation lets vitest's normal per-file thread pool run them
      # concurrently, cutting wall time to roughly the slowest domain rather
      # than the sum of all three. (`describe.concurrent` inside a single file
      # was tried first and rejected — see apply-deletion-lib.ts's header.)
      - name: Run Apply-Deletion Gate against the real targets (ADR-0024)
        env:
          SEED_DAV_URL: http://127.0.0.1:${{ env.DEV_NEXTCLOUD_PORT }}
          SEED_DAV_SOURCE_USER: ${{ env.NEXTCLOUD_SOURCE_USER }}
          SEED_DAV_SOURCE_PASSWORD: ${{ env.SOURCE_DAV_PASSWORD }}
        run: >
          pnpm test:e2e
          test/e2e/selfhost-apply-deletion-file.e2e.test.ts
          test/e2e/selfhost-apply-deletion-mail.e2e.test.ts
          test/e2e/selfhost-apply-deletion-calendar.e2e.test.ts

      # Finishing UNSCHEDULES the mapping, so every gate above needs to have run
      # already. Hence its own step, last, and its own `pnpm test:e2e` call —
      # vitest gives no ordering guarantee across files in one invocation.
      #
      # The refusal is the half worth proving: §11.2 says a migration must not
      # be quietly closed over items still awaiting a decision. The original
      # poison file was accepted by the restart-resume gate, so plant a second
      # one and let a pass fail it, or the refusal would pass vacuously (the
      # gate fails loudly rather than skipping if it never appears).
      - name: Plant a second unmigratable item, so finish has something to refuse over
        run: |
          set -euo pipefail
          NC="http://127.0.0.1:${DEV_NEXTCLOUD_PORT}/remote.php/dav/files"
          POISON="openmig-e2e-poison-2.txt"

          src_code="$(curl -s -o /dev/null -w '%{http_code}' -u "${NEXTCLOUD_SOURCE_USER}:${SOURCE_DAV_PASSWORD}" \
            -X PUT --data-binary 'This file cannot be written to the target either.' \
            "${NC}/${NEXTCLOUD_SOURCE_USER}/${POISON}")"
          echo "PUT source/${POISON} -> ${src_code}"
          case "$src_code" in 201|204) ;; *) echo "could not seed the second poison file"; exit 1;; esac

          dst_code="$(curl -s -o /dev/null -w '%{http_code}' -u "${NEXTCLOUD_TARGET_USER}:${TARGET_DAV_PASSWORD}" \
            -X MKCOL "${NC}/${NEXTCLOUD_TARGET_USER}/${POISON}")"
          echo "MKCOL target/${POISON} -> ${dst_code}"
          case "$dst_code" in 201|405) ;; *) echo "could not seed the target directory"; exit 1;; esac

          # Drive a pass now rather than waiting on the cron, so the failure is
          # in the queue by the time the gate looks.
          # `/run` is synchronous — it answers when the pass has finished — so
          # this returns with the failure already in the queue. Best-effort with
          # a ceiling: the gate polls and fails loudly if nothing shows up, so a
          # slow or refused pass must not hang the job here.
          curl -s -o /dev/null --max-time 300 -X POST \
            "http://127.0.0.1:${SELFHOST_PORT}/mappings/11111111-1111-4111-8111-111111111111/run" || true

      - name: Run Finish Gate (§11.2 — the end of a migration)
        run: pnpm test:e2e test/e2e/selfhost-finish.e2e.test.ts

      - name: Appliance + Stalwart + Nextcloud diagnostics
        if: always()
        run: |
          # Runs whether the gate passed or failed (the test no longer tears the stack down, so
          # the container is still here). On an itemsSynced=0 / sync failure, the appliance's own
          # "[Worker] <domain> sync complete: scanned=.. created=.. skipped=.." line (or the error)
          # is what tells us why. Tee everything to a file so it also uploads as an artifact
          # (the old `**/reports/` upload matched nothing — this test writes no report dir).
          mkdir -p diagnostics
          {
            echo "===== /status ====="
            curl -s "http://127.0.0.1:${SELFHOST_PORT}/status" | (jq . 2>/dev/null || cat) || true
            echo "===== appliance app logs ====="
            docker compose $SELFHOST_COMPOSE_FILES logs app --no-color --tail 400 || true
            echo "===== Stalwart logs (tail) ====="
            docker logs openmig-dev-stalwart --tail 150 2>&1 || true
            echo "===== Nextcloud logs (tail) ====="
            docker logs openmig-dev-nextcloud --tail 150 2>&1 || true
          } 2>&1 | tee diagnostics/e2e-diagnostics.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.0
        with:
          name: selfhost-e2e-diagnostics
          path: |
            diagnostics/
            test-logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          docker compose $SELFHOST_COMPOSE_FILES down -v --remove-orphans || true
          docker rm -f openmig-dev-stalwart || true
          docker volume rm openmig-dev-stalwart-data || true
          docker compose -f deploy/compose/dev.yml -f deploy/compose/dev.ci.yml down --remove-orphans || true
          docker rm -f openmig-dev-nextcloud || true
          rm -f deploy/selfhost/.env deploy/selfhost/config/mapping.json || true
