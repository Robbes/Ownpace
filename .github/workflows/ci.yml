# Unified CI — TypeScript/Node (pnpm). Mirrors the team convention:
#   detect-changes -> docs-hygiene, lint, unit-tests (parallel) -> integration-tests
# E2E is a SEPARATE, manual workflow (e2e.yml). Runs on the self-hosted (Spark) runner.
#
# ── Which machine runs untrusted code ────────────────────────────────────────
#
# SECURITY: the self-hosted runner is ONLY used for push events. Pull requests
# — including from forks, and this repository is PUBLIC — run on GitHub-hosted
# runners, so a stranger's branch never executes on the Spark. That box holds
# the live managed stack, its .env, the encrypted connection credentials and
# the trigger keys; `pnpm install` alone runs lifecycle scripts, which is all
# an attacker needs. Every workflow with a `pull_request` trigger follows this:
# ci.yml and security-scan.yml by the conditional below, and
# no-committed-artifacts.yml since 2026-08-11, when it was found to be the one
# exception. e2e.yml and e2e-o365.yml are schedule/dispatch only — no PR path
# to abuse — which is why they can name the runner unconditionally.
#
# WHAT THE SPLIT COSTS, stated so it is a known limitation and not a surprise:
# GitHub's hosted Linux runners are amd64, the Spark is arm64, so **a PR is
# validated on an architecture we do not deploy to, and the one we do deploy to
# is only exercised after merge.** This has bitten once already — task images
# built for amd64 died at exec on the arm64 Spark in under a second, with
# AutoRemove destroying the evidence (the 2026-08-01 hunt). A red main after a
# green PR is therefore a designed-in outcome here, not an anomaly.
#
# CLOSED for the job where it matters (2026-08-11). GitHub's arm64 hosted
# runners (`ubuntu-24.04-arm`) are generally available for PUBLIC repositories,
# 4 vCPU, free — the same tier as the amd64 ones — so `integration-tests` now
# runs on BOTH architectures on every pull request, and arm64 is exercised
# before merge rather than after. See that job for why it was the only one
# matrixed: it is the only one that runs real containers. `migration-lint` is
# the other since 2026-11-01: the Atlas it runs is a different download on
# each architecture, and the arm64 one runs on a hosted runner before merge.
#
# This also removes arm64 as a reason to keep CI on the box that runs
# production — see the operator runbook, "This box also runs CI".
#
# Runner images are PINNED (`ubuntu-24.04`, not `ubuntu-latest`) for the same
# reason every action here is pinned to a SHA: `-latest` moves under you, and
# this repository does not accept a dependency it did not choose.
name: CI

on:
  # NO `branches:` FILTER, deliberately. It used to read `branches: [main]`,
  # which meant a pull request whose BASE was any other branch produced no
  # checks at all — and the failure that causes is not "merges unverified", it
  # is worse than that and harder to diagnose.
  #
  # A stacked pull request (one opened against another feature branch, so its
  # diff shows only its own commits) got nothing. When the branch underneath it
  # merged, GitHub retargeted it to `main` — and a retarget fires
  # `pull_request.edited`, which is not in the default activity set, so still
  # nothing ran. The result is a pull request to `main` carrying four required
  # contexts that will never be reported: "Expected — waiting for status to be
  # reported", nothing queued in Actions to explain it, and no amount of
  # re-running fixing it. Exactly the shape `every-pr-check-is-classified`
  # already documents for `images.yml`'s `paths:` filter. Only a fresh push
  # escapes it. Found 2026-08-23 on #501, which sat at zero checks.
  #
  # THIS DOES NOT WIDEN WHAT RUNS ON THE SPARK. Every `runs-on` above keys on
  # `github.event_name == 'push'`, never on the branch, so a pull request from
  # anywhere still runs on a GitHub-hosted runner. The policy in the header is
  # untouched.
  #
  # `push` keeps its filter: that one is about which branches deserve a build
  # after the fact, which is a different question.
  pull_request:
  push:
    branches: [main]
    # A tag pushed by hand runs CI (release-readiness, 2026-08-10): before
    # this, pushing a tag published signed images and a release with no lint,
    # typecheck, unit or integration gate on that ref — only the images and
    # security-scan workflows listened for tags. It ran beside the publishers
    # and held none of them back: on v0.2.0-alpha.1 it finished forty
    # minutes after everything was published.
    #
    # A tag the Release workflow makes runs no CI (release.yml, workplan 0146,
    # Status of 2026-10-23). It is created with the workflow's own token,
    # whose events start no push run, and Release dispatches only the
    # publishers on it. What stands in for CI on the tag is the push run on
    # main of the commit the tag is cut on: Release's preflight refuses a
    # commit whose push run here did not run lint, the unit tests, the UI
    # tests and the integration tests. This workflow has no dispatch trigger
    # on purpose: dispatched, every `runs-on` below would pick a hosted
    # runner, which is not the run that proved the commit.
    tags: ['v*']

# CANCEL A SUPERSEDED PULL REQUEST RUN. DO NOT ASK FOR A PUSH RUN TO BE CANCELLED.
#
# The two cases look identical and are opposites.
#
# On a PULL REQUEST, a new commit makes the running one obsolete: the older
# commit is not what will merge, and nobody will ever ask what its build said.
# Cancelling is free, and on a busy branch it is most of what keeps the queue
# short.
#
# On a PUSH to `main`, the superseded commit is not obsolete. It is IN `main`.
# Cancelling its build means nothing ever runs the gates for the code it
# carried — because `detect-changes` on the NEXT push computes changed files
# from THAT push's diff alone, not from everything since the last completed
# run. So a code merge followed by a docs-only merge leaves the code
# unvalidated and the docs-only run reports green over it.
#
# THIS HAPPENED, on the afternoon this line was written. #1054 merged at 21:32
# with a change to this workflow and a new guard; #1055 merged at 21:43 with
# one paragraph of prose. Run 2841 was eleven minutes into the suite on the
# Spark and was cancelled where it stood. Run 2843 read its own diff — one
# `.md` file — skipped `lint`, `unit-tests`, `ui-tests`, `migration-lint` and
# `integration-tests`, and concluded success in four and a half minutes.
# `main` then carried a green tick over a tree whose tests had not run. Nothing
# lied: `ci-complete` named every skipped gate in its summary, exactly as it is
# built to. The composition did.
#
# WHAT THIS ACTUALLY BUYS, corrected 2026-09-22 after watching it. The first
# version of this comment said pushes "now wait for each other instead of
# cancelling each other", and the pull request said every pushed commit gets
# its own completed run. Both were wrong, and a reason that is wrong is worse
# than no reason — so here is the measurement that replaced the guess.
#
# Four merges landed in ninety-one seconds:
#
#   2850  c66743a (#1057)  created 05:24:28  ran to completion
#   2851  b01675c (#1058)  created 05:25:00  CANCELLED 05:25:17
#   2852  0f89337 (#1059)  created 05:25:16  CANCELLED 05:26:00
#   2853  2920c86 (#1060)  created 05:25:59  ran to completion
#
# Each cancellation lands one second after the NEXT run is created. GitHub
# holds one run pending per concurrency group; a newer arrival takes that slot
# and the run already in it is cancelled. `cancel-in-progress` does not reach
# that — it governs the run that HOLDS the group, and 2850 proves it does:
# under the old `true` it would have died at 05:25:00, and instead it shrugged
# off all three merges behind it.
#
# So of N merges arriving faster than a build takes, the OLDEST and the NEWEST
# complete and the middle ones do not. That is strictly better than what this
# replaced — where only the newest survived, and a docs-only newest ran nothing
# at all — and it is not the same as every commit being built. `b01675c` and
# `0f89337` have no completed build and never will.
#
# The tree is still covered: 2853's head contains all four changes. What is
# lost is the per-commit RECORD, which is the question an audit asks and the
# reason this is written down rather than shrugged at. Closing it properly
# needs a merge queue, which is a bigger decision than a flag.
#
# The groups are already separate — `github.ref` is `refs/pull/N/merge` on a
# pull request and `refs/heads/main` on a push — so this changes only the push
# path. Held by `a-run-that-was-cancelled-and-called-green.unit.test.ts`.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-changes:
    name: detect-changes
    runs-on: ${{ github.event_name == 'push' && 'self-hosted' || 'ubuntu-24.04' }}
    outputs:
      any_changed: ${{ steps.filter.outputs.any_changed }}
      migrations_changed: ${{ steps.migrations.outputs.any_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Get changed files
        id: filter
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          # Docs-only changes (docs/**, **.md) skip lint/tests
          # Integration tests run when DAV/ledger/testing packages change
          #
          # `scripts/**` added 2026-08-13. Its absence meant a change to
          # scripts/windows/*.ps1 -- which we hand to customers -- ran no gate at
          # all, including the ASCII check in package-appliance.unit.test.ts that
          # exists because a UTF-8 em dash, read as Windows-1252 by PowerShell
          # 5.1, once broke uninstall-task.ps1's parse twenty lines from the
          # character. Same reasoning as ci.yml being in the migrations filter
          # below: code we ship proves green on its own pull request.
          #
          # `docs/*-setup.md` added 2026-09-04, and it is the exception that
          # proves the docs-only skip right everywhere else. Those files are
          # not just prose: `end-user-docs.unit.test.tsx` reads them through
          # the SAME `import.meta.glob('../../../../docs/*-setup.md')` the
          # customer-facing /docs page uses, and asserts they cite no workplan,
          # no ADR and no edition aside — because a customer cannot open any of
          # those. So a docs-ONLY change to a customer guide could break a unit
          # test that this filter then skipped, and `ci-complete` reported
          # success over a red guard. Observed on PR #772, which was green
          # while `apple-setup.md` cited three workplans; the failure only
          # surfaced on a later branch that happened to touch code.
          #
          # `docs/LESSONS.md` and `docs/adr/**` added 2026-09-16, by the same
          # rule and after the same defect in two more places. Both are read by
          # tests: `lessons.unit.test.ts` compares LESSONS.md against a fresh
          # regeneration, and `adr-operative.unit.test.ts` assembles OPERATIVE.md
          # from every ADR's own `## Operative rules` block. So a docs-only
          # change to either CAN break a unit test, and this filter was skipping
          # it — #772's defect exactly, in two places nobody had re-checked.
          # It bit for real: #968 and #969 each added a guard and each
          # regenerated LESSONS.md against a base without the other, so main
          # landed on a count of 133 against 134 guard files and CI run #2654
          # went red. The one-line fix could not prove itself either, because
          # THAT pull request was docs-only too.
          #
          # Deliberately still NOT `docs/**`: workplans and architecture notes
          # are read by nothing, and un-skipping the suite for them would give
          # every prose commit a nine-minute test run for no assertion. The
          # rule is narrow on purpose — a doc a TEST reads is code's business.
          #
          # Widened 2026-09-21, and this time not by remembering. Everything above
          # was a family somebody had noticed after it bit. A scan of all 758 test
          # files found FIFTEEN more repository files that a test READS and this
          # filter did not select: `docs/feature-matrix.md`, which
          # `feature-matrix.unit.test.ts` asserts names every source and target
          # kind; `docs/managed-bring-up.md`, read by three script guards;
          # `README.md`, read by three more; `docs/workplans/0117-...`, whose
          # "TAKEN 2026-09-09" line a cutover test asserts on; and the marketing
          # site's own `build.mjs`. Every one of them was #772's defect sitting
          # open, and the three-week lag is the whole cost of the list being kept
          # by hand. `a-doc-a-test-reads-that-ci-skipped.unit.test.ts` now
          # DISCOVERS that set from the tests themselves rather than restating it,
          # so the sixteenth goes red on its own pull request.
          #
          # `site/**` and `test/**` join `deploy/**` and `scripts/**` for the same
          # reason those did: they hold code a test reads, and `**.js` does not
          # match `.mjs`.
          #
          # `docs/*.md` — ALL of them, from 2026-09-22, replacing the ten that were
          # named individually. Not a loosening: `pasteable-hints.unit.test.ts` reads
          # EVERY top-level document, through `readdirSync(DOCS_DIR)`, and refuses any
          # line calling `env-upsert.sh` with a `KEY=VALUE` before the env file. It has
          # done so all along. The ten names were simply the ten a scan of LITERAL
          # paths could see, and a walk names nothing.
          #
          # Two of the forty-eight carry such a hint today and both were already
          # covered, so nothing was broken — the hole was one `env-upsert.sh` line in
          # any other guide away from opening, and the person adding that line is
          # exactly who the guard is for.
          #
          # THE COST, stated rather than buried: a prose-only edit to any top-level
          # document now runs the full suite, where thirty-eight of them used to skip
          # it. The alternative is a guard that cannot fire on the commit that breaks
          # it, which is #772 and is what this whole filter exists to have stopped.
          # Workplans, ADRs and architecture notes are unaffected — they are not
          # top-level and the narrow rule still holds for them.
          #
          # `docs/guides/**` added 2026-09-24 (workplan 0148 T1). The customer
          # guides moved out of `docs/*-setup.md` into `docs/guides/<locale>/`,
          # a folder `docs/*.md` does not select, and `end-user-docs.unit.test.tsx`
          # and `Docs.unit.test.tsx` read every file there through the page's own
          # glob. The `-setup.md` files stay selected by `docs/*.md`: they are the
          # operator documents now, and other guards still read them.
          #
          # `SECURITY.md` added 2026-09-27 (workplan 0139 T9):
          # `one-way-to-report-a-vulnerability.unit.test.ts` holds its channels
          # to the site's security.txt, so a change to it alone must run tests.
          #
          # `CHANGELOG.md` added 2026-09-28 (workplan 0146 T2):
          # `a-release-that-names-itself.unit.test.ts` reads it for the root
          # version's dated section, the heading the release check looks for, so
          # a change to it alone must run tests.
          #
          # `docs/design/**` added 2026-09-28 (workplan 0153 §5): the drawings are
          # read by `an-icon-drawn-twice.unit.test.tsx` and `ProviderTile.unit.test.tsx`,
          # which hold the app's icons and tile colours equal to them, so a redrawn
          # icon alone must run tests.
          #
          # Comments belong HERE and not inside the block scalar below, where a
          # `#` line is a PATTERN rather than a comment.
          files: |
            docs/*.md
            docs/guides/**
            docs/design/**
            docs/adr/**
            README.md
            AGENTS.md
            CONTRIBUTING.md
            SECURITY.md
            CHANGELOG.md
            TRADEMARK.md
            NOTICE
            docs/workplans/0117-the-conveyor-belt-not-the-home.md
            **.ts
            **.tsx
            **.js
            **.sql
            **.yml
            **.yaml
            **.json
            package.json
            pnpm-lock.yaml
            packages/connectors/**
            packages/core/**
            packages/ledger/**
            packages/orchestration/**
            packages/testing/**
            packages/scheduler/**
            apps/**
            deploy/**
            scripts/**
            site/**
            test/**
      - name: Did the ledger migrations (or this workflow) change?
        id: migrations
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          # The workflow file is included so a change to the lint job itself
          # proves green on its own PR instead of merging untested.
          files: |
            packages/ledger/migrations/**
            packages/managed/migrations/**
            .github/workflows/ci.yml

  commit-convention:
    name: commit-convention
    # PULL REQUESTS ONLY, and this is the load-bearing line.
    #
    # `main` carries a hundred prose subjects written while nothing read them —
    # two of the last two hundred follow the convention, and both are
    # dependabot's. A gate that judged history would be red on every push to
    # `main` forever, with not one of those commits fixable, and would be turned
    # off within the week. It reads `base..head` and nothing else, so no branch
    # has to be rewritten to go green.
    #
    # `ci-complete` requires this job only where this `if:` says it runs, so
    # skipping here on a push is green AND is named in its summary table. On a
    # pull request it must end in `success`; change this line and the matching
    # line in ci-complete's SHOULD_RUN together (the guard in
    # scripts/a-run-that-was-cancelled-and-called-green.unit.test.ts holds them).
    if: github.event_name == 'pull_request'
    # Hosted unconditionally: it only ever runs on a pull request, which by the
    # policy in the header never touches the Spark.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Both ends of the range must be reachable. The default shallow fetch
          # has neither the base tip nor the branch's own history, and the
          # script would fail with git's error instead of a verdict.
          fetch-depth: 0
      # The Node the images run, like every job that runs Node. Without it the
      # script ran the hosted image's default, a version nobody chose
      # (a-gate-on-a-version-nothing-ships, 2026-11-01).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          check-latest: true # the newest 26.x, not the first one in the runner's tool cache
      - name: Judge the commit subjects this branch adds
        # THROUGH `env:`, not interpolated into the script. These two are
        # GitHub-generated SHAs today and therefore safe, and the moment
        # somebody widens this step to a title or a branch name the habit is
        # already the right one — a `${{ }}` inside `run:` is a shell injection
        # from a pull request nobody has to be trusted to open.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/commit-convention.mjs "$BASE_SHA" "$HEAD_SHA"

  docs-hygiene:
    name: docs-hygiene
    runs-on: ${{ github.event_name == 'push' && 'self-hosted' || 'ubuntu-24.04' }}
    # Quality gate for all changes (incl. docs-only)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify only allowed markdown files at repo root
        run: |
          set -e
          allowed="README.md AGENTS.md CLAUDE.md CONTRIBUTING.md CHANGELOG.md SECURITY.md CODE_OF_CONDUCT.md LICENSE.md TRADEMARK.md"
          violations=0
          for f in $(find . -maxdepth 1 -type f -name "*.md" -printf "%f\n"); do
            if ! grep -qx "$f" <<<"${allowed// /$'\n'}"; then
              echo "::error file=$f::Unexpected markdown file at repo root: $f"
              echo "Root-level .md files are restricted per CONTRIBUTING.md. Allowed: $allowed"
              violations=$((violations + 1))
            fi
          done
          [ "$violations" -gt 0 ] && { echo "Move it under docs/ or update CONTRIBUTING.md."; exit 1; } || true
          echo "Root markdown allowlist OK."
      - name: Verify canonical docs exist
        run: |
          set -e
          expected="docs/architecture/solution-architecture.md docs/testing.md docs/deployment.md docs/adr/0000-template.md"
          missing=0
          for f in $expected; do
            [ -f "$f" ] || { echo "::error file=$f::Canonical doc missing: $f"; missing=$((missing + 1)); }
          done
          [ "$missing" -gt 0 ] && { echo "Canonical docs are the source of truth; removing one requires an ADR."; exit 1; } || true
          echo "Canonical docs present."
      - name: Check for case collisions in tracked files
        run: |
          set -e
          echo "Checking for files that differ only by case..."
          # Get all tracked files, normalize to lowercase, find duplicates
          duplicates=$(git ls-files | tr '[:upper:]' '[:lower:]' | sort | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "::error::Case collision detected! Files that differ only by case:"
            echo "$duplicates" | while read line; do
              echo "  - $line"
              git ls-files | grep -i "^$line$" | while read f; do
                echo "    -> $f"
              done
            done
            echo "This breaks case-insensitive filesystems (Windows, macOS default)."
            echo "Fix: rename or remove one of the conflicting files."
            exit 1
          fi
          echo "No case collisions found."
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          check-latest: true # the newest 26.x, not the first one in the runner's tool cache
      - name: Generated docs match the tree that generates them
        # HERE rather than only in `unit-tests`, and the distinction cost a red
        # main on 2026-09-10.
        #
        # `docs/LESSONS.md` and `docs/adr/OPERATIVE.md` are GENERATED, and
        # generated from the WHOLE TREE — the guards in `scripts/`, the ADRs in
        # `docs/adr/`. `scripts/lessons.unit.test.ts` already runs the same
        # check, but it lives in `unit-tests`, which `detect-changes` skips on
        # a docs-only change. That leaves two holes and both are real:
        #
        #  1. A docs-only PR that edits a generated file by hand merges with
        #     the check that would have caught it skipped.
        #  2. A PR that FIXES one of these files is docs-only by nature, so
        #     its fix cannot be verified before it lands — which is exactly
        #     what this job was added for.
        #
        # This job has no `needs: detect-changes` and is documented as "quality
        # gate for all changes (incl. docs-only)", so it is the right home.
        # Cheap: both generators are plain node, no install, no containers.
        #
        # The workplan index (docs/workplans/README.md's generated region) is
        # the third, generated from each plan's first line, one-line summary
        # and Status block (workplan 0147 T1). Its unit test reads fixtures
        # only, so that prose commits to workplans do not run the suite, which
        # makes this job the only place the real plans are checked.
        #
        # None is ever hand-merged or hand-edited. Regenerate:
        #   node scripts/lessons.mjs --write
        #   pnpm adr:operative
        #   pnpm workplans:index
        run: |
          set -e
          node scripts/lessons.mjs --check
          node scripts/adr-operative.mjs --check
          node scripts/workplan-index.mjs --check
      - name: No file holds a merge conflict
        # HERE for the reason the step above is: `detect-changes` skips
        # `unit-tests` for a change to the workplans alone, and of the 567
        # files that conflicted in 1,730 replayed merges, 176 were workplan
        # bodies. A conflict a docs-only pull request left in one would merge
        # green and turn the next, unrelated pull request red, which is #772.
        # Plain node, no install. The rules, and the one file that quotes a
        # conflict on purpose (0099), are in
        # scripts/a-conflict-left-in-a-file.unit.test.ts.
        run: node scripts/conflict-markers.mjs --check
      - name: Every document llms.txt links is in the tree, under its own heading
        # HERE for the same reason: the public site's llms.txt links the
        # maintained documentation on main (ADR-0029, site/maintained-docs.mjs),
        # and the change that renames, removes or retitles one of those is
        # often docs-only, which `detect-changes` skips `unit-tests` for. Run
        # here, the rename fails its own pull request instead of turning the
        # link dead. Not in site/build.mjs, which live's deploy runs on an
        # archive of site/ alone. Plain node, no install. The guard is
        # scripts/a-doc-an-assistant-is-sent-to.unit.test.ts.
        run: node scripts/llms-docs.mjs --check

  fixture-uuid-check:
    name: fixture-uuid-check
    runs-on: ${{ github.event_name == 'push' && 'self-hosted' || 'ubuntu-24.04' }}
    # Runs on all PRs — fast check before heavier jobs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for cross-file UUID collisions
        run: |
          ./scripts/check-fixture-uuid-collisions.sh

  migration-lint:
    name: migration-lint (${{ matrix.runner }})
    # BOTH ARCHITECTURES ON A PULL REQUEST (workplan 0119, 2026-11-01). The
    # Atlas this job runs is a different download for amd64 and arm64, and a
    # push runs it on the self-hosted arm64 runner. Until then a pull request
    # ran the amd64 one only, so the first run of a new arm64 binary was the
    # merge push, on the owner's machine. As in integration-tests: a push stays
    # one self-hosted run, and `fail-fast: false` keeps the other leg's result.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ github.event_name == 'push' && fromJSON('["self-hosted"]') || fromJSON('["ubuntu-24.04","ubuntu-24.04-arm"]') }}
    needs: detect-changes
    # ADR-0017's last unbuilt bullet, decided KEEP + BUILD by the owner
    # (2026-08-02, workplan 0021 T5): Atlas replays every migration against a
    # disposable dockerized Postgres and fails on destructive changes. Only
    # runs when the migration directory (or this workflow) changes.
    if: ${{ needs.detect-changes.outputs.migrations_changed == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Atlas (community edition)
        # A direct binary download into RUNNER_TEMP, NOT `curl | sh`: the
        # installer script ends with a sudo copy into /usr/local/bin, and the
        # self-hosted runner (main pushes) has no passwordless sudo. That
        # combination stayed invisible for as long as no main push touched the
        # migration directory — the first one (migration 0005, 2026-08-03)
        # failed here on the sudo prompt, not on the migration. The download
        # host is the same one the installer itself resolves to.
        #
        # A NAMED RELEASE, CHECKED BY ITS SHA-256 BEFORE ANYTHING RUNS IT
        # (workplan 0119, 2026-11-01). Until then this fetched
        # `atlas-community-linux-<arch>-latest`, with no version and no
        # checksum, and ran it: on the owner's machine for a main push, and
        # that name is a CANARY build of upstream's master branch, not a
        # release (CI printed `v1.3.1-f851298-canary`). Now it fetches the
        # release below for BOTH architectures the job runs on (the
        # self-hosted runner is arm64, the hosted one amd64), refuses either
        # whose SHA-256 is not the one pinned here, and only then makes the
        # native one executable and prints its version, which must be the
        # release named. Both are checked on every run so that a wrong arm64
        # pin fails its own pull request, not the next main push that touches
        # a migration, on the owner's machine; and a pull request runs this
        # job on hosted arm64 as well, so the arm64 binary has printed its
        # version before that machine runs it. `a-pin-that-knows-it-is-behind`
        # RUNS this `run:` under bash, with `curl` and `uname` stubbed, and
        # fails if a wrong sum for either architecture, or a binary that calls
        # itself another version, does not stop it with nothing installed.
        #
        # WHERE THE SUMS COME FROM. Each is the SHA-256 of `/atlas` in the
        # same release's community image on Docker Hub,
        # `arigaio/atlas:1.3.6-community@sha256:66a344bff417fa22820c13742eb45c6d0b6f630f2f0f402273d520347198417a`
        # (linux/amd64 manifest `22086c9b…`, linux/arm64 `1f7cf5b5…`), read
        # through the registry's own digests, layer by layer. So a run that
        # passes here has two channels agreeing on the bytes, both carrying
        # one output of Ariga's own build (`-tags=official`, version v1.3.6).
        # Its Go build information names upstream commit `ed994a77898e`
        # (2026-10-21): clean for amd64, while the arm64 build reports a
        # modified tree (`vcs.modified=true`), so only the amd64 one says it
        # is that commit as published. Docker Hub listed the tag on
        # 2026-10-27 13:03 UTC, past the three-day floor (CONTRIBUTING.md) on
        # 2026-10-30. Upstream's git tags stop at v1.3.0, so the release list
        # is the image's tags, and that is what the pin watch reads
        # (`scripts/idp-pin-watch.mjs`, its Atlas row; Dependabot cannot see
        # a URL in a `run:`).
        #
        # TO MOVE IT: a newer `<version>-community` tag, three days old; read
        # `/atlas` out of its amd64 and arm64 images the same way (or let this
        # step fail once: it prints the sum it saw for each architecture), set
        # all three values below in one pull request, and read the version
        # line in both of its migration-lint legs' logs.
        env:
          ATLAS_VERSION: v1.3.6
          ATLAS_SHA256_AMD64: bb6e81678b18335c911717e62677c742f8328737533825b9af57a2917a649b56
          ATLAS_SHA256_ARM64: 723e4cac76d56cc1a6ea6e4fa9696f466be9ede6e7d450c4e750ca3195c7b067
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) native=amd64 ;;
            aarch64) native=arm64 ;;
            *) echo "::error::No Atlas is pinned for $(uname -m): only amd64 and arm64."; exit 1 ;;
          esac
          refused=0
          for arch in amd64 arm64; do
            if [ "$arch" = amd64 ]; then pinned="$ATLAS_SHA256_AMD64"; else pinned="$ATLAS_SHA256_ARM64"; fi
            download="$RUNNER_TEMP/atlas-$ATLAS_VERSION-linux-$arch"
            rm -f "$download"
            curl --proto '=https' --tlsv1.2 -sSfL --retry 3 -o "$download" \
              "https://atlasbinaries.com/atlas/atlas-community-linux-${arch}-${ATLAS_VERSION}"
            seen="$(sha256sum "$download")"
            seen="${seen%% *}"
            if [ "$seen" = "$pinned" ]; then
              echo "Atlas $ATLAS_VERSION linux/$arch: sha256 $seen, as pinned."
            else
              echo "::error::Atlas $ATLAS_VERSION linux/$arch is not the build this workflow pins: its sha256 is $seen, and the pin is $pinned. Nothing was run."
              refused=1
            fi
          done
          [ "$refused" = 0 ] || exit 1
          mkdir -p "$RUNNER_TEMP/atlas-bin"
          install -m 0755 "$RUNNER_TEMP/atlas-$ATLAS_VERSION-linux-$native" "$RUNNER_TEMP/atlas-bin/atlas"
          echo "$RUNNER_TEMP/atlas-bin" >> "$GITHUB_PATH"
          said="$("$RUNNER_TEMP/atlas-bin/atlas" version)"
          echo "$said"
          if [ "${said%%$'\n'*}" != "atlas community version $ATLAS_VERSION" ]; then
            echo "::error::The Atlas this step installed does not call itself community $ATLAS_VERSION."
            exit 1
          fi
      - name: Lint all migrations against a disposable dev database
        run: |
          # BOTH chains, replayed as ONE directory in the order a managed
          # deployment applies them (ADR-0036).
          #
          # Not two lint runs. Atlas replays a directory against an EMPTY dev
          # database, and every table in the managed chain has
          # `REFERENCES public.tenant(id)` — so linting it on its own does not
          # merely check less, it fails outright on a table the other chain
          # creates. Staging them into one directory with the managed files
          # renumbered above the shared ones reproduces the real order, which is
          # also the only arrangement in which those foreign keys are checked at
          # all.
          #
          # The renaming is confined to this scratch directory. Nothing reads
          # these names but Atlas, and the runner keys on the real filenames.
          staged="$RUNNER_TEMP/migrations-both"
          mkdir -p "$staged"
          cp packages/ledger/migrations/*.sql "$staged/"
          for f in packages/managed/migrations/*.sql; do
            cp "$f" "$staged/9$(basename "$f")"
          done
          ls "$staged"
          # atlas.sum is generated here, not committed: lint requires the
          # integrity file to exist, while append-only migration discipline is
          # enforced by scripts/a-chain-that-only-grows.unit.test.ts (workplan
          # 0146 T3, ADR-0045).
          atlas migrate hash --dir "file://$staged"
          # --latest 999 = lint the whole directory every time. The set is
          # small, the replay is seconds, and it keeps the job deterministic
          # instead of depending on git-base resolution.
          #
          # THE DEV DATABASE IS THE POSTGRES THE STACKS RUN, BY DIGEST
          # (workplan 0119, 2026-11-01): the base `deploy/compose/postgres/
          # Dockerfile` builds on, tag and index digest. It was
          # `docker://postgres/18/dev` until then: Docker Hub's floating `18`
          # (Debian), whichever build it named the day a runner pulled it.
          # Atlas's docker driver takes the path's first part as the tag and
          # runs `docker run … postgres:<tag>` (FromURL and PostgreSQL in its
          # cmd/atlas/internal/docker, at v1.3.6's commit), and a tag that
          # carries `@sha256:` reaches `docker run` whole. The last part is the
          # database because it holds no `:`. A Dependabot pull request that
          # moves that FROM fails `a-gate-on-a-version-nothing-ships` until
          # this line moves too; the failure prints the `sed` that moves it.
          atlas migrate lint \
            --dir "file://$staged" \
            --dev-url "docker://postgres/18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5/dev?search_path=public" \
            --latest 999

  lint:
    name: lint
    runs-on: ${{ github.event_name == 'push' && 'self-hosted' || 'ubuntu-24.04' }}
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.any_changed == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          check-latest: true # the newest 26.x, not the first one in the runner's tool cache
          # This was the ONE node job without it (found 2026-08-11), and the
          # worst one to be missing: everything downstream `needs: lint`, so a
          # cold `pnpm install` here delayed the entire workflow, not just this
          # job. Cached it is ~6s; cold it is tens of seconds, every PR.
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ESLint's incremental cache. `--cache-strategy content` (set in the lint
      # script) hashes file CONTENT rather than mtime, which is the only
      # strategy that survives a checkout: actions/checkout writes every file
      # fresh, so an mtime-keyed cache invalidates 100% of its entries and buys
      # nothing. Measured on this repo: after touching every .ts, metadata fell
      # back to 10.6s while content held at 2.7s.
      #
      # restore-keys lets a run start from the previous commit's cache and
      # re-lint only what changed, instead of an all-or-nothing hit.
      - name: Restore ESLint cache
        # v6.1.0, same pin and same reason as the Chromium cache below:
        # actions/cache v4 still declares `using: node20`.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('eslint.config.js', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('eslint.config.js', 'pnpm-lock.yaml') }}-
      - name: Lint & typecheck
        # A heap named, not the runner's default (2026-10-31, the move to Node
        # 26, workplan 0119 §2.4). The lint is type-aware, and ESLint keys each
        # cache entry on `process.version` (lint-result-cache.js), which the key
        # above does not carry: the first lint on a new Node finds every entry
        # stale and lints the whole repository cold. Cold, with the default
        # heap, it ran out of memory after about 104 s on a machine whose
        # default was about 2.1 GB, on Node 24 and 26 alike ("Ineffective
        # mark-compacts near heap limit"), and passed with a larger one. The
        # hosted and self-hosted runners' defaults passed it cold on 24; 4 GB
        # says what it needs instead of hoping the next runner's default is
        # as large.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          pnpm lint
          pnpm typecheck   # tsc (TypeScript 7) --noEmit across the workspace

  # ALONGSIDE lint, not after it (the owner, 2026-10-05). The unit suite is
  # the longest job on the path to integration-tests, and waiting for lint
  # first added lint's minute to every run for nothing: a lint failure fails
  # ci-complete either way. Gated on detect-changes itself, which is what lint
  # was passing on, so a docs-only change still skips it.
  #
  # SPLIT OVER FOUR HOSTED RUNNERS ON A PULL REQUEST (the owner, 2026-10-05),
  # with `vitest --shard=N/4`. Measured on #1508, the same commit both ways:
  # one runner took 11m21s, the slowest of four shards 6m08s. Most of the
  # suite's time is per-file start-up (import, transform, PGlite), spread
  # evenly across the files, so it divides by the shard count; the slowest
  # single file (scripts/a-first-bring-up-of-live.unit.test.ts, about 160s)
  # is the floor.
  #
  # ONE RUN ON A PUSH. The Spark is one box that also serves production, and
  # four copies of the suite there are what the worker cap below exists to
  # prevent, so the matrix is a single `all` leg on a push.
  #
  # Coverage stays on in every leg; a shard's report covers only its own
  # files, uploaded under its own name.
  unit-tests:
    name: unit-tests (${{ matrix.shard }})
    runs-on: ${{ github.event_name == 'push' && 'self-hosted' || 'ubuntu-24.04' }}
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.any_changed == 'true' }}
    strategy:
      # Every shard reports, so a failure names all the files that broke.
      fail-fast: false
      matrix:
        shard: ${{ github.event_name == 'push' && fromJSON('["all"]') || fromJSON('["1","2","3","4"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # TAGS, and therefore full history. §22.1's N-1 -> N upgrade gate
          # reads the previous release's migrations straight out of the tag
          # (`git show v0.1.0-rc.1:packages/ledger/migrations/...`), so a
          # depth-1 checkout leaves it with no reference to upgrade FROM.
          # It would then SKIP — silently, and green. The gate fails loudly on
          # a missing tag under CI for the same reason, but the fix belongs
          # here: the gate should run, not report why it could not.
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          check-latest: true # the newest 26.x, not the first one in the runner's tool cache
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # What the box had when the unit tests began, so a worker killed
      # mid-file can be read against it (the cap below). It cannot fail.
      - name: Cores and memory
        run: nproc; free -m || true
      - name: Run unit tests (vitest; excludes integration/e2e)
        env:
          SKIP_STALWART: 'true'
          # Unit tests mock all DAV/HTTP; no unit test reads NEXTCLOUD_* — skip
          # the ~30s Nextcloud container boot the global setup otherwise does.
          SKIP_NEXTCLOUD: 'true'
          # AT MOST FOUR WORKERS ON THE SPARK. vitest runs one worker per core
          # less one: three on a 4-vCPU hosted runner, and on the Spark as many
          # as its cores allow (the step above prints them). A worker holds a
          # PGlite database and its coverage, about 0.6GB: nineteen of them
          # held 13GB at once when measured, on a box that also serves
          # production. From 2026-09-24 a push to main failed here more often
          # than it passed, most often with workers killed mid-file by SIGKILL,
          # which vitest does not send and the kernel's out-of-memory killer
          # does, and PGlite's migrations in a `beforeAll` past their 30
          # seconds. The same suite passes on the hosted runners a pull
          # request uses, which run three. Empty on a pull request, where
          # vitest keeps its own default.
          VITEST_MAX_WORKERS: ${{ github.event_name == 'push' && '4' || '' }}
        # No `--`: pnpm forwards it literally, and vitest's CLI parser discards
        # everything after it. `pnpm test -- --coverage` therefore ran
        # `vitest run --project unit --project unit-browser -- --coverage`,
        # which never enabled coverage — so the upload step below has been
        # publishing an empty artifact. Same defect as the e2e filters in
        # e2e.yml.
        #
        # `--shard=N/4` only on a pull request's legs; the `all` leg runs
        # every file.
        run: pnpm test --coverage ${{ matrix.shard != 'all' && format('--shard={0}/4', matrix.shard) || '' }}
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.shard == 'all' && 'coverage-report' || format('coverage-report-shard-{0}', matrix.shard) }}
          path: '**/coverage/'
          retention-days: 7

  # The managed UI, in a real browser, on EVERY PR.
  #
  # Its own job rather than a step in unit-tests, because it needs a Chromium
  # binary and a production build of the web app — neither of which the unit
  # gate should have to wait for. It stays on the PR path (not the nightly e2e
  # where the selfhost UI smoke lives) because the three defects it exists for
  # — an uncompiled stylesheet, a bundle calling the wrong origin, a dead list
  # row — all SHIPPED, and all of them are cheap to catch before merge.
  #
  # No services: the suite builds the bundle and serves it from an in-process
  # http server that answers /api from fixtures, which is also what makes its
  # same-origin assertion honest. Runtime is ~20s including the build.
  ui-tests:
    name: ui-tests
    runs-on: ${{ github.event_name == 'push' && 'self-hosted' || 'ubuntu-24.04' }}
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          check-latest: true # the newest 26.x, not the first one in the runner's tool cache
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # playwright-core ships no browsers (that is why it is the dependency —
      # see test/e2e/selfhost-ui.e2e.test.ts), so Chromium is installed
      # explicitly, here, where it is needed.
      #
      # CACHED because a hosted runner starts empty every time: the first run
      # of this job pulled 184 MiB of Chrome, 115 MiB of headless shell and
      # 2 MiB of ffmpeg — ~10s of a 51s job, repeated on every PR.
      #
      # KEYED ON THE RESOLVED playwright-core VERSION, because that is what
      # decides which browser build gets downloaded. The first attempt keyed on
      # `hashFiles('pnpm-lock.yaml')` and was wrong in a way worth recording:
      # every dependency change anywhere in the workspace threw away a 282 MiB
      # browser cache that only playwright-core can invalidate. It missed on
      # the very next pull request — one that added an unrelated devDependency
      # — while a comment right here claimed it was keyed on the version. The
      # comment described the design; the code did something looser.
      #
      # Read from the INSTALLED package rather than package.json's `^1.62.1`
      # range: the range is what a human wrote, the installed version is what
      # actually determines the browser on disk. A range would let a patch bump
      # reuse a cache whose browser no longer matches — and since a cache hit
      # skips the install step, that fails as a missing browser at launch
      # rather than as a cache miss.
      - name: Which browser build do we need?
        id: pw
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        id: pw-cache
        # v6.1.0, not v4: every actions/cache v4 release (through v4.3.0) still
        # declares `using: node20`, so the runner forces it onto Node 24 and
        # prints a deprecation warning on every run. Checked by reading each
        # tag's action.yml rather than assuming the newest v4 had fixed it —
        # it had not. v6.1.0 declares `node24` and is silent.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: node node_modules/playwright-core/cli.js install chromium
      - name: Managed UI smoke (real browser)
        # VITE_API_URL is deliberately NOT set: the suite builds the bundle
        # with the shipped same-origin default and asserts it stays that way.
        run: pnpm test:ui

  # THE arch-sensitive job, and now the one that closes the gap the header
  # describes. It runs real Postgres, real Nextcloud and real Stalwart
  # containers, which is the closest thing CI has to the arm64 Spark the
  # product actually deploys to.
  #
  # The other jobs are not matrixed because their work is architecture-neutral
  # TypeScript, `migration-lint` apart (it says why). Note what that claim is NOT: this file said until 2026-08-11
  # that "the workspace declares no native dependency", which was true of the
  # MANIFESTS and false of the TREE — `better-sqlite3` (via drizzle-orm) and
  # `libxmljs2` (via the CycloneDX SBOM tool) were both installed and both
  # native. They resolve arm64 prebuilds and the arm64 leg below passes, so the
  # conclusion held; the evidence for it did not, and a reason that is wrong
  # is worse than no reason. See workplan 0026 row 26. Since 2026-10-03
  # `libxmljs2` is not installed at all (pnpm-workspace.yaml's overrides say
  # why), so `better-sqlite3` is the native module left.
  #
  # On a PULL REQUEST it runs twice, amd64 and arm64, both free 4-vCPU hosted
  # runners. On a PUSH it stays a single self-hosted run — the Spark is already
  # arm64, and the matrix must not multiply work on a box that also serves
  # production.
  #
  # `fail-fast: false` so an arm64-only failure still reports the amd64 result.
  # Knowing WHICH architecture broke is the entire point of running both.
  integration-tests:
    name: integration-tests (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ github.event_name == 'push' && fromJSON('["self-hosted"]') || fromJSON('["ubuntu-24.04","ubuntu-24.04-arm"]') }}
    needs: unit-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # TAGS, as in unit-tests: the managed chain's upgrade proof on
          # Postgres (`migrate-upgrade.integration.test.ts`, workplan 0146 T4)
          # reads each release's chains and migrators out of its tag, and
          # under CI a tag it cannot reach is a failure, not a skip.
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          check-latest: true # the newest 26.x, not the first one in the runner's tool cache
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify Docker is available
        run: |
          docker --version
          docker compose version
      - name: Install stalwart-cli
        # A NAMED RELEASE, CHECKED BY ITS SHA-256 BEFORE ANYTHING RUNS IT
        # (workplan 0119, 2026-11-01). Until then this piped
        # `releases/latest/download/stalwart-cli-installer.sh` to `sh`: a
        # script that names no version until it is fetched, which then
        # downloaded and installed whatever release was newest that hour (the
        # installer checks the archive against a sum it carries itself, so
        # nothing here ever named the bytes). Now it fetches the release below
        # for BOTH architectures the job runs on (the hosted amd64 and arm64
        # runners for a pull request, the self-hosted arm64 runner for a push),
        # refuses either whose SHA-256 is not the one pinned here, and only
        # then unpacks the native one, installs it, and checks that it calls
        # itself that release. Both are checked on every run, so a wrong arm64
        # pin fails its own pull request. ci.yml, e2e.yml and e2e-managed.yml
        # carry this step word for word; `a-pin-that-knows-it-is-behind` holds
        # the three together and RUNS this `run:` under bash, with `curl`,
        # `uname` and `sleep` stubbed, and fails if a wrong sum for either
        # architecture, or a binary that calls itself another version, does
        # not stop it with nothing installed.
        #
        # WHICH FILE: `stalwart-cli-<arch>-unknown-linux-gnu.tar.xz`, the one
        # upstream's installer picked on every runner here (glibc 2.35 or
        # later; the logs read `downloading stalwart-cli 1.0.14
        # x86_64-unknown-linux-gnu` and `aarch64-unknown-linux-gnu`). Its
        # SHA-256 is the one upstream's `sha256.sum`, the file's own
        # `.sha256`, `dist-manifest.json` and the installer of that release
        # all give (read 2026-11-01). Released 2026-10-25 18:14 UTC, past the
        # three-day floor (CONTRIBUTING.md) on 2026-10-28. The server pin is
        # another matter (ADR-0022, docs/stalwart-integration-fix.md).
        #
        # Retried, because a single network blip here fails the whole
        # integration suite before one test has run. 2026-08-04: GitHub's
        # release CDN answered 502 for the binary and the job died at 27
        # seconds. THREE ATTEMPTS, THEN FAIL LOUD: a persistent outage still
        # fails the job, with the attempts it made stated (hard rule 9), and a
        # wrong sum is never retried.
        #
        # TO MOVE IT: a newer release three days old, when the pin watch's
        # summary issue lists it (`scripts/idp-pin-watch.mjs`, its stalwart-cli
        # row); its two sums from that release's `sha256.sum` (or let this step
        # fail once: it prints the sum it saw for each architecture); all three
        # values in all three workflows in one pull request, and the version
        # line read in both integration-tests legs' logs.
        env:
          STALWART_CLI_VERSION: v1.0.14
          STALWART_CLI_SHA256_AMD64: 78584b238422b0201a7bd223ed95b3c1a7fb8735ad3fa8c884d818a66fd1bc65
          STALWART_CLI_SHA256_ARM64: a30f0c1a0fb8a7ee8bc42fd0e699802e4c51257a53dbd681c4d91ddb6759792b
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) native=x86_64 ;;
            aarch64) native=aarch64 ;;
            *) echo "::error::No stalwart-cli is pinned for $(uname -m): only x86_64 and aarch64."; exit 1 ;;
          esac
          refused=0
          for arch in x86_64 aarch64; do
            if [ "$arch" = x86_64 ]; then pinned="$STALWART_CLI_SHA256_AMD64"; else pinned="$STALWART_CLI_SHA256_ARM64"; fi
            download="$RUNNER_TEMP/stalwart-cli-$STALWART_CLI_VERSION-$arch-unknown-linux-gnu.tar.xz"
            rm -f "$download"
            for attempt in 1 2 3; do
              if curl --proto '=https' --tlsv1.2 -sSfL -o "$download" \
                  "https://github.com/stalwartlabs/cli/releases/download/${STALWART_CLI_VERSION}/stalwart-cli-${arch}-unknown-linux-gnu.tar.xz"; then
                break
              fi
              echo "::warning::stalwart-cli $STALWART_CLI_VERSION linux/$arch: download attempt $attempt failed"
              if [ "$attempt" = 3 ]; then
                echo "::error::stalwart-cli $STALWART_CLI_VERSION could not be downloaded after 3 attempts. This is not a test failure: no test ran. Either GitHub's release download is unavailable or the release no longer serves this file."
                exit 1
              fi
              # 5s, then 15s: long enough for a CDN blip, short enough that a
              # real outage is reported inside a minute.
              sleep $((attempt * 10 - 5))
            done
            seen="$(sha256sum "$download")"
            seen="${seen%% *}"
            if [ "$seen" = "$pinned" ]; then
              echo "stalwart-cli $STALWART_CLI_VERSION linux/$arch: sha256 $seen, as pinned."
            else
              echo "::error::stalwart-cli $STALWART_CLI_VERSION linux/$arch is not the build this workflow pins: its sha256 is $seen, and the pin is $pinned. Nothing was run."
              refused=1
            fi
          done
          [ "$refused" = 0 ] || exit 1
          unpacked="$RUNNER_TEMP/stalwart-cli-unpacked"
          rm -rf "$unpacked"
          mkdir -p "$unpacked" "$RUNNER_TEMP/stalwart-cli-bin"
          tar -xJf "$RUNNER_TEMP/stalwart-cli-$STALWART_CLI_VERSION-$native-unknown-linux-gnu.tar.xz" -C "$unpacked" \
            --no-same-owner --strip-components 1 "stalwart-cli-$native-unknown-linux-gnu/stalwart-cli"
          install -m 0755 "$unpacked/stalwart-cli" "$RUNNER_TEMP/stalwart-cli-bin/stalwart-cli"
          echo "$RUNNER_TEMP/stalwart-cli-bin" >> "$GITHUB_PATH"
          said="$("$RUNNER_TEMP/stalwart-cli-bin/stalwart-cli" --version)"
          echo "$said"
          if [ "$said" != "stalwart-cli ${STALWART_CLI_VERSION#v}" ]; then
            echo "::error::The stalwart-cli this step installed does not call itself ${STALWART_CLI_VERSION#v}."
            exit 1
          fi
      - name: Run integration tests (Testcontainers spins up Postgres/Stalwart/Nextcloud)
        id: integration-tests
        run: pnpm test:integration
      - name: Upload integration logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-logs-${{ github.run_id }}
          path: test-logs/
          retention-days: 3
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-reports
          path: '**/reports/'
          retention-days: 7

  # ── The one check branch protection should require ──────────────────────────
  #
  # Required status checks are matched BY NAME, and this workflow's names are
  # not stable: `integration-tests` became `integration-tests (ubuntu-24.04)`
  # and `integration-tests (ubuntu-24.04-arm)` the day it gained a matrix, and
  # every future leg added, renamed or removed does the same. A required check
  # whose name no longer exists is not a failure — GitHub waits for a report
  # that never arrives, so the pull request blocks forever on a gate that is
  # actually green. Requiring THIS job instead makes the matrix free to change.
  #
  # `if: always()` is load-bearing. Without it a failure upstream SKIPS this
  # job, and a skipped required check reports no failure at all — the gate
  # would stop gating at exactly the moment something broke.
  #
  # `ci-complete-covers-every-job.unit.test.ts` fails if a job is added to this
  # workflow and not added to `needs` below. That is the real long-term
  # hazard: this job cannot notice a gate it was never told about, and it would
  # go on reporting green while covering less than it used to.
  #
  # SCOPE: ci.yml only. The checks produced OUTSIDE this file, which have to be
  # required alongside this one, are:
  #
  #   security-scan                  (security-scan.yml)
  #   Trivy                          (also security-scan.yml — the trivy-action
  #                                   posts its own check, so this is NOT a
  #                                   separate workflow; this comment used to
  #                                   list it as one)
  #   Check for committed artifacts  (no-committed-artifacts.yml)
  #
  # DO NOT REQUIRE `build (api|web|selfhost)` from images.yml, nor its
  # `build (postgres)` (0146 T15) and `build (trigger, amd64|arm64)` (0146
  # T16), even though you will see those checks on some pull requests. That
  # workflow's `pull_request`
  # trigger carries a `paths:` filter — the three Dockerfiles, `deploy/**` and
  # itself — so on a PR that touches none of them the workflow never runs and
  # those contexts are never reported at all. Required, they would hang such a
  # PR exactly the way the matrix contexts below do. (This comment listed them
  # as requirable when it was rewritten on 2026-08-13; corrected the same day,
  # after #383 showed the checks present on one PR and absent on the next.)
  #
  # `Windows payload` is workflow_dispatch only and never reports on a PR.
  #
  # REQUIRE THIS JOB, NOT THE INDIVIDUAL ci.yml JOBS — and specifically not
  # `integration-tests (ubuntu-24.04)` / `(ubuntu-24.04-arm)`. Those are MATRIX
  # jobs, and a skipped matrix job never expands: it reports once under the
  # literal name `integration-tests (${{ matrix.runner }})`, so the per-runner
  # contexts branch protection is waiting for are never reported at all. A
  # docs-only pull request then sits at "Expected — Waiting for status to be
  # reported" forever, with nothing queued in Actions to explain it. That
  # happened on 2026-08-13 (#381) and cost a merge. Non-matrix jobs do not have
  # this problem: skipped, they still report under their exact name, which
  # branch protection counts as satisfied.
  #
  # This job exists precisely to be the single required check: `if: always()`,
  # it needs every other job, it fails unless every one of them that SHOULD
  # have run for this event and this change ended in `success`, and it prints
  # which gates did not run so a green tick never claims coverage it does not
  # have.
  #
  # A GATE THAT NEVER RAN IS NOT PASSED (2026-10-05). Until that evening the
  # failing step here was conditional — `if: contains(needs.*.result,
  # 'failure') || contains(needs.*.result, 'cancelled')` — which is a list of
  # the ways to fail, and GitHub found another. During its incident "delays in
  # assigning GitHub-hosted runners", a job no runner picked up was given up
  # after fifteen minutes, and `needs` reported it as `abandoned`: a value
  # GitHub's documentation for `needs.<job_id>.result` does not list. The step
  # was skipped and this job reported SUCCESS over four runs, on three pull
  # requests, in which gates that should have run never did: lint and some or
  # all of the unit-test shards in 37364709044/1, 37371577511/1 and the re-run
  # 37366193208/2; and in 37373154965/1, `detect-changes` and
  # `commit-convention`, with everything `detect-changes` gates then skipped
  # as if the change were docs-only — and this is the check `main` requires.
  #
  # So the rule is turned around. SHOULD_RUN below says, for each job in
  # `needs`, whether it should have run — written as that job's OWN condition,
  # evaluated by GitHub with the same expression engine — and the last step
  # fails the run when a job that should have run did not end in `success`, or
  # a job that had no reason to run ended in anything but `skipped` or
  # `success`. Whatever GitHub calls a job that never ran, it is not `success`.
  # `detect-changes` is always expected: when it does not succeed its outputs
  # cannot be trusted (they are missing when it never ran), everything it
  # gates is skipped for the wrong reason, and that is caught by
  # `detect-changes` itself. When it DOES succeed, its outputs must say "true"
  # or "false" — anything else would skip the same gates for the same wrong
  # reason, with every result agreeing.
  #
  # Held by scripts/a-run-that-was-cancelled-and-called-green.unit.test.ts,
  # which RUNS these steps against the recorded runs of that evening (must
  # fail), recorded green runs (must pass), and every event and change with
  # each job doing exactly what its own `if:` and `needs:` say (must pass) or
  # any one of them not doing it (must fail). Add a job, or change a job's
  # `if:` or `needs:`, without changing its line in SHOULD_RUN, and it is red.
  ci-complete:
    name: ci-complete
    # Reads the other jobs' results and runs no repository code, so it is
    # hosted unconditionally rather than taking a slot on the box that also
    # serves production.
    runs-on: ubuntu-24.04
    if: always()
    needs:
      - detect-changes
      - commit-convention
      - docs-hygiene
      - fixture-uuid-check
      - migration-lint
      - lint
      - unit-tests
      - ui-tests
      - integration-tests
    env:
      RESULTS: ${{ toJSON(needs) }}
      # One line per job in `needs`: that job's own `if:`, and for a job with
      # none, the line of what it needs (`ui-tests` runs when `lint` does,
      # `integration-tests` when `unit-tests` does). Comments cannot go inside
      # the block below; it is JSON once GitHub has filled it in.
      SHOULD_RUN: |
        {
          "detect-changes": true,
          "commit-convention": ${{ github.event_name == 'pull_request' }},
          "docs-hygiene": true,
          "fixture-uuid-check": true,
          "migration-lint": ${{ needs.detect-changes.outputs.migrations_changed == 'true' }},
          "lint": ${{ needs.detect-changes.outputs.any_changed == 'true' }},
          "unit-tests": ${{ needs.detect-changes.outputs.any_changed == 'true' }},
          "ui-tests": ${{ needs.detect-changes.outputs.any_changed == 'true' }},
          "integration-tests": ${{ needs.detect-changes.outputs.any_changed == 'true' }}
        }
    steps:
      # SKIPPED IS NOT PASSED (AGENTS.md hard rule 9). A docs-only pull request
      # legitimately skips the test jobs, and this job legitimately goes green
      # — but "green" must then say which gates did not run, or the check
      # reports full coverage for a run that verified almost nothing.
      - name: Say what ran, and what did not
        run: |
          set -euo pipefail
          {
            echo "### CI gates"
            echo
            echo "| result | should have run | job |"
            echo "| --- | --- | --- |"
            jq -rn --argjson results "$RESULTS" --argjson should "$SHOULD_RUN" \
              '$results | to_entries[] | "| \(.value.result) | \(if $should[.key] == true then "yes" else "no" end) | \(.key) |"' | sort -r
          } | tee -a "$GITHUB_STEP_SUMMARY"

          skipped=$(jq -r 'to_entries[] | select(.value.result == "skipped") | .key' <<<"$RESULTS")
          if [ -n "$skipped" ]; then
            echo
            echo "NOT RUN, therefore NOT verified by this check:"
            sed 's/^/  - /' <<<"$skipped"
            echo "(the next step fails the run if any of these should have run for this change)"
          fi

      # No `if:`. A step that decides must not be one GitHub can skip: it runs
      # every time, and anything that is not `success` where `success` was
      # owed fails it — whatever GitHub calls it. And no `continue-on-error`,
      # in any form: it would turn this step's `exit 1` into the job's success.
      #
      # When `detect-changes` succeeded, each of its outputs must say exactly
      # "true" or "false". SHOULD_RUN's `== 'true'` reads anything else —
      # missing, empty — as "nothing changed", and so does every gated job's
      # own `if:`: an output whose `steps.<id>` stopped naming its step would
      # skip lint and every test for ever, and both sides would agree. Add an
      # output to `detect-changes` and it goes in the list below, or the guard
      # is red.
      - name: Fail unless every gate that should have run passed
        run: |
          set -euo pipefail
          problems=$(jq -rn --argjson results "$RESULTS" --argjson should "$SHOULD_RUN" '
              ($results | keys) as $needed
            | ($should | keys) as $named
            | ( ($needed - $named)[]
                | "\(.): ci-complete needs this job, and SHOULD_RUN does not say when it should run" ),
              ( ($named - $needed)[]
                | "\(.): SHOULD_RUN names a job ci-complete does not need" ),
              ( $should | to_entries[] | select(.value | type != "boolean")
                | "\(.key): SHOULD_RUN says \(.value | tojson), which is neither true nor false" ),
              ( $results["detect-changes"] | select(.result == "success") | .outputs as $said
                | ("any_changed", "migrations_changed") as $output
                | ($said[$output]) as $value
                | select($value != "true" and $value != "false")
                | "detect-changes: succeeded, and said \(if $value == null then "nothing" else ($value | tojson) end) for \($output) — SHOULD_RUN reads only \"true\" or \"false\", so every gate it decides was judged on nothing" ),
              ( $results | to_entries[]
                | .key as $job | (.value.result | tojson) as $got
                | if $should[$job] == true then
                    select(.value.result != "success")
                    | "\($job): should have run for this change, and its result is \($got)"
                  else
                    select(.value.result != "skipped" and .value.result != "success")
                    | "\($job): had no reason to run, and its result is \($got)"
                  end )')
          if [ -n "$problems" ]; then
            {
              echo
              echo "### Not passed"
              echo
              sed 's/^/- /' <<<"$problems"
            } | tee -a "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              echo "::error::$line"
            done <<<"$problems"
            exit 1
          fi
          echo "Every gate that should have run for this change ran and passed." | tee -a "$GITHUB_STEP_SUMMARY"
