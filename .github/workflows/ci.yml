# Unified CI — TypeScript/Node (pnpm). Mirrors the team convention:
#   detect-changes -> docs-hygiene (parallel) -> lint -> unit-tests -> integration-tests
# E2E is a SEPARATE, manual workflow (e2e.yml). Runs on the self-hosted (Spark) runner.
#
# ── Which machine runs untrusted code ────────────────────────────────────────
#
# SECURITY: the self-hosted runner is ONLY used for push events. Pull requests
# — including from forks, and this repository is PUBLIC — run on GitHub-hosted
# runners, so a stranger's branch never executes on the Spark. That box holds
# the live managed stack, its .env, the encrypted connection credentials and
# the trigger keys; `pnpm install` alone runs lifecycle scripts, which is all
# an attacker needs. Every workflow with a `pull_request` trigger follows this:
# ci.yml and security-scan.yml by the conditional below, and
# no-committed-artifacts.yml since 2026-08-11, when it was found to be the one
# exception. e2e.yml and e2e-o365.yml are schedule/dispatch only — no PR path
# to abuse — which is why they can name the runner unconditionally.
#
# WHAT THE SPLIT COSTS, stated so it is a known limitation and not a surprise:
# GitHub's hosted Linux runners are amd64, the Spark is arm64, so **a PR is
# validated on an architecture we do not deploy to, and the one we do deploy to
# is only exercised after merge.** This has bitten once already — task images
# built for amd64 died at exec on the arm64 Spark in under a second, with
# AutoRemove destroying the evidence (the 2026-08-01 hunt). A red main after a
# green PR is therefore a designed-in outcome here, not an anomaly.
#
# CLOSED for the job where it matters (2026-08-11). GitHub's arm64 hosted
# runners (`ubuntu-24.04-arm`) are generally available for PUBLIC repositories,
# 4 vCPU, free — the same tier as the amd64 ones — so `integration-tests` now
# runs on BOTH architectures on every pull request, and arm64 is exercised
# before merge rather than after. See that job for why it is the only one
# matrixed: it is the only one that runs real containers, and the workspace
# declares no native dependency that could make the others arch-sensitive.
#
# This also removes arm64 as a reason to keep CI on the box that runs
# production — see the operator runbook, "This box also runs CI".
#
# Runner images are PINNED (`ubuntu-24.04`, not `ubuntu-latest`) for the same
# reason every action here is pinned to a SHA: `-latest` moves under you, and
# this repository does not accept a dependency it did not choose.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # Release refs are test-gated (release-readiness, 2026-08-10): before
    # this, pushing a tag published signed images and a release with no lint,
    # typecheck, unit or integration gate on that ref — only the images and
    # security-scan workflows listened for tags.
    tags: ['v*']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: detect-changes
    runs-on: ${{ github.event_name == 'push' && 'self-hosted' || 'ubuntu-24.04' }}
    outputs:
      any_changed: ${{ steps.filter.outputs.any_changed }}
      migrations_changed: ${{ steps.migrations.outputs.any_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.5.0
      - name: Get changed files
        id: filter
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v44.5.7
        with:
          # Docs-only changes (docs/**, **.md) skip lint/tests
          # Integration tests run when DAV/ledger/testing packages change
          files: |
            **.ts
            **.tsx
            **.js
            **.sql
            **.yml
            **.yaml
            **.json
            package.json
            pnpm-lock.yaml
            packages/connectors/**
            packages/core/**
            packages/ledger/**
            packages/testing/**
            packages/scheduler/**
            apps/**
            deploy/**
      - name: Did the ledger migrations (or this workflow) change?
        id: migrations
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v44.5.7
        with:
          # The workflow file is included so a change to the lint job itself
          # proves green on its own PR instead of merging untested.
          files: |
            packages/ledger/migrations/**
            .github/workflows/ci.yml

  docs-hygiene:
    name: docs-hygiene
    runs-on: ${{ github.event_name == 'push' && 'self-hosted' || 'ubuntu-24.04' }}
    # Quality gate for all changes (incl. docs-only)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.5.0
      - name: Verify only allowed markdown files at repo root
        run: |
          set -e
          allowed="README.md AGENTS.md CLAUDE.md CONTRIBUTING.md CHANGELOG.md SECURITY.md CODE_OF_CONDUCT.md LICENSE.md"
          violations=0
          for f in $(find . -maxdepth 1 -type f -name "*.md" -printf "%f\n"); do
            if ! echo "$allowed" | tr ' ' '\n' | grep -qx "$f"; then
              echo "::error file=$f::Unexpected markdown file at repo root: $f"
              echo "Root-level .md files are restricted per CONTRIBUTING.md. Allowed: $allowed"
              violations=$((violations + 1))
            fi
          done
          [ "$violations" -gt 0 ] && { echo "Move it under docs/ or update CONTRIBUTING.md."; exit 1; } || true
          echo "Root markdown allowlist OK."
      - name: Verify canonical docs exist
        run: |
          set -e
          expected="docs/architecture/solution-architecture.md docs/testing.md docs/deployment.md docs/adr/0000-template.md"
          missing=0
          for f in $expected; do
            [ -f "$f" ] || { echo "::error file=$f::Canonical doc missing: $f"; missing=$((missing + 1)); }
          done
          [ "$missing" -gt 0 ] && { echo "Canonical docs are the source of truth; removing one requires an ADR."; exit 1; } || true
          echo "Canonical docs present."
      - name: Check for case collisions in tracked files
        run: |
          set -e
          echo "Checking for files that differ only by case..."
          # Get all tracked files, normalize to lowercase, find duplicates
          duplicates=$(git ls-files | tr '[:upper:]' '[:lower:]' | sort | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "::error::Case collision detected! Files that differ only by case:"
            echo "$duplicates" | while read line; do
              echo "  - $line"
              git ls-files | grep -i "^$line$" | while read f; do
                echo "    -> $f"
              done
            done
            echo "This breaks case-insensitive filesystems (Windows, macOS default)."
            echo "Fix: rename or remove one of the conflicting files."
            exit 1
          fi
          echo "No case collisions found."

  fixture-uuid-check:
    name: fixture-uuid-check
    runs-on: ${{ github.event_name == 'push' && 'self-hosted' || 'ubuntu-24.04' }}
    # Runs on all PRs — fast check before heavier jobs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.5.0
      - name: Check for cross-file UUID collisions
        run: |
          ./scripts/check-fixture-uuid-collisions.sh

  migration-lint:
    name: migration-lint
    runs-on: ${{ github.event_name == 'push' && 'self-hosted' || 'ubuntu-24.04' }}
    needs: detect-changes
    # ADR-0017's last unbuilt bullet, decided KEEP + BUILD by the owner
    # (2026-08-02, workplan 0021 T5): Atlas replays every migration against a
    # disposable dockerized Postgres and fails on destructive changes. Only
    # runs when the migration directory (or this workflow) changes.
    if: ${{ needs.detect-changes.outputs.migrations_changed == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.5.0
      - name: Install Atlas (community edition)
        # A direct binary download into RUNNER_TEMP, NOT `curl | sh`: the
        # installer script ends with a sudo copy into /usr/local/bin, and the
        # self-hosted runner (main pushes) has no passwordless sudo. That
        # combination stayed invisible for as long as no main push touched the
        # migration directory — the first one (migration 0005, 2026-08-03)
        # failed here on the sudo prompt, not on the migration. The download
        # host is the same one the installer itself resolves to.
        run: |
          arch="$(uname -m)"
          case "$arch" in x86_64) arch=amd64 ;; aarch64) arch=arm64 ;; esac
          curl -sSf -o "$RUNNER_TEMP/atlas" \
            "https://atlasbinaries.com/atlas/atlas-community-linux-${arch}-latest"
          chmod +x "$RUNNER_TEMP/atlas"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/atlas" version
      - name: Lint all migrations against a disposable dev database
        run: |
          # atlas.sum is generated here, not committed: lint requires the
          # integrity file to exist, while append-only migration discipline is
          # enforced by review and scripts/squash-migrations.sh.
          atlas migrate hash --dir "file://packages/ledger/migrations"
          # --latest 999 = lint the whole directory every time. The set is
          # small, the replay is seconds, and it keeps the job deterministic
          # instead of depending on git-base resolution.
          atlas migrate lint \
            --dir "file://packages/ledger/migrations" \
            --dev-url "docker://postgres/16/dev?search_path=public" \
            --latest 999

  lint:
    name: lint
    runs-on: ${{ github.event_name == 'push' && 'self-hosted' || 'ubuntu-24.04' }}
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.any_changed == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.5.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          # This was the ONE node job without it (found 2026-08-11), and the
          # worst one to be missing: everything downstream `needs: lint`, so a
          # cold `pnpm install` here delayed the entire workflow, not just this
          # job. Cached it is ~6s; cold it is tens of seconds, every PR.
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint & typecheck
        run: |
          pnpm lint
          pnpm typecheck   # tsc --noEmit across the workspace

  unit-tests:
    name: unit-tests
    runs-on: ${{ github.event_name == 'push' && 'self-hosted' || 'ubuntu-24.04' }}
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.5.0
        with:
          # TAGS, and therefore full history. §22.1's N-1 -> N upgrade gate
          # reads the previous release's migrations straight out of the tag
          # (`git show v0.1.0-rc.1:packages/ledger/migrations/...`), so a
          # depth-1 checkout leaves it with no reference to upgrade FROM.
          # It would then SKIP — silently, and green. The gate fails loudly on
          # a missing tag under CI for the same reason, but the fix belongs
          # here: the gate should run, not report why it could not.
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run unit tests (vitest; excludes integration/e2e)
        env:
          SKIP_STALWART: 'true'
          # Unit tests mock all DAV/HTTP; no unit test reads NEXTCLOUD_* — skip
          # the ~30s Nextcloud container boot the global setup otherwise does.
          SKIP_NEXTCLOUD: 'true'
        # No `--`: pnpm forwards it literally, and vitest's CLI parser discards
        # everything after it. `pnpm test -- --coverage` therefore ran
        # `vitest run --project unit --project unit-browser -- --coverage`,
        # which never enabled coverage — so the upload step below has been
        # publishing an empty artifact. Same defect as the e2e filters in
        # e2e.yml.
        run: pnpm test --coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.0
        with:
          name: coverage-report
          path: '**/coverage/'
          retention-days: 7

  # The managed UI, in a real browser, on EVERY PR.
  #
  # Its own job rather than a step in unit-tests, because it needs a Chromium
  # binary and a production build of the web app — neither of which the unit
  # gate should have to wait for. It stays on the PR path (not the nightly e2e
  # where the selfhost UI smoke lives) because the three defects it exists for
  # — an uncompiled stylesheet, a bundle calling the wrong origin, a dead list
  # row — all SHIPPED, and all of them are cheap to catch before merge.
  #
  # No services: the suite builds the bundle and serves it from an in-process
  # http server that answers /api from fixtures, which is also what makes its
  # same-origin assertion honest. Runtime is ~20s including the build.
  ui-tests:
    name: ui-tests
    runs-on: ${{ github.event_name == 'push' && 'self-hosted' || 'ubuntu-24.04' }}
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.5.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # playwright-core ships no browsers (that is why it is the dependency —
      # see test/e2e/selfhost-ui.e2e.test.ts), so Chromium is installed
      # explicitly, here, where it is needed.
      #
      # CACHED because a hosted runner starts empty every time: the first run
      # of this job pulled 184 MiB of Chrome, 115 MiB of headless shell and
      # 2 MiB of ffmpeg — ~10s of a 51s job, repeated on every PR. Keyed on the
      # playwright-core version, which is what decides the browser build, so a
      # dependency bump misses the cache and re-downloads exactly once.
      # The self-hosted runner keeps ~/.cache/ms-playwright anyway; this makes
      # the hosted path behave the same.
      - name: Cache Chromium
        id: pw-cache
        # v6.1.0, not v4: every actions/cache v4 release (through v4.3.0) still
        # declares `using: node20`, so the runner forces it onto Node 24 and
        # prints a deprecation warning on every run. Checked by reading each
        # tag's action.yml rather than assuming the newest v4 had fixed it —
        # it had not. v6.1.0 declares `node24` and is silent.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: node node_modules/playwright-core/cli.js install chromium
      - name: Managed UI smoke (real browser)
        # VITE_API_URL is deliberately NOT set: the suite builds the bundle
        # with the shipped same-origin default and asserts it stays that way.
        run: pnpm test:ui

  # THE arch-sensitive job, and now the one that closes the gap the header
  # describes. Everything else in this workflow is architecture-neutral
  # TypeScript — verified, not assumed: the workspace declares no native or
  # prebuilt-binary dependency (no node-gyp, better-sqlite3, sharp, argon2,
  # @napi-rs/*), so unit-tests and ui-tests would learn nothing from a second
  # architecture. This job is different: it runs real Postgres, real Nextcloud
  # and real Stalwart containers, which is the closest thing CI has to the
  # arm64 Spark the product actually deploys to.
  #
  # On a PULL REQUEST it runs twice, amd64 and arm64, both free 4-vCPU hosted
  # runners. On a PUSH it stays a single self-hosted run — the Spark is already
  # arm64, and the matrix must not multiply work on a box that also serves
  # production.
  #
  # `fail-fast: false` so an arm64-only failure still reports the amd64 result.
  # Knowing WHICH architecture broke is the entire point of running both.
  integration-tests:
    name: integration-tests (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ github.event_name == 'push' && fromJSON('["self-hosted"]') || fromJSON('["ubuntu-24.04","ubuntu-24.04-arm"]') }}
    needs: unit-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.5.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify Docker is available
        run: |
          docker --version
          docker compose version
      - name: Install stalwart-cli
        # Retried, because a single network blip here fails the whole
        # integration suite before one test has run. 2026-08-04: GitHub's
        # release CDN answered 502 for the binary and the job died at 27
        # seconds — the second third-party-download flake of that day, after
        # cosign/Rekor in the images workflow, which is what made this worth
        # absorbing rather than re-running by hand each time.
        #
        # THREE ATTEMPTS, THEN FAIL LOUD. The installer's own message says a
        # failure "may be a standard network error, but it may also indicate
        # that stalwart-cli's release process is not working", and those need
        # telling apart: a retry absorbs the first and must not hide the
        # second. A persistent outage still fails the job, with the attempts
        # it made stated (hard rule 9).
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if curl --proto '=https' --tlsv1.2 -LsSf \
                 https://github.com/stalwartlabs/cli/releases/latest/download/stalwart-cli-installer.sh | sh; then
              installed=yes
              break
            fi
            echo "::warning::stalwart-cli install attempt $attempt failed"
            # 5s, then 15s. Long enough for a CDN blip, short enough that a
            # real outage is reported inside a minute rather than five.
            [ "$attempt" -lt 3 ] && sleep $((attempt * 10 - 5))
          done
          if [ "${installed:-no}" != yes ]; then
            echo "::error::stalwart-cli could not be installed after 3 attempts."
            echo "This is not a test failure: no test ran. Either the download is"
            echo "unavailable (check https://github.com/stalwartlabs/cli/releases)"
            echo "or its release process is broken."
            exit 1
          fi
          # Add cargo bin to PATH for this step and future steps
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # Verify installation
          which stalwart-cli
          stalwart-cli --version
      - name: Run integration tests (Testcontainers spins up Postgres/Stalwart/Nextcloud)
        id: integration-tests
        run: pnpm test:integration
      - name: Upload integration logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.0
        with:
          name: integration-logs-${{ github.run_id }}
          path: test-logs/
          retention-days: 3
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.0
        with:
          name: integration-reports
          path: '**/reports/'
          retention-days: 7

  # ── The one check branch protection should require ──────────────────────────
  #
  # Required status checks are matched BY NAME, and this workflow's names are
  # not stable: `integration-tests` became `integration-tests (ubuntu-24.04)`
  # and `integration-tests (ubuntu-24.04-arm)` the day it gained a matrix, and
  # every future leg added, renamed or removed does the same. A required check
  # whose name no longer exists is not a failure — GitHub waits for a report
  # that never arrives, so the pull request blocks forever on a gate that is
  # actually green. Requiring THIS job instead makes the matrix free to change.
  #
  # `if: always()` is load-bearing. Without it a failure upstream SKIPS this
  # job, and a skipped required check reports no failure at all — the gate
  # would stop gating at exactly the moment something broke.
  #
  # `ci-complete-covers-every-job.unit.test.ts` fails if a job is added to this
  # workflow and not added to `needs` below. That is the real long-term
  # hazard: this job cannot notice a gate it was never told about, and it would
  # go on reporting green while covering less than it used to.
  #
  # SCOPE: ci.yml only. `security-scan`, `Trivy` and `Check for committed
  # artifacts` are separate workflows and produce their own checks — require
  # those alongside this one.
  ci-complete:
    name: ci-complete
    # Reads the other jobs' results and runs no repository code, so it is
    # hosted unconditionally rather than taking a slot on the box that also
    # serves production.
    runs-on: ubuntu-24.04
    if: always()
    needs:
      - detect-changes
      - docs-hygiene
      - fixture-uuid-check
      - migration-lint
      - lint
      - unit-tests
      - ui-tests
      - integration-tests
    steps:
      # SKIPPED IS NOT PASSED (AGENTS.md hard rule 9). A docs-only pull request
      # legitimately skips the test jobs, and this job legitimately goes green
      # — but "green" must then say which gates did not run, or the check
      # reports full coverage for a run that verified almost nothing.
      - name: Say what ran, and what did not
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          {
            echo "### CI gates"
            echo
            echo "| result | job |"
            echo "| --- | --- |"
            echo "$RESULTS" | jq -r 'to_entries[] | "| \(.value.result) | \(.key) |"' | sort -r
          } | tee -a "$GITHUB_STEP_SUMMARY"

          skipped=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result == "skipped") | .key')
          if [ -n "$skipped" ]; then
            echo
            echo "NOT RUN, therefore NOT verified by this check:"
            echo "$skipped" | sed 's/^/  - /'
            echo "(expected on a docs-only change, where detect-changes gates lint and everything below it)"
          fi

      - name: Fail if any gate failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::a required gate did not pass — see the table above"
          exit 1
