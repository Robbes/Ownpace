# Guard: block accidentally committed build/dependency/secret artifacts.
# Node/TS analogue of the team's no-maven-cache.yml.
name: No Committed Artifacts

on:
  pull_request:
    branches: [main]

jobs:
  check-artifacts:
    name: Check for committed artifacts
    # GitHub-hosted, like every other pull_request job — see ci.yml's
    # "Which machine runs untrusted code" header for the policy.
    #
    # This job said `self-hosted` unconditionally until 2026-08-11, which made
    # it the ONE exception: a `pull_request` trigger on a PUBLIC repository,
    # pointed at the box that also runs the live managed stack, its .env and
    # the encrypted connection secrets. It was not exploitable as written — a
    # checkout plus git diff, grep and echo, with no dependency install and no
    # repository script executed — and it is fixed anyway, because the risk
    # with a self-hosted runner is rarely the step somebody audited. It is the
    # step added later to a workflow already pointed at the wrong machine.
    #
    # Nothing here wants the Spark regardless: no Docker, no arm64, no cache.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.5.0
        with:
          fetch-depth: 0
      - name: Check added files
        run: |
          ADDED_FILES=$(git diff --name-only --diff-filter=A origin/${{ github.base_ref }}...HEAD)
          # These should never be committed (build outputs, deps, local DBs, secrets, tsbuild info)
          BAD_PATTERN='(^|/)(node_modules|dist|build|coverage|\.next|\.turbo)/|\.tsbuildinfo$|\.sqlite3?$|(^|/)\.env(\.local|\.development|\.production)?$'
          violations=0
          for file in $ADDED_FILES; do
            # allow the committed template
            if [ "$file" = ".env.example" ]; then continue; fi
            if echo "$file" | grep -qE "$BAD_PATTERN"; then
              echo "::error file=$file::Artifact must not be committed: $file"
              echo "Add it to .gitignore and run 'git rm -r --cached <path>'."
              violations=$((violations + 1))
            fi
          done
          [ "$violations" -gt 0 ] && exit 1 || echo "✅ No committed artifacts detected."
