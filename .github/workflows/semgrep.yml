# Semgrep over the tree with a short list of named rules, ONE OF THEM BLOCKING
# (workplan 0163 T3 and T5; the owner's decision D3 of 2026-11-20: a named
# list of rules, not whole packs, report only first, the two ReDoS rules never
# blocking, and CodeQL not now; then a rule blocks once it reports nothing on
# main).
#
# An outside, read-only check of 2026-11-20 listed five classes of finding in
# this tree that no check in CI had a rule for: a regular expression built at
# run time (ReDoS), a path joined from a value, a comparison of a secret that
# is not constant-time, a redirect to an address from a value, and a React
# link to an address that can be `javascript:`. Semgrep's community rules
# have one for four of them (0163 §4.3), and three more rules found a spot
# each when that plan measured Semgrep on this tree.
# scripts/semgrep-report.mjs runs Semgrep with those eight rules (its
# `RULES`), each fetched from Semgrep's registry by its id, over the
# checkout, and writes what each rule found, spot by spot, to the job's
# summary. A spot workplan 0163 read and left (`KNOWN_FINDINGS` there) is
# marked known with its reason and still listed.
#
# ONE RULE BLOCKS (0163 T5). run-shell-injection reports nothing on main, and
# as a YAML rule without taint mode it never reaches the taint analysis's time
# limit, so a spot of it fails this job, on every event, as an error on its
# line. Nothing in the tree can excuse or hide one: no KNOWN_FINDINGS entry,
# no inline nosemgrep comment (Semgrep runs with --disable-nosem), and no
# .semgrepignore, which the checkout may not track. Semgrep's own per-file
# time limit and a file it could not parse are notes in its report, and a
# note on a file the rule that blocks reads is a scan that did not finish.
# The other seven report only: their spots are listed and fail nothing.
# react-href-var reports nothing on main either, but it is a taint rule over
# JavaScript and TypeScript, and main's run at 0683eb04 (45025731298) read ten
# places only in part where it can have timed out, one naming it first, so
# blocking it would make such a run a scan that did not finish
# (scripts/semgrep-report.mjs, READ ONLY IN PART).
#
# A scan that did not finish fails the job too, on a pull request as well,
# since there the job vouches for the rule that blocks: that includes a
# registry that does not answer when the rules are fetched, which fails the
# pull request until a re-run. The rules are fetched by id and not pinned, so
# a rule renamed or withdrawn upstream fails every pull request, and a re-run
# does not help; and an upstream edit to run-shell-injection changes what
# blocks with no change here. On a push to main or a dispatch the run is the
# record (security-scan.yml's rule: a scan that skipped itself is not green).
# It is not in ci.yml, whose ci-complete cannot wait for another file's job.
# It is to be a required check by its job's name, `Semgrep`
# (every-pr-check-is-classified.unit.test.ts, docs/testing.md's required
# checks), once the owner adds it to the repository ruleset that holds main's
# required checks, so that name is load-bearing: renamed, the merge would wait
# for a check that never reports.
#
# IT BECOMES BLOCKING rule by rule (0163 §5, step 5): each other rule fails the
# build once it reports nothing on main and its time-outs leave every run on
# main finished, in a pull request of its own that says so.
# The two ReDoS rules, detect-non-literal-regexp and detect-redos, never do
# (D3): each flags how a pattern is built, not what reaches it, and every spot
# outside the tests was read as fed a constant or an escaped value.
#
# CODE SCANNING. On a push to main the spots of the six rules that may block
# go to code scanning (CODE_SCANNING_REPORT in scripts/semgrep-report.mjs), so
# they are listed there beside Trivy's, also when the rule that blocks failed
# the job, since that scan finished (`!cancelled()`). The two ReDoS rules,
# which never block (D3), stay in the job's summary only. Never from a pull
# request: there code scanning adds a check of its own, which can fail on a
# new alert, and this job decides itself which rules block.
#
# WHICH IMAGE. SEMGREP_IMAGE below, by tag and index digest, which the guard
# holds to the reference it records as read (`SEMGREP`), and moved by hand:
# Dependabot reads no workflow env, so the pin watch's row `semgrep/semgrep`
# (scripts/idp-pin-watch.mjs) reads that line and lists a newer tag in its
# summary issue. A tag waits three days after its push before it is pinned
# here, the age CONTRIBUTING.md asks of a dependency. A newer Semgrep can read
# more or fewer spots with the same rules, so read the job's summary on the
# pull request that moves it.
#
# WHEN, AND WHERE. On every pull request, since one image pull and a scan of
# eight rules take a minute or two; on a push to main, which keeps main's
# record; and on dispatch. Always on a GitHub-hosted runner: it has a
# pull_request trigger, and ci.yml's header says why that never reaches the
# self-hosted runner.
#
# scripts/a-finding-only-an-outside-check-saw.unit.test.ts holds this file and
# the script.
name: Semgrep

on:
  # No `branches:` filter (ci.yml's trigger block says why), and no `paths:`,
  # so the check reports on every pull request, as a required check must: a
  # required check that never reports leaves the merge waiting for good
  # (docs/testing.md).
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.ref }}
  # As in ci.yml: a superseded pull request run is cancelled, a run on main is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  semgrep:
    # The required check's name (ONE RULE BLOCKS, above): keep it as it is.
    name: Semgrep
    # GitHub-hosted, like every other pull_request job: see ci.yml's "Which
    # machine runs untrusted code" header for the policy.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # The SARIF upload, on a push to main only (CODE SCANNING, above).
      security-events: write
      actions: read
    env:
      # Semgrep 1.186.0 by its index digest, `6e1b04340e60…`, with linux/amd64
      # (`25251de6…`) and linux/arm64 (`a05c72d9…`) in it, read on 2026-11-21
      # as the Docker-Content-Digest of the tag's manifest through Google's
      # mirror of Docker Hub (mirror.gcr.io), whose body hashes to it, and the
      # same digest from Docker Hub's tag API, which gives its push as
      # 2026-11-18 00:21:32 UTC, past its three-day floor (CONTRIBUTING.md). It
      # was Semgrep's newest release that day. The outside check ran 1.178.0,
      # and so did workplan 0163's three measure runs.
      SEMGREP_IMAGE: semgrep/semgrep:1.186.0@sha256:6e1b04340e60e910fbb4ddbf3c857ab0918f064417ad5ac530014ccb3cf8c8f1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          check-latest: true # the newest 26.x, not the first one in the runner's tool cache
      - name: Run the named rules over the tree, and write what they found to the summary
        id: semgrep
        run: node scripts/semgrep-report.mjs
      - name: Upload the SARIF to code scanning, from main only
        if: "!cancelled() && github.event_name == 'push' && steps.semgrep.outputs.sarif != ''"
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ steps.semgrep.outputs.sarif }}
