# The public site, served on its own port (workplan 0091 T2).
#
# SEPARATE FROM managed.yml ON PURPOSE. This serves static files and knows
# nothing about the application — no database, no API, no secrets — which is
# what lets workplan 0086 T7 move the public pages to their own deploy later
# without a migration. Bringing the app stack down does not take the site with
# it, and the site cannot be the reason the app stack fails to start.
#
#   OWNPACE_APP_URL=https://app.ota.ownpace.eu node site/build.mjs   # site/dist
#   docker compose -f deploy/compose/www.yml up -d                    # serve it
#
# OWNPACE_APP_URL HAS NO DEFAULT, AND THE BUILD REFUSES WITHOUT IT. It is where
# every "Request access" button points. It used to default to production, and on
# 2026-08-24 this site was rebuilt without it: every button on
# `www.ota.ownpace.eu` pointed at `https://app.ownpace.eu/request-access`, so a
# click on the TEST site filed a real access request against the real tenant.
# Production is not the safe side of an environment boundary — being told is.
# Use `https://app.ownpace.eu` when building the production site.
#
# Netbird maps the external name to WWW_PORT on this host; externally the name
# is on 443/https and the port is an internal detail, which is why the redirect
# URIs registered with Google carry no port.
#
# THE BUILD IS NOT RUN HERE. `site/dist` is generated and mounted read-only
# rather than baked into an image, so re-publishing is the build command above
# and nothing else — no restart — BECAUSE `site/build.mjs` EMPTIES `dist`
# instead of replacing it.
#
# That distinction is load-bearing, not a detail. A bind mount resolves to an
# INODE when the container starts. A build that removed and recreated the
# directory would leave this nginx holding the old, unlinked one: `total 0`
# inside the container, every file present and correct outside, and
# `directory index of "/usr/share/nginx/html/" is forbidden` on every request —
# a 403 that reads like a permissions problem and is not one. This header
# claimed "no restart is needed" while the build did exactly that, and cost an
# evening on the Spark (2026-08-24). If anything ever does replace the
# directory, `up -d --force-recreate` re-resolves the mount.
#
# A stale dist also serves silently: check the build stamp in the page source
# if something looks old, and the host in a "Request access" href if you are
# not certain which environment this dist was built for.

# ITS OWN COMPOSE PROJECT, AND THE SITE DISAPPEARED WITHOUT ONE.
#
# Compose derives the project name from the containing DIRECTORY when a file
# does not declare one. This file, `dev.yml` and `dev.ci.yml` all live in
# `deploy/compose/`, so all three were the project `compose` — and E2E's
# cleanup step runs, on every run:
#
#     docker compose -f deploy/compose/dev.yml -f deploy/compose/dev.ci.yml \
#       down --remove-orphans
#
# `ownpace-www` is in that project and is declared in neither of those files,
# which is precisely Compose's definition of an orphan. So every E2E run
# DELETED the public site. Not stopped, not unhealthy — removed, which is why
# `docker inspect ownpace-www` answered "no such object" and there was no exit
# code, no restart count and no log to find. `restart: unless-stopped` cannot
# help: a container that no longer exists has nothing to restart.
#
# `managed.yml` was never hit by this only because it declares `name:`. That is
# the whole difference, so this file now declares one too. Found 2026-08-28,
# after the site had been going missing "often" for long enough to be believed
# a crash.
#
# scripts/a-site-a-teardown-removed.unit.test.ts keeps it: anything with a
# `restart:` policy is meant to stay up, and must own its project rather than
# share a default one with a stack somebody tears down.
name: ownpace-www

services:
  www:
    image: nginx:1.27-alpine
    container_name: ownpace-www
    restart: unless-stopped
    ports:
      - "${WWW_PORT:-3125}:80"
    volumes:
      - ../../site/dist:/usr/share/nginx/html:ro
      - ./www-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # 127.0.0.1, NOT localhost, AND THAT IS THE WHOLE BUG.
    #
    # This asked `http://localhost/` from 2026-08-20 until 2026-08-25, and
    # ownpace-www was marked unhealthy every thirty seconds of those five days:
    #
    #     "FailingStreak": 39
    #     "Output": "wget: can't connect to remote host: Connection refused"
    #
    # Refused, not 404 — the request never reached nginx, which is why the
    # container's log carried no access line for it either.
    #
    # `default.conf` above is bind-mounted `:ro`, so the base image's
    # `10-listen-on-ipv6-by-default.sh` cannot add `listen [::]:80;` and says so
    # on every start: "can not modify /etc/nginx/conf.d/default.conf (read-only
    # file system?)". nginx therefore listens on IPv4 only, while busybox wget
    # resolves `localhost` to ::1 first. Nobody was serving that.
    #
    # apps/web/Dockerfile got both halves right by accident — it asks
    # 127.0.0.1:80 explicitly AND its conf is generated by envsubst into a
    # writable path, so it listens on both stacks. Only one of those needs to
    # be true; this file now has the one that does not depend on the mount.
    #
    # NOT a general "never use localhost" rule: nextcloud in managed.yml asks
    # localhost too and is genuinely healthy, because nothing mounts over its
    # config. The rule is about a read-only conf, and lives in
    # scripts/a-healthcheck-that-asked-the-wrong-address.unit.test.ts.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
