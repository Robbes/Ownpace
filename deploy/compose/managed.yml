# Managed deployment stack with Trigger.dev orchestration.
# Postgres version aligned with deploy/compose/dev.yml (Postgres 18).
#
# This stack includes:
# - PostgreSQL (ledger database)
# - Trigger.dev (managed orchestration platform)
# - Open Migration API & Worker
# - Web application
# - Nextcloud (demo CalDAV/CardDAV/WebDAV backend for the T7 DoD demo — see
#   deploy/compose/setup-managed-demo.sh)
#
# Deliberately NOT here: a demo mail (IMAP/JMAP) backend. Stalwart requires a
# two-phase startup (provisioning in recovery mode, then serving in normal
# mode) that plain `docker compose up` cannot express for one service — same
# reason deploy/compose/dev.yml excludes it. Bring it up with
# deploy/selfhost/setup-stalwart.sh instead (the ONE canonical way; see that
# script's header) — deploy/compose/setup-managed-demo.sh does this for you,
# joined to this stack's network so the worker reaches it by name.
#
# Pinned project `name` below is load-bearing, not cosmetic: without it, `docker compose`
# derives the resource-name prefix from the CURRENT DIRECTORY'S BASENAME ("compose"), so on a
# shared host, any other unrelated project also run from a directory literally named `compose`
# collides on the exact same volume/network names (compose_postgres_data,
# compose_ownpace-network, ...). Confirmed live on the Spark box (2026-07-25): `ownpace-db`
# silently mounted a `compose_postgres_data` volume created two days earlier -- NOT this project's
# data -- so its `openmigrate` role's real password didn't match this stack's own .env, and every
# app-tier connection failed with "password authentication failed" despite .env, the container's
# own POSTGRES_PASSWORD env var, and a local-socket/127.0.0.1 psql check all agreeing (the latter
# two are trusted by Postgres's default pg_hba.conf and never actually check the password -- only
# a connection from another container's real IP exercises the scram-sha-256 rule and exposed this).
name: ownpace-managed
services:
  # PostgreSQL Database
  postgres:
    image: postgres:18-alpine
    container_name: ownpace-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openmigrate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openmigrate_password}
      POSTGRES_DB: ${POSTGRES_DB:-openmigrate}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      # NO docker-entrypoint-initdb.d mount of the migration files, deliberately
      # (one used to be here): initdb applies them WITHOUT schema_migrations
      # bookkeeping, and the squashed 0001_baseline is not idempotent — the
      # API's boot-time migrator would then re-apply it onto the already-created
      # schema and crash the container. Schema creation belongs to the migrator
      # alone: the API runs it at boot, and seed-managed.ts runs it first so the
      # demo run order (seed before API) still works on an empty database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openmigrate}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ownpace-network

  # PgBouncer — transaction-mode pooler in front of the ledger (workplan 0082 T4)
  #
  # Why: every sync pass opens its own pg.Pool of DEFAULT_CONCURRENCY + 2, so the
  # server-connection ceiling was concurrent-passes times six, against a managed
  # Postgres whose connection limit is much lower than its CPU budget suggests.
  # A pooler removes that as a CLASS of problem rather than as an incident.
  #
  # The safety argument is in pgbouncer/pgbouncer.ini: the tenant context is set
  # with set_config(..., true) inside a transaction, so nothing survives the
  # COMMIT that hands the server connection to the next borrower. Migrations are
  # the one exception and connect direct — see DIRECT_DATABASE_URL below.
  #
  # ROLLBACK, if this misbehaves: set DB_HOST=postgres and DB_PORT=5432 in .env
  # and `compose up -d`. Every service reads those, so that one change puts the
  # whole stack back on direct connections without touching this file.
  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    container_name: ownpace-pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      # SCRAM verifier for the lookup role only — every other credential is read
      # from Postgres via auth_query, so this file does not grow.
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      # `pgbouncer` is a real database name on the admin console; reaching it
      # proves the process is accepting connections, which a TCP probe does not.
      test: ["CMD-SHELL", "PGPASSWORD=$${PGBOUNCER_AUTH_PASSWORD} psql -h 127.0.0.1 -p 6432 -U pgbouncer_auth -d pgbouncer -c 'SHOW POOLS' >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      PGBOUNCER_AUTH_PASSWORD: ${PGBOUNCER_AUTH_PASSWORD:?run deploy/compose/pgbouncer/setup-auth.sql and set this in .env}
    networks:
      - ownpace-network

  # Trigger.dev Backend
  trigger-db:
    image: postgres:18-alpine
    container_name: trigger-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: trigger
      POSTGRES_PASSWORD: trigger_password
      POSTGRES_DB: triggerdb
    volumes:
      - trigger_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trigger"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ownpace-network

  trigger-redis:
    image: redis:7-alpine
    container_name: trigger-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ownpace-network

  trigger-api:
    # ONE tag for webapp and supervisor, pinned to the exact @trigger.dev/sdk
    # version in apps/worker (0018 T0 — check package.json when bumping either;
    # the 4.5.x family is SDK-compatible, but "probably compatible" is not a
    # deploy story). The old hardcoded v4.5.4 pin claimed to match an SDK that
    # had moved to 4.5.7 — and the v4.5.7 pin then repeated the same drift
    # when the SDK moved to 4.5.9.
    image: ghcr.io/triggerdotdev/trigger.dev:${TRIGGER_IMAGE_TAG:-v4.5.12}
    container_name: trigger-api
    restart: unless-stopped
    user: root
    command: sh -c "chown -R node:node /home/node/shared && exec ./scripts/entrypoint.sh"
    environment:
      # Database
      DATABASE_URL: postgresql://trigger:trigger_password@trigger-db:5432/triggerdb
      DIRECT_URL: postgresql://trigger:trigger_password@trigger-db:5432/triggerdb
      # Auth secrets — fail-closed (0020 T2): these gate the trigger dashboard,
      # its magic-link login and its stored env vars. The old hardcoded
      # fallbacks were committed to a public repository, i.e. not secrets.
      # Generate each: openssl rand -hex 16   (32 hex chars)
      SESSION_SECRET: ${TRIGGER_SESSION_SECRET:?generate with openssl rand -hex 16 and set in .env}
      MAGIC_LINK_SECRET: ${TRIGGER_MAGIC_LINK_SECRET:?generate with openssl rand -hex 16 and set in .env}
      ENCRYPTION_KEY: ${TRIGGER_ENCRYPTION_KEY:?generate with openssl rand -hex 16 and set in .env}
      LOGIN_SECRET: ${TRIGGER_LOGIN_SECRET:?generate with openssl rand -hex 16 and set in .env}
      MANAGED_WORKER_SECRET: ${TRIGGER_MANAGED_WORKER_SECRET:?generate with openssl rand -hex 16 and set in .env}
      # Origins
      APP_ORIGIN: ${TRIGGER_APP_ORIGIN:-http://localhost:3090}
      LOGIN_ORIGIN: ${TRIGGER_LOGIN_ORIGIN:-http://localhost:3090}
      API_ORIGIN: ${TRIGGER_API_ORIGIN:-http://localhost:3090}
      # Redis
      REDIS_HOST: trigger-redis
      REDIS_PORT: 6379
      REDIS_TLS_DISABLED: "true"
      # Registry (for task deployments). `localhost` is correct from BOTH
      # consumers' point of view: the CLI pushes from the host, and the
      # supervisor's runners pull through the HOST's docker daemon — and the
      # trigger-registry service publishes on 127.0.0.1:${REGISTRY_PORT} below.
      DEPLOY_REGISTRY_HOST: localhost:${REGISTRY_PORT:-5000}
      DEPLOY_REGISTRY_NAMESPACE: trigger
      # The architecture task images are built FOR — decided SERVER-side and
      # handed to the deploying CLI (deployment.imagePlatform; no CLI flag).
      # Upstream defaults to linux/amd64, which on the arm64 Spark produced
      # images whose runners died at exec ("exec format error") in under a
      # second, with AutoRemove destroying the evidence — the 2026-08-01 T5
      # hunt. MUST match the host that runs the supervisor's containers:
      # uname -m x86_64 → linux/amd64, aarch64 → linux/arm64 (set in .env).
      DEPLOY_IMAGE_PLATFORM: ${DEPLOY_IMAGE_PLATFORM:-linux/amd64}
      # Object storage (for large payloads) — the minio service below; one
      # pair of env vars so the two sides cannot disagree.
      OBJECT_STORE_BASE_URL: http://minio:9000
      OBJECT_STORE_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-admin}
      OBJECT_STORE_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-very-safe-password}
      # ClickHouse — REAL, not the placeholder-URL hack that used to live here.
      # That hack (a syntactically valid URL + SKIP_CLICKHOUSE_MIGRATIONS +
      # events-in-postgres) survived webapp BOOT, but v4.5.7's dashboard
      # genuinely queries ClickHouse for the environment metrics page, and the
      # resulting ECONNREFUSED became an unhandledRejection that killed the
      # whole webapp process — confirmed live on the Spark, 2026-08-01, taking
      # the supervisor's session down with it. The clickhouse service below is
      # the reference stack's own; goose migrations run at entrypoint.
      CLICKHOUSE_URL: http://${CLICKHOUSE_USER:-default}:${CLICKHOUSE_PASSWORD:-password}@clickhouse:8123?secure=false
      RUN_REPLICATION_CLICKHOUSE_URL: http://${CLICKHOUSE_USER:-default}:${CLICKHOUSE_PASSWORD:-password}@clickhouse:8123
      # Realtime streams - disabled, using v1 (Redis) instead
      REALTIME_STREAMS_DEFAULT_VERSION: v1
      # Bootstrap
      TRIGGER_BOOTSTRAP_ENABLED: "1"
      TRIGGER_BOOTSTRAP_WORKER_GROUP_NAME: bootstrap
      TRIGGER_BOOTSTRAP_WORKER_TOKEN_PATH: /home/node/shared/worker_token
      # Misc
      PORT: 3000
      APP_LOG_LEVEL: info
    ports:
      - "${TRIGGER_PORT:-3090}:3000"
    volumes:
      - trigger_shared:/home/node/shared
    depends_on:
      trigger-db:
        condition: service_healthy
      trigger-redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    # LIVENESS, deliberately — not a named endpoint (0084 T7.1).
    #
    # `fetch` resolves on ANY http response, 404 included, and rejects only
    # when nothing is listening. That is exactly the question worth asking here
    # ("is this process serving?") and it cannot be wrong about a health path
    # that moves between releases — which a probe on `/healthcheck` could be,
    # silently, on the next image bump.
    #
    # `node` rather than curl or wget: this is a Node application image, so the
    # runtime the entrypoint itself uses is the one binary certainly present.
    # The appliance's own healthcheck uses the same shape.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/').then(()=>process.exit(0)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      # The webapp runs migrations before it serves. Generous on purpose: a
      # start_period too short turns a slow boot into a failed bring-up.
      start_period: 120s
    networks:
      - ownpace-network

  # Task-event store the webapp actually queries (see the CLICKHOUSE comment
  # above), with its own <16GB-RAM tuning file.
  #
  # PINNED BY DIGEST, TO THE IMAGE TRIGGER.DEV ITSELF RUNS. This was
  # `bitnamilegacy/clickhouse:latest` until 2026-08-24 — the one floating
  # dependency in a stack that pins everything else — and `latest` had
  # resolved to 25.5.2.47. Upgrading Trigger.dev to v4.5.12 then died in its
  # own ClickHouse migration, on a machine that had been fine for weeks:
  #
  #   goose run: ERROR 040_create_task_events_search_v2.sql:
  #     INDEX idx_search_text search_text TYPE text(tokenizer = 'ngrams',
  #       preprocessor = lowerUTF8(search_text))
  #   Code: 80. DB::Exception: Only literals can be skip index arguments.
  #
  # v4.5.12 writes a FUNCTION as a skip-index argument; 25.5 only accepts
  # literals. The webapp crash-looped and the plane was down until the tag
  # went back. `managed.env.example` has carried "4.5.11 has an outage" since
  # August with no cause recorded — very likely this, unrecognised because it
  # presents as a Trigger.dev failure rather than a ClickHouse-version one.
  #
  # `bitnamilegacy` is what its name says: Bitnami stopped publishing there,
  # and its newest ClickHouse is 25.7.5. It can never reach what upstream
  # needs, so this follows THEIR pin exactly — same image, same digest, as
  # read from trigger.dev's own docker/docker-compose.yml at v4.5.12. What
  # they test against is the only version this stack has evidence about.
  clickhouse:
    image: clickhouse/clickhouse-server:26.2.19.43@sha256:c2f2605585899d5103a0447daadbc0005f362200d5f0fcca7f40db3ca0dd36dd
    container_name: trigger-clickhouse
    restart: unless-stopped
    # Upstream's, and not decoration: ClickHouse opens a lot of files and the
    # default soft limit is where that shows up as corruption-looking errors.
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      # The official image's names. Bitnami used CLICKHOUSE_ADMIN_USER /
      # _ADMIN_PASSWORD; passing those here would start an instance with the
      # DEFAULT credentials while every consumer used the configured ones.
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-password}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      # A NEW VOLUME, and the old one is left alone (hard rule 2). Bitnami
      # kept its data under /bitnami/clickhouse; the official image reads
      # /var/lib/clickhouse. Pointing the old volume at the new path would
      # hand ClickHouse a directory laid out by a different vendor. So this
      # starts empty — the task-EVENT store is derived from the run records in
      # triggerdb, so what is lost is dashboard history, not the ability to
      # run anything — and `clickhouse_data` remains on disk until somebody
      # deliberately removes it:
      #     docker volume rm ownpace-managed_clickhouse_data
      - clickhouse_data_v2:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./clickhouse-override.xml:/etc/clickhouse-server/config.d/override.xml:ro
      # Also upstream's, and it arrives with the pin rather than after it: a
      # fresh empty volume has no accumulated ceiling, and ClickHouse's own
      # eleven system log tables would start filling it from the first boot.
      - ./clickhouse-disable-system-logs.xml:/etc/clickhouse-server/config.d/disable-system-logs.xml:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--host", "localhost", "--port", "9000", "--user", "${CLICKHOUSE_USER:-default}", "--password", "${CLICKHOUSE_PASSWORD:-password}", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ownpace-network

  # Where `trigger deploy` pushes task images and the host's docker daemon
  # pulls them from (0018 T3). Bound to 127.0.0.1 ON PURPOSE: both consumers
  # sit on this host (the CLI pushes from it, the supervisor's runners pull
  # through its daemon), docker treats localhost registries as trusted-HTTP,
  # and not publishing on the LAN is what lets this run without auth — an
  # unauthenticated registry on 0.0.0.0 would be an open image-push endpoint
  # for the whole network. A production deployment brings its own registry.
  trigger-registry:
    image: registry:2
    container_name: trigger-registry
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REGISTRY_PORT:-5000}:5000"
    volumes:
      - registry_data:/var/lib/registry
    networks:
      - ownpace-network

  # The supervisor talks to docker through this proxy rather than holding the
  # raw socket: the whitelist below is exactly what running task containers
  # needs (create/manage containers, pull images, attach networks) and nothing
  # more — no exec into other containers, no volume deletion, no swarm.
  trigger-docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: trigger-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - ownpace-network

  # The component that actually EXECUTES deployed tasks (0018 T0/T3): it
  # authenticates to trigger-api with the bootstrap worker token the webapp
  # writes to the shared volume (TRIGGER_BOOTSTRAP_* above), dequeues runs,
  # and starts one container per run via the docker proxy. Without it, a
  # deployed task is dequeued by nobody — which is exactly what this stack
  # was before 0018: bootstrap env vars with no consumer.
  trigger-supervisor:
    image: ghcr.io/triggerdotdev/supervisor:${TRIGGER_IMAGE_TAG:-v4.5.12}
    container_name: trigger-supervisor
    restart: unless-stopped
    environment:
      TRIGGER_API_URL: http://trigger-api:3000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://trigger-api:3000/otel
      TRIGGER_WORKER_TOKEN: file:///home/node/shared/worker_token
      MANAGED_WORKER_SECRET: ${TRIGGER_MANAGED_WORKER_SECRET:?generate with openssl rand -hex 16 and set in .env}
      TRIGGER_WORKLOAD_API_DOMAIN: trigger-supervisor
      TRIGGER_WORKLOAD_API_PORT_EXTERNAL: 8020
      DOCKER_HOST: tcp://trigger-docker-proxy:2375
      # Run containers join THIS network, so tasks reach postgres, stalwart
      # and nextcloud by the same names the worker container uses. The value
      # is the REAL network name — compose prefixes the pinned project name.
      DOCKER_RUNNER_NETWORKS: ownpace-managed_ownpace-network
      DOCKER_REGISTRY_URL: localhost:${REGISTRY_PORT:-5000}
    volumes:
      - trigger_shared:/home/node/shared
    depends_on:
      trigger-api:
        condition: service_started
      trigger-docker-proxy:
        condition: service_started
    # The workload API the runners themselves connect to — a runner's own log
    # names it (`TRIGGER_SUPERVISOR_API_DOMAIN: trigger-supervisor`,
    # `TRIGGER_SUPERVISOR_API_PORT: 8020`), so a supervisor not serving on it is
    # a supervisor no task can execute through. Same liveness shape as the
    # webapp above.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8020/').then(()=>process.exit(0)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - ownpace-network

  # Object store for large task payloads/outputs. trigger-api has pointed at
  # http://minio:9000 since the stack was written — the service just never
  # existed, so anything over the inline payload limit failed. Same
  # credentials as the OBJECT_STORE_* values above; the bitnami image is used
  # for MINIO_DEFAULT_BUCKETS (auto-creates the bucket the webapp expects).
  minio:
    # PINNED TO WHAT WAS ALREADY RUNNING, not to something newer. The digest is
    # the one `bitnamilegacy/minio:latest` resolved to on 2026-08-24, so this
    # line changes the NAME of what runs and not the bytes — deliberately, on a
    # service that holds Trigger.dev's packets and run artifacts.
    #
    # `latest` here told the same lie ClickHouse's did, and a slightly worse
    # one. It is not merely frozen: it stopped moving on 2025-07-03 at
    # 2025.5.24, while the repository went on publishing until 2025-08-19 and
    # ends at 2025.7.23-debian-12-r5. So `latest` was not even bitnamilegacy's
    # last word — it was a tag that quietly stopped six weeks early, and
    # nothing anywhere said which MinIO this stack ran.
    #
    # Moving to 2025.7.23, or to upstream's `minio/minio`, are both real
    # options and neither belongs in a de-floating commit. Upstream's in
    # particular is NOT a tag swap: it reads /data rather than
    # /bitnami/minio/data, and it has no MINIO_DEFAULT_BUCKETS — the `packets`
    # bucket is created by a separate `minio-init` service running `mc mb`
    # (trigger.dev docker-compose.yml @ v4.5.12). Doing that means a new volume
    # and an empty object store, which is a decision with a restore plan, not a
    # rider. See docs/managed-bring-up.md.
    image: bitnamilegacy/minio:2025.5.24-debian-12-r5@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
    container_name: trigger-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-very-safe-password}
      MINIO_DEFAULT_BUCKETS: packets
    volumes:
      - minio_data:/bitnami/minio/data
    networks:
      - ownpace-network

  # TLS front for the trigger dashboard (0020 T3) — the hand-run Caddy sidecar
  # from the 2026-08-01 live bring-up, folded in. The dashboard's
  # production-mode Secure cookies make login unusable over plain http from
  # anything but localhost, so browsers go through this https front:
  #   TRIGGER_APP_ORIGIN / TRIGGER_LOGIN_ORIGIN = https://<TRIGGER_TLS_HOST>:<TRIGGER_TLS_PORT>
  # while TRIGGER_API_ORIGIN stays http://localhost:3090 — the deploy CLI
  # follows the server-advertised API origin and must not hit a self-signed
  # certificate (deploys died with a bare "Connection error" when it did).
  # The two rules baked into trigger-tls.Caddyfile: a concrete host as the
  # site address (else Caddy has no certificate to present) and default_sni
  # (IP-connecting browsers send no SNI). Set TRIGGER_TLS_HOST in .env to the
  # address browsers actually use (e.g. the machine's VPN IP).
  trigger-tls:
    image: caddy:2-alpine
    container_name: trigger-tls
    restart: unless-stopped
    environment:
      TRIGGER_TLS_HOST: ${TRIGGER_TLS_HOST:-localhost}
    ports:
      - "${TRIGGER_TLS_PORT:-3443}:3443"
    volumes:
      - ./trigger-tls.Caddyfile:/etc/caddy/Caddyfile:ro
      - trigger_tls_data:/data
      - trigger_tls_config:/config
    depends_on:
      trigger-api:
        condition: service_started
    networks:
      - ownpace-network

  # Open Migration API
  # The identity provider (ADR-0042).
  #
  # WHAT THIS IS FOR. Until it existed, the path from stranger to signed-in
  # customer ended with the owner running seed-managed.sh and emailing a JWT
  # that expired in seven days, to be pasted into a textarea. This is the thing
  # that mints tokens instead.
  #
  # WHY IT IS NOT LOAD-BEARING. ADR-0042 chose this provider and named Keycloak
  # as the fallback, and the decision rests on being able to move with
  # configuration rather than a project. Nothing in `apps/` or `packages/` knows
  # this service exists — the API reads JWT_ISSUER, discovers `jwks_uri` from
  # the standard discovery document, and knows no provider's URL shape.
  # `no-issuer-lock-in.unit.test.ts` enforces that by scanning the source, and
  # `issuer-is-replaceable.unit.test.ts` drives the real verification path with
  # both providers' documents. This block, the setup script and the docs are the
  # only places the name appears, which is exactly where a deployment must name
  # what it deploys.
  #
  # SHARES THE STACK'S POSTGRES, on its own database and its own role. It
  # connects DIRECT rather than through pgbouncer for the reason the api
  # service's DIRECT_DATABASE_URL comment gives: it runs its own migrations, and
  # a transaction-mode pooler is the wrong place to hold a migration lock.
  # ADMIN credentials are how it creates that database and role on first boot;
  # after that it uses its own.
  zitadel:
    # PINNED ABOVE THE POSTGRESQL 18 FIX, and E2E (managed) #46 is why.
    #
    # v4.6.2 could not initialise against this stack's database at all:
    #
    #   migration failed  name=34_add_cache_schema
    #     error="ERROR: partitioned tables cannot be unlogged (SQLSTATE 0A000)"
    #
    # Zitadel's cache schema created an UNLOGGED PARTITIONED table. PostgreSQL
    # removed support for that — `postgres` above is 18 — so setup step 34 fails
    # on every attempt and the provider can never finish starting. It is not a
    # misconfiguration and no setting avoids it: zitadel/zitadel#10712.
    #
    # Fixed by zitadel/zitadel#11484 (merged 2026-02-03, backported to the v4
    # line): step 34 now creates the parent LOGGED and keeps the partitions
    # unlogged, and a new step 69 migrates deployments that got the old shape.
    # Zitadel's own requirements now document PostgreSQL 14–18.
    #
    # The pin moves to the current v4 rather than the oldest release carrying
    # the fix. There is nothing to regress — this provider has never once
    # completed an init here — and an identity provider is the last thing in a
    # stack that should be running seven months behind.
    #
    # `zitadel-image-matches-postgres.unit.test.ts` refuses a pairing of this
    # image with a Postgres major it cannot initialise against, in either
    # direction, so neither number can be moved alone by accident.
    image: ghcr.io/zitadel/zitadel:v4.17.1
    container_name: ownpace-idp
    restart: unless-stopped
    # `start-from-init` is init-then-start in one command and is idempotent: on
    # a database it has already initialised it skips straight to serving. Two
    # commands would mean a first bring-up that differs from every later one,
    # which is the kind of asymmetry an operator only discovers on a restart.
    command: >
      start-from-init
      --masterkey "${ZITADEL_MASTERKEY:?run ./deploy/compose/ensure-env-secrets.sh first}"
      --tlsMode ${ZITADEL_TLS_MODE:-disabled}
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: ${ZITADEL_DB_NAME:-zitadel}
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: ${ZITADEL_DB_USER:-zitadel}
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${ZITADEL_DB_PASSWORD:?run ./deploy/compose/ensure-env-secrets.sh first}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: ${POSTGRES_USER:-openmigrate}
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${POSTGRES_PASSWORD:-openmigrate_password}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      # THE ONE ORIGIN, AND IT MUST BE ONE THE API CAN PRESENT TOO.
      #
      # THIS WAS `localhost`, AND THAT COULD NEVER WORK. It made JWT_ISSUER
      # http://localhost:3126 — an address the HOST reaches through the published
      # port and the API container cannot, because inside that container
      # `localhost` is the API. Every authenticated request answered HTTP 500
      # `auth_failed`, because discovery threw ECONNREFUSED before any token was
      # even looked at, and the stack reported itself healthy throughout.
      #
      # There is no internal shortcut. Zitadel resolves the instance by the
      # ORIGIN of the request and refuses every other one:
      #
      #   GET http://zitadel:8080/.well-known/openid-configuration
      #     404  unable to set instance using origin &{zitadel:8080 http}
      #          (ExternalDomain is localhost): Instance not found.
      #
      # Measured on the running stack, by service name and by container name. An
      # instance TRUSTED domain does not change it (added one, still 404), and
      # AddInstanceDomain is on the System API, which a provisioning token cannot
      # reach — so this is a value that has to be RIGHT AT FIRST INIT, not
      # corrected afterwards.
      #
      # `ownpace-idp` is the container's own name and is registered as a network
      # alias below, so it resolves to this container from anywhere on the
      # network. A BROWSER on the host needs one line in /etc/hosts:
      #
      #   127.0.0.1  ownpace-idp
      #
      # — see docs/managed-bring-up.md. A real deployment sets this to the real
      # hostname and DNS answers for both sides, which is the case this shape is
      # actually built for; `localhost` was only ever the convenient-looking one.
      #
      # It is baked into every token's `iss`, so changing it later invalidates
      # tokens and breaks the API's issuer check — which is the fourth variable
      # carrying a browser-visible address, and belongs with the three workplan
      # 0091 T1 is about.
      ZITADEL_EXTERNALDOMAIN: ${ZITADEL_EXTERNALDOMAIN:-ownpace-idp}
      # Defaults to the published port rather than repeating its number, because
      # on a plain bring-up the browser reaches the provider AT the published
      # port — the two are the same address seen from two sides. They separate
      # only when something fronts it (netbird terminating TLS on 443), and then
      # the operator sets this one explicitly. Written as a fallback so that
      # moving ZITADEL_PORT moves the issuer with it; a hand-copied second number
      # is how a stack ends up serving one port and stamping another into `iss`.
      ZITADEL_EXTERNALPORT: ${ZITADEL_EXTERNALPORT:-${ZITADEL_PORT:-3126}}
      ZITADEL_EXTERNALSECURE: ${ZITADEL_EXTERNALSECURE:-false}
      # ZITADEL'S OWN LISTEN PORT, DELIBERATELY THE SAME NUMBER IT IS PUBLISHED
      # ON. The origin check above is host AND port, so `ownpace-idp:3126` has to
      # reach Zitadel from inside the network as well as from the host. With the
      # image's default listen port of 8080 and a 3126:8080 mapping, it reaches
      # nothing inside — one address, two meanings, which is the whole bug this
      # is fixing. One number, both sides, no second place to get it wrong.
      ZITADEL_PORT: ${ZITADEL_PORT:-3126}
      # WHICH LOGIN UI A FRESH INSTANCE REQUIRES, decided here rather than
      # inherited. `cmd/defaults.yaml` at v4.17.1 ships
      # `DefaultInstance.Features.LoginV2.Required: true`, and login v2 is a
      # SEPARATE application — `ghcr.io/zitadel/zitadel-login`, routed at
      # /ui/v2/login — which this stack does not deploy. An instance left on
      # that default therefore redirects every human sign-in to a path where
      # nothing listens, and the browser renders the gateway's JSON
      # `code: 5, "Not Found"` in place of a login form (#566).
      #
      # DEFAULTINSTANCE IS READ ONCE, AT FIRST INIT. This fixes a stack that
      # does not exist yet and does nothing for one that does, which is why
      # setup-zitadel.sh ALSO sets it through the API and reads it back. Two
      # mechanisms because there are two populations, not belt and braces.
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "false"
      # The first human, so a fresh stack has somebody who can sign in.
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ${ZITADEL_ADMIN_USERNAME:-owner}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD:?run ./deploy/compose/ensure-env-secrets.sh first}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "true"
      # And a machine account whose token is written to a file on first init.
      # This is what lets setup-zitadel.sh provision the project and the client
      # without anybody clicking through a console — see that script's header
      # for why the token is deliberately short-lived.
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: ownpace-setup
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Ownpace setup
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: ${ZITADEL_PAT_EXPIRY:-2026-12-31T23:59:59Z}
      ZITADEL_FIRSTINSTANCE_PATPATH: /machinekey/pat.txt
    volumes:
      # The provisioning token lands here for setup-zitadel.sh to read. A named
      # volume rather than a bind mount so the token never sits in the working
      # tree, where a `git add -A` could find it (hard rule 3).
      - zitadel_machinekey:/machinekey
    ports:
      # NOT 8080. That is the most contended port on any machine, and the E2E
      # (managed) gate proved it: the provider's very first bring-up on the
      # self-hosted runner died with "Bind for 0.0.0.0:8080 failed: port is
      # already allocated" before it ever started. 3126 continues this stack's
      # own block — web 3123, status 3124, www 3125 — which is unclaimed by
      # convention and by anything else in this repo.
      # Same number both sides — see ZITADEL_PORT above.
      - "${ZITADEL_PORT:-3126}:${ZITADEL_PORT:-3126}"
    depends_on:
      postgres:
        condition: service_healthy
      # NOT a `condition:` — this one is run explicitly by the bring-up, before
      # the `up` that starts this service. See zitadel-machinekey below for why
      # it cannot simply be an init container compose starts for us.
    # NO HEALTHCHECK, AND THAT IS THE FIX RATHER THAN A GAP.
    #
    # This carried `test: ["CMD", "/app/zitadel", "ready", "--config",
    # "/dev/null"]`, and E2E (managed) #47 showed it cannot work. Zitadel came up
    # perfectly — every migration applied, OIDC routes registered, `server is
    # listening address=[::]:8080` — and compose called it unhealthy for
    # thirty-one minutes:
    #
    #   docker inspect  →  "Output":"Error: not ready", FailingStreak: 188
    #   curl http://localhost:3126/debug/ready  (from the host)  →  200
    #
    # `zitadel ready` builds its URL from ExternalPort, which is BY DEFINITION
    # the address the outside reaches Zitadel on. Inside the container nothing
    # listens there — here 3126 is a published port, and on a fronted deployment
    # it is 443, terminated by something that is not Zitadel. The probe asks an
    # address that cannot answer, and v4.17.1 reports unreachable as `Error: not
    # ready`, which from inside is indistinguishable from a considered no.
    #
    # No command in this image can ask the question correctly: it is built with
    # no shell and no HTTP client but that one, so there is nothing to substitute.
    # The readiness check therefore moved to `wait_for_idp_ready` in
    # bootstrap-managed.sh, which asks the PUBLISHED port from the host — the
    # side that can reach it — and says which of "nothing answered" and "answered
    # and said no" happened. The check did not get weaker; it got asked by
    # somebody in a position to hear the answer.
    networks:
      ownpace-network:
        # THE ALIAS IS DERIVED, NOT ASSUMED — see zitadel-network-alias.sh,
        # which writes ZITADEL_NETWORK_ALIAS before anything here starts.
        #
        # It used to be `${ZITADEL_EXTERNALDOMAIN:-ownpace-idp}` outright, so
        # that whatever origin Zitadel was told to answer for resolved to this
        # container from everywhere on this network. That is exactly right when
        # the provider IS the address, and it is what let the API present the
        # very origin the instance was initialised with (#1f6a699).
        #
        # It is exactly wrong when something fronts the provider. Then the
        # browser reaches `https://name` on 443, a reverse proxy terminates TLS
        # and forwards to this container's own port — and the API, which has to
        # present the same origin because `iss` matches byte for byte, follows
        # the alias to this container instead of to the front, and connects to a
        # port nothing here listens on:
        #
        #     [ready] the issuer's key source at
        #     https://id.ota.ownpace.eu/.well-known/openid-configuration
        #     is unreachable: connect ECONNREFUSED 172.23.0.21:443
        #
        # Same 500 as the bug the alias was added to fix, opposite cause. The
        # alias now names this container unless the external origin is one this
        # container actually serves.
        aliases:
          - ${ZITADEL_NETWORK_ALIAS:-ownpace-idp}

  # MAKES THE PROVISIONING TOKEN'S DIRECTORY WRITABLE BY THE IDENTITY PROVIDER.
  #
  # E2E (managed) #44 is why this exists, and it had never worked once:
  #
  #   migration failed  name=03_default_instance
  #     error="open /machinekey/pat.txt: permission denied"
  #   setup failed, skipping cleanup
  #
  # Docker creates a NEW named volume's mount point owned by root, and the
  # Zitadel image runs as a non-root user — which that error proves, since root
  # could have written anywhere. `03_default_instance` creates the first human
  # BEFORE the machine account, so while the admin password was being rejected
  # (#509) this failure was never reached; fixing the password is what exposed
  # it. Two bugs in a queue, the second invisible until the first was gone.
  #
  # The path cannot simply move somewhere already writable: setup-zitadel.sh
  # reads exactly this file to provision the project and client without anybody
  # clicking through a console, and the volume is what keeps the token out of
  # the working tree where a `git add -A` could find it (hard rule 3).
  #
  # `profiles` keeps it out of `up`, and the BRING-UP runs it with
  # `compose run --rm` rather than compose starting it as a dependency. That is
  # deliberate: `up -d --wait` and a container that exits 0 have a fraught
  # history across compose versions, and the one thing this stack cannot afford
  # is a new way for the identity provider's bring-up to hang or misreport.
  # `run` returns the one-shot's exit code and nothing else.
  #
  # ZITADEL_UID is READ OFF THE IMAGE by the bring-up (`docker image inspect`),
  # not guessed here, and v4.6.2 is why: it reported `zitadel`, a NAME, so a
  # hardcoded 1000 would have chowned this directory to whoever else holds that
  # uid. The bring-up reads `Config.User`, and where that is a name it reads the
  # number out of the image's own /etc/passwd — the file Docker itself resolves
  # the name against. The default here is only for a hand-run `compose run` with
  # nothing exported.
  zitadel-machinekey:
    image: busybox:1.37
    profiles: ["init"]
    command:
      - sh
      - -c
      - |
        set -e
        mkdir -p /machinekey
        chown "${ZITADEL_UID:-1000}" /machinekey
        chmod 700 /machinekey
        echo "machinekey volume is now owned by ${ZITADEL_UID:-1000}, mode 700"
    volumes:
      - zitadel_machinekey:/machinekey
    networks:
      - ownpace-network

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      args:
        # GET /version reports this commit (build-identity.ts). CI passes it
        # (images.yml); a hand-built stack must pass it too or the endpoint
        # answers commit "unknown" — build with:
        #   GIT_SHA=$(git rev-parse HEAD) docker compose -f managed.yml build
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: ownpace-api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      # DATABASE_URL = DB owner (migrations / seed). APP_DATABASE_URL = non-owner
      # `app_user` role the request path connects through so RLS is ALWAYS enforced
      # (a superuser/owner bypasses RLS even under FORCE — see workplan 0011 T1).
      # DB_HOST/DB_PORT default to the pooler. Setting them to postgres:5432 in
      # .env puts the whole stack back on direct connections — the rollback the
      # pgbouncer service documents.
      DATABASE_URL: postgresql://${POSTGRES_USER:-openmigrate}:${POSTGRES_PASSWORD:-openmigrate_password}@${DB_HOST:-pgbouncer}:${DB_PORT:-6432}/${POSTGRES_DB:-openmigrate}
      APP_DATABASE_URL: postgresql://${APP_DB_USER:-app_user}:${APP_DB_PASSWORD:-app_password}@${DB_HOST:-pgbouncer}:${DB_PORT:-6432}/${POSTGRES_DB:-openmigrate}
      # ALWAYS direct, never the pooler. `migrate.ts` holds a SESSION-scoped
      # pg_advisory_lock across every migration's own transaction; through a
      # transaction-mode pooler the lock would be taken on one server connection
      # and the migrations applied on others, so two replicas booting at once
      # would stop excluding each other — silently, and only under load.
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER:-openmigrate}:${POSTGRES_PASSWORD:-openmigrate_password}@postgres:5432/${POSTGRES_DB:-openmigrate}
      # Fail-closed (0020 T2): with the tenant-membership gate, JWT_SECRET is
      # the outer wall of the tenancy boundary. No default — and the API also
      # refuses to BOOT in production with a known placeholder value.
      JWT_SECRET: ${JWT_SECRET:?generate with openssl rand -hex 32 and set in .env}
      # Required to encrypt/decrypt connection credentials (create-mapping, worker deps).
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?set a 32-byte key in .env}
      JWT_EXPIRY: ${JWT_EXPIRY:-24h}
      # The OIDC issuer (ADR-0042). SET IT AND THE SYMMETRIC JWT_SECRET STOPS
      # BEING USED — `selectAuthMode` prefers JWKS precisely so a lingering
      # secret cannot silently downgrade verification. Empty until
      # setup-zitadel.sh has run, because the issuer URL is not knowable before
      # the provider exists.
      #
      # Changing provider is changing these two values. Nothing else.
      JWT_ISSUER: ${JWT_ISSUER:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      # The identity provider's own upstream callback, for the Redirect URIs
      # page. setup-zitadel.sh writes it; the API only ever shows it.
      IDP_UPSTREAM_CALLBACK_URL: ${IDP_UPSTREAM_CALLBACK_URL:-}
      # Only for a provider that publishes no discovery document. Setting it
      # pins a URL that key rotation can move underneath you — see
      # `getJWKS` in apps/api/src/middleware/auth.ts.
      JWT_JWKS_URI: ${JWT_JWKS_URI:-}
      TRIGGER_API_URL: http://trigger-api:3000
      # The project environment's secret key (tr_prod_...), minted by the
      # instance's OWN dashboard — which is why it cannot be `:?`-required:
      # the first `compose up` has to happen before the key can exist. Until
      # it is set, every enqueue fails loudly by name (trigger-client.ts) and
      # lands the run/receipt row `failed`; nothing hangs (0018 T1).
      TRIGGER_SECRET_KEY: ${TRIGGER_SECRET_KEY:-}
      MOLLIE_API_KEY: ${MOLLIE_API_KEY:-}
      MOLLIE_WEBHOOK_SECRET: ${MOLLIE_WEBHOOK_SECRET:-}
      # The deployment's own identity for QUALIFIED VIES checks (workplan
      # 0111 T2) — the ones that come back with a consultation number, which
      # is the seller's actual defence for reverse charging. Both or neither:
      # half a pair makes the check route refuse by name rather than silently
      # downgrade every check to an unqualified one. Unset until the
      # operating entity (an accountant conversation) has a number to put
      # here; unqualified checks still work and say what they are.
      VIES_REQUESTER_MEMBER_STATE: ${VIES_REQUESTER_MEMBER_STATE:-}
      VIES_REQUESTER_VAT_NUMBER: ${VIES_REQUESTER_VAT_NUMBER:-}
      # The VAT-treatment decision's two switches (workplan 0111 T3). The
      # seller's member state defaults to NL until the operating-entity
      # question is settled; the OSS flag stays false until the owner's
      # €10k-threshold decision flips — flipping it changes what EU consumers
      # outside the seller country are told their invoices will carry.
      OWNPACE_SELLER_COUNTRY: ${OWNPACE_SELLER_COUNTRY:-NL}
      VAT_OSS_ACTIVE: ${VAT_OSS_ACTIVE:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3123}
      WEB_URL: ${WEB_URL:-http://localhost:3123}
      # Which scope class this deployment's own Google application carries
      # (ADR-0041). Empty means `sensitive`, which is what the appliance and
      # every deployment that has not answered gets. managed.env.example
      # carries the full note, including what it costs in Testing status.
      GOOGLE_ACCOUNT_SCOPE_CLASS: ${GOOGLE_ACCOUNT_SCOPE_CLASS:-}
      # The deployment's OWN Google OAuth client (ADR-0041, owner decision
      # 2026-09-01 — option B): configured once here, so nobody types a client
      # secret into a wizard and rotating it is one edit rather than one per
      # connection. A connection that carries its own pair still wins.
      #
      # The WORKER needs them too, and gets them from set-task-env.sh — a task
      # container inherits nothing from compose, which is why they are in both
      # places and why that script names them.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      # The deployment's own Dropbox app (2026-09-02), the same rule and the
      # same second place: set-task-env.sh carries them to the worker.
      DROPBOX_OAUTH_CLIENT_ID: ${DROPBOX_OAUTH_CLIENT_ID:-}
      DROPBOX_OAUTH_CLIENT_SECRET: ${DROPBOX_OAUTH_CLIENT_SECRET:-}
      API_URL: ${API_URL:-http://localhost:3001}
      # How long a backup of this database is kept. Not a schedule — it is what
      # the close endpoint TELLS a customer about when their erasure actually
      # completes (0085 T5). Unset means the 7-day default in @openmig/shared.
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-}
      # THE MAIL SETTINGS. Absent here until 2026-08-25, which meant this
      # container could not send a single notification no matter what `.env`
      # said: compose passes NOTHING it has not been told to pass, and
      # `readNotifierConfig` reads `process.env` inside the container. Every
      # grant, decline and access request reported `notified: "off"` — honestly,
      # and uselessly, because the setting that would have turned it on could
      # not reach the process that reads it.
      #
      # The self-host edition never had this problem: `deploy/selfhost/compose.yml`
      # uses `env_file: .env`, so the whole file arrives. This one lists keys
      # explicitly — safer, and it fails exactly this way when a key is
      # forgotten. `scripts/the-mail-the-api-could-not-send.unit.test.ts`
      # compares the two lists so the next one cannot be forgotten silently.
      #
      # All optional: an empty SMTP_HOST leaves the channel off, which is the
      # correct default for a stack nobody has configured mail on.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_ALLOW_SELF_SIGNED: ${SMTP_ALLOW_SELF_SIGNED:-}
      NOTIFY_FROM: ${NOTIFY_FROM:-}
      NOTIFY_TO: ${NOTIFY_TO:-}
      NOTIFY_LOCALE: ${NOTIFY_LOCALE:-}
      # Found by the guard below on its first run, not by reading: this one is
      # consulted by the same function and was missed by the same enumeration.
      NOTIFY_DIGEST: ${NOTIFY_DIGEST:-}
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      trigger-api:
        condition: service_started
    networks:
      - ownpace-network

  # There is deliberately NO worker/poller service (0022 T4): syncs are
  # started by the deployed `managed-sync-tick` scheduled task, and every job
  # executes as a Trigger.dev task via the supervisor. One execution plane.

  # Web Application. VITE_API_URL is a BUILD arg (Vite bakes it into the
  # static bundle); the default /api keeps browser calls same-origin, and the
  # image's nginx proxies them to the api service (API_UPSTREAM env, default
  # api:3001 — matches this stack's service name and port).
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        # Same argument the api build takes above, for the same reason: the
        # sidebar's build stamp reports this, and an unstamped bundle shows
        # nothing rather than a made-up number.
        GIT_SHA: ${GIT_SHA:-}
        # WITHOUT THESE THE LOGIN PAGE HAS NO SIGN-IN BUTTON. setup-zitadel.sh
        # writes them into .env and phase_app reloads it before building — but a
        # build arg is a separate boundary from the shell environment, and these
        # were never declared, so every managed bundle was built not knowing it
        # had an issuer. Empty is still the honest default: a stack that has not
        # run the identity setup has none, and `Login.tsx` correctly falls back
        # to the paste box there.
        VITE_OIDC_ISSUER: ${VITE_OIDC_ISSUER:-}
        VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-}
        # The support screen's way through to an account at the provider.
        # setup-zitadel.sh writes it; empty means the screen shows the address
        # without a link, which is right for a stack that has no console to
        # point at.
        VITE_IDP_CONSOLE_USER_URL: ${VITE_IDP_CONSOLE_USER_URL:-}
    container_name: ownpace-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3123}:80"
    depends_on:
      - api
    networks:
      - ownpace-network

  # Demo CalDAV/CardDAV/WebDAV backend (T7 DoD demo). Two accounts per demo
  # tenant get provisioned on it by setup-managed-demo.sh; the worker reaches
  # it at http://nextcloud/ via this network. Not needed for a production
  # deployment — operators bring their own calendar/contacts/file targets.
  # The status page (workplan 0094). Its configuration is deploy/compose/gatus.yaml,
  # in git and reviewed — read the header of that file for what this page can and
  # cannot tell you, and why it lives here rather than on its own machine.
  gatus:
    image: ghcr.io/twin/gatus:v5.36.0
    container_name: ownpace-status
    restart: unless-stopped
    environment:
      # The address a BROWSER uses, not an internal service name: probing
      # http://api:3001 would prove the container talks to itself and say
      # nothing about the path a customer actually takes — through the reverse
      # proxy, the certificate and the same-origin /api proxy.
      # WEB_URL by default, and OVERRIDABLE — because on a single box those are
      # legitimately two different addresses.
      #
      # WEB_URL is the address a BROWSER uses, and it has to stay that: the
      # issuer, the redirect URIs and the grant email all read it. But this
      # probe runs INSIDE this container, and the shipped default is
      # `http://localhost:3123` — where `localhost` is gatus itself, with
      # nothing on 3123. So a default stack would light four red lamps for a
      # perfectly healthy service, which is the same corrosion as a green one
      # that means nothing.
      #
      # Invisible until now only because this service had never once been
      # started (see bootstrap-managed.sh). Set STATUS_WEB_URL to an address
      # this container can actually reach; bootstrap-managed.sh says so when
      # the effective value is a loopback one.
      STATUS_WEB_URL: ${STATUS_WEB_URL:-${WEB_URL:?set WEB_URL in .env}}
      # THE PROVIDER, ASKED DIRECTLY. Every other Ownpace row on that page reads
      # a field off one `/api/ready`, so nothing ever named the identity
      # provider and the whole group went dark together whenever the API was
      # the thing that was down.
      #
      # THE NAME AN OPERATOR THINKS IN, over the port that says what this
      # actually reaches.
      #
      # This defaulted to the compose SERVICE name — `http://zitadel:3126` — and
      # the row on the page then read `zitadel` while every other Ownpace row
      # read a domain. That is a real cost: somebody scanning the page has to
      # stop and work out whether `zitadel` is even the right machine (owner,
      # 2026-08-25).
      #
      # It is the SAME EXPRESSION as the network alias below, so the two cannot
      # drift: whatever external domain the provider answers for, that name
      # resolves to its container from everywhere on this network. On a fronted
      # stack it renders `id.example.com:3126`.
      #
      # AND THE PORT IS THE TELL, deliberately left visible. `:3126` is the
      # container's own port, so this row proves the provider is SERVING and
      # not that its public https name resolves — the alias means a probe for
      # that name never leaves this network. Writing it as the bare public URL
      # would hide that distinction behind an address that looks like the one a
      # visitor uses. Probing the public path means running this page off this
      # box, which gatus.yaml's header already names as the eventual plan.
      STATUS_IDP_URL: ${STATUS_IDP_URL:-http://${ZITADEL_EXTERNALDOMAIN:-ownpace-idp}:${ZITADEL_PORT:-3126}}
      # THE PUBLIC SITE, OFF UNTIL BOTH ARE SET. `www.yml` is a separate deploy
      # that this stack does not start, so a row for it is opt-in: a red light
      # for a service nobody deployed is a lamp that lies.
      #
      # The URL still needs a value even while the row is off, because gatus
      # refuses to load a config containing an endpoint with no URL and takes
      # the whole page down with it. The placeholder is a `.invalid` name — it
      # can never resolve, so it can never be accidentally green, and it names
      # itself in the failure if the switch is turned on without an address.
      STATUS_SITE_ENABLED: ${STATUS_SITE_ENABLED:-false}
      STATUS_SITE_URL: ${STATUS_SITE_URL:-http://status-site-url-is-not-set.invalid}
      GATUS_CONFIG_PATH: /config/config.yaml
    volumes:
      - ./gatus.yaml:/config/config.yaml:ro
      # History lives here and NOT in the Postgres this page watches, so an
      # outage is still readable afterwards.
      - gatus_data:/data
    ports:
      - "${STATUS_PORT:-3124}:8080"
    networks:
      - ownpace-network
    # No `depends_on`. A status page that will not start until the thing it is
    # watching is healthy is a status page that is never there when it matters.
    # NO HEALTHCHECK, AND THIS IS NOT AN OMISSION.
    #
    # There was one until 2026-08-25:
    #
    #     test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
    #
    # It could never have passed. `ghcr.io/twin/gatus`'s final stage is
    # `FROM scratch` — the binary and ca-certificates, nothing else. No wget,
    # no curl, no shell, so `CMD-SHELL` is out too, and `main.go` parses no
    # arguments at all, so there is no `gatus healthcheck` subcommand the way
    # mailpit has `/mailpit readyz`. Verified against the upstream Dockerfile
    # and main.go at v5.36.0 rather than assumed.
    #
    # WRITTEN IN #498 AND NEVER ONCE RUN, because nothing started this service
    # until #547 put it in the bring-up's list. Its first real execution was
    # E2E (managed) #77, where it marked a perfectly healthy gatus `unhealthy`
    # and failed the gate's residue check — the only thing red in the run.
    #
    # A healthcheck that can never pass is worse than none: it is a permanent
    # false negative that hides a real one. So the question moves to a side
    # that can answer it — smoke-managed.sh probes /health over the published
    # port, from the host, where curl exists. Same correction as #517 ("ask
    # readiness from the side that can reach the answer") and the same shape as
    # the smoke's issuer probe, which asked with a curl the API image had not
    # got.
    #
    # `up -d --wait` still waits for this container to be RUNNING; it simply no
    # longer waits for a verdict the image cannot produce.

  # Mailpit — the mail this stack sends, CAUGHT rather than delivered.
  #
  # Until 2026-08-24 nothing here could send mail at all: SMTP_HOST was empty,
  # so `readNotifierConfig` reported the channel off and every notification the
  # product renders went nowhere. Somebody filled in the access-request form on
  # the live test site and heard nothing, which was correct behaviour and
  # useless behaviour at the same time.
  #
  # A CATCHER, NOT A RELAY, and that is the point rather than a compromise:
  #
  #   - Every mail the product sends is VISIBLE, in a browser, on this box.
  #   - The smoke can ASSERT one arrived and read what it said. Nothing
  #     verified that end of the product before.
  #   - No automated run can ever reach a real inbox. A relay cannot promise
  #     that, and the nightly gate exercises grant, decline and now request.
  #
  # For real delivery, point SMTP_HOST at a relay — see managed.env.example.
  # bootstrap-managed.sh says so out loud if a deployment that looks real is
  # still pointed here.
  #
  # SMTP stays on the compose network: 1025 is not published, because the only
  # things that should reach it are services in this stack. The web UI is.
  mailpit:
    image: axllent/mailpit:v1.31.0@sha256:c96991d9bef73594c246d89ca81411d4e916f03e76a7d2d72fa2ab5dd3c9ce24
    container_name: ownpace-mailpit
    restart: unless-stopped
    environment:
      # A catcher accepts whatever it is handed. Refusing on auth or TLS would
      # turn a configuration question into a delivery failure that reads like
      # a broken product.
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      # Bounded, like every other thing on this box that writes forever. Two
      # disk leaks in one week is a pattern, not bad luck (workplan 0099).
      # THE CAP IS LOAD-BEARING NOW, not just tidy: with MP_DATABASE set below
      # this is what the store costs on disk rather than in RAM, and an
      # uncapped persistent catcher is that third disk leak. The rule in
      # the-mail-the-issuer-could-not-send.unit.test.ts refuses one without
      # the other.
      MP_MAX_MESSAGES: "500"
      # KEEP WHAT WAS CAUGHT. Unset, mailpit holds messages in memory only, so
      # every verification link, email-change confirmation and password reset
      # vanishes the moment the container is recreated — and recreating it is
      # not an exotic event: changing MAILPIT_BIND does it, so does a version
      # bump, so does `up -d` after almost any edit to this file. An operator
      # who is halfway through a sign-up when that happens has no way back to
      # the code they were sent, and the failure looks like the identity
      # provider never sent the mail.
      #
      # Mailpit appends `mailpit.db` when handed a directory; the path is
      # written out in full here so it does not depend on that.
      #
      # WHAT THIS COSTS is that those links now sit in a volume instead of only
      # in RAM. They are short-lived codes, the volume is root-owned on the
      # box, and the UI in front of them is already loopback-bound by default —
      # so this moves the exposure no further than the port above already does,
      # which is the boundary that was argued out there and still holds.
      MP_DATABASE: /data/mailpit.db
    ports:
      # 127.0.0.1, LIKE THE REGISTRY AND FOR A SHARPER REASON. Mailpit has no
      # authentication of any kind — it is a catcher, and asking it to hold
      # credentials would defeat the point — and what it catches is every
      # verification link, every email-change confirmation and every password
      # reset this stack sends. Published on 0.0.0.0 that is an unauthenticated
      # reader of the identity provider's mail, reachable by anyone who can
      # route to the box. Harmless on a laptop, which is where this was written;
      # not harmless the day the box gets a public name, which ota.ownpace.eu
      # did on 2026-08-24.
      #
      # Reach it through an SSH tunnel instead — docs/managed-bring-up.md says
      # how. The smoke and the nightly both ask on localhost from the host, so
      # neither notices.
      #
      # THE BIND ADDRESS IS A SETTING, AND ITS DEFAULT IS STILL LOOPBACK. A
      # private mesh address is not the same thing as `0.0.0.0`: on a WireGuard
      # network — NetBird, Tailscale — the peer address is reachable only by
      # devices holding a key for it, which is an authentication boundary this
      # container does not have to provide itself. An operator who wants the
      # catcher on their laptop without a tunnel every time sets
      # `MAILPIT_BIND` to that peer address and gets it, and nothing about the
      # shipped default changes for anyone who does not.
      #
      # WHAT STAYS FORBIDDEN is the thing the paragraph above is about: a
      # public name, and every interface. `MAILPIT_BIND=0.0.0.0` publishes an
      # unauthenticated reader of every password reset to whatever can route to
      # the box, and the rule in the-mail-the-issuer-could-not-send.unit.test.ts
      # refuses it — along with a bind that has no default, which is the same
      # mistake made by omission.
      #
      # ON A MESH IT IS STILL UNAUTHENTICATED. Everyone on that network can read
      # every verification link, so the question moves from "who can route to
      # this box" to "who is on this mesh" — worth answering deliberately, and
      # worth `MP_UI_AUTH_FILE` if the answer is more than one person.
      - "${MAILPIT_BIND:-127.0.0.1}:${MAILPIT_PORT:-3127}:8025"
    volumes:
      - mailpit_data:/data
    networks:
      - ownpace-network
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 30s
      timeout: 5s
      retries: 5

  nextcloud:
    image: nextcloud:34-apache
    container_name: ownpace-nextcloud
    restart: unless-stopped
    environment:
      SQLITE_DATABASE: nextcloud
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:-admin_managed_pw}
      NEXTCLOUD_TRUSTED_DOMAINS: "localhost nextcloud"
      # ARMED ON PURPOSE (0103 T2 / ADR-0043). Without a mail server Nextcloud
      # cannot send anything, and the gate's "a migration sent no mail" would
      # be true by inability — the same silence-by-blindness the whole 0103
      # plan exists to end. Pointed at the catcher, the fan-out path is real:
      # if any layer regresses toward mailing (the writer's neutralising, a
      # Nextcloud behaviour change, a fixture edit), the message lands in
      # Mailpit and the smoke goes red instead of nobody ever knowing.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM_ADDRESS: calendar
      MAIL_DOMAIN: ownpace.invalid
    ports:
      - "${NEXTCLOUD_PORT:-8083}:80"
    # The one probe here that is not an inference: `setup-nextcloud-users.sh`
    # has been running `docker exec <nextcloud> curl … http://localhost/status.php`
    # against this image on the Spark since the demo existed, so both the binary
    # and the endpoint are proven rather than assumed.
    #
    # `start_period` is long because first boot INSTALLS Nextcloud, and
    # status.php does not answer 200 until it has. That is also why the demo
    # setup script polls it.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost/status.php || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s
    networks:
      - ownpace-network

networks:
  ownpace-network:
    driver: bridge

volumes:
  gatus_data:
  # What the mail catcher caught. Bounded by MP_MAX_MESSAGES, not by luck.
  mailpit_data:
  # The identity provider's first-init provisioning token (ADR-0042).
  zitadel_machinekey:
  postgres_data:
  trigger_db_data:
  redis_data:
  trigger_shared:
  registry_data:
  minio_data:
  trigger_tls_data:
  trigger_tls_config:
  # Kept, not reused: the Bitnami-era event store. Safe to remove once
  # nobody wants the old dashboard history.
  clickhouse_data:
  clickhouse_data_v2:
  clickhouse_logs:
