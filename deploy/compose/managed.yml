# Managed deployment stack. Its background jobs run on pg-boss, in the
# `worker` service, on the ledger's own Postgres (ADR-0054, workplan 0167).
# Postgres version aligned with deploy/compose/dev.yml (Postgres 18).
#
# This stack includes:
# - PostgreSQL (ledger database) behind PgBouncer
# - The job worker (`worker`): the seventeen jobs on pg-boss, in the schema
#   `pgboss` that the role `ownpace_jobs` owns
# - Zitadel (the identity provider, ADR-0042)
# - Ownpace API
# - Web application
# - Gatus (the status page, workplan 0094) and Mailpit (catches outbound
#   mail unless SMTP_HOST points at a real relay)
# - Nextcloud (demo CalDAV/CardDAV/WebDAV backend for the T7 DoD demo — see
#   deploy/compose/setup-managed-demo.sh)
#
# Deliberately NOT here: a demo mail (IMAP/JMAP) backend. Stalwart requires a
# two-phase startup (provisioning in recovery mode, then serving in normal
# mode) that plain `docker compose up` cannot express for one service — same
# reason deploy/compose/dev.yml excludes it. Bring it up with
# deploy/selfhost/setup-stalwart.sh instead (the ONE canonical way; see that
# script's header) — deploy/compose/setup-managed-demo.sh does this for you,
# joined to this stack's network so the worker reaches it by name.
#
# WHICH RUNNER THE JOBS RUN ON (ADR-0054, workplan 0167 T7 and T9). pg-boss,
# the only one: the api and the worker carry OWNPACE_JOB_RUNNER with the
# default `pg-boss`. Trigger.dev's plane, its eleven services (trigger-db,
# trigger-redis, trigger-api, clickhouse, trigger-registry,
# trigger-docker-proxy, trigger-supervisor, minio, minio-init, trigger-tls,
# trigger-tls-init), stood here in profile `trigger`, stopped, from alpha.16 to
# alpha.17, and alpha.18 removed them with their volumes, networks and
# TRIGGER_* keys. A stack that ran them keeps their stopped containers as
# orphans, which the bring-up's `plane` phase removes by their Compose labels
# (it never runs `up --remove-orphans`); the volumes are removed only by
# `remove-trigger-plane.sh`, by name, never by a
# `down -v` (docs/managed-bring-up.md, "Trigger.dev's plane, removed").
# An old `.env` that still says OWNPACE_JOB_RUNNER=trigger is refused by the
# api, the worker and the bring-up, each in one sentence, never ignored.
# scripts/a-plane-removed.unit.test.ts holds all of this.
#
# Pinned project `name` below is load-bearing, not cosmetic: without it, `docker compose`
# derives the resource-name prefix from the CURRENT DIRECTORY'S BASENAME ("compose"), so on a
# shared host, any other unrelated project also run from a directory literally named `compose`
# collides on the exact same volume/network names (compose_postgres_data,
# compose_ownpace-network, ...). Confirmed live on the box (2026-07-25): the database
# container silently mounted a `compose_postgres_data` volume created two days earlier -- NOT this project's
# data -- so its `openmigrate` role's real password didn't match this stack's own .env, and every
# app-tier connection failed with "password authentication failed" despite .env, the container's
# own POSTGRES_PASSWORD env var, and a local-socket/127.0.0.1 psql check all agreeing (the latter
# two are trusted by Postgres's default pg_hba.conf and never actually check the password -- only
# a connection from another container's real IP exercises the scram-sha-256 rule and exposed this).
#
# THE PIN IS A DEFAULT, AND EVERY NAME FOLLOWS WHATEVER OVERRIDES IT (workplan 0132 T1, D7, D9).
# `COMPOSE_PROJECT_NAME` in the `.env` beside this file (or in the environment, or `-p`) overrides
# it, and the reference machine runs a second stack that way: `ownpace-live`, beside this default
# one, on the same Docker daemon. A daemon keeps two stacks apart by NAMES only, so nothing here
# names a stack itself. Volumes and networks carry no `name:`, so compose prefixes them with the
# project. Every `container_name` is built from `${COMPOSE_PROJECT_NAME}`, which compose sets to
# the project it chose, so this stack's database is `<project>-db` (`docker compose -p` does NOT
# namespace a fixed `container_name`: 17 fixed ones stopped a second project from starting at
# all). The scripts reach a service with `docker compose exec <service>`, and take the project
# from `compose_project` in env-read.sh. `scripts/two-stacks-on-one-box.unit.test.ts` renders this
# file under two projects and fails on anything the two would share.
#
# EVERY PORT ANSWERS ON LOOPBACK, AND ANY OTHER ADDRESS IS ASKED FOR (workplan 0132 T3, T1f).
# A publish with no host address is Docker's 0.0.0.0, every interface, and Docker writes its own
# firewall rules for it, so a host firewall's input rules do not close it. Seven ports here were
# published that way until workplan 0132 T3. On a machine with two stacks it is worse than "reachable from
# outside": a container reaches every port the host publishes through its network's gateway, so
# each stack's containers could reach the other's Postgres and API.
#
# So each published port has two entries. The first is `127.0.0.1`, fixed, because the bring-up,
# the smoke, the deploy CLI and the seed ask these ports on localhost from the host. The second is
# `${<NAME>_BIND:-127.0.0.1}`: unset, it renders the same as the first and Compose keeps one of them;
# set in this stack's `.env`, it adds that address and leaves loopback where it was. What a bind is
# set to is the front's address for a port a public name is routed to (the web app, the identity
# provider and the status page), and a mesh address for a page the owner opens from a laptop.
# A bind is one IPv4 address, never a name (Compose refuses the whole file, `invalid IP address`)
# and never 0.0.0.0; `bootstrap-managed.sh` refuses both before Compose reads the file.
# `scripts/a-port-published-on-purpose.unit.test.ts` holds every `ports:` entry to this shape.
# Mailpit and Nextcloud keep their older single bind, which their callers follow.
#
# A BIND ON A MESH ADDRESS TIES THE CONTAINER'S START TO THAT ADDRESS. Docker binds the address
# when it starts the container, and the address must exist then. After a reboot where Docker
# starts before the mesh client has its address, the container fails with `cannot assign
# requested address`, its loopback publish with it, and a restart policy does not reliably
# retry that start. A publish on every interface never had this dependency. The remedy,
# `net.ipv4.ip_nonlocal_bind=1` or Docker ordered after the mesh, and the check after a reboot are
# in docs/managed-bring-up.md, "Which address a port answers on".
name: ownpace-managed
#
# THE STORES AND THE TLS FRONT BY EXACT VERSION AND DIGEST (2026-10-22, workplan 0119 §4).
# postgres, nextcloud (and, until alpha.18, Trigger.dev's stores) floated within their lines until
# then (`postgres:18-alpine`, `caddy:2-alpine`, ...), so that they would take their patches, and
# nothing ever pulled them: Compose pulls only an image the machine does not have, so both
# stacks ran whatever copy was pulled first, and nothing said which. Each now moves by a
# pull request, proven by E2E (managed) on its branch, and live takes it from a release tag; `up`
# pulls a digest the machine does not have. Dependabot reads no file here: the weekly pin watch
# (scripts/idp-pin-watch.mjs) says when a newer tag is listed, and the weekly image scan
# (scripts/image-scan.mjs) counts the findings a newer package fixes, which is when a rebuild of
# the same tag is worth its new digest. db-roles.sh asks with this file's first postgres image.
# postgres runs a build of the official image since 2026-10-26 (workplan 0146 T15):
# their pin is deploy/compose/postgres/Dockerfile's FROM, by tag and digest, which Dependabot does
# read (its own entry), and the name below carries a hash of that file's instructions, so a
# changed Dockerfile is a name the machine does not have yet, and a pull request that changes one
# fails a-database-started-as-root until the names move with it (the failure says how). `up`
# builds it only where that name is missing, and only if nothing asks for a build: `up --build`
# builds every service in its scope that has a `build:`, dependencies included, so
# bootstrap-managed.sh builds `api web` by name and runs `up` without it.
# pgbouncer runs a local build too since 2026-11-13 (workplan 0119, for alpha.8): edoburu's image
# at its pinned digest with five Alpine packages at the versions that carry their fixes (libpq,
# postgresql18-client, musl, musl-utils and zlib: 79 high findings on 2026-11-13, in a base
# upstream had not rebuilt), whose pin is the FROM of deploy/compose/pgbouncer/Dockerfile by tag
# and digest, which Dependabot reads (its own entry). Its name ends in the hash of that file's
# instructions, and a pull request that changes them fails a-rebuild-upstream-has-not-made until
# the name moves with it. `up` builds it where it is missing, from Docker Hub and Alpine's
# mirror. It goes back to upstream's image once that carries the five (the Dockerfile's header).
# scripts/a-float-nothing-ever-pulled.unit.test.ts refuses a new float; busybox's one-shot
# chown is the one it names, with its reason.
#
# CONTAINER OUTPUT, CAPPED BY SIZE (2026-10-21). Docker's default driver,
# json-file, keeps everything a container writes, with no limit of age or size,
# until the container is removed, and a service whose image and settings do not
# change keeps its container for months: the database and the identity
# provider are recreated only when a deploy changes them. So
# every service below writes json-file with the appliance's cap
# (deploy/selfhost/compose.yml): five files of 20 MB, at most 100 MB a service
# and 1.8 GB a stack. The output still goes with the container, so privacy
# §9's "until the part of the service that wrote them is replaced" holds; the
# oldest lines can go sooner, never later. deploy/compose/www.yml sets no cap
# on purpose: site-visits.sh counts the site's visits from the whole of its log
# on every run. A job's run on pg-boss is a child process of the worker and
# writes through it, so its lines are the worker's and go with the worker's
# container, which every update of the service replaces.
# scripts/a-month-of-container-output.unit.test.ts holds every service to it.
#
# HOW THE CONTAINERS RUN (2026-11-03, workplan 0119; the owner, 2026-11-03:
# "more hardened"). Every service sets `no-new-privileges`: a process in it
# cannot gain a privilege by running a setuid binary or one with a file
# capability. Nothing here needs that: the services that change user
# (Apache's workers, Nextcloud's su) do it as
# root, with a system call, and the rest never change user. All but
# one drop every capability (`cap_drop: [ALL]`) and add back only what their
# own start-up does as root, each named beside the service with the reason;
# a service that runs as another user from its first process adds none. The one
# that keeps Docker's default set, nextcloud, says why beside it (trigger-api
# was the other until alpha.18). Seven that write nothing outside their volumes start with a read-only
# root, with /tmp (and /run) in memory where they write there. Each set was
# measured on the service's own image, its start and a restart on the volume it
# wrote, where the image could be pulled, and read from the image's Dockerfile
# where it could not (docs/managed-bring-up.md, "How the containers run", has
# the table). An `exec` into a service has the same capabilities as the service:
# a repair that needs root's powers there is `exec --privileged -u 0`. A job's
# run on pg-boss is a process inside the worker, so the worker's settings are
# its own.
# scripts/a-privilege-no-service-uses.unit.test.ts holds every service to it.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  # PostgreSQL Database
  postgres:
    # The official image without gosu, started as its postgres user, uid 70
    # (workplan 0146 T15): deploy/compose/postgres/Dockerfile says why, what a
    # start as uid 70 leaves out, and why the name carries the hash of its
    # instructions. Compose builds it on the first `up` that finds no image of
    # this name; the base's digest is the Dockerfile's FROM. `never`: no
    # registry serves this name, so `docker compose pull` passes it by rather
    # than failing on it, and `up` builds it when it is missing without first
    # asking whatever answers on this host's port 443 for it.
    image: localhost/postgres:18.7-alpine-188a4909a850
    build: ./postgres
    pull_policy: never
    container_name: ${COMPOSE_PROJECT_NAME}-db
    restart: unless-stopped
    logging: *logging
    # HOW IT RUNS (see the header): uid 70 from its first process, so no capability.
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: []
    # QUERY STATISTICS (workplan 0143 T8). pg_stat_statements must be loaded
    # at start-up; bootstrap-managed.sh's data phase creates the extension
    # that reads it. Utility statements are not tracked, so an `ALTER ROLE …
    # PASSWORD` (rotate-db-passwords.sh) never lands in the statistics view.
    # Changing this line recreates the container: live takes it inside
    # deploy-live.sh's hold and drain, the OTA stack at the gate's next
    # redeploy from main.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track_utility=off
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openmigrate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openmigrate_password}
      POSTGRES_DB: ${POSTGRES_DB:-openmigrate}
    ports:
      # Loopback, and POSTGRES_BIND only if something off this machine needs
      # the database, which nothing here does: the host scripts ask localhost,
      # and the stack reaches it by name. See the header for the shape.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      # NO docker-entrypoint-initdb.d mount of the migration files, deliberately
      # (one used to be here): initdb applies them WITHOUT schema_migrations
      # bookkeeping, and the squashed 0001_baseline is not idempotent — the
      # API's boot-time migrator would then re-apply it onto the already-created
      # schema and crash the container. Schema creation belongs to the migrator
      # alone: the API runs it at boot, and seed-managed.ts runs it first so the
      # demo run order (seed before API) still works on an empty database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openmigrate}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ownpace-network

  # PgBouncer — transaction-mode pooler in front of the ledger (workplan 0082 T4)
  #
  # Why: every managed sync pass opens unbounded pg.Pools (node-postgres default
  # max 10): the job's own plus one per domain while it runs. So without pooling
  # the server-connection ceiling is concurrent-passes times up to twenty,
  # against a managed Postgres whose connection limit is much lower than its CPU
  # budget suggests.
  # A pooler removes that as a CLASS of problem rather than as an incident.
  #
  # The safety argument is in pgbouncer/pgbouncer.ini: the tenant context is set
  # with set_config(..., true) inside a transaction, so nothing survives the
  # COMMIT that hands the server connection to the next borrower. Migrations are
  # the one exception and connect direct — see DIRECT_DATABASE_URL below.
  #
  # ROLLBACK, if this misbehaves: set DB_HOST=postgres and DB_PORT=5432 in .env
  # and `compose up -d`. Every service reads those, so that one change puts the
  # whole stack back on direct connections without touching this file.
  #
  # v1.26.1-p0, AND NOT 1.26.0 (2026-10-21). From 1.25.2 this closes three
  # holes that pgbouncer.ini's own settings leave open, each to a client that
  # has not logged in (NEWS.md, 1.26.0 and 1.26.1): CVE-2026-19888, a SCRAM
  # client-final-message without a nonce crashes the pooler (auth_type is
  # scram-sha-256); CVE-2026-6668, a hang, because max_packet_size is left at
  # its default; and CVE-2026-107349, a spin that stops the pooler for
  # everybody, because ignore_startup_parameters is set and does not name
  # `options`. A fourth, CVE-2026-107350, lets whoever knows the password of a
  # user in auth_file (here the lookup role) log in as any other SCRAM user,
  # admins included, but only through a database PgBouncer does not know, and
  # the `*` line in [databases] should leave none; 1.26.1 closes it anyway.
  # 1.26.0 is the wrong stop on the way: it tracks search_path by default and
  # so ignored `ignore_startup_parameters = search_path` for the startup
  # packet, which 1.26.1 restores (see pgbouncer.ini). 1.26 also removed online
  # restart (-R), which nothing here uses, and left SHOW POOLS' columns as they
  # were.
  #
  # The image tag has no git tag behind it: edoburu/docker-pgbouncer's tags
  # stop at v1.26.0-p0, this image is its master ("Bump pgbouncer to v1.26.1
  # (#137)"), and its images are pushed by hand, so a tag can be pushed again.
  # Its index digest, read on 2026-10-21 (pushed 2026-10-19T14:11Z) and again
  # on 2026-11-13, is the FROM of deploy/compose/pgbouncer/Dockerfile since
  # then, so a re-push is a pull request, never a silent change.
  #
  # BUILT HERE SINCE 2026-11-13 (workplan 0119, for alpha.8): that image, with
  # five Alpine packages at the versions that carry their fixes, because
  # upstream had not rebuilt it: deploy/compose/pgbouncer/Dockerfile says
  # which, why nothing here could reach them, what the build risks, and when
  # the build goes again. PgBouncer itself, its user (postgres, uid 70), its
  # entrypoint and its command are upstream's. Compose builds it on the first
  # `up` that finds no image of this name; `never`, as for the databases: no
  # registry serves this name.
  pgbouncer:
    image: localhost/pgbouncer:v1.26.1-p0-abd8080fb98b
    build: ./pgbouncer
    pull_policy: never
    container_name: ${COMPOSE_PROJECT_NAME}-pgbouncer
    restart: unless-stopped
    logging: *logging
    # HOW IT RUNS (see the header): uid 70 from its first process, so no capability;
    # read-only, with its socket directory in memory.
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: []
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      # SCRAM verifier for the lookup role only — every other credential is read
      # from Postgres via auth_query, so this file does not grow.
      #
      # WHERE IT IS COMES FROM THE .env (2026-11-03, workplan 0132). Unset, it
      # is pgbouncer/userlist.txt beside this file, which is live's: live runs
      # from a checkout nothing cleans. The OTA stack's .env names a file in its
      # persisted directory, which the nightly gate sets and
      # ensure-env-secrets.sh writes: in the gate's checkout, the runner's work
      # folder, the next checkout of any of this repository's workflows there
      # deletes ignored files. ci.yml's did so under a running pgbouncer; at the
      # Docker daemon's next restart the file was gone, Docker made a directory
      # in its place, and the pooler stopped with `not a directory`, exit 127.
      # A start that finds this file missing ends that way, so
      # bootstrap-managed.sh refuses a missing one before Compose starts
      # anything (refuse_a_userlist_docker_would_make_a_directory).
      - ${PGBOUNCER_USERLIST:-./pgbouncer/userlist.txt}:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      # `pgbouncer` is a real database name on the admin console; reaching it
      # proves the process is accepting connections, which a TCP probe does not.
      test: ["CMD-SHELL", "PGPASSWORD=$${PGBOUNCER_AUTH_PASSWORD} psql -h 127.0.0.1 -p 6432 -U pgbouncer_auth -d pgbouncer -c 'SHOW POOLS' >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      PGBOUNCER_AUTH_PASSWORD: ${PGBOUNCER_AUTH_PASSWORD:?run deploy/compose/pgbouncer/setup-auth.sql and set this in .env}
    networks:
      - ownpace-network

  # The identity provider (ADR-0042).
  #
  # WHAT THIS IS FOR. Until it existed, the path from stranger to signed-in
  # customer ended with the owner running seed-managed.sh and emailing a JWT
  # that expired in seven days, to be pasted into a textarea. This is the thing
  # that mints tokens instead.
  #
  # WHY IT IS NOT LOAD-BEARING. ADR-0042 chose this provider and named Keycloak
  # as the fallback, and the decision rests on being able to move with
  # configuration rather than a project. Nothing in `apps/` or `packages/` knows
  # this service exists — the API reads JWT_ISSUER, discovers `jwks_uri` from
  # the standard discovery document, and knows no provider's URL shape.
  # `no-issuer-lock-in.unit.test.ts` enforces that by scanning the source, and
  # `issuer-is-replaceable.unit.test.ts` drives the real verification path with
  # both providers' documents. This block, the setup script and the docs are the
  # only places the name appears, which is exactly where a deployment must name
  # what it deploys.
  #
  # SHARES THE STACK'S POSTGRES, on its own database and its own role. It
  # connects DIRECT rather than through pgbouncer for the reason the api
  # service's DIRECT_DATABASE_URL comment gives: it runs its own migrations, and
  # a transaction-mode pooler is the wrong place to hold a migration lock.
  # ADMIN credentials are how it creates that database and role on first boot;
  # after that it uses its own.
  zitadel:
    # PINNED ABOVE THE POSTGRESQL 18 FIX, and E2E (managed) #46 is why.
    #
    # v4.6.2 could not initialise against this stack's database at all:
    #
    #   migration failed  name=34_add_cache_schema
    #     error="ERROR: partitioned tables cannot be unlogged (SQLSTATE 0A000)"
    #
    # Zitadel's cache schema created an UNLOGGED PARTITIONED table. PostgreSQL
    # removed support for that — `postgres` above is 18 — so setup step 34 fails
    # on every attempt and the provider can never finish starting. It is not a
    # misconfiguration and no setting avoids it: zitadel/zitadel#10712.
    #
    # Fixed by zitadel/zitadel#11484 (merged 2026-02-03, backported to the v4
    # line): step 34 now creates the parent LOGGED and keeps the partitions
    # unlogged, and a new step 69 migrates deployments that got the old shape.
    # Zitadel's own requirements now document PostgreSQL 14–18.
    #
    # The pin moves to the current v4 rather than the oldest release carrying
    # the fix. There is nothing to regress — this provider has never once
    # completed an init here — and an identity provider is the last thing in a
    # stack that should be running seven months behind.
    #
    # `zitadel-image-matches-postgres.unit.test.ts` refuses a pairing of this
    # image with a Postgres major it cannot initialise against, in either
    # direction, so neither number can be moved alone by accident.
    #
    # v4.17.3 (2026-09-04) since 2026-09-06, owner go (0119 §3 item 2). 24
    # commits over v4.17.1, three of them security fixes (TOTP reuse, IDP
    # intent tokens under authenticated encryption, the auth-method permission
    # checked on the user's own organisation). No schema migration between the
    # two. The three facts this stack pins about v4.17.1 were re-read against
    # the tag rather than assumed: `cmd/defaults.yaml` still ships
    # `LoginV2.Required: true` (the-login-page-nobody-chose), the admin SMTP
    # handler still implements only the two deprecated test verbs
    # (the-mail-the-issuer-could-not-send), and `zitadel ready` still asks its
    # external port (the healthcheck note below). Zitadel migrates its own
    # schema at boot, on the persistent stack, so the gate run that proves this
    # is the one that applies it.
    #
    # v4.19.1 (2026-09-23) since 2026-09-28, owner go (workplan 0135, open
    # question 11), for GHSA-4hgj-wm6c-q7p2: login v1's change-username handler
    # renamed the account a sign-in flow had bound without checking that the
    # flow had reached that step, so anybody who could open the sign-in page
    # could rename any account, an administrator's included, without its
    # password. This stack serves login v1. 13 commits over v4.17.3, none in the
    # API definitions or the admin, management, notification and restriction
    # code setup-zitadel.sh calls; four one-way setup steps (76 to 79), and
    # v4.19.1 rather than v4.18.0 because it fixes v4.19.0's backfill step. The
    # three facts above were re-read at v4.19.1: the defaults still ship
    # `LoginV2.Required: true`, and the admin SMTP handler and `zitadel ready`
    # are unchanged. The OTA instance's `zitadel` database was dumped by hand
    # before the gate's run applied this: the gate drilled Trigger.dev's
    # database then, not the identity provider's (it drills the identity
    # provider's since alpha.18, workplan 0167 T9).
    #
    # v4.19.2 (2026-09-28) since 2026-09-28, owner go (workplan 0135, open
    # question 12), found by the weekly pin watch the day it was tagged. Three
    # security fixes, none in anything this stack switches on: a SAML assertion
    # accepted for another provider's sign-in (no SAML provider here), an
    # administrator impersonated through token exchange (impersonation is off
    # here), and login v2's session cookies (its application does not run
    # here). The rest reads the event store in a cheaper order and lets the
    # sessions projection take bigger batches. No setup step, so it moves the
    # schema no further than v4.19.1 did; no change in the API definitions or
    # in any code setup-zitadel.sh calls, which never uses the events API it
    # reorders. The three facts above hold at v4.19.2. The OTA instance's
    # `zitadel` database was dumped first, with deploy/compose/dump-idp.sh.
    #
    # v4.19.4 (2026-10-05), from the weekly pin watch's issue #1523. Five
    # commits after v4.19.2, none a security fix: the invite-code notification
    # handler's ID order, the instance ID in the actions worker, a migration
    # that skips a finished unique-constraint backfill and exclusive owner
    # deletes, and two query changes for listing users. One setup step, 80,
    # which adds an index on users14 by instance and organisation and drops
    # two older ones: one-way, like 76 to 79. Taken now, while only the OTA
    # instance holds data, so live starts on it rather than upgrading later.
    # cmd/defaults.yaml, the login v1 UI and every API handler are unchanged
    # since v4.19.2 (git diff --stat v4.19.2 v4.19.4), so the three facts
    # above, the service ping's default and the privacy policy's fields hold
    # at v4.19.4. The OTA instance's `zitadel` database was dumped first by the
    # owner, with deploy/compose/dump-idp.sh.
    #
    # v4.19.5 (2026-10-15), from the weekly pin watch's issue #1643. Eleven
    # commits after v4.19.4, four of them docs and one npm bump. Three
    # security fixes, so T7's seven days apply. Two are in what this stack
    # does not switch on: device authorizations (login v2's consent, and a
    # permission check on approving one through the API; no client here has
    # the device-code grant, and login v1's device page behaves as before),
    # and login v2's verification and IdP-link proofs, now signed with a
    # server secret (login v2 does not run here, so no new secret). The third
    # is in the host handling every request passes: an invalid
    # `x-zitadel-public-host` header is now kept, so the trusted-domain check
    # refuses it, where it was ignored.
    # Nothing here sends that header: the API, setup-zitadel.sh and the smoke
    # present the public name as Host, the readiness checks ask /debug/ready,
    # and an invalid Host or X-Forwarded-Host is still ignored, as before.
    # Two more enforce list limits: a v2 list without one returns 100, a v1
    # list 1000, and a limit above 1000 is refused; with them the console
    # stops loading every project at startup (95dae90). idp-strays.sh asks for
    # at most 1000 and pages accounts by 100; the smoke's leftover sweep asks
    # /v2/users without a limit and now sees at most 100, against four per
    # dead run; the other lists here hold a handful. No setup step.
    # cmd/defaults.yaml loses only the two unused SearchLimit keys and
    # rewords the query-limit comments, so the three facts above,
    # the service ping's default and the privacy policy's fields hold at
    # v4.19.5. The OTA instance's `zitadel` database was dumped first by the
    # owner, with deploy/compose/dump-idp.sh; E2E (managed) #274 applied it.
    #
    # v4.20.0 (2026-10-22), for issue #1643. Twelve commits after v4.19.5 on
    # upstream's v4.x branch, eleven backports and a go.sum tidy; there is no
    # v4.19.6, so this is the smallest move. Five are docs and one is login
    # v2's device-code cookie (895a29f; login v2 does not run here). No Zitadel
    # advisory: the security content is the build. v4.19.5 was built with Go
    # 1.25.11, a line Go no longer fixes, and x/net v0.58.0; v4.20.0 with Go
    # 1.26.10 and x/net v0.61.0 (3fe639d, 1f984a1). That closes
    # CVE-2026-78667 (GO-2026-6609): a Range header of many small ranges makes
    # net/http's FileServer burn CPU, and the console and login v1's static
    # files are served by http.FileServer to anybody, signed in or not. It
    # closes CVE-2026-78669 (GO-2026-6611) in x/net's HTTP/2 server, which
    # serves this port's h2c, and adds Go's block on the compromised eMudhra
    # intermediates (CVE-2026-111943, GO-2026-6809) to outbound TLS, which on
    # live is the mail relay alone. So T7's seven days apply, to 2026-10-29.
    # No setup step (cmd/setup unchanged), so the schema stays at v4.19.4's
    # step 80. cmd/defaults.yaml, internal/api/grpc/admin and cmd/ready are
    # unchanged, so the three facts above, the service ping's default, the
    # lockout and the privacy policy's fields hold at v4.20.0. Login v1 gains
    # one text (fb4bc84), shown only when an IdP allows neither creating nor
    # linking an account; every IdP setup-zitadel.sh configures allows both.
    # An empty text pattern no longer filters (f8ddee1); nothing here sends
    # one. The console's environment.json takes `api` from the issuer's origin
    # (e01ccc9), so the mismatch bootstrap-managed.sh checks for cannot arise
    # on this image. grpc 1.84.0 and grpc-gateway v2.32.0 sit under every REST
    # call. Go 1.26 refuses URLs with stray colons in the host
    # (GODEBUG=urlstrictcolons=0 undoes it) and adds the SecP256r1MLKEM768 and
    # SecP384r1MLKEM1024 hybrids to the groups TLS offers (tlssecpmlkem=0
    # removes them). Its key share is still X25519MLKEM768, the default since
    # Go 1.24, so v4.19.5 sent the same one. The eMudhra block has no switch.
    # The OTA instance's `zitadel` database was dumped first by the owner, on
    # v4.19.5, with deploy/compose/dump-idp.sh (2026-10-25 06:06 UTC); E2E
    # (managed) #277 applied it.
    #
    # v4.20.1 (2026-11-03), from the weekly pin watch. Ten commits after
    # v4.20.0 on upstream's v4.x branch, no Zitadel advisory. Seven are login
    # v2's (apps/login: e-mail addresses compared without case, the sessions
    # cookie kept under the browser's limit, the i18n merge) or docs and
    # dependency bumps; login v2 does not run here, and the console's own
    # runtime dependencies move by a patch (Angular 21.2.25, moment 2.31.0).
    # Three are in the server: session creation's user lookup by login name,
    # in the session API v2 and v2beta and in SAML, no longer brings the user
    # projections up to date first (709968c). The smoke's sign_in_as creates
    # a session that way, for a person it has just created; the projection
    # handlers subscribe to the events they fold and run on each push, so that
    # person is normally projected by then, and E2E (managed) is the check.
    # The queue log skips nil insert results (c9af97c) and the OTEL log
    # export takes the log level and masking (64b3915); neither runs here,
    # with no debug level and no OTEL log exporter set. No setup step:
    # cmd/, internal/query, internal/repository, go.mod and go.sum are
    # unchanged (still toolchain go1.26.10), so the schema stays at v4.19.4's
    # step 80 and the way back is the v4.20.0 tag. cmd/defaults.yaml, the
    # admin API, cmd/ready and login v1's UI are unchanged, so the three
    # facts above, the service ping's default, the lockout and the privacy
    # policy's fields hold at v4.20.1.
    #
    # v4.20.2 (tagged 2026-11-09), from the weekly pin watch (issue #1867):
    # six commits after v4.20.1 on upstream's v4.x branch. A security fix in
    # what runs here: go.mod moves github.com/go-jose/go-jose/v4 from 4.1.4
    # to 4.1.7 (80d2281a), the fix of CVE-2026-116587, which the week's image
    # scans have read in Zitadel's binary since 2026-11-02; an identity
    # provider parses JWKs, so it may be reachable, as a denial of service.
    # One more server fix this stack meets: a password change in an
    # organisation with no notification policy no longer panics the
    # notification handler and wedges its projection (03170a6a); the stack
    # sends Zitadel's password-change mail (0135 T6). Not in what runs here:
    # the Redis cache connector's index keys (d23ae5c7; no ZITADEL_CACHES is
    # set), login v2's session cookie and node-forge (apps/login), and a
    # build retry. No setup step: cmd/, internal/setup, internal/command,
    # internal/query, internal/repository, internal/eventstore, internal/api
    # (login v1 and the console's server) and console/ are unchanged, still
    # toolchain go1.26.10, so the schema stays at v4.19.4's step 80 and the
    # way back is the v4.20.1 tag. cmd/defaults.yaml is unchanged, so the
    # service ping's default, the lockout and the privacy policy's fields
    # hold at v4.20.2.
    #
    # v4.20.3, from the pin watch (issue #1887): twelve commits after
    # v4.20.2 on upstream's v4.x branch. The tag is lightweight and carries
    # no date; its tip commit (a8b256c9) was committed 2026-11-13 at 11:55
    # UTC. Eight of the twelve are fixes cherry-picked in one batch, with no
    # pull request named, and read as security fixes; upstream's release
    # notes and advisories could not be read where this was built, so no
    # severity and no CVE or GHSA id is named here. Two are on paths people
    # here take. Login v1 issues an authorization code only once the login
    # is complete and binds it to the user who completed it, and the token
    # endpoint refuses a code whose request is not done or names another
    # user (b977f693). A code issued before the upgrade has no binding and
    # is refused once, so a person in the middle of signing in when the
    # image moves signs in again. And a public host header
    # (x-zitadel-public-host, cmd/defaults.yaml's PublicHostHeaders) that is
    # not a plain host, or has more than one value, is answered 400 before
    # a password-reset, invite or verification link is built from it, and
    # an origin stored with a notification is validated the same way
    # (8ce0ac59). Nothing in this repository sends that header or sets
    # ZITADEL_PUBLICHOSTHEADERS, as at v4.19.5 above; what the proxy in
    # front of a fronted stack adds is not in this repository. Two more are
    # in the session API, which only the smoke calls here. A password check
    # applies the login policy of the user's organisation (b95ebee0):
    # setup-zitadel.sh keeps the instance policy at allowUsernamePassword
    # and removes an organisation's own, and the smoke fails on one.
    # Finishing an OIDC or SAML request always needs session.link
    # (de240980): the smoke grants its provisioning user IAM_LOGIN_CLIENT,
    # the one role that carries it, and never named a login client, so it
    # met that check before too. The other four of the eight are login
    # v2's (apps/login, and its texts in internal/query/v2-default.json),
    # which does not run here. go.mod moves go-chi from v5.2.5 to v5.5.0 and
    # nothing else: golang.org/x/net stays v0.61.0, so the image scan's one
    # high with a fix (CVE-2026-78661) stays. No setup step is expected:
    # cmd/, internal/setup, internal/repository, internal/eventstore,
    # internal/api/ui (login v1's pages and the console's server),
    # internal/api/grpc/admin and console/ are unchanged, still toolchain
    # go1.26.10, and login v1's request gains a field in the JSON it is
    # stored as, not a column. That is read from the diff, not run.
    # cmd/defaults.yaml is v4.20.2's byte for byte, so the three facts
    # above, the service ping's default, the lockout and the privacy
    # policy's fields hold at v4.20.3.
    # The owner took it into alpha.8 on 2026-11-14, and dumped the OTA
    # instance's `zitadel` database first, on v4.20.2, with
    # deploy/compose/dump-idp.sh (04:07 UTC, 701 entries read back). It
    # merged after E2E (managed) on its branch, which applied it to the
    # OTA instance, and after the owner's hand check there, which that gate
    # cannot make, because its smoke signs in through a client pinned to
    # login v2: one sign-in in a browser (login v1), and one forgot-password
    # mail, read in the mail catcher and its link opened.
    #
    # v4.20.4, from the pin watch (issue #1934): six commits after v4.20.3
    # on upstream's v4.x branch, each a cherry-pick that names its pull
    # request. The tag is lightweight; its tip commit (384bb9ec) was
    # committed 2026-11-17 at 13:38 UTC. Upstream's release notes and
    # advisories could not be read where this was built, and none of the six
    # reads as a security fix in what this stack runs, so no exception to
    # the three-day floor is claimed. The floor ends 2026-11-20 at 13:38 UTC
    # at the earliest; it is taken inside it, on the owner's word of
    # 2026-11-19, "I waive waiting time / nights if needed." Three
    # change what runs here, in two ways. Zitadel's Google, GitHub, GitLab
    # and Azure AD providers now always send a PKCE challenge on top of
    # their client secret, so a code the provider issues is redeemed only
    # by the sign-in that asked for it (9c1c1413); Apple's is unchanged, and
    # a sign-in started before the upgrade completes as before.
    # setup-zitadel.sh adds Google, Microsoft (as Azure AD) and GitHub only
    # when a provider's client pair is set: live sets none, and the gate
    # writes a placeholder Google pair where none is set. And where it reads
    # an account's password state, in a password check through login v1 or
    # the session API and in a password change or reset, it loads only the
    # checks since the account's failed count was last reset, where it
    # loaded every check the account ever made (e1386736, 59fecbb8);
    # upstream's message keeps the failed count, the lockout and the tarpit
    # as they were. One is in what is not configured here: login v1 builds
    # a GitHub Enterprise Server provider from its own template (e627c7cd).
    # The last two are login v2's (apps/login, and one text in
    # internal/query/v2-default.json), which does not run here. go.mod and
    # go.sum are v4.20.3's byte for byte, and v4.20.3 and v4.20.4 are both
    # built with go1.26.10, so the image scan reads them alike: two highs
    # with a fix, x/net's CVE-2026-78661 and the standard library's
    # CVE-2026-97054 (Security Scan runs 44636169423 and 44637576014,
    # 2026-11-19). No
    # setup step is expected: cmd/ (with cmd/setup), internal/migration,
    # internal/repository, internal/query/projection, internal/static,
    # proto/ and console/ are unchanged, and the event store changes how it
    # queries, not what it stores. That is read from the diff, not run.
    # cmd/defaults.yaml is v4.20.3's byte for byte, so the three facts
    # above, the service ping's default, the lockout and the privacy
    # policy's fields hold at v4.20.4. v4.20.5 (2026-11-18) is left on
    # purpose: one commit, in apps/login alone, which makes login v2 ask
    # for the second factor a person already has before it adds an
    # authenticator.
    # The owner said yes to v4.20.4 on 2026-11-18, and dumped the OTA
    # instance's `zitadel` database first, on v4.20.3, with
    # deploy/compose/dump-idp.sh (21:24 UTC, 701 entries read back). It
    # merged on 2026-11-20 (#1938) after E2E (managed) on its branch, which
    # applied it to the OTA instance, and after the owner's hand check
    # there, as for v4.20.3: one sign-in in a browser (login v1), and one
    # forgot-password mail, read in the mail catcher and its link opened.
    #
    # v4.20.5, from the pin watch (issue #1934): the one commit after v4.20.4,
    # in apps/login alone, as read when v4.20.4 moved (above). login v2 does
    # not run here, so cmd/defaults.yaml, the setup steps and everything this
    # stack runs are v4.20.4's. Its images, read through ghcr.io's registry on
    # 2026-11-24 without being run, agree: per platform, the two base layers
    # are v4.20.4's byte for byte, and the layer that holds the binary differs
    # by 1 byte (linux/amd64) and 24 bytes (linux/arm64) compressed, what a new
    # version string alone makes. Past its three-day floor (2026-11-18). The
    # owner said yes on 2026-11-24, "Zitadel v4.20.5: ok, after 18 deploy",
    # so it takes the route issue #1934 gives after alpha.18's deploy to
    # live: the OTA instance's `zitadel` database dumped by hand first, E2E
    # (managed) on its branch, and the owner's hand check there, as for
    # v4.20.4.
    image: ghcr.io/zitadel/zitadel:v4.20.5
    container_name: ${COMPOSE_PROJECT_NAME}-idp
    restart: unless-stopped
    logging: *logging
    # HOW IT RUNS (see the header): its image's non-root user, so no capability.
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: []
    # `start-from-init` is init-then-start in one command and is idempotent: on
    # a database it has already initialised it skips straight to serving. Two
    # commands would mean a first bring-up that differs from every later one,
    # which is the kind of asymmetry an operator only discovers on a restart.
    command: >
      start-from-init
      --masterkey "${ZITADEL_MASTERKEY:?run ./deploy/compose/ensure-env-secrets.sh first}"
      --tlsMode ${ZITADEL_TLS_MODE:-disabled}
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: ${ZITADEL_DB_NAME:-zitadel}
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: ${ZITADEL_DB_USER:-zitadel}
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${ZITADEL_DB_PASSWORD:?run ./deploy/compose/ensure-env-secrets.sh first}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: ${POSTGRES_USER:-openmigrate}
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${POSTGRES_PASSWORD:-openmigrate_password}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      # THE ONE ORIGIN, AND IT MUST BE ONE THE API CAN PRESENT TOO.
      #
      # THIS WAS `localhost`, AND THAT COULD NEVER WORK. It made JWT_ISSUER
      # http://localhost:3126 — an address the HOST reaches through the published
      # port and the API container cannot, because inside that container
      # `localhost` is the API. Every authenticated request answered HTTP 500
      # `auth_failed`, because discovery threw ECONNREFUSED before any token was
      # even looked at, and the stack reported itself healthy throughout.
      #
      # There is no internal shortcut. Zitadel resolves the instance by the
      # ORIGIN of the request and refuses every other one:
      #
      #   GET http://zitadel:8080/.well-known/openid-configuration
      #     404  unable to set instance using origin &{zitadel:8080 http}
      #          (ExternalDomain is localhost): Instance not found.
      #
      # Measured on the running stack, by service name and by container name. An
      # instance TRUSTED domain does not change it (added one, still 404), and
      # AddInstanceDomain is on the System API, which a provisioning token cannot
      # reach — so this is a value that has to be RIGHT AT FIRST INIT, not
      # corrected afterwards.
      #
      # `ownpace-idp` is registered as a network alias below (the container's
      # own name is `<project>-idp` since workplan 0132 T1), so it resolves to
      # this container from anywhere on the stack's own network. A BROWSER on the host needs one line in /etc/hosts:
      #
      #   127.0.0.1  ownpace-idp
      #
      # — see docs/managed-bring-up.md. A real deployment sets this to the real
      # hostname and DNS answers for both sides, which is the case this shape is
      # actually built for; `localhost` was only ever the convenient-looking one.
      #
      # It is baked into every token's `iss`, so changing it later invalidates
      # tokens and breaks the API's issuer check — which is the fourth variable
      # carrying a browser-visible address, and belongs with the three workplan
      # 0091 T1 is about.
      ZITADEL_EXTERNALDOMAIN: ${ZITADEL_EXTERNALDOMAIN:-ownpace-idp}
      # Defaults to the published port rather than repeating its number, because
      # on a plain bring-up the browser reaches the provider AT the published
      # port — the two are the same address seen from two sides. They separate
      # only when something fronts it (netbird terminating TLS on 443), and then
      # the operator sets this one explicitly. Written as a fallback so that
      # moving ZITADEL_PORT moves the issuer with it; a hand-copied second number
      # is how a stack ends up serving one port and stamping another into `iss`.
      ZITADEL_EXTERNALPORT: ${ZITADEL_EXTERNALPORT:-${ZITADEL_PORT:-3126}}
      ZITADEL_EXTERNALSECURE: ${ZITADEL_EXTERNALSECURE:-false}
      # ZITADEL'S OWN LISTEN PORT, DELIBERATELY THE SAME NUMBER IT IS PUBLISHED
      # ON. The origin check above is host AND port, so `ownpace-idp:3126` has to
      # reach Zitadel from inside the network as well as from the host. With the
      # image's default listen port of 8080 and a 3126:8080 mapping, it reaches
      # nothing inside — one address, two meanings, which is the whole bug this
      # is fixing. One number, both sides, no second place to get it wrong.
      ZITADEL_PORT: ${ZITADEL_PORT:-3126}
      # WHICH LOGIN UI A FRESH INSTANCE REQUIRES, decided here rather than
      # inherited. `cmd/defaults.yaml` at v4.17.1 ships
      # `DefaultInstance.Features.LoginV2.Required: true`, and login v2 is a
      # SEPARATE application — `ghcr.io/zitadel/zitadel-login`, routed at
      # /ui/v2/login — which this stack does not deploy. An instance left on
      # that default therefore redirects every human sign-in to a path where
      # nothing listens, and the browser renders the gateway's JSON
      # `code: 5, "Not Found"` in place of a login form (#566).
      #
      # DEFAULTINSTANCE IS READ ONCE, AT FIRST INIT. This fixes a stack that
      # does not exist yet and does nothing for one that does, which is why
      # setup-zitadel.sh ALSO sets it through the API and reads it back. Two
      # mechanisms because there are two populations, not belt and braces.
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "false"
      # NOBODY FOUNDS AN ORGANISATION OF THEIR OWN HERE (workplan 0135 T1).
      # Upstream leaves this empty, so `/ui/login/register/org` lets anybody who
      # can load the sign-in page found one, and its owner can make an account
      # whose address the provider calls verified. Read once, at first init,
      # like the line above: a fresh instance, live's first among them, never
      # serves the form. setup-zitadel.sh sets it on an existing instance and
      # reads it back on both.
      ZITADEL_DEFAULTINSTANCE_RESTRICTIONS_DISALLOWPUBLICORGREGISTRATION: "true"
      # THE NOTICE ON THE REGISTRATION PAGE (workplan 0135 T5, for 0139 T4).
      # Upstream ships the instance privacy policy with no terms and no privacy
      # link, so the page that takes a tester's name, address and password
      # would link neither. Read once, at first init, like the two lines above:
      # a fresh instance links the Dutch pages from its first start, on the
      # site VITE_LEGAL_SITE_URL names (empty is the production site, as for
      # the web build), and a bring-up that stops before setup-zitadel.sh's
      # step still leaves them there. setup-zitadel.sh sets them on an existing
      # instance, reads them back on both, and writes the address without the
      # second slash a value ending in one would leave here. Why Dutch, and
      # where the file names come from, is said beside that step.
      ZITADEL_DEFAULTINSTANCE_PRIVACYPOLICY_TOSLINK: ${VITE_LEGAL_SITE_URL:-https://www.ownpace.eu}/nl/voorwaarden.html
      ZITADEL_DEFAULTINSTANCE_PRIVACYPOLICY_PRIVACYLINK: ${VITE_LEGAL_SITE_URL:-https://www.ownpace.eu}/nl/privacy.html
      # A LOCK AFTER TEN WRONG PASSWORDS, AND A SECOND FACTOR OFFERED, NOT FORCED
      # (workplan 0135 T4; the owner, 2026-10-17). Upstream's lockout policy
      # locks nobody (MaxPasswordAttempts 0 in `cmd/defaults.yaml` at v4.19.4).
      # Read once, at first init, like the lines above: a fresh instance locks
      # an account after the owner's ten from its first start. ForceMFA is
      # upstream's false already and is written out so a new default cannot
      # change it unseen; ForceMFALocalOnly is not a key `cmd/defaults.yaml`
      # names, so a fresh instance has its zero, false. `instance.go` gives it
      # TOTP and U2F as second factors. setup-zitadel.sh writes all of it on an
      # existing instance, from its one SIGN_IN_LOCKOUT_PASSWORDS, and reads it
      # back on both; a-second-factor-for-the-keys holds the two numbers equal.
      ZITADEL_DEFAULTINSTANCE_LOCKOUTPOLICY_MAXPASSWORDATTEMPTS: "10"
      ZITADEL_DEFAULTINSTANCE_LOGINPOLICY_FORCEMFA: "false"
      # NO DAILY REPORT TO ZITADEL (workplan 0139, 2026-09-28). `cmd/defaults.yaml`
      # at v4.19.2 ships `ServicePing.Enabled: true`: once a day, to
      # https://zitadel.com/api/ping, the version, the id, creation date and
      # domains of every instance, and the count of its users, organisations
      # and projects. It says so itself: "It's enabled by default". Every v4
      # release carries it, so the OTA stack's provider has sent it since it
      # first ran. Unlike DefaultInstance above, this is read at every start,
      # so recreating the container is all it takes. `Telemetry.Enabled` (the
      # milestone push) ships false and is written out beside it, so a new
      # default cannot turn it on unseen. Re-read both at every new pin:
      # `scripts/a-service-that-phones-home.unit.test.ts` fails until you have.
      ZITADEL_SERVICEPING_ENABLED: "false"
      ZITADEL_TELEMETRY_ENABLED: "false"
      # THE FIRST ORGANISATION'S NAME (workplan 0135 open question 8). Upstream's
      # is ZITADEL, which the console and the sign-in page show, and from which
      # the organisation's domain, and so the first human's login name, is
      # made. Live's is Ownpace from its first start: stand-up-live.sh writes
      # ZITADEL_ORG_NAME=Ownpace into live's .env before the provider first
      # starts (the owner, 2026-10-17). Empty keeps upstream's name, as every
      # other stack has today. Read once, at first init; setup-zitadel.sh
      # renames an organisation that already stands.
      ZITADEL_FIRSTINSTANCE_ORG_NAME: ${ZITADEL_ORG_NAME:-ZITADEL}
      # The first human, so a fresh stack has somebody who can sign in.
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ${ZITADEL_ADMIN_USERNAME:-owner}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD:?run ./deploy/compose/ensure-env-secrets.sh first}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "true"
      # And a machine account whose token is written to a file on first init.
      # This is what lets setup-zitadel.sh provision the project and the client
      # without anybody clicking through a console — see that script's header
      # for why the token is deliberately short-lived.
      #
      # Its expiry is required, with no date of its own here: a fixed fallback
      # (2026-12-31 until 2026-10-21) is a first start the provider refuses
      # once the date has passed (Errors.AuthNKey.ExpireBeforeNow), and it
      # restarts for ever. ensure-env-secrets.sh, every bring-up and
      # setup-zitadel.sh write it before the provider first starts
      # (seed_pat_expiry, env-read.sh), and keep a date still ahead.
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: ownpace-setup
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Ownpace setup
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: ${ZITADEL_PAT_EXPIRY:?run ./deploy/compose/ensure-env-secrets.sh first}
      ZITADEL_FIRSTINSTANCE_PATPATH: /machinekey/pat.txt
    volumes:
      # The provisioning token lands here for setup-zitadel.sh to read. A named
      # volume rather than a bind mount so the token never sits in the working
      # tree, where a `git add -A` could find it (hard rule 3).
      - zitadel_machinekey:/machinekey
    ports:
      # NOT 8080. That is the most contended port on any machine, and the E2E
      # (managed) gate proved it: the provider's very first bring-up on the
      # self-hosted runner died with "Bind for 0.0.0.0:8080 failed: port is
      # already allocated" before it ever started. 3126 continues this stack's
      # own block — web 3123, status 3124, www 3125 — which is unclaimed by
      # convention and by anything else in this repo.
      # Same number both sides — see ZITADEL_PORT above.
      #
      # A ROUTED PORT: a public name (`id.…`) leads here through the front, and
      # so does the API, which reaches its issuer by that name. Loopback stays
      # for `wait_for_idp_ready`; ZITADEL_BIND is set to the front's address in
      # this stack's `.env`, or the name stops answering. See the header.
      - "127.0.0.1:${ZITADEL_PORT:-3126}:${ZITADEL_PORT:-3126}"
      - "${ZITADEL_BIND:-127.0.0.1}:${ZITADEL_PORT:-3126}:${ZITADEL_PORT:-3126}"
    depends_on:
      postgres:
        condition: service_healthy
      # NOT a `condition:` — this one is run explicitly by the bring-up, before
      # the `up` that starts this service. See zitadel-machinekey below for why
      # it cannot simply be an init container compose starts for us.
    # NO HEALTHCHECK, AND THAT IS THE FIX RATHER THAN A GAP.
    #
    # This carried `test: ["CMD", "/app/zitadel", "ready", "--config",
    # "/dev/null"]`, and E2E (managed) #47 showed it cannot work. Zitadel came up
    # perfectly — every migration applied, OIDC routes registered, `server is
    # listening address=[::]:8080` — and compose called it unhealthy for
    # thirty-one minutes:
    #
    #   docker inspect  →  "Output":"Error: not ready", FailingStreak: 188
    #   curl http://localhost:3126/debug/ready  (from the host)  →  200
    #
    # `zitadel ready` builds its URL from ExternalPort, which is BY DEFINITION
    # the address the outside reaches Zitadel on. Inside the container nothing
    # listens there — here 3126 is a published port, and on a fronted deployment
    # it is 443, terminated by something that is not Zitadel. The probe asks an
    # address that cannot answer, and v4.17.1 reports unreachable as `Error: not
    # ready`, which from inside is indistinguishable from a considered no.
    #
    # No command in this image can ask the question correctly: it is built with
    # no shell and no HTTP client but that one, so there is nothing to substitute.
    # The readiness check therefore moved to `wait_for_idp_ready` in
    # bootstrap-managed.sh, which asks the PUBLISHED port from the host — the
    # side that can reach it — and says which of "nothing answered" and "answered
    # and said no" happened. The check did not get weaker; it got asked by
    # somebody in a position to hear the answer.
    networks:
      ownpace-network:
        # THE ALIAS IS DERIVED, NOT ASSUMED — see zitadel-network-alias.sh,
        # which writes ZITADEL_NETWORK_ALIAS before anything here starts.
        #
        # It used to be `${ZITADEL_EXTERNALDOMAIN:-ownpace-idp}` outright, so
        # that whatever origin Zitadel was told to answer for resolved to this
        # container from everywhere on this network. That is exactly right when
        # the provider IS the address, and it is what let the API present the
        # very origin the instance was initialised with (#1f6a699).
        #
        # It is exactly wrong when something fronts the provider. Then the
        # browser reaches `https://name` on 443, a reverse proxy terminates TLS
        # and forwards to this container's own port — and the API, which has to
        # present the same origin because `iss` matches byte for byte, follows
        # the alias to this container instead of to the front, and connects to a
        # port nothing here listens on:
        #
        #     [ready] the issuer's key source at
        #     https://id.ota.ownpace.eu/.well-known/openid-configuration
        #     is unreachable: connect ECONNREFUSED 172.23.0.21:443
        #
        # Same 500 as the bug the alias was added to fix, opposite cause. The
        # alias now names this container unless the external origin is one this
        # container actually serves.
        aliases:
          - ${ZITADEL_NETWORK_ALIAS:-ownpace-idp}
      # ON THE PROBE NETWORK THE PUBLIC NAME ALWAYS MEANS THIS CONTAINER. Only
      # the status page is on it (see `status-probe` at the bottom of this
      # file), so the derivation above stays exactly as it is for the API, and
      # the page's `Identity provider` row — which probes the provider by that
      # name, on this container's own port — reaches it whether or not something
      # fronts the provider publicly. Fronted, the app-network alias is
      # `ownpace-idp` and this one is the domain; direct, both are the domain
      # and the second is redundant, which is fine.
      status-probe:
        aliases:
          - ${ZITADEL_EXTERNALDOMAIN:-ownpace-idp}

  # MAKES THE PROVISIONING TOKEN'S DIRECTORY WRITABLE BY THE IDENTITY PROVIDER.
  #
  # E2E (managed) #44 is why this exists, and it had never worked once:
  #
  #   migration failed  name=03_default_instance
  #     error="open /machinekey/pat.txt: permission denied"
  #   setup failed, skipping cleanup
  #
  # Docker creates a NEW named volume's mount point owned by root, and the
  # Zitadel image runs as a non-root user — which that error proves, since root
  # could have written anywhere. `03_default_instance` creates the first human
  # BEFORE the machine account, so while the admin password was being rejected
  # (#509) this failure was never reached; fixing the password is what exposed
  # it. Two bugs in a queue, the second invisible until the first was gone.
  #
  # The path cannot simply move somewhere already writable: setup-zitadel.sh
  # reads exactly this file to provision the project and client without anybody
  # clicking through a console, and the volume is what keeps the token out of
  # the working tree where a `git add -A` could find it (hard rule 3).
  #
  # `profiles` keeps it out of `up`, and the BRING-UP runs it with
  # `compose run --rm` rather than compose starting it as a dependency. That is
  # deliberate: `up -d --wait` and a container that exits 0 have a fraught
  # history across compose versions, and the one thing this stack cannot afford
  # is a new way for the identity provider's bring-up to hang or misreport.
  # `run` returns the one-shot's exit code and nothing else.
  #
  # ZITADEL_UID is READ OFF THE IMAGE by the bring-up (`docker image inspect`),
  # not guessed here, and v4.6.2 is why: it reported `zitadel`, a NAME, so a
  # hardcoded 1000 would have chowned this directory to whoever else holds that
  # uid. The bring-up reads `Config.User`, and where that is a name it reads the
  # number out of the image's own /etc/passwd — the file Docker itself resolves
  # the name against. The default here is only for a hand-run `compose run` with
  # nothing exported.
  zitadel-machinekey:
    image: busybox:1.38
    profiles: ["init"]
    logging: *logging
    # HOW IT RUNS (see the header): root, for a chown (CHOWN) and then a chmod of
    # a directory it no longer owns (FOWNER). DAC_OVERRIDE for the two other
    # commands this service runs, in setup-zitadel.sh on every bring-up and in
    # the runbooks: `cat /machinekey/pat.txt`, and the rotation's write of
    # pat.txt.next and its `mv`, both in a directory that is the identity
    # provider's at mode 700, which root without it can neither search nor
    # write (`cat: can't open '/machinekey/pat.txt': Permission denied`).
    # Read-only: it writes the volume alone.
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    read_only: true
    command:
      - sh
      - -c
      - |
        set -e
        mkdir -p /machinekey
        chown "${ZITADEL_UID:-1000}" /machinekey
        chmod 700 /machinekey
        echo "machinekey volume is now owned by ${ZITADEL_UID:-1000}, mode 700"
    volumes:
      - zitadel_machinekey:/machinekey
    networks:
      - ownpace-network

  # Ownpace API
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      args:
        # GET /version reports this commit (build-identity.ts). CI passes it
        # (images.yml); a hand-built stack must pass it too or the endpoint
        # answers commit "unknown" — build with:
        #   GIT_SHA=$(git rev-parse HEAD) docker compose -f managed.yml build api web
        # by name: a bare `build` builds the databases' image too.
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: ${COMPOSE_PROJECT_NAME}-api
    restart: unless-stopped
    logging: *logging
    # HOW IT RUNS (see the header): uid 65532 from its first process, so no capability.
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: []
    environment:
      # NO DEFAULT, on purpose (workplan 0132 T4; the owner, 2026-10-04). The
      # default was `development`, and it won over the image's own
      # `ENV NODE_ENV=production`: a .env that did not say its mode ran a
      # development API, which lets a placeholder JWT_SECRET through, and
      # nothing said so. Every stack names its mode in its .env: production on
      # live (stand-up-live.sh and deploy-live.sh refuse anything else),
      # development on the OTA stack (its self-signed test mail needs it; the
      # nightly gate writes it when the key is absent). The message contains
      # no closing brace or dollar sign, which would end or expand it early.
      NODE_ENV: ${NODE_ENV:?set NODE_ENV in .env - production on live, development on a test stack (workplan 0132 T4)}
      PORT: 3001
      # DATABASE_URL = DB owner: the fallback for the migrations and the audit
      # key's pool when DIRECT_DATABASE_URL is unset. No route opens a pool on
      # it or reads tenant data as the owner (0138 T6;
      # scripts/a-route-that-opened-the-owners-pool.unit.test.ts). The one
      # owner connection a request uses is that key pool, for the audit
      # pseudonym key, which holds no tenant's rows (docs/rls-guide.md §2).
      # APP_DATABASE_URL = non-owner `app_user` role the request path connects
      # through, so RLS is enforced there (a superuser/owner bypasses RLS even
      # under FORCE — see workplan 0011 T1; docs/rls-guide.md, "Where row
      # security holds today").
      # DB_HOST/DB_PORT default to the pooler. Setting them to postgres:5432 in
      # .env puts the whole stack back on direct connections — the rollback the
      # pgbouncer service documents.
      DATABASE_URL: postgresql://${POSTGRES_USER:-openmigrate}:${POSTGRES_PASSWORD:-openmigrate_password}@${DB_HOST:-pgbouncer}:${DB_PORT:-6432}/${POSTGRES_DB:-openmigrate}
      APP_DATABASE_URL: postgresql://${APP_DB_USER:-app_user}:${APP_DB_PASSWORD:-app_password}@${DB_HOST:-pgbouncer}:${DB_PORT:-6432}/${POSTGRES_DB:-openmigrate}
      # ALWAYS direct, never the pooler. `migrate.ts` holds a SESSION-scoped
      # pg_advisory_lock across every migration's own transaction; through a
      # transaction-mode pooler the lock would be taken on one server connection
      # and the migrations applied on others, so two replicas booting at once
      # would stop excluding each other — silently, and only under load.
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER:-openmigrate}:${POSTGRES_PASSWORD:-openmigrate_password}@postgres:5432/${POSTGRES_DB:-openmigrate}
      # THE JOB RUNNER'S SWITCH AND ITS DATABASE (ADR-0054, workplan 0167 T7),
      # the same two values the worker service below gets. The api enqueues
      # every job on the jobs' queues as ownpace_jobs, the role that owns
      # pg-boss's schema and nothing else. Empty password rather than `:?` for
      # the reason the worker's says: the bring-up generates the key before its
      # first Compose call. `pg-boss`, the only value the api starts with since
      # alpha.18 (see the header); `trigger` stops its start in one sentence.
      OWNPACE_JOB_RUNNER: ${OWNPACE_JOB_RUNNER:-pg-boss}
      JOBS_DATABASE_URL: postgresql://ownpace_jobs:${JOBS_DB_PASSWORD:-}@${DB_HOST:-pgbouncer}:${DB_PORT:-6432}/${POSTGRES_DB:-openmigrate}
      # Fail-closed (0020 T2): with the tenant-membership gate, JWT_SECRET is
      # the outer wall of the tenancy boundary. No default — and the API also
      # refuses to BOOT in production with a known placeholder value.
      JWT_SECRET: ${JWT_SECRET:?generate with openssl rand -hex 32 and set in .env}
      # Required to encrypt/decrypt connection credentials (create-mapping, worker deps).
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?set a 32-byte key in .env}
      # The OIDC issuer (ADR-0042). SET IT AND THE SYMMETRIC JWT_SECRET STOPS
      # BEING USED — `selectAuthMode` prefers JWKS precisely so a lingering
      # secret cannot silently downgrade verification. Empty until
      # setup-zitadel.sh has run, because the issuer URL is not knowable before
      # the provider exists.
      #
      # Changing provider is changing these two values. Nothing else.
      #
      # Never the first without the second: with JWT_ISSUER set and
      # JWT_AUDIENCE empty the API refuses to start, on every NODE_ENV, since
      # it would accept a token the issuer minted for any project (workplan
      # 0132, 2026-10-04). setup-zitadel.sh writes both in one go; the
      # audience is the sign-in project's id. Both stay optional here, because
      # a fresh stack has neither until setup-zitadel.sh has run.
      JWT_ISSUER: ${JWT_ISSUER:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      # The identity provider's own upstream callback, for the Redirect URIs
      # page. setup-zitadel.sh writes it; the API only ever shows it.
      IDP_UPSTREAM_CALLBACK_URL: ${IDP_UPSTREAM_CALLBACK_URL:-}
      # Only for a provider that publishes no discovery document. Setting it
      # pins a URL that key rotation can move underneath you — see
      # `getJWKS` in apps/api/src/middleware/auth.ts.
      JWT_JWKS_URI: ${JWT_JWKS_URI:-}
      MOLLIE_API_KEY: ${MOLLIE_API_KEY:-}
      # The deployment's own identity for QUALIFIED VIES checks (workplan
      # 0111 T2) — the ones that come back with a consultation number, which
      # is the seller's actual defence for reverse charging. Both or neither:
      # half a pair makes the check route refuse by name rather than silently
      # downgrade every check to an unqualified one. Unset until the
      # operating entity (an accountant conversation) has a number to put
      # here; unqualified checks still work and say what they are.
      VIES_REQUESTER_MEMBER_STATE: ${VIES_REQUESTER_MEMBER_STATE:-}
      VIES_REQUESTER_VAT_NUMBER: ${VIES_REQUESTER_VAT_NUMBER:-}
      # The VAT-treatment decision's two switches (workplan 0111 T3). The
      # seller's member state defaults to NL until the operating-entity
      # question is settled; the OSS flag stays false until the owner's
      # €10k-threshold decision flips — flipping it changes what EU consumers
      # outside the seller country are told their invoices will carry.
      OWNPACE_SELLER_COUNTRY: ${OWNPACE_SELLER_COUNTRY:-NL}
      VAT_OSS_ACTIVE: ${VAT_OSS_ACTIVE:-false}
      # The books (workplan 0111): the Moneybird administration invoices are
      # numbered in, and what it holds that an invoice needs. All five of the
      # first group together, or none: none is Moneybird off, and half a set
      # is refused by key name, never guessed (moneybird-config.ts). Optional
      # here, never `:?`, so a stack without books starts. Ids are Moneybird's
      # long numbers, kept as text. The outside-EU rate may stay empty (a
      # buyer outside the EU is then refused by name), and the delivery is
      # `manual` unless it says `email`, which it says only on live. The
      # Mollie account is the financial account a payment through Mollie is
      # booked on (slice 5f); empty, nothing is booked and the push says so.
      # `./deploy/compose/operator.sh moneybird check` reads the
      # administration and says what each of these resolves to.
      MONEYBIRD_API_TOKEN: ${MONEYBIRD_API_TOKEN:-}
      MONEYBIRD_ADMINISTRATION_ID: ${MONEYBIRD_ADMINISTRATION_ID:-}
      MONEYBIRD_WORKFLOW_ID: ${MONEYBIRD_WORKFLOW_ID:-}
      MONEYBIRD_TAX_RATE_ID_DOMESTIC: ${MONEYBIRD_TAX_RATE_ID_DOMESTIC:-}
      MONEYBIRD_TAX_RATE_ID_REVERSE_CHARGE: ${MONEYBIRD_TAX_RATE_ID_REVERSE_CHARGE:-}
      MONEYBIRD_TAX_RATE_ID_OUTSIDE_EU: ${MONEYBIRD_TAX_RATE_ID_OUTSIDE_EU:-}
      MONEYBIRD_DELIVERY: ${MONEYBIRD_DELIVERY:-}
      MONEYBIRD_FINANCIAL_ACCOUNT_ID_MOLLIE: ${MONEYBIRD_FINANCIAL_ACCOUNT_ID_MOLLIE:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3123}
      WEB_URL: ${WEB_URL:-http://localhost:3123}
      # Which scope class this deployment's own Google application carries
      # (ADR-0041). Empty means `sensitive`, which is what the appliance and
      # every deployment that has not answered gets. managed.env.example
      # carries the full note, including what it costs in Testing status.
      GOOGLE_ACCOUNT_SCOPE_CLASS: ${GOOGLE_ACCOUNT_SCOPE_CLASS:-}
      # Whether this deployment holds `Files.Read.All` (owner decision
      # 2026-08-04: declined for the reference deployment). The permission
      # report reads it; empty keeps the drive section a stated blind spot.
      # managed.env.example carries the full note.
      GRAPH_FILES_READ_CONSENTED: ${GRAPH_FILES_READ_CONSENTED:-}
      # The deployment's OWN Google OAuth client (ADR-0041, owner decision
      # 2026-09-01 — option B): configured once here, so nobody types a client
      # secret into a wizard and rotating it is one edit rather than one per
      # connection. A connection that carries its own pair still wins.
      #
      # The WORKER needs them too, and its service below names them as this
      # one does (until alpha.18 set-task-env.sh uploaded them to Trigger.dev's
      # tasks, which inherited nothing from compose).
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      # The deployment's own Dropbox app (2026-09-02), the same rule and the
      # same second place: the worker's service names them too.
      DROPBOX_OAUTH_CLIENT_ID: ${DROPBOX_OAUTH_CLIENT_ID:-}
      DROPBOX_OAUTH_CLIENT_SECRET: ${DROPBOX_OAUTH_CLIENT_SECRET:-}
      # The deployment's own Entra registration (workplan 0114), same rule and
      # same second place. MICROSOFT_OAUTH_TENANT travels with the pair — the
      # authorize and token halves must use one authority, and `common` is the
      # default because a shared deployment serves other organisations.
      MICROSOFT_OAUTH_CLIENT_ID: ${MICROSOFT_OAUTH_CLIENT_ID:-}
      MICROSOFT_OAUTH_CLIENT_SECRET: ${MICROSOFT_OAUTH_CLIENT_SECRET:-}
      MICROSOFT_OAUTH_TENANT: ${MICROSOFT_OAUTH_TENANT:-}
      # The deployment's own Cirrux client (workplan 0160 T5; ADR-0052): a
      # public client with no secret, registered by Cirrux by hand with this
      # deployment's exact callback. Unset, a Cirrux account's Drive is a
      # measured no and no screen offers Connect Cirrux Drive. The worker
      # refreshes the Drive sign-in on every pass, so its service names it too.
      CIRRUX_OAUTH_CLIENT_ID: ${CIRRUX_OAUTH_CLIENT_ID:-}
      API_URL: ${API_URL:-http://localhost:3001}
      # Where the API reads the status page's own endpoint list, for the
      # operator's support screen (0110 T5): the gatus container on this
      # stack's network. The screen shows what the public page shows and no
      # more. No `depends_on` on gatus for the same reason gatus has none on
      # us — a page that does not answer is one of the screen's answers.
      STATUS_URL: ${STATUS_URL:-http://gatus:8080}
      # How long a backup of this database is kept. Not a schedule — it is what
      # the close endpoint TELLS a customer about when their erasure actually
      # completes (0085 T5). Unset means the 7-day default in @openmig/shared,
      # and that default assumes backups exist: nothing in this repository
      # backs this database up yet. `ownpace-live` takes no backups during the
      # alpha and sets 7: one copy of its databases is made right before each
      # update by deploy-live.sh, and deleted once the update is proven, or
      # after 6 days by the daily duties (copy-before-update.sh; workplan 0134
      # open question 1 (b), workplan 0139). The api warns about a
      # blank value in production, and with OWNPACE_STAGE=alpha refuses to
      # start (`config-guards.ts`).
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-}
      # How many migrations one organisation may have that are not finished
      # (workplan 0143 T2a). Unset means the default in the api's
      # `migration-cap.ts`, six since 2026-10-14 (was five); a value that is not a whole
      # number of at least 1 stops the api from starting, naming it.
      MAX_MIGRATIONS_PER_ORGANISATION: ${MAX_MIGRATIONS_PER_ORGANISATION:-}
      # THE MAIL SETTINGS. Absent here until 2026-08-25, which meant this
      # container could not send a single notification no matter what `.env`
      # said: compose passes NOTHING it has not been told to pass, and
      # `readNotifierConfig` reads `process.env` inside the container. Every
      # grant, decline and access request reported `notified: "off"` — honestly,
      # and uselessly, because the setting that would have turned it on could
      # not reach the process that reads it.
      #
      # The self-host edition never had this problem: `deploy/selfhost/compose.yml`
      # uses `env_file: .env`, so the whole file arrives. This one lists keys
      # explicitly — safer, and it fails exactly this way when a key is
      # forgotten. `scripts/the-mail-the-api-could-not-send.unit.test.ts`
      # compares the two lists so the next one cannot be forgotten silently.
      #
      # All optional: an empty SMTP_HOST leaves the channel off, which is the
      # correct default for a stack nobody has configured mail on.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_ALLOW_SELF_SIGNED: ${SMTP_ALLOW_SELF_SIGNED:-}
      NOTIFY_FROM: ${NOTIFY_FROM:-}
      NOTIFY_TO: ${NOTIFY_TO:-}
      NOTIFY_LOCALE: ${NOTIFY_LOCALE:-}
      # Found by the guard below on its first run, not by reading: this one is
      # consulted by the same function and was missed by the same enumeration.
      NOTIFY_DIGEST: ${NOTIFY_DIGEST:-}
      # THE ACCESS-REQUEST LIMIT'S TWO KNOBS, read by apps/api/src/index.ts
      # (Express 'trust proxy') and knock-limit.ts. Empty is today's behaviour:
      # one service-wide bucket of 60 an hour. Workplan 0093 T2c says when to
      # set them. `scripts/a-limit-the-api-was-never-handed.unit.test.ts`.
      # TRUST_PROXY also decides whose address the api's log names: live sets
      # 2, NetBird and the web's nginx (managed.env.example; workplan 0132 T3 (d)).
      TRUST_PROXY: ${TRUST_PROXY:-}
      ACCESS_REQUEST_MAX_PER_HOUR: ${ACCESS_REQUEST_MAX_PER_HOUR:-}
      # The whole API's request limit, per address under the same TRUST_PROXY
      # (apps/api/src/api-rate-limit.ts; workplan 0178 T6). Empty is 1200 a minute.
      API_MAX_REQUESTS_PER_MINUTE: ${API_MAX_REQUESTS_PER_MINUTE:-}
      # PROBLEM REPORTS (workplan 0130), read by apps/api/src/services/zammad.ts
      # and report-channel.ts. Setting URL and TOKEN files each report as a
      # Zammad ticket. Without them, a report goes by mail through the SMTP_*
      # relay above, from NOTIFY_FROM to REPORT_MAIL_TO, or to NOTIFY_TO when
      # that is empty (the owner, for the alpha, 2026-09-28). Neither is no form
      # at all. managed.env.example and managed-bring-up.md step 8f carry the
      # note. `scripts/a-helpdesk-the-api-was-never-handed.unit.test.ts`.
      ZAMMAD_URL: ${ZAMMAD_URL:-}
      ZAMMAD_TOKEN: ${ZAMMAD_TOKEN:-}
      ZAMMAD_GROUP: ${ZAMMAD_GROUP:-}
      REPORT_MAIL_TO: ${REPORT_MAIL_TO:-}
      # THE ALPHA (workplan 0131 T1): `alpha` makes the access-granted mail say
      # so, read by `accessGrantedEvent` in apps/api/src/access-notify.ts, and
      # asks every tester to accept the Alpha conditions, the privacy policy
      # and the terms before any access is stored, once no text is still a
      # draft (0139 T3, apps/api/src/conditions-not-accepted.ts). The web build below takes
      # the same setting as VITE_OWNPACE_STAGE. Empty is off, which is every
      # deployment but the one testers use.
      # `scripts/an-alpha-both-halves-know-about.unit.test.ts`.
      OWNPACE_STAGE: ${OWNPACE_STAGE:-}
      # WHERE THE PRIVACY POLICY IS (workplan 0139 T4): the mail to people items
      # were shared with closes with a link to it, and the API sends that mail.
      # The same .env key the web build takes below as VITE_LEGAL_SITE_URL, so
      # the mail and the app link the same site. Empty is the production site
      # (`packages/shared/src/privacy-policy-link.ts`); a value the link cannot
      # use stops the api's start. `scripts/a-policy-link-that-answers.unit.test.ts`.
      LEGAL_SITE_URL: ${VITE_LEGAL_SITE_URL:-}
      # THE RULE FOR A HOST A TENANT GIVES US (workplan 0136 T1, T2): the API
      # refuses to connect to an address inside this service's own network, but
      # for these exact names. The gate's stack names its demo targets
      # (`nextcloud,stalwart`); live leaves it empty. The worker's service hands
      # it the same list. A list the API cannot read stops its start.
      # `scripts/a-rule-nothing-switched-on.unit.test.ts`.
      OWNPACE_REACHABLE_HOSTS: ${OWNPACE_REACHABLE_HOSTS:-}
    ports:
      # It serves an unauthenticated `/metrics`, and the web app reaches it by
      # name, so API_BIND stays empty on a real box. See the header.
      - "127.0.0.1:${API_PORT:-3001}:3001"
      - "${API_BIND:-127.0.0.1}:${API_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ownpace-network

  # THE JOB WORKER (ADR-0054, workplan 0167 T7): pg-boss on the ledger's
  # Postgres, in place of Trigger.dev, which alpha.18 removed (T9). It has no
  # profile, so a bare `up` starts it, and the bring-up builds it with the api
  # and the web app from the release's GIT_SHA and starts it after the api
  # (worker_up). Nothing depends on it.
  #
  # The process (`apps/worker/src/runner/main.ts`, by Node directly, as the API
  # runs its entry) refuses to start, exit 1 with one sentence on stderr,
  # unless OWNPACE_JOB_RUNNER is `pg-boss` and JOBS_DATABASE_URL is set. It
  # writes only to stdout and stderr, and answers GET /health on 127.0.0.1:3002
  # inside its own container: 200 once the runner has started (schema checked,
  # queues declared, workers started), 503 while it starts or stops. No port
  # is published, and nothing outside the container asks it.
  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
      args:
        # The commit the image is built from, as the api's (images.yml passes it).
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: ${COMPOSE_PROJECT_NAME}-worker
    restart: unless-stopped
    logging: *logging
    # HOW IT RUNS (see the header): uid 65532 from its first process, so no
    # capability, and a read-only root. /tmp is in memory: nothing it ships
    # writes a file, and a run's own child may.
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: []
    read_only: true
    tmpfs: [/tmp]
    # THE OWNER'S RULE FOR ITS SIZE (workplan 0167, 2026-11-22), from the cap
    # on passes this stack runs at once, MAX_PASSES_IN_FLIGHT (3 when unset).
    # The worker runs at most MAX_PASSES_IN_FLIGHT + 2 runs at once, every
    # queue together, as Trigger.dev's plane admits (a run past that waits in
    # its queue), so the size is per run:
    #   cpus      = 0.5 x (MAX_PASSES_IN_FLIGHT + 2), half a CPU a run, and
    #               never more than the host's CPU count, since Docker refuses
    #               a container more CPUs than the machine has;
    #   mem_limit = (MAX_PASSES_IN_FLIGHT + 2) x 512 MB + 256 MB: at the limit,
    #               every run at its 512 MB budget, which small-1x gives every
    #               queue alike (V8's heap capped at 410 MB of it, the
    #               catalog's maxOldSpaceMb; a pass measured 307 MB, another run
    #               203 MB), and the parent (120 MB measured), 136 MB to spare,
    #               since a run the kernel kills for memory is not retried.
    # The defaults are the OTA stack's, at 3: 2.5 CPUs and 2,816 MB. At 6 the
    # rule is 4 CPUs and 4,352 MB; a .env that sets more (alpha.16's 6400m at
    # 6) is kept, and the bring-up says so. Compose cannot
    # compare a value with the host's CPUs, so the bring-up checks
    # WORKER_CPUS against them before it starts this service. Each run's child
    # raises its own /proc/self/oom_score_adj, so at the limit the kernel takes
    # a run, not the worker that settles it.
    cpus: ${WORKER_CPUS:-2.5}
    mem_limit: ${WORKER_MEMORY:-2816m}
    # A stop gives the runs going this minute: the worker fetches nothing more,
    # lets them finish for 45 s, then kills each run's process still alive and
    # fails its run to be retried, and stops. A run Docker cuts off past the
    # minute is failed by pg-boss's heartbeat sweep and retried, and converges.
    stop_grace_period: 60s
    environment:
      # THE SWITCH, read by the api, this worker and the scripts: `pg-boss`,
      # unset or empty included; `trigger` is refused since alpha.18 with one
      # sentence that says Trigger.dev was removed, and any other value with
      # one of its own (see the header).
      OWNPACE_JOB_RUNNER: ${OWNPACE_JOB_RUNNER:-pg-boss}
      NODE_ENV: production
      # THE JOBS' OWN ROLE, ownpace_jobs, which owns pg-boss's schema `pgboss`
      # and nothing else (deploy/compose/jobs-role.sql; the bring-up's data
      # phase makes it and sets JOBS_DB_PASSWORD on it), through the pooler in
      # transaction mode, to the ledger's database. EMPTY, NOT `:?`, ON
      # PURPOSE: Compose interpolates this file whole, this inactive service
      # included, so a required key would stop every Compose call, a `ps` or an
      # `exec postgres` among them, on a stack whose .env does not have it yet.
      # The bring-up's `load_env` generates the key before its first Compose
      # call (ensure-env-secrets.sh --only JOBS_DB_PASSWORD), the data phase
      # refuses one a URL cannot carry, as it refuses the others, and it is hex
      # when generated, so the URL is composed as the stack's other role URLs
      # are, unencoded. Empty, the role answers "password authentication
      # failed", by name.
      JOBS_DATABASE_URL: postgresql://ownpace_jobs:${JOBS_DB_PASSWORD:-}@${DB_HOST:-pgbouncer}:${DB_PORT:-6432}/${POSTGRES_DB:-openmigrate}
      # WHAT set-task-env.sh UPLOADED TO TRIGGER.DEV'S TASKS until alpha.18,
      # under the same names, composed the same way, so a job read the same
      # environment on either runner. NEVER THE OWNER: no DATABASE_URL, no DIRECT_DATABASE_URL, and
      # no value built from POSTGRES_USER or POSTGRES_PASSWORD under any name
      # (scripts/a-worker-that-carries-no-superuser.unit.test.ts; its twin for
      # Trigger.dev's tasks went with them in alpha.18). The system role by the
      # name managed migration 0033 makes it under, with SYSTEM_DB_PASSWORD,
      # empty rather than required for the reason above.
      SYSTEM_DATABASE_URL: postgresql://ownpace_system:${SYSTEM_DB_PASSWORD:-}@${DB_HOST:-pgbouncer}:${DB_PORT:-6432}/${POSTGRES_DB:-openmigrate}
      APP_DATABASE_URL: postgresql://${APP_DB_USER:-app_user}:${APP_DB_PASSWORD:-app_password}@${DB_HOST:-pgbouncer}:${DB_PORT:-6432}/${POSTGRES_DB:-openmigrate}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-}
      # The rest are optional: Compose passes an empty key as empty, and every
      # reader a job reaches takes empty as unset.
      OAUTH2_CLIENT_ID: ${OAUTH2_CLIENT_ID:-}
      OAUTH2_CLIENT_SECRET: ${OAUTH2_CLIENT_SECRET:-}
      OAUTH2_REFRESH_TOKEN: ${OAUTH2_REFRESH_TOKEN:-}
      OAUTH2_TENANT_ID: ${OAUTH2_TENANT_ID:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      DROPBOX_OAUTH_CLIENT_ID: ${DROPBOX_OAUTH_CLIENT_ID:-}
      DROPBOX_OAUTH_CLIENT_SECRET: ${DROPBOX_OAUTH_CLIENT_SECRET:-}
      MICROSOFT_OAUTH_CLIENT_ID: ${MICROSOFT_OAUTH_CLIENT_ID:-}
      MICROSOFT_OAUTH_CLIENT_SECRET: ${MICROSOFT_OAUTH_CLIENT_SECRET:-}
      MICROSOFT_OAUTH_TENANT: ${MICROSOFT_OAUTH_TENANT:-}
      CIRRUX_OAUTH_CLIENT_ID: ${CIRRUX_OAUTH_CLIENT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      NOTIFY_FROM: ${NOTIFY_FROM:-}
      NOTIFY_TO: ${NOTIFY_TO:-}
      NOTIFY_LOCALE: ${NOTIFY_LOCALE:-}
      LEDGER_RETENTION_DAYS: ${LEDGER_RETENTION_DAYS:-}
      LEDGER_RUN_RETENTION_DAYS: ${LEDGER_RUN_RETENTION_DAYS:-}
      LARGEST_FILE_MB: ${LARGEST_FILE_MB:-}
      MAX_PASSES_IN_FLIGHT: ${MAX_PASSES_IN_FLIGHT:-}
      MAX_PASSES_PER_ORGANISATION: ${MAX_PASSES_PER_ORGANISATION:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      OWNPACE_REACHABLE_HOSTS: ${OWNPACE_REACHABLE_HOSTS:-}
      OWNPACE_STAGE: ${OWNPACE_STAGE:-}
      OWNPACE_BILLING_FROM: ${OWNPACE_BILLING_FROM:-}
      MONEYBIRD_API_TOKEN: ${MONEYBIRD_API_TOKEN:-}
      MONEYBIRD_ADMINISTRATION_ID: ${MONEYBIRD_ADMINISTRATION_ID:-}
      MONEYBIRD_WORKFLOW_ID: ${MONEYBIRD_WORKFLOW_ID:-}
      MONEYBIRD_TAX_RATE_ID_DOMESTIC: ${MONEYBIRD_TAX_RATE_ID_DOMESTIC:-}
      MONEYBIRD_TAX_RATE_ID_REVERSE_CHARGE: ${MONEYBIRD_TAX_RATE_ID_REVERSE_CHARGE:-}
      MONEYBIRD_TAX_RATE_ID_OUTSIDE_EU: ${MONEYBIRD_TAX_RATE_ID_OUTSIDE_EU:-}
      MONEYBIRD_DELIVERY: ${MONEYBIRD_DELIVERY:-}
      MONEYBIRD_FINANCIAL_ACCOUNT_ID_MOLLIE: ${MONEYBIRD_FINANCIAL_ACCOUNT_ID_MOLLIE:-}
      MOLLIE_API_KEY: ${MOLLIE_API_KEY:-}
      OWNPACE_SELLER_COUNTRY: ${OWNPACE_SELLER_COUNTRY:-NL}
      VAT_OSS_ACTIVE: ${VAT_OSS_ACTIVE:-false}
    healthcheck:
      # The image's own HEALTHCHECK, said here so the service states it: Node by
      # its path, its own fetch, on loopback. Exec form; the image has no shell.
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      # The api applies both migration chains at its start, so a healthy api is
      # a database whose tables the jobs read are there: no job runs before
      # the migrations it reads.
      api:
        condition: service_healthy
    networks:
      - ownpace-network

  # Web Application. VITE_API_URL is a BUILD arg (Vite bakes it into the
  # static bundle); the default /api keeps browser calls same-origin, and the
  # image's nginx proxies them to the api service (API_UPSTREAM env, default
  # api:3001 — matches this stack's service name and port).
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        # Same argument the api build takes above, for the same reason: the
        # sidebar's build stamp reports this, and an unstamped bundle shows
        # nothing rather than a made-up number.
        GIT_SHA: ${GIT_SHA:-}
        # WITHOUT THESE THE LOGIN PAGE HAS NO SIGN-IN BUTTON. setup-zitadel.sh
        # writes them into .env and phase_app reloads it before building — but a
        # build arg is a separate boundary from the shell environment, and these
        # were never declared, so every managed bundle was built not knowing it
        # had an issuer. Empty is still the honest default: a stack that has not
        # run the identity setup has none, and `Login.tsx` correctly falls back
        # to the paste box there.
        VITE_OIDC_ISSUER: ${VITE_OIDC_ISSUER:-}
        VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-}
        # Where the legal pages live (workplan 0139 T10). Empty is the production
        # site, the default in `apps/web/src/services/legal-links.ts`. The api
        # service above reads the same key as LEGAL_SITE_URL (0139 T4).
        VITE_LEGAL_SITE_URL: ${VITE_LEGAL_SITE_URL:-}
        # The support screen's way through to an account at the provider.
        # setup-zitadel.sh writes it; empty means the screen shows the address
        # without a link, which is right for a stack that has no console to
        # point at.
        VITE_IDP_CONSOLE_USER_URL: ${VITE_IDP_CONSOLE_USER_URL:-}
        # THE ALPHA NOTE (workplan 0131 T1), from the same OWNPACE_STAGE the api
        # service reads above: a build arg because /login and /request-access
        # have no session to ask with. Vite exposes only VITE_ names, hence the
        # prefix. With `alpha` the bundle also asks, on load, whether the texts
        # wait to be accepted (0139 T3). Empty is off; changing it means
        # rebuilding this image.
        VITE_OWNPACE_STAGE: ${OWNPACE_STAGE:-}
        # The address a tester writes to (workplan 0144 T6 (a)). Empty shows nothing new.
        VITE_SUPPORT_EMAIL: ${VITE_SUPPORT_EMAIL:-}
        # WHERE THE SERVICE RUNS (workplan 0176 D16 (a)), from the same
        # OWNPACE_COUNTRY the site's build reads: a person's link page says
        # "Ownpace runs in {country}." with the name in the reader's language.
        # A build arg because the page has no session to ask with. Empty says
        # nothing; changing it means rebuilding this image, and the site.
        VITE_OWNPACE_COUNTRY: ${OWNPACE_COUNTRY:-}
    container_name: ${COMPOSE_PROJECT_NAME}-web
    restart: unless-stopped
    logging: *logging
    # HOW IT RUNS (see the header): as nginx's own user, uid 101, from its first
    # process, master and workers alike (apps/web/Dockerfile, since 2026-11-19),
    # with no capability. It binds port 80 as that user by the sysctl below,
    # which Docker sets the same by default; it is said here so that port 80
    # does not rest on a daemon default. Until then the master ran as root and
    # kept CHOWN, NET_BIND_SERVICE, SETGID and SETUID.
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: []
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    ports:
      # A ROUTED PORT: the app's public name (`app.…`) leads here through the
      # front. WEB_BIND is set to the front's address in this stack's `.env`,
      # or the name stops answering. See the header.
      - "127.0.0.1:${WEB_PORT:-3123}:80"
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3123}:80"
    depends_on:
      - api
    networks:
      - ownpace-network

  # Demo CalDAV/CardDAV/WebDAV backend (T7 DoD demo). Two accounts per demo
  # tenant get provisioned on it by setup-managed-demo.sh; the worker reaches
  # it at http://nextcloud/ via this network. Not needed for a production
  # deployment — operators bring their own calendar/contacts/file targets.
  # The status page (workplan 0094). Its configuration is deploy/compose/gatus.yaml,
  # in git and reviewed — read the header of that file for what this page can and
  # cannot tell you, and why it lives here rather than on its own machine.
  gatus:
    image: ghcr.io/twin/gatus:v5.38.0
    container_name: ${COMPOSE_PROJECT_NAME}-status
    restart: unless-stopped
    logging: *logging
    # HOW IT RUNS (see the header): root, writing only its own volume, so no capability.
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: []
    environment:
      # The address a BROWSER uses, not an internal service name: probing
      # http://api:3001 would prove the container talks to itself and say
      # nothing about the path a customer actually takes — through the reverse
      # proxy, the certificate and the same-origin /api proxy.
      # WEB_URL by default, and OVERRIDABLE — because on a single box those are
      # legitimately two different addresses.
      #
      # WEB_URL is the address a BROWSER uses, and it has to stay that: the
      # issuer, the redirect URIs and the grant email all read it. But this
      # probe runs INSIDE this container, and the shipped default is
      # `http://localhost:3123` — where `localhost` is gatus itself, with
      # nothing on 3123. So a default stack would light four red lamps for a
      # perfectly healthy service, which is the same corrosion as a green one
      # that means nothing.
      #
      # Invisible until now only because this service had never once been
      # started (see bootstrap-managed.sh). Set STATUS_WEB_URL to an address
      # this container can actually reach; bootstrap-managed.sh says so when
      # the effective value is a loopback one.
      STATUS_WEB_URL: ${STATUS_WEB_URL:-${WEB_URL:?set WEB_URL in .env}}
      # THE PROVIDER, ASKED DIRECTLY. Every other Ownpace row on that page reads
      # a field off one `/api/ready`, so nothing ever named the identity
      # provider and the whole group went dark together whenever the API was
      # the thing that was down.
      #
      # THE NAME AN OPERATOR THINKS IN, over the port that says what this
      # actually reaches.
      #
      # This defaulted to the compose SERVICE name — `http://zitadel:3126` — and
      # the row on the page then read `zitadel` while every other Ownpace row
      # read a domain. That is a real cost: somebody scanning the page has to
      # stop and work out whether `zitadel` is even the right machine (owner,
      # 2026-08-25).
      #
      # It is the SAME EXPRESSION as the provider's alias on the `status-probe`
      # network below, so the two cannot drift: whatever external domain the
      # provider answers for, that name resolves to its container from inside
      # THIS container. On a fronted stack it renders `id.example.com:3126`.
      #
      # WHY A NETWORK OF ITS OWN. This used to lean on the provider's alias on
      # the app network. That alias is derived now (zitadel-network-alias.sh):
      # on a fronted stack the domain is deliberately NOT aliased there, so the
      # API reaches the issuer through the front like a browser does. From in
      # here the same name then resolved OUTWARD — public DNS, the ingress, this
      # port — and nothing answered. The row read Unhealthy for a provider that
      # was signing people in (the reference deployment, 2026-09-06). The
      # probe-only network carries the name for the two containers that share
      # it and for nobody else, so the API's route and the probe's route no
      # longer have to be the same route.
      #
      # AND THE PORT IS THE TELL, deliberately left visible. `:3126` is the
      # container's own port, so this row proves the provider is SERVING and
      # not that its public https name resolves — the probe network means a
      # request for that name never leaves this stack. Writing it as the bare
      # public URL would hide that distinction behind an address that looks
      # like the one a visitor uses. Probing the public path means running this
      # page off this box, which gatus.yaml's header already names as the
      # eventual plan.
      STATUS_IDP_URL: ${STATUS_IDP_URL:-http://${ZITADEL_EXTERNALDOMAIN:-ownpace-idp}:${ZITADEL_PORT:-3126}}
      # THE PUBLIC SITE, OFF UNTIL BOTH ARE SET. `www.yml` is a separate deploy
      # that this stack does not start, so a row for it is opt-in: a red light
      # for a service nobody deployed is a lamp that lies.
      #
      # The URL still needs a value even while the row is off, because gatus
      # refuses to load a config containing an endpoint with no URL and takes
      # the whole page down with it. The placeholder is a `.invalid` name — it
      # can never resolve, so it can never be accidentally green, and it names
      # itself in the failure if the switch is turned on without an address.
      STATUS_SITE_ENABLED: ${STATUS_SITE_ENABLED:-false}
      STATUS_SITE_URL: ${STATUS_SITE_URL:-http://status-site-url-is-not-set.invalid}
      # WHO IS TOLD WHEN AN OWNPACE ROW GOES RED (workplan 0142 T1): the owner,
      # by e-mail, and only where ALERT_ENABLED is true. It defaults to false,
      # and it has to: gatus counts an alert with no value as ON. Live's .env
      # turns it on, and stand-up-live.sh and deploy-live.sh refuse a live .env
      # without ALERT_ENABLED=true, because testers are on live (0142 T0; the
      # owner, 2026-10-04). The OTA stack leaves it off.
      #
      # ONE RELAY LOGIN SERVES BOTH. Each setting falls back to the product's
      # own (SMTP_*, NOTIFY_FROM, NOTIFY_TO), and past those to a placeholder
      # nobody owns, so a stack with no relay loads the page exactly as before
      # and sends nothing. The port stays a number: gatus reads it as one, and a
      # word there would stop the page loading.
      ALERT_ENABLED: ${ALERT_ENABLED:-false}
      ALERT_SMTP_HOST: ${ALERT_SMTP_HOST:-${SMTP_HOST:-alert-smtp-host-is-not-set.invalid}}
      ALERT_SMTP_PORT: ${ALERT_SMTP_PORT:-${SMTP_PORT:-587}}
      ALERT_SMTP_USER: ${ALERT_SMTP_USER:-${SMTP_USER:-}}
      ALERT_SMTP_PASSWORD: ${ALERT_SMTP_PASSWORD:-${SMTP_PASSWORD:-}}
      ALERT_FROM: ${ALERT_FROM:-${NOTIFY_FROM:-status-page@alert-from-is-not-set.invalid}}
      ALERT_TO: ${ALERT_TO:-${NOTIFY_TO:-owner@alert-to-is-not-set.invalid}}
      GATUS_CONFIG_PATH: /config/config.yaml
    volumes:
      - ./gatus.yaml:/config/config.yaml:ro
      # History lives here and NOT in the Postgres this page watches, so an
      # outage is still readable afterwards.
      - gatus_data:/data
    ports:
      # A ROUTED PORT where a status name leads here (live's `status.…`), and
      # STATUS_BIND is then the front's address. See the header.
      - "127.0.0.1:${STATUS_PORT:-3124}:8080"
      - "${STATUS_BIND:-127.0.0.1}:${STATUS_PORT:-3124}:8080"
    networks:
      - ownpace-network
      # The second network exists for one name: see the provider's
      # `status-probe` alias and the STATUS_IDP_URL comment above.
      - status-probe
    # No `depends_on`. A status page that will not start until the thing it is
    # watching is healthy is a status page that is never there when it matters.
    # NO HEALTHCHECK, AND THIS IS NOT AN OMISSION.
    #
    # There was one until 2026-08-25:
    #
    #     test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
    #
    # It could never have passed. `ghcr.io/twin/gatus`'s final stage is
    # `FROM scratch` — the binary and ca-certificates, nothing else. No wget,
    # no curl, no shell, so `CMD-SHELL` is out too, and `main.go` parses no
    # arguments at all, so there is no `gatus healthcheck` subcommand the way
    # mailpit has `/mailpit readyz`. Verified against the upstream Dockerfile
    # and main.go at v5.38.0 rather than assumed.
    #
    # WRITTEN IN #498 AND NEVER ONCE RUN, because nothing started this service
    # until #547 put it in the bring-up's list. Its first real execution was
    # E2E (managed) #77, where it marked a perfectly healthy gatus `unhealthy`
    # and failed the gate's residue check — the only thing red in the run.
    #
    # A healthcheck that can never pass is worse than none: it is a permanent
    # false negative that hides a real one. So the question moves to a side
    # that can answer it — smoke-managed.sh probes /health over the published
    # port, from the host, where curl exists. Same correction as #517 ("ask
    # readiness from the side that can reach the answer") and the same shape as
    # the smoke's issuer probe, which asked with a curl the API image had not
    # got.
    #
    # `up -d --wait` still waits for this container to be RUNNING; it simply no
    # longer waits for a verdict the image cannot produce.

  # Mailpit — the mail this stack sends, CAUGHT rather than delivered.
  #
  # Until 2026-08-24 nothing here could send mail at all: SMTP_HOST was empty,
  # so `readNotifierConfig` reported the channel off and every notification the
  # product renders went nowhere. Somebody filled in the access-request form on
  # the live test site and heard nothing, which was correct behaviour and
  # useless behaviour at the same time.
  #
  # A CATCHER, NOT A RELAY, and that is the point rather than a compromise:
  #
  #   - Every mail the product sends is VISIBLE, in a browser, on this box.
  #   - The smoke can ASSERT one arrived and read what it said. Nothing
  #     verified that end of the product before.
  #   - No automated run can ever reach a real inbox. A relay cannot promise
  #     that, and the nightly gate exercises grant, decline and now request.
  #
  # For real delivery, point SMTP_HOST at a relay — see managed.env.example.
  # bootstrap-managed.sh says so out loud if a deployment that looks real is
  # still pointed here.
  #
  # SMTP stays on the compose network: 1025 is not published, because the only
  # things that should reach it are services in this stack. The web UI is.
  #
  # v1.34.0 (pushed 2026-11-17T07:07Z, three days old 2026-11-20T07:07Z,
  # taken inside that floor on the owner's word of 2026-11-19; workplan
  # 0119, Status 2026-11-18 and 2026-11-19) is the minor kept current. It fixes
  # GHSA-v887-64wg-qqc9, which v1.33.1 brought in: one message whose part
  # header names a media type it cannot parse, with an RFC 2231 parameter,
  # ended the whole process. A panic in an SMTP session now drops that
  # connection alone. It is built with Go 1.27.4 (CVE-2026-97054, in the
  # net/http MaxBytesReader its API uses) on the same Alpine 3.24.4 packages.
  # What else it can send still waits for a setting this file does not make:
  # Rspamd, SpamAssassin, a webhook, a relay or a forward; and the HTML
  # check, link check and screenshot proxy fetch only when their API is
  # asked. Its first start adds a column to mailpit.db
  # (internal/storage/schemas/1.34.0.sql) and fills it; v1.33.1 applies only
  # the scripts it carries and names its columns, so a rollback is still the
  # v1.33.1 digest.
  #
  # v1.33.1 (2026-11-11) was the patch kept current: Alpine 3.24.4, with zlib
  # 1.4 for CVE-2026-4738, which the static /mailpit never loads; the HTML
  # check's fetches bounded to 10 stylesheets and 5 MiB; and a 554 for a
  # message it cannot parse, where it dropped it.
  #
  # v1.33.0 (2026-11-03) was the minor kept current: golang.org/x/net 0.62.0,
  # whose HTML parser fixes CVE-2026-78661 (Mailpit parses every caught HTML
  # message with it) and CVE-2026-97045. What it added stays off here: Rspamd
  # is asked only when MP_ENABLE_RSPAMD names a server, and the Subject prefix
  # acts only on a relay or a forward; this file sets none of the three.
  #
  # v1.32.0 (2026-10-25, 0146 T11 (a)) closed GHSA-379p-g4f4-hq5h (high,
  # every version to v1.31.6): an image attachment whose EXIF directories
  # point at each other held the thumbnail endpoint in a loop until the
  # process was killed. Here that took a mail from this stack's own services
  # or a caller of the web port below, which is loopback unless MAILPIT_BIND
  # names another address. It was the first built with Go 1.27.3, which fixes
  # CVE-2026-111943 in `crypto/x509`, and its first start applied
  # `internal/storage/schemas/1.32.0.sql` to mailpit.db.
  mailpit:
    image: axllent/mailpit:v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
    container_name: ${COMPOSE_PROJECT_NAME}-mailpit
    restart: unless-stopped
    logging: *logging
    # HOW IT RUNS (see the header): root, writing only its own volume, so no
    # capability; read-only, with /tmp in memory.
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: []
    read_only: true
    tmpfs: [/tmp]
    environment:
      # A catcher accepts whatever it is handed. Refusing on auth or TLS would
      # turn a configuration question into a delivery failure that reads like
      # a broken product.
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      # Bounded, like every other thing on this box that writes forever. Two
      # disk leaks in one week is a pattern, not bad luck (workplan 0099).
      # THE CAP IS LOAD-BEARING NOW, not just tidy: with MP_DATABASE set below
      # this is what the store costs on disk rather than in RAM, and an
      # uncapped persistent catcher is that third disk leak. The rule in
      # the-mail-the-issuer-could-not-send.unit.test.ts refuses one without
      # the other.
      MP_MAX_MESSAGES: "500"
      # KEEP WHAT WAS CAUGHT. Unset, mailpit holds messages in memory only, so
      # every verification link, email-change confirmation and password reset
      # vanishes the moment the container is recreated — and recreating it is
      # not an exotic event: changing MAILPIT_BIND does it, so does a version
      # bump, so does `up -d` after almost any edit to this file. An operator
      # who is halfway through a sign-up when that happens has no way back to
      # the code they were sent, and the failure looks like the identity
      # provider never sent the mail.
      #
      # Mailpit appends `mailpit.db` when handed a directory; the path is
      # written out in full here so it does not depend on that.
      #
      # WHAT THIS COSTS is that those links now sit in a volume instead of only
      # in RAM. They are short-lived codes, the volume is root-owned on the
      # box, and the UI in front of them is already loopback-bound by default —
      # so this moves the exposure no further than the port above already does,
      # which is the boundary that was argued out there and still holds.
      MP_DATABASE: /data/mailpit.db
      # NO RELEASE CHECK (workplan 0139, 2026-09-28). Whenever its page asks
      # for the server's info, Mailpit (internal/stats/stats.go, read at v1.31.6
      # and again at v1.32.0, v1.33.0, v1.33.1 and v1.34.0) asks GitHub for its
      # newest release. Live runs no catcher; this is the test stack's.
      # `scripts/a-service-that-phones-home.unit.test.ts`.
      MP_DISABLE_VERSION_CHECK: "true"
    ports:
      # 127.0.0.1, LIKE THE REGISTRY AND FOR A SHARPER REASON. Mailpit has no
      # authentication of any kind — it is a catcher, and asking it to hold
      # credentials would defeat the point — and what it catches is every
      # verification link, every email-change confirmation and every password
      # reset this stack sends. Published on 0.0.0.0 that is an unauthenticated
      # reader of the identity provider's mail, reachable by anyone who can
      # route to the box. Harmless on a laptop, which is where this was written;
      # not harmless the day the box gets a public name, which ota.ownpace.eu
      # did on 2026-08-24.
      #
      # Reach it through an SSH tunnel instead — docs/managed-bring-up.md says
      # how. The smoke and the nightly both ask on localhost from the host, so
      # neither notices.
      #
      # THE BIND ADDRESS IS A SETTING, AND ITS DEFAULT IS STILL LOOPBACK. A
      # private mesh address is not the same thing as `0.0.0.0`: on a WireGuard
      # network — NetBird, Tailscale — the peer address is reachable only by
      # devices holding a key for it, which is an authentication boundary this
      # container does not have to provide itself. An operator who wants the
      # catcher on their laptop without a tunnel every time sets
      # `MAILPIT_BIND` to that peer address and gets it, and nothing about the
      # shipped default changes for anyone who does not.
      #
      # WHAT STAYS FORBIDDEN is the thing the paragraph above is about: a
      # public name, and every interface. `MAILPIT_BIND=0.0.0.0` publishes an
      # unauthenticated reader of every password reset to whatever can route to
      # the box, and the rule in the-mail-the-issuer-could-not-send.unit.test.ts
      # refuses it — along with a bind that has no default, which is the same
      # mistake made by omission.
      #
      # ON A MESH IT IS STILL UNAUTHENTICATED. Everyone on that network can read
      # every verification link, so the question moves from "who can route to
      # this box" to "who is on this mesh" — worth answering deliberately, and
      # worth `MP_UI_AUTH_FILE` if the answer is more than one person.
      - "${MAILPIT_BIND:-127.0.0.1}:${MAILPIT_PORT:-3127}:8025"
    volumes:
      - mailpit_data:/data
    networks:
      - ownpace-network
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 30s
      timeout: 5s
      retries: 5

  # The demo's DAV target, brought up with the OTA stack every night
  # (--with-demo, which both live scripts refuse). Its update check, app store,
  # announcements feed and connectivity check are on by default
  # (config.sample.php at stable34, the same at v35.0.2 and v35.0.3), and are
  # NOT switched off yet: a hook that set them false made the demo's first
  # CalDAV write answer 500 (workplan 0139, 2026-09-29). It holds fixtures,
  # never a tester's data. `scripts/a-service-that-phones-home.unit.test.ts`
  # lists it as left on.
  #
  # NEXTCLOUD 35 FROM THE PULL REQUEST THAT MOVED IT (workplan 0119 T5, written
  # 2026-10-26), 34 before. A major moves ONE WAY: the first `up` with this pin
  # upgrades nextcloud_data and the `nextcloud` database in the stack's Postgres
  # from 34 (`occ upgrade` in the image's entrypoint), and 34 refuses to start
  # on them afterwards. On the OTA stack that first `up` is E2E (managed) on the
  # branch that moves it, and the bring-up asks `occ status` after it, since
  # the healthcheck below cannot tell (bootstrap-managed.sh,
  # nextcloud_upgrade_done). What puts it back is in docs/managed-bring-up.md,
  # *A Nextcloud major on the OTA stack*. The other major, 34, runs in CI only
  # (.github/workflows/nextcloud-second-major.yml).
  #
  # 35.0.3 SINCE 2026-11-14, 35.0.2 before, AND A PATCH MOVES ONE WAY TOO: the
  # image's entrypoint compares the whole version (35.0.2.2 with 35.0.3.2),
  # runs `occ upgrade` at the first `up` (the dav app moves 2.0.0 → 2.0.1), and
  # refuses an older image on the volume from then on, so that section's order
  # holds for a patch as for a major. The pin is 35.0.3-apache by its index
  # digest 8a7a65b8bae8…, pushed on 2026-11-14 at 01:54:42 UTC with
  # linux/amd64 and linux/arm64 in it and no riscv64 yet (`35-apache` holds
  # 35.0.2's riscv64 beside these two, so the tag's index most likely moves
  # again when riscv64's lands): Nextcloud 35.0.3 on PHP 8.5.12, on
  # php:8.5.12-apache-trixie's build of 2026-11-05. Taken the same day, inside
  # its three-day floor (which ends 2026-11-17 at 01:54:42 UTC), which is
  # waived for alpha.10. Read off both images, every blob checked against its
  # sha256 and nothing run: of the eight criticals the image scan of
  # 2026-11-14 read in e0b1a2af52c8…, it carries the fixes for three,
  # libopenexr-3-1-30 3.2.12-1~deb13u1 (CVE-2026-42216, CVE-2026-42217) and
  # linux-libc-dev 6.12.115-2 (CVE-2026-99083), and apt 3.0.4, ImageMagick's
  # deb13u14, libpq5 17.12, zlib1g's deb13u1 and symfony/http-foundation
  # 7.4.21 besides. Not apache2's: 2.4.69-1~deb13u1 still, installed by the
  # PHP base, so CVE-2026-119618 (fixed in 2.4.71-1~deb13u1) waits for that
  # base's rebuild and Nextcloud's after it, and libxml2's CVE-2026-6653 has
  # no fix. SINCE 2026-11-24 (alpha.20) the pin is upstream's rebuild of
  # 35.0.3-apache, index digest 2567f3c36f59…, pushed that day at 13:51:50 UTC:
  # the same Nextcloud (version.php still 35.0.3.2, so no `occ upgrade`) on
  # PHP 8.5.13 in place of 8.5.12, and in its Debian packages apache2
  # 2.4.71-1~deb13u1 (the fix above), libssl3t64 3.5.9-1~deb13u1, libc6
  # deb13u5, Kerberos', libnghttp2's, libfreetype6's, libopenexr's and rsync's
  # next deb13 updates and linux-libc-dev 6.12.118-1, read off both indexes,
  # every blob checked against its sha256 and nothing run.
  nextcloud:
    image: nextcloud:35.0.3-apache@sha256:2567f3c36f59f21ba8e7f6f788cbfc96324a8306b0f19f71be8878ddbf31c38f
    container_name: ${COMPOSE_PROJECT_NAME}-nextcloud
    restart: unless-stopped
    logging: *logging
    # HOW IT RUNS (see the header): no-new-privileges, and Docker's default
    # capabilities, on purpose. Its entrypoint runs as root, rsyncs and chowns
    # into /var/www/html and runs occ through su, and Apache drops to www-data:
    # a set not measured here.
    security_opt: ["no-new-privileges:true"]
    # ITS DATABASE IS THE STACK'S POSTGRES (2026-10-03; workplan 0150). It was
    # SQLite, which takes one writer at a time, while the owner's migrations and
    # the nightly gate write into this one Nextcloud: on 2026-09-29 the gate's
    # writes were refused with "database is locked" (E2E (managed) #222, #223),
    # and the owner chose Postgres. The four POSTGRES_* values apply at the
    # FIRST install only; an installed Nextcloud reads its database from its own
    # config.php. The bring-up's `data` phase makes the role and the database
    # before the first start (nextcloud-db.sh), with .env's
    # NEXTCLOUD_DB_PASSWORD, which ensure-env-secrets.sh generates; an install
    # still on SQLite is moved by nextcloud-to-postgres.sh --convert. Straight
    # to `postgres`, as the OTA stack's was moved, and not through PgBouncer:
    # the pooler runs in transaction mode with max_prepared_statements = 0
    # (pgbouncer/pgbouncer.ini), and PHP's pdo_pgsql makes a named prepared
    # statement on the server for every query unless told not to.
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:-}
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:-admin_managed_pw}
      # WHICH NAMES IT WILL ANSWER TO. Nextcloud refuses any host header not on
      # this list with its "untrusted domain" page — so publishing it on a mesh
      # address is only half the job: reached at `http://100.64.0.1:8083`
      # with the list unchanged, it refuses before a login form is ever drawn,
      # and the refusal looks like a broken deployment rather than a setting.
      # The two shipped names keep the demo scripts and the gate working
      # (`localhost` from the host, `nextcloud` from the app network); an
      # operator publishing it anywhere else adds that address here.
      #
      # THE IMAGE APPLIES THIS AT INSTALL. On an instance already installed,
      # editing it changes nothing until `occ config:system:set trusted_domains`
      # is run — docs/managed-bring-up.md carries the command.
      NEXTCLOUD_TRUSTED_DOMAINS: "${NEXTCLOUD_TRUSTED_DOMAINS:-localhost nextcloud}"
      # ARMED ON PURPOSE (0103 T2 / ADR-0043). Without a mail server Nextcloud
      # cannot send anything, and the gate's "a migration sent no mail" would
      # be true by inability — the same silence-by-blindness the whole 0103
      # plan exists to end. Pointed at the catcher, the fan-out path is real:
      # if any layer regresses toward mailing (the writer's neutralising, a
      # Nextcloud behaviour change, a fixture edit), the message lands in
      # Mailpit and the smoke goes red instead of nobody ever knowing.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM_ADDRESS: calendar
      MAIL_DOMAIN: ownpace.invalid
      # NO LIMIT ON THE SIZE OF ONE REQUEST (workplan 0156, 2026-10-03). The
      # image sets Apache's LimitRequestBody from this, 1 GiB when unset, and
      # past it Apache withholds the body: Sabre reads 0 bytes and answers
      # 413. That parked the owner's four largest Dropbox files (1.3 GB to
      # 4.5 GB) after five tries each, while a 1 GB file arrived. The writer
      # now sends a file above 64 MiB to Nextcloud in pieces, each far below
      # any limit, so this is for every other client of the demo: a desktop
      # or web upload, the seed's own PUTs, and a file the writer sends in
      # one request where the upload area is not available. "0" is Apache's
      # unlimited. PHP's upload_max_filesize and post_max_size do not apply
      # here: they limit a form POST, and WebDAV writes with PUT. Apache reads
      # it when the container starts, and the next `up` recreates a container
      # whose environment changed, so the next deploy applies it.
      APACHE_BODY_LIMIT: "0"
    ports:
      # WHICH INTERFACE, AND THE DEFAULT IS LOOPBACK — the same rule mailpit
      # states above, for the same reason. This published on every interface
      # from the day it arrived, and its admin account is the shipped
      # `NEXTCLOUD_ADMIN_PASSWORD` default: on a box that has a public name,
      # which ota.ownpace.eu does, that is an unauthenticated-by-default file
      # store facing whatever can route to it.
      #
      # A PRIVATE MESH ADDRESS IS A DIFFERENT THING, as it is for mailpit. On
      # WireGuard — NetBird, Tailscale — the peer address is reachable only by
      # devices holding a key, so an operator who wants to browse the DAV
      # backend from a laptop on the mesh sets NEXTCLOUD_BIND to that peer
      # address and reaches it at http://<peer-address>:${NEXTCLOUD_PORT},
      # with no tunnel. Add that same address to NEXTCLOUD_TRUSTED_DOMAINS
      # above, or Nextcloud answers the untrusted-domain page instead.
      #
      # The host-side callers follow this variable rather than assuming
      # localhost — smoke-managed.sh and setup-managed-demo.sh both read it —
      # so moving the publish does not quietly break the gate.
      - "${NEXTCLOUD_BIND:-127.0.0.1}:${NEXTCLOUD_PORT:-8083}:80"
    # A NAME, SO THE DATA OUTLIVES THE CONTAINER (2026-09-06). This block
    # declared no volume, and the image declares `VOLUME /var/www/html` — so
    # every account, calendar, address book and file lived in an ANONYMOUS
    # volume. That survives `restart` and a recreate, and a `docker compose
    # down` orphans it: the next `up` installs Nextcloud again, empty, with
    # the old data still on disk under a hash nobody will look up. Every
    # other stateful service here was already named; this one was the
    # exception nobody chose.
    volumes:
      - nextcloud_data:/var/www/html
      # THE JIT OFF, BECAUSE IT COMPILED A CRASH (2026-09-13). The owner's
      # target segfaulted on every request for two hours — see
      # `nextcloud-php.ini`, which carries the full bisection. Mounted rather
      # than written into the container because a file in the image layer is
      # erased by the next `--force-recreate`, and this outage must not be
      # rediscoverable by recreating a service.
      #
      # `zz-` IS NOT DECORATION. PHP reads `conf.d` alphabetically and the last
      # value wins; the image's `opcache-recommended.ini` is what sets
      # `opcache.jit=1255`, so anything sorting before it is read and then
      # overwritten, silently doing nothing.
      - ./nextcloud-php.ini:/usr/local/etc/php/conf.d/zz-ownpace-no-jit.ini:ro
    # The one probe here that is not an inference: `setup-nextcloud-users.sh`
    # has been running `docker exec <nextcloud> curl … http://localhost/status.php`
    # against this image on the machine since the demo existed, so both the binary
    # and the endpoint are proven rather than assumed.
    #
    # `start_period` is long because first boot INSTALLS Nextcloud, and
    # status.php does not answer 200 until it has. That is also why the demo
    # setup script polls it.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost/status.php || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s
    networks:
      - ownpace-network

networks:
  ownpace-network:
    driver: bridge
  # TWO MEMBERS, ONE NAME. The status page and the identity provider, so the
  # provider's public domain resolves to its container for the page's probe
  # without being aliased on the app network — where, on a fronted stack, that
  # alias shadowed the front for the API (the-alias-that-shadowed-the-front).
  # `internal`: it carries a name, not traffic to anywhere; gatus reaches the
  # world over ownpace-network as before.
  status-probe:
    driver: bridge
    internal: true

volumes:
  gatus_data:
  # What the mail catcher caught. Bounded by MP_MAX_MESSAGES, not by luck.
  mailpit_data:
  # The identity provider's first-init provisioning token (ADR-0042).
  zitadel_machinekey:
  postgres_data:
  # Accounts, calendars, address books and files of the DAV backend.
  nextcloud_data:
  # Trigger.dev's ten volumes (trigger_db_data, redis_data, trigger_shared,
  # registry_data, minio_data_v2, trigger_tls_data, trigger_tls_config,
  # clickhouse_data, clickhouse_data_v2, clickhouse_logs) left this file with
  # its plane in alpha.18 (workplan 0167 T9). Compose never removes a volume
  # a file stops declaring; remove-trigger-plane.sh removes them, by name.
