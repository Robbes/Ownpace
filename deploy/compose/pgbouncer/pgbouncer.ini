;; PgBouncer in TRANSACTION mode, in front of the managed ledger
;; (workplan 0082 T4).
;;
;; Transaction mode is the whole point and also the whole risk: a client's
;; server connection is handed back at COMMIT, so a hundred client connections
;; share a handful of server ones — and anything that keeps state on a SESSION
;; across transactions breaks.
;;
;; This repo was audited for that before the pooler was introduced. The result:
;;
;;   * `withTenant` is safe. It opens a transaction, sets the role with
;;     SET LOCAL and the tenant with set_config(..., true) — both
;;     transaction-scoped — and commits. This is the one that mattered:
;;     app.current_tenant IS the RLS boundary, and a session-scoped version of
;;     it under transaction pooling would be a cross-tenant read.
;;   * Nothing uses LISTEN/NOTIFY, temp tables, session-level SET, or named
;;     prepared statements on the Postgres path.
;;   * Migrations are the ONLY exception. They hold pg_advisory_lock, which is
;;     session-scoped, across many transactions — so they connect direct via
;;     DIRECT_DATABASE_URL and never appear here.

[databases]
;; `*` so both roles reach the same database: the owner (migrations, seed) and
;; the unprivileged app_user the request path uses so RLS is always enforced.
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

pool_mode = transaction

;; Client connections the app may open. Generous — they are cheap here, which
;; is the reason for putting this in front of Postgres at all.
max_client_conn = 500

;; Server connections per (database, user). The number that actually protects
;; Postgres: every pass opens its own pg.Pool of DEFAULT_CONCURRENCY + 2, so
;; without this the ceiling was concurrent-passes times six.
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

;; Credentials are looked up in Postgres rather than kept in a userlist file,
;; so adding a role does not mean editing and redeploying a second copy of its
;; password. auth_user's own entry still has to exist in the file below.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
auth_user = pgbouncer_auth
auth_query = SELECT usename, passwd FROM pgbouncer_auth.user_lookup($1)

;; 0 keeps protocol-level prepared statements off, which is correct while
;; nothing in the repo creates NAMED prepared statements (node-postgres uses
;; unnamed portals unless a query is given a name, and none is). Raise it only
;; alongside a change that starts using them — silently enabling it here would
;; make a future regression look like a PgBouncer bug.
max_prepared_statements = 0

ignore_startup_parameters = extra_float_digits,search_path

server_lifetime = 3600
server_idle_timeout = 600
;; Long enough for the initial copy's larger statements; a pass that legitimately
;; takes longer than this belongs in a job, not in one query.
query_wait_timeout = 120

log_connections = 0
log_disconnections = 0
stats_period = 60
