; A JIT THAT COMPILED A CRASH (2026-09-13).
;
; The owner's DAV target went `unhealthy` and stayed there. Every Apache child
; died on every request:
;
;   AH00051: child pid 888 exit signal Segmentation fault (11)
;
; once per healthcheck, 217 of them, for two hours. `curl` got `Empty reply
; from server` in 0.2 s — the worker died before Apache could write even an
; access-log line, which is why `nextcloud.log` was silent the whole time and
; every reading of it went to the wrong place.
;
; ## What it was not
;
; Ruled out on the box, each by its own evidence rather than by argument:
;
;   - SQLite lock      no journal beside nextcloud.db, no write in two hours,
;                      CPU at 0.18%
;   - a damaged file   `occ integrity:check-core` found nothing
;   - a third-party    `compact_calendar_widget` disabled; still crashing
;     app
;   - our own traffic  zero `remote.php/dav` requests in the window
;   - stale process    it survived `docker restart` unchanged
;     state
;
; The segfaults arrived at a metronomic 15 seconds — the healthcheck interval
; exactly — so the ONLY request reaching it was `/status.php`, and every single
; one of them killed its worker.
;
; ## What it was
;
; One asymmetry survived: `php /var/www/html/status.php` on the CLI returned
; clean JSON and exit 0, while the identical file under Apache segfaulted
; 100% of the time. Same code, same config, same database. The difference is
; `opcache.enable_cli=Off` — the CLI does not run the optimiser, and the web
; SAPI does.
;
; The image's own `opcache-recommended.ini` carries
;
;   opcache.jit=1255
;   opcache.jit_buffer_size=8M
;
; Turning opcache off entirely: zero segfaults. Turning opcache back ON and
; only the JIT off: zero segfaults. So it is the JIT, and this file is that,
; kept as narrow as the evidence: the optimiser stays, its machine-code
; compiler goes.
;
; That also explains the shape nothing else did — five days healthy, then
; broken from one moment on and never recovering. Tracing JIT compiles a path
; once it is hot. A bulk delete drove a shared bootstrap path hot, it compiled
; to something that faults, and every request through it afterwards died. A
; restart does not help because it recompiles the same trace.
;
; ## Not our bug, and still ours to pin
;
; A segfaulting JIT is PHP's. But `managed.yml` ships this image as the DAV
; target every managed migration writes into, so a crash here takes the
; destination down MID-PASS, and the ledger fills with 500s whose cause is two
; layers away from anything the product can see. Pinning it costs a few
; percent of throughput and removes a class of outage.
;
; ## The filename is load-bearing
;
; PHP reads `conf.d` in alphabetical order and the last value wins. This must
; mount as `zz-…` so it sorts AFTER `opcache-recommended.ini`; named anything
; earlier it is read first, overwritten, and does nothing at all — silently.
; `scripts/a-jit-that-compiled-a-crash.unit.test.ts` fails on a mount that
; loses that race.
;
; Deliberately NOT set here: `opcache.memory_consumption`. The image's
; recommended file leaves it as `${PHP_OPCACHE_MEMORY_CONSUMPTION}` for its own
; entrypoint to substitute, this repository sets that variable nowhere, and
; nothing in the evidence above implicates it. A value invented here would be
; a guess overriding a default that is working.

opcache.jit=disable
opcache.jit_buffer_size=0
