# Static serving for the public site. Deliberately small.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Pages are cheap to regenerate and must never be served stale after a
    # rebuild; the logo is content-addressed by nothing, so it gets a short
    # cache rather than a long one.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=300";
    }

    location /brand/ {
        add_header Cache-Control "public, max-age=3600";
    }

    # The site runs no scripts and loads nothing off-origin, so the policy can
    # be strict enough to say so. style-src needs 'unsafe-inline' because the
    # stylesheet is inlined in <head> — one request, no flash of unstyled text.
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    error_page 404 /index.html;
}
