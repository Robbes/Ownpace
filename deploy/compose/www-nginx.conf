# Static serving for the public site. Deliberately small.
#
# HEADERS ARE REPEATED PER LOCATION, DELIBERATELY. nginx `add_header` is
# inherited from the enclosing level ONLY when the current level sets none —
# so the moment a location adds its own Cache-Control, every server-level
# security header silently stops applying to it. That is exactly what this
# file did until 2026-08-26: the CSP sat at server level, every location set
# Cache-Control, and so no page this server actually served carried the CSP
# at all. The two policies are named once as variables below; every location
# states which one it serves, and a unit test refuses a location that sets
# headers without restating the CSP (site/calculator.unit.test.ts).

# THE ACCESS LOG, IN A FORMAT OF ITS OWN (the owner, 2026-09-28,
# ops-trust-proxy (b): "Keep visitors' addresses in all our logs"; privacy
# §4.5). This file set none, so the image's default applied, which this
# repository never said. nginx's `combined`, and the visitor last, as a field
# of its own: behind NetBird, $remote_addr is NetBird's proxy for every
# visitor, and the visitor's address comes in X-Forwarded-For, which NetBird's
# proxy sets to the address the visitor connected from, dropping whatever the
# visitor sent (netbirdio/netbird at 002755c4,
# proxy/internal/proxy/reverseproxy.go, setUntrustedForwardingHeaders).
# Recorded, not believed: no set_real_ip_from, whose trusted range would be an
# address written in this file. The site has no link that is a credential, so
# the request line stays whole, unlike the app's (apps/web/nginx.conf.template).
# /var/log/nginx/access.log is the image's link to the container's output,
# which Docker keeps with the container (privacy §9, "until the part that
# wrote them is replaced"). This file is included in the image's http block,
# where log_format belongs. scripts/a-visitor-every-log-called-netbird.unit.test.ts.
log_format ownpace_site '$remote_addr - $remote_user [$time_local] '
    '"$request" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent" "$http_x_forwarded_for"';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log ownpace_site;

    # The one strict policy almost every page serves: the site runs no
    # scripts and loads nothing off-origin, so the policy can be strict
    # enough to say so. style-src needs 'unsafe-inline' because the
    # stylesheet is inlined in <head> — one request, no flash of unstyled
    # text.
    set $csp_strict "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";

    # THE ONE EXCEPTION, PINNED BY HASH (workplan 0088 T3; owner decision
    # 2026-08-26, shape (a) of the CSP fork). The calculator pages run one
    # inline script — the same bytes on both locales — and the policy allows
    # exactly that script and nothing else: nothing external, nothing
    # submitted (form-action stays 'none'), nothing another page can run.
    # The hash below is the sha256 of the inline script `site/build.mjs`
    # emits; `site/calculator.unit.test.ts` fails when the two drift, naming
    # this file — because a stale hash does not error, it silently serves a
    # perfectly rendered, perfectly dead calculator.
    set $csp_calc "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'sha256-1bO1F61PnETl2wVp1ziU/A9im8jr6YdtmkeechS3MC4='; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";

    location = /estimate.html {
        add_header Cache-Control "public, max-age=300";
        add_header Content-Security-Policy $csp_calc always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location = /nl/schatting.html {
        add_header Cache-Control "public, max-age=300";
        add_header Content-Security-Policy $csp_calc always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Pages are cheap to regenerate and must never be served stale after a
    # rebuild; the logo is content-addressed by nothing, so it gets a short
    # cache rather than a long one.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=300";
        add_header Content-Security-Policy $csp_strict always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /brand/ {
        add_header Cache-Control "public, max-age=3600";
        add_header Content-Security-Policy $csp_strict always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # A WRONG ADDRESS GETS THE 404 PAGE, NOT THE HOME PAGE.
    #
    # This said `error_page 404 /index.html;` until 2026-08-25, so
    # www.ota.ownpace.eu/blabla served the LANDING PAGE with a 404 status — the
    # worst of both: a visitor sees a working site and concludes their link was
    # fine, while a crawler is told the page is missing. Reported from the live
    # test host.
    #
    # The status stays 404 (no `=200`): the page really is not here, and saying
    # otherwise is what breaks every tool that reads status codes.
    error_page 404 /404.html;

    # The Dutch tree gets the Dutch one. Without this, a visitor who was reading
    # /nl/prijzen and mistyped the next path is answered in English — which is
    # exactly the moment a bilingual site should not switch languages.
    location /nl/ {
        try_files $uri $uri/ =404;
        error_page 404 /nl/404.html;
        add_header Cache-Control "public, max-age=300";
        add_header Content-Security-Policy $csp_strict always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
