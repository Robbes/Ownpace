# Self-host appliance stack (workplan 0010 T3).
#
# Two services: a small bundled Postgres and the single-tenant app. Bring it up
# on a NAS / mini-PC / Pi with (the first `up` also builds the database's
# image, the official one without gosu, from ./postgres):
#
#   cp deploy/selfhost/selfhost.env.example deploy/selfhost/.env   # then edit
#   cp deploy/selfhost/config/mapping.json.example \
#      deploy/selfhost/config/mapping.json                          # then edit
#   docker compose -f deploy/selfhost/compose.yml up -d
#
# The app self-migrates on startup (advisory lock, T1) against the bundled
# Postgres, schedules the mappings in deploy/selfhost/config/, and serves
# /healthz + /status on the published port. After `docker compose restart app`
# it resumes incrementally from cursors with zero duplicates (T5 gate).
#
# HARD RULE 5: no managed-only service here — no Trigger.dev, no billing. The
# app runs the worker's multi-domain orchestration in-process.

name: ownpace-selfhost

# CONTAINER OUTPUT, CAPPED (workplan 0129 T3; the owner's decision: a month of
# application and container logs). Docker keeps a container's output by SIZE,
# never by age, and without these options it keeps all of it, for ever, on the
# appliance's own disk. Five files of 20 MB per container is 100 MB at most:
# how many days that is depends on how much the appliance logs, which is why
# docs/selfhost-quickstart.md says how to keep exactly 30 days with the host's
# journal instead. Every service below uses these, and the overrides
# (compose.pglite.yml, compose.dev.yml, compose.drill.yml) inherit them.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    # The official image without gosu, started as its postgres user, uid 70
    # (workplan 0146 T15b, 2026-10-26): ./postgres/Dockerfile says why, what a
    # start as uid 70 means for an appliance's data, and why the name carries
    # the hash of its instructions. Compose builds it on the first `up` that
    # finds no image of this name, so an upgrade whose Dockerfile changed builds
    # the new one at its `up -d`; the base's digest is the Dockerfile's FROM,
    # which Dependabot moves (its own `docker` entry). `never`: no registry
    # serves this name, so `docker compose pull` passes it by, and `up` builds
    # it when it is missing without asking one.
    image: localhost/postgres:18.7-alpine-2d3b1894d8f1
    build: ./postgres
    pull_policy: never
    container_name: ownpace-selfhost-db
    restart: unless-stopped
    logging: *logging
    # HOW IT RUNS (2026-11-03, workplan 0119): uid 70 from its first process
    # (./postgres/Dockerfile), so no capability, and no-new-privileges. The
    # managed stack's databases run the same image the same way
    # (deploy/compose/managed.yml, "HOW THE CONTAINERS RUN").
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: []
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openmigrate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/selfhost/.env}
      POSTGRES_DB: ${POSTGRES_DB:-openmigrate}
    volumes:
      # Local volume ONLY — never a network filesystem (SMB/NFS) for the DB
      # (corruption risk). See docs/selfhost-quickstart.md.
      # Postgres 18+ expects data at /var/lib/postgresql (not /var/lib/postgresql/data)
      # A named volume: a new one takes the image's directory, uid 70's. A host
      # directory bound here instead must be uid 70's (`chown -R 70:70`; under
      # rootless Docker from inside the container, as the quickstart says), or
      # a start as uid 70 cannot make the data directory in it.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openmigrate} -d ${POSTGRES_DB:-openmigrate}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - selfhost

  app:
    build:
      context: ../..
      dockerfile: apps/selfhost/Dockerfile
    image: ${SELFHOST_IMAGE:-ghcr.io/robbes/ownpace-selfhost:edge}
    container_name: ownpace-selfhost-app
    restart: unless-stopped
    logging: *logging
    # HOW IT RUNS (2026-11-03, workplan 0119): the image's user, uid 10001, from
    # its first process, running node and nothing else, so no capability, and
    # no-new-privileges. scripts/a-privilege-no-service-uses.unit.test.ts.
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: []
    env_file:
      # tokenFromEnv/passwordFromEnv secrets referenced by the mapping configs
      # live here (600 perms — see the quickstart).
      - .env
    environment:
      # The app connects as the database OWNER, because it migrates itself on
      # startup and creating roles and policies needs that. It does not SERVE as
      # the owner: `withTenant()` drops to `app_user` inside each transaction,
      # because Postgres exempts owners and superusers from row security and
      # this connection would otherwise bypass every policy in the baseline.
      # Single-tenant, so that is defence in depth rather than the live
      # boundary — but it used to say "RLS unused here", and it was right.
      DATABASE_URL: postgresql://${POSTGRES_USER:-openmigrate}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-openmigrate}
      CONFIG_DIR: /data/config
      HOST: 0.0.0.0
      PORT: ${SELFHOST_PORT:-8081}
    ports:
      # Status/health endpoint. Bind to localhost by default so the appliance is
      # not exposed on the LAN; override SELFHOST_BIND to publish wider.
      - "${SELFHOST_BIND:-127.0.0.1}:${SELFHOST_PORT:-8081}:${SELFHOST_PORT:-8081}"
    volumes:
      # State volume for anything the app writes (cursors, logs, etc.).
      # Config is baked into the image; override by removing this line and
      # mounting a custom config volume if needed.
      - appdata:/data/state
    depends_on:
      postgres:
        condition: service_healthy
    # EXEC FORM, ON THE IMAGE'S NODE BY ITS PATH (2026-11-06, workplan 0119 §3
    # item 12): the image is distroless from 0.2.0-alpha.5 on, with no
    # /bin/sh to run a CMD-SHELL test and no `node` on its PATH. Compose fills
    # in ${SELFHOST_PORT} itself, so no shell is needed for that either. This
    # file and the image go together: a compose.yml from before this change
    # reports `app` unhealthy on the new image while it serves (CMD-SHELL
    # cannot start), and this test fails on an image from before it, which
    # has Node at /usr/local/bin/node. The quickstart's *Upgrades* moves both.
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:${SELFHOST_PORT:-8081}/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    dns:
      - 127.0.0.11
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - selfhost

networks:
  selfhost:
    driver: bridge

volumes:
  pgdata:
  appdata:
