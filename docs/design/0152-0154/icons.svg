<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Data-type icons</title>
<desc id="d">Six stroke icons for mail, calendar, contacts, files, photos and tasks, shown large, in a row, and on a dark background.</desc>
<defs>
<symbol id="i-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<rect x="3" y="5" width="18" height="14" rx="2"/>
<path d="M3 7l9 6 9-6"/>
</symbol>
<symbol id="i-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<rect x="3" y="5" width="18" height="16" rx="2"/>
<path d="M3 10h18M8 3v4M16 3v4"/>
</symbol>
<symbol id="i-contacts" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<circle cx="12" cy="8" r="4"/>
<path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/>
</symbol>
<symbol id="i-files" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
</symbol>
<symbol id="i-photos" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<rect x="3" y="4" width="18" height="16" rx="2"/>
<circle cx="9" cy="10" r="2"/>
<path d="M21 16l-5-5-9 9"/>
</symbol>
<symbol id="i-tasks" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="M3 6l1.5 1.5L7 5M3 12l1.5 1.5L7 11M3 18l1.5 1.5L7 17M10 6h11M10 12h11M10 18h11"/>
</symbol>
</defs>
<rect width="1100" height="400" fill="#FFFFFF"/>
<text x="32" y="44" font-size="20" font-weight="700" fill="#111827" text-anchor="start">Data-type icons (0152 T3, 0153 §5): 24 px, 2 px stroke, round ends, currentColor</text>
<text x="32" y="70" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">Always shown with the data type’s name beside them; the icon itself is aria-hidden.</text>
<rect x="32" y="96" width="150" height="120" rx="12" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<use href="#i-mail" x="83" y="112" width="48" height="48" color="#0E4F4A"/>
<text x="107" y="196" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">Mail</text>
<rect x="202" y="96" width="150" height="120" rx="12" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<use href="#i-calendar" x="253" y="112" width="48" height="48" color="#0E4F4A"/>
<text x="277" y="196" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">Calendar</text>
<rect x="372" y="96" width="150" height="120" rx="12" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<use href="#i-contacts" x="423" y="112" width="48" height="48" color="#0E4F4A"/>
<text x="447" y="196" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">Contacts</text>
<rect x="542" y="96" width="150" height="120" rx="12" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<use href="#i-files" x="593" y="112" width="48" height="48" color="#0E4F4A"/>
<text x="617" y="196" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">Files</text>
<rect x="712" y="96" width="150" height="120" rx="12" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<use href="#i-photos" x="763" y="112" width="48" height="48" color="#0E4F4A"/>
<text x="787" y="196" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">Photos</text>
<rect x="882" y="96" width="150" height="120" rx="12" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<use href="#i-tasks" x="933" y="112" width="48" height="48" color="#0E4F4A"/>
<text x="957" y="196" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">Tasks</text>
<text x="32" y="252" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">In a row (20 px) and in dark mode the same symbol takes its colour from the text around it.</text>
<use href="#i-mail" x="40" y="272" width="20" height="20" color="#374151"/>
<text x="68" y="287" font-size="14" font-weight="500" fill="#374151" text-anchor="start">Mail</text>
<use href="#i-calendar" x="210" y="272" width="20" height="20" color="#374151"/>
<text x="238" y="287" font-size="14" font-weight="500" fill="#374151" text-anchor="start">Calendar</text>
<use href="#i-contacts" x="380" y="272" width="20" height="20" color="#374151"/>
<text x="408" y="287" font-size="14" font-weight="500" fill="#374151" text-anchor="start">Contacts</text>
<use href="#i-files" x="550" y="272" width="20" height="20" color="#374151"/>
<text x="578" y="287" font-size="14" font-weight="500" fill="#374151" text-anchor="start">Files</text>
<use href="#i-photos" x="720" y="272" width="20" height="20" color="#374151"/>
<text x="748" y="287" font-size="14" font-weight="500" fill="#374151" text-anchor="start">Photos</text>
<use href="#i-tasks" x="890" y="272" width="20" height="20" color="#374151"/>
<text x="918" y="287" font-size="14" font-weight="500" fill="#374151" text-anchor="start">Tasks</text>
<rect x="32" y="318" width="1036" height="60" rx="10" fill="#0F1F1D"/>
<use href="#i-mail" x="48" y="338" width="20" height="20" color="#CFE9E3"/>
<text x="76" y="353" font-size="14" font-weight="500" fill="#CFE9E3" text-anchor="start">Mail</text>
<use href="#i-calendar" x="218" y="338" width="20" height="20" color="#CFE9E3"/>
<text x="246" y="353" font-size="14" font-weight="500" fill="#CFE9E3" text-anchor="start">Calendar</text>
<use href="#i-contacts" x="388" y="338" width="20" height="20" color="#CFE9E3"/>
<text x="416" y="353" font-size="14" font-weight="500" fill="#CFE9E3" text-anchor="start">Contacts</text>
<use href="#i-files" x="558" y="338" width="20" height="20" color="#CFE9E3"/>
<text x="586" y="353" font-size="14" font-weight="500" fill="#CFE9E3" text-anchor="start">Files</text>
<use href="#i-photos" x="728" y="338" width="20" height="20" color="#CFE9E3"/>
<text x="756" y="353" font-size="14" font-weight="500" fill="#CFE9E3" text-anchor="start">Photos</text>
<use href="#i-tasks" x="898" y="338" width="20" height="20" color="#CFE9E3"/>
<text x="926" y="353" font-size="14" font-weight="500" fill="#CFE9E3" text-anchor="start">Tasks</text>
</svg>
