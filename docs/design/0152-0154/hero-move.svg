<use href="#i-contacts" x="28" y="154" width="22" height="22" class="hm-accent"/>
<text class="hm-ink" x="62" y="170" font-size="14" font-weight="500">Contacts</text>
<use href="#i-tasks" x="28" y="200" width="22" height="22" class="hm-accent"/>
<text class="hm-ink" x="62" y="216" font-size="14" font-weight="500">Tasks</text>
<use href="#i-files" x="28" y="246" width="22" height="22" class="hm-accent"/>
<text class="hm-ink" x="62" y="262" font-size="14" font-weight="500">Files</text>
<use href="#i-photos" x="28" y="292" width="22" height="22" class="hm-accent"/>
<text class="hm-ink" x="62" y="308" font-size="14" font-weight="500">Photos</text>
<rect class="hm-card" x="362" y="40" width="190" height="306" rx="16" stroke-width="1.5"/>
<text class="hm-muted" x="457" y="30" font-size="13" font-weight="600" text-anchor="middle">Your new home</text>
