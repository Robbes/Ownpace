<svg xmlns="http://www.w3.org/2000/svg" width="560" height="356" viewBox="0 0 560 356" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Your data moves from your old account to your new home</title>
<desc id="d">Mail, calendar, contacts, tasks, files and photos go from the old account through Ownpace to the new home. Ownpace copies them, then keeps them in step until you switch.</desc>
<defs>
<symbol id="i-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<rect x="3" y="5" width="18" height="14" rx="2"/>
<path d="M3 7l9 6 9-6"/>
</symbol>
<symbol id="i-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<rect x="3" y="5" width="18" height="16" rx="2"/>
<path d="M3 10h18M8 3v4M16 3v4"/>
</symbol>
<symbol id="i-contacts" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<circle cx="12" cy="8" r="4"/>
<path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/>
</symbol>
<symbol id="i-files" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
</symbol>
<symbol id="i-photos" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<rect x="3" y="4" width="18" height="16" rx="2"/>
<circle cx="9" cy="10" r="2"/>
<path d="M21 16l-5-5-9 9"/>
</symbol>
<symbol id="i-tasks" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="M3 6l1.5 1.5L7 5M3 12l1.5 1.5L7 11M3 18l1.5 1.5L7 17M10 6h11M10 12h11M10 18h11"/>
</symbol>
</defs>
<defs>
<marker id="hm-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path class="hm-head" d="M0 0L10 5L0 10z"/>
</marker>
</defs>
<style>.hm-ink{fill:var(--ink,#1D2421)} .hm-muted{fill:var(--muted,#5D6763)}.hm-card{fill:var(--panel,#F2F0E8);stroke:var(--line,#E5E1D6)}.hm-accent{color:var(--teal,#0E4F4A);fill:var(--teal,#0E4F4A)} .hm-arrow{stroke:var(--teal,#0E4F4A)}.hm-head{fill:var(--teal,#0E4F4A)} .hm-ring{fill:var(--bg,#FAF9F5);stroke:var(--teal,#0E4F4A)}.hm-ok{fill:var(--mint,#7FD4C1)} .hm-tick{stroke:#0E4F4A}</style>
<rect class="hm-card" x="8" y="40" width="190" height="306" rx="16" stroke-width="1.5"/>
<text class="hm-muted" x="103" y="30" font-size="13" font-weight="600" text-anchor="middle">Your old account</text>
<use href="#i-mail" x="28" y="62" width="22" height="22" class="hm-accent"/>
<text class="hm-ink" x="62" y="78" font-size="14" font-weight="500">Mail</text>
<use href="#i-calendar" x="28" y="108" width="22" height="22" class="hm-accent"/>
