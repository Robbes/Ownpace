<text x="398.0" y="689.55" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Start with Small</text>
<rect x="528" y="314" width="228" height="412" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="548" y="350" font-size="20" font-weight="800" fill="#111827" text-anchor="start">Medium</text>
<text x="548" y="374" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">A household, a team,</text>
<text x="548" y="392" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">or a small business</text>
<text x="548" y="450" text-anchor="start"><tspan font-size="34" font-weight="800" fill="#111827">€6</tspan><tspan font-size="14" font-weight="500" fill="#374151"> a month</tspan></text>
