<text x="236" y="243" font-size="14" font-weight="500" fill="#6B7280" text-anchor="middle">Monthly</text>
<text x="320" y="243" font-size="12" font-weight="600" fill="#9A3412" text-anchor="start">T6 (e): opens on yearly; two radio inputs and :checked, no script; a visible label</text>
<text x="40" y="290" font-size="14" font-weight="400" fill="#374151" text-anchor="start">Done within six months? Pay monthly. Longer, or not sure? A year costs the same as six months.</text>
<rect x="40" y="314" width="228" height="412" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="60" y="350" font-size="20" font-weight="800" fill="#111827" text-anchor="start">Free</text>
<text x="60" y="374" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">One person,</text>
<text x="60" y="392" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">one thing at a time</text>
<text x="60" y="450" font-size="34" font-weight="800" fill="#111827" text-anchor="start">Free</text>
<text x="60" y="480" font-size="15" font-weight="600" fill="#111827" text-anchor="start">for as long as it runs</text>
<text x="60" y="502" font-size="13" font-weight="400" fill="#374151" text-anchor="start">No invoice, no card</text>
