<title id="t">Wireframe: the pricing page</title>
<desc id="d">A labelled switch that opens on yearly, five tier cards with the per-month price, the year total and the comparison with monthly, the calculator button, the monthly view of one card, the year’s line, questions and answers, and the principle.</desc>
