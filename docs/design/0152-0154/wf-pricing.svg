<text x="792" y="374" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">An SME</text>
<text x="792" y="392" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start"></text>
<text x="792" y="450" text-anchor="start"><tspan font-size="34" font-weight="800" fill="#111827">€20</tspan><tspan font-size="14" font-weight="500" fill="#374151"> a month</tspan></text>
<text x="792" y="480" font-size="18" font-weight="700" fill="#111827" text-anchor="start">€240 a year</text>
<text x="792" y="502" font-size="13" font-weight="400" fill="#374151" text-anchor="start">paid yearly, in advance</text>
<rect x="792" y="514" width="169.11999999999998" height="22" rx="11.0" fill="#E8F5F2"/>
<text x="876.56" y="527.5" font-size="12" font-weight="600" fill="#0E4F4A" text-anchor="middle">half the monthly price</text>
<path d="M792 554H980" stroke="#E5E7EB"/>
<text x="792" y="580" text-anchor="start"><tspan font-size="13" font-weight="700" fill="#111827">50</tspan><tspan font-size="13" font-weight="400" fill="#374151"> migrations</tspan></text>
<text x="792" y="598" font-size="13" font-weight="400" fill="#374151" text-anchor="start">at the same time</text>
<text x="792" y="622" text-anchor="start"><tspan font-size="13" font-weight="700" fill="#111827">7.5 TB</tspan><tspan font-size="13" font-weight="400" fill="#374151"> of data moved</tspan></text>
<text x="792" y="644" font-size="13" font-weight="400" fill="#374151" text-anchor="start">No setup fee</text>
<rect x="792" y="664" width="188" height="42" rx="8" fill="#FFFFFF" stroke="#0E4F4A" stroke-width="1.5"/>
<text x="886.0" y="689.55" font-size="13" font-weight="600" fill="#0E4F4A" text-anchor="middle">Start with Large</text>
<rect x="1016" y="314" width="228" height="412" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="1036" y="350" font-size="20" font-weight="800" fill="#111827" text-anchor="start">Extra large</text>
<text x="1036" y="374" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">An organisation,</text>
<text x="1036" y="392" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">or an MSP</text>
<text x="1036" y="450" text-anchor="start"><tspan font-size="34" font-weight="800" fill="#111827">€40</tspan><tspan font-size="14" font-weight="500" fill="#374151"> a month</tspan></text>
<text x="1036" y="480" font-size="18" font-weight="700" fill="#111827" text-anchor="start">€480 a year</text>
<text x="1036" y="502" font-size="13" font-weight="400" fill="#374151" text-anchor="start">paid yearly, in advance</text>
<rect x="1036" y="514" width="169.11999999999998" height="22" rx="11.0" fill="#E8F5F2"/>
<text x="1120.56" y="527.5" font-size="12" font-weight="600" fill="#0E4F4A" text-anchor="middle">half the monthly price</text>
<path d="M1036 554H1224" stroke="#E5E7EB"/>
<text x="1036" y="580" text-anchor="start"><tspan font-size="13" font-weight="700" fill="#111827">200</tspan><tspan font-size="13" font-weight="400" fill="#374151"> migrations</tspan></text>
<text x="1036" y="598" font-size="13" font-weight="400" fill="#374151" text-anchor="start">at the same time</text>
<text x="1036" y="622" text-anchor="start"><tspan font-size="13" font-weight="700" fill="#111827">15 TB</tspan><tspan font-size="13" font-weight="400" fill="#374151"> of data moved</tspan></text>
<text x="1036" y="644" font-size="13" font-weight="400" fill="#374151" text-anchor="start">No setup fee</text>
<rect x="1036" y="664" width="188" height="42" rx="8" fill="#FFFFFF" stroke="#0E4F4A" stroke-width="1.5"/>
<text x="1130.0" y="689.55" font-size="13" font-weight="600" fill="#0E4F4A" text-anchor="middle">Start with Extra large</text>
<rect x="40" y="746" width="240" height="44" rx="8" fill="#FFFFFF" stroke="#0E4F4A" stroke-width="1.5"/>
<text x="160.0" y="772.9" font-size="14" font-weight="600" fill="#0E4F4A" text-anchor="middle">Work out what yours costs</text>
<text x="300" y="774" font-size="12" font-weight="600" fill="#9A3412" text-anchor="start">T6 (c): the calculator’s button under the cards</text>
<text x="40" y="812" font-size="12" font-weight="600" fill="#9A3412" text-anchor="start">T6 (e) guardrails: nothing struck through; no &quot;was&quot; price; the discount compares two prices on sale now;</text>
<text x="40" y="832" font-size="12" font-weight="600" fill="#9A3412" text-anchor="start">the year’s total bold on the line under the per-month figure, never in small print; VAT included; no countdown</text>
<text x="40" y="876" font-size="13" font-weight="600" fill="#9A3412" text-anchor="start">The same card when Monthly is chosen:</text>
<rect x="40" y="890" width="228" height="150" rx="14" fill="#FFFFFF" stroke="#0E4F4A" stroke-width="2"/>
<text x="60" y="926" font-size="20" font-weight="800" fill="#111827" text-anchor="start">Small</text>
<text x="60" y="976" text-anchor="start"><tspan font-size="34" font-weight="800" fill="#111827">€5</tspan><tspan font-size="14" font-weight="500" fill="#374151"> a month</tspan></text>
<text x="60" y="1004" font-size="13" font-weight="400" fill="#374151" text-anchor="start">Stop at the end of any month</text>
<text x="300" y="916" font-size="13" font-weight="600" fill="#9A3412" text-anchor="start">T6 (f): the year’s line, under the cards on Yearly; its words wait for T0 and the lawyer</text>
<text x="300" y="944" font-size="14" font-weight="400" fill="#374151" text-anchor="start">A year is credit, never refunded. What is left after the year pays the months after it.</text>
<text x="300" y="968" font-size="14" font-weight="400" fill="#374151" text-anchor="start">Then you pay month by month. A year never renews by itself.</text>
<text x="40" y="1094" font-size="22" font-weight="700" fill="#111827" text-anchor="start">Questions</text>
<rect x="40" y="1112" width="760" height="40" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="60" y="1137" font-size="14" font-weight="600" fill="#111827" text-anchor="start">▸  Is there a free way?</text>
<rect x="40" y="1160" width="760" height="40" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="60" y="1185" font-size="14" font-weight="600" fill="#111827" text-anchor="start">▸  Does the bill go down when I finish?</text>
<rect x="40" y="1208" width="760" height="40" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="60" y="1233" font-size="14" font-weight="600" fill="#111827" text-anchor="start">▸  Does pausing lower it?</text>
<rect x="40" y="1256" width="760" height="40" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="60" y="1281" font-size="14" font-weight="600" fill="#111827" text-anchor="start">▸  What if I keep copying after I switch?</text>
<rect x="40" y="1304" width="760" height="40" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="60" y="1329" font-size="14" font-weight="600" fill="#111827" text-anchor="start">▸  How do I stop a year, and what comes back?</text>
<rect x="40" y="1352" width="760" height="40" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="60" y="1377" font-size="14" font-weight="600" fill="#111827" text-anchor="start">▸  How do I withdraw within 14 days?</text>
<text x="820" y="1138" font-size="12" font-weight="600" fill="#9A3412" text-anchor="start">T6 (b): each a &lt;details&gt;, written by build.mjs;</text>
<text x="820" y="1158" font-size="12" font-weight="600" fill="#9A3412" text-anchor="start">the withdrawal answer names the Billing button (T6 f)</text>
<text x="40" y="1460" font-size="20" font-weight="700" fill="#111827" text-anchor="start">Why it is priced this way</text>
<text x="40" y="1488" font-size="14" font-weight="400" fill="#374151" text-anchor="start">Ownpace is priced to pay for what it takes to run and build it: the servers, the support, and the time spent</text>
<text x="40" y="1510" font-size="14" font-weight="400" fill="#374151" text-anchor="start">building and improving the software. There are no investors to answer to. Running it yourself is free, and always will be.</text>
<text x="40" y="1540" font-size="12" font-weight="600" fill="#9A3412" text-anchor="start">T6 (g): replaces the cost-recovery paragraph once the owner amends ADR-0014</text>
</svg>
