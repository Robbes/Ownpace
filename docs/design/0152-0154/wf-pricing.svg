<text x="688.8000000000001" y="38" font-size="14" font-weight="500" fill="#374151" text-anchor="end">Home</text>
<text x="40" y="130" font-size="40" font-weight="800" fill="#111827" text-anchor="start">Pricing</text>
<text x="40" y="164" font-size="16" font-weight="400" fill="#374151" text-anchor="start">Published in full. No quote, no sales call. All prices include VAT.</text>
<text x="40" y="206" font-size="13" font-weight="700" fill="#111827" text-anchor="start">How you pay</text>
