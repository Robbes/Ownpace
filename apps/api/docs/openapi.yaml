openapi: 3.1.0

# The managed edition's HTTP surface, as a machine-readable contract.
#
# THIS FILE USED TO BE MARKDOWN. It was named `openapi.yaml`, its first line
# announced "OpenAPI 3.0 specification", and it contained none of `openapi:`,
# `info:` or `paths:` — prose in a spec's clothing, which no client generator,
# validator or agent could read, and which had drifted from the routes it
# described (it documented `PUT /tenants/{id}/members/{id}` while the code
# serves PATCH, and knew nothing of verify, apply-deletions, runs, discovery,
# shared addresses or the permission report). A file that claims to be a
# contract and is not one is worse than no file: it invites somebody to build
# against it.
#
# WHAT IS GUARANTEED HERE. The SURFACE is verified against the Express routers
# — every path, method, parameter and mount point below was read out of
# apps/api/src/routes and is pinned by openapi-spec.unit.test.ts, which fails
# if a documented path has no route or a documented method is not the one the
# code registers.
#
# WHAT IS DELIBERATELY SHALLOW. Response bodies are described precisely where
# the shape is verified (mappings, runs, verification, deletion receipts,
# usage, cost, health, version) and left as open objects where it is not.
# Inventing field names to make a document look complete is the same failure
# this file is being rescued from, one level down: a generated client would
# then be wrong in a way nothing catches. An open object says "there is a
# body, and this spec does not pin its fields yet", which is true.
#
# The full narrative documentation lives in docs/ — the operator runbook, the
# ADRs and the workplans. This file is the contract, not the manual.

info:
  title: Ownpace — managed API
  version: 0.2.0-alpha.1
  summary: Migrate mail, calendar, contacts and files off US cloud, on your own schedule.
  description: |
    The multi-tenant managed edition. Every request is scoped to one tenant by
    the bearer token; the database enforces the same boundary again with
    row-level security, so a token for tenant A cannot read tenant B even if a
    route forgets to filter.

    **Two ideas run through the whole surface and explain most of its shape:**

    - *Nothing consequential happens without a person.* Deleting on the target,
      finishing a migration and moving billing money are gated behind explicit
      evidence, an owner/admin role, or both. Endpoints that could destroy data
      refuse by default and say what is missing.
    - *A failure is reported as itself.* Routes return the reason verbatim
      rather than an empty success. "I found nothing" and "I could not look"
      are different answers and never share a status code.

    Long-running work (sync, cutover, verification, applying a deletion) is
    enqueued, not performed in the request: those endpoints answer `202` with
    an identifier, and a matching read endpoint polls the outcome.

    **A body the API cannot read is the caller's refusal, not a fault of
    ours** (workplan 0093 T2e). It is answered with a `4xx` and no
    reference, and nothing of the body is in the answer or in the log. The
    answer is an `Error`, and its `error` says which:

    - `body_not_json` (`400`): the body is not JSON.
    - `body_too_large` (`413`): the body is too large.
    - `body_encoding_unsupported` (`415`): the body is in a charset or a
      content encoding the API does not read.
    - `body_unreadable`: any other body the parser could not read, with the
      parser's own `4xx` status. A gzip, deflate or br body that does not
      decompress is one of these, answered `400`.

    `POST /api/problem-reports` answers these in its own words, as
    `{ error, reason }`. A `500` is a fault on our side, and its reference
    finds it in the server log.

    A path the API cannot decode is the caller's refusal too (workplan
    0108): a parameter with a malformed escape, such as `%ZZ`, is answered
    `400` with `path_unreadable`, and no reference.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: Ownpace
    url: https://github.com/Robbes/Ownpace

servers:
  - url: https://{host}
    description: A managed deployment. There is no shared public instance — an operator runs their own.
    variables:
      host:
        default: localhost:3001
        description: Host and port of the API service (deploy/compose/managed.yml publishes 3001).

security:
  - bearerAuth: []

tags:
  - name: Service
    description: Liveness, readiness, build identity and metrics. No tenant, no token.
  - name: Account
    description: Who the caller is, and which organisations they may act in. The one authenticated surface that answers before any tenant is resolved.
  - name: Invitations
    description: Answering an invitation to an organisation — join it, refuse it, or leave it for later.
  - name: Access
    description: Asking to be let in, and an operator's half of answering. Invite-only, so the asking is public and the deciding is not.
  - name: Tenants
    description: The tenant record and its members.
  - name: Migrations
    description: Creating, scoping, running and finishing a migration.
  - name: People
    description: |
      The person a migration is for (ADR-0050, amended 2026-09-28): a name,
      and optionally an address, with that person's migrations under it. A
      person has no state of its own, and changes nothing about a migration.
      The appliance answers `GET /people` in the same shapes, with one
      implicit person holding every migration it is configured with.
  - name: Operating
    description: The three decision queues, verification, and applying a deletion.
  - name: Decisions
    description: Drift decisions (§11.2) and the standing answers that resolve them automatically.
  - name: Discovery
    description: What the source holds, and the shared addresses and permissions that do not migrate with it.
  - name: Billing
    description: Usage, cost, invoices and payment methods. Owner/admin only, reads included.
  - name: Webhooks
    description: Called by the payment provider, not by clients.
  - name: Support
    description: |
      What a platform operator may see of a customer, to answer them when they
      ask. Metadata only, read-only, and every read is recorded — the views
      behind these operations decide who is an operator, not the API.
  - name: Platform
    description: |
      Facts about the platform itself rather than about a customer. Read by
      anyone signed in, because they explain a customer's own screen; written
      only by an operator, and the database is what decides that.
  - name: Reports
    description: |
      "Report a problem" (workplan 0130): a signed-in customer's report,
      delivered as a ticket on the owner's own Zammad, whose reply reaches the
      customer by email. Without a Zammad, the same report goes as one mail to
      the support mailbox (`REPORT_MAIL_TO`, else `NOTIFY_TO`) through the API's
      own relay, with the customer as its Reply-To (the owner, for the alpha,
      2026-09-28). Offered only when one of the two is set up; a Zammad wins.

paths:
  /health:
    get:
      tags: [Service]
      summary: Liveness
      description: Answers as soon as the process is serving. Does not check the database.
      security: []
      responses:
        '200':
          description: The service is up.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /api/health:
    get:
      tags: [Service]
      summary: Liveness (same-origin path)
      description: |
        Identical to `/health`. Exists because the web front proxies `/api` to
        this service, so a browser checking health same-origin needs the
        prefixed path.
      security: []
      responses:
        '200':
          description: The service is up.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /version:
    get:
      tags: [Service]
      summary: Which build is running
      description: |
        Version and commit, so "what are you running" has an answer during a
        support conversation. The commit is stamped into the image at build
        time; a hand-built image that was not given one reports `unknown`
        rather than guessing.
      security: []
      responses:
        '200':
          description: The running build.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Version' }

  /api/version:
    get:
      tags: [Service]
      summary: Which build is running (same-origin path)
      security: []
      responses:
        '200':
          description: The running build.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Version' }

  /api/auth/mode:
    get:
      tags: [Service]
      summary: Which credential this API will accept
      description: >
        Read by the sign-in page before anybody has a credential, so it can
        offer the one this deployment will actually take. `acceptsSeedToken` is
        false whenever `JWT_ISSUER` is set: managed mode verifies against the
        provider's JWKS and never falls back to `JWT_SECRET`, which is what a
        seed token is signed with. Unauthenticated for the same reason
        `/health` is — it is asked by somebody who has nothing to authenticate
        with yet, and it discloses only what the sign-in page already shows.
      security: []
      responses:
        '200':
          description: How this deployment signs people in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthMode' }

  /metrics:
    get:
      tags: [Service]
      summary: Prometheus metrics
      description: |
        Process and migration counters in Prometheus text format. Deliberately
        without per-tenant dashboards or alert rules: thresholds chosen before
        there is traffic to measure would be guesses wearing the costume of a
        service level.
      security: []
      responses:
        '200':
          description: Metrics in Prometheus exposition format.
          content:
            text/plain:
              schema: { type: string }

  /ready:
    get:
      tags: [Service]
      summary: Readiness — can this instance actually serve
      description: |
        Unlike `/health`, this one can fail. It checks the database through the
        **same pool the request path uses** (PgBouncer included, when one is in
        front), so it proves the route customers take rather than a different
        one that happens to work, and it checks that the sign-in issuer is
        answering at its discovery document.

        **`503` only when the database is down**, because that is the only
        check whose absence means no request can be served at all. A sign-in
        outage is `degraded` and still `200`: the API IS serving the people
        already inside it, and a load balancer that pulled it from rotation
        would turn a partial problem into a total one.

        The body publishes STATES, never reasons — an unauthenticated endpoint
        that reported *why* the database was unreachable would be describing
        internal topology to anybody who asked. The reason goes to the log.
      security: []
      responses:
        '200':
          description: Serving. `status` is `ok`, or `degraded` when something non-fatal is down.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '503':
          description: The database is unreachable, so nothing can be served.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }

  /api/ready:
    get:
      tags: [Service]
      summary: Readiness (same-origin path)
      description: |
        Identical to `/ready`, prefixed for the same reason `/api/health` is:
        the web front proxies `/api` to this service.
      security: []
      responses:
        '200':
          description: Serving, possibly degraded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '503':
          description: The database is unreachable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }

  /api/ready/scheduler:
    get:
      tags: [Service]
      summary: Did the sync tick run lately
      description: |
        A sibling of `/api/ready`, not a field of it (workplan 0142 T2). A tick
        that stopped does not stop this service serving a customer; it stops
        every migration from moving, and nothing else says so.

        `up` when `managed-sync-tick` completed a run in the last five minutes,
        `down` when it did not or its beat cannot be read, and `off` where no
        orchestrator is configured, so no tick runs. States, never reasons: the
        reason goes to the log. Always `200`, because the API is serving; a page
        reads the body. Also served at `/ready/scheduler`.
      security: []
      responses:
        '200':
          description: The tick's state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchedulerReadiness' }

  /ready/scheduler:
    get:
      tags: [Service]
      summary: Did the sync tick run lately (unprefixed path)
      description: |
        Identical to `/api/ready/scheduler`, served beside `/ready` for the same
        reason `/ready` is.
      security: []
      responses:
        '200':
          description: The tick's state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchedulerReadiness' }

  /api/me:
    get:
      tags: [Account]
      summary: Who am I, and where may I go
      description: |
        **This route REPORTS rather than refuses**, which is what makes it
        different from every other authenticated endpoint. They resolve a
        tenant and refuse what they cannot decide; this one exists precisely to
        answer *"these two, currently neither"* without a `400`, because a
        client handles that by asking a person.

        A subject who belongs to nothing is a normal, documented state — the
        first sign-in after self-registration, or before a grant. It answers
        with an empty `tenants` and no `tenantId`.

        It also has one side effect: **an invitation is claimed here.** When the
        caller belongs to nothing, a `tenant_member` row addressed to their
        email and still carrying a `pending:` placeholder is bound to their
        subject — but only against an address the issuer says it VERIFIED,
        since otherwise whoever registers an address inherits what was granted
        to it.
        While the deployment asks for acceptance (`OWNPACE_STAGE=alpha`, and
        no text still a draft; workplan 0139 T3) and an organisation is
        current, `acceptance` says which texts wait to be accepted, each with
        its current version.
      responses:
        '200':
          description: The caller, their memberships, and which one they are currently acting as.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/me/acceptance:
    post:
      tags: [Account]
      summary: Accept the current version of each text
      description: |
        The terms, the Alpha conditions and the privacy policy, at their
        current versions, in the language the screen showed them (workplan
        0139 T3). One row per text, with its version, the language and the
        time, for this caller in the organisation they are acting as. Pressed
        again, nothing is written and the first time stays.

        **Only the current versions.** A body naming any other version writes
        nothing and answers 409 `version_not_current`, so a page left open
        across an update cannot accept a text nobody shows any more.

        **Only while the deployment asks** (`OWNPACE_STAGE=alpha`, and no text
        still a draft). Otherwise nothing is written and the answer is 409
        `acceptance_not_asked`. A draft's number is the one its final text will
        carry, so an acceptance of the draft would be recorded as one of the
        final text, whose words may still change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptanceRequest' }
      responses:
        '200':
          description: Recorded, or already recorded. The acceptance as `GET /api/me` now reports it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptanceRecorded' }
        '400':
          description: A body that does not name every text, or names a language the texts are not in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: |
            Nothing was written. `version_not_current` (`VersionNotCurrent`): a
            version that is not the current one. Or `acceptance_not_asked`
            (`AcceptanceNotAsked`): this deployment asks nobody at the moment.
          content:
            application/json:
              schema:
                anyOf:
                  - { $ref: '#/components/schemas/VersionNotCurrent' }
                  - { $ref: '#/components/schemas/AcceptanceNotAsked' }

  /api/invitations/{tenantId}/accept:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      tags: [Invitations]
      summary: Join the organisation that invited you
      description: |
        Binds this subject to the invitation and makes the membership active.

        **Only ever one organisation.** Until workplan 0099 this happened
        implicitly for ALL of them, on the way through `/api/me` — reading your
        own account joined you to things, and there was no moment at which
        anybody could decline. Accepting is now something a person does, once,
        on purpose.

        Authorised by policy, not by this route (migration 0006). The row must
        be an open invitation addressed to the address in `app.current_email`,
        which is set only when the issuer asserted `email_verified: true`, and
        what the row may BECOME is pinned too — so this cannot be turned into
        "set somebody else's user id".
      responses:
        '200':
          description: Joined.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationAnswer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: |
            No open invitation for this caller there — or one they cannot see.
            The same answer on purpose: distinguishing them would tell anybody
            who asked whether an address has an invitation at an organisation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/invitations/{tenantId}/decline:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      tags: [Invitations]
      summary: Refuse the invitation, and stay unlinked to it
      description: |
        Marks the invitation `declined`. **It does not bind your subject**, and
        that is enforced by policy rather than by this route: accepting records
        who joined because that is what joining means, while a refusal must not
        leave a permanent link between a person and an organisation they said no
        to, in a table that organisation's operator can read. What the row
        records afterwards is that the ADDRESS was invited and refused.

        The same check is what stops this statement being used as a weapon:
        without it, `status='declined', user_id='<somebody else>'` would create a
        row that permanently blocks a chosen person from ever joining a chosen
        organisation, since membership is unique per (organisation, subject).

        **There is no "skip" endpoint**, deliberately. Leaving an invitation
        unanswered is the absence of a decision, not a state — the row stays
        `invited` and `GET /api/me` offers it again.
      responses:
        '200':
          description: Refused, and the record says so without naming you.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationAnswer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No open invitation for this caller there — or one they cannot see.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/access-requests:
    post:
      tags: [Access]
      summary: Ask to be let in
      description: |
        **Unauthenticated and it WRITES**, which is the whole of its risk. Five
        things carry that: the table grants `app_user` INSERT and nothing else;
        every stored field is length-capped before the insert; a refusing rate
        limit sized as a service-wide cap (without `TRUST_PROXY` every caller
        shares the ingress's address); a field people leave empty (`website`,
        below); and **the response is identical whatever happens**.

        That last one is deliberate. It never says whether an address is
        already known, already granted, or new — a public endpoint that
        distinguishes those is an account-enumeration oracle. It is also
        honest: from the asker's side all of those genuinely are *"we have it,
        a person will read it"*.

        It holds no credentials and nothing about a mailbox. `tier` is
        indicative only — a tier is DERIVED from what actually runs, never
        picked.

        `website` is a field people leave empty; the form hides it from them.
        A request that fills it gets the same `201`, but nothing is stored and
        no mail is sent (workplan 0093 T2d). The rate limit counts it first,
        like any other request.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessRequestCreate' }
      responses:
        '201':
          description: Received. Says nothing about the address, and is the same for a request that filled `website` — see above.
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: boolean, enum: [true] }
                  message: { type: string }
                required: [received, message]
        '400': { $ref: '#/components/responses/BadRequest' }
        '429':
          description: More requests than expected from one place. Carries `Retry-After`.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds to wait.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [Access]
      summary: The queue an operator works
      description: |
        Open first, oldest first within that — the queue is worked from the
        top, and somebody who asked on Monday should not sit behind somebody
        who asked on Friday. No filter shows everything, which is what makes a
        decision reviewable afterwards.

        **Nothing in this route authorises the caller.** Policies on
        `access_request` do: the rows are invisible unless `app.current_user`
        names a row in `platform_operator`, enforced against the role the API
        really connects as. So a non-operator gets `200` and an empty list,
        because to the database that is exactly what is there.
      parameters:
        - name: state
          in: query
          required: false
          description: Narrow to one state. Anything else is a `400` naming the three.
          schema: { type: string, enum: [open, granted, declined] }
      responses:
        '200':
          description: The queue. Empty for a non-operator, and that is not an error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items: { $ref: '#/components/schemas/AccessRequest' }
                required: [requests]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/access-requests/{id}/grant:
    parameters:
      - $ref: '#/components/parameters/AccessRequestId'
    post:
      tags: [Access]
      summary: Say yes, and mean it
      description: |
        **Granting is not a flag.** It creates the organisation and its first
        owner in the SAME transaction that marks the request granted, because
        the three facts are one fact: a tenant nobody asked for, or a request
        pointing at an organisation that does not exist, are both worse than a
        failure.

        The owner row is an **invitation, not a member**. The person has not
        signed in yet and there is no way to know their subject before they do;
        inventing one keyed on their email would mean anybody who can create an
        account with that address gets the organisation. `GET /api/me` binds it
        on first sign-in, against a verified address only.

        The email is sent **after the commit and outside it**. A mail server
        being down must not roll back an organisation that was correctly
        created — and equally the mail must only ever describe something that
        actually happened. `notified` comes back because *"nobody was told"*
        means the manual step is back and the operator is the only one who can
        take it.

        A `404` here means *invisible or absent*, deliberately not
        distinguished: a non-operator must not be able to tell whether an id
        exists.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrantDecision' }
      responses:
        '201':
          description: The organisation exists and the invitation is waiting.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrantResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No such request — or one this caller cannot see. The same answer on purpose.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Already decided. Deciding twice would create a second organisation or lose the first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/access-requests/{id}/decline:
    parameters:
      - $ref: '#/components/parameters/AccessRequestId'
    post:
      tags: [Access]
      summary: Say no, and keep the record
      description: |
        No tenant, and **the row is not deleted** — `access_request` has no
        DELETE grant for anybody, so a refusal cannot be made to disappear
        afterwards. That is the queue's whole value as a record.

        The person is emailed unless `notify` is `false`. That flag exists on
        this decision and not on granting, and the asymmetry is the point: an
        unannounced grant is one the person can never use, so there is nothing
        to opt out of, while the form answered here is PUBLIC and rate-limited,
        and mailing a refusal to a forged address means mailing a stranger who
        never wrote to us. It defaults to `true` so silence is chosen rather
        than fallen into.

        **The email carries no reason and never the decision note.** The
        operator's note is labelled *"not for them"* on the screen that
        collects it, and the event type behind this mail has no fields at all,
        so there is nothing to leak through.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeclineDecision' }
      responses:
        '200':
          description: Declined, and the record stands.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeclineResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No such request — or one this caller cannot see.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Already decided.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/tenants:
    get:
      tags: [Tenants]
      summary: List the tenants this token may see
      responses:
        '200':
          description: The caller's tenants.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Tenants]
      summary: Create a tenant — NOT AVAILABLE HERE
      description: |
        Always `501`. Tenant creation is a cross-tenant bootstrap operation and
        cannot run through a tenant-scoped request: the RLS insert policy
        requires the new row's id to equal the current tenant, which a freshly
        created tenant never satisfies. Documented rather than hidden, because
        the honest refusal is the contract — tenants are provisioned by the
        onboarding/seed path.
      responses:
        '501':
          description: Not implemented, with the reason and the path that does work.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/tenants/{tenantId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Tenants]
      summary: Get one tenant
      responses:
        '200':
          description: The tenant.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Tenants]
      summary: Update a tenant's name or settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 255 }
                settings: { type: object }
      responses:
        '200':
          description: The updated tenant.
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Tenants]
      summary: Retired — close the account instead
      description: |
        Gone since workplan 0085. This did a hard delete that cascaded
        twenty-five tables, `invoice` and `audit_log` among them, behind one
        call with no confirmation and no way back — destroying billing records
        that tax law requires be kept.

        It answers 410 naming the replacement rather than 404, so a caller that
        has not been updated is told where to go instead of seeing what looks
        like a routing bug.
      responses:
        '410':
          description: Retired. Use POST /api/tenants/{tenantId}/close.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/tenants/{tenantId}/close:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      tags: [Tenants]
      summary: End the service for this tenant
      description: |
        Stops syncs and billing immediately and makes the account read-only,
        then schedules the erasure for the window the customer chose.

        **Closed is not deleted.** Until `purgeAfter` passes the close can be
        undone with `/reopen`; a window of 0 cannot, and says so.

        The response carries `outlivingAccess` — everything that keeps working
        after the erasure and only the customer can end. Two kinds, and both
        matter: the **permissions** granted in their own provider consoles, and
        the **app passwords** they gave us, which keep authenticating after we
        delete our copy. We can name them and say where; we cannot remove them.
        (`standingGrants` is the older field covering only the permissions.)

        **Two dates, not one.** `purgeAfter` is when the live service stops
        holding the data. `backupsExpireAt` is when the last backup that could
        still contain it ages out — a further `backupRetentionDays` — and that
        is when the erasure actually completes. `erasureCompletesText` is the
        same thing as a sentence, in both languages, for showing to the
        customer. Backups are not edited retrospectively; they expire.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [windowDays]
              properties:
                windowDays:
                  type: integer
                  enum: [0, 7, 30, 90]
                  description: Days before the erasure runs. 0 cannot be undone.
      responses:
        '200':
          description: Closed, with the purge scheduled.
          content:
            application/json:
              schema:
                type: object
                required:
                  [status, purgeAfter, windowDays, backupsExpireAt, backupRetentionDays]
                properties:
                  status: { type: string, enum: [closed] }
                  purgeAfter:
                    type: string
                    format: date-time
                    description: When the live database stops holding this tenant's data.
                  windowDays: { type: integer, enum: [0, 7, 30, 90] }
                  backupsExpireAt:
                    type: string
                    format: date-time
                    description: >-
                      When the last backup that could contain this tenant's data
                      ages out — i.e. when the erasure completes.
                  backupRetentionDays:
                    type: integer
                    description: This deployment's backup retention window, in days.
                  erasureCompletesText:
                    type: object
                    description: The same promise as a sentence, for showing to the customer.
                    properties:
                      en: { type: string }
                      nl: { type: string }
                  canReopenUntil:
                    type: [string, 'null']
                    format: date-time
                    description: Null when the window was 0 — an immediate close cannot be undone.
                  standingGrants:
                    type: array
                    description: >-
                      Superseded by outlivingAccess; kept for existing callers.
                      Covers the OAuth consents only.
                    items: { type: object }
                  outlivingAccess:
                    type: object
                    description: >-
                      Everything that keeps working after the erasure, in both
                      languages: the consents sitting in the customer's provider
                      consoles AND the app passwords sitting in their own
                      accounts. Credentials come first — a consent is a
                      permission sitting unused, a live app password is a
                      working way in.
                    properties:
                      en: { type: array, items: { type: object } }
                      nl: { type: array, items: { type: object } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/tenants/{tenantId}/reopen:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      tags: [Tenants]
      summary: Undo a close while the window is still open
      description: |
        The reason the staged flow exists: a mistaken click, a resolved
        dispute, or a bug in the purge spotted before it ran. Refuses with 409
        once the window has passed — there is nothing to come back to.
      responses:
        '200':
          description: The tenant is active again.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Not closed, or the window has already passed.
          content:
            application/json:
              schema: { type: object }

  /api/tenants/{tenantId}/notifications:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    put:
      tags: [Tenants]
      summary: Set this tenant's digest cadence
      description: |
        How often this tenant's owners and admins are mailed the "what needs
        attention" digest — daily, weekly, or off. A summary with nothing in it
        is never sent; silence means nothing is waiting.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: The stored preference.
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/tenants/{tenantId}/contact:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    put:
      tags: [Tenants]
      summary: Set or clear the organisation's phone number
      description: |
        Optional. Shown on the grant page to the people this organisation asks
        (workplan 0108 T8a), so they can call to check who is asking. Only a
        phone number's characters are accepted — digits, spaces and
        `+ ( ) - . /`, with 6 to 15 digits — because the grant page is the one
        screen a stranger could dress up. `null` or an empty string clears it.
        Owner or admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, nullable: true }
      responses:
        '200':
          description: The number as stored, or null when cleared.
          content:
            application/json:
              schema:
                type: object
                properties:
                  contact:
                    type: object
                    properties:
                      phone: { type: string, nullable: true }
        '400':
          description: |
            Not a phone number (`not_a_phone_number`), or not `{ phone }`
            (`invalid_body`). `message` and `reason` carry the sentence.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/tenants/{tenantId}/members:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Tenants]
      summary: List members
      responses:
        '200':
          description: The tenant's members.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Tenants]
      summary: Invite a member
      description: |
        A second invitation for an address that already has a live row is
        refused with `409` naming that row, rather than quietly creating a
        duplicate whose role nobody can predict.

        During the alpha the role is `owner` or `admin` (workplan 0137 T7);
        any other role, sent as a string in an otherwise valid body, answers
        `400` with `error: owner_or_admin_only`. A body with no role, or with
        something else wrong as well, answers the usual `Validation error`
        with every issue in `details`. Only an owner may invite somebody as
        owner (`403` for an admin).

        The invited address is mailed after the row commits (workplan 0156
        T3): who invited them to which organisation, where to sign in and
        the address to sign in with, never a token. `notified` says what
        became of the mail: `sent`; `off` when this deployment sends no mail
        or has no `WEB_URL`; `failed`; or `limited` past 20 invitation mails
        a day for the organisation. The invitation stands whatever it says.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '201':
          description: The invited member, with `notified`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  notified: { type: string, enum: [sent, off, failed, limited] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: An invited or active row for this address already exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/tenants/{tenantId}/members/{memberId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: memberId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Tenants]
      summary: Get one member
      responses:
        '200':
          description: The member.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Tenants]
      summary: Change a member's role
      description: |
        Owner/admin only. Only an owner may make somebody an owner or change
        an owner's role, an invitation as owner included; an admin gets `403`
        (workplan 0137 T3). The last active owner cannot be demoted (`400`,
        `Cannot demote the last owner`). Only active owners count: an
        invitation as owner, or a declined one, is not a second owner. The
        count and the change are one transaction with the owner rows locked,
        so two owners demoting each other at once cannot both succeed.

        During the alpha the new role is `owner` or `admin` (workplan 0137
        T7); any other role sent as a string answers `400` with
        `error: owner_or_admin_only`, and a body with no role answers
        `Validation error`. A row that already holds `member` or `viewer`
        keeps it until it is changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [owner, admin] }
      responses:
        '200':
          description: The updated member.
          content:
            application/json:
              schema: { type: object }
        '400':
          description: |
            Refused: this change would leave the tenant without an active owner
            (`Cannot demote the last owner`), or the body is not valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: |
            Not an owner or admin, or an admin granting the owner role or
            changing an owner's role.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Tenants]
      summary: Remove a member, or withdraw an invitation
      description: |
        Owner/admin only. Nobody removes themselves. Only an owner may remove
        an owner, or withdraw an invitation as owner; an admin gets `403`
        (workplan 0137 T3). The last active owner cannot be removed, and an
        owner may still withdraw an invitation as owner or remove a declined
        one. The guards, the removal and its `member.removed` audit record are
        one transaction with the owner rows locked.
      responses:
        '204': { description: Removed. }
        '400':
          description: |
            Refused: `Cannot remove yourself from the tenant`, or
            `Cannot remove the last owner`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Not an owner or admin, or an admin removing an owner.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/tenants/{tenantId}/members/{memberId}/resend:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: memberId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Tenants]
      summary: Mail an open invitation again
      description: |
        Owner/admin only (workplan 0156 T3). Only an invitation made on the
        Team page that is still open; a member who joined or declined, or a
        granted access request, answers `409`. At most once in ten minutes
        per invitation (`429` with `Retry-After`), and within the
        organisation's 20 invitation mails a day (`notified: limited`).
      responses:
        '200':
          description: What became of the mail.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  notified: { type: string, enum: [sent, off, failed, limited] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: No open invitation of this page to send again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Mailed less than ten minutes ago; `Retry-After` says when it may be sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/migrations/google-drive/shared-drives:
    post:
      tags: [Migrations]
      summary: List the shared drives a Google credential can see
      description: |
        Read-only (`drives.list`), for the wizard's rootFolderId "browse".
        Credentials travel in the request like test-connection's; nothing is
        stored. A provider refusal is an answer (`{ok:false, reason}`),
        verbatim.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId, clientSecret, refreshToken]
              properties:
                clientId: { type: string }
                clientSecret: { type: string, writeOnly: true }
                refreshToken: { type: string, writeOnly: true }
      responses:
        '200':
          description: The drives, or the refusal.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  drives:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                  reason: { type: string }
        '400': { description: The three credential fields were not all present. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/migrations/google-drive/shared-folders:
    post:
      tags: [Migrations]
      summary: List the folders other accounts shared with a Google credential
      description: |
        Read-only (`files.list` over the shared-with-me view, folders only),
        the second half of the rootFolderId "browse": a shared folder migrates
        by rooting a mapping at its id. Credentials travel like
        shared-drives'; nothing is stored. A provider refusal is an answer
        (`{ok:false, reason}`), verbatim.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId, clientSecret, refreshToken]
              properties:
                clientId: { type: string }
                clientSecret: { type: string, writeOnly: true }
                refreshToken: { type: string, writeOnly: true }
      responses:
        '200':
          description: The folders (owner address included when Drive names one), or the refusal.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  folders:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        owner: { type: string }
                  reason: { type: string }
        '400': { description: The three credential fields were not all present. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/migrations/dropbox/shared-folders:
    post:
      tags: [Migrations]
      summary: List the shared folders a Dropbox credential can see
      description: |
        Read-only (`sharing/list_folders`), Dropbox's turn at the rootPath
        "browse". A MOUNTED folder answers with the path that goes in
        `rootPath`; an unmounted one is listed without a path — mounting
        happens in Dropbox itself. The trio keys are the shared OAuth shape
        (Dropbox's App Console calls the first two "App key" and
        "App secret"); nothing is stored. Needs the `sharing.read` scope —
        an app without it gets Dropbox's refusal verbatim
        (`{ok:false, reason}`).

        The pair is optional as a whole (ADR-0041): absent, the deployment's
        own Dropbox app is used (`DROPBOX_OAUTH_CLIENT_ID`/`_SECRET`); half a
        pair is refused `half_client_pair`, and no app at all
        `no_dropbox_client` — the consent route's own answers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                clientId: { type: string }
                clientSecret: { type: string, writeOnly: true }
                refreshToken: { type: string, writeOnly: true }
      responses:
        '200':
          description: The shared folders (path present only when mounted), or the refusal.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  folders:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        path: { type: string }
                  reason: { type: string }
        '400': { description: The three credential fields were not all present. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/migrations/google/authorize:
    post:
      tags: [Migrations]
      summary: Start a Google consent — Connect with Google
      description: |
        Returns the URL to send a browser to, plus the redirect URI Google must
        have registered — a wrong one fails at Google's screen, so the caller is
        given the exact string to register.

        **Whose client** (ADR-0041). The caller's whole pair (`clientId`,
        `clientSecret`) wins; with neither sent, the deployment's own client
        (`GOOGLE_OAUTH_CLIENT_ID`/`GOOGLE_OAUTH_CLIENT_SECRET`) is used, so a
        deployment that configured one asks nobody for a secret. Half a pair is
        refused before anything is begun: the missing half would come from a
        different application, and Google would refuse the mix at its token
        endpoint hours later, from a sync pass.

        **Two shapes, and the ask is exactly what was named.** `sourceType` is
        one Google source and one scope: nothing can widen a Gmail consent into
        Drive. `domains` is the ACCOUNT ask (workplan 0106 T3b) — one Google
        connection wearing several faces, and the scope string is built from the
        ticks and from nothing else. Neither shape has a default: an empty tick
        set is refused rather than substituted, because a fallback would be a
        way to ask for something nobody ticked.

        A `google` account connection serves **calendar, contact and task**
        (tasks over Google's Tasks API, `tasks.readonly`, since workplan 0126).
        Mail and files need scopes Google classes as restricted — an annual
        third-party security assessment for the whole application, including
        customers who only wanted contacts — so a tick for either is
        **refused**, naming the single-purpose `gmail` or `google-drive` source
        that still serves it. A silent narrowing would be worse: somebody
        approves a screen showing three faces, believing they ticked five.

        The consent is asked **incrementally** (`include_granted_scopes`), which
        is not optional once the ask is narrow: Google replaces a grant with
        exactly what the latest consent named, so a person who consented to mail
        and then to calendar would otherwise be left with calendar only.

        The client secret is held in process memory keyed by a signed,
        single-use, ten-minute `state` and is never in a URL. An appliance
        reached at a raw IP is refused here rather than at Google's screen,
        because a redirect URI cannot be an IP address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clientId: { type: string, description: The caller's own OAuth client ID. Both halves or neither. }
                clientSecret: { type: string, writeOnly: true, description: Its secret. Both halves or neither. }
                sourceType:
                  type: string
                  description: The single-purpose ask. Mutually exclusive with `domains`.
                  enum: [gmail, google-calendar, google-contacts, google-drive]
                domains:
                  type: array
                  description: |
                    The account ask: which faces of one Google account to
                    consent to. Mutually exclusive with `sourceType`.

                    All five since workplan 0126: `task` asks
                    `tasks.readonly`, for Google's Tasks API. Google's CalDAV
                    carries no VTODO, so the face is not a CalDAV one.
                  items:
                    type: string
                    enum: [email, calendar, contact, file, task]
                locale:
                  type: string
                  enum: [en, nl]
                  description: |
                    The language the page was in when the button was pressed,
                    so the page the provider sends the person back to is in it
                    too (workplan 0145 T6). Recorded on the pending consent and
                    never put in the redirect; anything else, or nothing, is
                    English.
              oneOf:
                - required: [sourceType]
                - required: [domains]
      responses:
        '200':
          description: Where to send the browser, and what Google must have registered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  redirectUri: { type: string }
                  scope:
                    type: string
                    description: |
                      Space-joined, in a stable order — the same tick set always
                      produces the same string, so a person can recognise it as
                      the request they approved yesterday. Always identical to
                      the URL's own `scope` parameter.
                  domains:
                    type: array
                    description: |
                      What was asked for, echoed back in the same order as
                      `scope`. Present only for the account ask; for a
                      `sourceType` ask the source already said it.
                    items: { type: string }
        '400':
          description: |
            `invalid_body` (neither shape), `half_client_pair` (one half of a
            client pair), `no_google_client` (nothing sent and nothing
            configured, naming both ways forward), `no_domains_ticked` (an
            empty tick set), `unknown_domain` (not one of the five),
            `not_on_this_account` (a face this account kind does not serve,
            naming the source that does), `raw_ip_callback` or
            `unreachable_callback`.
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/migrations/google/callback:
    get:
      tags: [Migrations]
      summary: Where Google returns the person's browser
      description: |
        Public by nature and trusted by nothing except the signed, single-use,
        expiring `state`. Answers an HTML page, not JSON — it is a browser
        destination, not a client endpoint, and no client should call it.

        Absent, forged, expired and already-used states get one sentence
        between them, because distinguishing them would teach a forger which
        part failed.

        A consent begun from a grant link stores the refresh token only when
        the account that signed in, as Google's ID token names it, is the one
        the migration reads (workplan 0108 T8 (b)). Any other account is
        refused with both addresses named, nothing is stored, and the link is
        left unspent.

        On a grant link, every ending that did not reach the link (Google's
        own error, no code, a failed code exchange, or a fault storing the
        token) is worded for the person on the link, not for the owner, and
        says the link was not used up. Only a link that can no longer be used
        tells them to ask for a fresh one. The owner's sentence for a failed
        exchange goes to the server log.
      security: []
      parameters:
        - { name: state, in: query, schema: { type: string } }
        - { name: code, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        '200':
          description: The result page — granted, or Google's own refusal (the link, if any, not used up).
          content:
            text/html:
              schema: { type: string }
        '400':
          description: |
            No state this server is waiting for, no authorization code, or a
            code exchange Google refused. On a grant link, the link was not
            used up.
          content:
            text/html:
              schema: { type: string }
        '403':
          description: |
            A grant link's consent, signed in with an account other than the one
            the migration reads, or with none Google would name. Nothing was
            stored and the link still works.
          content:
            text/html:
              schema: { type: string }
        '409':
          description: |
            A grant link's consent, on a link that can no longer be used, or
            for an organisation that was closed after the consent began
            (workplan 0085 T2): refused before the code is exchanged, and the
            link is not used up. Nothing was stored.
          content:
            text/html:
              schema: { type: string }
        '500':
          description: |
            Storing the granted token failed on our side. Nothing was stored,
            and on a grant link the link was not used up.
          content:
            text/html:
              schema: { type: string }

  /api/migrations/dropbox/authorize:
    post:
      tags: [Migrations]
      summary: Start a Dropbox consent — Connect with Dropbox
      description: |
        The Google consent's shape, for Dropbox (2026-09-02). Returns the URL
        to send a browser to, plus the redirect URI the Dropbox app must have
        registered (App Console → Settings → OAuth 2 → Redirect URIs) — a wrong
        one fails at Dropbox's screen, so the caller is given the exact string.

        **Whose app.** The caller's whole pair (App key as `clientId`, App
        secret as `clientSecret`) wins; with none sent, the deployment's own
        app (`DROPBOX_OAUTH_CLIENT_ID`/`DROPBOX_OAUTH_CLIENT_SECRET`, both or
        neither) is used; half a pair is refused before anything is begun.

        **The read scopes on the URL** (workplan 0140 T7 (b)). The URL asks for
        `files.metadata.read` and `files.content.read`, which a migration reads
        with, and `account_info.read`, which the Test's space usage needs, and
        nothing else, whichever app it runs on: as Dropbox documents `scope`, a
        subset of the app's permissions that cannot widen them.
        `token_access_type=offline` is pinned, since without it Dropbox mints
        no refresh token. The secret never appears in the URL.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                clientId: { type: string, description: The App key. }
                clientSecret: { type: string, description: The App secret. }
                locale:
                  type: string
                  enum: [en, nl]
                  description: |
                    The language the page was in when the button was pressed,
                    so the page the provider sends the person back to is in it
                    too (workplan 0145 T6). Recorded on the pending consent and
                    never put in the redirect; anything else, or nothing, is
                    English.
      responses:
        '200':
          description: Where to send the browser, and the address Dropbox must have registered.
          content:
            application/json:
              schema:
                type: object
                required: [url, redirectUri]
                properties:
                  url: { type: string }
                  redirectUri: { type: string }
        '400':
          description: |
            `invalid_body`, `half_client_pair` (one half of an App key pair),
            `no_dropbox_client` (nothing sent and nothing configured, naming
            both ways forward), `raw_ip_callback` or `unreachable_callback`.
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/migrations/dropbox/callback:
    get:
      tags: [Migrations]
      summary: Where Dropbox returns the person's browser
      description: |
        Public by nature and trusted by nothing except the signed, single-use,
        expiring `state` — and only a state begun at the Dropbox door: one
        begun at Google's is "not one the wizard is waiting for" here, and
        spent. Answers an HTML page under its own headers that hands the
        refresh token to the opening window as `ownpace-dropbox-consent`; a
        grant missing a read scope is refused with the missing one named, and
        one carrying a scope outside the three the URL asks for and
        `sharing.read` is refused with that scope named and nothing stored.
      security: []
      parameters:
        - { name: state, in: query, schema: { type: string } }
        - { name: code, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
        - { name: error_description, in: query, schema: { type: string } }
      responses:
        '200':
          description: The result page — granted, or Dropbox's own refusal.
          content:
            text/html:
              schema: { type: string }
        '400':
          description: No state this server is waiting for, no authorization code, a grant a migration cannot run on, or a grant carrying a scope this product does not read with.
          content:
            text/html:
              schema: { type: string }

  /api/migrations/microsoft/authorize:
    post:
      tags: [Migrations]
      summary: Start a Microsoft consent — Connect with Microsoft
      description: |
        The Google consent's shape, for Microsoft (workplan 0114). Returns the
        URL to send a browser to, plus the redirect URI the app registration
        must have registered (Entra → App registrations → Authentication →
        Redirect URIs) — a wrong one fails at Microsoft's screen, so the caller
        is given the exact string.

        **Whose registration.** The caller's whole pair (`clientId`,
        `clientSecret`) wins, and their own `tenantId` travels with it; with
        none sent, the deployment's own registration
        (`MICROSOFT_OAUTH_CLIENT_ID`/`MICROSOFT_OAUTH_CLIENT_SECRET`, both or
        neither) is used against `MICROSOFT_OAUTH_TENANT` (default `common`).
        Half a pair is refused before anything is begun.

        **The scopes come from `domains`.** Exactly the faces asked for, so the
        consent screen and the ticks cannot disagree; an empty set is refused
        rather than defaulted. `offline_access` is a SCOPE here rather than a
        parameter — without it Microsoft mints no refresh token — and
        `prompt=select_account` is pinned so a person already signed in to the
        wrong account cannot grant it silently. Every scope is read-only. The
        secret never appears in the URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domains]
              properties:
                domains:
                  type: array
                  minItems: 1
                  items: { type: string, enum: [email, calendar, contact, file, task] }
                  description: |
                    Which faces to consent for; each maps to one Graph read
                    scope. `task` is Microsoft To Do, asked as `Tasks.Read`.
                clientId: { type: string, description: The Application (client) ID. }
                clientSecret: { type: string, description: The client secret. }
                tenantId:
                  type: string
                  description: The directory, when this caller brings their own registration.
                locale:
                  type: string
                  enum: [en, nl]
                  description: |
                    The language the page was in when the button was pressed,
                    so the page the provider sends the person back to is in it
                    too (workplan 0145 T6). Recorded on the pending consent and
                    never put in the redirect; anything else, or nothing, is
                    English.
      responses:
        '200':
          description: Where to send the browser, and the address the registration must carry.
          content:
            application/json:
              schema:
                type: object
                required: [url, redirectUri]
                properties:
                  url: { type: string }
                  redirectUri: { type: string }
        '400':
          description: |
            `invalid_body`, `half_client_pair` (one half of a client pair),
            `no_microsoft_client` (nothing sent and nothing configured, naming
            both ways forward), `raw_ip_callback` or `unreachable_callback`.
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/migrations/microsoft/callback:
    get:
      tags: [Migrations]
      summary: Where Microsoft returns the person's browser
      description: |
        Public by nature and trusted by nothing except the signed, single-use,
        expiring `state` — and only a state begun at the Microsoft door: one
        begun at Google's is "not one the wizard is waiting for" here, and
        spent. The code is exchanged at the SAME directory the authorize half
        used, carried on that state rather than recomputed. Answers an HTML
        page under its own headers that hands the refresh token to the opening
        window as `ownpace-microsoft-consent`.

        An `AADSTS` refusal is rendered as a sentence rather than a code: a
        tenant may require an administrator to approve the application, or
        forbid user consent entirely, and neither is something the person can
        fix by trying again.
      security: []
      parameters:
        - { name: state, in: query, schema: { type: string } }
        - { name: code, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
        - { name: error_description, in: query, schema: { type: string } }
      responses:
        '200':
          description: The result page — granted, or Microsoft's own refusal in words.
          content:
            text/html:
              schema: { type: string }
        '400':
          description: No state this server is waiting for, or no authorization code.
          content:
            text/html:
              schema: { type: string }

  /api/connections:
    get:
      tags: [Connections]
      summary: The tenant's source and target connections
      description: |
        Connection rows have existed since the baseline but were never shown:
        creating a mapping silently inserts two and that was the last anyone
        heard of them. This lists what exists, what each is for, and how many
        mailboxes depend on it. Secrets never come back out — names, kinds and
        states only.
      responses:
        '200':
          description: The connections.
          content:
            application/json:
              schema:
                type: object
                properties:
                  connections:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        role: { type: string, enum: [source, target] }
                        kind: { type: string }
                        displayName: { type: string }
                        status: { type: string, enum: [connected, error, revoked] }
                        createdAt: { type: string, format: date-time }
                        usedByMailboxes:
                          type: integer
                          description: |
                            How many migrations (mailbox mappings) depend on
                            this connection — of any kind, not only mail.
                        updatedAt: { type: string, format: date-time }
                        qualification:
                          type: object
                          nullable: true
                          description: |
                            What the LAST test measured this account can carry
                            (workplan 0106 T2) — per domain, three states.
                            Absent/null = never qualified, which is absence of
                            measurement, never "no".
                          properties:
                            domains:
                              type: object
                              properties:
                                mail: { $ref: '#/components/schemas/QualifiedDomain' }
                                calendar: { $ref: '#/components/schemas/QualifiedDomain' }
                                contact: { $ref: '#/components/schemas/QualifiedDomain' }
                                file: { $ref: '#/components/schemas/QualifiedDomain' }
                        standingFailures:
                          type: array
                          description: |
                            What is standing against this connection (workplan
                            0094 T5): the categorised failure on every domain
                            row of every migration that signs in with it, one
                            entry per migration and category, latest first.
                            An entry sits on the side the pass named when it
                            failed (`side`), or on both of a migration's
                            connections when it could not tell — the category
                            alone does not say which side failed, and Test is
                            then the way to find out. The category only,
                            never the prose: `lastError` lives on the
                            migration's own page. Always present; empty when
                            nothing stands.
                          items:
                            type: object
                            required: [mappingId, mappingName, category, domains, asOf, side]
                            properties:
                              mappingId: { type: string, format: uuid }
                              mappingName: { type: string, nullable: true }
                              side:
                                type: string
                                nullable: true
                                enum: [source, target]
                                description: |
                                  Which side the pass named when it failed
                                  (second slice). Set when this entry is on
                                  this connection because the failure happened
                                  here; null when the pass could not tell, in
                                  which case the same entry is on both of the
                                  migration's connections.
                              category:
                                type: string
                                enum: [auth_expired, rate_limited, quota_exceeded, policy_refused, too_large, source_refused, target_refused, format_refused, network, unknown]
                              domains:
                                type: array
                                description: The domains this category stands on.
                                items:
                                  type: string
                                  enum: [email, calendar, contact, file, task]
                              asOf:
                                type: string
                                format: date-time
                                description: When the newest of those rows last changed.
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Connections]
      summary: Add a connection on its own, without creating a mapping
      description: |
        Which fields a provider needs comes from the shared credential
        descriptor, so a form and this route cannot disagree about them; the
        stored config and encrypted credential record are built by the same
        functions the create-mapping route uses, so what is saved here is what
        a sync pass reads. Probed before it is stored, and stored either way
        with the outcome on `status` — a credential that does not work yet is
        worth keeping (somebody is mid-setup) but must not look healthy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, type, displayName, values]
              properties:
                role: { type: string, enum: [source, target] }
                type:
                  type: string
                  description: A wizard source or target type, e.g. box or webdav.
                displayName: { type: string }
                values:
                  type: object
                  additionalProperties: { type: string }
                  description: Field key to what the person typed. Secrets included; never echoed back.
      responses:
        '201':
          description: Created, with what the probe found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  ok: { type: boolean }
                  detail: { type: string }
                  reason: { type: string }
        '400':
          description: |
            Unknown type, a missing required field, or a value the schema refuses.
            Or `archive_on_server` (workplan 0136 T5): an export archive whose
            `where` is absent or `disk`, a path on this service's own machine,
            which a managed migration cannot read. Refused before anything is
            probed or stored; the sentence says the export goes in a folder of
            the Nextcloud or WebDAV files the migration writes to.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: |
            Nothing was probed or stored. `account_closed` (`AccountClosed`):
            the organisation was closed (workplan 0085 T2). Or
            `conditions_not_accepted` (`ConditionsNotAccepted`): while the
            deployment asks, the caller has not yet accepted the current version
            of each text (workplan 0139 T3).
          content:
            application/json:
              schema:
                anyOf:
                  - { $ref: '#/components/schemas/AccountClosed' }
                  - { $ref: '#/components/schemas/ConditionsNotAccepted' }
        '429': { $ref: '#/components/responses/TooManyTests' }
  /api/connections/{id}:
    delete:
      tags: [Connections]
      summary: Delete a connection nothing depends on
      description: |
        REFUSES while any mailbox uses it, naming which migrations. That
        refusal is the feature: `mailbox.connection_id` cascades on delete and
        `item` hangs off the mailboxes, so deleting a connection in use would
        not fail loudly — it would take the mailboxes and the whole migration
        ledger with it, and the next pass would re-copy everything as though it
        had never run.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: |
            Deleted. Our copy of the credential is gone and — where the provider
            has a revocation we can call, which today means Google's refresh
            tokens — the grant itself was revoked. `revocation` says which,
            because a deleted copy of a live grant is not a revoked grant, and
            the privacy text promises revocation where the provider supports it.
            Until 2026-09-20 this answered 204 and revoked nothing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionDeleted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No such connection for this tenant. }
        '409':
          description: Still in use; the reason names how many and which migrations. Nothing is revoked on a refusal — the connection stays, and must keep working.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/connections/{id}/credentials:
    put:
      tags: [Connections]
      summary: Replace a connection's credentials in place
      description: |
        Credentials expire — a rotated Box secret, a revoked Google refresh
        token — and without this the only repair was a new connection and a new
        mapping, abandoning the ledger history that made the old one useful.
        The row keeps its id, so every mapping pointing at it keeps working.
        The new credentials are PROBED BEFORE they replace the old ones, and a
        failure leaves the old ones in place (`rotated: false`): turning a
        working connection into a broken one because somebody pasted the wrong
        value is worse than refusing. The stored config is deliberately not
        touched — rotation replaces a secret, not where a migration is rooted.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                values:
                  type: object
                  additionalProperties: { type: string }
      responses:
        '200':
          description: What the probe found, and whether the credentials were replaced.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  detail: { type: string }
                  reason: { type: string }
                  rotated:
                    type: boolean
                    description: False when the probe failed and the old credentials were kept.
        '400': { description: A missing required field, or a value the schema refuses. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyTests' }
        '404': { description: No such connection for this tenant. }
        '409':
          description: |
            `archive_on_server` (workplan 0136 T5): a stored export archive whose
            path is on this service's own machine. Rotating probes the stored
            path first, so it is refused before anything is opened or replaced.
            Or `account_closed` (`AccountClosed`): the organisation was closed
            (workplan 0085 T2); nothing was probed or replaced. Or
            `conditions_not_accepted` (`ConditionsNotAccepted`): while the
            deployment asks, the caller has not yet accepted the current version
            of each text (workplan 0139 T3); nothing was probed or replaced.
          content:
            application/json:
              schema:
                anyOf:
                  - { $ref: '#/components/schemas/Refusal' }
                  - { $ref: '#/components/schemas/AccountClosed' }
                  - { $ref: '#/components/schemas/ConditionsNotAccepted' }
  /api/connections/{id}/test:
    post:
      tags: [Connections]
      summary: Probe a stored connection now
      description: |
        Runs the same read-only probe the wizard's Test connections button
        uses, through the builders a sync pass would use, against the stored
        credentials — so a credential that has expired says so here instead of
        in a failing pass. The provider's refusal comes back verbatim, and the
        outcome is recorded on the connection's status.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: What the provider answered. A refusal is an answer, not an error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  detail: { type: string }
                  reason: { type: string }
                  scheduling:
                    type: object
                    description: |
                      DAV targets only (workplan 0105 T0): what this target
                      will DO with the calendar objects a migration writes —
                      measured by one OPTIONS request at test time, never
                      assumed. `sentence` is the English fallback; the UI
                      renders `capability` in the reader's language.
                    properties:
                      capability: { type: string, enum: [auto-schedule, none, unknown] }
                      sentence: { type: string }
                  qualificationPending:
                    type: boolean
                    description: |
                      The door answered before the qualification finished
                      (2026-09-02): the probe has its own 20 s deadline, the
                      qualification gets what is left of the door's budget,
                      and past it the measuring finishes into the row on its
                      own — the next read of the connection shows it. Present
                      only when true; `qualification` is absent beside it.
                  qualification:
                    type: object
                    description: |
                      Basic-auth account kinds only (workplan 0106 T0): what
                      the account CAN CARRY, per domain, measured at this
                      test and remembered on the connection. Three states —
                      `yes` and `no` both required an answer; `unknown` is
                      unmeasured, which is never the same as either.
                    properties:
                      domains:
                        type: object
                        properties:
                          mail: { $ref: '#/components/schemas/QualifiedDomain' }
                          calendar: { $ref: '#/components/schemas/QualifiedDomain' }
                          contact: { $ref: '#/components/schemas/QualifiedDomain' }
                          file: { $ref: '#/components/schemas/QualifiedDomain' }
                      scheduling:
                        type: object
                        properties:
                          capability: { type: string, enum: [auto-schedule, none, unknown] }
                          sentence: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyTests' }
        '404': { description: No such connection for this tenant. }
        '409':
          description: |
            `archive_on_server` (workplan 0136 T5): a stored export archive whose
            path is on this service's own machine, which a managed migration
            cannot read. Refused before anything is opened; the row's `status`
            becomes `error`, so the list does not show it as connected. Or
            `account_closed` (`AccountClosed`): the organisation was closed
            (workplan 0085 T2); nothing was probed or recorded.
          content:
            application/json:
              schema:
                anyOf:
                  - { $ref: '#/components/schemas/Refusal' }
                  - { $ref: '#/components/schemas/AccountClosed' }
  /api/connections/{id}/folders:
    get:
      tags: [Connections]
      summary: The folders a saved account's migration may start from
      description: |
        *Only one folder* on *Start a migration* (workplan 0153 open question
        5, item 4): once the account is connected, the folder its files are
        read from is chosen, and this lists the ones a browse can find, from
        the stored credential (with the deployment's own application where the
        account has none, as a Test reads it). Read-only; nothing is stored.

        Google (a Google account, or a Google Drive row): its shared drives
        and the folders other accounts shared with it, by id. A folder in the
        account's own Drive is pasted by its link. Where one of the two lists
        is refused, the other comes back with `refused` saying why. Dropbox:
        its shared folders, by path; one shared with the account and not
        added to it has no `value`, because it has no path to start from yet.

        A provider's refusal comes back in its own words, as `ok: false`.
        `key` names the setting a folder's `value` goes in, on the migration's
        `sourceConfig` at create.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: What the provider listed, or its refusal. A refusal is an answer, not an error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  key: { type: string, enum: [rootFolderId, rootPath] }
                  folders:
                    type: array
                    items:
                      type: object
                      properties:
                        value:
                          type: string
                          description: The folder id (Google) or path (Dropbox). Absent where it cannot be chosen.
                        name: { type: string }
                        kind: { type: string, enum: [shared-drive, shared-folder] }
                        owner: { type: string }
                      required: [name, kind]
                  refused:
                    type: string
                    description: Google only, where one of its two lists was refused and the other answered.
                  reason: { type: string }
                required: [ok]
        '400':
          description: |
            `no_folders`: the account has no folders to list here. A Box
            folder is typed, by the number in its address; a migration from
            any other account reads the whole account. A destination has none.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refusal' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No such connection for this tenant. }
        '409':
          description: |
            `account_closed` (`AccountClosed`): the organisation was closed
            (workplan 0085 T2); the stored credential was not read.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountClosed' }
  /api/setup/{side}/{provider}:
    get:
      tags: [Setup]
      summary: The provider setup checklist and where it has got to
      description: |
        What a person must do IN THE PROVIDER before a migration can read
        anything — create an app, grant scopes, get an administrator to
        authorise it, obtain a token. Steps are defined in code and keyed by
        `key`; state lives per tenant. A step nobody has answered has no stored
        row and reads as `open`, so a step added in a later release is open for
        everyone with no backfill.
      parameters:
        - { name: side, in: path, required: true, schema: { type: string, enum: [source, target] } }
        - { name: provider, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The steps, their state, and the progress summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupChecklist' }
        '400': { description: 'The path was not /api/setup/{source|target}/{provider}.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/setup/{side}/{provider}/{stepKey}:
    put:
      tags: [Setup]
      summary: Record what a person decided about one setup step
      description: |
        `done` and `skipped` are settled states and record who decided and
        when; setting a step back to `open` clears that, because an open step
        is by definition one nobody has answered. Answers the whole refreshed
        checklist, so the caller never has to re-read it.
      parameters:
        - { name: side, in: path, required: true, schema: { type: string, enum: [source, target] } }
        - { name: provider, in: path, required: true, schema: { type: string } }
        - { name: stepKey, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: { type: string, enum: [open, done, skipped] }
      responses:
        '200':
          description: The refreshed checklist.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupChecklist' }
        '400': { description: 'The body was not a { state } object.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: That step does not belong to this provider and side. }
  /api/migrations/test-connection:
    post:
      tags: [Migrations]
      summary: Prove a connection before creating anything
      description: |
        Runs a READ-ONLY probe with the credentials as typed — one side per
        call — built exactly the way a sync pass would build the connector, so
        a passed test cannot diverge from what create would store. A provider
        refusal ("wrong password", "invalid scope") is an ANSWER, returned as
        `{ok:false, reason, outcome}`, not an error status.

        A provider's fixed hosts answer in their own words. An address the
        tester typed is answered from its parts (workplan 0136 T3): the status,
        and the server's words only when they came as an error document we know
        (DAV, Google, JMAP, an IMAP `NO`); a server that did not answer has the
        outcome code `unreachable`, and no address; an address inside this
        service's own network has `insideOurNetwork`, and no host. The sentence
        ends with a reference that finds the full text in the server log. The
        answer keeps those parts as `said`, with the reference, so a screen can
        say them in its reader's language; the connection doors keep them the
        same way on the result and on each refused face they store.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [side]
              properties:
                side: { type: string, enum: [source, target] }
                sourceType: { type: string }
                sourceConfig: { type: object }
                targetType: { type: string }
                targetConfig: { type: object }
      responses:
        '200':
          description: The probe's outcome, pass or refusal.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  detail: { type: string }
                  reason: { type: string }
                  said:
                    type: object
                    description: |
                      At an address the tester typed (workplan 0136 T3): what
                      happened, in parts. `kind` is `answered`, `unreachable`,
                      `certificate`, `insideOurNetwork` or `unknown`; an
                      `answered` one has its `protocol` (`dav`, `jmap`, `imap`),
                      its `status` when there was one, and `providerWords` only
                      when the server sent an error document we know. `reference`
                      finds the full text in the server log.
                    properties:
                      kind: { type: string }
                      protocol: { type: string }
                      status: { type: integer }
                      providerWords: { type: string }
                      reference: { type: string }
        '400':
          description: |
            The body named neither side's shapes. Or `archive_on_server` (workplan
            0136 T5): an export archive at a path on this service's own machine,
            refused before anything is probed.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyTests' }
  /api/migrations:
    get:
      tags: [Migrations]
      summary: List migrations
      description: |
        `lastSyncAt` is the newest domain completion for the mapping, or absent
        when no domain has completed yet — absent means "never", not "today".
      responses:
        '200':
          description: The tenant's migrations.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mappings:
                    type: array
                    items: { $ref: '#/components/schemas/Mapping' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Migrations]
      summary: Create a migration
      description: |
        Stores the source and target connections with their credentials
        encrypted at rest, and the domains to carry. Incoherent
        target/domain combinations and an unparseable schedule are refused at
        create with the same words the wizard shows, rather than accepted and
        failed later by a job nobody is watching.

        A created migration starts `paused`: it does not sync until the owner
        reviews the discovery counts and green-lights it via `/start`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMappingRequest' }
      responses:
        '201':
          description: The created migration, credentials masked.
          content:
            application/json:
              schema: { type: object }
        '400':
          description: |
            Refused, naming what is incoherent or missing. Or `archive_on_server`
            (workplan 0136 T5): an export archive at a path on this service's own
            machine — for a new connection, or in a reused one's override —
            refused before anything is stored. That refusal also carries
            `fields: [path]` and `reason`, the same sentence as `message`.
            An archive whose `sourceConfig.where` is `target` (workplan 0148
            T9) is read from a folder of the destination's own files, so a
            destination that cannot serve it is refused at `targetType`: JMAP,
            which has no byte ranges, and every destination with no files.
            Only `webdav` and `nextcloud` qualify.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: |
            Nothing was stored. `duplicate_mapping`: this migration exists
            already. `migration_cap`: the organisation has as many unfinished
            migrations as it may (workplan 0143 T2a). `account_closed`
            (`AccountClosed`): the organisation was closed (workplan 0085 T2),
            and takes no new migration or credential. `conditions_not_accepted`
            (`ConditionsNotAccepted`): while the deployment asks, the caller
            has not yet accepted the current version of each text, and no
            credential is stored before that (workplan 0139 T3).
            `free_pace_schedule`: on Free, outside the alpha, the schedule's
            passes come closer than a day, the tier's pace, with
            `leastMinutesBetweenPasses` (workplan 0157 T4). No schedule
            (automatic) and a daily one are never refused.
          content:
            application/json:
              schema:
                anyOf:
                  - { $ref: '#/components/schemas/Refusal' }
                  - { $ref: '#/components/schemas/AccountClosed' }
                  - { $ref: '#/components/schemas/ConditionsNotAccepted' }

  /api/migrations/pace:
    get:
      tags: [Migrations]
      summary: The pace the organisation's migrations run at
      description: |
        The least minutes between two passes, by the tier the month bills:
        1,440 on Free outside the alpha, else 0. And each migration's next
        pass by it, where that is still to come (workplan 0157 T5). The
        person's page says it in one line.
      responses:
        '200':
          description: The pace.
          content:
            application/json:
              schema:
                type: object
                required: [leastMinutesBetweenPasses, nextPassAt]
                properties:
                  leastMinutesBetweenPasses: { type: integer }
                  nextPassAt:
                    type: object
                    description: Per migration id, when its next pass may start, ISO 8601.
                    additionalProperties: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/migrations/progress:
    get:
      tags: [Migrations]
      summary: Where each data type of each migration is
      description: |
        The lines on a person's card and their page (workplan 0154 T1 (b) to
        (d)): for each migration of the organisation, each data type it copies
        with the facts its stage is read from (`state`, `phase`, `stopped`),
        its counts against what discovery found (`itemsFound`, `bytesFound`,
        absent when discovery could not count), and the migration's `check`.

        `check.state` is `not_run`, `running` (with `since`), `could_not_run`
        (the run itself failed, with `at`), `passed` or `not_passed` (with
        `at`, when the run finished). Passed is what the Finish page means by
        it: the report says the migration can proceed to its cutover.

        A data type the migration does not copy has no row.
      responses:
        '200':
          description: Each migration's progress.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgressReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/migrations/{mappingId}:
    parameters:
      - $ref: '#/components/parameters/MappingId'
    get:
      tags: [Migrations]
      summary: Get one migration
      description: |
        The stored config with the password masked — never the real secret.

        `kindChoices` lists each data type the migration copies (`on`) or could
        gain (`addable`, or `refused` with a `reason`). It is the list
        `POST /api/migrations/{mappingId}/domains` accepts from.

        `stopChoices` (workplan 0128 T4) lists each data type the migration
        carries with its stop: `stopped`, and `offer`, the press
        `…/domains/{domain}/stop` or `…/resume` accepts now (`stop`, `resume`
        or null). Both ask one rule, so the page offers exactly what the door
        accepts. Where there is no press, `held` says why when the page must
        say so: `last_one_copying` (D5) or `not_running` (a stopped data type
        on a migration that does not run). A `domainStatus` row its owner
        stopped carries `stoppedByOwner: true`; one switched off otherwise
        does not.

        `endingChoices` (workplan 0128 T5, slice 7b) lists each data type the
        migration carries with its ending, as the Finish page offers it:
        `phase` (`active`, `cutover`, `done` or `continuous`), `stopped`, and
        `offers`, the presses `…/domains/{domain}/end` and `…/keep` accept now.
        One rule decides both. End is offered without counting the data
        type's open failures; the door answers those with a refusal the page
        can force. Empty while the migration is paused or never started.
        On a data type still in its cutover, `graceEndedAt` says when its
        grace period ended while nobody chose: it no longer copies (D7, slice
        7c).

        Each `domainStatus` row carries what discovery found of its data type
        (workplan 0154 T2): `itemsFound`, and `bytesFound` when the source has
        cheap sizes. It is discovery's latest count that succeeded, kept
        through a later error, and only for the data types the migration
        carries, by the rule `…/discovery` reads by. Both are absent, never 0,
        when discovery could not count the data type.
      responses:
        '200':
          description: |
            The migration. `pace` says the pace it runs at (workplan 0157 T4):
            `leastMinutesBetweenPasses`, 1,440 on Free outside the alpha and 0
            otherwise, and `nextPassAt`, when that lets the next pass run while
            it is still to come, else null.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Migrations]
      summary: Update a migration
      description: |
        What a live migration may change about itself (workplan 0125).

        The lifecycle fields (status, mode, pattern) and the Google export
        format are applied. The format is `sourceConfig.nativeFilePolicy` for
        all four Google kinds, and `sourceConfig.nativeFilePolicies` for one
        per kind (`document`, `spreadsheet`, `presentation`, `drawing`), laid
        over it. It is merged into THIS mapping's own source_config_override,
        so it reaches no other migration sharing the same connection, and it
        is validated by the same parser the appliance's mapping file goes
        through: an unknown kind or format is a `400` naming the key.

        The two are one setting. `nativeFilePolicies` replaces the per-kind
        formats as a whole, and a kind it leaves out follows
        `nativeFilePolicy`. Sending `nativeFilePolicy` without
        `nativeFilePolicies` clears the per-kind formats, so all four kinds
        follow the one sent.

        A Dropbox migration's format is `sourceConfig.nativeFilePolicies.paper`
        (workplan 0150 T3): `markdown`, `html` or `refuse`, for its Paper docs
        and templates. It is merged and validated the same way. A format for
        Paper docs sent to a migration that does not copy from Dropbox, or a
        Google format sent to one that does, is a `400` naming
        `sourceConfig.nativeFilePolicies`, and nothing is written.

        The name is applied, stored trimmed; a name of spaces is a `400` on
        `name` (0153 open question 5, item 4).

        The source root folder is applied until the migration's ledger holds an
        item: `sourceConfig.rootFolderId` on a Google account, Google Drive or
        Box migration, `sourceConfig.rootPath` on a Dropbox one, merged into THIS mapping's
        own source_config_override and validated by the parser a pass reads it
        with. An empty value takes it off that override, and is a `400` where
        the account itself holds the folder. A folder for a source that has
        none, or in the other spelling, is a `400` naming the key. Once the
        ledger holds an item, the folder is refused as below.

        The folder the copies land in, `targetFolderPrefix`, is applied on the
        same terms, through the parser create uses: an empty one merges the
        copies into the destination's own folders. A folder another migration
        between the same two accounts already copies into is a `409`
        `duplicate_mapping`, in the words create answers with. The migration's
        own read says it as `targetFolderPrefix`, or null.

        Fields that cannot change on a migration that already holds items are
        REFUSED rather than dropped: the source or target system, the source
        root folder, and the destination account. Reconnecting the same account
        with a new password or a renewed sign-in is a different act and is done
        on the connections routes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: The updated migration.
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            Refusals, told apart by `error`.

            `duplicate_mapping`: the folder the copies land in is one another
            migration between the same two accounts already copies into
            (`existingMappingId`, `existingMappingName`). Nothing was written.

            `revision_refused`: one or more fields cannot be revised on a
            migration that already exists. Every refused field is listed, each
            with a reason that names what to do instead.

            `free_pace_schedule`: on Free, outside the alpha, the schedule's
            passes come closer than a day, the tier's pace, with
            `leastMinutesBetweenPasses` (workplan 0157 T4). Nothing was written.
            `schedule: null` (automatic) and a daily one are never refused.

            `lifecycle_refused` (ADR-0049): the status move is one the
            lifecycle does not make through this door. `code` is the stable
            part: `own_door` (starting is POST …/start, finishing is POST
            …/finish — each applies a rule an update would skip),
            `after_cutover` (cutover, done and continuous do not go back to
            active or paused; only a rollback does that), `finished` (done is
            terminal; its one exit is the continuous lane), `before_cutover`
            (the lane is entered from cutover or done). Nothing was written.

            `account_closed` (`AccountClosed`, workplan 0085 T2): a move into a
            state that runs passes (`continuous`), for an organisation that was
            closed. Other edits, and a move that stops work, are not refused
            for that.
          content:
            application/json:
              schema:
                anyOf:
                  - { $ref: '#/components/schemas/AccountClosed' }
                  - type: object
                    properties:
                      error: { type: string, enum: [revision_refused, lifecycle_refused, duplicate_mapping] }
                      message: { type: string }
                      hint: { type: string }
                      code:
                        type: string
                        enum: [own_door, after_cutover, finished, before_cutover, unknown]
                      from: { type: string }
                      to: { type: string }
                      existingMappingId: { type: string }
                      existingMappingName: { type: string, nullable: true }
                      refused:
                        type: array
                        items:
                          type: object
                          properties:
                            field:
                              type: string
                              enum: [source.type, target.type, source.rootFolderId, target.account, target.folderPrefix]
                            reason: { type: string }
    delete:
      tags: [Migrations]
      summary: Delete a migration
      description: |
        Destroys config and ledger linkage. The UI arms this by making the
        operator type the migration's own name; the API itself does not
        second-guess a deliberate call.
      responses:
        '200':
          description: |
            Deleted. When the migration's own row held a credential, the token
            a person granted through a grant link, it was revoked where the
            provider supports it, after the delete, and `revocation` says what
            happened (workplan 0139 T6). The organisation's credential, on the
            connection, is never touched. A migration without a credential of
            its own answers without `revocation`. Until 2026-09-27 this revoked
            nothing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MigrationDeleted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/migrations/{mappingId}/start:
    parameters:
      - $ref: '#/components/parameters/MappingId'
    post:
      tags: [Migrations]
      summary: Green-light a paused migration
      description: |
        The owner's go-ahead after reviewing discovery. Until this, syncs are
        refused with `409`. Activating also enqueues the first pass, so while
        an operator hold is open the press is refused BEFORE the migration is
        activated, and nothing changes (`PlatformHeld`). A second press on an
        active migration enqueues nothing and is answered `activated: false`.
        A closed organisation is refused on every press, an active migration's
        too, before the grant's own answers (`AccountClosed`, workplan 0085 T2).

        On Free, outside the alpha, a paused migration whose last pass started
        within the day is activated, and its pass waits for the pace:
        `firstRun` is `queued: false` with `nextPassAt`, and the sync tick
        starts the pass then (workplan 0157 T4).
      responses:
        '200':
          description: Started.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            Nothing was changed. `Conflict`: the migration is past cutover.
            `grant_withdrawn` or `awaiting_grant`: nobody's grant lets a pass
            read the account, with `reason` saying whose. An `awaiting_grant`
            for a migration that has never run, whose person's move was ever
            started, also carries `startsWhenGranted: true`, and its `reason`
            says it starts by itself once that person has connected (ADR-0035's
            amendment, start when granted). `platform_held`: an operator hold
            is open (`PlatformHeld`). `account_closed`: the organisation was
            closed (`AccountClosed`, workplan 0085 T2). `paths_need_a_yes`: the
            start would hold more migrations at the same time than the agreed
            tier runs (workplan 0109 T6, outside the alpha), with `tier`, `after`
            and `needs` (the smallest tier that runs them, null past Extra
            large); every door that takes a slot answers it the same way.
            `anyOf`, not `oneOf`: those bodies are an `Error` too.
          content:
            application/json:
              schema:
                anyOf:
                  - { $ref: '#/components/schemas/Error' }
                  - { $ref: '#/components/schemas/PlatformHeld' }
                  - { $ref: '#/components/schemas/AccountClosed' }

  /api/migrations/{mappingId}/domains:
    parameters:
      - $ref: '#/components/parameters/MappingId'
    post:
      tags: [Migrations]
      summary: Add a data type to a migration that already exists
      description: |
        Adds ONE data type (workplan 0125 T6). Accepted exactly when the
        migration's `kindChoices` lists it as `addable`: the source serves it
        (an account's ceiling is this deployment's), the destination receives
        it, neither side's last Test measured that it cannot, and the migration
        has not reached cutover.

        Adding only: nothing here takes a data type off; a data type is
        stopped and resumed on its own doors (`…/domains/{domain}/stop`). A
        running migration's new path takes its slot at once, a paused one's at
        its next start. The migration's `updatedAt` moves, so the next preflight
        counts afresh. Nothing is enqueued: the next pass copies the new data
        type. The addition is recorded (`path.added`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string, enum: [email, calendar, contact, file, task] }
      responses:
        '200':
          description: Added.
          content:
            application/json:
              schema:
                type: object
                required: [id, added, domains]
                properties:
                  id: { type: string }
                  added: { type: string, enum: [email, calendar, contact, file, task] }
                  domains:
                    type: array
                    description: Every data type the migration now copies, in the order they are ticked.
                    items: { type: string, enum: [email, calendar, contact, file, task] }
        '400':
          description: '`invalid_body`: no `domain`, or one that names no data type.'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `kind_refused`, with a `reason` that says what to do instead: the
            data type is already there, one side cannot carry it, the last Test
            measured that it cannot, or the migration is past cutover. Or
            `account_closed` (`AccountClosed`): the organisation was closed
            (workplan 0085 T2), and nothing was written.
          content:
            application/json:
              schema:
                anyOf:
                  - { $ref: '#/components/schemas/Refusal' }
                  - { $ref: '#/components/schemas/AccountClosed' }

  /api/migrations/{mappingId}/domains/{domain}/stop:
    parameters:
      - $ref: '#/components/parameters/MappingId'
      - name: domain
        in: path
        required: true
        schema: { type: string, enum: [email, calendar, contact, file, task] }
    post:
      tags: [Migrations]
      summary: Stop one data type of a running migration
      description: |
        Stops ONE data type (workplan 0128 T4). Its copies stay, its record
        stays, and it no longer follows the source; resuming continues where
        it stopped. Only while the migration runs (`active` or `continuous`),
        only a data type the migration carries, and only one before its
        cutover or kept in the lane.

        The last data type still copying cannot be stopped: end the migration
        instead (D5). Before the cutover a stopped data type keeps its slot, as
        a pause does; in the continuous lane it releases it (D2 (c)). The
        progress strip says `stopped`, the check that everything arrived skips
        it (D6), and the stop is recorded (`path.status`). Nothing is enqueued:
        every pass reads the stop afresh, and a pass already copying this data
        type stops starting new items within about fifteen seconds, and
        finishes the ones it has begun (a very large file can take longer).
      responses:
        '200':
          description: Stopped, or already stopped (`changed` false).
          content:
            application/json:
              schema:
                type: object
                required: [id, domain, stopped, changed]
                properties:
                  id: { type: string }
                  domain: { type: string, enum: [email, calendar, contact, file, task] }
                  stopped: { type: boolean, enum: [true] }
                  changed: { type: boolean }
        '400':
          description: '`invalid_domain`: the path names no data type.'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `stop_refused`, with `refused` the stable part and a `reason` that
            says what to do instead: `not_running` (the migration is paused,
            in its cutover or finished), `not_a_path` (the migration does not
            carry this data type), `not_stoppable` (the data type is past its
            cutover or has ended), or `last_one_copying` (end the migration
            instead).

  /api/migrations/{mappingId}/domains/{domain}/resume:
    parameters:
      - $ref: '#/components/parameters/MappingId'
      - name: domain
        in: path
        required: true
        schema: { type: string, enum: [email, calendar, contact, file, task] }
    post:
      tags: [Migrations]
      summary: Resume one stopped data type
      description: |
        Resumes a data type its owner stopped (workplan 0128 T4). It follows
        the source again from where it stopped. In the continuous lane it
        takes its slot back, and the month's peak rises with it (D2 (c)). The
        resume is recorded (`path.status`).
      responses:
        '200':
          description: Resumed, or already running (`changed` false).
          content:
            application/json:
              schema:
                type: object
                required: [id, domain, stopped, changed]
                properties:
                  id: { type: string }
                  domain: { type: string, enum: [email, calendar, contact, file, task] }
                  stopped: { type: boolean, enum: [false] }
                  changed: { type: boolean }
        '400':
          description: '`invalid_domain`: the path names no data type.'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `resume_refused`, with `refused` and a `reason`: `not_running`,
            `not_a_path` or `not_stoppable`, as for a stop. Or
            `account_closed` (`AccountClosed`): the organisation was closed
            (workplan 0085 T2), and nothing was written. A stop is not refused
            for that.
          content:
            application/json:
              schema:
                anyOf:
                  - { $ref: '#/components/schemas/Refusal' }
                  - { $ref: '#/components/schemas/AccountClosed' }

  /api/migrations/{mappingId}/domains/{domain}/end:
    parameters:
      - $ref: '#/components/parameters/MappingId'
      - name: domain
        in: path
        required: true
        schema: { type: string, enum: [email, calendar, contact, file, task] }
      - name: force
        in: query
        required: false
        schema: { type: boolean }
        description: End it over its own failures still waiting on a decision, knowingly.
    post:
      tags: [Migrations]
      summary: End one data type where its migration ends
      description: |
        Ends ONE data type (workplan 0128 T3, T5 slice 7; D3, D8): it becomes
        `done`. Its passes stop, its slot is let go, and what is copied
        stays. From before its cutover it ends as the whole migration's Finish
        does. The data type's own failures still waiting on a decision refuse
        it unless `force=true`. The migration's status is then its data types'
        roll-up: with every data type ended, the migration is finished. Each
        move is recorded (`path.phase`, and `mapping.status` when the
        migration's status moved).
      responses:
        '200':
          description: Ended, or already ended (`changed` false, with its `phase`).
          content:
            application/json:
              schema:
                type: object
                required: [id, domain, ending, changed]
                properties:
                  id: { type: string }
                  domain: { type: string, enum: [email, calendar, contact, file, task] }
                  ending: { type: string, enum: [end] }
                  changed: { type: boolean }
                  phase: { type: string, description: 'Its phase, when nothing changed.' }
                  from: { type: string }
                  to: { type: string, enum: [done] }
                  migration:
                    type: object
                    description: The migration's status, when the roll-up moved it.
                    properties:
                      from: { type: string }
                      to: { type: string }
                  slotsTaken: { type: boolean }
        '400':
          description: '`invalid_domain`: the path names no data type.'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `end_refused`, with `refused` the stable part and a `reason`:
            `not_running` (the migration or the data type is paused or never
            started; `status` names it), `not_a_path` (the migration does not
            carry this data type), or `unresolved_failures` (`count` of its
            own failures waiting on a decision; `forceable` true).

  /api/migrations/{mappingId}/domains/{domain}/keep:
    parameters:
      - $ref: '#/components/parameters/MappingId'
      - name: domain
        in: path
        required: true
        schema: { type: string, enum: [email, calendar, contact, file, task] }
    post:
      tags: [Migrations]
      summary: Keep one data type copying in the continuous lane
      description: |
        Keeps ONE data type copying after its cutover (workplan 0128 T3, T5
        slice 7; D3, D8): it enters the continuous lane (`continuous`), where
        it copies under the after-cutover rules and holds a slot; a slot it
        did not hold raises the month's peak. From before its cutover it is
        recorded as its cutover and then the lane. Its failures do not hold it
        back: the lane goes on retrying them. Not while its owner has it
        stopped: resume it first, or end it. The migration's status is then
        its data types' roll-up.
      responses:
        '200':
          description: Kept, or already in the lane (`changed` false, with its `phase`).
          content:
            application/json:
              schema:
                type: object
                required: [id, domain, ending, changed]
                properties:
                  id: { type: string }
                  domain: { type: string, enum: [email, calendar, contact, file, task] }
                  ending: { type: string, enum: [keep] }
                  changed: { type: boolean }
                  phase: { type: string, description: 'Its phase, when nothing changed.' }
                  from: { type: string }
                  to: { type: string, enum: [continuous] }
                  migration:
                    type: object
                    description: The migration's status, when the roll-up moved it.
                    properties:
                      from: { type: string }
                      to: { type: string }
                  slotsTaken: { type: boolean }
        '400':
          description: '`invalid_domain`: the path names no data type.'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `keep_refused`, with `refused` and a `reason`: `not_running`,
            `not_a_path`, or `stopped` (resume it first, or end it). Or
            `account_closed` (`AccountClosed`): the organisation was closed
            (workplan 0085 T2), and nothing was written. Ending one is not
            refused for that.
          content:
            application/json:
              schema:
                anyOf:
                  - { $ref: '#/components/schemas/Refusal' }
                  - { $ref: '#/components/schemas/AccountClosed' }

  /api/migrations/{mappingId}/sync:
    parameters:
      - $ref: '#/components/parameters/MappingId'
    post:
      tags: [Migrations]
      summary: Run a pass now
      description: |
        Enqueues a pass and returns immediately. Without a `domains` list the
        job runs the domains the owner selected for this migration — never all
        four by default, because no selection means "not selected", not
        "everything".

        A paused migration is refused with `409` naming `/start`. A closed
        organisation is refused first, with `account_closed`, whatever the
        migration's status.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum: [full, delta]
                  description: A full pass ignores cursors and rescans everything.
                forceFullScan: { type: boolean }
                final:
                  type: boolean
                  description: |
                    The pass before the switch, which *Finish* asks for. Free's
                    pace never holds it back (workplan 0157 T2).
      responses:
        '202':
          description: |
            Enqueued. The press also counts as a visit, which brings a
            migration on the automatic cadence back to every hour (workplan
            0157 T7; see `POST /api/migrations/{mappingId}/visit`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnqueuedRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            Nothing was enqueued. The migration is paused (review discovery and
            start it first), its grant was withdrawn (`grant_withdrawn`), or an
            operator hold is open (`platform_held`, `PlatformHeld`), or the
            organisation was closed (`account_closed`, `AccountClosed`, workplan
            0085 T2). `anyOf`, not `oneOf`: those two bodies are an `Error` too.

            On Free, outside the alpha, a press within a day of the migration's
            last pass is refused with `free_pace`, its `message` in English and
            `nextPassAt`, when the pace lets the next pass run (workplan 0157
            T2). Never a `final` pass.
          content:
            application/json:
              schema:
                anyOf:
                  - { $ref: '#/components/schemas/Error' }
                  - { $ref: '#/components/schemas/PlatformHeld' }
                  - { $ref: '#/components/schemas/AccountClosed' }

  /api/migrations/{mappingId}/visit:
    parameters:
      - $ref: '#/components/parameters/MappingId'
    post:
      tags: [Migrations]
      summary: Record a visit to a migration
      description: |
        The migration's page was opened (workplan 0157 T7). A migration with
        no schedule of its own looks for changes every hour for 14 days from
        the later of its first copy and its last visit, then every 6 hours,
        then once a day from day 30; a visit starts the 14 days again. Kept
        once an hour at most, and never who visited. Managed only.

        A slower step the morning mail said of the migration (managed 0043)
        ends with the visit, and the answer names it once, for the page to
        say: `broughtBackFrom` is `six-hourly` or `daily`, else null.
      responses:
        '200':
          description: Recorded, or one within the hour already stood.
          content:
            application/json:
              schema:
                type: object
                required: [broughtBackFrom]
                properties:
                  broughtBackFrom:
                    type: [string, 'null']
                    enum: [six-hourly, daily, null]
                    description: The slower step this visit ended, once said by email; null when none was.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/migrations/{mappingId}/cutover:
    parameters:
      - $ref: '#/components/parameters/MappingId'
    post:
      tags: [Migrations]
      summary: Prepare a cutover
      description: |
        Prepares and verifies, then stops at `READY_FOR_CUTOVER`. It does not
        execute a cutover: moving mail delivery is an MX/DNS change outside
        this product, and the one step nobody here can perform for you.

        The door asks the cutover ledger first, with the same rule the job
        follows. No ledger yet: one is created. `PREPARING` or `APPROVED`:
        prepared (an approval is revoked by the re-preparation, and the 202
        says so). `READY_FOR_CUTOVER`, `FAILED` or `ROLLED_BACK`: taken back
        to `PREPARING` first, then prepared, so the trail shows the second
        attempt. A cutover under way or a finished ledger is refused with 409
        and nothing is enqueued.

        With `domain`, one data type is prepared on its own (workplan 0128
        T5): its own ledger (or the whole migration's, where it has none of
        its own yet), a final sync of that data type alone, and a gate over
        it alone. Only a data type the migration carries.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                skipFinalSync: { type: boolean }
                skipVerification: { type: boolean }
                domain: { type: string, enum: [email, calendar, contact, file, task] }
      responses:
        '202':
          description: |
            Enqueued. `preparation` says what the job will do with this
            press: the ledger state it found (`null` when it creates the
            ledger), whether it first records the way back to `PREPARING`,
            and whether an earlier approval is revoked.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnqueuedRun'
                  - type: object
                    properties:
                      enqueued: { type: string, enum: [cutover-preparation] }
                      domain:
                        type: string
                        enum: [email, calendar, contact, file, task]
                        description: The data type prepared on its own; absent for the whole migration.
                      nextStep: { type: string }
                      preparation:
                        type: object
                        properties:
                          from:
                            type: string
                            nullable: true
                            enum: [PREPARING, READY_FOR_CUTOVER, APPROVED, FAILED, ROLLED_BACK, null]
                          resetsToPreparing: { type: boolean }
                          revokesApproval: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `cutover_refused`: there is nothing to prepare, and nothing was
            enqueued. `code` is the stable part: `under_way` (the cutover is
            in `CUTOVER_IN_PROGRESS` or `GRACE_PERIOD` — let it finish, or roll
            it back), `closed` (the ledger is `COMPLETED`; one cutover ledger
            per mapping, and this one is finished), `cut_over_by_data_type`
            (a data type of this migration has a cutover of its own, workplan
            0128 T5: the whole migration's is not prepared; prepare each
            remaining data type with `domain`, and the operator cuts it over
            with the CLI's `--kind`), `whole_under_way` (a `domain` was named
            while the whole migration's cutover is under way: carry on with
            that one, or roll it back first), `not_a_path` (the migration does
            not carry the `domain` named). `state` names the ledger state that
            refused, where one did.

            `platform_held`: the ledger would allow it, and an operator hold is
            open (`PlatformHeld`). `account_closed`: the ledger would allow it,
            and the organisation was closed (`AccountClosed`, workplan 0085 T2).
            Nothing was enqueued.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      error: { type: string, enum: [cutover_refused] }
                      message: { type: string }
                      hint: { type: string }
                      code: { type: string, enum: [under_way, closed, cut_over_by_data_type, whole_under_way, not_a_path] }
                      state: { type: string, enum: [CUTOVER_IN_PROGRESS, GRACE_PERIOD, COMPLETED] }
                  - { $ref: '#/components/schemas/PlatformHeld' }
                  - { $ref: '#/components/schemas/AccountClosed' }

  /api/migrations/{mappingId}/runs:
    parameters:
      - $ref: '#/components/parameters/MappingId'
    get:
      tags: [Migrations]
      summary: Run history
      description: |
        Newest first, with the per-domain events of each pass. A run whose
        domains were narrower than the migration's selection says so in its
        events rather than leaving the absence unexplained.
      responses:
        '200':
          description: Recent runs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs:
                    type: array
                    items: { $ref: '#/components/schemas/Run' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/migrations/{mappingId}/discover:
    parameters:
      - $ref: '#/components/parameters/MappingId'
    post:
      tags: [Discovery]
      summary: Count what the source holds
      responses:
        '202':
          description: Enqueued.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `platform_held` (`PlatformHeld`): an operator hold is open.
            `account_closed` (`AccountClosed`): the organisation was closed
            (workplan 0085 T2). Either way nothing was enqueued or written.
          content:
            application/json:
              schema:
                anyOf:
                  - { $ref: '#/components/schemas/PlatformHeld' }
                  - { $ref: '#/components/schemas/AccountClosed' }

  /api/migrations/{mappingId}/discovery:
    parameters:
      - $ref: '#/components/parameters/MappingId'
    get:
      tags: [Discovery]
      summary: The discovery counts
      description: |
        Per domain: collections, items and bytes, each stamped with when it was
        measured. A domain that could not be read reports that, with the reason.
      responses:
        '200':
          description: The counts.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/migrations/{mappingId}/links:
    parameters:
      - $ref: '#/components/parameters/MappingId'
    post:
      tags: [Grant links]
      summary: Refused - a link is made per person now
      description: |
        Issued nothing since the owner's answer of 2026-10-03 (*"yes, replace
        the per-migration links"*; ADR-0035, amended 2026-09-29). A link is the
        person's: one grant link and one progress link for all of their
        migrations, made on their page (`POST /api/people/{personId}/links`).

        Answers 409 `links_are_per_person`, naming the person this migration
        belongs to (with `personId`, for a page to link to), or saying that it
        belongs to nobody yet and is given a person first. Nothing is written.
        The door stays so that a bookmark, a script or an older page that
        presses it is told where links are made now.

        A migration's link already sent is honoured until it expires, listed
        by `GET` below and revocable with `DELETE`.
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: A link is made per person now. Nothing was written.
          content:
            application/json:
              schema:
                type: object
                required: [error, reason]
                properties:
                  error: { type: string, enum: [links_are_per_person] }
                  reason: { type: string }
                  personId: { type: string, format: uuid }
    get:
      tags: [Grant links]
      summary: The links that exist, and their state
      description: |
        State and dates, never a URL and never a secret — the table holds only
        a hash, so this could not show one if it wanted to. `state` is one of
        `live`, `used`, `revoked` or `expired`, and `expired` is reported only
        for a link that was never used: one that expired UNUSED means somebody
        was asked and never managed to answer, which is the case worth acting
        on.
      responses:
        '200':
          description: Every link for this migration, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  links:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        purpose: { type: string, enum: [grant, view] }
                        state: { type: string, enum: [live, used, revoked, expired] }
                        createdAt: { type: string, format: date-time }
                        createdBy: { type: string }
                        expiresAt: { type: string, format: date-time }
                        usedAt: { type: string, format: date-time, nullable: true }
                        revokedAt: { type: string, format: date-time, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/migrations/{mappingId}/links/{linkId}:
    parameters:
      - $ref: '#/components/parameters/MappingId'
      - { name: linkId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Grant links]
      summary: Revoke a link
      description: |
        The owner's kill switch, and idempotent: revoking an already-revoked
        link answers 200 with `revoked: false`, because pressing twice means
        the same thing both times and an error would suggest the door is
        somehow still open.

        Revocation is re-checked at the moment a grant would be stored, so it
        also stops a consent that was already in flight.
      responses:
        '200':
          description: Revoked now (`true`), or already revoked (`false`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/grant/{link}:
    parameters:
      - name: link
        in: path
        required: true
        description: |
          The whole credential, one path segment: a migration's `<id>.<secret>`,
          or a person's `p.<id>.<secret>` (ADR-0035, amended 2026-09-29).
        schema: { type: string }
    get:
      tags: [Grant links]
      summary: What the person holding this link needs to decide
      description: |
        Answers to a LINK, not to a session — there is no bearer token here and
        the caller has no Ownpace account, by design (ADR-0035: owners sign in,
        migrated people get links).

        Says who is asking (the organisation's name, and the sign-in address
        of the member who issued the link), which data types will be read,
        the exact scope the link asks Google for and whether Google holds
        every data scope in it to reading, when the link stops working, and
        where the data comes from and goes to: the account the migration
        reads, and the kind of server it writes, its host and the account on
        it. It says nothing else: not the mapping id, not the tenant id, not
        the client id, nothing about any other migration.

        Changes nothing, deliberately. Chat applications fetch URLs to draw
        previews, and a link is spent at the GRANT rather than at the open, so
        a preview cannot burn it.

        For a person's link the answer is per Google account (`kind:
        person`, `PersonGrantPage`): each account their migrations read, what
        its one consent asks for, where each of its migrations goes, and
        whether it is connected already.
      security: []
      responses:
        '200':
          description: Enough to decide with.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/PersonGrantPage'
                  - type: object
                    properties:
                      organisation: { type: string }
                      checkedCompany:
                        type: string
                        nullable: true
                        description: The company name the EU VAT register (VIES) gave, when the organisation's VAT number as stored was checked and found valid; null otherwise.
                      askedBy:
                        type: string
                        nullable: true
                        description: The sign-in address of the member who issued the link; null when they are no longer a member.
                      organisationPhone:
                        type: string
                        nullable: true
                        description: The organisation's phone number, when it gave one; never anything that is not a phone number.
                      domains:
                        type: array
                        minItems: 1
                        items: { type: string, enum: [email, calendar, contact, file, task] }
                        description: |
                          Which data types the link reads, as codes. The page words
                          them itself, in the reader's language, and joins them as
                          that language joins a list (workplan 0145 T6); until then
                          the server sent an English sentence as `reads`.
                      scope: { type: string }
                      readOnlyAtProvider:
                        type: boolean
                        description: |
                          Whether every data scope this link asks for is one Google
                          enforces as read-only (today `drive.readonly` and
                          `tasks.readonly`). The page says "read-only" only then
                          (workplan 0144 T3). A statement about the ask, not the
                          grant: the consent asks with `include_granted_scopes`, so
                          Google also hands back any permission this account already
                          gave the same app, and the ending page judges what Google
                          recorded.
                      from:
                        type: string
                        description: |
                          The account the migration reads, and the only one whose
                          sign-in is accepted (0108 T8 (b)). A migration that names
                          none answers 409 instead.
                      to:
                        type: object
                        description: Where the data goes.
                        properties:
                          provider: { type: string, description: 'The target kind, e.g. `nextcloud`.' }
                          host: { type: string, nullable: true }
                          account: { type: string, nullable: true }
                      expiresAt: { type: string, format: date-time }
        '401':
          description: |
            One sentence for every way a link can fail — unknown, forged,
            expired, revoked, already used, wrong purpose, malformed. The
            difference is deliberately not reported: the reader cannot act on
            it, and naming it would tell a forger which part failed. The body
            is `{error, message, messageNl}`: the sentence in English and in
            Dutch, and the page shows the one in its language (workplan 0145
            T6).
        '409':
          description: |
            The link is good but the migration cannot be connected — it no
            longer exists, its source is not a Google account, it names no
            account, it has no destination, it copies nothing, or its Google
            application is not configured or may not ask for mail or files. The
            sentence is written to be forwarded to whoever sent the link. The
            body is `{error, reason, reasonNl}`: the sentence in English and
            in Dutch (workplan 0145 T6). Or `account_closed` (`AccountClosed`):
            the organisation that sent the link was closed (workplan 0085 T2),
            with the same sentence in both languages.
          content:
            application/json:
              schema:
                anyOf:
                  - { $ref: '#/components/schemas/Refusal' }
                  - { $ref: '#/components/schemas/AccountClosed' }
        '503':
          description: |
            The link could not be checked just now. Ours, not the caller's.
            The body is `{error, message, messageNl}`, as for 401.

  /api/grant/{link}/google/authorize:
    parameters:
      - name: link
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Grant links]
      summary: Start the Google sign-in for this link
      description: |
        The client id and secret are read from the mapping's own source
        connection and decrypted server-side, or are the deployment's where
        the connection stores none. Unlike the owner's
        `/api/migrations/google/authorize`, they are NOT accepted from the
        request body: the link holder is not the person who configured them and
        must never hold them.

        Answers a URL for the browser to follow rather than redirecting, so a
        refusal can be shown as words instead of as a Google error page.

        The consent ends at the same callback the owner's flow uses. Which
        ending runs is decided by the server's own pending state, never by
        anything in the redirect — and in this one the refresh token is stored
        against the mapping and shown to nobody.

        Beside the data scopes, the consent asks for `openid` and
        `https://www.googleapis.com/auth/userinfo.email`, and names the
        migration's account as Google's `login_hint`: the callback stores the
        token only when that account is the one that signed in (0108 T8 (b)).

        The page after Google is in the language the body names (workplan
        0145 T6), which the server records on the pending consent beside the
        link and never reads back from the redirect.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                account:
                  type: string
                  description: |
                    For a person's link only: the Google account whose button
                    was pressed, as the page listed it. The consent asks it for
                    every scope its migrations need, offers it first, and the
                    ending keeps only its sign-in. Answered 409
                    `not_this_account` when the link does not ask for it, and
                    `already_granted` when it is connected already.
                locale:
                  type: string
                  enum: [en, nl]
                  description: |
                    The language the page was in when the button was pressed,
                    so the page the provider sends the person back to is in it
                    too (workplan 0145 T6). Recorded on the pending consent and
                    never put in the redirect; anything else, or nothing, is
                    English.
      responses:
        '200':
          description: Where to send the browser.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
        '401':
          description: |
            The link was refused — see GET above. The body is
            `{error, message, messageNl}`.
        '409':
          description: |
            The migration cannot be connected, or this deployment's callback
            address is one Google will not redirect to: a raw IP
            (`raw_ip_callback`), or a loopback address behind a public app
            (`unreachable_callback`). The body is `{error, reason, reasonNl}`,
            the sentence in English and in Dutch (workplan 0145 T6); for the
            two callback refusals, the operator's own sentence stays verbatim
            inside both. Or `account_closed` (`AccountClosed`): the
            organisation that sent the link was closed (workplan 0085 T2), and
            no consent begins.
          content:
            application/json:
              schema:
                anyOf:
                  - { $ref: '#/components/schemas/Refusal' }
                  - { $ref: '#/components/schemas/AccountClosed' }
        '503':
          description: |
            The link could not be checked just now. The body is
            `{error, message, messageNl}`.

  /api/grant/{link}/report:
    parameters:
      - name: link
        in: path
        required: true
        description: |
          The whole credential, one path segment: a migration's `<id>.<secret>`,
          or a person's `p.<id>.<secret>`, whose report names the person and
          every migration of theirs (ADR-0035, amended 2026-09-29).
        schema: { type: string }
    get:
      tags: [Grant links]
      summary: Whether this link can be reported
      description: |
        `true` only when the deployment has a Zammad or mail set up, as for the
        signed-in form. The grant page offers "Report this link" only then.
        Link-authenticated: a progress (`view`) link is refused here.
      security: []
      responses:
        '200':
          description: The answer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: { type: boolean }
                required: [available]
        '401':
          description: The link is not a live grant link.
    post:
      tags: [Grant links]
      summary: Report this link to the owner, for the person asked to grant
      description: |
        Workplan 0108 T8 (d), the owner's decision of 2026-09-24: a report goes
        to the problem report form's Zammad (0130). The reply address is
        optional (the owner, 2026-09-24), typed and not verified. The note
        carries what the link's own rows say, one line per fact: the
        organisation, the migration, the link's id (never the link), who issued
        it, from, to, whether access was given, and the reply address or that
        there is none. Then, under its own label, what they wrote. The title is
        fixed.

        In Zammad it becomes an internal note on a ticket. A typed reply
        address is the ticket's customer, so the owner's reply reaches them by
        email; without one, the ticket is filed under the helpdesk token's own
        user and nobody can be answered.

        Without a Zammad, it is one mail to the support mailbox with the same
        note and the report's reference. That mail has no Reply-To, so that
        pressing Reply cannot quote the note to an address somebody typed: the
        owner writes to the note's reply address in a new mail.

        Link-authenticated like the grant page: a link that no longer opens
        it cannot report. Three reports a day per link, and thirty an hour for
        every grant and progress link together; only a report that parses
        counts. By mail, also fifty a day for every report together, the
        signed-in form's included.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description: { type: string, maxLength: 5000 }
                replyTo:
                  type: string
                  format: email
                  maxLength: 320
                  description: Optional. Empty or absent means the person wants no answer.
              required: [description]
      responses:
        '201':
          description: |
            Delivered: with the ticket's number when it went to Zammad, or with
            the report's own reference, which its mail carries too, when it went
            to the support mailbox.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      ticket: { type: string }
                    required: [ticket]
                  - type: object
                    properties:
                      reference: { type: string, pattern: '^[0-9a-f]{8}$' }
                    required: [reference]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: The link is not a live grant link. Nothing was sent.
        '410':
          description: The migration was deleted while the report was being read.
        '429':
          description: Too many reports of this link today, or of all links this hour, or, by mail, of all reports today. Carries `Retry-After`.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds to wait.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Ours; nothing the person did.
        '502':
          description: Zammad did not take the ticket, or the relay did not take the mail. Carries a reference the log page finds.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: This deployment has neither a Zammad nor mail set up, or the link could not be checked just now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/view/{link}:
    parameters:
      - name: link
        in: path
        required: true
        description: |
          The whole credential, one path segment: a migration's `<id>.<secret>`,
          or a person's `p.<id>.<secret>` (ADR-0035, amended 2026-09-29).
        schema: { type: string }
    get:
      tags: [Grant links]
      summary: The migration's progress, for the person being migrated
      description: |
        ADR-0035 gives the migrator's link two lifetimes. This is the second:
        longer-lived than the credential step, revocable at any moment, and
        carrying **counts and states rather than content** — which is precisely
        what makes the longer window acceptable.

        So it answers who is asking (the organisation's name), where the
        migration is in its life, whether any pass has run at all, one row per
        domain, and when the link stops working. It says nothing else: not the
        mapping id, not the tenant id, not the migration's name, not any
        address, folder, file or subject line, and **not the provider's own
        error prose** — a rejection quoting a file name is content. The failure
        CATEGORY crosses in its place, which is the half a person can act on.

        `started: false` means no pass has ever touched this migration, and is
        deliberately not the same answer as five domains of zero. Absence and
        zero are different facts and only one of them is reassuring.

        Repeatable by design — `view` links are exempt from single-use, unlike
        the credential ones — so this is a GET that changes nothing.

        For a person's link the answer is every migration of theirs (`kind:
        person`, `PersonProgressPage`), each with the same counts and states,
        grouped by the Google account it reads under an opaque `ref`, never
        the address.

        Since workplan 0154 T8 each row also says its stage and what
        discovery found (`ProgressRow`), and each migration when its check
        passed and how long (`ProgressTime`), as the owner's pages say them.
      security: []
      responses:
        '200':
          description: Counts and states.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/PersonProgressPage'
                  - type: object
                    properties:
                      organisation: { type: string }
                      state:
                        type: string
                        enum: [paused, active, cutover, done, continuous]
                      started:
                        type: boolean
                        description: False when no pass has ever run — not the same as zero.
                      expiresAt: { type: string, format: date-time }
                      domains:
                        type: array
                        items: { $ref: '#/components/schemas/ProgressRow' }
                      from:
                        type: string
                        description: The source's kind, such as gmail or imap, to name who slowed it in `time`.
                      checkPassedAt:
                        type: string
                        format: date-time
                        description: When the check passed (workplan 0154 T8); absent unless it passed.
                      time: { $ref: '#/components/schemas/ProgressTime' }
                      grant:
                        description: |
                          The grant this page may take back (workplan 0108 T8 (c)).
                          `granted`: the migration reads the account on a grant
                          given through a link. `withdrawn`: it was taken back, and
                          when; nothing reads the account until somebody grants
                          again. `none`: there is nothing here to take back.
                        oneOf:
                          - type: object
                            required: [state]
                            properties:
                              state: { type: string, enum: [granted] }
                          - type: object
                            required: [state, withdrawnAt]
                            properties:
                              state: { type: string, enum: [withdrawn] }
                              withdrawnAt: { type: string, format: date-time }
                          - type: object
                            required: [state]
                            properties:
                              state: { type: string, enum: [none] }
        '401':
          description: |
            One sentence for every way a link can fail — unknown, forged,
            expired, revoked, wrong purpose, malformed. A credential link
            presented here is refused on its purpose, which is what keeps the
            two lifetimes apart. The body is `{error, message, messageNl}`:
            the sentence in English and in Dutch, and the page shows the one
            in its language (workplan 0145 T6).
        '409':
          description: |
            The link is good but the migration no longer exists. The sentence is
            written to be forwarded to whoever sent the link. The body is
            `{error, reason, reasonNl}`, in English and in Dutch.
        '503':
          description: |
            The link could not be checked just now. Ours, not the caller's.
            The body is `{error, message, messageNl}`, as for 401.

  /api/view/{link}/withdraw:
    parameters:
      - name: link
        in: path
        required: true
        description: |
          The whole credential, one path segment: a migration's `<id>.<secret>`,
          or a person's `p.<id>.<secret>`.
        schema: { type: string }
    post:
      tags: [Grant links]
      summary: Take back the grant, for the person who gave it
      description: |
        Workplan 0108 T8 (c), the owner's decision of 2026-09-23: *"if we
        cannot revoke at the sources, we do revoke/remove in our system and
        tell the person that revokes."*

        Revokes the token the migration's grant stored at Google, deletes it
        here **whatever Google answered**, records `mapping.grant_withdrawn`,
        and answers which of the two happened. Google takes back everything the
        person allowed the application at once, so another migration of the
        same account through the same application stops too.

        From then on nothing reads the account, on that token or on any other
        credential the source connection holds: the tick starts no pass, a
        running pass stops starting new items within about fifteen seconds,
        and finishes the ones it has begun (a very large file can take
        longer), and Start and Sync now refuse with `grant_withdrawn`. A new
        grant ends it. Only the grant a link stored is ever deleted; the
        organisation's own credential, on the connection, is never touched.

        A body-less POST for a migration's link. Link-authenticated like the
        grant route: the link is the whole credential, and a credential
        (`grant`) link is refused here.

        For a person's link it is per Google account (ADR-0035, amended
        2026-09-29): the body names the account by the `ref` the page read.
        Each token its migrations hold is revoked at Google, and every
        migration of that account holding one is cleared, with a
        `mapping.grant_withdrawn` row each. A `ref` that no longer matches what
        is held (a grant given again, or taken back elsewhere) deletes nothing
        and answers `changed`.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                account:
                  type: string
                  pattern: '^[0-9a-f]{32}$'
                  description: For a person's link only, the account's `ref` as the page read it.
      responses:
        '200':
          description: Withdrawn here; `atGoogle` says whether Google confirmed it too.
          content:
            application/json:
              schema:
                type: object
                required: [withdrawnAt, atGoogle]
                properties:
                  withdrawnAt: { type: string, format: date-time }
                  atGoogle:
                    type: string
                    enum: [revoked, not_confirmed]
                    description: |
                      `revoked` includes a token Google reports was already
                      invalid. `not_confirmed`: Google refused or could not be
                      reached; the person is told to remove the app themselves.
        '400':
          description: A person's link with no `account`, or not one a page could have read. Nothing was changed.
        '401':
          description: The link is not a live progress link. Nothing was changed.
        '409':
          description: |
            Nothing to take back (`nothing_granted`: never granted through a
            link, or already withdrawn, with the day), the migration no longer
            exists (`not_found`), or a new grant landed while this one was being
            withdrawn (`changed`; nothing was deleted, press again). `reason` is
            written for the person holding the link; for a person's link
            `reasonNl` says it in Dutch.
        '500':
          description: Ours; nothing the person did.

