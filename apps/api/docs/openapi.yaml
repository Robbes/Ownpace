  /api/migrations/{mappingId}/deletions:
    parameters:
      - $ref: '#/components/parameters/MappingId'
    get:
      tags: [Operating]
      summary: Items the source no longer has
      description: |
        Watched, not acted on. An item appears here when the source stopped
        reporting it; nothing is deleted on the target until a person applies
        it, and then only with evidence.

        Beside them, `earlierExports` (`waiting`, `kept`): copies an earlier
        export policy left on the target (workplan 0042 T8 (b)). The same
        Google document is copied under the name the current policy gives it,
        so these are not deletions, and they count in none of the deletion
        counts or the mass-deletion breaker. A waiting one is kept through
        the keep route below.
      responses:
        '200':
          description: The deletion queue.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/migrations/{mappingId}/deletions/{hash}/keep:
    parameters:
      - $ref: '#/components/parameters/MappingId'
      - $ref: '#/components/parameters/Hash'
    post:
      tags: [Operating]
      summary: Keep this item on the target
      description: Decides the queue entry the safe way — the copy stays, and it stops being watched. Also keeps an earlier export (`earlierExports.waiting`).
      responses:
        '200':
          description: Kept.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/migrations/{mappingId}/deletions/{hash}/apply:
    parameters:
      - $ref: '#/components/parameters/MappingId'
      - $ref: '#/components/parameters/Hash'
    post:
      tags: [Operating]
      summary: Delete this item on the target
      description: |
        The one destructive endpoint, and it refuses more often than it acts.
        All of the following must hold, and the refusal names which one did
        not: the migration allows applying deletions, the item carries recorded
        deletion evidence, and the bytes are ours — an item that was already on
        the target when we arrived (`adopted`) is refused as `not_ours`,
        because deleting what we never copied is not this product's business.

        Enqueues; poll `/receipt` for the outcome. `refused` is a legitimate
        terminal state, not a failure.
      responses:
        '202':
          description: Enqueued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  queued: { type: boolean }
                  receipt: { $ref: '#/components/schemas/DeletionReceipt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Refused, naming the gate that said no.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `platform_held` (`PlatformHeld`): an operator hold is open.
            `account_closed` (`AccountClosed`): the organisation was closed
            (workplan 0085 T2). Either way nothing was enqueued or written.
          content:
            application/json:
              schema:
                anyOf:
                  - { $ref: '#/components/schemas/PlatformHeld' }
                  - { $ref: '#/components/schemas/AccountClosed' }

  /api/migrations/{mappingId}/deletions/{hash}/receipt:
    parameters:
      - $ref: '#/components/parameters/MappingId'
      - $ref: '#/components/parameters/Hash'
    get:
      tags: [Operating]
      summary: What happened to an applied deletion
      description: |
        A failed receipt's `error` is the target's message in our words, as
        the failures queue says a failure (workplan 0136 T3, second step). A
        refusal's `reason` is a gate's, and reads as written.
      responses:
        '200':
          description: The receipt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionReceipt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/migrations/{mappingId}/apply-deletions:
    parameters:
      - $ref: '#/components/parameters/MappingId'
    get:
      tags: [Operating]
      summary: Whether this migration may apply deletions at all
      responses:
        '200':
          description: The flag and where it is set.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Operating]
      summary: Turn applying deletions on or off
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                allowApplyDeletions: { type: boolean }
      responses:
        '200':
          description: The stored flag.
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/migrations/{mappingId}/sharing:
    get:
      tags: [Migrations]
      summary: The sharing checklist
      description: |
        Every grant the §14.2 inventory discovered for this migration, held as
        checklist rows (ADR-0032): `open` rows wait on the owner; settled rows
        (`applied` / `done_manual` / `skipped`) keep who decided and when. The
        summary is the progress line. Decisions survive rescans.
      parameters:
        - { name: mappingId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The rows and the progress summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  migrationStatus: { type: string }
                  summary:
                    type: object
                    properties:
                      total: { type: integer }
                      open: { type: integer }
                      applied: { type: integer }
                      doneManual: { type: integer }
                      skipped: { type: integer }
                      openManual: { type: integer }
                  grants:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        subject: { type: string }
                        onLabel: { type: string }
                        grantee: { type: string }
                        role: { type: string }
                        viaLink: { type: boolean }
                        raw: { type: string }
                        verdict: { type: string, enum: [clean, manual] }
                        verdictTarget: { type: string }
                        state: { type: string, enum: [open, applied, done_manual, skipped] }
                        stateReason: { type: string }
                        decidedBy: { type: string }
                        decidedAt: { type: string }
                        scannedAt: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Unknown mapping. }
  /api/migrations/{mappingId}/sharing/announce:
    post:
      tags: [Migrations]
      summary: Mail the fallback announcement for by-hand shares
      description: |
        The announcement the platform cannot make (workplan 0104 T3). One
        press mails a Template-6 digest to each grantee of a `done_manual`
        row — the shares somebody carried over by hand, where no target API
        ever notified anybody. The note is REQUIRED: the "where" comes from
        the person who did the carrying. Rows the one-go press applied need
        nothing here (the platform already spoke); rows without an address
        (links) are counted, never silently dropped. Per grantee: their items
        only.

        One wave per data type (workplan 0128 T5, slice 6): a press announces
        the shares carried by hand of each data type at or past its own
        cutover, and leaves the others, counted in `waitingForCutover`, for
        the press at theirs; with none of them cut over it is refused, naming
        the data types that wait. Each data type is announced once: one
        announced before is left out, counted in `alreadyAnnounced`, and is
        mailed again only on purpose (`confirmResend: true`), never as a
        silent duplicate.
      parameters:
        - { name: mappingId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string, maxLength: 1000, description: Where things live now, in the presser's own words — carried in the mail body. }
                locale: { type: string, enum: [en, nl] }
                confirmResend: { type: boolean, description: True to mail the data types announced before again, on purpose. }
      responses:
        '200':
          description: Who was told, who could not be.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  pressedBy: { type: string }
                  sent: { type: array, items: { type: string } }
                  failed: { type: array, items: { type: string } }
                  platformAnnounced: { type: integer }
                  withoutAddress: { type: integer }
                  resend: { type: boolean, description: Whether this press mailed a data type announced before. }
                  waitingForCutover: { type: integer, description: Shares carried by hand left for their own data type's cutover. }
                  alreadyAnnounced: { type: integer, description: Shares carried by hand left out because their data type was announced before. }
        '400': { description: The note is missing — the announcement must say where. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Unknown mapping. }
        '409': { description: 'Nothing it may announce is cut over (`not_cut_over`), no mail channel (`notifications_off`), or every data type that may go was announced before and confirmResend is not set (`already_announced`).' }
  /api/migrations/{mappingId}/sharing/apply-all:
    post:
      tags: [Migrations]
      summary: Apply every open, clean sharing row in one recorded press
      description: |
        The one-go press (workplan 0104 T1): every open row with a clean
        verdict and an addressable grantee is applied through the target's
        share API, in one recorded human action, at or after cutover — and
        because creating a share is what makes the target notify its grantee,
        this press is the chosen announcement moment: one wave of
        platform-native mail, sent by the target, not by this product. The
        optional `note` rides inside the platform's own notification. Link
        shares and manual verdicts stay on the checklist untouched (they are
        the fallback digest's audience). A refusal on one row never stops the
        next; refused rows stay open with the target's words, and a second
        press retries exactly those.
      parameters:
        - { name: mappingId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 500, description: The owner's context, carried inside the platform's own notification where the API supports it. }
      responses:
        '200':
          description: What the press did, row by row.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  pressedBy: { type: string }
                  applied: { type: array, items: { type: object } }
                  refused:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        on: { type: string }
                        grantee: { type: string }
                        code: { type: string }
                        reason: { type: string }
                  leftForChecklist:
                    type: object
                    properties:
                      links: { type: integer }
                      manual: { type: integer }
                  waitingForCutover: { type: integer, description: Rows left open for their own data type's cutover (workplan 0128 T5, slice 6). }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Unknown mapping. }
        '409':
          description: |
            Not cut over yet — the press refuses with the reason. Or
            `account_closed` (`AccountClosed`): the organisation was closed
            (workplan 0085 T2), and no share is created.
          content:
            application/json:
              schema:
                anyOf:
                  - { $ref: '#/components/schemas/Refusal' }
                  - { $ref: '#/components/schemas/AccountClosed' }
  /api/migrations/{mappingId}/sharing/apply-folder:
    post:
      tags: [Migrations]
      summary: Apply one folder's worth of sharing rows, every address confirmed first
      description: |
        The folder press (2026-09-19). The sharing page folds a container and
        the items inside it into one row; this applies that row's open, clean,
        addressable grants through the target's share API, in one recorded
        action, at or after cutover.

        It is not the one-go press with a filter — it carries its own gate.
        ADR-0032 §6 has a person confirm or correct each grantee's address
        once, and a folder press reaches every grantee in the folder at once,
        so **every distinct grantee must appear in `confirmed` with a non-empty
        address, or nothing is sent**: the 409 names exactly who is missing. An
        entry may repeat the source's own address unchanged; §6 asks for a
        person's judgement on the address, not for it to be different.

        Which rows are in the folder is derived server-side with the same
        grouping rule the screen folds with, from `parentKey` alone — a caller
        cannot widen a press by listing rows. Rows that deviate from their
        container are not in the group and so are never part of this press,
        which is the point of surfacing them above the fold. Link shares and
        manual verdicts are counted and left, as the one-go press leaves them.
      parameters:
        - { name: mappingId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parentKey]
              properties:
                parentKey: { type: string, description: The container to apply, in the source's own ids — the `parent_key` the sharing rows carry. }
                confirmed:
                  type: object
                  additionalProperties: { type: string }
                  description: Where to send, per grantee the SOURCE named — one address a person confirmed or corrected (ADR-0032 §6). An empty value is not a confirmation.
                note: { type: string, maxLength: 500, description: The owner's context, carried inside the platform's own notification where the API supports it. }
      responses:
        '200':
          description: What the press did, row by row.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  pressedBy: { type: string }
                  parentKey: { type: string }
                  applied: { type: array, items: { type: object } }
                  refused:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        on: { type: string }
                        grantee: { type: string }
                        code: { type: string }
                        reason: { type: string }
                  leftForChecklist:
                    type: object
                    properties:
                      links: { type: integer }
                      manual: { type: integer }
        '400': { description: No `parentKey` was named. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Unknown mapping, or no folder group under that container. }
        '409':
          description: |
            Not cut over yet, or a grantee in this folder has no confirmed
            address. The latter carries `grantees` — exactly who is missing —
            so the screen can ask for them rather than saying "some address".
            Or `account_closed` (`AccountClosed`): the organisation was closed
            (workplan 0085 T2), and no share is created.
          content:
            application/json:
              schema:
                anyOf:
                  - { $ref: '#/components/schemas/AccountClosed' }
                  - type: object
                    properties:
                      error: { type: string }
                      reason: { type: string }
                      grantees: { type: array, items: { type: string } }
  /api/migrations/{mappingId}/sharing/rescan:
    post:
      tags: [Migrations]
      summary: Refresh the sharing checklist from the inventory scans
      description: |
        Runs the same scans the permission report composes and upserts the
        queue's rows. A known row only refreshes its scan time — an owner's
        decision is never reset to open by looking again. What could not be
        read comes back as `blindSpots`, verbatim.
      parameters:
        - { name: mappingId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: How many rows now wait, and what could not be read.
          content:
            application/json:
              schema:
                type: object
                properties:
                  open: { type: integer }
                  blindSpots: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Unknown mapping. }
        '409':
          description: |
            The mapping records no mailbox to inventory. Or `account_closed`
            (`AccountClosed`): the organisation was closed (workplan 0085 T2),
            and its accounts are not read.
          content:
            application/json:
              schema:
                anyOf:
                  - { $ref: '#/components/schemas/Refusal' }
                  - { $ref: '#/components/schemas/AccountClosed' }
  /api/migrations/{mappingId}/sharing/{grantId}/decision:
    post:
      tags: [Migrations]
      summary: Settle one sharing-checklist row
      description: |
        `apply` re-creates the grant on the target through its own share API —
        the target then notifies the grantee itself (the invite IS the
        notification, ADR-0032 §4) — and is gated: only after the migration is
        finished, only clean verdicts, never link shares, and only on a target
        with a share API. `done` ticks the row off as handled by hand; `skip`
        records that it deliberately does not carry over. Every refusal is an
        answer with the reason verbatim; every settled row keeps who and when.
      parameters:
        - { name: mappingId, in: path, required: true, schema: { type: string } }
        - { name: grantId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [apply, done, skip] }
                reason: { type: string }
                grantee: { type: string, description: Overrides the grant's address on apply (the owner-confirmed target identity). }
      responses:
        '200':
          description: The settled row.
        '400': { description: Unknown action. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Unknown mapping or row. }
        '409':
          description: |
            The refusal, with its reason verbatim. Or `account_closed`
            (`AccountClosed`): `apply`, for an organisation that was closed
            (workplan 0085 T2). Ticking a row off by hand, or skipping it, is
            not refused for that.
          content:
            application/json:
              schema:
                anyOf:
                  - { $ref: '#/components/schemas/Refusal' }
                  - { $ref: '#/components/schemas/AccountClosed' }
  /api/migrations/{mappingId}/completion-report:
    get:
      tags: [Migrations]
      summary: The migration completion report
      description: |
        One document saying what moved, what is waiting on a decision, and
        what was removed on whose decision — assembled by the shared builder
        both editions serve, from data every screen already shows. `markdown`
        is the deliverable an owner downloads and hands over; `report` is the
        same content as data, which the report page draws in the reader's
        language (workplan 0154 T5). Each of its `domains` lines carries
        `itemsFound`, what discovery found of the data type, where a count
        exists (absent, never 0, where none does), and `itemsAdopted`, what
        was left as it already was.
      parameters:
        - { name: mappingId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The report and its Markdown rendering.
          content:
            application/json:
              schema:
                type: object
                properties:
                  report: { type: object }
                  markdown: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Unknown mapping. }
  /api/migrations/{mappingId}/moves:
    parameters:
      - $ref: '#/components/parameters/MappingId'
    get:
      tags: [Operating]
      summary: Items someone moved on the source
      responses:
        '200':
          description: The move queue.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/migrations/{mappingId}/moves/{hash}/keep:
    parameters:
      - $ref: '#/components/parameters/MappingId'
      - $ref: '#/components/parameters/Hash'
    post:
      tags: [Operating]
      summary: Leave the target copy where it is
      responses:
        '200':
          description: Kept.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/migrations/{mappingId}/moves/{hash}/apply:
    parameters:
      - $ref: '#/components/parameters/MappingId'
      - $ref: '#/components/parameters/Hash'
    post:
      tags: [Operating]
      summary: Remove the target's OLD copy of a relocated item
      description: |
        The second destructive endpoint (ADR-0030), admissible only for a
        RELOCATION — a file whose move or rename changed its path-shaped
        natural key, so the same bytes are already on the target under the new
        one. An ordinary move (mail, calendar) is refused as `not_relocated`,
        and a move the owner already answered with keep as `already_kept`.
        Shares the migration's apply-deletions switch: it is the same
        capability.

        Enqueues; poll the moves `/receipt` for the outcome — the relocation's
        OWN receipt, since the same item can have a deletion receipt open at
        the same time. The worker re-runs every gate and asks the target
        whether the relocated copy is really there before removing anything.
      responses:
        '202':
          description: Enqueued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  queued: { type: boolean }
                  receipt: { $ref: '#/components/schemas/DeletionReceipt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Refused, naming the gate that said no.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `platform_held` (`PlatformHeld`): an operator hold is open.
            `account_closed` (`AccountClosed`): the organisation was closed
            (workplan 0085 T2). Either way nothing was enqueued or written.
          content:
            application/json:
              schema:
                anyOf:
                  - { $ref: '#/components/schemas/PlatformHeld' }
                  - { $ref: '#/components/schemas/AccountClosed' }

  /api/migrations/{mappingId}/moves/{hash}/receipt:
    parameters:
      - $ref: '#/components/parameters/MappingId'
      - $ref: '#/components/parameters/Hash'
    get:
      tags: [Operating]
      summary: What happened to an applied relocation
      description: |
        A failed receipt's `error` is the target's message in our words, as
        the failures queue says a failure (workplan 0136 T3, second step). A
        refusal's `reason` is a gate's, and reads as written.
      responses:
        '200':
          description: The receipt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionReceipt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/migrations/{mappingId}/failures:
    parameters:
      - $ref: '#/components/parameters/MappingId'
    get:
      tags: [Operating]
      summary: Items that would not migrate
      description: |
        Each carries the reason a pass recorded, in our words where it came
        from a host a tester typed (workplan 0136 T3, second step): our prose
        and the status stay, and what the server sent stays only when it is
        an error document of a kind we know (a WebDAV `error`, Google's GData
        or JSON error, Sabre's, a JMAP problem document, an IMAP `NO`).
        Anything else reads *"the server answered with something that is not
        a DAV, JMAP or IMAP error"*. A socket error is said without the name
        it tried. A source refusal from a provider's fixed host, and a refusal
        of ours, read as recorded. The ledger keeps the full text. No route
        serves it: the operator reads it on the database, by the item's
        `naturalKeyHash`. The migration page's failure line, the completion
        report, the discovery counts, the run events, the Check page's report
        (`verify/report`) and an apply receipt's error answer the same way.
        The queue also names the migration's source (`sourceKind`, the source
        connection's kind: `dropbox`, `google`, …), because a remedy is chosen
        by source as well as by category: a Dropbox Paper doc is
        `policy_refused`, and Drive's sentence for that names a setting
        Dropbox does not have (workplan 0150 D9).
      responses:
        '200':
          description: The failure queue.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Operating]
      summary: Retry or accept every failure matching a selection
      description: |
        One decision over a group, for the case the per-item route cannot
        serve: a connector bug parks items by the dozen, and its fix parks
        nothing — but parking does not clear itself, so every item the old
        code exhausted stays parked for a defect that no longer exists.

        `retry` zeroes the attempt count on each matching item AND clears the
        mapping's cursors once for the whole group, because retry has always
        been those two things together (ADR-0020: cursors are not
        authoritative, so a full re-scan is the cost and the pass stays
        idempotent). Hand-written SQL against the ledger is only ever the
        first half, which is why this route exists rather than a runbook.

        `accept` is terminal: each matching item becomes `left_behind`, keeps
        its error for the audit trail, and stops counting against the
        verification gate.

        Only items still `failed` are touched — one that has since succeeded,
        or that somebody already accepted, is not reopened by a bulk press.

        **It must narrow.** A request setting neither `domain` nor a non-empty
        `errorContains` is refused with `400`. Not because a retry is
        dangerous (it writes nothing to anybody's account) but because this
        queue also holds policy refusals, which re-park the moment they are
        seen again: "retry everything" costs a refetch per undecidable item
        and changes nothing about them, which is not what the person pressing
        it meant.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FailureGroupDecision' }
      responses:
        '200':
          description: |
            Recorded, with the number of items it actually changed. `matched: 0`
            is a successful call that changed nothing — usually a substring
            that does not occur, since it is matched literally.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupDecisionAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/migrations/{mappingId}/failures/{hash}/{action}:
    parameters:
      - $ref: '#/components/parameters/MappingId'
      - $ref: '#/components/parameters/Hash'
      - name: action
        in: path
        required: true
        description: |
          `retry` queues the item again. `accept` records that this item is not
          coming across — a decision, kept, so the finish checklist can count
          it instead of pretending the queue is empty.
        schema:
          type: string
          enum: [retry, accept]
    post:
      tags: [Operating]
      summary: Retry or accept a failed item
      responses:
        '200':
          description: Recorded.
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/migrations/{mappingId}/confirm:
    parameters:
      - $ref: '#/components/parameters/MappingId'
    post:
      tags: [Operating]
      summary: Start a confirmation pass
      description: |
        Re-reads every item from the destination and records what the target
        said about each one (workplan 0117 T2, decision D7(a)). Enqueues and
        answers immediately: a pass reads whole accounts and takes minutes, so
        it is a job somebody starts and we report on, never a wait.

        Idempotent: while a confirmation is already running for this mapping the
        call JOINS it and answers `200` with `started: false` — a second pass
        would pay for every byte twice to answer a question already being
        answered.

        It shares the tenant's rate budget with any migration running against
        the same destination (decision D9), so a large confirmation makes that
        copying slower rather than racing it for the provider's allowance.

        Answers `202` with no ledger run id: the run row is opened by the worker,
        which owns the rule that a run row always closes. Poll the mapping's
        runs for the latest `confirm` run.
      responses:
        '200':
          description: A confirmation was already running; this call joined it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfirmStartResponse' }
        '202':
          description: |
            Enqueued. No `runId`: the run row is the worker's, opened when the
            job runs, because the pass owns the rule that a run row always
            closes. Poll the list's `lastPass` instead.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfirmStartResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `platform_held` (`PlatformHeld`): an operator hold is open.
            `account_closed` (`AccountClosed`): the organisation was closed
            (workplan 0085 T2). Either way nothing was enqueued or written.
          content:
            application/json:
              schema:
                anyOf:
                  - { $ref: '#/components/schemas/PlatformHeld' }
                  - { $ref: '#/components/schemas/AccountClosed' }
        '502':
          description: The pass could not be enqueued; nothing was written, so nothing is left claiming to run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/migrations/{mappingId}/confirmed-list:
    parameters:
      - $ref: '#/components/parameters/MappingId'
    get:
      tags: [Operating]
      summary: The confirmed list — headline, the rows that are not verified, the total
      description: |
        What a confirmation pass found, as the list somebody reads before they
        delete their originals (workplan 0117 T2, decision D10).

        Three numbers and a set of rows, and the shape is the decision rather
        than a rendering choice: `verified` is the headline, `total` is the
        whole account, and `rows` carries every row that is NOT verified —
        questions and warnings, the part somebody can act on. A list of a
        hundred thousand verified files is unusable, and a list quietly trimmed
        to look shorter tells somebody their library is smaller than it is;
        stating the total is how both are avoided.

        `rows` is bounded by the server. `truncated: true` says so when it
        happened — the complete account is the export, which is bounded by
        nothing. It is not a rare case: before any pass has run, NO row is
        verified.

        `state` is derived at read time, never stored. What the database holds
        is what the target SAID; the word is worked out from that plus the
        ledger's own status every time the list is read, so a row cannot go on
        claiming something a later, better reading would have corrected.

        `unchecked` means *we did not manage to look* and is deliberately not
        the same answer as `missing` (*we placed it and it is gone*). A network
        outage must never read as a lost item on the page somebody empties a
        folder from.

        **This walks the mapping's items**, because the headline is derived
        rather than stored. It is a page somebody opens, not something to poll:
        a screen watching a pass should poll the mapping's runs, which reads one
        row, and re-read this when the run lands.
      responses:
        '200':
          description: The list.
          content:
            application/json:
              schema:
                type: object
                description: |
                  Keyed by mapping id — the shape every operating queue takes,
                  so the one React app reads this and the appliance's answer
                  (which carries every mapping in its config directory) with the
                  same code. This path names one mapping, so there is one key.
                additionalProperties:
                  type: object
                  required: [migrationStatus, verified, total, rows, lastPass, byState]
                  properties:
                    migrationStatus: { type: string }
                    verified:
                      type: integer
                      description: Rows re-read from the destination that matched. Nothing else counts.
                    total:
                      type: integer
                      description: Every item in the account, including the ones `rows` does not carry.
                    byState:
                      type: object
                      description: |
                        Every item counted by state — the account, whole.

                        `verified` is the headline and must not widen, so the
                        rest of the account is counted instead of implied. A
                        migration into a destination that already holds the
                        customer's own copies comes back mostly `yours`, which
                        can never be `verified` (nobody re-read those bytes),
                        and a page showing only the headline then leads with a
                        nought over an account that is largely in place.

                        Counted over every item by the server, not from `rows`:
                        `rows` is bounded, and a screen tallying what it was
                        sent would describe the first page as if it were the
                        account. `byState.verified` equals `verified`.
                      required:
                        [verified, differs, present, yours, missing, never-placed, removed, unchecked]
                      additionalProperties: false
                      properties:
                        verified: { type: integer }
                        differs: { type: integer }
                        present: { type: integer }
                        yours: { type: integer }
                        missing: { type: integer }
                        never-placed: { type: integer }
                        removed: { type: integer }
                        unchecked: { type: integer }
                    truncated:
                      type: boolean
                      description: '`rows` is the first N of more. The export carries the rest.'
                    rows:
                      type: array
                      items:
                        type: object
                        required: [state, claim, domain, collection, naturalKey, confirmedAt]
                        properties:
                          state:
                            type: string
                            enum: [verified, differs, present, yours, missing, never-placed, removed, unchecked]
                          claim:
                            type: string
                            enum: [byte-hash, fingerprint, none]
                            description: |
                              What "matched" means for this row. A calendar server
                              re-serialises what it stores, so a calendar row can
                              only ever be compared by fingerprint — saying
                              "verified by hash" over one would be a lie of a word.
                          domain: { type: string }
                          collection: { type: string, description: Where it sits on the destination. }
                          naturalKey: { type: string, description: 'The item''s own identifier: a Message-ID, a file path, a UID.' }
                          confirmedAt:
                            type: string
                            format: date-time
                            nullable: true
                            description: When the destination was asked. `null` = never.
                    lastPass:
                      type: object
                      required: [state]
                      description: |
                        Where the last pass got to. Needed rather than decorative:
                        before any pass every row reads `unchecked`, and after a
                        pass that could not reach the destination every row reads
                        `unchecked` too — the rows alone cannot tell those apart.
                        `stopped` is a pass the close of this organisation
                        stopped while it ran (workplan 0139 T7): not a failure,
                        and not finished, with `because` saying why.
                      properties:
                        state:
                          type: string
                          enum: [never-run, running, done, failed, stopped]
                        startedAt: { type: string, format: date-time }
                        finishedAt: { type: string, format: date-time }
                        because:
                          type: string
                          enum: [organisation-closed]
                          description: With `stopped`, why the pass stopped.
                    pausedAt:
                      type: object
                      description: |
                        Why the account is only part checked, when it is. A pass
                        that stops at the provider's daily ceiling is a scheduled
                        stop, not a failure — and without this the honest numbers
                        read as a bad result.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/migrations/{mappingId}/confirmed-list/export:
    parameters:
      - $ref: '#/components/parameters/MappingId'
    get:
      tags: [Operating]
      summary: The confirmed list as CSV — every row, verified ones included
      description: |
        The full export half of decision D10, and the difference from the list
        above is the point: the screen shows what is actionable, while somebody
        reconciling against the account they are about to empty needs to search
        for one file and see the word `verified` beside it.

        Bounded by nothing, and streamed rather than assembled, so a
        family-sized account does not have to fit in memory to be downloaded.

        Written for a spreadsheet: a UTF-8 BOM (without one Excel reads the file
        in the local codepage and every accented name arrives as mojibake), CRLF
        line endings and RFC 4180 quoting. A field that would otherwise begin
        with `=`, `+`, `-` or `@` is prefixed with an apostrophe — mail subjects
        and file names are written by whoever sent them, and a spreadsheet
        evaluates a cell that starts with one of those.
      responses:
        '200':
          description: The whole list.
          content:
            text/csv:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/migrations/{mappingId}/verify/start:
    parameters:
      - $ref: '#/components/parameters/MappingId'
    post:
      tags: [Operating]
      summary: Start a verification scan
      description: |
        Reads the destination and compares it with the ledger. Enqueues; poll
        `/verify/report`. A domain that was not enabled is reported `SKIPPED`
        with the reason, never as a pass.
      responses:
        '202':
          description: Enqueued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  started: { type: boolean }
                  report: { $ref: '#/components/schemas/VerificationRunReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `platform_held` (`PlatformHeld`): an operator hold is open.
            `account_closed` (`AccountClosed`): the organisation was closed
            (workplan 0085 T2). Either way nothing was enqueued or written.
          content:
            application/json:
              schema:
                anyOf:
                  - { $ref: '#/components/schemas/PlatformHeld' }
                  - { $ref: '#/components/schemas/AccountClosed' }
        '502':
          description: The scan could not be enqueued; the run row is landed as failed with the reason.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/migrations/{mappingId}/verify/report:
    parameters:
      - $ref: '#/components/parameters/MappingId'
    get:
      tags: [Operating]
      summary: The latest verification report
      description: |
        Reads the latest run row and triggers nothing — polling this is free.
        An issue that quotes what the target answered, a recommendation, and a
        failed scan's `error` are said in our words, as the failures queue
        says a failure (workplan 0136 T3, second step). The row keeps the full
        text.
      responses:
        '200':
          description: The report.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationRunReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/migrations/{mappingId}/finish:
    parameters:
      - $ref: '#/components/parameters/MappingId'
    post:
      tags: [Operating]
      summary: Finish a migration
      description: |
        Stops watching the source. Adds and removes nothing on either system —
        what is on the destination stays exactly as it is.

        Refused while the queues still hold undecided items unless the caller
        says explicitly to finish anyway, because finishing with items
        outstanding leaves them behind silently.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  description: Finish despite outstanding decisions, leaving them behind.
      responses:
        '200':
          description: Finished.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Refused — decisions are still outstanding.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/attention:
    get:
      tags: [Decisions]
      summary: Everything waiting on a person, across every queue
      description: |
        One line per migration, counted by the same function the weekly digest
        counts with. It exists because the screen named "Attention" rendered
        the drift queue alone, so an owner whose digest said "34 items that
        could not be copied" opened the tab it pointed at and found it empty.

        Auto-applied relocations are reported as zero: they are news the digest
        bounds by its own window, not a queue anybody can act on.

        `graceEnded` names the data types whose grace period ended while nobody
        chose (workplan 0128 D7): still in their cutover, no longer copying,
        and waiting on End or Keep copying on the Finish page. Absent when none.

        A migration whose status is `done` is omitted entirely — a finished
        migration keeps its history and stops nagging. A queue that could not
        be READ is reported as a blind spot carrying the reason, never as zero.

        A pending drift decision belongs to the ORGANISATION, not to a
        migration, so it is counted once. When a migration reports, it rides on
        the first one; when none does — a tenant whose every migration is
        `done`, which is the tenant nobody is watching — it comes back under
        `tenant` instead, so it is not lost. `tenant` is therefore present only
        when `mappings` is empty and something is actually waiting, and it is
        never removed by `all`.
      parameters:
        - name: all
          in: query
          required: false
          schema: { type: boolean }
          description: |
            `true` keeps the migrations that want nothing, so a screen can say
            which ones are quiet. Default lists only what wants a person. It
            filters `mappings` only, never `tenant`.
      responses:
        '200':
          description: What is waiting, per migration and for the organisation.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/people:
    get:
      tags: [People]
      summary: Everyone being moved, with their migrations
      description: |
        Oldest first, each person with their migrations' states and those
        states counted. A person has no state of its own: a screen reads what
        to say about one from their migrations (hard rule 10). `unassigned`
        lists the migrations that belong to nobody, which is every migration
        made before people existed.

        A read that fails answers 500 with a reference, never an empty list.
      responses:
        '200':
          description: The people, and the migrations that are nobody's.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PeopleResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [People]
      summary: Add a person to move
      description: |
        A name, and optionally an email address. The address is stored with
        the person for grant links (0108); nothing sends mail to it yet. Not
        refused for a closed organisation: a person is a name, and starts no
        work.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePerson' }
      responses:
        '201':
          description: The person, with no migrations yet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Person' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/people/{personId}/migrations:
    parameters:
      - $ref: '#/components/parameters/PersonId'
    post:
      tags: [People]
      summary: Add a migration to a person
      description: |
        A migration belongs to one person at most. Adding one that is already
        this person's changes nothing and answers 200. One that is somebody
        else's stays theirs: 409 `with_another_person`, naming whose.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddPersonMigration' }
      responses:
        '201':
          description: Added. The person, with their migrations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Person' }
        '200':
          description: It was already theirs. Nothing changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Person' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: |
            `person_not_found` or `migration_not_found`: this organisation has
            no such person, or no such migration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: '`with_another_person`: the migration is already somebody else''s.'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - type: object
                    required: [personId]
                    properties:
                      personId: { type: string, format: uuid, description: The person it belongs to. }

  /api/people/{personId}:
    parameters:
      - $ref: '#/components/parameters/PersonId'
    delete:
      tags: [People]
      summary: Delete a person, and no migration
      description: |
        The person goes. Their migrations are not deleted: they belong to
        nobody again, and the answer lists them. Deleting a migration is its
        own two-press delete (`DELETE /api/migrations/{mappingId}`).
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonDeleted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: '`person_not_found`: this organisation has no such person.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/people/{personId}/links:
    parameters:
      - $ref: '#/components/parameters/PersonId'
    post:
      tags: [Grant links]
      summary: Issue a person's grant link, and see it once
      description: |
        One link for all of a person's migrations (ADR-0035, amended
        2026-09-29; workplan 0153 T5 (b)). Its page asks each Google account
        the person's migrations read that is not connected once, for
        everything those migrations need, and the grant lands on each
        migration the page listed. It is spent once every account on it is
        granted.

        When every account is connected already, the link asks each of them
        again (`asksAgain`; managed migration 0036): a connection can stop
        working while its token is still held. It is then spent once each
        has been connected through it.

        As `POST /api/migrations/{mappingId}/links`: owner or admin, the URL
        said once, sent by you and never by Ownpace, within the
        organisation's live-link limit (a person's link counts once), and
        waiting for the current texts while the deployment asks. The token is
        `p.<id>.<secret>`. `expiryDays` is 1, 7 or 30 for a grant link
        (default 7), and 30, 90 or 180 for a progress link (`purpose: view`,
        default 90), which grants nothing and is not held to the limit.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                purpose: { type: string, enum: [grant, view], default: grant }
                expiryDays: { type: integer, enum: [1, 7, 30, 90, 180] }
      responses:
        '201':
          description: The link, said once.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  purpose: { type: string, enum: [grant, view] }
                  url: { type: string }
                  expiresAt: { type: string, format: date-time }
                  expiryDays: { type: integer }
                  distribution: { type: string }
                  asksAgain:
                    type: boolean
                    description: A grant link made while every account of the person's was connected, which asks each again.
        '400': { description: '`purpose` or `expiryDays` was not one of the offered values.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`person_not_found`: this organisation has no such person.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            Nothing was written. `nothing_to_grant`: none of the person's
            migrations can be granted through a link (the reason lists each
            migration's own).
            `web_url_unset`: the deployment cannot build the address.
            `grant_links_at_limit`: the organisation holds as many live grant
            links as it may. Or `conditions_not_accepted`
            (`ConditionsNotAccepted`), as for a migration's grant link.
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    properties:
                      error: { type: string }
                      reason: { type: string }
                  - { $ref: '#/components/schemas/ConditionsNotAccepted' }
    get:
      tags: [Grant links]
      summary: A person's links, and their state
      description: State and dates, never a URL and never a secret, as for a migration's links.
      responses:
        '200':
          description: Every link of this person's, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  links:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        purpose: { type: string, enum: [grant, view] }
                        state: { type: string, enum: [live, used, revoked, expired] }
                        createdAt: { type: string, format: date-time }
                        createdBy: { type: string }
                        expiresAt: { type: string, format: date-time }
                        usedAt: { type: string, format: date-time, nullable: true }
                        revokedAt: { type: string, format: date-time, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: '`person_not_found`: this organisation has no such person.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/people/{personId}/links/{linkId}:
    parameters:
      - $ref: '#/components/parameters/PersonId'
      - { name: linkId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Grant links]
      summary: Revoke a person's link
      description: |
        The kill switch, idempotent as for a migration's link. Re-checked when
        a grant would be stored, so it also stops a consent already in flight.
      responses:
        '200':
          description: Revoked now (`true`), or already revoked (`false`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/people/{personId}/awaiting-grant:
    parameters:
      - $ref: '#/components/parameters/PersonId'
    get:
      tags: [Grant links]
      summary: Which of a person's migrations wait for their grant, and what it does to each
      description: |
        The migrations the person's grant link asks for that have no way in
        yet, each with what the grant does when it lands (ADR-0035's
        amendment, start when granted, per person; the owner, 2026-10-03).
        An account the link cannot ask (two Google applications) is left
        out, as the grant page leaves it out, and so is a finished
        migration. Managed only, as the person's links are.
      responses:
        '200':
          description: By Google account, in the order the person's grant page lists them.
          content:
            application/json:
              schema:
                type: object
                required: [migrations]
                properties:
                  migrations:
                    type: array
                    items:
                      type: object
                      required: [mappingId, then]
                      properties:
                        mappingId: { type: string, format: uuid }
                        then:
                          type: string
                          enum: [starts_by_itself, review_and_start, ran_before]
                          description: |
                            `starts_by_itself`: it never ran, and another
                            migration of the person's was ever started, so it
                            starts when the grant lands. `review_and_start`: it
                            never ran, and nothing of theirs was ever started,
                            so the owner reviews
                            and starts it once its count is in. `ran_before`:
                            it ran, and lost its way in since.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: '`person_not_found`: this organisation has no such person.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/decisions:
    get:
      tags: [Decisions]
      summary: Drift decisions awaiting an answer
      responses:
        '200':
          description: The decision queue.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/decisions/{decisionId}/resolve:
    parameters:
      - $ref: '#/components/parameters/DecisionId'
    post:
      tags: [Decisions]
      summary: Answer a decision
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: Resolved.
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/decisions/{decisionId}/dismiss:
    parameters:
      - $ref: '#/components/parameters/DecisionId'
    post:
      tags: [Decisions]
      summary: Set a decision aside
      description: |
        Set aside, not rejected. The distinction is kept because "I am not
        acting on this" and "this change was refused" are different claims
        about what happened.
      responses:
        '200':
          description: Dismissed.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/decisions/presets:
    get:
      tags: [Decisions]
      summary: The standing answers
      description: |
        Per category, the answer applied automatically so the same question is
        not asked twice. A decision resolved this way says so, rather than
        appearing to have been considered by a person.
      responses:
        '200':
          description: The presets.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/decisions/presets/{category}:
    parameters:
      - name: category
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [Decisions]
      summary: Set the standing answer for one category
      description: Owner/admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/problem-reports/available:
    get:
      tags: [Reports]
      summary: Whether this service takes problem reports
      description: |
        `true` only when the deployment has a Zammad set up (`ZAMMAD_URL` and
        `ZAMMAD_TOKEN`, https), or, without one, the API's mail (`SMTP_HOST`,
        `NOTIFY_FROM`, and `REPORT_MAIL_TO` or `NOTIFY_TO`). The app offers the
        form only then: a form that can send nowhere is not shown.
      responses:
        '200':
          description: The answer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: { type: boolean }
                required: [available]
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/problem-reports/preview:
    get:
      tags: [Reports]
      summary: Where a report would go, and the facts it would carry
      description: |
        For the form's "What we send with this", before anything is sent. The
        lines are exactly the ones a report from this page would carry in its
        ticket's article or its mail: the page (a grant or view link written as
        `:link`, and no query), the reference and category when given, the
        organisation's id, the build, and the facts the server reads itself,
        never from the browser: the reporter's role (from the membership),
        the organisation's status and closing dates, the migration the page
        names when it is one of this organisation's (its state, the grant
        given or withdrawn, the newest grant link's state, each data type's
        state, error category, side and reference, and the two accounts'
        providers and last test), whether the reference is a current failure,
        the service hold, whether the scheduler is running, and the browser
        (the request's `User-Agent`, on one line, capped). Read inside the
        reporter's organisation under row security, so another
        organisation's migration id reads as not one of this organisation's.
        No names, addresses, provider error text or tokens. When the facts
        cannot be read, the lines say so with a reference, as the report
        would. Sending a report reads the facts again. Sixty an hour per person.

        Then what the browser says of itself, from `browser`, the report's
        `browser` object as JSON: each fact only in its own shape, written as
        `Screen language`, `Time zone`, `Window width`, `App build in the
        browser` (only when it is not this server's), `Failure line` and a
        `Recent error` line each. Anything else in it is dropped, never
        refused.
      parameters:
        - name: page
          in: query
          required: true
          schema: { type: string, description: A path on this site. }
        - name: reference
          in: query
          required: false
          schema: { type: string, pattern: '^[0-9a-f]{8}$' }
        - name: category
          in: query
          required: false
          schema: { type: string }
        - name: browser
          in: query
          required: false
          description: |
            The report's `browser` object (`BrowserFacts`), as JSON, at most
            2000 characters. Longer, not JSON, or not an object, it is dropped.
          schema: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Where the report goes, and its lines of facts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  to:
                    oneOf:
                      - type: object
                        description: |
                          By mail. `addresses` is the support mailbox `REPORT_MAIL_TO`
                          names. When that is empty, reports go to `NOTIFY_TO`, the
                          operator's own list, and `addresses` is absent: that list
                          is never shown to a member.
                        properties:
                          kind: { type: string, enum: [mail] }
                          addresses: { type: array, items: { type: string }, minItems: 1 }
                        required: [kind]
                      - type: object
                        description: To the owner's Zammad.
                        properties:
                          kind: { type: string, enum: [helpdesk] }
                        required: [kind]
                  lines:
                    type: array
                    items: { type: string }
                required: [to, lines]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429':
          description: Many previews from this person in the last hour. Carries `Retry-After`.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds to wait.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: This deployment has neither a Zammad nor mail set up.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/problem-reports:
    post:
      tags: [Reports]
      summary: Send a problem report
      description: |
        Becomes a ticket on the owner's Zammad, with the signed-in person as its
        customer, or, without a Zammad, one plain-text mail to the support
        mailbox with the signed-in person as its Reply-To and the screenshot
        attached. Carries what the person wrote, the page they were on (a grant
        or view link written as `:link`, and no query, redacted here again
        whatever the browser sent), the error's reference and category when
        there is one, and a PNG or JPEG screenshot (at most 5 MB, checked by
        its own first bytes). Parsed with an 8 MB body limit of its own, ahead
        of the API's global parser. Five reports an hour per person, and by
        mail fifty a day for every report together, the link reports' included.
        The mail also names the person's sign-in address in its body, and sets
        Reply-To only when that is one valid address. The server adds the
        lines of facts `GET /api/problem-reports/preview` describes, read
        again on sending and never taken from the body; when they cannot be
        read, the report still goes, with `Facts: could not be read [ref …]`.
        And `browser`, what the browser says of itself, checked key by key:
        a key not in `BrowserFacts`, or a value not in its shape, is dropped,
        and never a reason to refuse the report.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description: { type: string, maxLength: 5000 }
                page: { type: string, description: A path on this site. }
                reference: { type: string, pattern: '^[0-9a-f]{8}$' }
                category: { type: string }
                screenshot:
                  type: object
                  properties:
                    data: { type: string, description: The image, base64. }
                  required: [data]
                browser: { $ref: '#/components/schemas/BrowserFacts' }
              required: [description, page]
      responses:
        '201':
          description: |
            Delivered: with the ticket's number when it went to Zammad, or with
            the report's own reference, which its mail carries too, when it went
            to the support mailbox.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      ticket: { type: string }
                    required: [ticket]
                  - type: object
                    properties:
                      reference: { type: string, pattern: '^[0-9a-f]{8}$' }
                    required: [reference]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/BadRequest' }
        '415': { $ref: '#/components/responses/BadRequest' }
        '429':
          description: Several reports from this person in the last hour, or, by mail, too many reports from everybody today. Carries `Retry-After`.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds to wait.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: Zammad did not take the ticket, or the relay did not take the mail. Carries a reference the log page finds.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: This deployment has neither a Zammad nor mail set up.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/unreadable-answers:
    post:
      tags: [Reports]
      summary: Report an answer a page could not read
      description: |
        Sent by the web app, once per failure, when a page's schema refused one
        of this API's answers, with the reference the page showed its reader
        (workplan 0145). Kept as a fault of our own is kept: an app event
        `web.answer_unreadable` under that reference, on the log page, and one
        line in the API's output with the issue's code, where in the answer it
        sat, the page, and the page's build beside the API's. Each field is
        kept only in its own shape (`parseUnreadableAnswer` in
        `@openmig/shared`), and a field of any other shape is dropped, never a
        reason to refuse; only the reference is required. Thirty reports an
        hour per person. The appliance answers the same body at
        `POST /unreadable-answers`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reference: { type: string, pattern: '^[0-9a-f]{8}$' }
                code: { type: string, description: The issue's code, as zod names it. }
                path:
                  type: string
                  description: Where in the answer, as `2.domains.2`; empty for the whole answer.
                page: { type: string, description: The page, with every id written as `:id`. }
                build:
                  type: object
                  properties:
                    version: { type: string }
                    commit: { type: string }
              required: [reference]
      responses:
        '204':
          description: Kept.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429':
          description: Thirty reports from this person in the last hour. Carries `Retry-After`.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds to wait.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/scope-manifest:
    get:
      tags: [Discovery]
      summary: What this product carries, and what it does not
      description: |
        The per-domain manifest the confirm screen renders: what migrates, what
        does not, and what is transformed on the way. Static truth about the
        product, not about one tenant's data.
      responses:
        '200':
          description: The manifest.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/provider-accounts:
    get:
      tags: [Discovery]
      summary: What one account of each provider kind may serve here
      description: |
        A ceiling, not a capability and not a measurement: which faces one
        account row may wear on THIS deployment. `google` answers with three
        faces by default and with all five where the deployment declares that
        its own Google application carries the restricted scopes
        (`GOOGLE_ACCOUNT_SCOPE_CLASS=restricted`, ADR-0041).

        Unauthenticated for the same reason as the scope manifest: a static
        fact about the deployment, naming no customer, connection or address.
        The wizard reads it because the declaration is made at run time and the
        browser bundle was built before it.
      security: []
      responses:
        '200':
          description: |
            Provider account kind to what one account of it may serve here —
            and, for `google`, where its OAuth client comes from.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  required: [domains]
                  properties:
                    domains:
                      type: array
                      items:
                        type: string
                        enum: [email, calendar, contact, file, task]
                    client:
                      type: string
                      enum: [deployment, connection]
                      description: |
                        `google` only. `deployment` when this installation
                        carries its own Google OAuth client (both halves set,
                        ADR-0041), so a connection need not bring one;
                        `connection` otherwise. Never the values.
              example:
                google: { domains: [calendar, contact, task], client: deployment }
                soverin: { domains: [email, calendar, contact] }

  /api/provider-clients:
    get:
      tags: [Discovery]
      summary: Which OAuth applications this deployment carries
      description: |
        One fact per provider (2026-09-02): `deployment` when this installation
        carries its own application for that provider (both halves set),
        `connection` otherwise. What a wizard reads before offering a
        *Connect with …* button without the client pair. Never the values.
        Unauthenticated for the reason `/api/provider-accounts` is: a static
        fact about the deployment, naming no customer.
      security: []
      responses:
        '200':
          description: Provider to where its OAuth application comes from.
          content:
            application/json:
              schema:
                type: object
                required: [google, dropbox]
                properties:
                  google: { type: string, enum: [deployment, connection] }
                  dropbox: { type: string, enum: [deployment, connection] }
              example:
                google: deployment
                dropbox: connection

  /api/redirect-uris:
    get:
      tags: [Discovery]
      summary: Every address this deployment needs registered elsewhere
      description: |
        The redirect URIs this deployment will ask other services to send a
        browser back to — the Google migration callback, the identity
        provider's sign-in and post-logout pair, and the upstream address for
        social sign-in — each with where it is registered and why.

        Every string is DERIVED from the same settings the code uses
        (`API_URL`, `WEB_URL`, `JWT_ISSUER`), so what this returns is what the
        product will actually request. An entry with a null `uri` is an answer,
        not a gap: Dropbox, Box and Microsoft 365 sources authenticate with
        pasted credentials and redirect nowhere.

        Unauthenticated for the same reason as the scope manifest: every value
        is an address published to a provider and typed into a browser's
        location bar. It names no customer, no connection and no secret.
      security: []
      responses:
        '200':
          description: The addresses, in the order a deployment is set up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        group:
                          type: string
                          enum: [migration, signIn, socialSignIn]
                        provider: { type: string }
                        uri:
                          type: string
                          nullable: true
                        why: { type: string }
                        unconfigured: { type: boolean }

  /api/shared-addresses:
    get:
      tags: [Discovery]
      summary: Shared mailboxes and distribution lists found on the source
      description: |
        Classified per §14.1 — a shared mailbox is a store to copy, a
        distribution list is a definition to recreate. An address the directory
        did not classify is reported unclassified rather than guessed.
      responses:
        '200':
          description: The discovered shared addresses.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/shared-addresses/runbook:
    get:
      tags: [Discovery]
      summary: The shared-address runbook, as Markdown
      description: A document to work through on the destination, not a status page.
      responses:
        '200':
          description: Markdown.
          content:
            text/markdown:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/permissions/report:
    get:
      tags: [Discovery]
      summary: The permission runbook, as Markdown
      description: |
        Who could see whose calendar, who had access to which shared files —
        rights that do not travel with the data and must be re-granted by hand
        on the destination.

        **Blind spots are printed above the findings**, deliberately: mailbox
        delegation (FullAccess, Send-As) is never in it because Graph does not
        expose it, and OneDrive/SharePoint sharing appears only if this
        deployment holds that permission. A section headed "could not be
        inventoried" placed under two pages of successes gets skipped, and it
        is the dangerous half.
      responses:
        '200':
          description: Markdown.
          content:
            text/markdown:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: |
            `Conflict`: the migration named records no mailbox to inventory.
            Or `account_closed` (`AccountClosed`): the organisation was closed
            (workplan 0085 T2), and the report, which reads its accounts with
            their stored access, is not made.
          content:
            application/json:
              schema:
                anyOf:
                  - { $ref: '#/components/schemas/Refusal' }
                  - { $ref: '#/components/schemas/AccountClosed' }
        '429': { $ref: '#/components/responses/TooManyTests' }

  /api/billing/usage:
    get:
      tags: [Billing]
      summary: This period's usage, the tier it measures, and the tier the month bills
      description: |
        What was measured this month and the ADR-0014 tier it measures (`tier`,
        null past the end of the table, with `decidedBy` and its `evidence`),
        and what the month bills (`billed`): what it used, never above the
        agreed tier, with `beyond` saying why when what was used is past it
        (`bands` bought cover the data, more `paths` at the same time than the
        tier runs, or more `data` than its ceiling). Data counts in total, for
        ever, and what moved during the alpha never counts: `evidence.gbMoved`
        is what counts, `gbMovedInTheAlpha` what does not (managed 0040).
        `holds` is false during the alpha, where nothing is billed. No metered
        cost: ADR-0014 retired it. Read-only; nothing is written.
      responses:
        '200':
          description: Usage, the measured tier, and the tier the month bills.
          content:
            application/json:
              schema:
                type: object
                properties:
                  usage: { $ref: '#/components/schemas/Usage' }
                  tier: { type: [object, 'null'] }
                  decidedBy: { type: string, enum: [paths, data, both] }
                  evidence: { type: object }
                  billed:
                    type: object
                    properties:
                      tier: { type: object }
                      beyond: { type: array, items: { type: string, enum: [bands, paths, data] } }
                  ceilingGb: { type: number }
                  topUps: { type: integer }
                  gbMovedInTheAlpha: { type: number }
                  holds: { type: boolean }
                  period: { type: string, examples: ['2026-08'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/billing/usage/history:
    get:
      tags: [Billing]
      summary: Usage by period
      responses:
        '200':
          description: One entry per period, newest first.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/billing/ceiling:
    get:
      tags: [Billing]
      summary: Where the data stands against the ceiling, and the two ways on
      description: |
        The data ceiling of ADR-0014's amendment of 2026-10-03 (workplan 0109 T6):
        the band of the highest tier the organisation moved up to, plus every
        top-up band bought. `state` is `under`, `near` (from 80%, where both ways
        on are offered) or `reached`. `holds` is false during the alpha, where the
        ceiling only warns and no yes is taken. Read-only.
      responses:
        '200':
          description: The ceiling, the data moved, and the offers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tier: { type: object }
                  ceilingGb: { type: number }
                  topUps: { type: integer }
                  gbMoved: { type: number }
                  gbMovedInTheAlpha:
                    type: number
                    description: Moved during the alpha, which never counts against the ceiling (managed 0040).
                  share: { type: number }
                  state: { type: string, enum: [under, near, reached] }
                  holds: { type: boolean }
                  moveUp: { type: [object, 'null'] }
                  topUp: { type: [object, 'null'] }
                  breakEven:
                    type: [object, 'null']
                    description: |
                      Both ways on side by side, when both are offered: what the
                      top-up costs once (`extraOnceEur`; a move up costs nothing
                      once, since the list of 2026-09-29 has no setup fee), what
                      staying saves each month (`savedMonthlyEur`), and about how
                      many days it takes to pay back (`paysBackInDays`).
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/billing/ceiling/yes:
    post:
      tags: [Billing]
      summary: Say yes to moving up a tier, or to a one-off top-up
      description: |
        One append-only row per yes (managed migration 0037), carrying the price
        shown, which the invoice will charge: for a move up, the new tier's
        monthly price; for a top-up, the tier's monthly, once. Whole euros. The
        body names the offer the page
        showed; when the tier or the price is not what is offered now, the yes is
        refused with the current offer, so nobody agrees to a price they were not
        shown. Refused during the alpha, where nothing is charged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [choice, tierId, priceEur]
              properties:
                choice: { type: string, enum: [move_up, top_up] }
                tierId: { type: string }
                priceEur: { type: integer, minimum: 0 }
      responses:
        '200':
          description: The ceiling after the yes.
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            Not taken: `offer_changed` (with the offer as it stands now),
            `no_top_up_on_free`, `talk_to_us`, or `nothing_charged_during_the_alpha`.
          content:
            application/json:
              schema: { type: object }

  /api/billing/paths:
    get:
      tags: [Billing]
      summary: The question at Start, before the press
      description: |
        What starting these migrations would hold against the agreed tier
        (workplan 0109 T6, the path axis): the slots held now, the slots held
        after, by the server's own rule (the refusal the start would get, 409
        `paths_need_a_yes`), the smallest tier that runs it all with its monthly
        (`needs`; null when not past, and past Extra large), and which of them
        fit now, in the order asked. A migration's new slots are its included
        data types that never ran; a paused one kept its slots. `holds` is false
        during the alpha, where nothing waits for a yes. Read-only.
      parameters:
        - name: starting
          in: query
          required: true
          description: The migrations Start would start, as mapping ids separated by commas, at most fifty.
          schema: { type: string }
      responses:
        '200':
          description: The question, and what fits now.
          content:
            application/json:
              schema:
                type: object
                properties:
                  holds: { type: boolean }
                  tier: { type: object }
                  held: { type: integer }
                  after: { type: integer }
                  past: { type: boolean }
                  needs: { type: [object, 'null'] }
                  reason: { type: [string, 'null'] }
                  fits: { type: array, items: { type: string } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/billing/paths/yes:
    post:
      tags: [Billing]
      summary: Say yes, at Start, to a tier that runs more at the same time
      description: |
        The same append-only row as a move up at the data ceiling (one agreed
        tier for both axes), with `axis` `paths` (managed migration 0039),
        carrying the tier's monthly price, in whole euros. Refused when the tier
        is not above the agreed one (`not_a_step_up`) or the price is not its
        monthly now (`offer_changed`), and during the alpha. The page starts the
        migrations after it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tierId, priceEur]
              properties:
                tierId: { type: string }
                priceEur: { type: integer, minimum: 0 }
      responses:
        '200':
          description: The agreed tier after the yes.
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            Not taken: `not_a_step_up`, `offer_changed`, or `nothing_charged_during_the_alpha`.
          content:
            application/json:
              schema: { type: object }

  /api/billing/estimate:
    post:
      tags: [Billing]
      summary: What projected usage would cost
      description: Estimated at this tenant's agreed rates, so the number matches the invoice they will get.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                storageUsedGB: { type: number }
                egressGB: { type: number }
                computeHours: { type: number }
                syncCount: { type: number }
      responses:
        '200':
          description: The estimate, in integer cents.
          content:
            application/json:
              schema:
                type: object
                properties:
                  estimate: { type: integer }
                  breakdown: { $ref: '#/components/schemas/Cost' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/billing/party:
    get:
      tags: [Billing]
      summary: Who invoices are addressed to
      description: |
        `party` is **null until the customer provides it** — a real state the
        billing page shows as an ask, never an error. Nothing can be invoiced
        correctly against a tenant without one (workplan 0111 T1).

        `vatConsultation` is the latest VIES answer **for the number as
        currently stored** (0111 T2): the log is append-only, so a number
        changed since its last check reads null — nothing has checked the
        number the next invoice would rely on. Always null for a consumer.

        `vatTreatment` (0111 T3) is what an invoice for this buyer would
        carry — a **treatment, never a rate** (the number belongs to the
        bookkeeping system). Null while no party is stored. An EU business
        without a valid VIES consultation reads `domestic_standard` on
        purpose: the conservative error, corrected by validating the number.
      responses:
        '200':
          description: The buyer's details, or null, with the consultation and treatment that speak for them.
          content:
            application/json:
              schema:
                type: object
                properties:
                  party:
                    oneOf:
                      - { $ref: '#/components/schemas/BillingParty' }
                      - { type: 'null' }
                  vatConsultation:
                    oneOf:
                      - { $ref: '#/components/schemas/VatConsultation' }
                      - { type: 'null' }
                  vatTreatment:
                    oneOf:
                      - { $ref: '#/components/schemas/VatTreatment' }
                      - { type: 'null' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Billing]
      summary: Provide or replace the buyer's details
      description: |
        Owner/admin. An **upsert keyed on the tenant**: sending the same body
        twice converges on the same row, and the whole statement is replaced
        each time — no separate create-vs-edit path, and a kind switch cannot
        strand a stale VAT number.

        **Consumer-shaped first**: `kind` defaults to `consumer`, and only a
        `business` may carry `vatNumber` (enforced by the database as well as
        by validation). The VAT number is stored as stated — whether it is
        real is a later VIES consultation, and the country is the customer's
        statement, not the place-of-supply decision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, addressLine1, postalCode, city, countryCode]
              properties:
                kind: { type: string, enum: [consumer, business], default: consumer }
                name: { type: string, maxLength: 200 }
                addressLine1: { type: string, maxLength: 200 }
                addressLine2: { type: string, maxLength: 200 }
                postalCode: { type: string, maxLength: 16 }
                city: { type: string, maxLength: 100 }
                countryCode:
                  type: string
                  description: ISO 3166-1 alpha-2; lowercase input is uppercased.
                  examples: [NL]
                vatNumber:
                  type: string
                  maxLength: 32
                  description: Business kind only — refused on a consumer.
      responses:
        '200':
          description: The stored details, as they now stand.
          content:
            application/json:
              schema:
                type: object
                properties:
                  party: { $ref: '#/components/schemas/BillingParty' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/billing/party/check-vat:
    post:
      tags: [Billing]
      summary: Ask VIES about the stored VAT number, and keep the answer
      description: |
        Owner/admin. Consults VIES about the business party's stored VAT
        number and **appends the answer to the consultation log** (workplan
        0111 T2) — an unvalidated number is not a defence; the consultation
        number this stores is.

        A 200 is an answer either way: `consultation.valid: false` is VIES
        saying no, stored exactly like a yes, because both are evidence.
        Re-checking is legitimate and appends.

        The check is **qualified** — it comes back with a consultation
        number — when the deployment identifies itself via
        `VIES_REQUESTER_MEMBER_STATE` + `VIES_REQUESTER_VAT_NUMBER` (set
        together, or not at all: half a pair answers 500 rather than
        silently downgrading). Without them the check still answers, with
        `consultationNumber: null` marking it unqualified.
      responses:
        '200':
          description: VIES answered; the stored consultation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  consultation: { $ref: '#/components/schemas/VatConsultation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            Nothing to ask, permanently: `error` is `nothing_to_check` (no
            business party with a VAT number stored — save the details
            first) or `vat_not_checkable` (VIES can never answer this one —
            a GB number, a malformed one; retrying changes nothing).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, enum: [nothing_to_check, vat_not_checkable] }
                  reason: { type: string }
        '503':
          description: |
            VIES could not answer **now** (its member-state backends are
            famously intermittent). Nothing was stored — "we could not ask"
            is not an answer — so ask again later.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, enum: [vies_unavailable] }
                  reason: { type: string }

  /api/billing/invoices:
    get:
      tags: [Billing]
      summary: List invoices
      responses:
        '200':
          description: The tenant's invoices.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/billing/invoices/generate:
    post:
      tags: [Billing]
      summary: Refuses — the pricing model this billed was retired
      description: |
        **This route currently refuses, deliberately, and mints nothing.**

        ADR-0014 was amended on 2026-08-20 from metered resources to five tiers
        on two axes. The invoice code still meters bytes and hours from the
        retired model — and would count every byte twice, once as storage and
        once as egress, and charge for items that moved nothing. Issuing that
        would be a bill for something Ownpace does not sell.

        Refusing is cheaper than fixing arithmetic on code the tier work
        replaces, and it cannot mislead. The guard is removed when the invoice
        can say a tier and its evidence.

        Nothing else in billing is affected: usage, invoice listing, the
        payment-method routes and the webhook all behave normally. The refusal
        touches no database, so a refused call leaves not even a draft.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                period: { type: string, pattern: '^\d{4}-\d{2}$', examples: ['2026-08'] }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            Always, for any well-formed request. `error` is
            `billing_model_retired`; `reason` is one sentence naming what would
            have been billed and what to do instead.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, enum: [billing_model_retired] }
                  reason: { type: string }

  /api/billing/invoices/{invoiceId}:
    parameters:
      - name: invoiceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Billing]
      summary: Get one invoice
      responses:
        '200':
          description: The invoice.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/billing/invoices/{invoiceId}/pay:
    parameters:
      - name: invoiceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Billing]
      summary: Start a payment
      description: Owner/admin. Returns the provider's checkout URL to send the payer to.
      responses:
        '200':
          description: The payment, with a checkout URL.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/billing/payment-methods:
    get:
      tags: [Billing]
      summary: List payment methods
      responses:
        '200':
          description: The tenant's payment methods.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Billing]
      summary: Add a payment method
      description: Owner/admin.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '201':
          description: The stored method.
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/billing/payment-methods/{paymentMethodId}/default:
    parameters:
      - name: paymentMethodId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Billing]
      summary: Make this the default payment method
      description: Owner/admin.
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/billing/webhooks/mollie:
    post:
      tags: [Webhooks]
      summary: Payment status changed
      description: |
        Called by Mollie, not by clients. The body carries only a payment id;
        the status is then fetched from the provider rather than trusted from
        the request, because anyone can post here.

        `application/x-www-form-urlencoded`, which is what the provider sends.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                id: { type: string, description: The provider's payment id. }
      responses:
        '200': { description: Acknowledged. }

  /api/billing/webhooks/mollie/test:
    get:
      tags: [Webhooks]
      summary: Webhook reachability check
      description: Confirms this deployment's webhook URL is reachable from outside. Returns no tenant data.
      security: []
      responses:
        '200':
          description: Reachable.
          content:
            application/json:
              schema: { type: object }

  /api/support/tenants:
    get:
      tags: [Support]
      summary: Every organisation, as an operator sees them
      description: |
        Name, when they joined, how many migrations, and how many domains are
        currently failing. Nothing else — no settings, no addresses, no counts
        of what is inside anybody's mailbox.

        Authorisation is NOT performed here. The operation authenticates a
        subject and reads a view whose own predicate is "this subject is a
        platform operator"; to anybody else the view is empty, so a
        non-operator gets `200` with an empty list rather than a `403`. That is
        deliberate: the check lives in one place, in the database, and cannot
        be simplified away in application code.

        Every serving is recorded in the support read log — one row for the
        list, with no organisation named, because looking at the list is one
        decision rather than one per customer. A non-operator's request records
        nothing, by the same predicate.
      responses:
        '200':
          description: |
            The organisations this caller may see. Empty for anybody who is not
            a platform operator.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenants:
                    type: array
                    items: { $ref: '#/components/schemas/SupportTenant' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/support/people:
    get:
      tags: [support]
      summary: Find a person across every organisation
      description: |
        The question an operator starts from: somebody made contact, who are
        they and what are they on. The per-organisation list (0018) answers only
        "who is in THIS organisation", which needs the organisation guessed
        first.

        This is the widest read the support surface performs — not one customer,
        all of them — so it is recorded with WHAT was searched for and HOW MANY
        came back (migration 0019). "An operator ran a search" cannot tell
        somebody answering one email from somebody enumerating the customer
        base; those two facts can. The log is readable only by the operator who
        wrote it.

        Joins `support_tenant_members` and `support_tenants`, both behind the
        same `platform_operator` predicate — a non-operator sees an empty list
        because to the database those rows are invisible.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2 }
          description: |
            Part of an email address. At least two characters: a shorter one
            matches everybody, and every customer's people is not an answer to
            a blank box.
      responses:
        '200':
          description: Matching people, capped.
          content:
            application/json:
              schema:
                type: object
                properties:
                  people:
                    type: array
                    items: { $ref: '#/components/schemas/SupportPerson' }
                  limit:
                    type: integer
                    description: |
                      A cap, not a page. A support answer is one person; hitting
                      the ceiling means the question was wrong rather than that
                      there is more to fetch.
        '400':
          description: Fewer than two characters.
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/support/people/{tenantId}/{userId}/opened:
    post:
      tags: [support]
      summary: Record that an operator opened an account at the identity provider
      description: |
        The click leaves Ownpace — account-level work is the issuer's and never
        ours (ADR-0042) — so this is the last thing that can honestly be
        recorded about it. The owner asked for both halves logged: the search,
        and the opening of a result.

        Verifies the pair before writing. Not to authorise anything (the log's
        INSERT is already gated on being an operator) but because a row naming a
        tenant and a subject that were never related is a false entry in the one
        record standing in for the consent that was dropped.
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: userId
          in: path
          required: true
          schema: { type: string }
          description: The identity provider's subject.
      responses:
        '204':
          description: Recorded. Nothing to return, and the screen does not wait on it.
        '400':
          description: The tenantId is not a uuid, or the subject is empty.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: |
            No such membership — or none this caller may see. The same answer
            for both, like every route on this surface.
  /api/support/tenants/{tenantId}:
    parameters:
      - name: tenantId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Support]
      summary: One organisation — its connections, migrations and invoices
      description: |
        Connection `kind`, display name and status; never `config` (hosts and
        paths somebody typed) and never `secret_ref`. Migrations by name and
        lifecycle. Invoices by period, status and total.

        An organisation that does not exist and one this caller may not see are
        the same answer — `404` either way — so that a signed-in non-operator
        cannot use this to discover which ids are real.

        Recorded in the support read log only once the organisation was
        actually found and served: a `404` is not a read of anybody's data, and
        logging one would put customers in the record whom the operator never
        saw.
      responses:
        '200':
          description: The organisation and its three lists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant: { $ref: '#/components/schemas/SupportTenant' }
                  connections:
                    type: array
                    items: { $ref: '#/components/schemas/SupportConnection' }
                  migrations:
                    type: array
                    items: { $ref: '#/components/schemas/SupportMigration' }
                  invoices:
                    type: array
                    items: { $ref: '#/components/schemas/SupportInvoice' }
                  members:
                    type: array
                    items: { $ref: '#/components/schemas/SupportTenantMember' }
                  usage: { $ref: '#/components/schemas/SupportTenantUsage' }
        '400':
          description: The id in the path is not a uuid.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No such organisation — or none this caller may see.

  /api/support/migrations/{mappingId}:
    parameters:
      - $ref: '#/components/parameters/MappingId'
    get:
      tags: [Support]
      summary: One migration, per domain
      description: |
        State, timings and the failure CATEGORY for each domain — never the
        failure text itself, which can carry a folder name or an address. The
        category is the actionable half (workplan 0110 T3) and the customer
        sees the same one.

        There is deliberately no level below this. A screen that lists items is
        a screen that shows subject lines, and the metadata boundary stops
        before the thing being migrated.

        The organisation recorded in the read log is the migration's own, read
        back from the view rather than taken from the request.
      responses:
        '200':
          description: The migration and one row per domain.
          content:
            application/json:
              schema:
                type: object
                properties:
                  migration: { $ref: '#/components/schemas/SupportMigration' }
                  domains:
                    type: array
                    items: { $ref: '#/components/schemas/SupportMigrationDomain' }
        '400':
          description: The id in the path is not a uuid.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No such migration — or none this caller may see.

  /api/support/retained-invoices:
    get:
      tags: [Support]
      summary: The invoices an erasure kept
      description: |
        When a tenant is erased its invoices are deliberately kept — tax
        retention outlives the customer relationship — and detached, so
        `tenant_id` becomes NULL and `billed_to_name` is stamped from the
        organisation that is about to stop existing. Every other invoice view
        filters by tenant, so before this operation those kept rows could not
        be read by anything in the product.

        The grain is the ERASURE, not the organisation, because there is no
        organisation left: rows are keyed by `tenant_ref`, the sha256 of an id
        nobody kept. So this answers "what are we obliged to keep, and what
        does each one say about itself" and cannot be walked back to a person
        — which is the question the erasure closed.

        Authorisation is the database's, as everywhere on this surface: a
        non-operator gets `200` with an empty list. Every serving is recorded
        in the support read log with no organisation named, because there is
        none to name.
      responses:
        '200':
          description: |
            Invoices retained across an erasure. Empty for anybody who is not a
            platform operator, and empty on a platform that has erased nobody.
          content:
            application/json:
              schema:
                type: object
                properties:
                  invoices:
                    type: array
                    items: { $ref: '#/components/schemas/SupportRetainedInvoice' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/support/audit-export:
    get:
      tags: [Support]
      summary: The audit export's lines, for the operator to backfill a log store
      description: |
        Workplan 0129 T4, the managed half (the owner, 2026-09-24: "an
        operator-only route using your own session"). The lines this
        deployment's processes print as each audit event commits, read back
        from the audit log after a cursor, oldest first: OpenTelemetry's log
        data model, one JSON line per event, addresses and file names as
        pseudonyms under this deployment's own key, and a detail field nobody
        classified left out. The appliance's `GET /audit-export`, with the same
        rules for `after` and `limit`.

        Only events that have settled are served (five minutes): a row's time
        is its transaction's start, so the newest are the stream's.

        The rows are read through `support_audit_export` (managed migration
        0026), whose operator predicate is every support view's, so a
        non-operator gets `200` with nothing. Every page an operator is served
        is recorded in the support read log (`audit_export`) with where it
        started and how many lines it served, in the transaction that read it,
        before the lines are sent. The Support log page's **Audit export**
        fetches every page on the operator's own session and saves them as
        one file.
      parameters:
        - name: after
          in: query
          schema: { type: string, pattern: '^\\s*\\d{1,20}-[0-9a-fA-F-]{36}\\s*$' }
          description: Start after this line, as `Ownpace-Next-After` gives it (its `Timestamp` and `ownpace.audit.id`, joined by a hyphen). From the first when absent.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1000 }
      responses:
        '200':
          description: One page of lines, oldest first.
          headers:
            Ownpace-Next-After:
              schema: { type: string }
              description: Where the next page starts; the cursor sent, unchanged, when nothing followed it.
            Ownpace-Caught-Up:
              schema: { type: string, enum: ['true', 'false'] }
              description: '`true` when this page was the last.'
          content:
            application/x-ndjson:
              schema: { type: string }
        '400':
          description: A cursor or a page size that is not one, named in `field`.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500':
          description: Ours; nothing was sent, and nothing recorded as sent.

  /api/support/log:
    get:
      tags: [Support]
      summary: The log, newest first
      description: |
        The operator's log page (workplan 0129 T2): the audit log and the
        application's errors and warnings, one timeline, newest first, a
        hundred rows a page. Read through `support_log` (managed migration
        0025), which holds the page to metadata only: time, level, customer,
        migration, event, category, reference and, on an audit row, who acted.
        Never `audit_log.detail`, which an investigation reads with a database
        query.

        Every page served is recorded in the support read log as a search:
        its filters and how many rows came back, under the customer it was
        filtered to (or whose migration it was filtered to). A non-operator
        gets `200` with nothing, and nothing is recorded.
      parameters:
        - name: level
          in: query
          schema: { type: string, enum: [error, warn, info] }
          description: '`info` is an audit row; `error` and `warn` are the application''s.'
        - name: tenantId
          in: query
          schema: { type: string, format: uuid }
        - name: mappingId
          in: query
          schema: { type: string, format: uuid }
        - name: event
          in: query
          schema: { type: string, pattern: '^[a-z][a-z0-9_.:-]{0,63}$' }
          description: The start of an event name, such as `sync.` or `sync.calendar.failed`.
        - name: category
          in: query
          schema:
            type: string
            enum: [auth_expired, rate_limited, quota_exceeded, policy_refused, too_large, source_refused, target_refused, format_refused, network, unknown]
        - name: reference
          in: query
          schema: { type: string, pattern: '^[0-9a-fA-F]{8}$' }
          description: The reference a person was shown. Case does not matter.
        - name: since
          in: query
          schema: { type: string, format: date-time }
          description: Rows at or after this time. Written like `2026-09-23T10:00:00Z`.
        - name: before
          in: query
          schema: { type: string, format: date-time }
          description: Rows before this time, to the microsecond. With `beforeId`, the cursor of the next page.
        - name: beforeId
          in: query
          schema: { type: string, format: uuid }
          description: With `before`, continues after this row, so rows written in the same instant are neither skipped nor repeated.
      responses:
        '200':
          description: One page of the log.
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items: { $ref: '#/components/schemas/SupportLogEntry' }
                  next:
                    type: object
                    nullable: true
                    description: The cursor of the next page, or null on the last.
                    properties:
                      before: { type: string, format: date-time }
                      beforeId: { type: string, format: uuid }
                  limit: { type: integer, description: Rows per page. }
        '400':
          description: A filter of the wrong shape, named in `field`.
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/support/platform:
    get:
      tags: [Support]
      summary: The platform status the customer sees
      description: |
        The operator's second level owes "the platform status the customer
        sees" (workplan 0110 T5, owner's answer 3: platform-wide is enough).
        Two sources, both of which the customer can already read: readiness
        (`/api/ready`, called in-process rather than fetched) and the status
        page's own endpoint list, shaped to the four things the public page
        shows — group, name, up or down, and when. Gatus's JSON also carries
        the probed hostname, condition text and error strings; none of that
        leaves here.

        The one support operation that is NOT a read of a customer: it needs
        no operator predicate (everything it serves is public already) and
        records no `support_read` row (the log names whose data was looked
        at, and this is of nobody). Signed in all the same.

        `statusPage.state` is `off` when the deployment has no status page
        (`STATUS_URL` unset — the self-host edition), `unreachable` when it
        has one that did not answer within the deadline, and `up` with the
        endpoints otherwise. No reason travels with either absence; the log
        has it.
      responses:
        '200':
          description: Readiness, and the status page's endpoints or why there are none.
          content:
            application/json:
              schema:
                type: object
                required: [ready, statusPage]
                properties:
                  ready:
                    type: object
                    required: [status, database, signIn]
                    properties:
                      status: { type: string, enum: [ok, degraded, down] }
                      database: { type: string, enum: [up, down, off] }
                      signIn: { type: string, enum: [up, down, off] }
                  statusPage:
                    type: object
                    required: [state]
                    properties:
                      state: { type: string, enum: [up, off, unreachable] }
                      endpoints:
                        type: array
                        description: Present only when `state` is `up`. The newest result decides each state.
                        items:
                          type: object
                          required: [group, name, state, checkedAt]
                          properties:
                            group: { type: string }
                            name: { type: string }
                            state: { type: string, enum: [up, down, unchecked] }
                            checkedAt:
                              type: string
                              format: date-time
                              nullable: true
                              description: When the newest result was taken; null when none has been.
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/platform-pause:
    get:
      tags: [Platform]
      summary: Is the platform holding, and what did we say about it
      description: |
        A hold is the operator stopping new sync passes on purpose, to update
        the platform (managed migration 0023). Of the three things that can
        stop a migration it is the only one a customer cannot derive from
        their own screen and cannot wait out predictably, so the sentence
        explaining it is served to every signed-in caller rather than to
        operators only.

        `held: false` is a shape rather than a 404: "we asked and the answer
        is no" and "we could not ask" must not look the same to the screen
        rendering it. `message` is the operator's own words and is rendered
        VERBATIM; it is absent when they typed none, and the screen then
        supplies its own default sentence in the reader's language.
      responses:
        '200':
          description: Whether a hold is open, since when, and its message if it has one.
          content:
            application/json:
              schema:
                type: object
                required: [held]
                properties:
                  held: { type: boolean }
                  since: { type: string, format: date-time }
                  message: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Platform]
      summary: Start a hold
      description: |
        The sync tick stops enqueueing on its next firing, within a minute.
        Passes already running finish normally — that is what makes this a
        drain rather than a kill, and the tick logs how many are still in
        flight so an operator knows when the drain is done.

        Authorisation is NOT performed here: the operation authenticates a
        subject and the INSERT carries `WHERE EXISTS (platform_operator …)`,
        so a non-operator writes nothing and is answered `404` — an absence,
        because to the database that is exactly what it is. A second hold
        while one is open is refused by the database rather than folded into
        the existing one, which would silently discard the new message.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  description: |
                    What to tell customers, shown verbatim. Trimmed to 500
                    characters — a message long enough to be a page is one
                    nobody reads. Optional; the screen has a default.
      responses:
        '201':
          description: The hold that is now open.
          content:
            application/json:
              schema:
                type: object
                required: [held, since]
                properties:
                  held: { type: boolean }
                  since: { type: string, format: date-time }
                  message: { type: string }
        '400': { description: message was given and is not a string. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Not an operator — an absence rather than a refusal. }
    delete:
      tags: [Platform]
      summary: Lift the hold
      description: |
        The next tick starts passes again. `404` covers both "no hold is open"
        and "you are not an operator", and the conflation is deliberate: to a
        non-operator the table has no rows, so "nothing to end" is what the
        database sees.
      responses:
        '200':
          description: The hold is lifted.
          content:
            application/json:
              schema:
                type: object
                required: [held]
                properties:
                  held: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No hold is open, or the caller is not an operator. }

  /api/platform-pause/history:
    get:
      tags: [Platform]
      summary: Every hold, newest first
      description: |
        The operator's own view. To anybody else the policies serve the open
        hold and nothing more, which is the correct answer rather than a
        refusal — the same doctrine the support views follow.
      responses:
        '200':
          description: The holds this caller may see.
          content:
            application/json:
              schema:
                type: object
                required: [holds]
                properties:
                  holds:
                    type: array
                    items:
                      type: object
                      required: [id, startedAt, startedBy]
                      properties:
                        id: { type: string, format: uuid }
                        startedAt: { type: string, format: date-time }
                        endedAt: { type: string, format: date-time }
                        message: { type: string }
                        startedBy: { type: string }
                        endedBy: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A tenant-scoped JWT. Local deployments sign it with `JWT_SECRET`;
        managed SSO validates against a JWKS instead.

        The token's subject must be a MEMBER of the tenant it names — an
        arbitrary subject with a valid signature is refused. Roles (`owner`,
        `admin`, `member`, `viewer`) gate the routes marked owner/admin above,
        for reads as well as writes on billing.

  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MappingId:
      name: mappingId
      in: path
      required: true
      description: The migration's id.
      schema: { type: string, format: uuid }
    PersonId:
      name: personId
      in: path
      required: true
      description: The person's id, from `GET /api/people`.
      schema: { type: string, format: uuid }
    DecisionId:
      name: decisionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Hash:
      name: hash
      in: path
      required: true
      description: The item's natural-key hash — stable across re-runs, which is what makes a re-run converge instead of duplicating.
      schema: { type: string }
    AccessRequestId:
      name: id
      in: path
      required: true
      description: The access request's id, from the operator queue.
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: The request was refused, with the reason.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing, invalid, or non-member token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated, but this role may not do this.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: No such resource in this tenant.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AccountClosed:
      description: |
        `account_closed`: the organisation was closed (workplan 0085 T2), so
        nothing was started, written or probed. The sentence names the day of
        the close and the day its data is removed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AccountClosed' }
    PlatformHeld:
      description: |
        `platform_held`: an operator hold is open (managed migration 0023), so
        nothing was started and nothing was written. Every door that enqueues
        a task answers this while a hold is open (workplan 0132 T6 (b)).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PlatformHeld' }
    TooManyTests:
      description: |
        More tests than one member makes by hand: sixty an hour, shared by the
        five doors that connect to an address somebody typed (workplan 0136
        T3). `too_many_tests`, with `Retry-After`.
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds to wait.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    ConfirmStartResponse:
      type: object
      description: |
        Keyed by mapping id, like every operating queue. `started: false` is not
        an error — a pass was already under way and this call joined it, so a
        second pass does not pay for every byte twice to answer a question
        already being answered.
      additionalProperties:
        type: object
        required: [started]
        properties:
          started: { type: boolean }
          runId:
            type: string
            format: uuid
            description: The ledger run, when one is known — which is when a pass was already running.
    SupportTenant:
      type: object
      description: |
        One organisation as an operator sees it (workplan 0110 T4). The column
        list IS the privacy boundary and it lives in the view, not here.
      properties:
        tenant_id: { type: string, format: uuid }
        tenant_name: { type: string }
        tenant_status: { type: string }
        joined_at: { type: string, format: date-time }
        migration_count: { type: integer }
        failing_domain_count:
          type: integer
          description: Domains currently in `failed`. How an operator knows who to call back.
        pending_decision_count:
          type: integer
          description: |
            Pending decisions across the whole organisation, INCLUDING the ones
            that belong to no migration yet — `decision.mapping_id` is nullable
            by design, because a newly discovered mailbox belongs to no
            migration. Deliberately does not add up with the per-migration
            counts; the difference is the interesting part. A COUNT and never
            the decisions: their summary and detail carry addresses.
    SupportConnection:
      type: object
      description: |
        A connection without its `config` or its `secret_ref` — what kind of
        door it is and whether it works, never what was typed into it.
      properties:
        connection_id: { type: string, format: uuid }
        role: { type: string, enum: [source, target] }
        kind: { type: string }
        display_name: { type: string }
        status: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SupportMigration:
      type: object
      properties:
        pending_decision_count:
          type: integer
          description: |
            THIS migration's pending decisions. Failing and waiting are
            opposite support conversations: a migration stopped on a decision
            is not broken, it is waiting for somebody who probably does not
            know it.
        tenant_id: { type: string, format: uuid }
        mapping_id: { type: string, format: uuid }
        name: { type: string }
        lifecycle: { type: string }
        mode: { type: string }
        pattern: { type: string }
        schedule: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SupportInvoice:
      type: object
      properties:
        invoice_id: { type: string, format: uuid }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        status: { type: string }
        total: { type: string }
        currency: { type: string }
        paid_at: { type: string, format: date-time, nullable: true }
    SupportRetainedInvoice:
      type: object
      description: |
        One invoice kept across an erasure. `tenant_ref` is a sha256 of the
        tenant id and never the id itself, so rows can be grouped by which
        erasure kept them without reconstructing a list of former customers.
        `billed_to_name` is what the invoice says about who it was for,
        captured at issue time rather than read from a tenant that no longer
        exists.
      properties:
        tenant_ref: { type: string }
        erasure_requested_at: { type: string, format: date-time }
        purged_at: { type: string, format: date-time, nullable: true }
        invoice_id: { type: string, format: uuid }
        billed_to_name: { type: string, nullable: true }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        status: { type: string }
        total: { type: string }
        currency: { type: string }
        paid_at: { type: string, format: date-time, nullable: true }
    SupportMigrationDomain:
      type: object
      description: |
        One domain of one migration. `last_error_category` and NOT
        `last_error`: the category is actionable and carries no address, no
        folder name and no subject (workplan 0110 T3).
      properties:
        domain: { type: string, enum: [email, calendar, contact, file, task] }
        state: { type: string }
        started_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
        last_error_category:
          type: string
          nullable: true
          # The values of `FAILURE_CATEGORIES` in @openmig/shared, asserted
          # against it in `support-routes.unit.test.ts` so this list cannot
          # drift from the values the column actually holds. It went from six
          # to eight on 2026-09-17 and that assertion is what said so: the two
          # refusals split by `failed_side` below, which the pass records at
          # the closure that threw rather than reading it out of the prose.
          # `policy_refused` made nine, and `too_large` ten on 2026-09-27
          # (workplan 0143 T4); the assertion said so each time.
          enum: [auth_expired, rate_limited, quota_exceeded, policy_refused, too_large, source_refused, target_refused, format_refused, network, unknown]
        failed_side:
          type: string
          nullable: true
          enum: [source, target]
          description: |
            Which side the pass named when it failed (workplan 0094 T5,
            second slice; managed migration 0022 added it to the view).
            Two words, held to them by the ledger's CHECK; null when the
            pass could not tell. Metadata, like the category beside it.
        last_pass_metrics:
          type: object
          nullable: true
          description: Counts and durations only — never folder names or addresses.
    SupportPerson:
      type: object
      description: |
        One person, found across every organisation. Carries the organisation's
        NAME as well as its id: a result whose only context is a uuid answers
        half the question, because "who are they" is not separable from "and
        what are they on".
      properties:
        tenant_id: { type: string, format: uuid }
        tenant_name: { type: string }
        user_id:
          type: string
          description: The identity provider's subject.
        email: { type: string, format: email }
        role: { type: string, enum: [owner, admin, member, viewer] }
        status: { type: string, enum: [active, invited, suspended, removed] }
        joined_at: { type: string, format: date-time, nullable: true }
    SupportLogEntry:
      type: object
      description: |
        One row of the log: an audit event (`source: audit`, level `info`) or
        one of the application's errors and warnings (`source: app`). Metadata
        only. `actor` is the member's address when the subject is a member, the
        process's own name, or null; an application event has none.
      properties:
        id: { type: string, format: uuid }
        at:
          type: string
          format: date-time
          description: To the microsecond, in UTC.
        source: { type: string, enum: [audit, app] }
        level: { type: string, enum: [error, warn, info] }
        tenant_id: { type: string, format: uuid, nullable: true }
        tenant_name: { type: string, nullable: true }
        mapping_id: { type: string, format: uuid, nullable: true }
        migration_name: { type: string, nullable: true }
        event: { type: string }
        category: { type: string, nullable: true }
        reference: { type: string, nullable: true }
        actor: { type: string, nullable: true }
    SupportTenantMember:
      type: object
      description: |
        Who may act on an organisation: an address, a role and a state, plus
        the identity provider's subject so a screen can link to that account.
        The first support view carrying PEOPLE — every other one is metadata
        about the work, and this one is deliberately no wider than a
        membership. No name, no phone, nothing the person did.

        Removed members stay listed with their state, because "this person
        used to be the owner" is most of what a support conversation about a
        lost account is about.
      properties:
        user_id:
          type: string
          description: |
            The identity provider's subject — opaque, and useless to anybody
            who cannot already sign in to that provider. Never an Ownpace id
            and never derived from the address.
        email: { type: string, format: email }
        role: { type: string, enum: [owner, admin, member, viewer] }
        status: { type: string, enum: [active, invited, suspended, removed] }
        invited_at: { type: string, format: date-time, nullable: true }
        joined_at: { type: string, format: date-time, nullable: true }
    SupportTenantUsage:
      type: object
      description: |
        The tier this month has earned so far, with the evidence an invoice
        would quote (ADR-0014's two axes, workplan 0109 T4 surfaced). Derived
        read-only: the recorded peak and the LIVE count of slot-holding paths
        are folded together the same way the tier calculator's true-up would
        write them, so the screen and a bill drawn at the same moment agree —
        but looking at this moves no billing mark. Counts, one data total and
        two timestamps; nothing here names what is moving.
      properties:
        tier:
          type: object
          nullable: true
          description: |
            The published tier the usage lands on, or null past the table's
            end — the same deliberate "talk to us" the pricing page has.
          properties:
            id: { type: string, enum: [free, small, medium, large, xl] }
            name: { type: string }
            paths: { type: integer, description: The tier's simultaneous-path capacity. }
            data_gb: { type: number, description: The tier's cumulative-data ceiling, decimal GB. }
            monthly_cents: { type: integer, description: Per month, euro cents, VAT included. No setup fee. }
            annual_cents: { type: integer, description: A year paid ahead, euro cents (six months' price). }
        decided_by:
          type: string
          enum: [paths, data, both]
          description: Which axis forced the answer — the higher one wins.
        evidence:
          type: object
          description: |
            Exactly what an invoice would quote — "3 paths at the same time,
            100 GB moved". `peak_paths` here is the EFFECTIVE peak (recorded
            mark or live count, whichever is higher).
          properties:
            peak_paths: { type: integer }
            gb_moved: { type: number }
        recorded_peak_paths:
          type: integer
          description: The month's recorded high-water mark; 0 when nothing raised it.
        recorded_peak_at:
          type: string
          format: date-time
          nullable: true
          description: When the recorded mark was set — null when nothing raised it.
        paths_now:
          type: integer
          description: Paths holding a slot right now (`active` and `paused`).
        paths_by_state:
          type: object
          additionalProperties: { type: integer }
          description: |
            Every path row counted per lifecycle state, e.g. `{"active": 2,
            "paused": 1}` — the breakdown that answers "why is a paused
            migration still holding a slot" without naming any path.
    QualifiedDomain:
      type: object
      description: One domain's measured answer (workplan 0106 T0).
      properties:
        answer: { type: string, enum: ['yes', 'no', unknown] }
        detail: { type: string, description: The English evidence line. }
    SetupChecklist:
      type: object
      properties:
        side: { type: string, enum: [source, target] }
        provider: { type: string }
        steps:
          type: array
          items:
            type: object
            properties:
              step:
                type: object
                properties:
                  key: { type: string }
                  titleKey: { type: string }
                  detailKey: { type: string }
                  yieldsKey: { type: string }
                  needsAnotherPerson: { type: boolean }
              state: { type: string, enum: [open, done, skipped] }
              decidedBy: { type: string }
              decidedAt: { type: string, format: date-time }
        progress:
          type: object
          properties:
            total: { type: integer }
            done: { type: integer }
            skipped: { type: integer }
            open: { type: integer }
            blockedOnOthers:
              type: integer
              description: Open steps needing an administrator — why a setup is stuck.
            complete: { type: boolean }
    PersonMigration:
      type: object
      description: One of a person's migrations, and where it is.
      required: [id, status]
      properties:
        id:
          type: string
          description: The id this edition's migration routes take. A uuid on managed.
        status:
          type: string
          enum: [paused, active, cutover, done, continuous]
    LifecycleCounts:
      type: object
      description: How many migrations are in each state. Every state is present, zero included.
      required: [paused, active, cutover, done, continuous]
      properties:
        paused: { type: integer, minimum: 0 }
        active: { type: integer, minimum: 0 }
        cutover: { type: integer, minimum: 0 }
        done: { type: integer, minimum: 0 }
        continuous: { type: integer, minimum: 0 }
    Person:
      type: object
      description: |
        A person being moved (ADR-0050, amended 2026-09-28). No state of its
        own: `counts` is their migrations' states, counted.
      required: [id, implicit, displayName, email, createdAt, migrations, counts]
      properties:
        id:
          type: string
          description: A uuid on managed. `implicit` for the appliance's one person.
        implicit:
          type: boolean
          description: True for the appliance's one person, who has no row, no name and no address.
        displayName:
          type: [string, 'null']
          maxLength: 200
          description: The name that titles the person's card. Null only for the implicit person.
        email:
          type: [string, 'null']
          maxLength: 254
          description: |
            Stored when somebody gives one, for grant links (0108). Nothing
            sends mail to it yet.
        createdAt:
          type: [string, 'null']
          format: date-time
          description: Null only for the implicit person.
        migrations:
          type: array
          description: Oldest first.
          items: { $ref: '#/components/schemas/PersonMigration' }
        counts: { $ref: '#/components/schemas/LifecycleCounts' }
    PeopleResponse:
      type: object
      required: [people, unassigned]
      properties:
        people:
          type: array
          description: Oldest first.
          items: { $ref: '#/components/schemas/Person' }
        unassigned:
          type: array
          description: Migrations that belong to nobody, oldest first. Always empty on the appliance.
          items: { $ref: '#/components/schemas/PersonMigration' }
    CreatePerson:
      type: object
      required: [displayName]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 200, description: Trimmed. }
        email:
          type: [string, 'null']
          maxLength: 254
          description: Optional. An empty string is no address.
    AddPersonMigration:
      type: object
      required: [mappingId]
      properties:
        mappingId: { type: string, format: uuid }
    PersonDeleted:
      type: object
      required: [deleted, unassigned]
      properties:
        deleted: { type: boolean, const: true }
        unassigned:
          type: array
          description: The person's migrations, which belong to nobody again. None was deleted.
          items: { type: string, format: uuid }

    Error:
      type: object
      description: Every refusal has this shape. `message` is meant to be shown to a person as-is.
      properties:
        error: { type: string, examples: ['Conflict'] }
        message:
          type: string
          examples: ['Mapping is paused — review the discovery counts and start it first (POST /start).']
      required: [error, message]

    BrowserFacts:
      type: object
      description: |
        What the browser says of itself with a problem report (workplan 0130
        T6, Part B). Each key is taken only in the shape below; any other key,
        or a value not in its shape, is dropped without refusing the report.
        Written into the report as lines, and nowhere else.
      properties:
        language: { type: string, enum: [en, nl], description: The screen's language. }
        timeZone:
          type: string
          maxLength: 64
          pattern: '^[A-Za-z][A-Za-z0-9_+-]*(?:/[A-Za-z0-9_+-]+){0,2}$'
          description: The IANA time zone.
        windowWidth: { type: integer, minimum: 1, maximum: 20000, description: The window's width in CSS pixels. }
        appVersion:
          type: string
          maxLength: 40
          pattern: '^[0-9A-Za-z][0-9A-Za-z.+-]*$'
          description: The web app's version; written only when it is not the server's.
        appCommit: { type: string, pattern: '^[0-9a-f]{7,40}$' }
        dataType: { type: string, enum: [email, calendar, contact, file, task], description: From the failure line the form was opened from. }
        side: { type: string, enum: [source, target], description: From the failure line. }
        migrationId: { type: string, format: uuid, description: From the failure line. }
        recentErrors:
          type: array
          minItems: 1
          maxItems: 3
          description: |
            The faults the page met in the five minutes before the form was
            opened, newest first: only each one's reference and code.
          items:
            type: object
            properties:
              reference: { type: string, pattern: '^[0-9a-f]{8}$' }
              code: { type: string, pattern: '^[a-z][a-z0-9_]{0,47}$' }
            required: [reference, code]

    AccountClosed:
      type: object
      description: |
        A door that would start work, re-arm it, or use the access an
        organisation gave, for an organisation that was closed (workplan 0085
        T2). `message` and `reason` carry one English sentence that names the
        day of the close and the day its data is removed from the service;
        `messageNl` and `reasonNl` carry the same in Dutch, for a page read in
        that language. Nothing was started, written or probed. Reading, the
        reopen and the erasure stay open, and after a reopen the same press
        goes through.
      properties:
        error: { type: string, enum: [account_closed] }
        message: { type: string }
        messageNl: { type: string }
        reason: { type: string }
        reasonNl: { type: string }
        closedAt:
          type: [string, 'null']
          format: date-time
          description: When it was closed; null when the close's own row could not say.
        purgeAfter:
          type: [string, 'null']
          format: date-time
          description: When its data is removed from the service; null when the close's own row could not say.
      required: [error, message, reason, closedAt, purgeAfter]

    PersonGrantPage:
      type: object
      description: |
        What a PERSON'S grant link opens (ADR-0035, amended 2026-09-29;
        workplan 0153 T5 (b)): who is asking, once, then each Google account
        the person's migrations read. No migration id, no tenant id, no client
        id: the authorize call names the account.
      required: [kind, organisation, accounts, expiresAt]
      properties:
        kind: { type: string, enum: [person] }
        organisation: { type: string }
        checkedCompany: { type: string, nullable: true }
        askedBy: { type: string, nullable: true }
        organisationPhone: { type: string, nullable: true }
        accounts:
          type: array
          items:
            type: object
            required: [account, granted, domains, migrations]
            properties:
              account: { type: string, description: 'The address, and the only one whose sign-in is kept for it.' }
              granted: { type: boolean, description: 'Every one of its migrations has a way in already.' }
              again:
                type: boolean
                description: |
                  Granted, and asked for again all the same: the link was made
                  while every account was connected, and this one has not been
                  connected through it since.
              domains:
                type: array
                items: { type: string, enum: [email, calendar, contact, file, task] }
              scope: { type: string, nullable: true, description: 'The one consent it asks, in Google''s words; null when it cannot be asked.' }
              readOnlyAtProvider: { type: boolean }
              notReady:
                nullable: true
                description: Why this account cannot be asked, in English and Dutch, or null.
                type: object
                properties:
                  reason: { type: string }
                  reasonNl: { type: string }
              migrations:
                type: array
                items:
                  type: object
                  properties:
                    domains:
                      type: array
                      items: { type: string, enum: [email, calendar, contact, file, task] }
                    to:
                      type: object
                      properties:
                        provider: { type: string }
                        host: { type: string, nullable: true }
                        account: { type: string, nullable: true }
                    granted: { type: boolean }
        expiresAt: { type: string, format: date-time }
    ProgressReport:
      type: object
      required: [mappings]
      properties:
        mappings:
          type: array
          items:
            type: object
            required: [mappingId, domains, check]
            properties:
              mappingId: { type: string, format: uuid }
              domains:
                type: array
                items:
                  type: object
                  required: [domain, state, phase, itemsSynced, bytesTransferred]
                  properties:
                    domain: { type: string }
                    state: { type: string }
                    phase: { type: string }
                    stopped: { type: boolean, enum: [true] }
                    itemsSynced: { type: integer }
                    itemsFound: { type: integer }
                    itemsAdopted: { type: integer }
                    bytesTransferred: { type: integer }
                    bytesFound: { type: integer }
                    lastSyncedAt: { type: string, format: date-time }
                    lastActiveAt: { type: string, format: date-time }
              check:
                oneOf:
                  - type: object
                    required: [state]
                    properties:
                      state: { type: string, enum: [not_run] }
                  - type: object
                    required: [state, since]
                    properties:
                      state: { type: string, enum: [running] }
                      since: { type: string, format: date-time }
                  - type: object
                    required: [state, at]
                    properties:
                      state: { type: string, enum: [could_not_run, passed, not_passed] }
                      at: { type: string, format: date-time }
    PersonProgressPage:
      type: object
      description: |
        What a PERSON'S progress link opens (ADR-0035, amended 2026-09-29;
        workplan 0153 T5 (b), slice 3): every migration of theirs, with the
        counts and states a migration's own page shows and nothing more. No
        mapping id, no tenant id, no address: the Google account a migration
        reads is named by an opaque `ref`, which a withdrawal sends back.
      required: [kind, organisation, expiresAt, migrations, accounts]
      properties:
        kind: { type: string, enum: [person] }
        organisation: { type: string }
        expiresAt: { type: string, format: date-time }
        migrations:
          type: array
          items:
            type: object
            required: [from, to, state, started, domains, account]
            properties:
              from: { type: string, description: "The source's kind, such as google or imap." }
              to: { type: string, nullable: true, description: "The destination's kind; null when it has none." }
              state:
                type: string
                enum: [paused, active, cutover, done, continuous]
              started: { type: boolean, description: False when no pass has ever run — not the same as zero. }
              domains:
                type: array
                items: { $ref: '#/components/schemas/ProgressRow' }
              checkPassedAt:
                type: string
                format: date-time
                description: When the check passed (workplan 0154 T8); absent unless it passed.
              time: { $ref: '#/components/schemas/ProgressTime' }
              account: { type: string, nullable: true, description: "The ref of the Google account it reads; null when it reads none through a link." }
        accounts:
          type: array
          items:
            type: object
            required: [ref, grant]
            properties:
              ref: { type: string, pattern: '^[0-9a-f]{32}$' }
              grant:
                oneOf:
                  - type: object
                    required: [state]
                    properties:
                      state: { type: string, enum: [granted] }
                  - type: object
                    required: [state, withdrawnAt]
                    properties:
                      state: { type: string, enum: [withdrawn] }
                      withdrawnAt: { type: string, format: date-time }
                  - type: object
                    required: [state]
                    properties:
                      state: { type: string, enum: [none] }
    ProgressRow:
      type: object
      description: |
        One data type of a migration, as a progress link shows it: counts,
        states, timestamps and closed words, never content (ADR-0035). The
        stage is the one the owner's line shows, worked out on the server
        (workplan 0154 T8); whose stop a paused one is does not cross.
      properties:
        domain: { type: string }
        state: { type: string }
        stage:
          type: string
          enum: [not_started, paused, copying, kept_in_step, ready_to_switch, switching, done]
          description: Absent for a phase the stage table does not place.
        itemsSynced: { type: integer }
        itemsFailed: { type: integer }
        bytesTransferred: { type: integer }
        itemsRetrying: { type: integer }
        itemsNeedingDecision: { type: integer }
        itemsAdopted: { type: integer, description: Left as they already were; absent when nobody counted. }
        itemsFound: { type: integer, description: What discovery found; absent when it did not count. }
        bytesFound: { type: integer, description: 'Their size, where the source has cheap sizes.' }
        lastSyncedAt: { type: string, format: date-time }
        lastActiveAt: { type: string, format: date-time }
        lastErrorCategory: { type: string }
        failedSide: { type: string, enum: [source, target] }
        pausedReason: { type: object }
    ProgressTime:
      description: |
        How long, by the owner's pages' rules (workplan 0154 T3, T8): before
        any pass has completed, from the count (`beforeStart`); once one has,
        while the migration copies, from the last passes (`whileCopying`).
        Absent where nothing is being waited for.
      oneOf:
        - type: object
          required: [kind, estimate]
          properties:
            kind: { type: string, enum: [beforeStart] }
            estimate:
              oneOf:
                - type: object
                  required: [kind, low, high, filesToo]
                  properties:
                    kind: { type: string, enum: [gmailDays] }
                    low: { type: integer }
                    high: { type: integer }
                    filesToo: { type: boolean }
                - type: object
                  required: [kind, mailBytes, filesToo]
                  properties:
                    kind: { type: string, enum: [gmailWithinADay] }
                    mailBytes: { type: integer }
                    filesToo: { type: boolean }
                - type: object
                  required: [kind]
                  properties:
                    kind: { type: string, enum: [notKnownYet] }
        - type: object
          required: [kind, estimate]
          properties:
            kind: { type: string, enum: [whileCopying] }
            estimate:
              oneOf:
                - type: object
                  required: [kind, unit, low, high, passes, slowed]
                  properties:
                    kind: { type: string, enum: [range] }
                    unit: { type: string, enum: [hours, days] }
                    low: { type: integer }
                    high: { type: integer }
                    passes: { type: integer }
                    slowed: { type: boolean }
                - type: object
                  required: [kind, passesSoFar]
                  properties:
                    kind: { type: string, enum: [afterThreePasses] }
                    passesSoFar: { type: integer }
    Refusal:
      type: object
      description: A refusal named by `error`, with the door's own sentence in `reason` or `message`.
      properties:
        error: { type: string }
        reason: { type: string }
        message: { type: string }
      required: [error]

    PlatformHeld:
      type: object
      description: |
        A door that enqueues a task, while an operator hold is open. `message`
        and `reason` carry the same sentence: the operator's own words,
        verbatim, or a default when they typed none. Nothing was started and
        nothing was written; press again once the hold is lifted.
      properties:
        error: { type: string, enum: [platform_held] }
        message: { type: string }
        reason: { type: string }
        since: { type: string, format: date-time, description: When the hold began. }
      required: [error, message, reason, since]

    ConnectionDeleted:
      type: object
      description: The answer to a delete that went through, with what happened to the grant behind it.
      properties:
        deleted: { type: boolean, enum: [true] }
        id: { type: string, format: uuid }
        displayName: { type: string }
        revocation: { $ref: '#/components/schemas/RevocationOutcome' }
      required: [deleted, id, revocation]

    MigrationDeleted:
      type: object
      description: |
        The answer to a migration delete that went through, with what happened
        to the grant its own row held, when it held one.
      properties:
        success: { type: boolean, enum: [true] }
        message: { type: string }
        revocation: { $ref: '#/components/schemas/RevocationOutcome' }
      required: [success, message]

    RevocationOutcome:
      type: object
      description: |
        What happened to the credential at the PROVIDER when we let go of our
        copy. `revoked` is the only status that means the grant is dead.
        `failed` means we tried and could not, so the person must withdraw it
        themselves. `unsupported` means this provider offers no revocation we
        can call — a password is revoked by changing it, Microsoft publishes no
        endpoint — and `reason` says so. `no_credential` means nothing was
        stored to revoke.
      properties:
        kind: { type: string, examples: [google] }
        status: { type: string, enum: [revoked, failed, unsupported, no_credential] }
        reason: { type: string }
      required: [kind, status]

    Health:
      type: object
      properties:
        status: { type: string, enum: [ok] }
        timestamp: { type: string, format: date-time }
      required: [status, timestamp]

    Version:
      type: object
      properties:
        version: { type: string, examples: ['0.1.0-rc.1'] }
        commit:
          type: string
          description: The build's commit, or `unknown` when the image was built without one.
          examples: ['63d1414c9e2f…']
      required: [version, commit]

    AuthMode:
      type: object
      properties:
        mode:
          type: string
          enum: [managed, local, dev]
          description: >
            `managed` verifies against the issuer's JWKS and nothing else;
            `local` verifies with the shared secret; `dev` has neither
            configured. Reported so an operator can see WHY the answer below is
            what it is.
          examples: ['managed']
        acceptsSeedToken:
          type: boolean
          description: >
            Whether a token signed with `JWT_SECRET` — what the seed script
            mints — will be accepted. False in managed mode, and the sign-in
            page hides the paste box on the strength of it rather than
            re-deriving the rule from a build-time value.
          examples: [false]
      required: [mode, acceptsSeedToken]

    CheckState:
      type: string
      enum: [up, down, off]
      description: |
        `off` is not a failure. A dependency nobody configured is a documented
        state, not a broken one — the self-host edition has no issuer at all,
        and a managed deployment that has not run identity setup yet is fine.

    Readiness:
      type: object
      description: |
        States, never reasons. This endpoint is unauthenticated, so a body that
        explained WHY the database was unreachable would describe internal
        topology to anybody who asked; the reason goes to the log instead.
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
          description: Only the database can make this `down` — it is the only check whose absence means nothing can be served.
        database: { $ref: '#/components/schemas/CheckState' }
        signIn: { $ref: '#/components/schemas/CheckState' }
      required: [status, database, signIn]

    SchedulerReadiness:
      type: object
      description: One field, a state and never a reason (workplan 0142 T2).
      properties:
        scheduler: { $ref: '#/components/schemas/CheckState' }
      required: [scheduler]
      additionalProperties: false

    Membership:
      type: object
      properties:
        tenantId: { type: string, format: uuid }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
      required: [tenantId, role]

    Me:
      type: object
      properties:
        userId:
          type: string
          description: The issuer's `sub`. Opaque, and never assumed to be an email.
        email:
          type: string
          description: From the verified `email` claim, not the database — what the issuer asserts about whoever just signed in.
        tenantId:
          type: string
          format: uuid
          description: |
            The organisation this caller is currently acting as. **ABSENT when
            that cannot be decided** — two memberships and no choice made is an
            answer, not an error, and a client resolves it by asking a person.
        role: { $ref: '#/components/schemas/Role' }
        tenants:
          type: array
          description: Every organisation this subject belongs to. Empty is normal — a new account belongs to nothing.
          items: { $ref: '#/components/schemas/Membership' }
        invitations:
          type: array
          description: |
            Open invitations addressed to this caller's VERIFIED address. Empty
            is the ordinary case — and is also what an issuer that will not
            assert `email_verified` gets, because email is not identity.
          items: { $ref: '#/components/schemas/Invitation' }
        operator:
          type: boolean
          description: |
            Whether to OFFER the access queue. The queue itself is guarded by
            database policies; being wrong here shows or hides a link and
            grants nothing.
        acceptance:
          $ref: '#/components/schemas/Acceptance'
      required: [userId, tenants, invitations, operator]

    Acceptance:
      type: object
      description: |
        Whether the texts still wait to be accepted (workplan 0139 T3): each
        text with its current version, and whether this caller accepted that
        version in the organisation they are acting as. **Present only while
        the deployment asks** (`OWNPACE_STAGE=alpha`, and no text still a
        draft) and an organisation is current. The web app shows its acceptance screen in front of every page
        while `due` is true, and the doors that store a credential answer 409
        `conditions_not_accepted` on the same reading. A text that gets a new
        version is due again.
      properties:
        due:
          type: boolean
          description: True while any text's current version is not accepted.
        documents:
          type: array
          description: Every text, in the order the screen lists them.
          items: { $ref: '#/components/schemas/AcceptanceDocument' }
      required: [due, documents]

    AcceptanceDocument:
      type: object
      properties:
        document: { $ref: '#/components/schemas/LegalDocument' }
        version:
          type: string
          description: The number on the text's Version line. A draft is never asked for.
        accepted:
          type: boolean
          description: Whether this caller accepted this version here.
      required: [document, version, accepted]

    LegalDocument:
      type: string
      enum: [alpha, privacy, terms]
      description: The Alpha conditions, the privacy policy or the terms.

    AcceptanceRequest:
      type: object
      additionalProperties: false
      properties:
        versions:
          type: object
          additionalProperties: false
          description: The version of each text the screen showed. Every text, and nothing else.
          properties:
            alpha: { type: string }
            privacy: { type: string }
            terms: { type: string }
          required: [alpha, privacy, terms]
        language:
          type: string
          enum: [nl, en]
          description: The language the screen showed the texts in.
      required: [versions, language]

    AcceptanceRecorded:
      type: object
      properties:
        written:
          type: integer
          description: Rows written, one per text. Nought when the same versions were accepted before.
        acceptance: { $ref: '#/components/schemas/Acceptance' }
      required: [written, acceptance]

    ConditionsNotAccepted:
      type: object
      description: |
        A door that would store a credential, or issue the grant link through
        which a family member gives one, pressed by somebody who has not
        accepted the current version of each text in this organisation, while
        the deployment asks (workplan 0139 T3). `message` and `reason` carry
        one English sentence, `messageNl` and `reasonNl` its Dutch, and
        `documents` names each text still to accept with its current version.
        Nothing was stored or probed. Once the texts are accepted
        (`POST /api/me/acceptance`), the same press goes through.
      properties:
        error: { type: string, enum: [conditions_not_accepted] }
        message: { type: string }
        messageNl: { type: string }
        reason: { type: string }
        reasonNl: { type: string }
        documents:
          type: array
          items:
            type: object
            properties:
              document: { $ref: '#/components/schemas/LegalDocument' }
              version: { type: string }
            required: [document, version]
      required: [error, message, messageNl, reason, reasonNl, documents]

    AcceptanceNotAsked:
      type: object
      description: |
        An acceptance offered while this deployment asks nobody: its switch is
        off, or a text is still a draft (workplan 0139 T3). Nothing was
        written. `message` and `reason` carry one English sentence,
        `messageNl` and `reasonNl` its Dutch.
      properties:
        error: { type: string, enum: [acceptance_not_asked] }
        message: { type: string }
        messageNl: { type: string }
        reason: { type: string }
        reasonNl: { type: string }
      required: [error, message, messageNl, reason, reasonNl]

    VersionNotCurrent:
      type: object
      description: |
        An acceptance naming a version that is not the current one: a page left
        open across an update. Nothing was written. `stale` names the texts
        whose version changed, `current` gives every current version, and the
        sentences say to read them again.
      properties:
        error: { type: string, enum: [version_not_current] }
        message: { type: string }
        messageNl: { type: string }
        reason: { type: string }
        reasonNl: { type: string }
        stale:
          type: array
          items: { $ref: '#/components/schemas/LegalDocument' }
        current:
          type: object
          properties:
            alpha: { type: string }
            privacy: { type: string }
            terms: { type: string }
          required: [alpha, privacy, terms]
      required: [error, message, messageNl, reason, reasonNl, stale, current]

    Invitation:
      type: object
      description: An offer of membership, not a membership.
      properties:
        tenantId: { type: string, format: uuid }
        name: { type: string, description: What the organisation is called. }
        role: { $ref: '#/components/schemas/Role' }
        invitedAt: { type: string, format: date-time, nullable: true }
      required: [tenantId, name, role]

    InvitationAnswer:
      type: object
      properties:
        tenantId: { type: string, format: uuid }
        outcome: { type: string, enum: [accepted, declined] }
      required: [tenantId, outcome]

    AccessRequestCreate:
      type: object
      properties:
        email: { type: string, format: email, maxLength: 320 }
        name: { type: string, maxLength: 200 }
        organisation: { type: string, maxLength: 200 }
        note:
          type: string
          maxLength: 2000
          description: What they are moving, in their own words. Several paragraphs' worth.
        tier:
          type: string
          maxLength: 40
          description: |
            Which tier they think they need. INDICATIVE ONLY, and not validated
            against the tier list on purpose: a stale name here would refuse a
            request over a label, and the value is read by a human who knows
            what the tiers are called.
        locale:
          type: string
          enum: [en, nl]
          default: en
          description: The language they asked in, and the language every reply comes back in.
        website:
          type: string
          description: |
            Leave empty, or leave it out. People never see this field. A
            request that fills it is answered as received and is not kept.
      required: [email]

    AccessRequest:
      type: object
      description: One row of the operator queue. Their own words plus what was decided.
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string, nullable: true }
        organisation: { type: string, nullable: true }
        note: { type: string, nullable: true }
        tier: { type: string, nullable: true }
        locale: { type: string, enum: [en, nl] }
        state: { type: string, enum: [open, granted, declined] }
        tenantId:
          type: string
          format: uuid
          nullable: true
          description: The organisation created by granting. Present exactly when `state` is `granted`, and the database enforces that.
        decidedBy: { type: string, nullable: true }
        decidedAt: { type: string, format: date-time, nullable: true }
        decisionNote:
          type: string
          nullable: true
          description: |
            **Written for the operator, not for the asker.** It is never sent to
            them: the decline email's event type carries no fields at all, so
            there is nothing for this to travel in.
        createdAt: { type: string, format: date-time }
      required: [id, email, locale, state, createdAt]

    GrantDecision:
      type: object
      properties:
        note: { type: string, maxLength: 2000, description: See `decisionNote` — not shown to the asker. }
        organisationName:
          type: string
          maxLength: 200
          description: What the organisation will be called. Defaults to what they told us, which is usually right and occasionally a typo worth fixing before it becomes a customer's name.

    DeclineDecision:
      type: object
      properties:
        note: { type: string, maxLength: 2000, description: See `decisionNote` — not shown to the asker. }
        notify:
          type: boolean
          default: true
          description: |
            Email them. Defaults to `true` so silence is deliberate rather than
            forgotten. Set `false` for junk — this form is public, so a made-up
            address belongs to a stranger who never wrote to us.

    NotifiedOutcome:
      type: string
      enum: [sent, off, failed, skipped]
      description: |
        What became of the courtesy email — four states rather than a boolean,
        because each asks something different of the operator.

        `sent` needs nothing. `off` means no mail is configured, so nobody was
        told and nobody will be. `failed` means the mail server refused, which
        is also manual but a different conversation — something is broken
        rather than absent. `skipped` means the operator asked for no email;
        collapsing it into `off` would tell them to go and contact somebody
        they deliberately ignored.

        Granting never answers `skipped`: an unannounced grant is one the
        person can never use.

    GrantResult:
      type: object
      properties:
        tenantId: { type: string, format: uuid }
        name: { type: string, description: What the organisation is called. }
        email: { type: string, format: email, description: The address the invitation and the email were addressed to. }
        notified:
          allOf:
            - $ref: '#/components/schemas/NotifiedOutcome'
          description: Never `skipped` here.
      required: [tenantId, name, email, notified]

    DeclineResult:
      type: object
      properties:
        declined: { type: boolean, enum: [true] }
        id: { type: string, format: uuid }
        notified: { $ref: '#/components/schemas/NotifiedOutcome' }
      required: [declined, id, notified]

    Role:
      type: string
      enum: [owner, admin, member, viewer]

    Domain:
      type: string
      description: |
        The data domains this product carries. `task` joined on 2026-09-03
        (workplan 0113): a task list is a CalDAV collection declaring VTODO,
        and it is its own domain because a person ticks it separately from
        their calendars.
      enum: [email, calendar, contact, file, task]

    MappingStatus:
      type: string
      description: |
        `paused` is a migration awaiting its owner's green light; `done` has
        been finished and is no longer watched.
      enum: [active, paused, cutover, done]

    Mapping:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        name: { type: string }
        sourceType: { type: string, examples: ['imap'] }
        targetType: { type: string, examples: ['jmap'] }
        status: { $ref: '#/components/schemas/MappingStatus' }
        mode: { type: string, enum: [mirror, bidirectional, one_time, asymmetric] }
        pattern:
          type: [string, 'null']
          enum: [shared_s, distribution_d, null]
          description: Set when this migration carries a shared address rather than a user mailbox.
        domains:
          type: array
          items: { $ref: '#/components/schemas/Domain' }
        lastSyncAt:
          type: [string, 'null']
          format: date-time
          description: The newest domain completion. Absent means no domain has ever completed.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, tenantId, name, status, domains]

    EnqueuedRun:
      type: object
      description: What an enqueue answers with. The work has not happened yet.
      properties:
        success: { type: boolean }
        runId: { type: string }
        jobType: { type: string, examples: ['run-delta-sync'] }
        triggeredAt: { type: string, format: date-time }
      required: [success, runId]

    Run:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, running, succeeded, failed, cancelled] }
        # The ledger's own word for the run — 'confirm', 'initial_copy',
        # 'incremental', and the rest. Published since this endpoint shipped
        # and finally served from 2026-09-13: `type` collapses every kind into
        # full/delta, so a client watching ONE job could not find its own run
        # and had to settle for "is any run open".
        kind: { type: string, examples: ['incremental', 'confirm'] }
        trigger: { type: string, enum: [manual, schedule] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        itemsProcessed: { type: integer }
        errors: { type: integer }
        events:
          type: array
          description: The per-domain lines of this pass, including the domains that did not run and why.
          items: { type: object }
      required: [id, kind, status, startedAt]

    DeletionReceipt:
      type: object
      description: |
        `refused` is terminal and legitimate — a gate said no and said why. It
        is not an error state.
      properties:
        state: { type: string, enum: [queued, running, applied, refused, failed] }
        kind: { type: string, examples: ['deleted'] }
        requestedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        reason:
          type: [string, 'null']
          description: Present on `refused`/`failed`, verbatim.
      required: [state, requestedAt]

    FailureGroupDecision:
      type: object
      description: |
        WHICH failures the decision is for. Both fields are optional and both
        being absent is refused (see the route) — an unnarrowed press is
        almost never what was meant. `category` counts as narrowing too.
      properties:
        action:
          type: string
          enum: [retry, accept]
        domain: { $ref: '#/components/schemas/Domain' }
        category:
          type: string
          enum: [auth_expired, rate_limited, quota_exceeded, policy_refused, too_large, source_refused, target_refused, format_refused, network, unknown]
          description: |
            The failure KIND, which is the product's own grouping vocabulary and
            the one the Failures screen prints per row. Matched exactly, and
            only against a recorded value: a row whose category is NULL — every
            row written before migration 0049 — is reached by no category match
            at all, so the screen offers no bulk press for that group rather
            than widening one to the whole domain.
          examples: ['target_refused']
        errorContains:
          type: string
          description: |
            A LITERAL substring of the error as the queue shows it, never a
            pattern: `%` and `_` match themselves. `(50%).pdf` came out of a
            real filename, and unescaped that needle would match "50" followed
            by anything — on a bulk retry, the difference between the group
            somebody chose and most of the queue. Matched against what the
            queue answers, not the stored text (workplan 0136 T3, second
            step): a match on the stored text would read what the answer left
            out one guess at a time.
          examples: ['MKCOL', '404']
      required: [action]

    VerificationRunReport:
      type: object
      properties:
        state: { type: string, enum: [running, done, failed] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        error: { type: [string, 'null'] }
        report:
          type: [object, 'null']
          description: |
            Keyed by mapping id; each carries a per-domain
            `DomainVerification`, an `overallStatus`, `recommendations`,
            `canProceedToCutover`, and a `contentEvidence` of `checked`,
            `partial` or `none` — how much of the content leg actually ran.
            `none` means not one sampled item could be compared, so the verdict
            rests on counts and sizes alone; it does NOT close the gate.
          additionalProperties: { type: object }
      required: [state, startedAt]

    VerificationDomain:
      type: string
      description: |
        THE REPORT'S OWN SPELLING, which is not `Domain`'s.

        A migration's domains are `email`, `contact`, `file`, `task` — what a
        person ticks in the wizard. The §20 report names the same five
        `mail`, `calendar`, `contacts`, `files`, `tasks`: plural, and three of
        them different words. The web screen has carried a note about this
        since workplan 0113 ("the verification report has a THIRD spelling of
        the domains") and maps one onto the other rather than restating either.

        This schema existed as `$ref: Domain` until 2026-09-21, which meant the
        spec claimed `/verify` returns rows keyed `email`/`contact`/`file`/`task`.
        It never has. A client generated from that spec and validating a real
        report would have rejected every domain row but `calendar`.
      enum: [mail, calendar, contacts, files, tasks]

    DomainVerification:
      type: object
      description: |
        One domain's comparison. `SKIPPED` means the domain was not checked and
        says so — it is never counted as a pass. `NOT_VERIFIABLE` is stronger:
        items WERE copied and the target cannot be read for this domain, so
        their completeness is unknown and cutover is blocked.
      properties:
        dataType: { $ref: '#/components/schemas/VerificationDomain' }
        status: { type: string, enum: [PASS, FAIL, WARN, SKIPPED, NOT_VERIFIABLE] }
        sourceCount: { type: integer }
        targetCount: { type: integer }
        matchedCount: { type: integer }
        missingOnTarget: { type: integer }
        extraOnTarget: { type: integer }
        checksumMatches: { type: integer }
        checksumMismatches: { type: integer }
        checksumSampleSize: { type: integer }
        checksumUnavailable: { type: integer }
        totalBytesSource: { type: integer }
        totalBytesTarget: { type: [integer, 'null'] }
        issues:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              severity: { type: string, enum: [INFO, WARNING, ERROR] }
              message: { type: string }

    GroupDecisionAccepted:
      type: object
      properties:
        status: { type: string, enum: [ok] }
        action: { type: string, enum: [retry, accept] }
        matched:
          type: integer
          description: How many items the decision changed. Zero is not an error.
        match: { $ref: '#/components/schemas/FailureGroupDecision' }
        effect:
          type: string
          description: |
            What just happened, in a sentence meant for a person — including
            when nothing matched, where it says so rather than reporting
            success over an empty set.
      required: [status, action, matched, match, effect]

    Usage:
      type: object
      properties:
        tenantId: { type: string, format: uuid }
        period: { type: string, examples: ['2026-08'] }
        storageUsedGB: { type: number }
        egressGB: { type: number }
        computeHours:
          type: number
          description: Time the passes actually took, summed from their own start and finish stamps.
        syncCount: { type: integer }
        lastUpdated: { type: string, format: date-time }

    Cost:
      type: object
      description: Integer cents throughout — no float reaches an invoice.
      properties:
        baseFee: { type: integer }
        storage: { type: integer }
        egress: { type: integer }
        compute: { type: integer }
        subtotal: { type: integer }
        taxRate: { type: number, examples: [0.21] }
        tax: { type: integer }
        total: { type: integer }
      required: [baseFee, subtotal, taxRate, tax, total]

    BillingParty:
      type: object
      description: |
        Who invoices are addressed to (workplan 0111 T1). Consumer-shaped
        first: `kind` defaults to `consumer` and only a `business` may carry a
        `vatNumber` — the database enforces that, not just validation. The VAT
        number is as stated, not verified; the country is the customer's
        statement, not the place-of-supply decision.
      properties:
        tenantId: { type: string, format: uuid }
        kind: { type: string, enum: [consumer, business] }
        name:
          type: string
          description: A person's full name or a legal entity's registered name — never the workspace label.
        addressLine1: { type: string }
        addressLine2: { type: [string, 'null'] }
        postalCode: { type: string }
        city: { type: string }
        countryCode: { type: string, description: 'ISO 3166-1 alpha-2, uppercase.', examples: [NL] }
        vatNumber: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [tenantId, kind, name, addressLine1, postalCode, city, countryCode]

    VatConsultation:
      type: object
      description: |
        One VIES consultation, append-only (workplan 0111 T2). A row is
        always an ANSWER — valid or invalid — never a failed attempt.
        `countryCode` is the member state as VIES speaks it (EL not GR; XI
        exists, GB does not) and `vatNumber` is what was actually asked,
        prefix stripped. `consultationNumber` null marks an unqualified
        check, which proves less and says so.
      properties:
        id: { type: string, format: uuid }
        countryCode: { type: string, examples: [NL] }
        vatNumber: { type: string, examples: ['123456789B01'] }
        valid: { type: boolean }
        requestDate:
          type: [string, 'null']
          description: VIES's own stamp, verbatim — never reformatted.
        consultationNumber: { type: [string, 'null'] }
        traderName: { type: [string, 'null'] }
        traderAddress: { type: [string, 'null'] }
        checkedAt: { type: string, format: date-time }
      required: [id, countryCode, vatNumber, valid, checkedAt]

    VatTreatment:
      type: object
      description: |
        The VAT decision for one buyer (workplan 0111 T3): a treatment, never
        a percentage — what a rate IS belongs to the bookkeeping system's own
        tax tables. `rationale` is one English sentence saying why; the page
        renders its own localized wording per treatment.
      properties:
        treatment:
          type: string
          enum: [domestic_standard, reverse_charge, destination_oss, outside_eu]
        rationale: { type: string }
      required: [treatment, rationale]

    CreateMappingRequest:
      type: object
      description: |
        The source and target this migration carries. Credentials are encrypted
        at rest and masked on every read-back; the API never returns a stored
        secret.
      properties:
        name: { type: string }
        sourceConfig:
          type: object
          description: |
            `username` is required. Which flow applies is decided by which
            fields are present, not by a type flag: `password` for a source
            that signs in directly; `tenantId` + `clientId` + `clientSecret`
            for the customer's own Entra app registration.
          properties:
            type: { type: string, examples: ['imap-oauth2'] }
            host: { type: string }
            port: { type: integer }
            useSsl: { type: boolean }
            tlsVerify:
              type: boolean
              description: |
                Defaults to true. Set false only for a lab server with a
                self-signed certificate — a rejection against a real mail
                server is a finding, not something to switch off.
            username: { type: string }
            password: { type: string, writeOnly: true }
            tenantId: { type: string }
            clientId: { type: string }
            clientSecret: { type: string, writeOnly: true }
            rootFolderId:
              type: string
              description: |
                The folder a migration's files are read from, by id, on a
                `google-drive`, `google` or `box` source; unset reads the whole
                account. On a reused connection it is this migration's own
                (`source_config_override`), which *Only one folder* on *Start a
                migration* sends for a Google account too (workplan 0153 open
                question 5, item 4).
            rootPath:
              type: string
              description: The same, as a path, on a `dropbox` source, such as `/Photos`.
            nativeFilePolicy:
              type: string
              enum: [refuse, export-odf, export-office, export-pdf]
              description: |
                Google sources that carry files (`google-drive`, `google`):
                the format Google Docs, Sheets, Slides and Drawings are
                exported in. Unset means `refuse`.
            nativeFilePolicies:
              type: object
              description: |
                A format per kind (workplan 0042 T9), laid over
                `nativeFilePolicy`; a kind left out follows it. No single
                editable format carries all four kinds, so
                `{ "presentation": "export-odf" }` beside `export-office`
                keeps every kind editable. An unknown kind is refused by
                name rather than ignored.
              properties:
                document: { type: string, enum: [refuse, export-odf, export-office, export-pdf] }
                spreadsheet: { type: string, enum: [refuse, export-odf, export-office, export-pdf] }
                presentation: { type: string, enum: [refuse, export-odf, export-office, export-pdf] }
                drawing: { type: string, enum: [refuse, export-odf, export-office, export-pdf] }
                paper:
                  type: string
                  enum: [refuse, markdown, html]
                  description: |
                    Dropbox sources only (workplan 0150 T3): the format Paper
                    docs and templates are exported in, arriving under their
                    name with the suffix appended (`Notes.paper.md`). Unset
                    means `refuse`: each one is reported as not migrated, with
                    a reason. A Dropbox source takes no Google kind here, and
                    a Google source takes no `paper`; either is refused by
                    name.
              additionalProperties: false
          required: [username]
        targetConfig:
          type: object
          properties:
            type: { type: string, examples: ['jmap'] }
            host: { type: string }
            port: { type: integer }
            baseUrl: { type: string }
            username: { type: string }
            password: { type: string, writeOnly: true }
            url:
              type: string
              description: |
                DAV targets only (workplan 0105 T1): the full DAV base URL,
                for a provider whose DAV root is not at the host root. When
                present it wins over host+port.
          required: [username, password]
        domains:
          type: array
          items: { $ref: '#/components/schemas/Domain' }
        schedule:
          type: string
          description: Five-field cron. An unparseable value is refused at create, not silently replaced by a default.
          examples: ['*/15 * * * *']
        status:
          type: string
          enum: [paused, active]
          default: paused
          description: |
            Where the migration begins: a draft (`paused`, the default) that
            waits for `/start`, or `active`, running from its first minute.
            `cutover`, `done` and `continuous` are refused here with a 400 that
            says so. Each is reached once the migration exists, through the
            cutover, Finish and Keep copying, which check what they need.
      required: [sourceConfig, targetConfig]
