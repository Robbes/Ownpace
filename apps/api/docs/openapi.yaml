openapi: 3.1.0

# The managed edition's HTTP surface, as a machine-readable contract.
#
# THIS FILE USED TO BE MARKDOWN. It was named `openapi.yaml`, its first line
# announced "OpenAPI 3.0 specification", and it contained none of `openapi:`,
# `info:` or `paths:` — prose in a spec's clothing, which no client generator,
# validator or agent could read, and which had drifted from the routes it
# described (it documented `PUT /tenants/{id}/members/{id}` while the code
# serves PATCH, and knew nothing of verify, apply-deletions, runs, discovery,
# shared addresses or the permission report). A file that claims to be a
# contract and is not one is worse than no file: it invites somebody to build
# against it.
#
# WHAT IS GUARANTEED HERE. The SURFACE is verified against the Express routers
# — every path, method, parameter and mount point below was read out of
# apps/api/src/routes and is pinned by openapi-spec.unit.test.ts, which fails
# if a documented path has no route or a documented method is not the one the
# code registers.
#
# WHAT IS DELIBERATELY SHALLOW. Response bodies are described precisely where
# the shape is verified (mappings, runs, verification, deletion receipts,
# usage, cost, health, version) and left as open objects where it is not.
# Inventing field names to make a document look complete is the same failure
# this file is being rescued from, one level down: a generated client would
# then be wrong in a way nothing catches. An open object says "there is a
# body, and this spec does not pin its fields yet", which is true.
#
# The full narrative documentation lives in docs/ — the operator runbook, the
# ADRs and the workplans. This file is the contract, not the manual.

info:
  title: Ownpace — managed API
  version: 0.1.0-rc.1
  summary: Migrate mail, calendar, contacts and files off US cloud, on your own schedule.
  description: |
    The multi-tenant managed edition. Every request is scoped to one tenant by
    the bearer token; the database enforces the same boundary again with
    row-level security, so a token for tenant A cannot read tenant B even if a
    route forgets to filter.

    **Two ideas run through the whole surface and explain most of its shape:**

    - *Nothing consequential happens without a person.* Deleting on the target,
      finishing a migration and moving billing money are gated behind explicit
      evidence, an owner/admin role, or both. Endpoints that could destroy data
      refuse by default and say what is missing.
    - *A failure is reported as itself.* Routes return the reason verbatim
      rather than an empty success. "I found nothing" and "I could not look"
      are different answers and never share a status code.

    Long-running work (sync, cutover, verification, applying a deletion) is
    enqueued, not performed in the request: those endpoints answer `202` with
    an identifier, and a matching read endpoint polls the outcome.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: Ownpace
    url: https://github.com/Robbes/Ownpace

servers:
  - url: https://{host}
    description: A managed deployment. There is no shared public instance — an operator runs their own.
    variables:
      host:
        default: localhost:3001
        description: Host and port of the API service (deploy/compose/managed.yml publishes 3001).

security:
  - bearerAuth: []

tags:
  - name: Service
    description: Liveness, readiness, build identity and metrics. No tenant, no token.
  - name: Account
    description: Who the caller is, and which organisations they may act in. The one authenticated surface that answers before any tenant is resolved.
  - name: Invitations
    description: Answering an invitation to an organisation — join it, refuse it, or leave it for later.
  - name: Access
    description: Asking to be let in, and an operator's half of answering. Invite-only, so the asking is public and the deciding is not.
  - name: Tenants
    description: The tenant record and its members.
  - name: Migrations
    description: Creating, scoping, running and finishing a migration.
  - name: Operating
    description: The three decision queues, verification, and applying a deletion.
  - name: Decisions
    description: Drift decisions (§11.2) and the standing answers that resolve them automatically.
  - name: Discovery
    description: What the source holds, and the shared addresses and permissions that do not migrate with it.
  - name: Billing
    description: Usage, cost, invoices and payment methods. Owner/admin only, reads included.
  - name: Webhooks
    description: Called by the payment provider, not by clients.
  - name: Support
    description: |
      What a platform operator may see of a customer, to answer them when they
      ask. Metadata only, read-only, and every read is recorded — the views
      behind these operations decide who is an operator, not the API.

paths:
  /health:
    get:
      tags: [Service]
      summary: Liveness
      description: Answers as soon as the process is serving. Does not check the database.
      security: []
      responses:
        '200':
          description: The service is up.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /api/health:
    get:
      tags: [Service]
      summary: Liveness (same-origin path)
      description: |
        Identical to `/health`. Exists because the web front proxies `/api` to
        this service, so a browser checking health same-origin needs the
        prefixed path.
      security: []
      responses:
        '200':
          description: The service is up.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /version:
    get:
      tags: [Service]
      summary: Which build is running
      description: |
        Version and commit, so "what are you running" has an answer during a
        support conversation. The commit is stamped into the image at build
        time; a hand-built image that was not given one reports `unknown`
        rather than guessing.
      security: []
      responses:
        '200':
          description: The running build.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Version' }

  /api/version:
    get:
      tags: [Service]
      summary: Which build is running (same-origin path)
      security: []
      responses:
        '200':
          description: The running build.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Version' }

  /api/auth/mode:
    get:
      tags: [Service]
      summary: Which credential this API will accept
      description: >
        Read by the sign-in page before anybody has a credential, so it can
        offer the one this deployment will actually take. `acceptsSeedToken` is
        false whenever `JWT_ISSUER` is set: managed mode verifies against the
        provider's JWKS and never falls back to `JWT_SECRET`, which is what a
        seed token is signed with. Unauthenticated for the same reason
        `/health` is — it is asked by somebody who has nothing to authenticate
        with yet, and it discloses only what the sign-in page already shows.
      security: []
      responses:
        '200':
          description: How this deployment signs people in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthMode' }

  /metrics:
    get:
      tags: [Service]
      summary: Prometheus metrics
      description: |
        Process and migration counters in Prometheus text format. Deliberately
        without per-tenant dashboards or alert rules: thresholds chosen before
        there is traffic to measure would be guesses wearing the costume of a
        service level.
      security: []
      responses:
        '200':
          description: Metrics in Prometheus exposition format.
          content:
            text/plain:
              schema: { type: string }

  /ready:
    get:
      tags: [Service]
      summary: Readiness — can this instance actually serve
      description: |
        Unlike `/health`, this one can fail. It checks the database through the
        **same pool the request path uses** (PgBouncer included, when one is in
        front), so it proves the route customers take rather than a different
        one that happens to work, and it checks that the sign-in issuer is
        answering at its discovery document.

        **`503` only when the database is down**, because that is the only
        check whose absence means no request can be served at all. A sign-in
        outage is `degraded` and still `200`: the API IS serving the people
        already inside it, and a load balancer that pulled it from rotation
        would turn a partial problem into a total one.

        The body publishes STATES, never reasons — an unauthenticated endpoint
        that reported *why* the database was unreachable would be describing
        internal topology to anybody who asked. The reason goes to the log.
      security: []
      responses:
        '200':
          description: Serving. `status` is `ok`, or `degraded` when something non-fatal is down.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '503':
          description: The database is unreachable, so nothing can be served.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }

  /api/ready:
    get:
      tags: [Service]
      summary: Readiness (same-origin path)
      description: |
        Identical to `/ready`, prefixed for the same reason `/api/health` is:
        the web front proxies `/api` to this service.
      security: []
      responses:
        '200':
          description: Serving, possibly degraded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '503':
          description: The database is unreachable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }

  /api/me:
    get:
      tags: [Account]
      summary: Who am I, and where may I go
      description: |
        **This route REPORTS rather than refuses**, which is what makes it
        different from every other authenticated endpoint. They resolve a
        tenant and refuse what they cannot decide; this one exists precisely to
        answer *"these two, currently neither"* without a `400`, because a
        client handles that by asking a person.

        A subject who belongs to nothing is a normal, documented state — the
        first sign-in after self-registration, or before a grant. It answers
        with an empty `tenants` and no `tenantId`.

        It also has one side effect: **an invitation is claimed here.** When the
        caller belongs to nothing, a `tenant_member` row addressed to their
        email and still carrying a `pending:` placeholder is bound to their
        subject — but only against an address the issuer says it VERIFIED,
        since otherwise whoever registers an address inherits what was granted
        to it.
      responses:
        '200':
          description: The caller, their memberships, and which one they are currently acting as.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/invitations/{tenantId}/accept:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      tags: [Invitations]
      summary: Join the organisation that invited you
      description: |
        Binds this subject to the invitation and makes the membership active.

        **Only ever one organisation.** Until workplan 0099 this happened
        implicitly for ALL of them, on the way through `/api/me` — reading your
        own account joined you to things, and there was no moment at which
        anybody could decline. Accepting is now something a person does, once,
        on purpose.

        Authorised by policy, not by this route (migration 0006). The row must
        be an open invitation addressed to the address in `app.current_email`,
        which is set only when the issuer asserted `email_verified: true`, and
        what the row may BECOME is pinned too — so this cannot be turned into
        "set somebody else's user id".
      responses:
        '200':
          description: Joined.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationAnswer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: |
            No open invitation for this caller there — or one they cannot see.
            The same answer on purpose: distinguishing them would tell anybody
            who asked whether an address has an invitation at an organisation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/invitations/{tenantId}/decline:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      tags: [Invitations]
      summary: Refuse the invitation, and stay unlinked to it
      description: |
        Marks the invitation `declined`. **It does not bind your subject**, and
        that is enforced by policy rather than by this route: accepting records
        who joined because that is what joining means, while a refusal must not
        leave a permanent link between a person and an organisation they said no
        to, in a table that organisation's operator can read. What the row
        records afterwards is that the ADDRESS was invited and refused.

        The same check is what stops this statement being used as a weapon:
        without it, `status='declined', user_id='<somebody else>'` would create a
        row that permanently blocks a chosen person from ever joining a chosen
        organisation, since membership is unique per (organisation, subject).

        **There is no "skip" endpoint**, deliberately. Leaving an invitation
        unanswered is the absence of a decision, not a state — the row stays
        `invited` and `GET /api/me` offers it again.
      responses:
        '200':
          description: Refused, and the record says so without naming you.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationAnswer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No open invitation for this caller there — or one they cannot see.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/access-requests:
    post:
      tags: [Access]
      summary: Ask to be let in
      description: |
        **Unauthenticated and it WRITES**, which is the whole of its risk. Four
        things carry that: the table grants `app_user` INSERT and nothing else;
        every field is length-capped before the insert; a refusing rate limit
        sized as a service-wide cap (without `TRUST_PROXY` every caller shares
        the ingress's address); and **the response is identical whatever
        happens**.

        That last one is deliberate. It never says whether an address is
        already known, already granted, or new — a public endpoint that
        distinguishes those is an account-enumeration oracle. It is also
        honest: from the asker's side all of those genuinely are *"we have it,
        a person will read it"*.

        It holds no credentials and nothing about a mailbox. `tier` is
        indicative only — a tier is DERIVED from what actually runs, never
        picked.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessRequestCreate' }
      responses:
        '201':
          description: Recorded. Says nothing about the address — see above.
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: boolean, enum: [true] }
                  message: { type: string }
                required: [received, message]
        '400': { $ref: '#/components/responses/BadRequest' }
        '429':
          description: More requests than expected from one place. Carries `Retry-After`.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds to wait.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [Access]
      summary: The queue an operator works
      description: |
        Open first, oldest first within that — the queue is worked from the
        top, and somebody who asked on Monday should not sit behind somebody
        who asked on Friday. No filter shows everything, which is what makes a
        decision reviewable afterwards.

        **Nothing in this route authorises the caller.** Policies on
        `access_request` do: the rows are invisible unless `app.current_user`
        names a row in `platform_operator`, enforced against the role the API
        really connects as. So a non-operator gets `200` and an empty list,
        because to the database that is exactly what is there.
      parameters:
        - name: state
          in: query
          required: false
          description: Narrow to one state. Anything else is a `400` naming the three.
          schema: { type: string, enum: [open, granted, declined] }
      responses:
        '200':
          description: The queue. Empty for a non-operator, and that is not an error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items: { $ref: '#/components/schemas/AccessRequest' }
                required: [requests]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/access-requests/{id}/grant:
    parameters:
      - $ref: '#/components/parameters/AccessRequestId'
    post:
      tags: [Access]
      summary: Say yes, and mean it
      description: |
        **Granting is not a flag.** It creates the organisation and its first
        owner in the SAME transaction that marks the request granted, because
        the three facts are one fact: a tenant nobody asked for, or a request
        pointing at an organisation that does not exist, are both worse than a
        failure.

        The owner row is an **invitation, not a member**. The person has not
        signed in yet and there is no way to know their subject before they do;
        inventing one keyed on their email would mean anybody who can create an
        account with that address gets the organisation. `GET /api/me` binds it
        on first sign-in, against a verified address only.

        The email is sent **after the commit and outside it**. A mail server
        being down must not roll back an organisation that was correctly
        created — and equally the mail must only ever describe something that
        actually happened. `notified` comes back because *"nobody was told"*
        means the manual step is back and the operator is the only one who can
        take it.

        A `404` here means *invisible or absent*, deliberately not
        distinguished: a non-operator must not be able to tell whether an id
        exists.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrantDecision' }
      responses:
        '201':
          description: The organisation exists and the invitation is waiting.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrantResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No such request — or one this caller cannot see. The same answer on purpose.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Already decided. Deciding twice would create a second organisation or lose the first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/access-requests/{id}/decline:
    parameters:
      - $ref: '#/components/parameters/AccessRequestId'
    post:
      tags: [Access]
      summary: Say no, and keep the record
      description: |
        No tenant, and **the row is not deleted** — `access_request` has no
        DELETE grant for anybody, so a refusal cannot be made to disappear
        afterwards. That is the queue's whole value as a record.

        The person is emailed unless `notify` is `false`. That flag exists on
        this decision and not on granting, and the asymmetry is the point: an
        unannounced grant is one the person can never use, so there is nothing
        to opt out of, while the form answered here is PUBLIC and rate-limited,
        and mailing a refusal to a forged address means mailing a stranger who
        never wrote to us. It defaults to `true` so silence is chosen rather
        than fallen into.

        **The email carries no reason and never the decision note.** The
        operator's note is labelled *"not for them"* on the screen that
        collects it, and the event type behind this mail has no fields at all,
        so there is nothing to leak through.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeclineDecision' }
      responses:
        '200':
          description: Declined, and the record stands.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeclineResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No such request — or one this caller cannot see.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Already decided.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/tenants:
    get:
      tags: [Tenants]
      summary: List the tenants this token may see
      responses:
        '200':
          description: The caller's tenants.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Tenants]
      summary: Create a tenant — NOT AVAILABLE HERE
      description: |
        Always `501`. Tenant creation is a cross-tenant bootstrap operation and
        cannot run through a tenant-scoped request: the RLS insert policy
        requires the new row's id to equal the current tenant, which a freshly
        created tenant never satisfies. Documented rather than hidden, because
        the honest refusal is the contract — tenants are provisioned by the
        onboarding/seed path.
      responses:
        '501':
          description: Not implemented, with the reason and the path that does work.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/tenants/{tenantId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Tenants]
      summary: Get one tenant
      responses:
        '200':
          description: The tenant.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Tenants]
      summary: Update a tenant's name or settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 255 }
                settings: { type: object }
      responses:
        '200':
          description: The updated tenant.
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Tenants]
      summary: Retired — close the account instead
      description: |
        Gone since workplan 0085. This did a hard delete that cascaded
        twenty-five tables, `invoice` and `audit_log` among them, behind one
        call with no confirmation and no way back — destroying billing records
        that tax law requires be kept.

        It answers 410 naming the replacement rather than 404, so a caller that
        has not been updated is told where to go instead of seeing what looks
        like a routing bug.
      responses:
        '410':
          description: Retired. Use POST /api/tenants/{tenantId}/close.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/tenants/{tenantId}/close:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      tags: [Tenants]
      summary: End the service for this tenant
      description: |
        Stops syncs and billing immediately and makes the account read-only,
        then schedules the erasure for the window the customer chose.

        **Closed is not deleted.** Until `purgeAfter` passes the close can be
        undone with `/reopen`; a window of 0 cannot, and says so.

        The response carries `outlivingAccess` — everything that keeps working
        after the erasure and only the customer can end. Two kinds, and both
        matter: the **permissions** granted in their own provider consoles, and
        the **app passwords** they gave us, which keep authenticating after we
        delete our copy. We can name them and say where; we cannot remove them.
        (`standingGrants` is the older field covering only the permissions.)

        **Two dates, not one.** `purgeAfter` is when the live service stops
        holding the data. `backupsExpireAt` is when the last backup that could
        still contain it ages out — a further `backupRetentionDays` — and that
        is when the erasure actually completes. `erasureCompletesText` is the
        same thing as a sentence, in both languages, for showing to the
        customer. Backups are not edited retrospectively; they expire.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [windowDays]
              properties:
                windowDays:
                  type: integer
                  enum: [0, 7, 30, 90]
                  description: Days before the erasure runs. 0 cannot be undone.
      responses:
        '200':
          description: Closed, with the purge scheduled.
          content:
            application/json:
              schema:
                type: object
                required:
                  [status, purgeAfter, windowDays, backupsExpireAt, backupRetentionDays]
                properties:
                  status: { type: string, enum: [closed] }
                  purgeAfter:
                    type: string
                    format: date-time
                    description: When the live database stops holding this tenant's data.
                  windowDays: { type: integer, enum: [0, 7, 30, 90] }
                  backupsExpireAt:
                    type: string
                    format: date-time
                    description: >-
                      When the last backup that could contain this tenant's data
                      ages out — i.e. when the erasure completes.
                  backupRetentionDays:
                    type: integer
                    description: This deployment's backup retention window, in days.
                  erasureCompletesText:
                    type: object
                    description: The same promise as a sentence, for showing to the customer.
                    properties:
                      en: { type: string }
                      nl: { type: string }
                  canReopenUntil:
                    type: [string, 'null']
                    format: date-time
                    description: Null when the window was 0 — an immediate close cannot be undone.
                  standingGrants:
                    type: array
                    description: >-
                      Superseded by outlivingAccess; kept for existing callers.
                      Covers the OAuth consents only.
                    items: { type: object }
                  outlivingAccess:
                    type: object
                    description: >-
                      Everything that keeps working after the erasure, in both
                      languages: the consents sitting in the customer's provider
                      consoles AND the app passwords sitting in their own
                      accounts. Credentials come first — a consent is a
                      permission sitting unused, a live app password is a
                      working way in.
                    properties:
                      en: { type: array, items: { type: object } }
                      nl: { type: array, items: { type: object } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/tenants/{tenantId}/reopen:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      tags: [Tenants]
      summary: Undo a close while the window is still open
      description: |
        The reason the staged flow exists: a mistaken click, a resolved
        dispute, or a bug in the purge spotted before it ran. Refuses with 409
        once the window has passed — there is nothing to come back to.
      responses:
        '200':
          description: The tenant is active again.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Not closed, or the window has already passed.
          content:
            application/json:
              schema: { type: object }

  /api/tenants/{tenantId}/notifications:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    put:
      tags: [Tenants]
      summary: Set this tenant's digest cadence
      description: |
        How often this tenant's owners and admins are mailed the "what needs
        attention" digest — daily, weekly, or off. A summary with nothing in it
        is never sent; silence means nothing is waiting.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: The stored preference.
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/tenants/{tenantId}/members:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Tenants]
      summary: List members
      responses:
        '200':
          description: The tenant's members.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Tenants]
      summary: Invite a member
      description: |
        A second invitation for an address that already has a live row is
        refused with `409` naming that row, rather than quietly creating a
        duplicate whose role nobody can predict.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '201':
          description: The invited member.
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: An invited or active row for this address already exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/tenants/{tenantId}/members/{memberId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: memberId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Tenants]
      summary: Get one member
      responses:
        '200':
          description: The member.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Tenants]
      summary: Change a member's role
      description: |
        Owner/admin only. Removing your own last owner role is refused — the
        last owner cannot demote themselves out of the tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { $ref: '#/components/schemas/Role' }
      responses:
        '200':
          description: The updated member.
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Refused — this change would leave the tenant without an owner.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Tenants]
      summary: Remove a member
      responses:
        '200': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Refused — removing this member would leave the tenant without an owner.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/migrations/google-drive/shared-drives:
    post:
      tags: [Migrations]
      summary: List the shared drives a Google credential can see
      description: |
        Read-only (`drives.list`), for the wizard's rootFolderId "browse".
        Credentials travel in the request like test-connection's; nothing is
        stored. A provider refusal is an answer (`{ok:false, reason}`),
        verbatim.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId, clientSecret, refreshToken]
              properties:
                clientId: { type: string }
                clientSecret: { type: string, writeOnly: true }
                refreshToken: { type: string, writeOnly: true }
      responses:
        '200':
          description: The drives, or the refusal.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  drives:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                  reason: { type: string }
        '400': { description: The three credential fields were not all present. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/migrations/google-drive/shared-folders:
    post:
      tags: [Migrations]
      summary: List the folders other accounts shared with a Google credential
      description: |
        Read-only (`files.list` over the shared-with-me view, folders only),
        the second half of the rootFolderId "browse": a shared folder migrates
        by rooting a mapping at its id. Credentials travel like
        shared-drives'; nothing is stored. A provider refusal is an answer
        (`{ok:false, reason}`), verbatim.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId, clientSecret, refreshToken]
              properties:
                clientId: { type: string }
                clientSecret: { type: string, writeOnly: true }
                refreshToken: { type: string, writeOnly: true }
      responses:
        '200':
          description: The folders (owner address included when Drive names one), or the refusal.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  folders:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        owner: { type: string }
                  reason: { type: string }
        '400': { description: The three credential fields were not all present. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/migrations/dropbox/shared-folders:
    post:
      tags: [Migrations]
      summary: List the shared folders a Dropbox credential can see
      description: |
        Read-only (`sharing/list_folders`), Dropbox's turn at the rootPath
        "browse". A MOUNTED folder answers with the path that goes in
        `rootPath`; an unmounted one is listed without a path — mounting
        happens in Dropbox itself. The trio keys are the shared OAuth shape
        (Dropbox's App Console calls the first two "App key" and
        "App secret"); nothing is stored. Needs the `sharing.read` scope —
        an app without it gets Dropbox's refusal verbatim
        (`{ok:false, reason}`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId, clientSecret, refreshToken]
              properties:
                clientId: { type: string }
                clientSecret: { type: string, writeOnly: true }
                refreshToken: { type: string, writeOnly: true }
      responses:
        '200':
          description: The shared folders (path present only when mounted), or the refusal.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  folders:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        path: { type: string }
                  reason: { type: string }
        '400': { description: The three credential fields were not all present. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/migrations/google/authorize:
    post:
      tags: [Migrations]
      summary: Start a Google consent against the customer's own client
      description: |
        Returns the URL to send a browser to, plus the redirect URI Google must
        have registered — a wrong one fails at Google's screen, so the caller is
        given the exact string to register.

        **Two shapes, and the ask is exactly what was named.** `sourceType` is
        one Google source and one scope: nothing can widen a Gmail consent into
        Drive. `domains` is the ACCOUNT ask (workplan 0106 T3b) — one Google
        connection wearing several faces, and the scope string is built from the
        ticks and from nothing else. Neither shape has a default: an empty tick
        set is refused rather than substituted, because a fallback would be a
        way to ask for something nobody ticked.

        A `google` account connection serves **calendar and contact**. Mail and
        files need scopes Google classes as restricted — an annual third-party
        security assessment for the whole application, including customers who
        only wanted contacts — so a tick for either is **refused**, naming the
        single-purpose `gmail` or `google-drive` source that still serves it. A
        silent narrowing would be worse: somebody approves a screen showing two
        faces, believing they ticked four.

        The consent is asked **incrementally** (`include_granted_scopes`), which
        is not optional once the ask is narrow: Google replaces a grant with
        exactly what the latest consent named, so a person who consented to mail
        and then to calendar would otherwise be left with calendar only.

        The client secret is held in process memory keyed by a signed,
        single-use, ten-minute `state` and is never in a URL. An appliance
        reached at a raw IP is refused here rather than at Google's screen,
        because a redirect URI cannot be an IP address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId, clientSecret]
              properties:
                clientId: { type: string }
                clientSecret: { type: string, writeOnly: true }
                sourceType:
                  type: string
                  description: The single-purpose ask. Mutually exclusive with `domains`.
                  enum: [gmail, google-calendar, google-contacts, google-drive]
                domains:
                  type: array
                  description: |
                    The account ask: which faces of one Google account to
                    consent to. Mutually exclusive with `sourceType`.
                  items:
                    type: string
                    enum: [email, calendar, contact, file]
              oneOf:
                - required: [sourceType]
                - required: [domains]
      responses:
        '200':
          description: Where to send the browser, and what Google must have registered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  redirectUri: { type: string }
                  scope:
                    type: string
                    description: |
                      Space-joined, in a stable order — the same tick set always
                      produces the same string, so a person can recognise it as
                      the request they approved yesterday. Always identical to
                      the URL's own `scope` parameter.
                  domains:
                    type: array
                    description: |
                      What was asked for, echoed back in the same order as
                      `scope`. Present only for the account ask; for a
                      `sourceType` ask the source already said it.
                    items: { type: string }
        '400':
          description: |
            `invalid_body` (neither shape), `no_domains_ticked` (an empty tick
            set), `unknown_domain` (not one of the four), `not_on_this_account`
            (a face this account kind does not serve, naming the source that
            does), or `raw_ip_callback`.
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/migrations/google/callback:
    get:
      tags: [Migrations]
      summary: Where Google returns the person's browser
      description: |
        Public by nature and trusted by nothing except the signed, single-use,
        expiring `state`. Answers an HTML page, not JSON — it is a browser
        destination, not a client endpoint, and no client should call it.

        Absent, forged, expired and already-used states get one sentence
        between them, because distinguishing them would teach a forger which
        part failed.
      security: []
      parameters:
        - { name: state, in: query, schema: { type: string } }
        - { name: code, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        '200':
          description: The result page — granted, or Google's own refusal.
          content:
            text/html:
              schema: { type: string }
        '400':
          description: No state this server is waiting for, or no authorization code.
          content:
            text/html:
              schema: { type: string }

  /api/connections:
    get:
      tags: [Connections]
      summary: The tenant's source and target connections
      description: |
        Connection rows have existed since the baseline but were never shown:
        creating a mapping silently inserts two and that was the last anyone
        heard of them. This lists what exists, what each is for, and how many
        mailboxes depend on it. Secrets never come back out — names, kinds and
        states only.
      responses:
        '200':
          description: The connections.
          content:
            application/json:
              schema:
                type: object
                properties:
                  connections:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        role: { type: string, enum: [source, target] }
                        kind: { type: string }
                        displayName: { type: string }
                        status: { type: string, enum: [connected, error, revoked] }
                        createdAt: { type: string, format: date-time }
                        usedByMailboxes:
                          type: integer
                          description: How many mailboxes depend on this connection.
                        updatedAt: { type: string, format: date-time }
                        qualification:
                          type: object
                          nullable: true
                          description: |
                            What the LAST test measured this account can carry
                            (workplan 0106 T2) — per domain, three states.
                            Absent/null = never qualified, which is absence of
                            measurement, never "no".
                          properties:
                            domains:
                              type: object
                              properties:
                                mail: { $ref: '#/components/schemas/QualifiedDomain' }
                                calendar: { $ref: '#/components/schemas/QualifiedDomain' }
                                contact: { $ref: '#/components/schemas/QualifiedDomain' }
                                file: { $ref: '#/components/schemas/QualifiedDomain' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Connections]
      summary: Add a connection on its own, without creating a mapping
      description: |
        Which fields a provider needs comes from the shared credential
        descriptor, so a form and this route cannot disagree about them; the
        stored config and encrypted credential record are built by the same
        functions the create-mapping route uses, so what is saved here is what
        a sync pass reads. Probed before it is stored, and stored either way
        with the outcome on `status` — a credential that does not work yet is
        worth keeping (somebody is mid-setup) but must not look healthy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, type, displayName, values]
              properties:
                role: { type: string, enum: [source, target] }
                type:
                  type: string
                  description: A wizard source or target type, e.g. box or webdav.
                displayName: { type: string }
                values:
                  type: object
                  additionalProperties: { type: string }
                  description: Field key to what the person typed. Secrets included; never echoed back.
      responses:
        '201':
          description: Created, with what the probe found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  ok: { type: boolean }
                  detail: { type: string }
                  reason: { type: string }
        '400': { description: Unknown type, a missing required field, or a value the schema refuses. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/connections/{id}:
    delete:
      tags: [Connections]
      summary: Delete a connection nothing depends on
      description: |
        REFUSES while any mailbox uses it, naming which migrations. That
        refusal is the feature: `mailbox.connection_id` cascades on delete and
        `item` hangs off the mailboxes, so deleting a connection in use would
        not fail loudly — it would take the mailboxes and the whole migration
        ledger with it, and the next pass would re-copy everything as though it
        had never run.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No such connection for this tenant. }
        '409':
          description: Still in use; the reason names how many and which migrations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/connections/{id}/credentials:
    put:
      tags: [Connections]
      summary: Replace a connection's credentials in place
      description: |
        Credentials expire — a rotated Box secret, a revoked Google refresh
        token — and without this the only repair was a new connection and a new
        mapping, abandoning the ledger history that made the old one useful.
        The row keeps its id, so every mapping pointing at it keeps working.
        The new credentials are PROBED BEFORE they replace the old ones, and a
        failure leaves the old ones in place (`rotated: false`): turning a
        working connection into a broken one because somebody pasted the wrong
        value is worse than refusing. The stored config is deliberately not
        touched — rotation replaces a secret, not where a migration is rooted.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                values:
                  type: object
                  additionalProperties: { type: string }
      responses:
        '200':
          description: What the probe found, and whether the credentials were replaced.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  detail: { type: string }
                  reason: { type: string }
                  rotated:
                    type: boolean
                    description: False when the probe failed and the old credentials were kept.
        '400': { description: A missing required field, or a value the schema refuses. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No such connection for this tenant. }
  /api/connections/{id}/test:
    post:
      tags: [Connections]
      summary: Probe a stored connection now
      description: |
        Runs the same read-only probe the wizard's Test connections button
        uses, through the builders a sync pass would use, against the stored
        credentials — so a credential that has expired says so here instead of
        in a failing pass. The provider's refusal comes back verbatim, and the
        outcome is recorded on the connection's status.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: What the provider answered. A refusal is an answer, not an error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  detail: { type: string }
                  reason: { type: string }
                  scheduling:
                    type: object
                    description: |
                      DAV targets only (workplan 0105 T0): what this target
                      will DO with the calendar objects a migration writes —
                      measured by one OPTIONS request at test time, never
                      assumed. `sentence` is the English fallback; the UI
                      renders `capability` in the reader's language.
                    properties:
                      capability: { type: string, enum: [auto-schedule, none, unknown] }
                      sentence: { type: string }
                  qualification:
                    type: object
                    description: |
                      Basic-auth account kinds only (workplan 0106 T0): what
                      the account CAN CARRY, per domain, measured at this
                      test and remembered on the connection. Three states —
                      `yes` and `no` both required an answer; `unknown` is
                      unmeasured, which is never the same as either.
                    properties:
                      domains:
                        type: object
                        properties:
                          mail: { $ref: '#/components/schemas/QualifiedDomain' }
                          calendar: { $ref: '#/components/schemas/QualifiedDomain' }
                          contact: { $ref: '#/components/schemas/QualifiedDomain' }
                          file: { $ref: '#/components/schemas/QualifiedDomain' }
                      scheduling:
                        type: object
                        properties:
                          capability: { type: string, enum: [auto-schedule, none, unknown] }
                          sentence: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No such connection for this tenant. }
  /api/setup/{side}/{provider}:
    get:
      tags: [Setup]
      summary: The provider setup checklist and where it has got to
      description: |
        What a person must do IN THE PROVIDER before a migration can read
        anything — create an app, grant scopes, get an administrator to
        authorise it, obtain a token. Steps are defined in code and keyed by
        `key`; state lives per tenant. A step nobody has answered has no stored
        row and reads as `open`, so a step added in a later release is open for
        everyone with no backfill.
      parameters:
        - { name: side, in: path, required: true, schema: { type: string, enum: [source, target] } }
        - { name: provider, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The steps, their state, and the progress summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupChecklist' }
        '400': { description: 'The path was not /api/setup/{source|target}/{provider}.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/setup/{side}/{provider}/{stepKey}:
    put:
      tags: [Setup]
      summary: Record what a person decided about one setup step
      description: |
        `done` and `skipped` are settled states and record who decided and
        when; setting a step back to `open` clears that, because an open step
        is by definition one nobody has answered. Answers the whole refreshed
        checklist, so the caller never has to re-read it.
      parameters:
        - { name: side, in: path, required: true, schema: { type: string, enum: [source, target] } }
        - { name: provider, in: path, required: true, schema: { type: string } }
        - { name: stepKey, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: { type: string, enum: [open, done, skipped] }
      responses:
        '200':
          description: The refreshed checklist.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupChecklist' }
        '400': { description: 'The body was not a { state } object.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: That step does not belong to this provider and side. }
  /api/migrations/test-connection:
    post:
      tags: [Migrations]
      summary: Prove a connection before creating anything
      description: |
        Runs a READ-ONLY probe with the credentials as typed — one side per
        call — built exactly the way a sync pass would build the connector, so
        a passed test cannot diverge from what create would store. A provider
        refusal ("wrong password", "invalid scope") is an ANSWER, returned as
        `{ok:false, reason}` with the provider's words verbatim, not an error
        status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [side]
              properties:
                side: { type: string, enum: [source, target] }
                sourceType: { type: string }
                sourceConfig: { type: object }
                targetType: { type: string }
                targetConfig: { type: object }
      responses:
        '200':
          description: The probe's outcome, pass or refusal.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  detail: { type: string }
                  reason: { type: string }
        '400': { description: The body named neither side's shapes. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/migrations:
    get:
      tags: [Migrations]
      summary: List migrations
      description: |
        `lastSyncAt` is the newest domain completion for the mapping, or absent
        when no domain has completed yet — absent means "never", not "today".
      responses:
        '200':
          description: The tenant's migrations.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mappings:
                    type: array
                    items: { $ref: '#/components/schemas/Mapping' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Migrations]
      summary: Create a migration
      description: |
        Stores the source and target connections with their credentials
        encrypted at rest, and the domains to carry. Incoherent
        target/domain combinations and an unparseable schedule are refused at
        create with the same words the wizard shows, rather than accepted and
        failed later by a job nobody is watching.

        A created migration starts `paused`: it does not sync until the owner
        reviews the discovery counts and green-lights it via `/start`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMappingRequest' }
      responses:
        '201':
          description: The created migration, credentials masked.
          content:
            application/json:
              schema: { type: object }
        '400':
          description: Refused, naming what is incoherent or missing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/migrations/{mappingId}:
    parameters:
      - $ref: '#/components/parameters/MappingId'
    get:
      tags: [Migrations]
      summary: Get one migration
      description: The stored config with the password masked — never the real secret.
      responses:
        '200':
          description: The migration.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Migrations]
      summary: Update a migration
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: The updated migration.
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Migrations]
      summary: Delete a migration
      description: |
        Destroys config and ledger linkage. The UI arms this by making the
        operator type the migration's own name; the API itself does not
        second-guess a deliberate call.
      responses:
        '200': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/migrations/{mappingId}/start:
    parameters:
      - $ref: '#/components/parameters/MappingId'
    post:
      tags: [Migrations]
      summary: Green-light a paused migration
      description: The owner's go-ahead after reviewing discovery. Until this, syncs are refused with `409`.
      responses:
        '200':
          description: Started.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/migrations/{mappingId}/sync:
    parameters:
      - $ref: '#/components/parameters/MappingId'
    post:
      tags: [Migrations]
      summary: Run a pass now
      description: |
        Enqueues a pass and returns immediately. Without a `domains` list the
        job runs the domains the owner selected for this migration — never all
        four by default, because no selection means "not selected", not
        "everything".

        A paused migration is refused with `409` naming `/start`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum: [full, delta]
                  description: A full pass ignores cursors and rescans everything.
                forceFullScan: { type: boolean }
      responses:
        '202':
          description: Enqueued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnqueuedRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The migration is paused — review discovery and start it first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/migrations/{mappingId}/cutover:
    parameters:
      - $ref: '#/components/parameters/MappingId'
    post:
      tags: [Migrations]
      summary: Prepare a cutover
      description: |
        Prepares and verifies, then stops at `READY_FOR_CUTOVER`. It does not
        execute a cutover: moving mail delivery is an MX/DNS change outside
        this product, and the one step nobody here can perform for you.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                skipFinalSync: { type: boolean }
                skipVerification: { type: boolean }
      responses:
        '202':
          description: Enqueued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnqueuedRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/migrations/{mappingId}/runs:
    parameters:
      - $ref: '#/components/parameters/MappingId'
    get:
      tags: [Migrations]
      summary: Run history
      description: |
        Newest first, with the per-domain events of each pass. A run whose
        domains were narrower than the migration's selection says so in its
        events rather than leaving the absence unexplained.
      responses:
        '200':
          description: Recent runs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs:
                    type: array
                    items: { $ref: '#/components/schemas/Run' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/migrations/{mappingId}/discover:
    parameters:
      - $ref: '#/components/parameters/MappingId'
    post:
      tags: [Discovery]
      summary: Count what the source holds
      responses:
        '202':
          description: Enqueued.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/migrations/{mappingId}/discovery:
    parameters:
      - $ref: '#/components/parameters/MappingId'
    get:
      tags: [Discovery]
      summary: The discovery counts
      description: |
        Per domain: collections, items and bytes, each stamped with when it was
        measured. A domain that could not be read reports that, with the reason.
      responses:
        '200':
          description: The counts.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/migrations/{mappingId}/links:
    parameters:
      - $ref: '#/components/parameters/MappingId'
    post:
      tags: [Grant links]
      summary: Issue a grant link, and see it once
      description: |
        Mints a mapping-scoped bearer link so the person being migrated can
        grant access to their own account without an Ownpace account, a
        password or a session. The `url` in this response is the ONLY time it
        exists: the table holds a hash, so nothing can show it again. A lost
        link is re-issued, not recovered.

        **You distribute it.** Ownpace sends no email and stores no address for
        the recipient — the person who decides who gets access is the person
        who already knows who they are.

        `expiryDays` is your choice of 1, 7 or 30, defaulting to 7. Expiry
        bounds when the flow may BEGIN; revocation stops everything, including
        a consent already in flight.

        Refuses before writing anything when the link could not succeed: no
        source connection, a source that is not one of the four Google kinds,
        a source with no client id or secret stored, or a deployment with no
        `WEB_URL` to build the address from. Each refusal names what to
        configure — the alternative is an error landing on the one person who
        cannot fix it.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expiryDays: { type: integer, enum: [1, 7, 30], default: 7 }
      responses:
        '201':
          description: The link, said once.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  url: { type: string }
                  expiresAt: { type: string, format: date-time }
                  expiryDays: { type: integer }
                  distribution: { type: string }
        '400': { description: '`expiryDays` was not one of the offered values.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            Well-formed and permitted, but this migration or deployment cannot
            support a grant link yet. `error` is one of `no_source_connection`,
            `source_not_google`, `client_not_configured` or `web_url_unset`;
            `reason` names the remedy. Nothing was written.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  reason: { type: string }
    get:
      tags: [Grant links]
      summary: The links that exist, and their state
      description: |
        State and dates, never a URL and never a secret — the table holds only
        a hash, so this could not show one if it wanted to. `state` is one of
        `live`, `used`, `revoked` or `expired`, and `expired` is reported only
        for a link that was never used: one that expired UNUSED means somebody
        was asked and never managed to answer, which is the case worth acting
        on.
      responses:
        '200':
          description: Every link for this migration, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  links:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        purpose: { type: string, enum: [grant, view] }
                        state: { type: string, enum: [live, used, revoked, expired] }
                        createdAt: { type: string, format: date-time }
                        createdBy: { type: string }
                        expiresAt: { type: string, format: date-time }
                        usedAt: { type: string, format: date-time, nullable: true }
                        revokedAt: { type: string, format: date-time, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/migrations/{mappingId}/links/{linkId}:
    parameters:
      - $ref: '#/components/parameters/MappingId'
      - { name: linkId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Grant links]
      summary: Revoke a link
      description: |
        The owner's kill switch, and idempotent: revoking an already-revoked
        link answers 200 with `revoked: false`, because pressing twice means
        the same thing both times and an error would suggest the door is
        somehow still open.

        Revocation is re-checked at the moment a grant would be stored, so it
        also stops a consent that was already in flight.
      responses:
        '200':
          description: Revoked now (`true`), or already revoked (`false`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/grant/{link}:
    parameters:
      - name: link
        in: path
        required: true
        description: The whole credential — `<id>.<secret>`, one path segment.
        schema: { type: string }
    get:
      tags: [Grant links]
      summary: What the person holding this link needs to decide
      description: |
        Answers to a LINK, not to a session — there is no bearer token here and
        the caller has no Ownpace account, by design (ADR-0035: owners sign in,
        migrated people get links).

        Says who is asking (the organisation's name), what will be read in
        plain words, the exact scope Google will record, and when the link
        stops working. It says nothing else: not the mapping id, not the tenant
        id, not the owner's email, not the client id, nothing about any other
        migration.

        Changes nothing, deliberately. Chat applications fetch URLs to draw
        previews, and a link is spent at the GRANT rather than at the open, so
        a preview cannot burn it.
      security: []
      responses:
        '200':
          description: Enough to decide with.
          content:
            application/json:
              schema:
                type: object
                properties:
                  organisation: { type: string }
                  reads: { type: string }
                  scope: { type: string }
                  expiresAt: { type: string, format: date-time }
        '401':
          description: |
            One sentence for every way a link can fail — unknown, forged,
            expired, revoked, already used, wrong purpose, malformed. The
            difference is deliberately not reported: the reader cannot act on
            it, and naming it would tell a forger which part failed.
        '409':
          description: |
            The link is good but the migration cannot be connected — it no
            longer exists, its source is not a Google account, or its Google
            application is not configured. The sentence is written to be
            forwarded to whoever sent the link.
        '503':
          description: The link could not be checked just now. Ours, not the caller's.

  /api/grant/{link}/google/authorize:
    parameters:
      - name: link
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Grant links]
      summary: Start the Google sign-in for this link
      description: |
        The client id and secret are read from the mapping's own source
        connection and decrypted server-side. Unlike the owner's
        `/api/migrations/google/authorize`, they are NOT accepted from the
        request body: the link holder is not the person who configured them and
        must never hold them.

        Answers a URL for the browser to follow rather than redirecting, so a
        refusal can be shown as words instead of as a Google error page.

        The consent ends at the same callback the owner's flow uses. Which
        ending runs is decided by the server's own pending state, never by
        anything in the redirect — and in this one the refresh token is stored
        against the mapping and shown to nobody.
      security: []
      responses:
        '200':
          description: Where to send the browser.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
        '401': { description: The link was refused — see GET above. }
        '409':
          description: |
            The migration cannot be connected, or this deployment's callback
            address is a raw IP, which Google will not accept as a redirect URI.
        '503': { description: The link could not be checked just now. }

  /api/migrations/{mappingId}/deletions:
    parameters:
      - $ref: '#/components/parameters/MappingId'
    get:
      tags: [Operating]
      summary: Items the source no longer has
      description: |
        Watched, not acted on. An item appears here when the source stopped
        reporting it; nothing is deleted on the target until a person applies
        it, and then only with evidence.
      responses:
        '200':
          description: The deletion queue.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/migrations/{mappingId}/deletions/{hash}/keep:
    parameters:
      - $ref: '#/components/parameters/MappingId'
      - $ref: '#/components/parameters/Hash'
    post:
      tags: [Operating]
      summary: Keep this item on the target
      description: Decides the queue entry the safe way — the copy stays, and it stops being watched.
      responses:
        '200':
          description: Kept.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/migrations/{mappingId}/deletions/{hash}/apply:
    parameters:
      - $ref: '#/components/parameters/MappingId'
      - $ref: '#/components/parameters/Hash'
    post:
      tags: [Operating]
      summary: Delete this item on the target
      description: |
        The one destructive endpoint, and it refuses more often than it acts.
        All of the following must hold, and the refusal names which one did
        not: the migration allows applying deletions, the item carries recorded
        deletion evidence, and the bytes are ours — an item that was already on
        the target when we arrived (`adopted`) is refused as `not_ours`,
        because deleting what we never copied is not this product's business.

        Enqueues; poll `/receipt` for the outcome. `refused` is a legitimate
        terminal state, not a failure.
      responses:
        '202':
          description: Enqueued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  queued: { type: boolean }
                  receipt: { $ref: '#/components/schemas/DeletionReceipt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Refused, naming the gate that said no.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/migrations/{mappingId}/deletions/{hash}/receipt:
    parameters:
      - $ref: '#/components/parameters/MappingId'
      - $ref: '#/components/parameters/Hash'
    get:
      tags: [Operating]
      summary: What happened to an applied deletion
      responses:
        '200':
          description: The receipt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionReceipt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/migrations/{mappingId}/apply-deletions:
    parameters:
      - $ref: '#/components/parameters/MappingId'
    get:
      tags: [Operating]
      summary: Whether this migration may apply deletions at all
      responses:
        '200':
          description: The flag and where it is set.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Operating]
      summary: Turn applying deletions on or off
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                allowApplyDeletions: { type: boolean }
      responses:
        '200':
          description: The stored flag.
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/migrations/{mappingId}/sharing:
    get:
      tags: [Migrations]
      summary: The sharing checklist
      description: |
        Every grant the §14.2 inventory discovered for this migration, held as
        checklist rows (ADR-0032): `open` rows wait on the owner; settled rows
        (`applied` / `done_manual` / `skipped`) keep who decided and when. The
        summary is the progress line. Decisions survive rescans.
      parameters:
        - { name: mappingId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The rows and the progress summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  migrationStatus: { type: string }
                  summary:
                    type: object
                    properties:
                      total: { type: integer }
                      open: { type: integer }
                      applied: { type: integer }
                      doneManual: { type: integer }
                      skipped: { type: integer }
                      openManual: { type: integer }
                  grants:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        subject: { type: string }
                        onLabel: { type: string }
                        grantee: { type: string }
                        role: { type: string }
                        viaLink: { type: boolean }
                        raw: { type: string }
                        verdict: { type: string, enum: [clean, manual] }
                        verdictTarget: { type: string }
                        state: { type: string, enum: [open, applied, done_manual, skipped] }
                        stateReason: { type: string }
                        decidedBy: { type: string }
                        decidedAt: { type: string }
                        scannedAt: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Unknown mapping. }
  /api/migrations/{mappingId}/sharing/announce:
    post:
      tags: [Migrations]
      summary: Mail the fallback announcement for by-hand shares
      description: |
        The announcement the platform cannot make (workplan 0104 T3). One
        press mails a Template-6 digest to each grantee of a `done_manual`
        row — the shares somebody carried over by hand, where no target API
        ever notified anybody. The note is REQUIRED: the "where" comes from
        the person who did the carrying. Rows the one-go press applied need
        nothing here (the platform already spoke); rows without an address
        (links) are counted, never silently dropped. A prior press makes the
        next one an explicit resend (`confirmResend: true`), never a silent
        duplicate. Per grantee: their items only.
      parameters:
        - { name: mappingId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string, maxLength: 1000, description: Where things live now, in the presser's own words — carried in the mail body. }
                locale: { type: string, enum: [en, nl] }
                confirmResend: { type: boolean, description: Required true when an announcement was already sent for this migration. }
      responses:
        '200':
          description: Who was told, who could not be.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  pressedBy: { type: string }
                  sent: { type: array, items: { type: string } }
                  failed: { type: array, items: { type: string } }
                  platformAnnounced: { type: integer }
                  withoutAddress: { type: integer }
                  resend: { type: boolean }
        '400': { description: The note is missing — the announcement must say where. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Unknown mapping. }
        '409': { description: Not cut over, no mail channel, or already announced without confirmResend. }
  /api/migrations/{mappingId}/sharing/apply-all:
    post:
      tags: [Migrations]
      summary: Apply every open, clean sharing row in one recorded press
      description: |
        The one-go press (workplan 0104 T1): every open row with a clean
        verdict and an addressable grantee is applied through the target's
        share API, in one recorded human action, at or after cutover — and
        because creating a share is what makes the target notify its grantee,
        this press is the chosen announcement moment: one wave of
        platform-native mail, sent by the target, not by this product. The
        optional `note` rides inside the platform's own notification. Link
        shares and manual verdicts stay on the checklist untouched (they are
        the fallback digest's audience). A refusal on one row never stops the
        next; refused rows stay open with the target's words, and a second
        press retries exactly those.
      parameters:
        - { name: mappingId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 500, description: The owner's context, carried inside the platform's own notification where the API supports it. }
      responses:
        '200':
          description: What the press did, row by row.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  pressedBy: { type: string }
                  applied: { type: array, items: { type: object } }
                  refused:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        on: { type: string }
                        grantee: { type: string }
                        code: { type: string }
                        reason: { type: string }
                  leftForChecklist:
                    type: object
                    properties:
                      links: { type: integer }
                      manual: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Unknown mapping. }
        '409': { description: Not cut over yet — the press refuses with the reason. }
  /api/migrations/{mappingId}/sharing/rescan:
    post:
      tags: [Migrations]
      summary: Refresh the sharing checklist from the inventory scans
      description: |
        Runs the same scans the permission report composes and upserts the
        queue's rows. A known row only refreshes its scan time — an owner's
        decision is never reset to open by looking again. What could not be
        read comes back as `blindSpots`, verbatim.
      parameters:
        - { name: mappingId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: How many rows now wait, and what could not be read.
          content:
            application/json:
              schema:
                type: object
                properties:
                  open: { type: integer }
                  blindSpots: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Unknown mapping. }
        '409': { description: The mapping records no mailbox to inventory. }
  /api/migrations/{mappingId}/sharing/{grantId}/decision:
    post:
      tags: [Migrations]
      summary: Settle one sharing-checklist row
      description: |
        `apply` re-creates the grant on the target through its own share API —
        the target then notifies the grantee itself (the invite IS the
        notification, ADR-0032 §4) — and is gated: only after the migration is
        finished, only clean verdicts, never link shares, and only on a target
        with a share API. `done` ticks the row off as handled by hand; `skip`
        records that it deliberately does not carry over. Every refusal is an
        answer with the reason verbatim; every settled row keeps who and when.
      parameters:
        - { name: mappingId, in: path, required: true, schema: { type: string } }
        - { name: grantId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [apply, done, skip] }
                reason: { type: string }
                grantee: { type: string, description: Overrides the grant's address on apply (the owner-confirmed target identity). }
      responses:
        '200':
          description: The settled row.
        '400': { description: Unknown action. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Unknown mapping or row. }
        '409': { description: The refusal, with its reason verbatim. }
  /api/migrations/{mappingId}/completion-report:
    get:
      tags: [Migrations]
      summary: The migration completion report
      description: |
        One document saying what moved, what is waiting on a decision, and
        what was removed on whose decision — assembled by the shared builder
        both editions serve, from data every screen already shows. `markdown`
        is the deliverable an owner downloads and hands over; `report` is the
        same content as data.
      parameters:
        - { name: mappingId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The report and its Markdown rendering.
          content:
            application/json:
              schema:
                type: object
                properties:
                  report: { type: object }
                  markdown: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Unknown mapping. }
  /api/migrations/{mappingId}/moves:
    parameters:
      - $ref: '#/components/parameters/MappingId'
    get:
      tags: [Operating]
      summary: Items someone moved on the source
      responses:
        '200':
          description: The move queue.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/migrations/{mappingId}/moves/{hash}/keep:
    parameters:
      - $ref: '#/components/parameters/MappingId'
      - $ref: '#/components/parameters/Hash'
    post:
      tags: [Operating]
      summary: Leave the target copy where it is
      responses:
        '200':
          description: Kept.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/migrations/{mappingId}/moves/{hash}/apply:
    parameters:
      - $ref: '#/components/parameters/MappingId'
      - $ref: '#/components/parameters/Hash'
    post:
      tags: [Operating]
      summary: Remove the target's OLD copy of a relocated item
      description: |
        The second destructive endpoint (ADR-0030), admissible only for a
        RELOCATION — a file whose move or rename changed its path-shaped
        natural key, so the same bytes are already on the target under the new
        one. An ordinary move (mail, calendar) is refused as `not_relocated`,
        and a move the owner already answered with keep as `already_kept`.
        Shares the migration's apply-deletions switch: it is the same
        capability.

        Enqueues; poll the moves `/receipt` for the outcome — the relocation's
        OWN receipt, since the same item can have a deletion receipt open at
        the same time. The worker re-runs every gate and asks the target
        whether the relocated copy is really there before removing anything.
      responses:
        '202':
          description: Enqueued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  queued: { type: boolean }
                  receipt: { $ref: '#/components/schemas/DeletionReceipt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Refused, naming the gate that said no.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/migrations/{mappingId}/moves/{hash}/receipt:
    parameters:
      - $ref: '#/components/parameters/MappingId'
      - $ref: '#/components/parameters/Hash'
    get:
      tags: [Operating]
      summary: What happened to an applied relocation
      responses:
        '200':
          description: The receipt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionReceipt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/migrations/{mappingId}/failures:
    parameters:
      - $ref: '#/components/parameters/MappingId'
    get:
      tags: [Operating]
      summary: Items that would not migrate
      description: Each carries the reason verbatim from the server that refused it.
      responses:
        '200':
          description: The failure queue.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/migrations/{mappingId}/failures/{hash}/{action}:
    parameters:
      - $ref: '#/components/parameters/MappingId'
      - $ref: '#/components/parameters/Hash'
      - name: action
        in: path
        required: true
        description: |
          `retry` queues the item again. `accept` records that this item is not
          coming across — a decision, kept, so the finish checklist can count
          it instead of pretending the queue is empty.
        schema:
          type: string
          enum: [retry, accept]
    post:
      tags: [Operating]
      summary: Retry or accept a failed item
      responses:
        '200':
          description: Recorded.
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/migrations/{mappingId}/verify/start:
    parameters:
      - $ref: '#/components/parameters/MappingId'
    post:
      tags: [Operating]
      summary: Start a verification scan
      description: |
        Reads the destination and compares it with the ledger. Enqueues; poll
        `/verify/report`. A domain that was not enabled is reported `SKIPPED`
        with the reason, never as a pass.
      responses:
        '202':
          description: Enqueued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  started: { type: boolean }
                  report: { $ref: '#/components/schemas/VerificationRunReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502':
          description: The scan could not be enqueued; the run row is landed as failed with the reason.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/migrations/{mappingId}/verify/report:
    parameters:
      - $ref: '#/components/parameters/MappingId'
    get:
      tags: [Operating]
      summary: The latest verification report
      description: Reads the latest run row and triggers nothing — polling this is free.
      responses:
        '200':
          description: The report.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationRunReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/migrations/{mappingId}/finish:
    parameters:
      - $ref: '#/components/parameters/MappingId'
    post:
      tags: [Operating]
      summary: Finish a migration
      description: |
        Stops watching the source. Adds and removes nothing on either system —
        what is on the destination stays exactly as it is.

        Refused while the queues still hold undecided items unless the caller
        says explicitly to finish anyway, because finishing with items
        outstanding leaves them behind silently.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  description: Finish despite outstanding decisions, leaving them behind.
      responses:
        '200':
          description: Finished.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Refused — decisions are still outstanding.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/decisions:
    get:
      tags: [Decisions]
      summary: Drift decisions awaiting an answer
      responses:
        '200':
          description: The decision queue.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/decisions/{decisionId}/resolve:
    parameters:
      - $ref: '#/components/parameters/DecisionId'
    post:
      tags: [Decisions]
      summary: Answer a decision
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: Resolved.
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/decisions/{decisionId}/dismiss:
    parameters:
      - $ref: '#/components/parameters/DecisionId'
    post:
      tags: [Decisions]
      summary: Set a decision aside
      description: |
        Set aside, not rejected. The distinction is kept because "I am not
        acting on this" and "this change was refused" are different claims
        about what happened.
      responses:
        '200':
          description: Dismissed.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/decisions/presets:
    get:
      tags: [Decisions]
      summary: The standing answers
      description: |
        Per category, the answer applied automatically so the same question is
        not asked twice. A decision resolved this way says so, rather than
        appearing to have been considered by a person.
      responses:
        '200':
          description: The presets.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/decisions/presets/{category}:
    parameters:
      - name: category
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [Decisions]
      summary: Set the standing answer for one category
      description: Owner/admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/scope-manifest:
    get:
      tags: [Discovery]
      summary: What this product carries, and what it does not
      description: |
        The per-domain manifest the confirm screen renders: what migrates, what
        does not, and what is transformed on the way. Static truth about the
        product, not about one tenant's data.
      responses:
        '200':
          description: The manifest.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/shared-addresses:
    get:
      tags: [Discovery]
      summary: Shared mailboxes and distribution lists found on the source
      description: |
        Classified per §14.1 — a shared mailbox is a store to copy, a
        distribution list is a definition to recreate. An address the directory
        did not classify is reported unclassified rather than guessed.
      responses:
        '200':
          description: The discovered shared addresses.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/shared-addresses/runbook:
    get:
      tags: [Discovery]
      summary: The shared-address runbook, as Markdown
      description: A document to work through on the destination, not a status page.
      responses:
        '200':
          description: Markdown.
          content:
            text/markdown:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/permissions/report:
    get:
      tags: [Discovery]
      summary: The permission runbook, as Markdown
      description: |
        Who could see whose calendar, who had access to which shared files —
        rights that do not travel with the data and must be re-granted by hand
        on the destination.

        **Blind spots are printed above the findings**, deliberately: mailbox
        delegation (FullAccess, Send-As) is never in it because Graph does not
        expose it, and OneDrive/SharePoint sharing appears only if this
        deployment holds that permission. A section headed "could not be
        inventoried" placed under two pages of successes gets skipped, and it
        is the dangerous half.
      responses:
        '200':
          description: Markdown.
          content:
            text/markdown:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/billing/usage:
    get:
      tags: [Billing]
      summary: This period's usage and cost
      description: |
        Priced at **this tenant's agreed rates** — the snapshot pinned when the
        tenant was first billed, not the operator's current price list. An
        operator raising prices for new customers does not re-price an existing
        one.
      responses:
        '200':
          description: Usage and the cost it implies.
          content:
            application/json:
              schema:
                type: object
                properties:
                  usage: { $ref: '#/components/schemas/Usage' }
                  currentCost: { $ref: '#/components/schemas/Cost' }
                  period: { type: string, examples: ['2026-08'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/billing/usage/history:
    get:
      tags: [Billing]
      summary: Usage by period
      responses:
        '200':
          description: One entry per period, newest first.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/billing/estimate:
    post:
      tags: [Billing]
      summary: What projected usage would cost
      description: Estimated at this tenant's agreed rates, so the number matches the invoice they will get.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                storageUsedGB: { type: number }
                egressGB: { type: number }
                computeHours: { type: number }
                syncCount: { type: number }
      responses:
        '200':
          description: The estimate, in integer cents.
          content:
            application/json:
              schema:
                type: object
                properties:
                  estimate: { type: integer }
                  breakdown: { $ref: '#/components/schemas/Cost' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/billing/party:
    get:
      tags: [Billing]
      summary: Who invoices are addressed to
      description: |
        `party` is **null until the customer provides it** — a real state the
        billing page shows as an ask, never an error. Nothing can be invoiced
        correctly against a tenant without one (workplan 0111 T1).

        `vatConsultation` is the latest VIES answer **for the number as
        currently stored** (0111 T2): the log is append-only, so a number
        changed since its last check reads null — nothing has checked the
        number the next invoice would rely on. Always null for a consumer.

        `vatTreatment` (0111 T3) is what an invoice for this buyer would
        carry — a **treatment, never a rate** (the number belongs to the
        bookkeeping system). Null while no party is stored. An EU business
        without a valid VIES consultation reads `domestic_standard` on
        purpose: the conservative error, corrected by validating the number.
      responses:
        '200':
          description: The buyer's details, or null, with the consultation and treatment that speak for them.
          content:
            application/json:
              schema:
                type: object
                properties:
                  party:
                    oneOf:
                      - { $ref: '#/components/schemas/BillingParty' }
                      - { type: 'null' }
                  vatConsultation:
                    oneOf:
                      - { $ref: '#/components/schemas/VatConsultation' }
                      - { type: 'null' }
                  vatTreatment:
                    oneOf:
                      - { $ref: '#/components/schemas/VatTreatment' }
                      - { type: 'null' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Billing]
      summary: Provide or replace the buyer's details
      description: |
        Owner/admin. An **upsert keyed on the tenant**: sending the same body
        twice converges on the same row, and the whole statement is replaced
        each time — no separate create-vs-edit path, and a kind switch cannot
        strand a stale VAT number.

        **Consumer-shaped first**: `kind` defaults to `consumer`, and only a
        `business` may carry `vatNumber` (enforced by the database as well as
        by validation). The VAT number is stored as stated — whether it is
        real is a later VIES consultation, and the country is the customer's
        statement, not the place-of-supply decision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, addressLine1, postalCode, city, countryCode]
              properties:
                kind: { type: string, enum: [consumer, business], default: consumer }
                name: { type: string, maxLength: 200 }
                addressLine1: { type: string, maxLength: 200 }
                addressLine2: { type: string, maxLength: 200 }
                postalCode: { type: string, maxLength: 16 }
                city: { type: string, maxLength: 100 }
                countryCode:
                  type: string
                  description: ISO 3166-1 alpha-2; lowercase input is uppercased.
                  examples: [NL]
                vatNumber:
                  type: string
                  maxLength: 32
                  description: Business kind only — refused on a consumer.
      responses:
        '200':
          description: The stored details, as they now stand.
          content:
            application/json:
              schema:
                type: object
                properties:
                  party: { $ref: '#/components/schemas/BillingParty' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/billing/party/check-vat:
    post:
      tags: [Billing]
      summary: Ask VIES about the stored VAT number, and keep the answer
      description: |
        Owner/admin. Consults VIES about the business party's stored VAT
        number and **appends the answer to the consultation log** (workplan
        0111 T2) — an unvalidated number is not a defence; the consultation
        number this stores is.

        A 200 is an answer either way: `consultation.valid: false` is VIES
        saying no, stored exactly like a yes, because both are evidence.
        Re-checking is legitimate and appends.

        The check is **qualified** — it comes back with a consultation
        number — when the deployment identifies itself via
        `VIES_REQUESTER_MEMBER_STATE` + `VIES_REQUESTER_VAT_NUMBER` (set
        together, or not at all: half a pair answers 500 rather than
        silently downgrading). Without them the check still answers, with
        `consultationNumber: null` marking it unqualified.
      responses:
        '200':
          description: VIES answered; the stored consultation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  consultation: { $ref: '#/components/schemas/VatConsultation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            Nothing to ask, permanently: `error` is `nothing_to_check` (no
            business party with a VAT number stored — save the details
            first) or `vat_not_checkable` (VIES can never answer this one —
            a GB number, a malformed one; retrying changes nothing).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, enum: [nothing_to_check, vat_not_checkable] }
                  reason: { type: string }
        '503':
          description: |
            VIES could not answer **now** (its member-state backends are
            famously intermittent). Nothing was stored — "we could not ask"
            is not an answer — so ask again later.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, enum: [vies_unavailable] }
                  reason: { type: string }

  /api/billing/invoices:
    get:
      tags: [Billing]
      summary: List invoices
      responses:
        '200':
          description: The tenant's invoices.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/billing/invoices/generate:
    post:
      tags: [Billing]
      summary: Refuses — the pricing model this billed was retired
      description: |
        **This route currently refuses, deliberately, and mints nothing.**

        ADR-0014 was amended on 2026-08-20 from metered resources to five tiers
        on two axes. The invoice code still meters bytes and hours from the
        retired model — and would count every byte twice, once as storage and
        once as egress, and charge for items that moved nothing. Issuing that
        would be a bill for something Ownpace does not sell.

        Refusing is cheaper than fixing arithmetic on code the tier work
        replaces, and it cannot mislead. The guard is removed when the invoice
        can say a tier and its evidence.

        Nothing else in billing is affected: usage, invoice listing, the
        payment-method routes and the webhook all behave normally. The refusal
        touches no database, so a refused call leaves not even a draft.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                period: { type: string, pattern: '^\d{4}-\d{2}$', examples: ['2026-08'] }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            Always, for any well-formed request. `error` is
            `billing_model_retired`; `reason` is one sentence naming what would
            have been billed and what to do instead.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, enum: [billing_model_retired] }
                  reason: { type: string }

  /api/billing/invoices/{invoiceId}:
    parameters:
      - name: invoiceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Billing]
      summary: Get one invoice
      responses:
        '200':
          description: The invoice.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/billing/invoices/{invoiceId}/pay:
    parameters:
      - name: invoiceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Billing]
      summary: Start a payment
      description: Owner/admin. Returns the provider's checkout URL to send the payer to.
      responses:
        '200':
          description: The payment, with a checkout URL.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/billing/payment-methods:
    get:
      tags: [Billing]
      summary: List payment methods
      responses:
        '200':
          description: The tenant's payment methods.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Billing]
      summary: Add a payment method
      description: Owner/admin.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '201':
          description: The stored method.
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/billing/payment-methods/{paymentMethodId}/default:
    parameters:
      - name: paymentMethodId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Billing]
      summary: Make this the default payment method
      description: Owner/admin.
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/billing/webhooks/mollie:
    post:
      tags: [Webhooks]
      summary: Payment status changed
      description: |
        Called by Mollie, not by clients. The body carries only a payment id;
        the status is then fetched from the provider rather than trusted from
        the request, because anyone can post here.

        `application/x-www-form-urlencoded`, which is what the provider sends.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                id: { type: string, description: The provider's payment id. }
      responses:
        '200': { description: Acknowledged. }

  /api/billing/webhooks/mollie/test:
    get:
      tags: [Webhooks]
      summary: Webhook reachability check
      description: Confirms this deployment's webhook URL is reachable from outside. Returns no tenant data.
      security: []
      responses:
        '200':
          description: Reachable.
          content:
            application/json:
              schema: { type: object }

  /api/support/tenants:
    get:
      tags: [Support]
      summary: Every organisation, as an operator sees them
      description: |
        Name, when they joined, how many migrations, and how many domains are
        currently failing. Nothing else — no settings, no addresses, no counts
        of what is inside anybody's mailbox.

        Authorisation is NOT performed here. The operation authenticates a
        subject and reads a view whose own predicate is "this subject is a
        platform operator"; to anybody else the view is empty, so a
        non-operator gets `200` with an empty list rather than a `403`. That is
        deliberate: the check lives in one place, in the database, and cannot
        be simplified away in application code.

        Every serving is recorded in the support read log — one row for the
        list, with no organisation named, because looking at the list is one
        decision rather than one per customer. A non-operator's request records
        nothing, by the same predicate.
      responses:
        '200':
          description: |
            The organisations this caller may see. Empty for anybody who is not
            a platform operator.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenants:
                    type: array
                    items: { $ref: '#/components/schemas/SupportTenant' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/support/people:
    get:
      tags: [support]
      summary: Find a person across every organisation
      description: |
        The question an operator starts from: somebody made contact, who are
        they and what are they on. The per-organisation list (0018) answers only
        "who is in THIS organisation", which needs the organisation guessed
        first.

        This is the widest read the support surface performs — not one customer,
        all of them — so it is recorded with WHAT was searched for and HOW MANY
        came back (migration 0019). "An operator ran a search" cannot tell
        somebody answering one email from somebody enumerating the customer
        base; those two facts can. The log is readable only by the operator who
        wrote it.

        Joins `support_tenant_members` and `support_tenants`, both behind the
        same `platform_operator` predicate — a non-operator sees an empty list
        because to the database those rows are invisible.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2 }
          description: |
            Part of an email address. At least two characters: a shorter one
            matches everybody, and every customer's people is not an answer to
            a blank box.
      responses:
        '200':
          description: Matching people, capped.
          content:
            application/json:
              schema:
                type: object
                properties:
                  people:
                    type: array
                    items: { $ref: '#/components/schemas/SupportPerson' }
                  limit:
                    type: integer
                    description: |
                      A cap, not a page. A support answer is one person; hitting
                      the ceiling means the question was wrong rather than that
                      there is more to fetch.
        '400':
          description: Fewer than two characters.
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/support/people/{tenantId}/{userId}/opened:
    post:
      tags: [support]
      summary: Record that an operator opened an account at the identity provider
      description: |
        The click leaves Ownpace — account-level work is the issuer's and never
        ours (ADR-0042) — so this is the last thing that can honestly be
        recorded about it. The owner asked for both halves logged: the search,
        and the opening of a result.

        Verifies the pair before writing. Not to authorise anything (the log's
        INSERT is already gated on being an operator) but because a row naming a
        tenant and a subject that were never related is a false entry in the one
        record standing in for the consent that was dropped.
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: userId
          in: path
          required: true
          schema: { type: string }
          description: The identity provider's subject.
      responses:
        '204':
          description: Recorded. Nothing to return, and the screen does not wait on it.
        '400':
          description: The tenantId is not a uuid, or the subject is empty.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: |
            No such membership — or none this caller may see. The same answer
            for both, like every route on this surface.
  /api/support/tenants/{tenantId}:
    parameters:
      - name: tenantId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Support]
      summary: One organisation — its connections, migrations and invoices
      description: |
        Connection `kind`, display name and status; never `config` (hosts and
        paths somebody typed) and never `secret_ref`. Migrations by name and
        lifecycle. Invoices by period, status and total.

        An organisation that does not exist and one this caller may not see are
        the same answer — `404` either way — so that a signed-in non-operator
        cannot use this to discover which ids are real.

        Recorded in the support read log only once the organisation was
        actually found and served: a `404` is not a read of anybody's data, and
        logging one would put customers in the record whom the operator never
        saw.
      responses:
        '200':
          description: The organisation and its three lists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant: { $ref: '#/components/schemas/SupportTenant' }
                  connections:
                    type: array
                    items: { $ref: '#/components/schemas/SupportConnection' }
                  migrations:
                    type: array
                    items: { $ref: '#/components/schemas/SupportMigration' }
                  invoices:
                    type: array
                    items: { $ref: '#/components/schemas/SupportInvoice' }
                  members:
                    type: array
                    items: { $ref: '#/components/schemas/SupportTenantMember' }
                  usage: { $ref: '#/components/schemas/SupportTenantUsage' }
        '400':
          description: The id in the path is not a uuid.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No such organisation — or none this caller may see.

  /api/support/migrations/{mappingId}:
    parameters:
      - $ref: '#/components/parameters/MappingId'
    get:
      tags: [Support]
      summary: One migration, per domain
      description: |
        State, timings and the failure CATEGORY for each domain — never the
        failure text itself, which can carry a folder name or an address. The
        category is the actionable half (workplan 0110 T3) and the customer
        sees the same one.

        There is deliberately no level below this. A screen that lists items is
        a screen that shows subject lines, and the metadata boundary stops
        before the thing being migrated.

        The organisation recorded in the read log is the migration's own, read
        back from the view rather than taken from the request.
      responses:
        '200':
          description: The migration and one row per domain.
          content:
            application/json:
              schema:
                type: object
                properties:
                  migration: { $ref: '#/components/schemas/SupportMigration' }
                  domains:
                    type: array
                    items: { $ref: '#/components/schemas/SupportMigrationDomain' }
        '400':
          description: The id in the path is not a uuid.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No such migration — or none this caller may see.

  /api/support/retained-invoices:
    get:
      tags: [Support]
      summary: The invoices an erasure kept
      description: |
        When a tenant is erased its invoices are deliberately kept — tax
        retention outlives the customer relationship — and detached, so
        `tenant_id` becomes NULL and `billed_to_name` is stamped from the
        organisation that is about to stop existing. Every other invoice view
        filters by tenant, so before this operation those kept rows could not
        be read by anything in the product.

        The grain is the ERASURE, not the organisation, because there is no
        organisation left: rows are keyed by `tenant_ref`, the sha256 of an id
        nobody kept. So this answers "what are we obliged to keep, and what
        does each one say about itself" and cannot be walked back to a person
        — which is the question the erasure closed.

        Authorisation is the database's, as everywhere on this surface: a
        non-operator gets `200` with an empty list. Every serving is recorded
        in the support read log with no organisation named, because there is
        none to name.
      responses:
        '200':
          description: |
            Invoices retained across an erasure. Empty for anybody who is not a
            platform operator, and empty on a platform that has erased nobody.
          content:
            application/json:
              schema:
                type: object
                properties:
                  invoices:
                    type: array
                    items: { $ref: '#/components/schemas/SupportRetainedInvoice' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A tenant-scoped JWT. Local deployments sign it with `JWT_SECRET`;
        managed SSO validates against a JWKS instead.

        The token's subject must be a MEMBER of the tenant it names — an
        arbitrary subject with a valid signature is refused. Roles (`owner`,
        `admin`, `member`, `viewer`) gate the routes marked owner/admin above,
        for reads as well as writes on billing.

  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MappingId:
      name: mappingId
      in: path
      required: true
      description: The migration's id.
      schema: { type: string, format: uuid }
    DecisionId:
      name: decisionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Hash:
      name: hash
      in: path
      required: true
      description: The item's natural-key hash — stable across re-runs, which is what makes a re-run converge instead of duplicating.
      schema: { type: string }
    AccessRequestId:
      name: id
      in: path
      required: true
      description: The access request's id, from the operator queue.
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: The request was refused, with the reason.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing, invalid, or non-member token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated, but this role may not do this.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: No such resource in this tenant.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    SupportTenant:
      type: object
      description: |
        One organisation as an operator sees it (workplan 0110 T4). The column
        list IS the privacy boundary and it lives in the view, not here.
      properties:
        tenant_id: { type: string, format: uuid }
        tenant_name: { type: string }
        tenant_status: { type: string }
        joined_at: { type: string, format: date-time }
        migration_count: { type: integer }
        failing_domain_count:
          type: integer
          description: Domains currently in `failed`. How an operator knows who to call back.
        pending_decision_count:
          type: integer
          description: |
            Pending decisions across the whole organisation, INCLUDING the ones
            that belong to no migration yet — `decision.mapping_id` is nullable
            by design, because a newly discovered mailbox belongs to no
            migration. Deliberately does not add up with the per-migration
            counts; the difference is the interesting part. A COUNT and never
            the decisions: their summary and detail carry addresses.
    SupportConnection:
      type: object
      description: |
        A connection without its `config` or its `secret_ref` — what kind of
        door it is and whether it works, never what was typed into it.
      properties:
        connection_id: { type: string, format: uuid }
        role: { type: string, enum: [source, target] }
        kind: { type: string }
        display_name: { type: string }
        status: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SupportMigration:
      type: object
      properties:
        pending_decision_count:
          type: integer
          description: |
            THIS migration's pending decisions. Failing and waiting are
            opposite support conversations: a migration stopped on a decision
            is not broken, it is waiting for somebody who probably does not
            know it.
        tenant_id: { type: string, format: uuid }
        mapping_id: { type: string, format: uuid }
        name: { type: string }
        lifecycle: { type: string }
        mode: { type: string }
        pattern: { type: string }
        schedule: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SupportInvoice:
      type: object
      properties:
        invoice_id: { type: string, format: uuid }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        status: { type: string }
        total: { type: string }
        currency: { type: string }
        paid_at: { type: string, format: date-time, nullable: true }
    SupportRetainedInvoice:
      type: object
      description: |
        One invoice kept across an erasure. `tenant_ref` is a sha256 of the
        tenant id and never the id itself, so rows can be grouped by which
        erasure kept them without reconstructing a list of former customers.
        `billed_to_name` is what the invoice says about who it was for,
        captured at issue time rather than read from a tenant that no longer
        exists.
      properties:
        tenant_ref: { type: string }
        erasure_requested_at: { type: string, format: date-time }
        purged_at: { type: string, format: date-time, nullable: true }
        invoice_id: { type: string, format: uuid }
        billed_to_name: { type: string, nullable: true }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        status: { type: string }
        total: { type: string }
        currency: { type: string }
        paid_at: { type: string, format: date-time, nullable: true }
    SupportMigrationDomain:
      type: object
      description: |
        One domain of one migration. `last_error_category` and NOT
        `last_error`: the category is actionable and carries no address, no
        folder name and no subject (workplan 0110 T3).
      properties:
        domain: { type: string, enum: [email, calendar, contact, file] }
        state: { type: string }
        started_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
        last_error_category:
          type: string
          nullable: true
          # The six of `FAILURE_CATEGORIES` in @openmig/shared, asserted
          # against it in `support-routes.unit.test.ts` so this list cannot
          # drift from the values the column actually holds.
          enum: [auth_expired, rate_limited, quota_exceeded, target_refused, network, unknown]
        last_pass_metrics:
          type: object
          nullable: true
          description: Counts and durations only — never folder names or addresses.
    SupportPerson:
      type: object
      description: |
        One person, found across every organisation. Carries the organisation's
        NAME as well as its id: a result whose only context is a uuid answers
        half the question, because "who are they" is not separable from "and
        what are they on".
      properties:
        tenant_id: { type: string, format: uuid }
        tenant_name: { type: string }
        user_id:
          type: string
          description: The identity provider's subject.
        email: { type: string, format: email }
        role: { type: string, enum: [owner, admin, member, viewer] }
        status: { type: string, enum: [active, invited, suspended, removed] }
        joined_at: { type: string, format: date-time, nullable: true }
    SupportTenantMember:
      type: object
      description: |
        Who may act on an organisation: an address, a role and a state, plus
        the identity provider's subject so a screen can link to that account.
        The first support view carrying PEOPLE — every other one is metadata
        about the work, and this one is deliberately no wider than a
        membership. No name, no phone, nothing the person did.

        Removed members stay listed with their state, because "this person
        used to be the owner" is most of what a support conversation about a
        lost account is about.
      properties:
        user_id:
          type: string
          description: |
            The identity provider's subject — opaque, and useless to anybody
            who cannot already sign in to that provider. Never an Ownpace id
            and never derived from the address.
        email: { type: string, format: email }
        role: { type: string, enum: [owner, admin, member, viewer] }
        status: { type: string, enum: [active, invited, suspended, removed] }
        invited_at: { type: string, format: date-time, nullable: true }
        joined_at: { type: string, format: date-time, nullable: true }
    SupportTenantUsage:
      type: object
      description: |
        The tier this month has earned so far, with the evidence an invoice
        would quote (ADR-0014's two axes, workplan 0109 T4 surfaced). Derived
        read-only: the recorded peak and the LIVE count of slot-holding paths
        are folded together the same way the tier calculator's true-up would
        write them, so the screen and a bill drawn at the same moment agree —
        but looking at this moves no billing mark. Counts, one data total and
        two timestamps; nothing here names what is moving.
      properties:
        tier:
          type: object
          nullable: true
          description: |
            The published tier the usage lands on, or null past the table's
            end — the same deliberate "talk to us" the pricing page has.
          properties:
            id: { type: string, enum: [tiny, small, medium, large, xl] }
            name: { type: string }
            paths: { type: integer, description: The tier's simultaneous-path capacity. }
            data_gb: { type: number, description: The tier's cumulative-data ceiling, decimal GB. }
            setup: { type: number, description: One-off, EUR. }
            monthly: { type: number, description: Per month, EUR. }
        decided_by:
          type: string
          enum: [paths, data, both]
          description: Which axis forced the answer — the higher one wins.
        evidence:
          type: object
          description: |
            Exactly what an invoice would quote — "3 paths at the same time,
            100 GB moved". `peak_paths` here is the EFFECTIVE peak (recorded
            mark or live count, whichever is higher).
          properties:
            peak_paths: { type: integer }
            gb_moved: { type: number }
        recorded_peak_paths:
          type: integer
          description: The month's recorded high-water mark; 0 when nothing raised it.
        recorded_peak_at:
          type: string
          format: date-time
          nullable: true
          description: When the recorded mark was set — null when nothing raised it.
        paths_now:
          type: integer
          description: Paths holding a slot right now (`active` and `paused`).
        paths_by_state:
          type: object
          additionalProperties: { type: integer }
          description: |
            Every path row counted per lifecycle state, e.g. `{"active": 2,
            "paused": 1}` — the breakdown that answers "why is a paused
            migration still holding a slot" without naming any path.
    QualifiedDomain:
      type: object
      description: One domain's measured answer (workplan 0106 T0).
      properties:
        answer: { type: string, enum: ['yes', 'no', unknown] }
        detail: { type: string, description: The English evidence line. }
    SetupChecklist:
      type: object
      properties:
        side: { type: string, enum: [source, target] }
        provider: { type: string }
        steps:
          type: array
          items:
            type: object
            properties:
              step:
                type: object
                properties:
                  key: { type: string }
                  titleKey: { type: string }
                  detailKey: { type: string }
                  yieldsKey: { type: string }
                  needsAnotherPerson: { type: boolean }
              state: { type: string, enum: [open, done, skipped] }
              decidedBy: { type: string }
              decidedAt: { type: string, format: date-time }
        progress:
          type: object
          properties:
            total: { type: integer }
            done: { type: integer }
            skipped: { type: integer }
            open: { type: integer }
            blockedOnOthers:
              type: integer
              description: Open steps needing an administrator — why a setup is stuck.
            complete: { type: boolean }
    Error:
      type: object
      description: Every refusal has this shape. `message` is meant to be shown to a person as-is.
      properties:
        error: { type: string, examples: ['Conflict'] }
        message:
          type: string
          examples: ['Mapping is paused — review the discovery counts and start it first (POST /start).']
      required: [error, message]

    Health:
      type: object
      properties:
        status: { type: string, enum: [ok] }
        timestamp: { type: string, format: date-time }
      required: [status, timestamp]

    Version:
      type: object
      properties:
        version: { type: string, examples: ['0.1.0-rc.1'] }
        commit:
          type: string
          description: The build's commit, or `unknown` when the image was built without one.
          examples: ['63d1414c9e2f…']
      required: [version, commit]

    AuthMode:
      type: object
      properties:
        mode:
          type: string
          enum: [managed, local, dev]
          description: >
            `managed` verifies against the issuer's JWKS and nothing else;
            `local` verifies with the shared secret; `dev` has neither
            configured. Reported so an operator can see WHY the answer below is
            what it is.
          examples: ['managed']
        acceptsSeedToken:
          type: boolean
          description: >
            Whether a token signed with `JWT_SECRET` — what the seed script
            mints — will be accepted. False in managed mode, and the sign-in
            page hides the paste box on the strength of it rather than
            re-deriving the rule from a build-time value.
          examples: [false]
      required: [mode, acceptsSeedToken]

    CheckState:
      type: string
      enum: [up, down, off]
      description: |
        `off` is not a failure. A dependency nobody configured is a documented
        state, not a broken one — the self-host edition has no issuer at all,
        and a managed deployment that has not run identity setup yet is fine.

    Readiness:
      type: object
      description: |
        States, never reasons. This endpoint is unauthenticated, so a body that
        explained WHY the database was unreachable would describe internal
        topology to anybody who asked; the reason goes to the log instead.
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
          description: Only the database can make this `down` — it is the only check whose absence means nothing can be served.
        database: { $ref: '#/components/schemas/CheckState' }
        signIn: { $ref: '#/components/schemas/CheckState' }
      required: [status, database, signIn]

    Membership:
      type: object
      properties:
        tenantId: { type: string, format: uuid }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
      required: [tenantId, role]

    Me:
      type: object
      properties:
        userId:
          type: string
          description: The issuer's `sub`. Opaque, and never assumed to be an email.
        email:
          type: string
          description: From the verified `email` claim, not the database — what the issuer asserts about whoever just signed in.
        tenantId:
          type: string
          format: uuid
          description: |
            The organisation this caller is currently acting as. **ABSENT when
            that cannot be decided** — two memberships and no choice made is an
            answer, not an error, and a client resolves it by asking a person.
        role: { $ref: '#/components/schemas/Role' }
        tenants:
          type: array
          description: Every organisation this subject belongs to. Empty is normal — a new account belongs to nothing.
          items: { $ref: '#/components/schemas/Membership' }
        invitations:
          type: array
          description: |
            Open invitations addressed to this caller's VERIFIED address. Empty
            is the ordinary case — and is also what an issuer that will not
            assert `email_verified` gets, because email is not identity.
          items: { $ref: '#/components/schemas/Invitation' }
        operator:
          type: boolean
          description: |
            Whether to OFFER the access queue. The queue itself is guarded by
            database policies; being wrong here shows or hides a link and
            grants nothing.
      required: [userId, tenants, invitations, operator]

    Invitation:
      type: object
      description: An offer of membership, not a membership.
      properties:
        tenantId: { type: string, format: uuid }
        name: { type: string, description: What the organisation is called. }
        role: { $ref: '#/components/schemas/Role' }
        invitedAt: { type: string, format: date-time, nullable: true }
      required: [tenantId, name, role]

    InvitationAnswer:
      type: object
      properties:
        tenantId: { type: string, format: uuid }
        outcome: { type: string, enum: [accepted, declined] }
      required: [tenantId, outcome]

    AccessRequestCreate:
      type: object
      properties:
        email: { type: string, format: email, maxLength: 320 }
        name: { type: string, maxLength: 200 }
        organisation: { type: string, maxLength: 200 }
        note:
          type: string
          maxLength: 2000
          description: What they are moving, in their own words. Several paragraphs' worth.
        tier:
          type: string
          maxLength: 40
          description: |
            Which tier they think they need. INDICATIVE ONLY, and not validated
            against the tier list on purpose: a stale name here would refuse a
            request over a label, and the value is read by a human who knows
            what the tiers are called.
        locale:
          type: string
          enum: [en, nl]
          default: en
          description: The language they asked in, and the language every reply comes back in.
      required: [email]

    AccessRequest:
      type: object
      description: One row of the operator queue. Their own words plus what was decided.
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string, nullable: true }
        organisation: { type: string, nullable: true }
        note: { type: string, nullable: true }
        tier: { type: string, nullable: true }
        locale: { type: string, enum: [en, nl] }
        state: { type: string, enum: [open, granted, declined] }
        tenantId:
          type: string
          format: uuid
          nullable: true
          description: The organisation created by granting. Present exactly when `state` is `granted`, and the database enforces that.
        decidedBy: { type: string, nullable: true }
        decidedAt: { type: string, format: date-time, nullable: true }
        decisionNote:
          type: string
          nullable: true
          description: |
            **Written for the operator, not for the asker.** It is never sent to
            them: the decline email's event type carries no fields at all, so
            there is nothing for this to travel in.
        createdAt: { type: string, format: date-time }
      required: [id, email, locale, state, createdAt]

    GrantDecision:
      type: object
      properties:
        note: { type: string, maxLength: 2000, description: See `decisionNote` — not shown to the asker. }
        organisationName:
          type: string
          maxLength: 200
          description: What the organisation will be called. Defaults to what they told us, which is usually right and occasionally a typo worth fixing before it becomes a customer's name.

    DeclineDecision:
      type: object
      properties:
        note: { type: string, maxLength: 2000, description: See `decisionNote` — not shown to the asker. }
        notify:
          type: boolean
          default: true
          description: |
            Email them. Defaults to `true` so silence is deliberate rather than
            forgotten. Set `false` for junk — this form is public, so a made-up
            address belongs to a stranger who never wrote to us.

    NotifiedOutcome:
      type: string
      enum: [sent, off, failed, skipped]
      description: |
        What became of the courtesy email — four states rather than a boolean,
        because each asks something different of the operator.

        `sent` needs nothing. `off` means no mail is configured, so nobody was
        told and nobody will be. `failed` means the mail server refused, which
        is also manual but a different conversation — something is broken
        rather than absent. `skipped` means the operator asked for no email;
        collapsing it into `off` would tell them to go and contact somebody
        they deliberately ignored.

        Granting never answers `skipped`: an unannounced grant is one the
        person can never use.

    GrantResult:
      type: object
      properties:
        tenantId: { type: string, format: uuid }
        name: { type: string, description: What the organisation is called. }
        email: { type: string, format: email, description: The address the invitation and the email were addressed to. }
        notified:
          allOf:
            - $ref: '#/components/schemas/NotifiedOutcome'
          description: Never `skipped` here.
      required: [tenantId, name, email, notified]

    DeclineResult:
      type: object
      properties:
        declined: { type: boolean, enum: [true] }
        id: { type: string, format: uuid }
        notified: { $ref: '#/components/schemas/NotifiedOutcome' }
      required: [declined, id, notified]

    Role:
      type: string
      enum: [owner, admin, member, viewer]

    Domain:
      type: string
      description: The four data domains this product carries.
      enum: [email, calendar, contact, file]

    MappingStatus:
      type: string
      description: |
        `paused` is a migration awaiting its owner's green light; `done` has
        been finished and is no longer watched.
      enum: [active, paused, cutover, done]

    Mapping:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        name: { type: string }
        sourceType: { type: string, examples: ['imap'] }
        targetType: { type: string, examples: ['jmap'] }
        status: { $ref: '#/components/schemas/MappingStatus' }
        mode: { type: string, enum: [mirror, bidirectional, one_time, asymmetric] }
        pattern:
          type: [string, 'null']
          enum: [shared_s, distribution_d, null]
          description: Set when this migration carries a shared address rather than a user mailbox.
        domains:
          type: array
          items: { $ref: '#/components/schemas/Domain' }
        lastSyncAt:
          type: [string, 'null']
          format: date-time
          description: The newest domain completion. Absent means no domain has ever completed.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, tenantId, name, status, domains]

    EnqueuedRun:
      type: object
      description: What an enqueue answers with. The work has not happened yet.
      properties:
        success: { type: boolean }
        runId: { type: string }
        jobType: { type: string, examples: ['run-delta-sync'] }
        triggeredAt: { type: string, format: date-time }
      required: [success, runId]

    Run:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, running, succeeded, failed, cancelled] }
        kind: { type: string, examples: ['incremental'] }
        trigger: { type: string, enum: [manual, schedule] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        itemsProcessed: { type: integer }
        errors: { type: integer }
        events:
          type: array
          description: The per-domain lines of this pass, including the domains that did not run and why.
          items: { type: object }
      required: [id, status, startedAt]

    DeletionReceipt:
      type: object
      description: |
        `refused` is terminal and legitimate — a gate said no and said why. It
        is not an error state.
      properties:
        state: { type: string, enum: [queued, running, applied, refused, failed] }
        kind: { type: string, examples: ['deleted'] }
        requestedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        reason:
          type: [string, 'null']
          description: Present on `refused`/`failed`, verbatim.
      required: [state, requestedAt]

    VerificationRunReport:
      type: object
      properties:
        state: { type: string, enum: [running, done, failed] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        error: { type: [string, 'null'] }
        report:
          type: [object, 'null']
          description: |
            Keyed by mapping id; each carries a per-domain
            `DomainVerification`, an `overallStatus`, `recommendations`, and
            `canProceedToCutover`.
          additionalProperties: { type: object }
      required: [state, startedAt]

    DomainVerification:
      type: object
      description: |
        One domain's comparison. `SKIPPED` means the domain was not checked and
        says so — it is never counted as a pass.
      properties:
        dataType: { $ref: '#/components/schemas/Domain' }
        status: { type: string, enum: [PASS, FAIL, WARN, SKIPPED] }
        sourceCount: { type: integer }
        targetCount: { type: integer }
        matchedCount: { type: integer }
        missingOnTarget: { type: integer }
        extraOnTarget: { type: integer }
        checksumMatches: { type: integer }
        checksumMismatches: { type: integer }
        checksumSampleSize: { type: integer }
        checksumUnavailable: { type: integer }
        totalBytesSource: { type: integer }
        totalBytesTarget: { type: [integer, 'null'] }
        issues:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              severity: { type: string, enum: [INFO, WARNING, ERROR] }
              message: { type: string }

    Usage:
      type: object
      properties:
        tenantId: { type: string, format: uuid }
        period: { type: string, examples: ['2026-08'] }
        storageUsedGB: { type: number }
        egressGB: { type: number }
        computeHours:
          type: number
          description: Time the passes actually took, summed from their own start and finish stamps.
        syncCount: { type: integer }
        lastUpdated: { type: string, format: date-time }

    Cost:
      type: object
      description: Integer cents throughout — no float reaches an invoice.
      properties:
        baseFee: { type: integer }
        storage: { type: integer }
        egress: { type: integer }
        compute: { type: integer }
        subtotal: { type: integer }
        taxRate: { type: number, examples: [0.21] }
        tax: { type: integer }
        total: { type: integer }
      required: [baseFee, subtotal, taxRate, tax, total]

    BillingParty:
      type: object
      description: |
        Who invoices are addressed to (workplan 0111 T1). Consumer-shaped
        first: `kind` defaults to `consumer` and only a `business` may carry a
        `vatNumber` — the database enforces that, not just validation. The VAT
        number is as stated, not verified; the country is the customer's
        statement, not the place-of-supply decision.
      properties:
        tenantId: { type: string, format: uuid }
        kind: { type: string, enum: [consumer, business] }
        name:
          type: string
          description: A person's full name or a legal entity's registered name — never the workspace label.
        addressLine1: { type: string }
        addressLine2: { type: [string, 'null'] }
        postalCode: { type: string }
        city: { type: string }
        countryCode: { type: string, description: 'ISO 3166-1 alpha-2, uppercase.', examples: [NL] }
        vatNumber: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [tenantId, kind, name, addressLine1, postalCode, city, countryCode]

    VatConsultation:
      type: object
      description: |
        One VIES consultation, append-only (workplan 0111 T2). A row is
        always an ANSWER — valid or invalid — never a failed attempt.
        `countryCode` is the member state as VIES speaks it (EL not GR; XI
        exists, GB does not) and `vatNumber` is what was actually asked,
        prefix stripped. `consultationNumber` null marks an unqualified
        check, which proves less and says so.
      properties:
        id: { type: string, format: uuid }
        countryCode: { type: string, examples: [NL] }
        vatNumber: { type: string, examples: ['123456789B01'] }
        valid: { type: boolean }
        requestDate:
          type: [string, 'null']
          description: VIES's own stamp, verbatim — never reformatted.
        consultationNumber: { type: [string, 'null'] }
        traderName: { type: [string, 'null'] }
        traderAddress: { type: [string, 'null'] }
        checkedAt: { type: string, format: date-time }
      required: [id, countryCode, vatNumber, valid, checkedAt]

    VatTreatment:
      type: object
      description: |
        The VAT decision for one buyer (workplan 0111 T3): a treatment, never
        a percentage — what a rate IS belongs to the bookkeeping system's own
        tax tables. `rationale` is one English sentence saying why; the page
        renders its own localized wording per treatment.
      properties:
        treatment:
          type: string
          enum: [domestic_standard, reverse_charge, destination_oss, outside_eu]
        rationale: { type: string }
      required: [treatment, rationale]

    CreateMappingRequest:
      type: object
      description: |
        The source and target this migration carries. Credentials are encrypted
        at rest and masked on every read-back; the API never returns a stored
        secret.
      properties:
        name: { type: string }
        sourceConfig:
          type: object
          description: |
            `username` is required. Which flow applies is decided by which
            fields are present, not by a type flag: `password` for a source
            that signs in directly; `tenantId` + `clientId` + `clientSecret`
            for the customer's own Entra app registration.
          properties:
            type: { type: string, examples: ['imap-oauth2'] }
            host: { type: string }
            port: { type: integer }
            useSsl: { type: boolean }
            tlsVerify:
              type: boolean
              description: |
                Defaults to true. Set false only for a lab server with a
                self-signed certificate — a rejection against a real mail
                server is a finding, not something to switch off.
            username: { type: string }
            password: { type: string, writeOnly: true }
            tenantId: { type: string }
            clientId: { type: string }
            clientSecret: { type: string, writeOnly: true }
          required: [username]
        targetConfig:
          type: object
          properties:
            type: { type: string, examples: ['jmap'] }
            host: { type: string }
            port: { type: integer }
            baseUrl: { type: string }
            username: { type: string }
            password: { type: string, writeOnly: true }
            url:
              type: string
              description: |
                DAV targets only (workplan 0105 T1): the full DAV base URL,
                for a provider whose DAV root is not at the host root. When
                present it wins over host+port.
          required: [username, password]
        domains:
          type: array
          items: { $ref: '#/components/schemas/Domain' }
        schedule:
          type: string
          description: Five-field cron. An unparseable value is refused at create, not silently replaced by a default.
          examples: ['*/15 * * * *']
      required: [sourceConfig, targetConfig]
